  /* ============================================================
     日历视图
     ============================================================ */
  function monthMedPanel(y, m) {
    const meds = Array.isArray(state.meds) ? state.meds : [];
    if (!meds.length) return '<div class="empty-box">还没有用药记录。</div>';
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const rows = meds.map(med => {
      let scheduled = 0, taken = 0, prn = 0;
      const slots = medDoseSlots(med);
      for (let day = 1; day <= days; day++) {
        const ds = fmt(new Date(y, m, day));
        if (ds > now) break;
        if (isPrn(med)) {
          prn += prnKeys(ds, med.id).length;
          continue;
        }
        if (!medActiveOn(med, ds)) continue;
        slots.forEach(slot => {
          scheduled++;
          if (doseAt(ds, med.id, slot)) taken++;
        });
      }
      const rate = scheduled ? Math.round(taken / scheduled * 100) : 0;
      const paused = med.status !== 'active';
      const status = paused ? '已暂停' : (scheduled ? '' : '暂无排期');
      const count = isPrn(med)
        ? '按需 · ' + prn + ' 次'
        : (scheduled ? taken + ' / ' + scheduled + ' 次' : '—');
      return '<div class="mh med-mh">' +
        '<span class="habit-icon sm" style="--hc:#6f7f91">💊</span>' +
        '<div class="mh-main">' +
          '<div class="mh-top"><b>' + esc(med.name) + '</b><span>' + esc(count) + '</span></div>' +
          '<div class="mh-bar"><i style="width:' + (isPrn(med) ? 0 : rate) + '%"></i></div>' +
          '<small class="mh-extra">' + esc(medCourseLabel(med)) +
            (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
            (status ? ' · ' + esc(status) : '') +
          '</small>' +
        '</div>' +
      '</div>';
    }).filter(Boolean).join('');
    return rows || '<div class="empty-box">本月还没有用药数据。</div>';
  }

  /* 本月习惯的统计口径：只算「已经过去且当天有记录」的日子，
     未到的日期和空白日不进分母，否则月初数字永远很难看。
     日历页（本月小结）和统计页（本月习惯）共用这一份计算。 */
  /* 戒烟分析面板。只对 quit 习惯出现，没有戒烟习惯就完全不渲染。
     时段分布只数「抽了」——「想抽但忍住」的那个时段其实不是危险时段，
     混进去会把真正容易破防的点位稀释掉。 */
  function quitPanelBody(range) {
    const h = (state.habits || []).find(function (x) {
      return x && !x.archivedAt && isSmoke(x);
    });
    if (!h) return '';
    const streak = quitStreak(h), total = quitTotal(h), best = quitBest(h);
    const q = quitRange(h, range);
    const bins = craveHours(h.id);
    let max = 0;
    bins.forEach(function (n) { if (n > max) max = n; });
    const bars = bins.map(function (n, i) {
      if (!n) return '<i class="qh-bar zero" title="' + pad2(i) + ':00 · 0 次"></i>';
      const hp = max ? Math.max(4, Math.round(n / max * 100)) : 4;
      return '<i class="qh-bar' + (n === max ? ' on' : '') +
        '" style="height:' + hp + '%" title="' + pad2(i) + ':00 · ' + n + ' 次"></i>';
    }).join('');
    const peak = max ? bins.indexOf(max) : -1;
    const smokeN = q.smoke;
    /* 样本太少时「最容易破防」只是噪声——3 条记录里 1 条也能当峰值 */
    const peakText = peak < 0
      ? '还没有「抽了」的记录，时段图还看不出规律'
      : (smokeN < 5
          ? '记录还少（' + smokeN + ' 次），多记几次才看得出规律'
          : '最容易破防：<b>' + pad2(peak) + ':00–' + pad2((peak + 1) % 24) + ':00</b>');
    const trig = craveTriggers(h.id).slice(0, 3);
    const saved = quitSaved(h);
    /* 勋章墙：达成的点亮，没达成的写还差多少——「还差 3 天」比一个灰点更有推动力 */
    const miles = QUIT_MILESTONES.map(function (m) {
      const on = streak >= m;
      return '<div class="qmile-i' + (on ? ' on' : ' dim') + '">' +
        '<b>' + (QUIT_MILE_CN[m] || (m + ' 天')) + '</b>' +
        '<span>' + (on ? '已达成' : '还差 ' + (m - streak) + ' 天') + '</span></div>';
    }).join('');
    return '<div class="sblock">' +
      '<div class="sblock-head"><b>戒烟分析</b><span class="muted-sm">（累计 · 勋章与时段图）</span></div>' +
      '<div class="cal-summary" style="margin:0">' +
        '<span>连续无烟 <b>' + streak + '</b> 天</span>' +
        '<span>累计 <b>' + total + '</b> 天</span>' +
        '<span>最长 <b>' + best + '</b> 天</span>' +
        '<span>抵御率 <b>' + (q.total ? Math.round(q.rate * 100) + '%' : '—') + '</b></span>' +
        (saved ? '<span>省了 <b>¥' + Math.round(saved.money) + '</b></span>' : '') +
      '</div>' +
      '<div class="qmile">' + miles + '</div>' +
      '<div class="qh-wrap"><div class="qh-bars">' + bars + '</div>' +
        '<div class="qh-axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>' +
      '</div>' +
      '<div class="crave-meta" style="margin:10px 0 0">' +
        '<span>' + peakText + '</span>' +
        '<span>近 ' + range + ' 天 抽 <b>' + q.smoke + '</b> · 忍 <b>' + q.resist + '</b></span>' +
      '</div>' +
      (trig.length
        ? '<div class="crave-meta" style="margin:6px 0 0">' +
            '<span class="crave-none">失守诱因</span>' +
            trig.map(function (t) { return '<span>' + esc(t.label) + ' <b>' + t.n + '</b></span>'; }).join('') +
          '</div>'
        : '') +
    '</div>';
  }

  function monthHabitsInfo(y, m) {
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    let rec = 0, best = 0, run = 0;

    for (let day = 1; day <= days; day++) {
      const ds = fmt(new Date(y, m, day));
      if (ds > now) break;
      if (hasRecords(ds)) rec++;
      if (dayQualified(ds)) {
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    }

    const rows = state.habits.filter(h => !h.optional && !isArchived(h)).map(h => {
      let hit = 0, total = 0, lapse = 0;
      const isQuit = isQuitLike(h);
      for (let day = 1; day <= days; day++) {
        const ds = fmt(new Date(y, m, day));
        if (ds > now) continue;
        /* 戒烟的有无记录看事件流，不看 checks——事件不写进 checks */
        const dayEv = isQuit ? dayCravings(h.id, ds) : null;
        if (isQuit ? !dayEv.length : !hasRecords(ds)) continue;
        total++;
        if (isQuit) {
          if (dayEv.some(function (e) { return e.k === 's'; })) lapse++;
          else hit++;
        } else if (met(h, ds)) {
          hit++;
        }
      }
      return { h: h, hit: hit, total: total, lapse: lapse, rate: total ? hit / total : 0 };
    });

    let bestRow = null, weakRow = null;
    rows.forEach(r => {
      if (!r.total) return;
      if (!bestRow || r.rate > bestRow.rate) bestRow = r;
      if (!weakRow || r.rate < weakRow.rate) weakRow = r;
    });

    return { rec: rec, best: best, rows: rows, bestRow: bestRow, weakRow: weakRow };
  }

  /* 本月习惯的逐条进度：统计页用 */
  function monthHabitRowsHtml(y, m) {
    const rows = monthHabitsInfo(y, m).rows;
    const html = rows.map(r => {
      const pct = Math.round(r.rate * 100);
      const num = isQuitLike(r.h)
        ? '保持 ' + r.hit + ' / ' + r.total + ' 天'
        : '达标 ' + r.hit + ' / ' + r.total + ' 天';
      return '<div class="mh" style="--hc:' + esc(r.h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(r.h.color || '#2f6f5e') + '">' + esc(r.h.icon || '✅') + '</span>' +
        '<div class="mh-main">' +
          '<div class="mh-top"><b>' + esc(r.h.name) + '</b><span>' + num + '</span></div>' +
          '<div class="mh-bar"><i style="width:' + pct + '%"></i></div>' +
          (isQuitLike(r.h) && r.lapse
            ? '<small class="mh-extra">' + (isSmoke(r.h) ? '点了 ' : '破戒 ') + r.lapse + ' 次</small>'
            : '') +
        '</div>' +
      '</div>';
    }).join('');
    return html || '<div class="empty-box">本月还没有习惯数据。</div>';
  }

  /* 日历页底部的三卡：小结 / 心情 / 体重 */
  function monthOverview(y, m) {
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const info = monthHabitsInfo(y, m);
    const rec = info.rec, best = info.best;
    const bestRow = info.bestRow, weakRow = info.weakRow;

    const statLine = rec
      ? (bestRow ? '最稳：<b>' + esc(bestRow.h.name) + '</b>（' + Math.round(bestRow.rate * 100) + '%）' : '')
      : '本月还没有记录，点日历里的任意一天可以补记。';

    const moodCounts = { sad: 0, ok: 0, happy: 0 };
    let moodDays = 0;
    for (let day = 1; day <= days; day++) {
      const ds = fmt(new Date(y, m, day));
      if (ds > now) break;
      const mv = state.moods && state.moods[ds];
      if (mv && Object.prototype.hasOwnProperty.call(moodCounts, mv)) {
        moodCounts[mv]++;
        moodDays++;
      }
    }
    const moodMax = Math.max(1, moodCounts.sad, moodCounts.ok, moodCounts.happy);
    const moodRows = MOODS.map(m => {
      const n = moodCounts[m.key];
      return '<div class="mstat ' + m.key + '">' +
        '<div class="mstat-top"><span>' + m.emoji + ' ' + m.label + '</span><b>' + n + ' 天</b></div>' +
        '<div class="mstat-bar"><i style="width:' + Math.round(n / moodMax * 100) + '%"></i></div>' +
      '</div>';
    }).join('');

    return '' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月小结</h3>' +
        '<div class="cal-highlight"><b>' + best + '</b><span>天最长连续达标</span></div>' +
        '<p class="cal-note">' + statLine +
          (rec && weakRow && weakRow !== bestRow ? '<br>待加强：<b>' + esc(weakRow.h.name) + '</b>（' + Math.round(weakRow.rate * 100) + '%）' : '') +
        '</p>' +
        '<div class="cal-hint">达标 = 当天完成率 ≥ 75%；连续达标按天累计。</div>' +
      '</section>' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月心情</h3>' +
        '<div class="mstat-list">' + moodRows + '</div>' +
        '<div class="cal-hint">' + (moodDays ? '本月记录 ' + moodDays + ' 天心情' : '本月还没有心情记录，去今日页选一个。') + '</div>' +
      '</section>' +
      monthWeightSide(y, m);
  }

  function monthWeightSide(y, m) {
    const prefix = y + '-' + pad2(m + 1);
    const list = weightRecords().filter(w => String(w.date).indexOf(prefix) === 0 && w.date <= todayStr());
    if (!list.length) {
      return '<section class="panel cal-side-panel">' +
        '<h3>本月体重</h3>' +
        '<div class="empty-box">本月还没有体重记录。</div>' +
        '<div class="cal-hint">去「体重」页记录一次，这里会显示变化。</div>' +
      '</section>';
    }
    const latest = list[list.length - 1];
    const first = list[0];
    const info = bmiCategory(latest.bmi);
    const diff = Math.round((latest.weight - first.weight) * 10) / 10;
    const delta = diff === 0 ? '持平' : (diff > 0 ? '+' : '') + diff + ' kg';
    return '<section class="panel cal-side-panel">' +
      '<h3>本月体重</h3>' +
      '<div class="cal-highlight weight-month"><b>' + esc(latest.weight) + '</b><span>kg · BMI ' + esc(latest.bmi) + ' ' + esc(info.label) + '</span></div>' +
      '<p class="cal-note">记录 ' + list.length + ' 次 · 较本月首次 ' + delta + '</p>' +
      '<div class="cal-hint">最近一次 ' + esc(latest.date) + (latest.age < 18 ? ' · 未成年 BMI 仅参考' : '') + '</div>' +
    '</section>';
  }

  /* 某一天到期的待办（月视图格子用）。
     口径与「今日待办」不同：这里只要 due 正好是这一天，不看是否已逾期。
     排序按「优先级 → 开始时间」，让格子里优先露出最要紧的两条。 */
  function dayTasks(ds) {
    const rank = { '高': 0, '中': 1, '低': 2 };
    const list = liveTasks().filter(t =>
      t.due === ds && t.status !== 'done' && t.status !== 'cancelled');
    list.sort((a, b) => {
      const ra = rank[a.priority] === undefined ? 1 : rank[a.priority];
      const rb = rank[b.priority] === undefined ? 1 : rank[b.priority];
      if (ra !== rb) return ra - rb;
      return String(a.startTime || '99:99').localeCompare(String(b.startTime || '99:99'));
    });
    return list;
  }

  /* 格子里只放得下很短一行，超长的截断 */
  function calTaskTitle(v) {
    const txt = String(v || '').trim();
    return txt.length > 8 ? txt.slice(0, 8) + '…' : txt;
  }

  /* ============ 周视图 ============
     0:00–24:00 的时间线。同一时刻的同类条目合并成一块（不然 08:00 十一个药
     会挤成十一条线），点开看清单。数据全部是现算的，没有新增存储。 */

  const WK_HOUR_H = 44;        /* 每小时 44px，24 小时共 1056px */

  /* 那一周的周一（周日 getDay()=0，要往前回 6 天） */
  function weekStartOf(d) {
    const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return addDays(base, -((base.getDay() + 6) % 7));
  }

  function hhmmMin(v) {
    const s = String(v || '');
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(s)) return -1;
    return Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  }

  /* 某条待办是否「命中」这一天。单次看 due，重复按规则展开
     ——周视图要能看到「每周一的例会」，否则未来几周全是空的。
     规则与 nextRepeatDate 保持一致（weekly 用 0-6，monthly 取当月最后一天兜底）。 */
  function taskHitsDay(t, ds) {
    if (!t || t.archivedAt || t.status === 'done' || t.status === 'cancelled') return false;
    const repeat = ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none';
    if (repeat === 'none') return t.due === ds;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.due || ''))) return false;
    if (ds < t.due) return false;
    const d = parseD(ds);
    if (repeat === 'daily') return true;
    if (repeat === 'weekly') {
      return d.getDay() === clamp(Number(t.repeatWeekday) || 0, 0, 6);
    }
    const md = clamp(Number(t.repeatDay) || 1, 1, 31);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(md, last);
  }

  /* 一天里的所有安排：blocks 是有时间的，allday 是没时间的待办 */
  function weekDayBlocks(ds) {
    const blocks = [];
    const allday = [];

    /* 待办：填了开始时间才画时间块，否则进「全天」行 */
    (state.tasks || []).forEach(t => {
      if (!taskHitsDay(t, ds)) return;
      const st = String(t.startTime || '');
      const title = String(t.title || '待办');
      if (hhmmMin(st) < 0) {
        allday.push({ kind: 'task', title: title, items: [t] });
        return;
      }
      const dur = (Number(t.duration) >= 15 && Number(t.duration) <= 720) ? Number(t.duration) : 30;
      blocks.push({ startMin: hhmmMin(st), durMin: dur, kind: 'task', title: title, done: false });
    });

    /* 用药：每个服药时刻 15 分钟（和日历订阅的约定一致） */
    medScheduledFor(ds).forEach(it => {
      blocks.push({
        startMin: hhmmMin(it.slot), durMin: 15, kind: 'med',
        title: String(it.med.name || '药'), done: !!doseAt(ds, it.med.id, it.slot)
      });
    });

    /* 习惯：跳过用药占位卡；按通知频率决定这天要不要出现 */
    activeHabits(ds).forEach(h => {
      if (h.med) return;
      const st = String(h.suggestTime || '');
      if (hhmmMin(st) < 0) return;
      const freq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
      const d = parseD(ds);
      if (freq === 'weekly' && d.getDay() !== clamp(Number(h.notifyWeekday) || 1, 0, 6)) return;
      if (freq === 'monthly') {
        const md = clamp(Number(h.notifyMonthday) || 1, 1, 31);
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        if (d.getDate() !== Math.min(md, last)) return;
      }
      blocks.push({
        startMin: hhmmMin(st), durMin: 30, kind: 'habit',
        title: String(h.name || '习惯'), done: countOf(ds, h.id) > 0
      });
    });

    /* 同一时刻 + 同一类型合并成一块：08:00 十一个药 → 「用药 ×11」 */
    const merged = {};
    blocks.forEach(b => {
      const key = b.startMin + '|' + b.kind;
      if (!merged[key]) {
        merged[key] = { startMin: b.startMin, durMin: b.durMin, kind: b.kind,
                        titles: [], count: 0, finished: 0 };
      }
      merged[key].titles.push(b.title);
      merged[key].count++;
      if (b.done) merged[key].finished++;
      if (b.durMin > merged[key].durMin) merged[key].durMin = b.durMin;
    });

    const list = Object.keys(merged).map(k => merged[k])
      .sort((a, b) => a.startMin - b.startMin || a.kind.localeCompare(b.kind));

    /* 碰撞就往下挪：块是绝对定位的，两个同起点的块叠在一起会互相遮住 */
    const placed = [];
    list.forEach(b => {
      let top = (b.startMin / 60) * WK_HOUR_H;
      const h = Math.max(18, (b.durMin / 60) * WK_HOUR_H);
      let guard = 0;
      while (guard < 60) {
        const hit = placed.find(p => top < p.bottom && top + h > p.top);
        if (!hit) break;
        top = hit.bottom + 1;
        guard++;
      }
      placed.push({ top: top, bottom: top + h });
      b.top = Math.round(top);
      b.height = Math.round(h);
    });

    return { blocks: list, allday: allday };
  }

  const WK_KIND_CN = { med: '用药', task: '待办', habit: '习惯' };

  function calTabsHtml() {
    return '<div class="cal-tabs">' +
      '<button class="cal-tab' + (calMode === 'month' ? ' active' : '') + '" data-act="cal-mode" data-mode="month">月</button>' +
      '<button class="cal-tab' + (calMode === 'week' ? ' active' : '') + '" data-act="cal-mode" data-mode="week">周</button>' +
    '</div>';
  }

  /* ===== 倒数日（v76）=====
     只存一个日期，未来还是过去由「今天」决定 —— 存成状态的话，明天就对不上了。 */
  function cdDiff(date) {
    const d = parseD(date);
    if (!d || isNaN(d.getTime())) return 0;
    return Math.round((d.getTime() - parseD(todayStr()).getTime()) / 86400000);
  }
  function cdSub(n) {
    if (n > 0) return '还剩 ' + n + ' 天';
    if (n === 0) return '就是今天';
    return '已过去 ' + (-n) + ' 天';
  }
  function cdDateCn(date) {
    const d = parseD(date);
    if (!d || isNaN(d.getTime())) return date;
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日' +
      (d.getFullYear() !== new Date().getFullYear() ? ' · ' + d.getFullYear() : '');
  }
  /* 已过去的那组默认只露 3 条，其余折起来——用一年会攒成一长条 */
  let cdPastOpen = false;

  function countdownRow(x) {
    const c = x.c;
    const neg = x.n < 0;
    const today = x.n === 0;
    return '<div class="cd-item' + (neg ? ' past' : '') + (today ? ' today' : '') +
        (c.on ? '' : ' off') + '">' +
      '<div class="cd-num">' + (today
        ? '<b>今天</b>'
        : '<b>' + Math.abs(x.n) + '</b><i>' + (neg ? '天前' : '天') + '</i>') + '</div>' +
      '<div class="cd-main">' +
        '<b>' + esc(c.title) + '</b>' +
        '<small>' + esc(cdDateCn(c.date)) + '</small>' +
        (c.note ? '<em>' + esc(c.note) + '</em>' : '') +
      '</div>' +
      '<div class="cd-acts">' +
        '<button type="button" class="icon-btn" data-act="cd-toggle" data-id="' + c.id +
          '" title="' + (c.on ? '暂停提醒' : '开启提醒') + '">' + (c.on ? '⏸' : '▶') + '</button>' +
        '<button type="button" class="icon-btn" data-act="cd-edit" data-id="' + c.id +
          '" title="编辑">✎</button>' +
        '<button type="button" class="icon-btn" data-act="cd-del" data-id="' + c.id +
          '" title="删除">🗑</button>' +
      '</div>' +
    '</div>';
  }

  function countdownPanelHtml() {
    const head = '<h3>倒数日 <button class="btn sm" data-act="cd-new">＋ 新增</button></h3>';
    const list = Array.isArray(state.countdowns) ? state.countdowns : [];
    if (!list.length) {
      return '<div class="panel cd-panel">' + head +
        '<div class="cd-empty">还没有倒数日。<br>设一个日子，它替你数着。</div>' +
      '</div>';
    }
    const items = list.map(function (c) { return { c: c, n: cdDiff(c.date) }; });
    const future = items.filter(function (x) { return x.n >= 0; })
      .sort(function (a, b) { return a.n - b.n; });
    const past = items.filter(function (x) { return x.n < 0; })
      .sort(function (a, b) { return b.n - a.n; });
    const shown = cdPastOpen ? past : past.slice(0, 3);
    let html = future.map(countdownRow).join('');
    if (past.length) {
      html += '<div class="cd-group">已过去 · ' + past.length + ' 个</div>' +
        shown.map(countdownRow).join('');
      if (past.length > 3) {
        html += '<button type="button" class="cd-more" data-act="cd-past-more">' +
          (cdPastOpen ? '收起' : '展开全部 ' + past.length + ' 个') + '</button>';
      }
    }
    return '<div class="panel cd-panel">' + head + '<div class="cd-list">' + html + '</div></div>';
  }

  /* 提醒档位：0 就是当天。默认「当天 + 提前 3 天 + 提前 1 天」，够用又不吵。 */
  const CD_REMIND = [0, 1, 3, 7, 30];

  function countdownModal(c) {
    const isNew = !c;
    const cur = c || {
      title: '', date: fmt(new Date(Date.now() + 30 * 86400000)),
      note: '', time: '09:00', remindDays: [3, 1, 0], on: true
    };
    const chips = CD_REMIND.map(function (d) {
      const on = (cur.remindDays || []).indexOf(d) >= 0;
      return '<button type="button" class="cd-rd' + (on ? ' on' : '') + '" data-act="cd-rd"' +
        ' data-d="' + d + '">' + (d === 0 ? '当天' : '提前 ' + d + ' 天') + '</button>';
    }).join('');
    openModal('<form class="modal-card" id="cd-form" data-id="' + esc(isNew ? '' : c.id) + '">' +
      '<h3>' + (isNew ? '新增倒数日' : '编辑倒数日') + '</h3>' +
      '<label class="field"><span>名字</span>' +
        '<input type="text" name="title" maxlength="40" value="' + esc(cur.title) + '" placeholder="比如：考研、爸爸生日"></label>' +
      '<label class="field"><span>那一天</span>' +
        '<input type="date" name="date" value="' + esc(cur.date) + '"></label>' +
      '<label class="field"><span>备注（会跟着通知一起发出去，可不填）</span>' +
        '<textarea name="note" rows="2" maxlength="200" placeholder="比如：记得带准考证">' + esc(cur.note) + '</textarea></label>' +
      '<div class="cd-remind">' +
        '<span class="cd-remind-label">提前提醒</span>' +
        '<div class="cd-rd-wrap">' + chips + '</div>' +
      '</div>' +
      '<div class="cd-time"><label class="field"><span>每次提醒的时刻</span>' +
        '<input type="time" name="time" value="' + esc(cur.time) + '"></label></div>' +
      '<p class="hint">只对未来提醒；日子过去之后它照常显示「已过去 N 天」，但不再发通知。' +
        '同一天别安排太多提醒——企业微信同一分钟超过 20 条会静默丢弃。</p>' +
      '<div class="modal-actions"><span class="spacer"></span>' +
        '<button type="button" class="btn ghost" data-act="close-modal">取消</button>' +
        '<button type="submit" class="btn primary">保存</button></div>' +
    '</form>');
  }

  function saveCountdownForm(form) {
    const get = function (n) {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? String(el.value || '') : '';
    };
    const title = get('title').trim();
    const date = get('date');
    const time = get('time');
    if (!title) { toast('给它起个名字'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('请选一个日期'); return; }
    if (!/^\d{2}:\d{2}$/.test(time)) { toast('请填提醒时刻'); return; }
    const remindDays = [].slice.call(form.querySelectorAll('.cd-rd.on'))
      .map(function (b) { return Number(b.dataset.d) || 0; });
    const id = form.dataset.id || '';
    const payload = {
      title: title, date: date, note: get('note').trim(),
      time: time, remindDays: remindDays, on: true
    };
    if (!Array.isArray(state.countdowns)) state.countdowns = [];
    if (id) {
      const c = state.countdowns.find(function (x) { return x.id === id; });
      if (c) Object.assign(c, payload);
    } else {
      state.countdowns.push(Object.assign({ id: uid() }, payload));
    }
    state.countdowns = normalizeCountdowns(state.countdowns);
    save();
    render();
    closeModal();
    toast(id ? '已保存' : '记下了 · ' + cdSub(cdDiff(date)));
  }

  function viewWeek() {
    const ws = weekStartOf(calWeek);
    const today = todayStr();
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const days = [];
    let taskCount = 0, medCount = 0;

    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const ds = fmt(d);
      const data = weekDayBlocks(ds);
      data.blocks.forEach(b => {
        if (b.kind === 'task') taskCount += b.count;
        if (b.kind === 'med') medCount += b.count;
      });
      taskCount += data.allday.length;
      days.push({ date: ds, d: d, data: data });
    }

    const we = addDays(ws, 6);
    /* 同一个月就只写一次月份，手机上才不会折成两行 */
    const rangeText = (ws.getMonth() === we.getMonth())
      ? (ws.getMonth() + 1) + '月' + ws.getDate() + '–' + we.getDate() + '日'
      : (ws.getMonth() + 1) + '月' + ws.getDate() + '日 – '
        + (we.getMonth() + 1) + '月' + we.getDate() + '日';

    /* 顶部日期条 */
    let head = '<div class="wk-gutter wk-gutter-head"></div>';
    days.forEach(day => {
      const isToday = day.date === today;
      const isFuture = day.date > today;
      head += '<div class="wk-day' + (isToday ? ' is-today' : '') + (isFuture ? ' is-future' : '') + '">' +
        '<span class="wk-wd">周' + WEEK_CN[day.d.getDay()] + '</span>' +
        '<b class="wk-num">' + day.d.getDate() + '</b>' +
      '</div>';
    });

    /* 全天行 */
    let allday = '<div class="wk-gutter wk-gutter-ad">全天</div>';
    days.forEach(day => {
      const list = day.data.allday;
      const shown = list.slice(0, 2);
      const rest = list.length - shown.length;
      const db = dayDebts(day.date);
      allday += '<div class="wk-ad-cell">' +
        db.map(d => '<span class="wk-ad-debt" title="还款 · ' + esc(d.name) +
          ' · 剩 ¥' + moneyFmt(d.balance) + '">💳 ' +
          esc(String(d.name).slice(0, 5)) + '</span>').join('') +
        shown.map(t => '<button class="wk-ad-item" data-act="wk-open" data-date="' + day.date +
          '" data-kind="task" data-start="-1" title="' + esc(t.title) + '">' + esc(t.title) + '</button>').join('') +
        (rest > 0 ? '<span class="wk-ad-more">+' + rest + '</span>' : '') +
      '</div>';
    });

    /* 时间刻度 + 7 列 */
    let gutter = '';
    for (let h = 0; h < 24; h++) {
      gutter += '<div class="wk-hour">' + pad2(h) + ':00</div>';
    }

    let cols = '';
    days.forEach(day => {
      let slots = '';
      for (let h = 0; h < 24; h++) slots += '<div class="wk-slot"></div>';
      const evs = day.data.blocks.map(b => {
        const label = b.count > 1
          ? WK_KIND_CN[b.kind] + ' ×' + b.count
          : b.titles[0];
        const cls = 'wk-ev wk-ev-' + b.kind + (b.finished >= b.count ? ' is-done' : '');
        return '<button class="' + cls + '" style="top:' + b.top + 'px;height:' + b.height + 'px"' +
          ' data-act="wk-open" data-date="' + day.date + '" data-kind="' + b.kind + '"' +
          ' data-start="' + b.startMin + '" title="' + esc(b.titles.join('、')) + '">' +
          '<b>' + esc(label) + '</b>' +
        '</button>';
      }).join('');
      /* 今天那条红线，让人一眼看到现在几点了 */
      const nowLine = day.date === today
        ? '<span class="wk-now" style="top:' + Math.round((nowMin / 60) * WK_HOUR_H) + 'px"></span>'
        : '';
      cols += '<div class="wk-col' + (day.date === today ? ' is-today' : '') + '">' +
        slots + evs + nowLine +
      '</div>';
    });

    return {
      head: '<div class="page-head">' +
        '<div><h2>日历</h2><p>月视图看完成度与待办，周视图看每天几点有什么事。点任意一块可以看细节。</p></div>' +
      '</div>',
      panel: '<div class="panel cal-wrap">' +
        '<div class="cal-top">' +
          '<div class="month-nav">' +
            calTabsHtml() +
            '<button class="arrow" data-act="week-shift" data-delta="-1" aria-label="上一周">‹</button>' +
            '<b>' + rangeText + '</b>' +
            '<button class="arrow" data-act="week-shift" data-delta="1" aria-label="下一周">›</button>' +
            '<button class="btn sm ghost" data-act="week-today">本周</button>' +
          '</div>' +
          '<div class="cal-summary">' +
            '<span>待办 <b>' + taskCount + '</b> 项</span>' +
            '<span>用药 <b>' + medCount + '</b> 次</span>' +
          '</div>' +
        '</div>' +
        '<div class="wk-scroll" id="wk-scroll">' +
          '<div class="wk-inner">' +
            '<div class="wk-head">' + head + '</div>' +
            '<div class="wk-allday">' + allday + '</div>' +
            '<div class="wk-body">' +
              '<div class="wk-gutter">' + gutter + '</div>' +
              '<div class="wk-cols">' + cols + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="wk-legend">' +
          '<span class="leg"><i class="wk-l-med"></i>用药</span>' +
          '<span class="leg"><i class="wk-l-task"></i>待办</span>' +
          '<span class="leg"><i class="wk-l-habit"></i>习惯</span>' +
          '<span class="leg-note">同一时刻同类型的条目会合并成一块（如「用药 ×11」），点开看全部</span>' +
          '<span class="leg-note wk-swipe-hint">左右滑动可看完整一周</span>' +
        '</div>' +
      '</div>'
    };
  }

  /* 两个视图共用底部三卡：底部卡看的是「正在浏览的那个月」，
     所以周视图翻到别的月份时，也要把 calMonth 跟着走（见 week-shift）。 */
  function viewCalendar() {
    const v = calMode === 'week' ? viewWeek() : viewMonth();
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    return v.head +
      '<div class="cal-layout">' + v.panel +
        countdownPanelHtml() +
        '<div class="cal-cards">' + monthOverview(y, m) + '</div>' +
      '</div>';
  }

  function viewMonth() {
    const y = calMonth.getFullYear();
    const m = calMonth.getMonth();
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const ym = y + '-' + pad2(m + 1);
    const wmap = {};
    weightRecords().forEach(w => {
      if (String(w.date).indexOf(ym) === 0) wmap[w.date] = w;
    });

    let recorded = 0, sum = 0, qualified = 0;
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div class="cal-cell blank"></div>';

    for (let day = 1; day <= daysInMonth; day++) {
      const ds = fmt(new Date(y, m, day));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const future = ds > now;
      if (rec) {
        recorded++;
        sum += st.ratio;
        if (st.ratio >= 0.75) qualified++;
      }
      const pct = Math.round(st.ratio * 100);
      const level = future || !rec ? 0
        : pct >= 100 ? 4
        : pct >= 75 ? 3
        : pct >= 40 ? 2
        : pct > 0 ? 1 : 0;
      const moodKey = (state.moods && state.moods[ds]) || '';
      const moodInfo = MOOD_MAP[moodKey];
      const wr = wmap[ds];
      /* 还款日：硬日子，排在待办上面。只展示，**不写进 tasks / checks** ——
         一旦变成待办就会混进完成率，而清债是不参与考核的。 */
      const db = dayDebts(ds);
      const dbHtml = db.length
        ? '<span class="cal-debts"><i class="cal-debt">还款' +
            (db.length > 1 ? '×' + db.length : '') + '</i></span>'
        : '';
      /* 待办：桌面显示最多 2 条标题，手机上 CSS 换成「N 项」 */
      const dt = dayTasks(ds);
      const dtShown = dt.slice(0, 2);
      const dtRest = dt.length - dtShown.length;
      const dtHtml = dt.length
        ? '<span class="cal-tasks">' +
            '<b class="cal-tasks-num">' + dt.length + ' 项</b>' +
            dtShown.map(x => '<i class="cal-task">' + esc(calTaskTitle(x.title)) + '</i>').join('') +
            (dtRest > 0 ? '<i class="cal-task-more">+' + dtRest + '</i>' : '') +
          '</span>'
        : '';

      cells += '<button class="cal-cell ' + (rec ? 'has-data' : '') + (ds === now ? ' is-today' : '') +
        (ds === selectedDate ? ' is-sel' : '') + (future ? ' is-future' : '') + (wr ? ' has-weight' : '') +
        '" data-level="' + level + '" data-act="pick-day" data-date="' + ds + '"' + (future ? ' disabled' : '') +
        ' title="' + ds + ' · 完成 ' + st.done + '/' + st.total + (rec ? '' : '（无记录）') +
          (moodInfo ? ' · 心情：' + moodInfo.label : '') +
          (wr ? ' · 体重 ' + wr.weight + ' kg · BMI ' + wr.bmi : '') +
          (dt.length ? ' · 待办 ' + dt.length + ' 项：' + dt.map(x => x.title).join('、') : '') +
          (db.length ? ' · 还款：' + db.map(x => x.name + ' 剩 ¥' + moneyFmt(x.balance)).join('、') : '') +
          '">' +
        '<span class="cal-fill"></span>' +
        '<span class="cal-num">' + day + '</span>' +
        dbHtml +
        dtHtml +
        '<span class="cal-foot">' +
          (wr ? '<span class="cal-weight-dot" title="体重 ' + wr.weight + ' kg · BMI ' + wr.bmi + '"></span>' : '') +
          '<span class="cal-pct">' + (rec && !future ? pct + '%' : '') + '</span>' +
          (moodInfo ? '<span class="cal-mood" title="' + moodInfo.label + '">' + moodInfo.emoji + '</span>' : '') +
        '</span>' +
        '</button>';
    }

    const avg = recorded ? Math.round(sum / recorded * 100) : 0;

    return {
      head: '<div class="page-head">' +
        '<div><h2>日历</h2><p>颜色越深，当天完成度越高；格子里是当天到期的待办，右下角是心情。点击任意一天可以补记。</p></div>' +
      '</div>',
      panel: '<div class="panel cal-wrap">' +
        '<div class="cal-top">' +
          '<div class="month-nav">' +
            calTabsHtml() +
            '<button class="arrow" data-act="month-shift" data-delta="-1" aria-label="上个月">‹</button>' +
            '<b>' + y + ' 年 ' + (m + 1) + ' 月</b>' +
            '<button class="arrow" data-act="month-shift" data-delta="1" aria-label="下个月">›</button>' +
            '<button class="btn sm ghost" data-act="cal-today">本月</button>' +
          '</div>' +
          '<div class="cal-summary">' +
            '<span>记录 <b>' + recorded + '</b> 天</span>' +
            '<span>平均完成率 <b>' + (recorded ? avg + '%' : '—') + '</b></span>' +
            '<span>达标 <b>' + qualified + '</b> 天</span>' +
          '</div>' +
        '</div>' +
        '<div class="cal-wd-row">' +
          MONTH_CN.map(w => '<div class="cal-wd">' + w + '</div>').join('') +
        '</div>' +
        '<div class="cal-grid">' +
          cells +
        '</div>' +
        '<div class="cal-legend">' +
          '<span>完成度</span>' +
          '<span class="leg"><i class="l0"></i>0</span>' +
          '<span class="leg"><i class="l1"></i>1–39%</span>' +
          '<span class="leg"><i class="l2"></i>40–74%</span>' +
          '<span class="leg"><i class="l3"></i>75–99%</span>' +
          '<span class="leg"><i class="l4"></i>100%</span>' +
          '<span class="leg-note">≥ 75% 记为达标日；右下角小表情为当天心情</span>' +
        '</div>' +
      '</div>'
    };
  }

  /* ============================================================
     统计视图
     ============================================================ */
  /* 本月回顾：把「这个月整体怎么样」收成一张卡。
     只算已经过去的日子，未到的日期不参与统计，避免月初被低估。 */
  function monthReviewData() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const today = todayStr();
    const elapsed = now.getDate();

    const days = [];
    for (let i = 1; i <= elapsed; i++) days.push(fmt(new Date(y, m, i)));

    let recorded = 0, qualified = 0, best = 0, run = 0;
    days.forEach(d => {
      if (hasRecords(d)) recorded++;
      if (dayQualified(d)) {
        qualified++;
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    });
    const rate = rateOver(days);

    const first = days[0];
    const ws = weightRecords().filter(w => w.date >= first && w.date <= today);
    const wDelta = ws.length >= 2
      ? Math.round((ws[ws.length - 1].weight - ws[0].weight) * 10) / 10
      : null;

    let sched = 0, taken = 0;
    (state.meds || []).forEach(med => {
      if (isPrn(med)) return;
      const slots = medDoseSlots(med);
      if (!slots.length) return;
      days.forEach(d => {
        if (!medActiveOn(med, d)) return;
        slots.forEach(slot => {
          sched++;
          if (doseAt(d, med.id, slot)) taken++;
        });
      });
    });
    const adherence = sched ? Math.round(taken / sched * 100) : null;

    /* 与上月对比：上月可能一天都没达标（新用户），要单独措辞 */
    const prevLast = fmt(new Date(y, m, 0));
    let prevQualified = 0;
    for (let d = new Date(y, m - 1, 1); fmt(d) <= prevLast; d = addDays(d, 1)) {
      if (dayQualified(fmt(d))) prevQualified++;
    }
    let verdict;
    if (!prevQualified && !qualified) verdict = '这个月还没有达标记录，从今天记一笔开始。';
    else if (!prevQualified) verdict = '这个月已达标 ' + qualified + ' 天，上月没有达标记录。';
    else {
      const diff = qualified - prevQualified;
      verdict = diff > 0 ? '比上月多完成 ' + diff + ' 天。'
        : diff < 0 ? '比上月少完成 ' + Math.abs(diff) + ' 天。'
        : '与上月达标天数持平（' + qualified + ' 天）。';
    }

    return { elapsed, recorded, qualified, best, rate, wDelta, adherence, taken, sched, verdict, monthLabel: (m + 1) + ' 月' };
  }

  /* ---------- 用药依从率（按天，不是按区间汇总） ----------
     区间汇总（本月回顾里那个 adherence）只能回答「这个月怎么样」，
     回答不了「哪天漏了」「这个月比上个月好还是差」。 */
  function medAdherenceDay(d) {
    let sched = 0, taken = 0;
    (state.meds || []).forEach(med => {
      if (isPrn(med)) return;
      const slots = medDoseSlots(med);
      if (!slots.length) return;
      if (!medActiveOn(med, d)) return;          /* 当天没排期的药不算分母 */
      slots.forEach(slot => {
        sched++;
        if (doseAt(d, med.id, slot)) taken++;
      });
    });
    return { sched, taken, pct: sched ? Math.round(taken / sched * 100) : null };
  }

  function medAdherenceRange(days) {
    let sched = 0, taken = 0;
    days.forEach(d => {
      const r = medAdherenceDay(d);
      sched += r.sched;
      taken += r.taken;
    });
    return { sched, taken, pct: sched ? Math.round(taken / sched * 100) : null };
  }

  /* 本月 vs 上月「同期」——不是拿半截月份去比整月。
     上个月可能没有 31 号，所以取上月的实际天数。 */
  function medAdherenceMoM() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const passed = now.getDate();
    const thisDays = [];
    for (let i = passed - 1; i >= 0; i--) thisDays.push(fmt(addDays(now, -i)));
    const prevLen = new Date(y, m, 0).getDate();
    const prevDays = [];
    for (let i = 1; i <= Math.min(passed, prevLen); i++) {
      prevDays.push(fmt(new Date(y, m - 1, i)));
    }
    const a = medAdherenceRange(thisDays);
    const b = medAdherenceRange(prevDays);
    return { thisPct: a.pct, prevPct: b.pct, days: passed };
  }

  function medTrendBody(range, rangeDays) {
    const cur = medAdherenceRange(rangeDays);
    const mom = medAdherenceMoM();

    let delta;
    if (cur.pct === null) {
      delta = '<span class="adh-note">这 ' + range + ' 天没有用药排期</span>';
    } else if (mom.prevPct === null) {
      delta = '<span class="adh-note">上月同期没有用药排期，无从比较</span>';
    } else {
      const diff = mom.thisPct - mom.prevPct;
      /* 头部只放结论。两个百分比的完整口径挪到下方说明里——
         全塞进头部后手机上会撑成三行，第一屏就看不见图了。 */
      const momTxt = '（' + mom.thisPct + '% / ' + mom.prevPct + '%）';
      delta = diff === 0
        ? '<span class="adh-delta">与上月同期持平' + momTxt + '</span>'
        : '<span class="adh-delta">' + (diff > 0 ? '↑ 比上月同期多 ' : '↓ 比上月同期少 ')
          + Math.abs(diff) + ' 个点' + momTxt + '</span>';
    }

    const labelStep = Math.max(1, Math.ceil(rangeDays.length / 10));
    const cols = rangeDays.map((ds, bi) => {
      const r = medAdherenceDay(ds);
      const has = r.sched > 0;
      const showLabel = (rangeDays.length - 1 - bi) % labelStep === 0;
      const label = showLabel ? String(parseD(ds).getDate()) : '';
      const h = has ? Math.max(4, r.pct) : 0;
      const cls = !has ? 'zero' : (r.pct >= 80 ? '' : 'low');
      return '<div class="bar-col' + (ds === todayStr() ? ' is-today' : '') + '" title="' + ds +
          (has ? ' 已服 ' + r.taken + '/' + r.sched + ' 次（' + r.pct + '%）' : ' 当天没有用药排期') + '">' +
        '<div class="bar-wrap"><i class="' + cls + '"' + (has ? ' style="height:' + h + '%"' : '') + '></i></div>' +
        '<span>' + label + '</span>' +
      '</div>';
    }).join('');

    return '<div>' +
      '<div class="adh-head">' +
        '<b class="adh-big">' + (cur.pct === null ? '—' : cur.pct + '<i>%</i>') + '</b>' +
        delta +
      '</div>' +
      '<div class="chart" style="gap:' + (range > 30 ? '1px' : (range > 14 ? '3px' : '8px')) + '">' + cols + '</div>' +
      '<p class="hint">每天一根柱，高度 = 当天已服次数 ÷ 应服次数（只算当天有排期的药）。' +
      '空柱表示那天没药；浅色表示低于 80%。' +
      (cur.sched ? '这 ' + range + ' 天共应服 ' + cur.sched + ' 次，已服 ' + cur.taken + ' 次。' : '') +
      (mom.prevPct === null || cur.pct === null ? ''
        : '括号里的环比是<b>本月已过 ' + mom.days + ' 天</b>对上月同期：本月 ' +
          mom.thisPct + '%，上月同期 ' + mom.prevPct + '%。') +
      '</p>' +
    '</div>';
  }

  function monthReviewBody() {
    const r = monthReviewData();
    const cell = (label, value, unit, sub) =>
      '<div class="rv-cell"><small>' + esc(label) + '</small><b>' + value +
        (unit ? ' <i>' + esc(unit) + '</i>' : '') + '</b>' +
        (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>';
    const pctOf = v => r.elapsed ? Math.round(v / r.elapsed * 100) : 0;
    return '<div class="sblock">' +
      '<div class="sblock-head"><b>本月回顾</b>' +
        '<span class="muted-sm">（' + esc(r.monthLabel) + '已过 ' + r.elapsed + ' 天）</span></div>' +
      '<div class="rv-grid">' +
        cell('达标天数', r.qualified, '天', '占已过天数 ' + pctOf(r.qualified) + '%') +
        cell('有记录', r.recorded, '天', '缺 ' + (r.elapsed - r.recorded) + ' 天') +
        cell('最长连续', r.best, '天', '完成率 ≥ 75% 记一天') +
        cell('平均完成率', Math.round(r.rate.rate * 100) + '%', '', '按有记录的 ' + r.rate.days + ' 天算') +
        cell('体重变化', r.wDelta === null ? '—' : (r.wDelta > 0 ? '+' : '') + r.wDelta, r.wDelta === null ? '' : 'kg',
          r.wDelta === null ? '本月记录不足 2 次' : (r.wDelta === 0 ? '持平' : (r.wDelta < 0 ? '在下降' : '在上升'))) +
        cell('用药依从', r.adherence === null ? '—' : r.adherence + '%', '',
          r.adherence === null ? '本月无排期' : '已服 ' + r.taken + ' / 应服 ' + r.sched + ' 次') +
      '</div>' +
      '<p class="rv-verdict">' + esc(r.verdict) + '</p>' +
      '<div class="btn-row"><button class="btn" data-act="month-summary">生成月度小结</button></div>' +
    '</div>';
  }

  /* ---------- 月度健康小结 ----------
     和「本月回顾」的区别：那边是一屏内的速览，这边是能打印出来交给医生的东西，
     所以要有明细（每种药、每个习惯的完成情况）和生成时间。 */
  /* 某天某个习惯的「完成度」，0~1。
     · 戒除 / 戒烟：守住 1、破了 0（和 met 一致）
     · 用药习惯：已服 ÷ 应服（吃了 3 剂 / 4 剂 = 75%）
     · 计数类：实际次数 ÷ 目标次数，封顶 1（喝 3 杯 / 目标 9 杯 = 33%）
     跟 met() 的区别就在最后一种：met 只有 0 和 1，它表达不了「做了 3/9」。
     **只给月度小结用**，不要拿它替换 dayStats —— 那个是「达标」的二元定义，
     日历热力、连续达标天数、统计页柱状图全都依赖它。 */
  function habitDayAcc(h, d) {
    if (isQuitLike(h)) return met(h, d) ? 1 : 0;
    if (h.med) {
      const sched = medScheduledCount(d);
      return sched ? Math.min(medTakenCount(d) / sched, 1) : 0;
    }
    const target = Math.max(1, Number(h.target) || 1);
    return Math.min(countOf(d, h.id) / target, 1);
  }

  function monthSummaryData() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const today = todayStr();
    const elapsed = now.getDate();
    const days = [];
    for (let i = 1; i <= elapsed; i++) days.push(fmt(new Date(y, m, i)));

    let recorded = 0, qualified = 0, best = 0, run = 0;
    days.forEach(d => {
      if (hasRecords(d)) recorded++;
      if (dayQualified(d)) {
        qualified++;
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    });

    const ws = weightRecords().filter(w => w.date >= days[0] && w.date <= today);
    const weight = ws.length ? {
      first: ws[0],
      last: ws[ws.length - 1],
      count: ws.length,
      delta: ws.length >= 2
        ? Math.round((ws[ws.length - 1].weight - ws[0].weight) * 10) / 10
        : null
    } : null;

    let sched = 0, taken = 0;
    const byMed = [];
    (state.meds || []).forEach(med => {
      if (!med || isPrn(med)) return;
      const slots = medDoseSlots(med);
      if (!slots.length) return;
      let s2 = 0, t2 = 0;
      days.forEach(d => {
        if (!medActiveOn(med, d)) return;
        slots.forEach(slot => {
          s2++;
          if (doseAt(d, med.id, slot)) t2++;
        });
      });
      if (!s2) return;
      sched += s2;
      taken += t2;
      byMed.push({
        name: med.name || '用药',
        dose: (Number(med.doseAmount) || 1) + (med.doseUnit || med.form || '片'),
        times: slots.join(' / '),
        sched: s2, taken: t2,
        pct: Math.round(t2 / s2 * 100)
      });
    });
    byMed.sort((a, b) => a.pct - b.pct || a.name.localeCompare(b.name));

    /* 备用药不排期，只报「这个月吃了几次」 */
    const prn = [];
    (state.meds || []).forEach(med => {
      if (!med || !isPrn(med)) return;
      let n = 0;
      days.forEach(d => { n += prnKeys(d, med.id).length; });
      if (n) prn.push({ name: med.name || '用药', count: n });
    });

    const habits = [];
    state.habits.filter(h => !h.optional && !isArchived(h)).forEach(h => {
      let done = 0, n = 0, acc = 0;
      days.forEach(d => {
        if (h.med && medScheduledCount(d) === 0) return;   /* 那天没药，这个习惯不计分母 */
        n++;
        if (met(h, d)) done++;
        acc += habitDayAcc(h, d);
      });
      if (!n) return;
      /* pct = 完成度（按实际完成量折算）；done/n 还是「完全做到的天数」，两者都留着。
         以前 pct 就是 done/n，喝水每天 3 杯 / 目标 9 杯 会显示 0% ——
         跟一口没喝同分，而这份小结是要打印出来给医生看的，那个 0 会被读成「完全没做」。 */
      habits.push({
        name: h.name || '习惯',
        done, n,
        pct: Math.round(acc / n * 100),
        hit: Math.round(done / n * 100)
      });
    });
    habits.sort((a, b) => a.pct - b.pct);

    /* 「有记录的日子里的平均完成度」。
       不用 rateOver()：它算的是 dayStats 的二元口径，「喝了一半」记 0，
       会跟上面那张表的百分比打架（表里 33%，这里却说整体 12%）。
       dayStats 本身不能改，日历热力和连续达标都挂在它上面。 */
    let accSum = 0, accN = 0;
    days.forEach(d => {
      if (!hasRecords(d)) return;
      const hs = activeHabits(d);
      if (!hs.length) return;
      let s2 = 0;
      hs.forEach(h => { s2 += habitDayAcc(h, d); });
      accSum += s2 / hs.length;
      accN++;
    });

    const t = new Date();
    return {
      label: y + ' 年 ' + (m + 1) + ' 月',
      span: days[0] + ' 至 ' + today + '（' + elapsed + ' 天）',
      elapsed, recorded, qualified, best,
      avgRate: { rate: accN ? accSum / accN : 0, days: accN },
      weight, med: { sched, taken, pct: sched ? Math.round(taken / sched * 100) : null, byMed, prn },
      habits,
      generatedAt: fmt(t) + ' ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes())
    };
  }

  function openMonthSummary() {
    const r = monthSummaryData();
    const pctOf = v => Math.round(v / r.elapsed * 100);

    const medTable = r.med.byMed.length || r.med.prn.length
      ? '<table class="sum-table">' +
          '<tr><th>药品</th><th>剂量</th><th>时间</th><th class="num">应服</th>' +
            '<th class="num">已服</th><th class="num">依从</th></tr>' +
          r.med.byMed.map(x =>
            '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.dose) + '</td>' +
            '<td>' + esc(x.times) + '</td>' +
            '<td class="num">' + x.sched + '</td><td class="num">' + x.taken + '</td>' +
            '<td class="num">' + x.pct + '%</td></tr>').join('') +
          r.med.prn.map(x =>
            '<tr><td>' + esc(x.name) + '</td><td>—</td><td>按需</td>' +
            '<td class="num">—</td><td class="num">' + x.count + ' 次</td>' +
            '<td class="num">—</td></tr>').join('') +
        '</table>'
      : '<p class="sum-lead">本月没有用药排期。</p>';

    const habitTable = r.habits.length
      ? '<table class="sum-table">' +
          '<tr><th>习惯</th><th class="num">达标天数</th><th class="num">完成度</th></tr>' +
          r.habits.map(x =>
            '<tr><td>' + esc(x.name) + '</td>' +
            '<td class="num">' + x.done + ' / ' + x.n + '</td>' +
            '<td class="num">' + x.pct + '%</td></tr>').join('') +
        '</table>' +
        '<p class="sum-hint">达标天数 = 当天完全做到的天数；完成度 = 按实际完成量折算' +
          '（目标 9 杯、实际 3 杯记 33%）。</p>'
      : '<p class="sum-lead">本月没有需要打卡的习惯。</p>';

    let weightTxt;
    if (!r.weight) {
      weightTxt = '<p class="sum-lead">本月没有体重记录。</p>';
    } else if (r.weight.delta === null) {
      weightTxt = '<p class="sum-lead">本月只记录了 1 次体重（' + r.weight.last.weight + ' kg）。</p>';
    } else {
      const d = r.weight.delta;
      weightTxt = '<p class="sum-big">' + (d > 0 ? '+' : '') + d + '<small>kg</small></p>' +
        '<p class="sum-lead">' + r.weight.first.date + ' 的 ' + r.weight.first.weight + ' kg → ' +
        r.weight.last.date + ' 的 ' + r.weight.last.weight + ' kg，共 ' + r.weight.count + ' 次记录。</p>';
    }

    openModal(
      '<div class="modal-card summary-card">' +
        '<div class="sum-head"><h3>月度健康小结</h3><span>' + esc(r.label) + ' · ' + esc(r.span) + '</span></div>' +

        '<div class="sum-sec"><h4>用药依从</h4>' +
          (r.med.pct === null
            ? '<p class="sum-lead">本月没有定时用药。</p>'
            : '<p class="sum-big">' + r.med.pct + '<small>%</small></p>' +
              '<p class="sum-lead">应服 ' + r.med.sched + ' 次，已记录 ' + r.med.taken + ' 次。</p>') +
          medTable +
        '</div>' +

        '<div class="sum-sec"><h4>体重</h4>' + weightTxt + '</div>' +

        '<div class="sum-sec"><h4>习惯完成</h4>' + habitTable + '</div>' +

        '<div class="sum-sec"><h4>记录情况</h4>' +
          '<p class="sum-lead">' + esc(r.label) + '已过 ' + r.elapsed + ' 天：有记录 <b>' + r.recorded +
          '</b> 天（' + pctOf(r.recorded) + '%），达标 <b>' + r.qualified + '</b> 天，最长连续 <b>' +
          r.best + '</b> 天。' +
          (r.avgRate.days ? '有记录的日子平均完成度 ' +
            Math.round(r.avgRate.rate * 100) + '%。' : '') +
          '</p>' +
        '</div>' +

        '<div class="sum-foot">明序 · 生成于 ' + esc(r.generatedAt) +
          ' · 本页只反映记录内容，不构成医疗建议</div>' +

        '<div class="btn-row no-print" style="margin-top:14px">' +
          '<button class="btn primary" data-act="print-summary">打印 / 存为 PDF</button>' +
          '<button class="btn" data-act="close-modal">关闭</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* ============================================================
     戒烟页：宽卡 + 月历 + 汇总 + 买烟记录
     ============================================================ */
  function quitHabit() {
    return (state.habits || []).find(function (x) {
      return x && !x.archivedAt && isSmoke(x);
    });
  }

  /* 戒烟页标题：跟用药/待办页一样的 page-head。
     副标题动态——今天没抽写「连续 X 天没抽」，抽了写「今天 X 支 · 比昨天多/少 Y 支」。 */
  function quitPageHead(h) {
    const todayS = dayCravings(h.id, todayStr()).filter(function (e) { return e.k === 's'; }).length;
    const yestS = dayCravings(h.id, fmt(addDays(new Date(), -1))).filter(function (e) { return e.k === 's'; }).length;
    let sub;
    if (todayS === 0) {
      sub = '连续 ' + quitStreak(h) + ' 天没抽';
    } else {
      const diff = todayS - yestS;
      sub = '今天抽了 ' + todayS + ' 支 · ' +
        (diff > 0 ? '比昨天多 ' + diff + ' 支' : (diff < 0 ? '比昨天少 ' + (-diff) + ' 支' : '和昨天一样'));
    }
    return '<div class="page-head">' +
      '<div><h2>戒烟</h2><p>' + sub + '</p></div>' +
      '<div class="head-actions">' +
        '<button class="btn danger-red" data-act="crave-clear">清空记录</button>' +
        '<button class="btn primary" data-act="pack-new">记一笔买烟</button>' +
      '</div>' +
    '</div>';
  }

  function viewQuit() {
    const h = quitHabit();
    if (!h) {
      return '<div class="panel"><h3>戒烟</h3><div class="empty-box">还没有戒烟习惯。去「习惯」页添加一个类型为「戒除」的习惯。</div></div>';
    }
    return '<div class="quit-page">' +
      quitPageHead(h) +
      quitSumPanel(h) +
      '<div class="quit-top">' +
        '<div class="quit-hero">' + quitCard(h, todayStr(), true) + '</div>' +
        quitCalPanel(h) +
      '</div>' +
      quitPacksPanel(h) +
      quitTrendPanel(h) +
    '</div>';
  }

  /* 月历：每天抽了几支。有点一根的日子标红，点过但没抽的标 ✓，其余空白 */
  function quitCalPanel(h) {
    const y = quitCalMonth.getFullYear(), m = quitCalMonth.getMonth();
    /* 周一起始，跟主日历页一致 */
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    const total = new Date(y, m + 1, 0).getDate();
    const today = todayStr();
    const startDay = quitStartDay(h);
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="qc-day blank"></div>';
    for (let dd = 1; dd <= total; dd++) {
      const ds = fmt(new Date(y, m, dd));
      if (ds > today) { cells += '<div class="qc-day fut"><span>' + dd + '</span></div>'; continue; }
      const evs = dayCravings(h.id, ds);
      const ns = evs.filter(function (e) { return e.k === 's'; }).length;
      const nr = evs.length - ns;
      const cls = ns > 0 ? 'bad' : (nr > 0 ? 'ok' : '');
      cells += '<div class="qc-day ' + cls + (ds === today ? ' today' : '') + '">' +
        '<span>' + dd + '</span>' +
        '<b>' + (ns ? ns + ' 支' : (nr ? '✓' : '·')) + '</b>' +
      '</div>';
    }
    return '<div class="panel">' +
      '<div class="qc-head">' +
        '<h3>戒烟月历</h3>' +
        '<div class="month-nav">' +
          '<button class="arrow" data-act="quit-month-shift" data-delta="-1" aria-label="上个月">‹</button>' +
          '<b>' + y + ' 年 ' + (m + 1) + ' 月</b>' +
          '<button class="arrow" data-act="quit-month-shift" data-delta="1" aria-label="下个月">›</button>' +
          '<button class="btn sm ghost" data-act="quit-month-today">本月</button>' +
        '</div>' +
      '</div>' +
      '<div class="qc-wd">' + MONTH_CN.map(function (w) {
        return '<span>' + w + '</span>';
      }).join('') + '</div>' +
      '<div class="qc-grid">' + cells + '</div>' +
      '<div class="qc-legend muted-sm">红=抽了 · 绿✓=忍住 · 灰·=没记</div>' +
    '</div>';
  }

  /* 抽烟趋势折线图：x 轴日期、y 轴每日「点一根」次数，右上角切周/月/季。
     只统计 k==='s'（抽了），「忍一次」不是抽烟，不混进来。 */
  function quitTrendPanel(h) {
    const range = quitTrendRange;
    const today = new Date();
    const days = [];
    for (let i = range - 1; i >= 0; i--) {
      const ds = fmt(addDays(today, -i));
      const n = dayCravings(h.id, ds).filter(function (e) { return e.k === 's'; }).length;
      days.push({ date: ds, v: n });
    }
    const total = days.reduce(function (s, d) { return s + d.v; }, 0);
    const avg = total / range;
    const RANGE_CN = { 7: '周', 30: '月', 90: '季' };
    const tabs = [7, 30, 90].map(function (r) {
      return '<button type="button" class="qt-tab' + (r === range ? ' on' : '') +
        '" data-act="quit-trend-range" data-range="' + r + '">' + RANGE_CN[r] + '</button>';
    }).join('');
    const body = total
      ? quitTrendSvg(days, avg, range)
      : '<div class="qt-empty">这个区间还没有抽烟记录，记几笔之后这里会画出趋势</div>';
    return '<div class="panel"><div class="qc-head">' +
      '<h3>抽烟趋势</h3>' +
      '<div class="qt-tabs">' + tabs + '</div>' +
      '</div>' +
      '<div class="qt-sub muted-sm">近 ' + range + ' 天 · 平均每天 ' + avg.toFixed(1) + ' 支</div>' +
      body +
    '</div>';
  }

  function quitTrendSvg(days, avg, range) {
    const W = 960, H = 150, L = 34, R = 16, T = 14, B = 24;
    const pw = W - L - R, ph = H - T - B;
    let hi = 1;
    days.forEach(function (d) { if (d.v > hi) hi = d.v; });
    hi = Math.max(1, Math.ceil(hi));
    const yy = function (v) { return T + (hi - v) / hi * ph; };
    const xx = function (i) { return days.length === 1 ? L + pw / 2 : L + i / (days.length - 1) * pw; };

    let g = '';
    /* y 轴刻度：hi 小时每个整数一个刻度（0/1/2...），hi 大时取 0/中/顶 三个。
       别用 Math.round(hi*(1-t)) 那套——hi=1 时中间刻度 round 成 1，和顶部重复。 */
    const ticks = [];
    if (hi <= 3) { for (let v = 0; v <= hi; v++) ticks.push(v); }
    else { ticks.push(0, Math.round(hi / 2), hi); }
    ticks.forEach(function (v) {
      const y = yy(v);
      g += '<line class="qt-grid" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text class="qt-lbl" x="' + (L - 6) + '" y="' + (y + 3.4).toFixed(1) + '" text-anchor="end">' + v + '</text>';
    });

    /* 平均虚线：一眼看出最近在平均线之上还是之下 */
    const ay = yy(Math.min(avg, hi));
    g += '<line class="qt-avg" x1="' + L + '" y1="' + ay.toFixed(1) + '" x2="' + (W - R) + '" y2="' + ay.toFixed(1) + '"><title>平均 ' + avg.toFixed(1) + ' 支</title></line>';
    /* 平均标签放左上：放右上会盖住最新数据点（折线尾部） */
    g += '<text class="qt-avg-lbl" x="' + (L + 4) + '" y="' + (ay - 4).toFixed(1) + '" text-anchor="start">平均 ' + avg.toFixed(1) + '</text>';

    /* 折线连所有天（含 0 值），圆点只标有抽烟的天 */
    const d = days.map(function (dd, i) {
      return (i ? 'L' : 'M') + xx(i).toFixed(1) + ',' + yy(dd.v).toFixed(1);
    }).join(' ');
    g += '<path class="qt-line" d="' + d + '"/>';
    days.forEach(function (dd, i) {
      if (!dd.v) return;
      const last = i === days.length - 1;
      g += '<circle class="qt-dot' + (last ? ' last' : '') + '" cx="' + xx(i).toFixed(1) + '" cy="' + yy(dd.v).toFixed(1) + '" r="' + (last ? 3.6 : 2.6) + '">' +
        '<title>' + dd.date + ' · ' + dd.v + ' 支</title></circle>';
    });

    /* x 轴标签：7 天每天都标，30 天每 7 天，90 天每 15 天 */
    const step = range <= 7 ? 1 : (range <= 30 ? 7 : 15);
    const idx = [];
    for (let i = 0; i < days.length; i += step) idx.push(i);
    if (idx[idx.length - 1] !== days.length - 1) idx.push(days.length - 1);
    const used = [];
    idx.forEach(function (i) {
      const cx = Math.round(xx(i));
      if (used.indexOf(cx) >= 0) return;
      used.push(cx);
      g += '<text class="qt-lbl" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' +
        days[i].date.slice(5).replace('-', '/') + '</text>';
    });

    return '<svg class="qt-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="抽烟趋势折线图">' + g + '</svg>';
  }
  /* 数据汇总：8 张卡 + 24 小时时段条。全部现算，不存字段——包区间和事件流
     本来就推得出这些。两处口径刻意写进小字：
     ① 「本月消费」按买烟日期算（月头买一条整笔算在月头，看的是支出不是消耗）；
     ② 「平均每天」的分母是戒烟天数（上限 30），不是固定 30 天——刚开始记的前
        半个月会被当成 0 支，均值被压低，「折合几小时一根」跟着一起错。 */
  /* ---- 汇总派生值（v107）---------------------------------------------
     全部从 cravings 现算，不新增任何字段：
       quitStartAvg  起始 7 天的日均支数（不足 7 天按实际天数）
       quitNowAvg    近 N 天日均（默认 7）
       quitWeekAvgs  近 4 周的各自日均（最后一个是本周，可能不满 7 天）
     quitStartDay 之前的日子不计入——那是「开始记」之前，没数据不等于没抽。
     ---------------------------------------------------------------- */
  function quitDailySmoke(h, ds) {
    return dayCravings(h.id, ds).filter(function (e) { return e.k === 's'; }).length;
  }
  function quitStartAvg(h) {
    const start = parseD(quitStartDay(h));
    const today = parseD(todayStr());
    const n = Math.min(7, Math.round((today - start) / 86400000) + 1);
    if (!(n > 0)) return 0;
    let sum = 0;
    for (let i = 0; i < n; i++) sum += quitDailySmoke(h, fmt(addDays(start, i)));
    return sum / n;
  }
  function quitNowAvg(h, days) {
    const d = days || 7;
    let sum = 0;
    for (let i = 0; i < d; i++) sum += quitDailySmoke(h, fmt(addDays(new Date(), -i)));
    return sum / d;
  }
  function quitWeekAvgs(h) {
    const start = quitStartDay(h);
    const out = [];
    for (let w = 3; w >= 0; w--) {
      let sum = 0, n = 0;
      for (let i = 0; i < 7; i++) {
        const ds = fmt(addDays(new Date(), -(w * 7 + i)));
        if (ds < start || ds > todayStr()) continue;
        sum += quitDailySmoke(h, ds);
        n++;
      }
      out.push(n ? sum / n : 0);
    }
    return out;
  }

  function quitSumCardsHtml(h, withHours) {
    const packs = Array.isArray(state.packs) ? state.packs : [];
    const now = new Date();
    const dow = (now.getDay() + 6) % 7;
    const monday = addDays(now, -dow); monday.setHours(0, 0, 0, 0);
    const monthFirst = new Date(now.getFullYear(), now.getMonth(), 1);
    const nowTs = now.getTime() / 1000;
    const since = function (ms) {
      return packs.filter(function (p) { return p.at >= ms / 1000 && p.at <= nowTs; });
    };
    const wk = since(monday.getTime());
    const mo = since(monthFirst.getTime());
    const sumPrice = function (arr) {
      return arr.reduce(function (s, p) { return s + (Number(p.price) || 0); }, 0);
    };
    const wkCost = sumPrice(wk);
    const moCost = sumPrice(mo);

    const t0 = todayStr();
    const todayS = dayCravings(h.id, t0).filter(function (e) { return e.k === 's'; }).length;
    const yestS = dayCravings(h.id, fmt(addDays(now, -1)))
      .filter(function (e) { return e.k === 's'; }).length;
    const diff = todayS - yestS;
    const diffText = diff === 0
      ? '和昨天一样'
      : (diff > 0 ? '比昨天多 ' + diff + ' 支' : '比昨天少 ' + (-diff) + ' 支');

    /* 平均每天：分母 = 戒烟天数（上限 30） */
    const spanDays = Math.min(30, Math.max(1,
      Math.round((parseD(t0).getTime() - parseD(quitStartDay(h)).getTime()) / 86400000) + 1));
    let sumDays = 0;
    for (let i = 0; i < spanDays; i++) {
      sumDays += dayCravings(h.id, fmt(addDays(now, -i)))
        .filter(function (e) { return e.k === 's'; }).length;
    }
    const avg = sumDays / spanDays;

    /* 忍住：累计次数 + 忍住率。分母是「想抽的次数」（抽了 + 忍住），不是天数——
       这才回答得了「每次想抽的时候我有多大概率忍住」。 */
    let smokeAll = 0, resistAll = 0;
    cravingsOf(h.id).forEach(function (e) { if (e.k === 's') smokeAll++; else resistAll++; });
    const tries = smokeAll + resistAll;
    const resistRate = tries ? Math.round(resistAll / tries * 100) : 0;

    /* 每支成本：按「本月买的烟」的单价加权；本月没买就退回最近一包。
       拿当月消耗去除会低估——买来的包可能还有大半没抽。 */
    const unitOf = function (arr) {
      let cost = 0, sticks = 0;
      arr.forEach(function (p) {
        const pr = Number(p.price) || 0;
        if (!pr) return;
        cost += pr;
        sticks += Math.max(1, Number(p.size) || 20);
      });
      return sticks ? { unit: cost / sticks, sticks: sticks } : null;
    };
    let unit = unitOf(mo);
    let unitSub = unit ? '按本月 ' + unit.sticks + ' 支均价' : '';
    if (!unit && packs.length) {
      unit = unitOf(packs.slice(-1));
      if (unit) unitSub = '按最近一包均价';
    }

    /* 上次抽：按事件时间算。quitStreak 是按天算的，回答不了「几小时前」 */
    const lastTs = lastSmokeTs(h.id);
    /* 这里不复用 packSpanText：那是给「这包抽了多久」写的，会输出
       「1 小时 33 分」，手机两列卡面里折成三行。卡面要的是紧凑值 */
    let lastText = '还没有记录';
    const lastMin = lastTs ? Math.max(0, Math.round((nowTs - Number(lastTs)) / 60)) : 0;
    if (lastTs) {
      lastText = lastMin < 60
        ? lastMin + ' 分钟前'
        : (lastMin < 1440 ? (lastMin / 60).toFixed(1) + ' 小时前'
          : Math.round(lastMin / 1440) + ' 天前');
    }
    const lastSub = lastTs ? tsDay(lastTs).slice(5) + ' ' + tsHHMM(lastTs) : '想抽时点一下';

    const streak = quitStreak(h), best = quitBest(h);
    const streakSub = best > streak
      ? '最长 ' + best + ' 天'
      : (streak > 0 ? '就是最长纪录' : (best ? '最长 ' + best + ' 天' : '还没开始'));

    /* ---- v107 新增的四格：减量进度 / 无烟天数 / 本周守住 / 近 4 周走向 ---- */
    /* 减量进度：起始 7 天日均 → 近 7 天日均。起始就是 0 支的没什么可降，
       直接说「一开始就没抽」，不要硬算一个 0% 出来。 */
    const qStartAvg = quitStartAvg(h);
    const qNowAvg = quitNowAvg(h, 7);
    const qCut = qStartAvg > 0.3
      ? Math.round((qStartAvg - qNowAvg) / qStartAvg * 100)
      : null;

    /* 无烟天数：从戒烟起点到今天，一支没记的天数。
       戒除型不点就是没抽，所以「没记录」在这里按守住算。 */
    const qStart = parseD(quitStartDay(h));
    const qDays = Math.max(1, Math.round((parseD(t0) - qStart) / 86400000) + 1);
    let qDry = 0;
    for (let i = 0; i < qDays; i++) {
      if (!quitDailySmoke(h, fmt(addDays(new Date(), -i)))) qDry++;
    }

    /* 本周守住：本周已过且有记录覆盖的天数里，0 支的天数。 */
    let qWeekDry = 0, qWeekDays = 0;
    for (let i = 0; i < 7; i++) {
      const dt = addDays(new Date(), -i);
      const ds = fmt(dt);
      if (ds < quitStartDay(h) || ds > t0) continue;
      qWeekDays++;
      if (!quitDailySmoke(h, ds)) qWeekDry++;
    }

    /* 近 4 周走向：4 根柱，末根是本周。最高的一根定高度基准。 */
    const qWeeks = quitWeekAvgs(h);
    const qWMax = Math.max(0.5, Math.max.apply(null, qWeeks));
    const qSpark = qWeeks.map(function (v, i) {
      const hp = Math.max(6, Math.round(v / qWMax * 100));
      return '<i class="' + (i === 3 ? 'last' : '') + '" style="height:' + hp + '%"' +
        ' title="第 ' + (i + 1) + ' 周 · 日均 ' + v.toFixed(1) + ' 支"></i>';
    }).join('');
    const qWTrend = (function () {
      const a = qWeeks[0], b = qWeeks[3];
      if (!a && !b) return '这四周都没记抽烟';
      if (b < a - 0.2) return '从 <b>' + a.toFixed(1) + '</b> 降到 <b>' + b.toFixed(1) + '</b> 支/天';
      if (b > a + 0.2) return '从 <b>' + a.toFixed(1) + '</b> 升到 <b>' + b.toFixed(1) + '</b> 支/天';
      return '四周稳定在 <b>' + b.toFixed(1) + '</b> 支/天';
    })();

    const card = function (label, big, sub) {
      return '<div class="qsum"><small>' + label + '</small><b>' + big + '</b><span>' + sub + '</span></div>';
    };
    return '<div class="qsum-grid">' +
        card('今天', todayS + ' 支', diffText) +
        card('本周买烟', wk.length + ' 包', '¥' + wkCost.toFixed(0)) +
        card('本月消费', '¥' + moCost.toFixed(0) + ' 元', '按买烟日期 · ' + mo.length + ' 包') +
        card('平均每天', avg.toFixed(1) + ' 支',
          '近 ' + spanDays + ' 天' + (avg > 0 ? ' · 折合每 ' + (24 / avg).toFixed(1) + ' 小时一根' : '')) +
        card('连续无烟', streak + ' 天', streakSub) +
        /* 抵御率当主数字：它回答「每次想抽我多大把握忍住」，
           比「忍住了 N 次」这个累计值更能反映当下的自控力。 */
        card('抵御率', tries ? resistRate + '%' : '—',
          tries ? '想抽 ' + tries + ' 次 · 忍住 ' + resistAll + ' 次' : '还没有记录') +
        card('每支成本', unit ? '¥' + unit.unit.toFixed(2) : '—',
          unit ? unitSub : '买烟时填价格就能算') +
        card('上次抽', lastText, lastSub) +
        /* ---- v107 新增 ---- */
        card('减量进度',
          qCut === null ? '—' : (qCut > 0 ? '↓ ' + qCut + '%' : (qCut < 0 ? '↑ ' + (-qCut) + '%' : '持平')),
          qCut === null
            ? '开始时就没有抽烟记录'
            : '起始 7 天 ' + qStartAvg.toFixed(1) + ' → 近 7 天 ' + qNowAvg.toFixed(1) + ' 支/天') +
        card('无烟天数', qDry + ' / ' + qDays + ' 天',
          '占 ' + Math.round(qDry / qDays * 100) + '% · 从 ' + quitStartDay(h).slice(5) + ' 起算') +
        card('本周守住', qWeekDry + ' / ' + qWeekDays + ' 天',
          qWeekDays ? '本周已过 ' + qWeekDays + ' 天，没记抽烟 ' + qWeekDry + ' 天' : '本周还没开始') +
        '<div class="qsum"><small>近 4 周</small>' +
          '<div class="qs-spark">' + qSpark + '</div>' +
          '<span>' + qWTrend + '</span></div>' +
      '</div>' +
      (withHours === false ? '' : quitHoursStrip(h));
  }

  /* 戒烟页要一整块面板。统计页并进「戒烟」块里，只取卡片那部分 */
  function quitSumPanel(h) {
    return '<div class="panel"><h3>数据汇总</h3>' + quitSumCardsHtml(h, true) + '</div>';
  }

  /* 24 小时时段条（戒烟页速览）。统计页也有 24 根柱，那是「分析」视角、可切区间；
     这里是顶部速览，一根细条。样本少于 5 支不报峰值——3 条记录里 1 条就能当峰值。 */
  function quitHoursStrip(h) {
    const bins = craveHours(h.id);
    let max = 0, total = 0;
    bins.forEach(function (n) { total += n; if (n > max) max = n; });
    const bars = bins.map(function (n, i) {
      const hp = max ? Math.max(n ? 8 : 3, Math.round(n / max * 100)) : 3;
      return '<i class="qs-bar' + (n === 0 ? ' zero' : (n === max ? ' on' : '')) +
        '" style="height:' + hp + '%" title="' + pad2(i) + ':00 · ' + n + ' 支"></i>';
    }).join('');
    let tip;
    if (!total) tip = '还没有记录，记几笔就能看出你栽在哪个时段';
    else if (total < 5) tip = '样本还少（' + total + ' 支），先攒几天';
    else tip = '最常见：' + pad2(bins.indexOf(max)) + ':00 前后 · ' + max + ' 支';
    return '<div class="qsum-hours">' +
      '<div class="qs-head"><small>时段分布</small><span>' + tip + '</span></div>' +
      '<div class="qs-bars">' + bars + '</div>' +
      '<div class="qs-axis"><span>0 点</span><span>6</span><span>12</span><span>18</span><span>23 点</span></div>' +
    '</div>';
  }

  /* 按天清空抽烟记录。删的是这一天全部的 cravings（含「忍一次」），
     删完区间自动重算：包还是那个包，只是支数少了——不用同步任何字段。 */
  function craveClearModal() {
    const h = quitHabit();
    if (!h) return;
    const map = {};
    craveList().forEach(function (e) {
      if (e.h !== h.id) return;
      const ds = tsDay(e.t);
      if (!map[ds]) map[ds] = { s: 0, r: 0 };
      if (e.k === 's') map[ds].s++; else map[ds].r++;
    });
    const days = Object.keys(map).sort().reverse();
    const rows = days.map(function (ds) {
      const b = map[ds];
      const parts = [];
      if (b.s) parts.push(b.s + ' 支');
      if (b.r) parts.push(b.r + ' 次忍');
      return '<div class="cc-row">' +
        '<b>' + ds.slice(5) + '</b>' +
        '<small>' + (parts.join(' · ') || '无记录') + '</small>' +
        '<button class="btn danger-red sm" data-act="crave-clear-day" data-ds="' + ds + '">清空</button>' +
      '</div>';
    }).join('');
    openModal('<div class="modal-card">' +
      '<h3>清空抽烟记录</h3>' +
      '<p class="muted-sm">按天清空。删的是这一天的全部记录（含「忍一次」），删完不可恢复。</p>' +
      '<div class="cc-list">' + (rows || '<div class="empty-box">还没有任何记录。</div>') + '</div>' +
      '<div class="modal-actions"><span class="spacer"></span>' +
        '<button type="button" class="btn ghost" data-act="close-modal">关闭</button></div>' +
    '</div>');
  }

  /* 买烟记录列表：最新在上。每行带状态，抽完的显示「这包从拆到抽完用了多久」。
     v107 起折叠：收起只看最近 5 条，展开每次多 20 条。
     条数是「包」为单位——一包一行，不是一支一行。 */
  const PACK_FOLD = 5, PACK_PAGE = 20;
  function quitPacksPanel(h) {
    const spans = packSpans(h);
    const cur = currentSpan(h);
    const curId = cur && !cur.done ? String(cur.pack.id) : '';
    const now = Math.round(Date.now() / 1000);
    const all = spans.slice().reverse();
    const total = all.length;
    const shown = total <= PACK_FOLD ? total
      : (quitPackOpen ? Math.min(total, Math.max(PACK_FOLD, quitPackShown)) : PACK_FOLD);
    const rows = all.slice(0, shown).map(function (sp) {
      const p = sp.pack;
      const isCur = String(p.id) === curId;
      const stocking = !sp.done && sp.openAt > now;
      let st, stCn, meta;
      if (sp.done) {
        st = 'done'; stCn = '已抽完';
        meta = sp.size + '/' + sp.size + ' 支 · 抽了 ' + packSpanTextOf(sp);
      } else if (stocking) {
        st = 'stock'; stCn = '库存';
        meta = sp.size + ' 支 · 还没拆';
      } else {
        st = 'live'; stCn = '在抽';
        meta = sp.used + '/' + sp.size + ' 支 · 还剩 ' + (sp.size - sp.used) + ' 支';
      }
      return '<div class="qpack' + (isCur ? ' cur' : '') + '">' +
        '<div class="qpack-main">' +
          /* 不再挂「当前」小标签：状态标签里的「在抽」已经是这个意思，
             两个并排看着像两条不同的信息。靠 .qpack.cur 的边框做高亮就够了。 */
          '<b>' + esc(p.name || '未命名') +
            '<i class="qpack-st ' + st + '">' + stCn + '</i>' +
          '</b>' +
          '<small>' + tsDay(p.at).slice(5) + ' ' + tsHHMM(p.at) + ' 买' +
            ' · ' + (p.price ? '¥' + p.price : '未填价格') +
            ' · ' + meta + '</small>' +
        '</div>' +
        '<button class="icon-btn" data-act="pack-edit" data-id="' + p.id + '" title="编辑">✎</button>' +
        '<button class="icon-btn danger" data-act="pack-del" data-id="' + p.id + '" title="删除">🗑</button>' +
      '</div>';
    }).join('');
    const rest = total - shown;
    /* 折叠条：总数在左，动作在右。收起时写「只看最近 5 条」，
       展开时写「已显示 X / N」——都是事实陈述，不用「展开/收起」这种动词当主文案。 */
    const fold = total <= PACK_FOLD ? '' :
      '<button type="button" class="qpack-fold' + (quitPackOpen ? ' open' : '') + '"' +
        ' data-act="pack-fold" aria-expanded="' + (quitPackOpen ? 'true' : 'false') + '">' +
        '<span>共 ' + total + ' 条 · ' + (quitPackOpen ? '已显示 ' + shown + ' 条' : '只看最近 ' + PACK_FOLD + ' 条') + '</span>' +
        '<i>⌄</i>' +
      '</button>';
    const more = (quitPackOpen && rest > 0)
      ? '<button type="button" class="qpack-more" data-act="pack-more">再显示 ' +
          Math.min(PACK_PAGE, rest) + ' 条（还剩 ' + rest + ' 条）</button>'
      : '';
    return '<div class="panel"><h3>买烟记录 <button class="btn primary sm" data-act="pack-new">记一笔</button></h3>' +
      fold +
      '<div class="qpack-list">' + (rows || '<div class="empty-box">还没有买烟记录，点右上角「记一笔」。</div>') + '</div>' +
      more + '</div>';
  }
  function packModal(pack) {

    openModal('<form class="modal-card" id="pack-form" data-id="' + esc(p.id || '') + '">' +

  function savePackForm(form) {
    const id = form.dataset.id || '';
    const get = function (n) {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const date = get('date');
    const time = get('time');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('请选一个买烟日期'); return; }
    if (!/^\d{2}:\d{2}$/.test(time)) { toast('请填一个买烟时间'); return; }
    /* 日期只到天，同一天买两包会撞成同一个时刻；加上时分才分得清先后 */
    const at = Math.round(parseD(date).getTime() / 1000) +
      (Number(time.slice(0, 2)) * 60 + Number(time.slice(3, 5))) * 60;
    const name = get('name');
    const price = Math.max(0, Math.min(99999, Number(get('price')) || 0));
    const size = clamp(parseInt(get('size'), 10) || 20, 1, 50);
    if (!Array.isArray(state.packs)) state.packs = [];
    if (id) {
      const p = state.packs.find(function (x) { return x.id === id; });
      if (p) {
        /* 支数一改，「末支是哪一支」就变了，旧的抽完确认作废 */
        if (Number(p.size) !== size) p.cf = 0;
        p.at = at; p.name = name; p.price = price; p.size = size;
      }
    } else {
      state.packs.push({ id: uid(), at: at, name: name, price: price, size: size });
    }
    /* at 主键 + id 次键：同一分钟买两包时，两端算出来的顺序必须一致 */
    state.packs.sort(function (a, b) {
      return (Number(a.at) - Number(b.at)) || String(a.id).localeCompare(String(b.id));
    });
    save();
    render();
    closeModal();
    toast('买烟记录已保存');
  }

  function backfillModal(ds) {

    if (!h) return;

    if (left <= 0) { toast('昨天没有可补的余量'); return; }

    openModal('<form class="modal-card" id="backfill-form" data-ds="' + ds + '">' +

        (have ? '当天已经记了 ' + have + ' 条。' : '当天还没有任何记录。') + '</p>' +
      '<div class="form-grid">' +

      '</div>' +

      '<div class="modal-actions"><span class="spacer"></span>' +

  function saveBackfillForm(form) {
    const ds = form.dataset.ds || '';
    const h = quitHabit();
    if (!h || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
    /* 只补昨天。挡住改 data-ds 的越界调用 */
    if (ds !== fmt(addDays(new Date(), -1))) { toast('只能补昨天'); return; }
    const left = backfillLeft(h, ds);
    const rawSmoke = parseInt((form.querySelector('[name="smoke"]') || {}).value, 10) || 0;
    const resistN = clamp(parseInt((form.querySelector('[name="resist"]') || {}).value, 10) || 0, 0, 60);
    if (rawSmoke < 0) { toast('支数不能是负数'); return; }
    if (rawSmoke > left) { toast('这天最多补 ' + left + ' 支'); return; }
    if (!rawSmoke && !resistN) { toast('两个都填 0，没有要补的'); return; }
    const times = backfillSlots(h, ds, rawSmoke + resistN);
    if (!Array.isArray(state.cravings)) state.cravings = [];
    for (let i = 0; i < rawSmoke; i++) {
      state.cravings.push({ id: uid(), t: times[i], k: 's', h: h.id, g: '', s: 0 });
    }
    for (let i = 0; i < resistN; i++) {
      state.cravings.push({ id: uid(), t: times[rawSmoke + i], k: 'r', h: h.id, g: '', s: 0 });
    }
    /* 槽位是散着给的，整体排一遍，区间算法要拿有序列 */
    state.cravings.sort(function (a, b) { return Number(a.t) - Number(b.t); });
    save();
    render();
    closeModal();
    const parts = [];
    if (rawSmoke) parts.push(rawSmoke + ' 支');
    if (resistN) parts.push(resistN + ' 次忍');
    toast('已补记 ' + parts.join(' · '));
  }
