      const gapText = lastAt
        ? (need ? '该喝水了 · 已隔 ' + gapTxt
                : '上次 ' + pad2(lastAt.getHours()) + ':' + pad2(lastAt.getMinutes()) + ' · 已隔 ' + gapTxt)
        : (today && !done ? '今天还没喝，先来一杯' : '');
      const pace = (today && !done) ? waterPaceText(h, c) : '';
      body = '<div class="water-steps">' + steps.join('') + '</div>' +
        (gapText ? '<div class="water-gap' + gapCls + '">' + gapText + '</div>' : '') +
        waterDistHtml(h, d) +
        (pace ? '<div class="water-pace">' + pace + '</div>' : '');
      const btnText = c === wN - 1 ? '＋ 最后一杯 ' + lastMl + ' ml' : '＋ 一杯 ' + wPer + ' ml';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">' + btnText + '</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>−</button>';
    } else {
      status = done ? '已完成' : (c > 0 ? c + ' / ' + target : '还没开始');
      sub = done ? (today ? '今天的运动完成了' : '这一天完成了') + streakText : '目标 ' + target + ' ' + unit + streakText;
      body = '<div class="vital-progress"><i style="width:' + Math.min(100, c / target * 100) + '%"></i></div>';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">' + (target > 1 ? '完成一次' : '完成运动') + '</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>';
    }

    return '<article class="vital-card' + (done ? ' is-done' : '') + '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '✅') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>' +
          (kind === 'med' ? '每天 ' + target + ' 次 · ' + times.join(' / ')
            : kind === 'water' ? '每天 ' + wN + ' ' + unit + ' · 共 ' + wGoal + ' ml'
            : '每天 ' + target + ' ' + unit) +
        '</small></div>' +
        (kind === 'water' ? waterWeekHtml(h) : '') +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="vital-status">' + status + '</div>' +
      '<div class="vital-sub">' + sub + '</div>' +
      body +
      '<div class="vital-actions">' + actions + '</div>' +
    '</article>';
  }

  function medCard(h, d) {
    const sched = medScheduledFor(d);
    const total = sched.length;
    const taken = medTakenCount(d);
    const done = total > 0 && taken >= total;
    const next = medNextDose(d);
    const activeMeds = (state.meds || []).filter(m => !isPrn(m) && medActiveOn(m, d));
    const prnMeds = (state.meds || []).filter(m => m.status === 'active' && isPrn(m));
    const low = (state.meds || [])
      .filter(m => m.status === 'active' && !isPrn(m))
      .map(m => ({ m: m, days: medStockDays(m) }))
      .filter(x => x.days !== null && x.days <= 3)
      .sort((a, b) => a.days - b.days)[0];

    let status, sub, actions;
    if (done) {
      status = d === todayStr() ? '今日已完成' : '当日已完成';
      sub = '全部 ' + total + ' 次已记录';
    } else if (total > 0) {
      status = taken + ' / ' + total + ' 次';
      if (next) {
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        const nextMin = Number(next.slot.slice(0, 2)) * 60 + Number(next.slot.slice(3, 5));
        const late = d === todayStr() && nowMin > nextMin;
        sub = (d === todayStr() ? (late ? '该服 ' + next.slot + ' 的药了' : '下次 ' + next.slot) : '补记 ' + next.slot) + ' · ' + next.med.name;
      } else {
        sub = '还有 ' + (total - taken) + ' 次';
      }
    } else if (prnMeds.length) {
      status = '按需用药';
      sub = '需要时记录，不计入完成率';
    } else {
      status = '暂无用药';
      sub = '还没有正在服用的药';
    }

    /* 规格统一：用药 ≥2 种时主按钮让给「查看全部」，记录仍保留为次按钮（一键记下一顿不丢） */
    const medCount = new Set(sched.map(x => x.med.id)).size;
    if (medCount >= 2) {
      actions = '<button class="vital-btn primary" data-nav="meds">查看详细</button>' +
        (next ? '<button class="vital-btn ghost" data-act="med-next">记录 ' + next.slot + '</button>'
              : '<button class="vital-btn ghost" disabled>已完成</button>');
    } else if (total > 0 && next) {
      actions = '<button class="vital-btn primary" data-act="med-next">记录 ' + next.slot + '</button>' +
        '<button class="vital-btn ghost" data-act="med-open">全部</button>';
    } else if (done) {
      actions = '<button class="vital-btn primary" disabled>已完成</button>' +
        '<button class="vital-btn ghost" data-act="med-open">查看</button>';
    } else if (prnMeds.length) {
      actions = '<button class="vital-btn primary" data-act="med-open">打开用药</button>';
    } else {
      actions = '<button class="vital-btn primary" data-act="med-new">添加用药</button>';
    }

    const progress = total ? Math.min(100, taken / total * 100) : 0;
    const titleSmall = total > 0
      ? (activeMeds.length + prnMeds.length) + ' 种药'
      : (prnMeds.length ? '按需用药' : '暂无用药');

    /* 今日用药清单：每种药 → 剂量 · 饭前/饭后+间隔 · 第几天 · 各时段打卡 */
    const groups = [];
    const gmap = {};
    sched.forEach(x => {
      if (!gmap[x.med.id]) {
        gmap[x.med.id] = { med: x.med, slots: [] };
        groups.push(gmap[x.med.id]);
      }
      gmap[x.med.id].slots.push(x.slot);
    });
    const curMin = new Date().getHours() * 60 + new Date().getMinutes();
    const isTd = d === todayStr();
    groups.sort((a, b) => medSortFn(a.med, b.med));

    /* 时段胶囊：单药可点打卡；轮播里只做展示（打卡走「记录」按钮或详情页） */
    const slotChips = (g, tappable) => g.slots.map(slot => {
      const entry = doseAt(d, g.med.id, slot);
      const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
      const isNext = !entry && next && next.med.id === g.med.id && next.slot === slot;
      const late = !entry && isTd && curMin > slotMin;
      const cls = entry ? 'done' : ((isNext ? 'next ' : '') + (late ? 'late' : ''));
      if (!tappable) {
        return '<span class="med-mini is-static ' + cls + '">' + esc(slot) + (entry ? ' ✓' : '') + '</span>';
      }
      return '<button class="med-mini ' + cls + '" data-act="' + (entry ? 'med-undo' : 'med-take') +
        '" data-id="' + g.med.id + '" data-slot="' + esc(slot) +
        '" title="' + (entry ? '点击撤销 ' : '点击记录 ') + esc(slot) + '">' + esc(slot) + (entry ? ' ✓' : '') + '</button>';
    }).join('');

    const medMetaText = g => {
      const dose = Math.round((Number(g.med.doseAmount) || 1) * 100) / 100;
      const mealTxt = mealTimingText(g.med);
      return dose + ' ' + esc(g.med.doseUnit || '') + (mealTxt ? ' · ' + esc(mealTxt) : '');
    };

    let bodyHtml = '';
    if (groups.length >= 2) {
      /* 两种及以上：轮播卡——药名条 + 左右箭头，一次看一种，高度恒定 */
      if (medCardIdx >= groups.length) medCardIdx = 0;
      if (medCardIdx < 0) medCardIdx = groups.length - 1;
      const g = groups[medCardIdx];
      const dayTxt = medDayText(g.med, d);
      const tabs = groups.map((x, i) =>
        '<button type="button" class="med-tab' + (i === medCardIdx ? ' active' : '') +
          '" data-act="med-card-pick" data-idx="' + i + '">' + esc(medShortName(x.med.name)) + '</button>'
      ).join('');
      bodyHtml = '<div class="med-carousel">' +
        '<div class="med-tabs">' + tabs + '</div>' +
        '<div class="med-pane">' +
          '<button type="button" class="med-nav" data-act="med-card-prev" aria-label="上一种">‹</button>' +
          '<div class="med-pane-body">' +
            '<div class="med-pane-top"><b>' + esc(g.med.name) + '</b>' +
              '<i class="med-pane-pos">' + (medCardIdx + 1) + ' / ' + groups.length + '</i></div>' +
            '<div class="med-pane-meta">' + medMetaText(g) +
              (dayTxt ? ' · ' + esc(dayTxt) : '') + '</div>' +
            '<div class="med-line-slots">' + slotChips(g, false) + '</div>' +
          '</div>' +
          '<button type="button" class="med-nav" data-act="med-card-next" aria-label="下一种">›</button>' +
        '</div>' +
      '</div>';
    } else if (groups.length === 1) {
      /* 只有一种药：保持卡面直接打卡，不显示箭头和药名条 */
      const g = groups[0];
      const dayTxt = medDayText(g.med, d);
      bodyHtml = '<div class="med-today"><div class="med-line">' +
        '<div class="med-line-top">' +
          '<b>' + esc(g.med.name) + '</b>' +
          '<span>' + medMetaText(g) + '</span>' +
          (dayTxt ? '<i class="med-line-day">' + esc(dayTxt) + '</i>' : '') +
        '</div>' +
        '<div class="med-line-slots">' + slotChips(g, true) + '</div>' +
      '</div></div>';
    }
    const prnRow = prnMeds.length
      ? '<div class="med-prn-row">按需：' + prnMeds.map(m => esc(m.name)).join('、') + '</div>'
      : '';
    const listHtml = bodyHtml
      ? bodyHtml + prnRow
      : (prnRow ? '<div class="med-today">' + prnRow + '</div>' : '');

    return '<article class="vital-card med-card' + (done ? ' is-done' : '') + '" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">💊</span>' +
        '<div class="vital-title"><b>用药</b><small>' + esc(titleSmall) + '</small></div>' +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="vital-status">' + status + '</div>' +
      '<div class="vital-sub">' + esc(sub) + '</div>' +
      listHtml +
      (low ? '<div class="med-warn">' + esc(low.m.name) + (low.days <= 0 ? ' 已用完' : ' 仅够 ' + low.days + ' 天') + '</div>' : '') +
      '<div class="vital-progress"><i style="width:' + progress + '%"></i></div>' +
      '<div class="vital-actions">' + actions + '</div>' +
    '</article>';
  }

  function medSheetHtml(d) {
    const isToday = d === todayStr();
    const sched = medScheduledFor(d);
    const total = sched.length;
    const taken = medTakenCount(d);
    const next = isToday ? medNextDose(d) : null;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const dd = parseD(d);

    const groups = [];
    const map = {};
    sched.forEach(x => {
      if (!map[x.med.id]) {
        map[x.med.id] = { med: x.med, slots: [] };
        groups.push(map[x.med.id]);
      }
      map[x.med.id].slots.push(x.slot);
    });

    const groupHtml = groups.map(g => {
      const med = g.med;
      const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
      const stock = medStockLabel(med);
      const head = '<div class="med-item-head">' +
        '<span class="med-item-ico">💊</span>' +
        '<div class="med-item-title"><b>' + esc(med.name) + '</b><small>' +
          '每次 ' + dose + ' ' + esc(med.doseUnit || '') +
          (med.strength ? '（' + esc(med.strength) + '）' : '') +
          (med.purpose && med.purpose !== '其他' ? ' · ' + esc(med.purpose) : '') +
          (mealTimingText(med) ? ' · ' + esc(mealTimingText(med)) : '') +
          (med.manufacturer ? ' · ' + esc(med.manufacturer) : '') +
          ((med.medInfo || med.note) ? ' · ' + esc(med.medInfo || med.note) : '') +
          ' · ' + esc(medCourseLabelOn(med, d)) +
        '</small></div>' +
        (stock ? '<span class="med-item-stock">' + esc(stock) + '</span>' : '') +
      '</div>';
      const doses = g.slots.map(slot => {
        const entry = doseAt(d, med.id, slot);
        const isTaken = !!entry;
        const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
        const isNext = !!(next && next.med.id === med.id && next.slot === slot);
        const late = !isTaken && (!isToday || nowMin > slotMin);
        const cls = isTaken ? 'done' : ((isNext ? 'next ' : '') + (late ? 'late' : ''));
        return '<button class="med-dose ' + cls + '" data-act="' + (isTaken ? 'med-undo' : 'med-take') +
          '" data-id="' + med.id + '" data-slot="' + slot + '">' +
          slot + (isTaken ? ' ✓' : '') +
        '</button>';
      }).join('');
      return '<div class="med-item">' + head +
        '<div class="med-dose-row">' + doses + '</div>' +
      '</div>';
    }).join('');

    const prnMeds = (state.meds || []).filter(m => m.status === 'active' && isPrn(m));
    const prnHtml = prnMeds.map(med => {
      const keys = prnKeys(d, med.id);
      const times = keys.map(k => {
        const e = state.doses[d][med.id][k];
        const at = new Date(e.at);
        return isNaN(at.getTime()) ? '' : pad2(at.getHours()) + ':' + pad2(at.getMinutes());
      }).filter(Boolean);
      const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
      return '<div class="med-item med-prn">' +
        '<div class="med-item-head"><span class="med-item-ico">💊</span>' +
          '<div class="med-item-title"><b>' + esc(med.name) + '</b><small>按需 · 每次 ' + dose + ' ' + esc(med.doseUnit || '') +
            (med.note ? ' · ' + esc(med.note) : '') + '</small></div>' +
          (medStockLabel(med) ? '<span class="med-item-stock">' + esc(medStockLabel(med)) + '</span>' : '') +
        '</div>' +
        '<div class="med-prn-row">' +
          '<span class="med-prn-count">' + (isToday ? '今日' : '当日') + ' ' + keys.length + ' 次' +
            (times.length ? ' · ' + times.join(' / ') : '') + '</span>' +
          '<button class="med-dose next" data-act="med-prn" data-id="' + med.id + '">＋ 记一次</button>' +
          (keys.length ? '<button class="med-dose" data-act="med-prn-undo" data-id="' + med.id + '">撤销</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    const body = groupHtml + prnHtml;
    const headText = total > 0 ? taken + ' / ' + total + ' 次' : (prnMeds.length ? '按需用药' : '暂无计划');

    return '<div class="modal-card med-sheet" id="med-sheet">' +
      '<div class="med-sheet-head"><div><h3>' + (isToday ? '今日用药' : '当日用药') + '</h3>' +
        '<span class="muted-sm">' + dd.getFullYear() + ' 年 ' + (dd.getMonth() + 1) + ' 月 ' + dd.getDate() + ' 日 · ' + headText + '</span></div>' +
        '<button class="icon-btn" data-act="close-modal" title="关闭">✕</button>' +
      '</div>' +
      (body || '<div class="empty-box">这一天没有用药计划。可在设置 → 用药管理里添加。</div>') +
      '<div class="modal-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-act="close-modal">关闭</button></div>' +
    '</div>';
  }

  function taskRow(t, d) {
    const overdue = t.status !== 'done' && t.due && t.due < d;
    const tagColor = TAGS[t.tag] || TAGS['其他'];
    const repeat = taskRepeatLabel(t);
    return '<div class="task-row ' + (t.status === 'done' ? 'done' : '') + '">' +
      '<button class="check" data-act="task-toggle" data-id="' + t.id + '" data-date="' + d + '" aria-label="切换完成">✓</button>' +
      '<div class="task-row-main">' +
        '<div class="task-row-title">' + esc(t.title) + '</div>' +
        '<div class="task-row-meta">' +
          '<span class="tag" style="--tag:' + tagColor + '">' + esc(t.tag || '其他') + '</span>' +
          (repeat ? '<span class="repeat-badge">' + esc(repeat) + '</span>' : '') +
          '<span class="due ' + (overdue ? 'overdue' : '') + '">' + dueText(t) + '</span>' +
        '</div>' +
      '</div>' +
      '<button class="icon-btn" data-act="task-edit" data-id="' + t.id + '" aria-label="编辑任务">✎</button>' +
      '</div>';
  }

  function weekPanel() {
    const base = parseD(selectedDate);
    const dow = (base.getDay() + 6) % 7;
    const monday = addDays(base, -dow);
    const days = [];
    let recCount = 0, sum = 0, qualified = 0;
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const future = ds > todayStr();
      const pct = Math.round(st.ratio * 100);
      if (rec) { recCount++; sum += st.ratio; if (st.ratio >= 0.75) qualified++; }
      const dd = parseD(ds);
      days.push({ ds: ds, rec: rec, pct: pct, wd: WEEK_CN[dd.getDay()], num: dd.getDate(), future: future });
    }
    const avg = recCount ? Math.round(sum / recCount * 100) : 0;
    const title = (todayStr() >= days[0].ds && todayStr() <= days[6].ds) ? '本周' : '这一周';
    const strip = days.map(x => {
      const sel = x.ds === selectedDate;
      const h = x.rec ? Math.max(6, x.pct) : 2;
      return '<button class="wk' + (sel ? ' is-sel' : '') + (x.rec ? ' has-data' : '') + (x.future ? ' is-future' : '') + '"' +
        ' data-act="pick-week-day" data-date="' + x.ds + '"' + (x.future ? ' disabled' : '') +
        ' title="' + x.ds + ' · ' + (x.future ? '未来' : (x.rec ? '完成 ' + x.pct + '%' : '无记录')) + '">' +
        '<span class="wk-wd">' + x.wd + '</span>' +
        '<span class="wk-track"><i class="' + (x.rec ? '' : 'empty') + '" style="height:' + h + '%"></i></span>' +
        '<span class="wk-num">' + x.num + '</span>' +
        '</button>';
    }).join('');
    return '<section class="panel week-panel">' +
      '<div class="panel-head"><h3>' + title + '</h3><span class="muted-sm">' +
        days[0].ds.slice(5).replace('-', '/') + ' – ' + days[6].ds.slice(5).replace('-', '/') +
      '</span></div>' +
      '<div class="week-strip">' + strip + '</div>' +
      '<div class="week-foot">' +
        '<span>记录 <b>' + recCount + '</b> 天</span>' +
        '<span>平均 <b>' + (recCount ? avg + '%' : '—') + '</b></span>' +
        '<span>达标 <b>' + qualified + '</b> 天</span>' +
      '</div>' +
    '</section>';
  }

  function heroWeekPanel() {
    const base = parseD(selectedDate);
    const dow = (base.getDay() + 6) % 7;
    const monday = addDays(base, -dow);
    const days = [];
    let recCount = 0, sum = 0, qualified = 0;
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const pct = Math.round(st.ratio * 100);
      if (rec) { recCount++; sum += st.ratio; if (st.ratio >= 0.75) qualified++; }
      const dd = parseD(ds);
      days.push({ ds: ds, rec: rec, pct: pct, wd: WEEK_CN[dd.getDay()], num: dd.getDate() });
    }
    const avg = recCount ? Math.round(sum / recCount * 100) : 0;
    const title = (todayStr() >= days[0].ds && todayStr() <= days[6].ds) ? '本周' : '这一周';
    const range = days[0].ds.slice(5).replace('-', '/') + ' – ' + days[6].ds.slice(5).replace('-', '/');
    const strip = days.map(x => {
      const sel = x.ds === selectedDate;
      const h = x.rec ? Math.max(12, x.pct) + '%' : '6px';
      return '<span class="hw-day' + (sel ? ' is-sel' : '') + '">' +
        '<span class="hw-track"><i style="height:' + h + '"></i></span>' +
        '<span class="hw-wd">' + x.wd + '</span>' +
        '<span class="hw-num">' + x.num + '</span>' +
      '</span>';
    }).join('');
    return '<div class="hero-week" aria-hidden="true">' +
      '<div class="hw-stats">' +
        '<div class="hw-big"><b>' + (recCount ? avg + '%' : '—') + '</b><span>本周平均</span></div>' +
        '<div class="hw-meta">记录 ' + recCount + ' 天 · 达标 ' + qualified + ' 天</div>' +
      '</div>' +
      '<div class="hw-chart">' +
        '<div class="hw-head"><span>' + title + '</span><span>' + range + '</span></div>' +
        '<div class="hw-strip">' + strip + '</div>' +
      '</div>' +
    '</div>';
  }

  /* 右栏：本周概览 */
  function railWeekHtml() {
    const base = parseD(selectedDate);
    const dow = (base.getDay() + 6) % 7;
    const monday = addDays(base, -dow);
    const days = [];
    let rec = 0, sum = 0;
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      const s = dayStats(ds);
      const has = hasRecords(ds);
      if (has) { rec++; sum += s.ratio; }
      days.push({ ds: ds, has: has, pct: Math.round(s.ratio * 100), wd: WEEK_CN[parseD(ds).getDay()] });
    }
    const avg = rec ? Math.round(sum / rec * 100) : 0;
    const end = addDays(monday, 6);
    const range = (monday.getMonth() + 1) + '/' + monday.getDate() + '–' + (end.getMonth() + 1) + '/' + end.getDate();
    const bars = days.map(x => {
      const bar = x.has
        ? '<i style="height:' + Math.max(8, x.pct) + '%"></i>'
        : '<i class="none"></i>';
      return '<span class="rail-day' + (x.ds === selectedDate ? ' is-today' : '') + '">' +
        '<span class="rail-bar">' + bar + '</span>' +
        '<span class="rail-wd">' + x.wd + '</span>' +
      '</span>';
    }).join('');
    return '<section class="rail-card">' +
      '<div class="rail-head"><h3>本周概览</h3><span>' + range + '</span></div>' +
      '<div class="rail-week">' + bars + '</div>' +
      '<p class="rail-note">' + (rec ? rec + ' 天有记录 · 平均 ' + avg + '%' : '本周还没有记录') + ' · 灰色为无记录日</p>' +
    '</section>';
  }

  /* 右栏：下一次用药提醒 */
  function railRemindHtml() {
    const d = todayStr();
    const sched = medScheduledFor(d);
    if (!sched.length) {
      return '<section class="rail-card">' +
        '<div class="rail-head"><h3>下一次提醒</h3></div>' +
        '<p class="rail-empty">还没有用药排期。在「习惯与用药」里添加后会在这里提示。</p>' +
      '</section>';
    }
    const taken = medTakenCount(d);
    const next = medNextDose(d);
    const stocks = (state.meds || [])
      .filter(m => m.status === 'active' && !isPrn(m))
      .map(m => ({ m: m, days: medStockDays(m) }))
      .filter(x => x.days !== null)
      .sort((a, b) => a.days - b.days);
    const stockTxt = stocks.length ? ' · 库存 ' + stocks[0].days + ' 天' : '';
    if (!next) {
      return '<section class="rail-card">' +
        '<div class="rail-head"><h3>下一次提醒</h3><span>已完成</span></div>' +
        '<div class="rail-remind"><span class="rail-clock">✓</span><div>' +
          '<b>今日 ' + sched.length + ' 次已全部完成</b>' +
          '<small>共 ' + sched.length + ' 次排期' + stockTxt + '</small>' +
        '</div></div>' +
      '</section>';
    }
    return '<section class="rail-card">' +
      '<div class="rail-head"><h3>下一次提醒</h3><span>' + taken + '/' + sched.length + '</span></div>' +
      '<div class="rail-remind"><span class="rail-clock">⏰</span><div>' +
        '<b>' + next.slot + ' · ' + esc(next.med.name) + '</b>' +
        '<small>今天还差 ' + (sched.length - taken) + ' 次' + stockTxt + '</small>' +
      '</div></div>' +
    '</section>';
  }

  function viewToday() {
    const d = selectedDate;
    const isToday = d === todayStr();
    const st = dayStats(d);
    const pct = Math.round(st.ratio * 100);
    const dd = parseD(d);
    const streak = overallStreak();
    const pend = pendingTasks(d);
    const doneToday = liveTasks().filter(t => t.status === 'done' && t.doneAt === d);
    const visibleHabits = state.habits.filter(h => !isArchived(h));

    let sub;
    if (!visibleHabits.length) {
      sub = '还没有习惯，先去「习惯」页添加第一个吧。';
    } else if (!hasRecords(d)) {
      sub = isToday ? '今天还没有开始，从最简单的那一项开始。' : '这一天还没有记录，可以补记。';
    } else if (st.done === st.total) {
      sub = '全部完成，今天做得很好 🎉';
    } else {
      const missed = activeHabits(d).filter(h => !met(h, d)).map(h => h.name);
      sub = '还差 ' + missed.length + ' 项：' + missed.join('、');
    }

    const pinned = PINNED_IDS.map(id => visibleHabits.find(h => h.id === id)).filter(Boolean);
    const others = visibleHabits.filter(h => pinned.indexOf(h) < 0);
    let habitHtml, habitMeta;
    if (!visibleHabits.length) {
      habitHtml = '<div class="empty-box">还没有习惯。去「习惯」页添加「喝水」「运动」等，开始记录。</div>';
      habitMeta = '还没有习惯';
    } else {
      habitHtml =
        (pinned.length ? '<div class="vital-grid">' + pinned.map(h => h.med ? medCard(h, d) : vitalCard(h, d)).join('') + '</div>' : '') +
        (others.length ? '<div class="section-sub">其他习惯</div><div class="habit-grid">' + others.map(h => habitCard(h, d)).join('') + '</div>' : '');
      habitMeta = (pinned.length ? pinned.length + ' 项常驻' : '') +
        (others.length ? (pinned.length ? ' · ' : '') + others.length + ' 项其他' : '');
    }

    /* 待办列表：逾期单独成组置顶，今天到期超过 TODAY_REST_LIMIT 条折叠。
       逾期按「是否早于真正的今天」判定，补记历史某天时同样成立。 */
    const now = todayStr();
    const overdueList = pend.filter(t => t.due && t.due < now);
    const restList = pend.filter(t => !(t.due && t.due < now));
    const taskParts = [];
    if (overdueList.length) {
      taskParts.push(
        '<div class="today-group overdue">逾期 ' + overdueList.length + ' 条</div>' +
        overdueList.map(t => taskRow(t, d)).join('')
      );
    }
    if (restList.length) {
      if (overdueList.length) {
        taskParts.push('<div class="today-group">' + (isToday ? '今天到期 ' : '当日到期 ') + restList.length + ' 条</div>');
      }
      const shown = todayTasksOpen ? restList : restList.slice(0, TODAY_REST_LIMIT);
      taskParts.push(shown.map(t => taskRow(t, d)).join(''));
      if (restList.length > TODAY_REST_LIMIT) {
        taskParts.push(todayTasksOpen
          ? '<button class="today-more" data-act="today-collapse">收起，只看前 ' + TODAY_REST_LIMIT + ' 条</button>'
          : '<button class="today-more" data-act="today-expand">还有 ' + (restList.length - TODAY_REST_LIMIT) + ' 条，展开全部</button>');
      }
    }
    if (doneToday.length) {
      taskParts.push(
        '<div class="done-sep">已完成 ' + doneToday.length + ' 条</div>' +
        doneToday.map(t => taskRow(t, d)).join('')
      );
    }
    const taskHtml = taskParts.length
      ? taskParts.join('')
      : '<div class="empty-box">今天没有待办，享受空白的一天。</div>';

    const mood = (state.moods && state.moods[d]) || '';
    const moodPanel = '' +
      '<section class="panel mood-panel">' +
        '<div class="panel-head"><h3>' + (isToday ? '今日状态' : '当日状态') + '</h3><span class="muted-sm">' + (mood ? '已记录' : '选一个') + '</span></div>' +
        '<div class="mood-options">' +
          MOODS.map(m =>
            '<button class="mood ' + m.key + (mood === m.key ? ' active' : '') + '" data-act="set-mood" data-mood="' + m.key + '">' +
              '<span class="mood-e">' + m.emoji + '</span>' +
              '<span class="mood-l">' + m.label + '</span>' +
            '</button>'
          ).join('') +
        '</div>' +
        '<p class="mood-hint">' + (mood ? '点一次已选状态可以取消。' : '记录每天的心情，回看时会很有意义。') + '</p>' +
      '</section>';

    return '' +
      (isToday ? '' :
        '<div class="backfill-bar">' +
          '<span class="backfill-ico">📝</span>' +
          '<span>正在看 <b>' + (dd.getMonth() + 1) + ' 月 ' + dd.getDate() + ' 日</b> · 补记模式，改动会写进这一天</span>' +
          '<button type="button" class="backfill-today" data-act="date-today">回今天</button>' +
        '</div>') +
      '<div class="today-grid">' +
      '<div class="today-col">' +
        '<section class="hero">' +
          '<div class="hero-main">' +
            '<div class="hero-date">' +
              '<button class="hero-arrow" data-act="date-shift" data-delta="-1" aria-label="前一天">‹</button>' +
              '<span>' + dd.getFullYear() + ' 年 ' + (dd.getMonth() + 1) + ' 月 ' + dd.getDate() + ' 日 · 星期' + WEEK_CN[dd.getDay()] + '</span>' +
              '<button class="hero-arrow" data-act="date-shift" data-delta="1" aria-label="后一天"' + (isToday ? ' disabled' : '') + '>›</button>' +
              (isToday ? '<span class="hero-tag">今天</span>' : '<button class="hero-today" data-act="date-today">回到今天</button>') +
            '</div>' +
            '<h1>' + (isToday ? greet() : '补记') + ' · 完成 ' + st.done + '/' + st.total + ' 项</h1>' +
            '<p>' + esc(sub) + '</p>' +
            '<div class="hero-chips">' +
              '<span>🔥 连续达标 ' + streak + ' 天</span>' +
              '<span>📋 待办 ' + pend.length + ' 条</span>' +
            '</div>' +
          '</div>' +
          heroWeekPanel() +
          '<div class="hero-ring">' + ring(st.ratio, 116, 8, '#d8b25f', 'rgba(246,240,227,.14)') +
            '<div class="hero-pct"><b>' + pct + '%</b><small><span class="pct-long">' + (isToday ? '今日完成度' : '当日完成度') + '</span><span class="pct-short">' + (isToday ? '今日完成' : '当日完成') + '</span></small></div>' +
          '</div>' +
        '</section>' +

        '<div class="section-head"><h2>' + (isToday ? '今日打卡' : '当日打卡') + '</h2><span class="muted-sm">' + habitMeta + (visibleHabits.length ? ' · 点击打卡' : '') + (isToday ? '' : ' · 补记模式') + '</span></div>' +
        habitHtml +

        '<div class="section-head"><h2>' + (isToday ? '今日待办' : '当日待办') + '</h2><span class="muted-sm">' + pend.length + ' 条未完成</span></div>' +
        '<div class="task-list">' + taskHtml + '</div>' +

        '<form class="quick-add" id="quick-form">' +
          '<input name="title" maxlength="80" autocomplete="off" placeholder="＋ 添加一条' + (isToday ? '今日' : '当天') + '待办，回车保存">' +
          '<button class="btn primary" type="submit">添加</button>' +
        '</form>' +

        '<div class="today-rule" aria-hidden="true"></div>' +
        '<div class="today-lower">' +
          weekPanel() +
          moodPanel +
        '</div>' +
      '</div>' +
      '<aside class="rail">' +
        railRemindHtml() +
        '<div class="rail-sync" id="rail-sync"></div>' +
      '</aside>' +
      '</div>';
  }

  /* ============================================================
     看板视图
     ============================================================ */
  /* 右栏日期筛选：只存内存，不进 state（避免纯视图操作触发云保存） */
  let boardFilterDay = '';
  /* 双击展开的任务 id：视图状态，同样不进 state */
  const openTaskIds = new Set();
  /* 统计页「打卡时间」是否展开全部 */
  let statsLogOpen = false;
  /* 今日页「今天到期」列表是否展开全部（超过 TODAY_REST_LIMIT 条才出现按钮） */
  let todayTasksOpen = false;
  const TODAY_REST_LIMIT = 6;
  /* 待办页左栏筛选：日期快捷 + 标签 chips。三者同样是视图状态，不进 state。
     日期快捷（boardQuick）与右栏日历选日（boardFilterDay）互斥，二选一。 */
  let boardQuick = 'all';
  let boardTag = '';
  /* 体重折线图区间：0 = 全部 */
  let weightRange = 0;

  function boardDayLabel(ds) {
    const today = todayStr();
    if (ds === today) return '今天';
    if (ds === fmt(addDays(new Date(), 1))) return '明天';
    if (ds === fmt(addDays(new Date(), -1))) return '昨天';
    return Number(ds.slice(5, 7)) + ' 月 ' + Number(ds.slice(8, 10)) + ' 日';
  }

  function boardMdText(ds) {
    return Number(ds.slice(5, 7)) + '/' + Number(ds.slice(8, 10));
  }

  function boardMiniCalHtml() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    /* 周一起始：getDay() 0=周日，(x+6)%7 让周一=0 */
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    const total = new Date(y, m + 1, 0).getDate();
    const today = todayStr();
    const marks = {};
    liveTasks().forEach(t => {
      if (!t.due || t.status === 'done' || t.status === 'cancelled') return;
      marks[t.due] = (marks[t.due] || 0) + 1;
    });
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span class="bcal-d is-blank"></span>';
    for (let d = 1; d <= total; d++) {
      const ds = fmt(new Date(y, m, d));
      const cls = ['bcal-d'];
      if (marks[ds]) cls.push('has');
      if (ds === today) cls.push('is-today');
      if (ds === boardFilterDay) cls.push('on');
      cells += '<button class="' + cls.join(' ') + '" data-act="board-filter-day" data-day="' + ds + '"' +
        ' title="' + (marks[ds] || 0) + ' 条待处理">' + d + '</button>';
    }
    return '<div class="rail-card">' +
      '<div class="rail-head"><h3>' + (m + 1) + ' 月</h3><span>点日期筛选</span></div>' +
      '<div class="bcal">' +
        MONTH_CN.map(w => '<span class="bcal-wd">' + w + '</span>').join('') +
        cells +
      '</div>' +
    '</div>';
  }

  function boardUpcomingHtml() {
    const today = todayStr();
    const live = liveTasks().filter(t => (t.status === 'todo' || t.status === 'doing') && t.due);
    const over = live.filter(t => t.due < today).sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
    const days = [];
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(new Date(), i));
      const list = live.filter(t => t.due === ds);
      if (list.length) days.push({ ds, i, list });
    }
    const totalCount = over.length + days.reduce((s, g) => s + g.list.length, 0);
    const item = (t, withDate) => {
      const prio = PRIO[t.priority] || PRIO['中'];
      return '<button class="bup-i' + (t.due < today ? ' is-over' : '') + '" data-act="board-focus"' +
        ' data-id="' + t.id + '" title="' + esc(t.title) + '">' +
        '<i class="bd" style="--prio:' + prio + '"></i>' +
        '<span class="bt">' + (withDate ? '<span class="bmd">' + boardMdText(t.due) + '</span>' : '') + esc(t.title) + '</span>' +
      '</button>';
    };
    if (!totalCount) {
      return '<div class="rail-card">' +
        '<div class="rail-head"><h3>接下来 7 天</h3></div>' +
        '<div class="rail-empty">近 7 天没有到期的任务，可以先松一口气。</div>' +
      '</div>';
    }
    let html = '';
    if (over.length) {
      html += '<div class="bup-g"><b>已逾期</b><em>' + over.length + ' 条</em><i></i></div>' +
        over.map(t => item(t, true)).join('');
    }
    days.forEach(g => {
      const label = g.i === 0 ? '今天' : g.i === 1 ? '明天' : '周' + WEEK_CN[parseD(g.ds).getDay()];
      html += '<div class="bup-g"><b>' + label + '</b><em>' + g.list.length + ' 条</em><i></i></div>' +
        g.list.map(t => item(t, false)).join('');
    });
    return '<div class="rail-card">' +
      '<div class="rail-head"><h3>接下来 7 天</h3><span>' + totalCount + ' 条待办</span></div>' +
      '<div class="bup">' + html + '</div>' +
    '</div>';
  }

  /* 双击展开的任务详情：备注全文 + 元信息 */
  function taskDetailHtml(t) {
    const parts = [];
    if (t.note) parts.push('<div class="td-note">' + esc(t.note) + '</div>');
    const meta = [];
    if (t.due) {
      meta.push('截止 ' + t.due + (t.status === 'done' || t.status === 'cancelled' ? '' : '（' + dueText(t) + '）'));
    } else {
      meta.push('无期限');
    }
    meta.push('优先级 ' + (t.priority || '中'));
    const rep = taskRepeatLabel(t);
    if (rep) meta.push('重复 ' + rep);
    if (t.createdAt) meta.push('创建 ' + String(t.createdAt).slice(0, 10));
    if (t.status === 'done' && t.doneAt) meta.push('完成 ' + t.doneAt);
    parts.push('<div class="td-meta">' + meta.map(m => '<span>' + esc(m) + '</span>').join('') + '</div>');
    if (!t.archivedAt) {
      parts.push('<div class="td-acts">' +
        '<button type="button" class="td-btn" data-act="task-archive" data-id="' + t.id + '">归档</button>' +
      '</div>');
    }
    return parts.join('');
  }

  function taskCard(t) {
    const overdue = t.status !== 'done' && t.status !== 'cancelled' && t.due && t.due < todayStr();
    const tagColor = TAGS[t.tag] || TAGS['其他'];
    const prio = PRIO[t.priority] || PRIO['中'];
    const cancelled = t.status === 'cancelled';
    const repeat = taskRepeatLabel(t);
    return '<article class="task ' + (t.status === 'done' ? 'done' : '') + (cancelled ? ' cancelled' : '') +
        (openTaskIds.has(t.id) ? ' is-open' : '') + '" draggable="true" data-id="' + t.id +
        '" title="双击展开详情" style="--prio:' + prio + '">' +
      '<div class="task-top">' +
        '<span class="tag" style="--tag:' + tagColor + '">' + esc(t.tag || '其他') + '</span>' +
        (repeat ? '<span class="repeat-badge">' + esc(repeat) + '</span>' : '') +
        '<span class="prio" style="--prio:' + prio + '">' + esc(t.priority || '中') + '</span>' +
      '</div>' +
      '<h4>' + esc(t.title) + '</h4>' +
      (t.note ? '<p>' + esc(t.note) + '</p>' : '') +
      '<div class="task-foot">' +
        '<span class="due ' + (overdue ? 'overdue' : '') + '">' + dueText(t) + '</span>' +
        '<div class="task-btns">' +
          (!cancelled && t.status !== 'todo' ? '<button class="icon-btn" data-act="task-move" data-id="' + t.id + '" data-dir="-1" title="移到上一列">←</button>' : '') +
          (!cancelled && t.status !== 'done' ? '<button class="icon-btn" data-act="task-move" data-id="' + t.id + '" data-dir="1" title="移到下一列">→</button>' : '') +
          (cancelled ? '<button class="icon-btn" data-act="task-restore" data-id="' + t.id + '" title="恢复为待办">↩</button>' : '') +
          '<button class="icon-btn" data-act="task-edit" data-id="' + t.id + '" title="编辑">✎</button>' +
        '</div>' +
      '</div>' +
      '<div class="task-detail">' + taskDetailHtml(t) + '</div>' +
      '</article>';
  }

  function viewBoard() {
    const cols = [
      { key: 'todo', label: '待办', color: '#8a8f83', hint: '想到的事先放这里，拖动卡片可推进' },
      { key: 'doing', label: '进行中', color: '#b8893b', hint: '一次只推进一件事' },
      { key: 'done', label: '已完成', color: '#2f7d5c', hint: '完成的任务会收在这里' },
      { key: 'cancelled', label: '已取消', color: '#9c5a5a', hint: '把卡片拖到这一列即可取消，可随时恢复' }
    ];
    const doneCount = liveTasks().filter(t => t.status === 'done').length;
    const archCount = archivedTasks().length;
    const filt = boardFilterDay;

    /* 日期快捷 + 标签双重筛选。与右栏选日互斥：选了快捷就清掉选日，反之亦然。 */
    const nowStr = todayStr();
    const thisMonday = addDays(parseD(nowStr), -((parseD(nowStr).getDay() + 6) % 7));
    const weekStartStr = fmt(thisMonday);
    const weekEndStr = fmt(addDays(thisMonday, 6));
    const quickMatch = t => {
      if (boardQuick === 'today') return t.due === nowStr;
      if (boardQuick === 'overdue') return !!t.due && t.due < nowStr && t.status !== 'done' && t.status !== 'cancelled';
      if (boardQuick === 'week') return !!t.due && t.due >= weekStartStr && t.due <= weekEndStr;
      return true;
    };
    const tagMatch = t => !boardTag || (t.tag || '其他') === boardTag;
    const pass = t => (!filt || t.due === filt) && quickMatch(t) && tagMatch(t);

    const QUICKS = [['all', '全部'], ['today', '今天'], ['overdue', '逾期'], ['week', '本周']];
    const toolsHtml = '<div class="board-tools">' +
      QUICKS.map(q => '<button type="button" class="tag-chip' + (boardQuick === q[0] ? ' active' : '') +
        '" data-act="board-quick" data-quick="' + q[0] + '">' + q[1] + '</button>').join('') +
      '<span class="bt-sep"></span>' +
      '<button type="button" class="tag-chip' + (!boardTag ? ' active' : '') +
        '" data-act="board-tag" data-tag="">全部标签</button>' +
      Object.keys(TAGS).map(tag =>
        '<button type="button" class="tag-chip' + (boardTag === tag ? ' active' : '') +
          '" data-act="board-tag" data-tag="' + esc(tag) + '">' +
          '<i class="bt-dot" style="background:' + TAGS[tag] + '"></i>' + esc(tag) +
        '</button>').join('') +
    '</div>';
    const board = '<div class="board">' +
      cols.map(c => {
        const list = liveTasks().filter(t => t.status === c.key && pass(t));
        return '<section class="col" data-status="' + c.key + '">' +
          '<header class="col-head">' +
            '<span class="dot" style="background:' + c.color + '"></span>' +
            '<b>' + c.label + '</b>' +
            '<span class="col-count">' + list.length + '</span>' +
            '<button class="icon-btn add" data-act="task-new" data-status="' + c.key + '" title="在此列新建">＋</button>' +
          '</header>' +
          '<div class="col-body" data-status="' + c.key + '">' +
            list.map(taskCard).join('') +
            (list.length ? '' : '<button class="col-empty" data-act="task-new" data-status="' + c.key + '">' +
              '<span class="ce-plus">＋</span>' +
              '<span class="ce-main">' + (filt ? '这天没有' + c.label + '的任务' : '往这列加一条') + '</span>' +
              '<span class="ce-sub">' + (filt ? '换个日期看看，或直接新建' : esc(c.hint)) + '</span>' +
            '</button>') +
          '</div>' +
        '</section>';
      }).join('') +
    '</div>';
    return '' +
      '<div class="page-head">' +
        '<div><h2>待办</h2><p>拖动卡片切换状态，拖到右侧「归档」即收进历史；双击卡片展开详情；右键可在列内新建或在卡片上编辑。</p></div>' +
        '<div class="head-actions">' +
          (doneCount ? '<button class="btn ghost" data-act="clear-done">清理已完成</button>' : '') +
          '<button class="btn ghost" data-act="archive-open">归档' + (archCount ? ' ' + archCount : '') + '</button>' +
          '<button class="btn primary" data-act="task-new" data-status="todo">＋ 新建任务</button>' +
        '</div>' +
      '</div>' +
      '<div class="board-shell">' +
        '<div class="board-col-wrap">' +
          toolsHtml +
          (filt
            ? '<div class="board-filter">正在看 <b>' + boardDayLabel(filt) + '</b> 到期的任务' +
              '<button class="bf-clear" data-act="board-filter-clear" title="显示全部任务">✕</button></div>'
            : '') +
          board +
        '</div>' +
        '<aside class="board-rail">' + boardMiniCalHtml() + boardUpcomingHtml() +
          '<div class="arch-zone" data-arch="1">' +
            '<span class="az-ico">↓</span>' +
            '<b>拖到这里归档</b>' +
            '收进历史，随时可以找回' +
          '</div>' +
        '</aside>' +
      '</div>';
  }

  /* ============================================================
     日历视图
     ============================================================ */
  function monthMedPanel(y, m) {
    const meds = Array.isArray(state.meds) ? state.meds : [];
    if (!meds.length) return '<div class="empty-box">还没有用药记录。</div>';
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const rows = meds.map(med => {
      let scheduled = 0, taken = 0, prn = 0;
      const slots = medDoseSlots(med);
      for (let day = 1; day <= days; day++) {
        const ds = fmt(new Date(y, m, day));
        if (ds > now) break;
        if (isPrn(med)) {
          prn += prnKeys(ds, med.id).length;
          continue;
        }
        if (!medActiveOn(med, ds)) continue;
        slots.forEach(slot => {
          scheduled++;
          if (doseAt(ds, med.id, slot)) taken++;
        });
      }
      const rate = scheduled ? Math.round(taken / scheduled * 100) : 0;
      const paused = med.status !== 'active';
      const status = paused ? '已暂停' : (scheduled ? '' : '暂无排期');
      const count = isPrn(med)
        ? '按需 · ' + prn + ' 次'
        : (scheduled ? taken + ' / ' + scheduled + ' 次' : '—');
      return '<div class="mh med-mh">' +
        '<span class="habit-icon sm" style="--hc:#6f7f91">💊</span>' +
        '<div class="mh-main">' +
          '<div class="mh-top"><b>' + esc(med.name) + '</b><span>' + esc(count) + '</span></div>' +
          '<div class="mh-bar"><i style="width:' + (isPrn(med) ? 0 : rate) + '%"></i></div>' +
          '<small class="mh-extra">' + esc(medCourseLabel(med)) +
            (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
            (status ? ' · ' + esc(status) : '') +
          '</small>' +
        '</div>' +
      '</div>';
    }).filter(Boolean).join('');
    return rows || '<div class="empty-box">本月还没有用药数据。</div>';
  }

  /* 本月习惯的统计口径：只算「已经过去且当天有记录」的日子，
     未到的日期和空白日不进分母，否则月初数字永远很难看。
     日历页（本月小结）和统计页（本月习惯）共用这一份计算。 */
  /* 戒烟分析面板。只对 quit 习惯出现，没有戒烟习惯就完全不渲染。
     时段分布只数「抽了」——「想抽但忍住」的那个时段其实不是危险时段，
     混进去会把真正容易破防的点位稀释掉。 */
  function quitPanel(range) {
    const h = (state.habits || []).find(function (x) {
      return x && !x.archivedAt && isSmoke(x);
    });
    if (!h) return '';
    const streak = quitStreak(h), total = quitTotal(h), best = quitBest(h);
    const q = quitRange(h, range);
    const bins = craveHours(h.id);
    let max = 0;
    bins.forEach(function (n) { if (n > max) max = n; });
    const bars = bins.map(function (n, i) {
      if (!n) return '<i class="qh-bar zero" title="' + pad2(i) + ':00 · 0 次"></i>';
      const hp = max ? Math.max(4, Math.round(n / max * 100)) : 4;
      return '<i class="qh-bar' + (n === max ? ' on' : '') +
        '" style="height:' + hp + '%" title="' + pad2(i) + ':00 · ' + n + ' 次"></i>';
    }).join('');
    const peak = max ? bins.indexOf(max) : -1;
    const smokeN = q.smoke;
    /* 样本太少时「最容易破防」只是噪声——3 条记录里 1 条也能当峰值 */
    const peakText = peak < 0
      ? '还没有「抽了」的记录，时段图还看不出规律'
      : (smokeN < 5
          ? '记录还少（' + smokeN + ' 次），多记几次才看得出规律'
          : '最容易破防：<b>' + pad2(peak) + ':00–' + pad2((peak + 1) % 24) + ':00</b>');
    const trig = craveTriggers(h.id).slice(0, 3);
    const saved = quitSaved(h);
    /* 勋章墙：达成的点亮，没达成的写还差多少——「还差 3 天」比一个灰点更有推动力 */
    const miles = QUIT_MILESTONES.map(function (m) {
      const on = streak >= m;
      return '<div class="qmile-i' + (on ? ' on' : ' dim') + '">' +
        '<b>' + (QUIT_MILE_CN[m] || (m + ' 天')) + '</b>' +
        '<span>' + (on ? '已达成' : '还差 ' + (m - streak) + ' 天') + '</span></div>';
    }).join('');
    return '<div class="panel"><h3>戒烟分析 <span class="muted-sm">（累计）</span></h3>' +
      '<div class="cal-summary" style="margin:0">' +
        '<span>连续无烟 <b>' + streak + '</b> 天</span>' +
        '<span>累计 <b>' + total + '</b> 天</span>' +
        '<span>最长 <b>' + best + '</b> 天</span>' +
        '<span>抵御率 <b>' + (q.total ? Math.round(q.rate * 100) + '%' : '—') + '</b></span>' +
        (saved ? '<span>省了 <b>¥' + Math.round(saved.money) + '</b></span>' : '') +
      '</div>' +
      '<div class="qmile">' + miles + '</div>' +
      '<div class="qh-wrap"><div class="qh-bars">' + bars + '</div>' +
        '<div class="qh-axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>' +
      '</div>' +
      '<div class="crave-meta" style="margin:10px 0 0">' +
        '<span>' + peakText + '</span>' +
        '<span>近 ' + range + ' 天 抽 <b>' + q.smoke + '</b> · 忍 <b>' + q.resist + '</b></span>' +
      '</div>' +
      (trig.length
        ? '<div class="crave-meta" style="margin:6px 0 0">' +
            '<span class="crave-none">失守诱因</span>' +
            trig.map(function (t) { return '<span>' + esc(t.label) + ' <b>' + t.n + '</b></span>'; }).join('') +
          '</div>'
        : '') +
    '</div>';
  }

  function monthHabitsInfo(y, m) {
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    let rec = 0, best = 0, run = 0;

    for (let day = 1; day <= days; day++) {
      const ds = fmt(new Date(y, m, day));
      if (ds > now) break;
      if (hasRecords(ds)) rec++;
      if (dayQualified(ds)) {
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    }

    const rows = state.habits.filter(h => !h.optional && !isArchived(h)).map(h => {
      let hit = 0, total = 0, lapse = 0;
      const isQuit = h.type === 'quit';
      for (let day = 1; day <= days; day++) {
        const ds = fmt(new Date(y, m, day));
        if (ds > now) continue;
        /* 戒烟的有无记录看事件流，不看 checks——事件不写进 checks */
        const dayEv = isQuit ? dayCravings(h.id, ds) : null;
        if (isQuit ? !dayEv.length : !hasRecords(ds)) continue;
        total++;
        if (isQuit) {
          if (dayEv.some(function (e) { return e.k === 's'; })) lapse++;
          else hit++;
        } else if (met(h, ds)) {
          hit++;
        }
      }
      return { h: h, hit: hit, total: total, lapse: lapse, rate: total ? hit / total : 0 };
    });

    let bestRow = null, weakRow = null;
    rows.forEach(r => {
      if (!r.total) return;
      if (!bestRow || r.rate > bestRow.rate) bestRow = r;
      if (!weakRow || r.rate < weakRow.rate) weakRow = r;
    });

    return { rec: rec, best: best, rows: rows, bestRow: bestRow, weakRow: weakRow };
  }

  /* 本月习惯的逐条进度：统计页用 */
  function monthHabitRowsHtml(y, m) {
    const rows = monthHabitsInfo(y, m).rows;
    const html = rows.map(r => {
      const pct = Math.round(r.rate * 100);
      const num = r.h.type === 'quit'
        ? '保持 ' + r.hit + ' / ' + r.total + ' 天'
        : '达标 ' + r.hit + ' / ' + r.total + ' 天';
      return '<div class="mh" style="--hc:' + esc(r.h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(r.h.color || '#2f6f5e') + '">' + esc(r.h.icon || '✅') + '</span>' +
        '<div class="mh-main">' +
          '<div class="mh-top"><b>' + esc(r.h.name) + '</b><span>' + num + '</span></div>' +
          '<div class="mh-bar"><i style="width:' + pct + '%"></i></div>' +
          (r.h.type === 'quit' && r.lapse
            ? '<small class="mh-extra">' + (quitKindOf(r.h) === 'smoke' ? '点了 ' : '破戒 ') + r.lapse + ' 次</small>'
            : '') +
        '</div>' +
      '</div>';
    }).join('');
    return html || '<div class="empty-box">本月还没有习惯数据。</div>';
  }

  /* 日历页底部的三卡：小结 / 心情 / 体重 */
  function monthOverview(y, m) {
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const info = monthHabitsInfo(y, m);
    const rec = info.rec, best = info.best;
    const bestRow = info.bestRow, weakRow = info.weakRow;

    const statLine = rec
      ? (bestRow ? '最稳：<b>' + esc(bestRow.h.name) + '</b>（' + Math.round(bestRow.rate * 100) + '%）' : '')
      : '本月还没有记录，点日历里的任意一天可以补记。';

    const moodCounts = { sad: 0, ok: 0, happy: 0 };
    let moodDays = 0;
    for (let day = 1; day <= days; day++) {
      const ds = fmt(new Date(y, m, day));
      if (ds > now) break;
      const mv = state.moods && state.moods[ds];
      if (mv && Object.prototype.hasOwnProperty.call(moodCounts, mv)) {
        moodCounts[mv]++;
        moodDays++;
      }
    }
    const moodMax = Math.max(1, moodCounts.sad, moodCounts.ok, moodCounts.happy);
    const moodRows = MOODS.map(m => {
      const n = moodCounts[m.key];
      return '<div class="mstat ' + m.key + '">' +
        '<div class="mstat-top"><span>' + m.emoji + ' ' + m.label + '</span><b>' + n + ' 天</b></div>' +
        '<div class="mstat-bar"><i style="width:' + Math.round(n / moodMax * 100) + '%"></i></div>' +
      '</div>';
    }).join('');

    return '' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月小结</h3>' +
        '<div class="cal-highlight"><b>' + best + '</b><span>天最长连续达标</span></div>' +
        '<p class="cal-note">' + statLine +
          (rec && weakRow && weakRow !== bestRow ? '<br>待加强：<b>' + esc(weakRow.h.name) + '</b>（' + Math.round(weakRow.rate * 100) + '%）' : '') +
        '</p>' +
        '<div class="cal-hint">达标 = 当天完成率 ≥ 75%；连续达标按天累计。</div>' +
      '</section>' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月心情</h3>' +
        '<div class="mstat-list">' + moodRows + '</div>' +
        '<div class="cal-hint">' + (moodDays ? '本月记录 ' + moodDays + ' 天心情' : '本月还没有心情记录，去今日页选一个。') + '</div>' +
      '</section>' +
      monthWeightSide(y, m);
  }

  function monthWeightSide(y, m) {
    const prefix = y + '-' + pad2(m + 1);
    const list = weightRecords().filter(w => String(w.date).indexOf(prefix) === 0 && w.date <= todayStr());
    if (!list.length) {
      return '<section class="panel cal-side-panel">' +
        '<h3>本月体重</h3>' +
        '<div class="empty-box">本月还没有体重记录。</div>' +
        '<div class="cal-hint">去「体重」页记录一次，这里会显示变化。</div>' +
      '</section>';
    }
    const latest = list[list.length - 1];
    const first = list[0];
    const info = bmiCategory(latest.bmi);
    const diff = Math.round((latest.weight - first.weight) * 10) / 10;
    const delta = diff === 0 ? '持平' : (diff > 0 ? '+' : '') + diff + ' kg';
    return '<section class="panel cal-side-panel">' +
      '<h3>本月体重</h3>' +
      '<div class="cal-highlight weight-month"><b>' + esc(latest.weight) + '</b><span>kg · BMI ' + esc(latest.bmi) + ' ' + esc(info.label) + '</span></div>' +
      '<p class="cal-note">记录 ' + list.length + ' 次 · 较本月首次 ' + delta + '</p>' +
      '<div class="cal-hint">最近一次 ' + esc(latest.date) + (latest.age < 18 ? ' · 未成年 BMI 仅参考' : '') + '</div>' +
    '</section>';
  }

  /* 某一天到期的待办（月视图格子用）。
     口径与「今日待办」不同：这里只要 due 正好是这一天，不看是否已逾期。
     排序按「优先级 → 开始时间」，让格子里优先露出最要紧的两条。 */
  function dayTasks(ds) {
    const rank = { '高': 0, '中': 1, '低': 2 };
    const list = liveTasks().filter(t =>
      t.due === ds && t.status !== 'done' && t.status !== 'cancelled');
    list.sort((a, b) => {
      const ra = rank[a.priority] === undefined ? 1 : rank[a.priority];
      const rb = rank[b.priority] === undefined ? 1 : rank[b.priority];
      if (ra !== rb) return ra - rb;
      return String(a.startTime || '99:99').localeCompare(String(b.startTime || '99:99'));
    });
    return list;
  }

  /* 格子里只放得下很短一行，超长的截断 */
  function calTaskTitle(v) {
    const txt = String(v || '').trim();
    return txt.length > 8 ? txt.slice(0, 8) + '…' : txt;
  }

  /* ============ 周视图 ============
     0:00–24:00 的时间线。同一时刻的同类条目合并成一块（不然 08:00 十一个药
     会挤成十一条线），点开看清单。数据全部是现算的，没有新增存储。 */

  const WK_HOUR_H = 44;        /* 每小时 44px，24 小时共 1056px */

  /* 那一周的周一（周日 getDay()=0，要往前回 6 天） */
  function weekStartOf(d) {
    const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return addDays(base, -((base.getDay() + 6) % 7));
  }

  function hhmmMin(v) {
    const s = String(v || '');
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(s)) return -1;
    return Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  }

  /* 某条待办是否「命中」这一天。单次看 due，重复按规则展开
     ——周视图要能看到「每周一的例会」，否则未来几周全是空的。
     规则与 nextRepeatDate 保持一致（weekly 用 0-6，monthly 取当月最后一天兜底）。 */
  function taskHitsDay(t, ds) {
    if (!t || t.archivedAt || t.status === 'done' || t.status === 'cancelled') return false;
    const repeat = ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none';
    if (repeat === 'none') return t.due === ds;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.due || ''))) return false;
    if (ds < t.due) return false;
    const d = parseD(ds);
    if (repeat === 'daily') return true;
    if (repeat === 'weekly') {
      return d.getDay() === clamp(Number(t.repeatWeekday) || 0, 0, 6);
    }
    const md = clamp(Number(t.repeatDay) || 1, 1, 31);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(md, last);
  }

  /* 一天里的所有安排：blocks 是有时间的，allday 是没时间的待办 */
  function weekDayBlocks(ds) {
    const blocks = [];
    const allday = [];

    /* 待办：填了开始时间才画时间块，否则进「全天」行 */
    (state.tasks || []).forEach(t => {
      if (!taskHitsDay(t, ds)) return;
      const st = String(t.startTime || '');
      const title = String(t.title || '待办');
      if (hhmmMin(st) < 0) {
        allday.push({ kind: 'task', title: title, items: [t] });
        return;
      }
      const dur = (Number(t.duration) >= 15 && Number(t.duration) <= 720) ? Number(t.duration) : 30;
      blocks.push({ startMin: hhmmMin(st), durMin: dur, kind: 'task', title: title, done: false });
    });

    /* 用药：每个服药时刻 15 分钟（和日历订阅的约定一致） */
    medScheduledFor(ds).forEach(it => {
      blocks.push({
        startMin: hhmmMin(it.slot), durMin: 15, kind: 'med',
        title: String(it.med.name || '药'), done: !!doseAt(ds, it.med.id, it.slot)
      });
    });

    /* 习惯：跳过用药占位卡；按通知频率决定这天要不要出现 */
    activeHabits(ds).forEach(h => {
      if (h.med) return;
      const st = String(h.suggestTime || '');
      if (hhmmMin(st) < 0) return;
      const freq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
      const d = parseD(ds);
      if (freq === 'weekly' && d.getDay() !== clamp(Number(h.notifyWeekday) || 1, 0, 6)) return;
      if (freq === 'monthly') {
        const md = clamp(Number(h.notifyMonthday) || 1, 1, 31);
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        if (d.getDate() !== Math.min(md, last)) return;
      }
      blocks.push({
        startMin: hhmmMin(st), durMin: 30, kind: 'habit',
        title: String(h.name || '习惯'), done: countOf(ds, h.id) > 0
      });
    });

    /* 同一时刻 + 同一类型合并成一块：08:00 十一个药 → 「用药 ×11」 */
    const merged = {};
    blocks.forEach(b => {
      const key = b.startMin + '|' + b.kind;
      if (!merged[key]) {
        merged[key] = { startMin: b.startMin, durMin: b.durMin, kind: b.kind,
                        titles: [], count: 0, finished: 0 };
      }
      merged[key].titles.push(b.title);
      merged[key].count++;
      if (b.done) merged[key].finished++;
      if (b.durMin > merged[key].durMin) merged[key].durMin = b.durMin;
    });

    const list = Object.keys(merged).map(k => merged[k])
      .sort((a, b) => a.startMin - b.startMin || a.kind.localeCompare(b.kind));

    /* 碰撞就往下挪：块是绝对定位的，两个同起点的块叠在一起会互相遮住 */
    const placed = [];
    list.forEach(b => {
      let top = (b.startMin / 60) * WK_HOUR_H;
      const h = Math.max(18, (b.durMin / 60) * WK_HOUR_H);
      let guard = 0;
      while (guard < 60) {
        const hit = placed.find(p => top < p.bottom && top + h > p.top);
        if (!hit) break;
        top = hit.bottom + 1;
        guard++;
      }
      placed.push({ top: top, bottom: top + h });
      b.top = Math.round(top);
      b.height = Math.round(h);
    });

    return { blocks: list, allday: allday };
  }

  const WK_KIND_CN = { med: '用药', task: '待办', habit: '习惯' };

  function calTabsHtml() {
    return '<div class="cal-tabs">' +
      '<button class="cal-tab' + (calMode === 'month' ? ' active' : '') + '" data-act="cal-mode" data-mode="month">月</button>' +
      '<button class="cal-tab' + (calMode === 'week' ? ' active' : '') + '" data-act="cal-mode" data-mode="week">周</button>' +
    '</div>';
  }

  function viewWeek() {
    const ws = weekStartOf(calWeek);
    const today = todayStr();
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const days = [];
    let taskCount = 0, medCount = 0;

    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const ds = fmt(d);
      const data = weekDayBlocks(ds);
      data.blocks.forEach(b => {
        if (b.kind === 'task') taskCount += b.count;
        if (b.kind === 'med') medCount += b.count;
      });
      taskCount += data.allday.length;
      days.push({ date: ds, d: d, data: data });
    }

    const we = addDays(ws, 6);
    /* 同一个月就只写一次月份，手机上才不会折成两行 */
    const rangeText = (ws.getMonth() === we.getMonth())
      ? (ws.getMonth() + 1) + '月' + ws.getDate() + '–' + we.getDate() + '日'
      : (ws.getMonth() + 1) + '月' + ws.getDate() + '日 – '
        + (we.getMonth() + 1) + '月' + we.getDate() + '日';

    /* 顶部日期条 */
    let head = '<div class="wk-gutter wk-gutter-head"></div>';
    days.forEach(day => {
      const isToday = day.date === today;
      const isFuture = day.date > today;
      head += '<div class="wk-day' + (isToday ? ' is-today' : '') + (isFuture ? ' is-future' : '') + '">' +
        '<span class="wk-wd">周' + WEEK_CN[day.d.getDay()] + '</span>' +
        '<b class="wk-num">' + day.d.getDate() + '</b>' +
      '</div>';
    });

    /* 全天行 */
    let allday = '<div class="wk-gutter wk-gutter-ad">全天</div>';
    days.forEach(day => {
      const list = day.data.allday;
      const shown = list.slice(0, 2);
      const rest = list.length - shown.length;
      allday += '<div class="wk-ad-cell">' +
        shown.map(t => '<button class="wk-ad-item" data-act="wk-open" data-date="' + day.date +
          '" data-kind="task" data-start="-1" title="' + esc(t.title) + '">' + esc(t.title) + '</button>').join('') +
        (rest > 0 ? '<span class="wk-ad-more">+' + rest + '</span>' : '') +
      '</div>';
    });

    /* 时间刻度 + 7 列 */
    let gutter = '';
    for (let h = 0; h < 24; h++) {
      gutter += '<div class="wk-hour">' + pad2(h) + ':00</div>';
    }

    let cols = '';
    days.forEach(day => {
      let slots = '';
      for (let h = 0; h < 24; h++) slots += '<div class="wk-slot"></div>';
      const evs = day.data.blocks.map(b => {
        const label = b.count > 1
          ? WK_KIND_CN[b.kind] + ' ×' + b.count
          : b.titles[0];
        const cls = 'wk-ev wk-ev-' + b.kind + (b.finished >= b.count ? ' is-done' : '');
        return '<button class="' + cls + '" style="top:' + b.top + 'px;height:' + b.height + 'px"' +
          ' data-act="wk-open" data-date="' + day.date + '" data-kind="' + b.kind + '"' +
          ' data-start="' + b.startMin + '" title="' + esc(b.titles.join('、')) + '">' +
          '<b>' + esc(label) + '</b>' +
        '</button>';
      }).join('');
      /* 今天那条红线，让人一眼看到现在几点了 */
      const nowLine = day.date === today
        ? '<span class="wk-now" style="top:' + Math.round((nowMin / 60) * WK_HOUR_H) + 'px"></span>'
        : '';
      cols += '<div class="wk-col' + (day.date === today ? ' is-today' : '') + '">' +
        slots + evs + nowLine +
      '</div>';
    });

    return {
      head: '<div class="page-head">' +
        '<div><h2>日历</h2><p>月视图看完成度与待办，周视图看每天几点有什么事。点任意一块可以看细节。</p></div>' +
      '</div>',
      panel: '<div class="panel cal-wrap">' +
        '<div class="cal-top">' +
          '<div class="month-nav">' +
            calTabsHtml() +
            '<button class="arrow" data-act="week-shift" data-delta="-1" aria-label="上一周">‹</button>' +
            '<b>' + rangeText + '</b>' +
            '<button class="arrow" data-act="week-shift" data-delta="1" aria-label="下一周">›</button>' +
            '<button class="btn sm ghost" data-act="week-today">本周</button>' +
          '</div>' +
          '<div class="cal-summary">' +
            '<span>待办 <b>' + taskCount + '</b> 项</span>' +
            '<span>用药 <b>' + medCount + '</b> 次</span>' +
          '</div>' +
        '</div>' +
        '<div class="wk-scroll" id="wk-scroll">' +
          '<div class="wk-inner">' +
            '<div class="wk-head">' + head + '</div>' +
            '<div class="wk-allday">' + allday + '</div>' +
            '<div class="wk-body">' +
              '<div class="wk-gutter">' + gutter + '</div>' +
              '<div class="wk-cols">' + cols + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="wk-legend">' +
          '<span class="leg"><i class="wk-l-med"></i>用药</span>' +
          '<span class="leg"><i class="wk-l-task"></i>待办</span>' +
          '<span class="leg"><i class="wk-l-habit"></i>习惯</span>' +
          '<span class="leg-note">同一时刻同类型的条目会合并成一块（如「用药 ×11」），点开看全部</span>' +
          '<span class="leg-note wk-swipe-hint">左右滑动可看完整一周</span>' +
        '</div>' +
      '</div>'
    };
  }

  /* 两个视图共用底部三卡：底部卡看的是「正在浏览的那个月」，
     所以周视图翻到别的月份时，也要把 calMonth 跟着走（见 week-shift）。 */
  function viewCalendar() {
    const v = calMode === 'week' ? viewWeek() : viewMonth();
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    return v.head +
      '<div class="cal-layout">' + v.panel +
        '<div class="cal-cards">' + monthOverview(y, m) + '</div>' +
      '</div>';
  }

  function viewMonth() {
    const y = calMonth.getFullYear();
    const m = calMonth.getMonth();
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const ym = y + '-' + pad2(m + 1);
    const wmap = {};
    weightRecords().forEach(w => {
      if (String(w.date).indexOf(ym) === 0) wmap[w.date] = w;
    });

    let recorded = 0, sum = 0, qualified = 0;
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div class="cal-cell blank"></div>';

    for (let day = 1; day <= daysInMonth; day++) {
      const ds = fmt(new Date(y, m, day));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const future = ds > now;
      if (rec) {
        recorded++;
        sum += st.ratio;
        if (st.ratio >= 0.75) qualified++;
      }
      const pct = Math.round(st.ratio * 100);
      const level = future || !rec ? 0
        : pct >= 100 ? 4
        : pct >= 75 ? 3
        : pct >= 40 ? 2
        : pct > 0 ? 1 : 0;
      const moodKey = (state.moods && state.moods[ds]) || '';
      const moodInfo = MOOD_MAP[moodKey];
      const wr = wmap[ds];
      /* 待办：桌面显示最多 2 条标题，手机上 CSS 换成「N 项」 */
      const dt = dayTasks(ds);
      const dtShown = dt.slice(0, 2);
      const dtRest = dt.length - dtShown.length;
      const dtHtml = dt.length
        ? '<span class="cal-tasks">' +
            '<b class="cal-tasks-num">' + dt.length + ' 项</b>' +
            dtShown.map(x => '<i class="cal-task">' + esc(calTaskTitle(x.title)) + '</i>').join('') +
            (dtRest > 0 ? '<i class="cal-task-more">+' + dtRest + '</i>' : '') +
          '</span>'
        : '';

      cells += '<button class="cal-cell ' + (rec ? 'has-data' : '') + (ds === now ? ' is-today' : '') +
        (ds === selectedDate ? ' is-sel' : '') + (future ? ' is-future' : '') + (wr ? ' has-weight' : '') +
        '" data-level="' + level + '" data-act="pick-day" data-date="' + ds + '"' + (future ? ' disabled' : '') +
        ' title="' + ds + ' · 完成 ' + st.done + '/' + st.total + (rec ? '' : '（无记录）') +
          (moodInfo ? ' · 心情：' + moodInfo.label : '') +
          (wr ? ' · 体重 ' + wr.weight + ' kg · BMI ' + wr.bmi : '') +
          (dt.length ? ' · 待办 ' + dt.length + ' 项：' + dt.map(x => x.title).join('、') : '') + '">' +
        '<span class="cal-fill"></span>' +
        '<span class="cal-num">' + day + '</span>' +
        dtHtml +
        '<span class="cal-foot">' +
          (wr ? '<span class="cal-weight-dot" title="体重 ' + wr.weight + ' kg · BMI ' + wr.bmi + '"></span>' : '') +
          '<span class="cal-pct">' + (rec && !future ? pct + '%' : '') + '</span>' +
          (moodInfo ? '<span class="cal-mood" title="' + moodInfo.label + '">' + moodInfo.emoji + '</span>' : '') +
        '</span>' +
        '</button>';
    }

    const avg = recorded ? Math.round(sum / recorded * 100) : 0;

    return {
      head: '<div class="page-head">' +
        '<div><h2>日历</h2><p>颜色越深，当天完成度越高；格子里是当天到期的待办，右下角是心情。点击任意一天可以补记。</p></div>' +
      '</div>',
      panel: '<div class="panel cal-wrap">' +
        '<div class="cal-top">' +
          '<div class="month-nav">' +
            calTabsHtml() +
            '<button class="arrow" data-act="month-shift" data-delta="-1" aria-label="上个月">‹</button>' +
            '<b>' + y + ' 年 ' + (m + 1) + ' 月</b>' +
            '<button class="arrow" data-act="month-shift" data-delta="1" aria-label="下个月">›</button>' +
            '<button class="btn sm ghost" data-act="cal-today">本月</button>' +
          '</div>' +
          '<div class="cal-summary">' +
            '<span>记录 <b>' + recorded + '</b> 天</span>' +
            '<span>平均完成率 <b>' + (recorded ? avg + '%' : '—') + '</b></span>' +
            '<span>达标 <b>' + qualified + '</b> 天</span>' +
          '</div>' +
        '</div>' +
        '<div class="cal-wd-row">' +
          MONTH_CN.map(w => '<div class="cal-wd">' + w + '</div>').join('') +
        '</div>' +
        '<div class="cal-grid">' +
          cells +
        '</div>' +
        '<div class="cal-legend">' +
          '<span>完成度</span>' +
          '<span class="leg"><i class="l0"></i>0</span>' +
          '<span class="leg"><i class="l1"></i>1–39%</span>' +
          '<span class="leg"><i class="l2"></i>40–74%</span>' +
          '<span class="leg"><i class="l3"></i>75–99%</span>' +
          '<span class="leg"><i class="l4"></i>100%</span>' +
          '<span class="leg-note">≥ 75% 记为达标日；右下角小表情为当天心情</span>' +
        '</div>' +
      '</div>'
    };
  }

  /* ============================================================
     统计视图
     ============================================================ */
  /* 本月回顾：把「这个月整体怎么样」收成一张卡。
     只算已经过去的日子，未到的日期不参与统计，避免月初被低估。 */
  function monthReviewData() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const today = todayStr();
    const elapsed = now.getDate();

    const days = [];
    for (let i = 1; i <= elapsed; i++) days.push(fmt(new Date(y, m, i)));

    let recorded = 0, qualified = 0, best = 0, run = 0;
    days.forEach(d => {
      if (hasRecords(d)) recorded++;
      if (dayQualified(d)) {
        qualified++;
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    });
    const rate = rateOver(days);

    const first = days[0];
    const ws = weightRecords().filter(w => w.date >= first && w.date <= today);
    const wDelta = ws.length >= 2
      ? Math.round((ws[ws.length - 1].weight - ws[0].weight) * 10) / 10
      : null;

    let sched = 0, taken = 0;
    (state.meds || []).forEach(med => {
      if (isPrn(med)) return;
      const slots = medDoseSlots(med);
      if (!slots.length) return;
      days.forEach(d => {
        if (!medActiveOn(med, d)) return;
        slots.forEach(slot => {
          sched++;
          if (doseAt(d, med.id, slot)) taken++;
        });
      });
    });
    const adherence = sched ? Math.round(taken / sched * 100) : null;

    /* 与上月对比：上月可能一天都没达标（新用户），要单独措辞 */
    const prevLast = fmt(new Date(y, m, 0));
    let prevQualified = 0;
    for (let d = new Date(y, m - 1, 1); fmt(d) <= prevLast; d = addDays(d, 1)) {
      if (dayQualified(fmt(d))) prevQualified++;
    }
    let verdict;
    if (!prevQualified && !qualified) verdict = '这个月还没有达标记录，从今天记一笔开始。';
    else if (!prevQualified) verdict = '这个月已达标 ' + qualified + ' 天，上月没有达标记录。';
    else {
      const diff = qualified - prevQualified;
      verdict = diff > 0 ? '比上月多完成 ' + diff + ' 天。'
        : diff < 0 ? '比上月少完成 ' + Math.abs(diff) + ' 天。'
        : '与上月达标天数持平（' + qualified + ' 天）。';
    }

    return { elapsed, recorded, qualified, best, rate, wDelta, adherence, taken, sched, verdict, monthLabel: (m + 1) + ' 月' };
  }

  /* ---------- 用药依从率（按天，不是按区间汇总） ----------
     区间汇总（本月回顾里那个 adherence）只能回答「这个月怎么样」，
     回答不了「哪天漏了」「这个月比上个月好还是差」。 */
  function medAdherenceDay(d) {
    let sched = 0, taken = 0;
    (state.meds || []).forEach(med => {
      if (isPrn(med)) return;
      const slots = medDoseSlots(med);
      if (!slots.length) return;
      if (!medActiveOn(med, d)) return;          /* 当天没排期的药不算分母 */
      slots.forEach(slot => {
        sched++;
        if (doseAt(d, med.id, slot)) taken++;
      });
    });
    return { sched, taken, pct: sched ? Math.round(taken / sched * 100) : null };
  }

  function medAdherenceRange(days) {
    let sched = 0, taken = 0;
    days.forEach(d => {
      const r = medAdherenceDay(d);
      sched += r.sched;
      taken += r.taken;
    });
    return { sched, taken, pct: sched ? Math.round(taken / sched * 100) : null };
  }

  /* 本月 vs 上月「同期」——不是拿半截月份去比整月。
     上个月可能没有 31 号，所以取上月的实际天数。 */
  function medAdherenceMoM() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const passed = now.getDate();
    const thisDays = [];
    for (let i = passed - 1; i >= 0; i--) thisDays.push(fmt(addDays(now, -i)));
    const prevLen = new Date(y, m, 0).getDate();
    const prevDays = [];
    for (let i = 1; i <= Math.min(passed, prevLen); i++) {
      prevDays.push(fmt(new Date(y, m - 1, i)));
    }
    const a = medAdherenceRange(thisDays);
    const b = medAdherenceRange(prevDays);
    return { thisPct: a.pct, prevPct: b.pct, days: passed };
  }

  function medTrendPanel(range, rangeDays) {
    const cur = medAdherenceRange(rangeDays);
    const mom = medAdherenceMoM();

    let delta;
    if (cur.pct === null) {
      delta = '<span class="adh-note">这 ' + range + ' 天没有用药排期</span>';
    } else if (mom.prevPct === null) {
      delta = '<span class="adh-note">上月同期没有用药排期，无从比较</span>';
    } else {
      const diff = mom.thisPct - mom.prevPct;
      /* 头部只放结论。两个百分比的完整口径挪到下方说明里——
         全塞进头部后手机上会撑成三行，第一屏就看不见图了。 */
      const momTxt = '（' + mom.thisPct + '% / ' + mom.prevPct + '%）';
      delta = diff === 0
        ? '<span class="adh-delta">与上月同期持平' + momTxt + '</span>'
        : '<span class="adh-delta">' + (diff > 0 ? '↑ 比上月同期多 ' : '↓ 比上月同期少 ')
          + Math.abs(diff) + ' 个点' + momTxt + '</span>';
    }

    const labelStep = Math.max(1, Math.ceil(rangeDays.length / 10));
    const cols = rangeDays.map((ds, bi) => {
      const r = medAdherenceDay(ds);
      const has = r.sched > 0;
      const showLabel = (rangeDays.length - 1 - bi) % labelStep === 0;
      const label = showLabel ? String(parseD(ds).getDate()) : '';
      const h = has ? Math.max(4, r.pct) : 0;
      const cls = !has ? 'zero' : (r.pct >= 80 ? '' : 'low');
      return '<div class="bar-col' + (ds === todayStr() ? ' is-today' : '') + '" title="' + ds +
          (has ? ' 已服 ' + r.taken + '/' + r.sched + ' 次（' + r.pct + '%）' : ' 当天没有用药排期') + '">' +
        '<div class="bar-wrap"><i class="' + cls + '"' + (has ? ' style="height:' + h + '%"' : '') + '></i></div>' +
        '<span>' + label + '</span>' +
      '</div>';
    }).join('');

    return '<div class="panel">' +
      '<h3>用药依从趋势 <span class="muted-sm">（近 ' + range + ' 天）</span></h3>' +
      '<div class="adh-head">' +
        '<b class="adh-big">' + (cur.pct === null ? '—' : cur.pct + '<i>%</i>') + '</b>' +
        delta +
      '</div>' +
      '<div class="chart" style="gap:' + (range > 30 ? '1px' : (range > 14 ? '3px' : '8px')) + '">' + cols + '</div>' +
      '<p class="hint">每天一根柱，高度 = 当天已服次数 ÷ 应服次数（只算当天有排期的药）。' +
      '空柱表示那天没药；浅色表示低于 80%。' +
      (cur.sched ? '这 ' + range + ' 天共应服 ' + cur.sched + ' 次，已服 ' + cur.taken + ' 次。' : '') +
      (mom.prevPct === null || cur.pct === null ? ''
        : '括号里的环比是<b>本月已过 ' + mom.days + ' 天</b>对上月同期：本月 ' +
          mom.thisPct + '%，上月同期 ' + mom.prevPct + '%。') +
      '</p>' +
    '</div>';
  }

  function monthReviewPanel() {
    const r = monthReviewData();
    const cell = (label, value, unit, sub) =>
      '<div class="rv-cell"><small>' + esc(label) + '</small><b>' + value +
        (unit ? ' <i>' + esc(unit) + '</i>' : '') + '</b>' +
        (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>';
    const pctOf = v => r.elapsed ? Math.round(v / r.elapsed * 100) : 0;
    return '<div class="panel"><h3>本月回顾 <span class="muted-sm">（' + esc(r.monthLabel) + '已过 ' + r.elapsed + ' 天）</span></h3>' +
      '<div class="rv-grid">' +
        cell('达标天数', r.qualified, '天', '占已过天数 ' + pctOf(r.qualified) + '%') +
        cell('有记录', r.recorded, '天', '缺 ' + (r.elapsed - r.recorded) + ' 天') +
        cell('最长连续', r.best, '天', '完成率 ≥ 75% 记一天') +
        cell('平均完成率', Math.round(r.rate.rate * 100) + '%', '', '按有记录的 ' + r.rate.days + ' 天算') +
        cell('体重变化', r.wDelta === null ? '—' : (r.wDelta > 0 ? '+' : '') + r.wDelta, r.wDelta === null ? '' : 'kg',
          r.wDelta === null ? '本月记录不足 2 次' : (r.wDelta === 0 ? '持平' : (r.wDelta < 0 ? '在下降' : '在上升'))) +
        cell('用药依从', r.adherence === null ? '—' : r.adherence + '%', '',
          r.adherence === null ? '本月无排期' : '已服 ' + r.taken + ' / 应服 ' + r.sched + ' 次') +
      '</div>' +
      '<p class="rv-verdict">' + esc(r.verdict) + '</p>' +
      '<div class="btn-row"><button class="btn" data-act="month-summary">生成月度小结</button></div>' +
    '</div>';
  }

  /* ---------- 月度健康小结 ----------
     和「本月回顾」的区别：那边是一屏内的速览，这边是能打印出来交给医生的东西，
     所以要有明细（每种药、每个习惯的完成情况）和生成时间。 */
  function monthSummaryData() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const today = todayStr();
    const elapsed = now.getDate();
    const days = [];
    for (let i = 1; i <= elapsed; i++) days.push(fmt(new Date(y, m, i)));

    let recorded = 0, qualified = 0, best = 0, run = 0;
    days.forEach(d => {
      if (hasRecords(d)) recorded++;
      if (dayQualified(d)) {
        qualified++;
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    });

    const ws = weightRecords().filter(w => w.date >= days[0] && w.date <= today);
    const weight = ws.length ? {
      first: ws[0],
      last: ws[ws.length - 1],
      count: ws.length,
      delta: ws.length >= 2
        ? Math.round((ws[ws.length - 1].weight - ws[0].weight) * 10) / 10
        : null
    } : null;

    let sched = 0, taken = 0;
    const byMed = [];
    (state.meds || []).forEach(med => {
      if (!med || isPrn(med)) return;
      const slots = medDoseSlots(med);
      if (!slots.length) return;
      let s2 = 0, t2 = 0;
      days.forEach(d => {
        if (!medActiveOn(med, d)) return;
        slots.forEach(slot => {
          s2++;
          if (doseAt(d, med.id, slot)) t2++;
        });
      });
      if (!s2) return;
      sched += s2;
      taken += t2;
      byMed.push({
        name: med.name || '用药',
        dose: (Number(med.doseAmount) || 1) + (med.doseUnit || med.form || '片'),
        times: slots.join(' / '),
        sched: s2, taken: t2,
        pct: Math.round(t2 / s2 * 100)
      });
    });
    byMed.sort((a, b) => a.pct - b.pct || a.name.localeCompare(b.name));

    /* 备用药不排期，只报「这个月吃了几次」 */
    const prn = [];
    (state.meds || []).forEach(med => {
      if (!med || !isPrn(med)) return;
      let n = 0;
      days.forEach(d => { n += prnKeys(d, med.id).length; });
      if (n) prn.push({ name: med.name || '用药', count: n });
    });

    const habits = [];
    state.habits.filter(h => !h.optional && !isArchived(h)).forEach(h => {
      let done = 0, n = 0;
      days.forEach(d => {
        if (h.med && medScheduledCount(d) === 0) return;   /* 那天没药，这个习惯不计分母 */
        n++;
        if (met(h, d)) done++;
      });
      if (!n) return;
      habits.push({ name: h.name || '习惯', done, n, pct: Math.round(done / n * 100) });
    });
    habits.sort((a, b) => a.pct - b.pct);

    const t = new Date();
    return {
      label: y + ' 年 ' + (m + 1) + ' 月',
      span: days[0] + ' 至 ' + today + '（' + elapsed + ' 天）',
      elapsed, recorded, qualified, best,
      avgRate: rateOver(days),
      weight, med: { sched, taken, pct: sched ? Math.round(taken / sched * 100) : null, byMed, prn },
      habits,
      generatedAt: fmt(t) + ' ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes())
    };
  }

  function openMonthSummary() {
    const r = monthSummaryData();
    const pctOf = v => Math.round(v / r.elapsed * 100);

    const medTable = r.med.byMed.length || r.med.prn.length
      ? '<table class="sum-table">' +
          '<tr><th>药品</th><th>剂量</th><th>时间</th><th class="num">应服</th>' +
            '<th class="num">已服</th><th class="num">依从</th></tr>' +
          r.med.byMed.map(x =>
            '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.dose) + '</td>' +
            '<td>' + esc(x.times) + '</td>' +
            '<td class="num">' + x.sched + '</td><td class="num">' + x.taken + '</td>' +
            '<td class="num">' + x.pct + '%</td></tr>').join('') +
          r.med.prn.map(x =>
            '<tr><td>' + esc(x.name) + '</td><td>—</td><td>按需</td>' +
            '<td class="num">—</td><td class="num">' + x.count + ' 次</td>' +
            '<td class="num">—</td></tr>').join('') +
        '</table>'
      : '<p class="sum-lead">本月没有用药排期。</p>';

    const habitTable = r.habits.length
      ? '<table class="sum-table">' +
          '<tr><th>习惯</th><th class="num">完成 / 应完成</th><th class="num">完成率</th></tr>' +
          r.habits.map(x =>
            '<tr><td>' + esc(x.name) + '</td>' +
            '<td class="num">' + x.done + ' / ' + x.n + '</td>' +
            '<td class="num">' + x.pct + '%</td></tr>').join('') +
        '</table>'
      : '<p class="sum-lead">本月没有需要打卡的习惯。</p>';

    let weightTxt;
    if (!r.weight) {
      weightTxt = '<p class="sum-lead">本月没有体重记录。</p>';
    } else if (r.weight.delta === null) {
