    plus: '<path d="M12 5v14M5 12h14" stroke-width="2"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/>',
    stats: '<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
    pill: '<path d="M10.5 20.5 20.5 10.5a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
    settings: '<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/>',
    /* 配置页 = 通知的地盘，用铃铛而不是第二个齿轮 */
    config: '<path d="M6.2 8.6a5.8 5.8 0 0 1 11.6 0c0 4 1.6 5.6 2.2 6.2H4c.6-.6 2.2-2.2 2.2-6.2z"/><path d="M9.8 18.4a2.2 2.2 0 0 0 4.4 0"/>'
  };
  function icon(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }
  function ring(ratio, size, stroke, color, track) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const val = clamp(Number(ratio) || 0, 0, 1);
    const offset = c * (1 - val);
    const mid = size / 2;
    return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
      '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="' + (track || 'var(--line)') + '" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke +
        '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) +
        '" transform="rotate(-90 ' + mid + ' ' + mid + ')" style="transition:stroke-dashoffset .5s ease"/>' +
      '</svg>';
  }
  /* ============================================================
     全局搜索（Cmd / Ctrl + K）
     检索 tasks / essays / meds / habits，结果按类型分组，
     回车跳到对应页面并高亮目标。搜索状态全部留在模块级变量里。
     ============================================================ */
  const SEARCH_MAX = 24;
  let searchTerm = '';
  let searchIndex = 0;
  let searchTimer = null;

  /* 用 DOM 判断浮层是否开着，不用布尔量：
     点 ✕、点遮罩、Esc 都会绕过 state 变量，布尔量会漂移，
     导致下一次 Ctrl+K 变成「关闭一个已关闭的浮层」。 */
  function isSearchOpen() { return !!$('#search-input'); }

  function searchPool() {
    const pool = [];
    (state.tasks || []).forEach(t => {
      if (isArchived(t)) return;
      pool.push({ kind: 'task', id: t.id, title: t.title || '', text: t.note || '',
                  view: 'board', meta: (t.tag || '其他') + ' · ' + dueText(t) });
    });
    (state.essays || []).forEach(e => {
      pool.push({ kind: 'essay', id: e.id, title: e.title || '(无标题)', text: e.text || '',
                  view: 'essays', meta: (e.date || '') + ((e.tags || []).length ? ' · ' + e.tags.join('/') : '') });
    });
    (state.meds || []).forEach(m => {
      pool.push({ kind: 'med', id: m.id, title: m.name || '', text: [m.purpose, m.form, m.note].filter(Boolean).join(' '),
                  view: 'meds', meta: medCourseLabel(m) });
    });
    (state.habits || []).forEach(h => {
      /* h_med 是「用药卡」的占位习惯，习惯页会跳过它（habitManageRows 过滤 !h.med），
         跳过去只会落空；用药本身有独立入口，这里不重复收录。 */
      if (h.med || !String(h.name || '').trim()) return;
      pool.push({ kind: 'habit', id: h.id, title: h.name, text: h.note || '',
                  view: 'habits', meta: isArchived(h) ? '已归档' : (h.unit || '次') });
    });
    return pool;
  }

  const SEARCH_KIND = {
    task:  { label: '待办', icon: '📋' },
    habit: { label: '习惯', icon: '✅' },
    med:   { label: '用药', icon: '💊' },
    essay: { label: '随笔', icon: '📝' }
  };

  function searchTextOf(it) {
    return (it.title + '\n' + it.text).toLowerCase();
  }

  function searchResults(term) {
    const q = String(term || '').trim().toLowerCase();
    if (!q) return [];
    const pool = searchPool();
    const starts = [], contains = [];
    pool.forEach(it => {
      const t = it.title.toLowerCase();
      if (t.indexOf(q) === 0) starts.push(it);
      else if (t.indexOf(q) > 0 || searchTextOf(it).indexOf(q) >= 0) contains.push(it);
    });
    return starts.concat(contains).slice(0, SEARCH_MAX);
  }

  function searchHighlight(text, term) {
    const src = String(text || '');
    const q = String(term || '').trim();
    if (!q) return esc(src);
    const lower = src.toLowerCase();
    const needle = q.toLowerCase();
    const at = lower.indexOf(needle);
    if (at < 0) return esc(src);
    return esc(src.slice(0, at)) + '<mark>' + esc(src.slice(at, at + q.length)) + '</mark>' + esc(src.slice(at + q.length));
  }

  /* ---------- 命令面板 ----------
     Ctrl+K 原来只能搜。现在同一个输入框直接认命令：
       +1 喝水 / -1 喝水      给习惯打卡
       记 体重 68.5           记录今天的体重
       新任务 交报告 明天      新建待办
     认不出来就当搜索词，所以老用法一点没变。
     解析和执行分开，是为了解析能单测（不碰 state）。 */
  function findHabitByName(q) {
    const t = String(q || '').trim().toLowerCase();
    if (!t) return null;
    /* h_med 是「用药」这个虚拟习惯，它的对勾由药品记录驱动，
       手动 +1 不会影响完成判定，所以不参与命令匹配 */
    const list = state.habits.filter(h => !h.optional && !isArchived(h) && !h.med);
    const exact = list.find(h => String(h.name || '').toLowerCase() === t);
    if (exact) return exact;
    return list.find(h => String(h.name || '').toLowerCase().indexOf(t) >= 0) || null;
  }

  const CMD_DUE_WORDS = [['大后天', 3], ['后天', 2], ['明天', 1], ['今天', 0], ['今日', 0]];

  function parseCommand(raw) {
    const txt = String(raw || '').trim();
    if (!txt) return null;

    /* +1 喝水 ／ -2 看书 ／ +喝水（数字省略按 1） */
    let m = txt.match(/^([+\-])\s*(\d+(?:\.\d+)?)?\s*(\S.*)$/);
    if (m) {
      const h = findHabitByName(m[3]);
      if (!h) return null;                    /* 不认识的习惯名 → 交回搜索 */
      const n = m[2] ? Number(m[2]) : 1;
      const delta = m[1] === '-' ? -n : n;
      if (!delta) return { kind: 'error', label: '数量不能是 0' };
      return {
        kind: 'habit', habit: h, delta: delta,
        label: h.name + ' ' + (delta > 0 ? '+' : '') + delta,
        detail: '今天已记录 ' + countOf(todayStr(), h.id) + ' 次 · 回车执行'
      };
    }

    /* 记 体重 68.5 ／ 体重 68.5 ／ 68.5 体重 */
    m = txt.match(/^(?:记|记录|写下)?\s*(?:体重)\s*([0-9]+(?:\.[0-9]+)?)\s*(?:kg|公斤)?$/i);
    if (m) {
      const v = Number(m[1]);
      if (!isFinite(v) || v < 1 || v > 500) {
        return { kind: 'error', label: '体重要在 1–500 kg 之间' };
      }
      const p = normalizeBodyProfile(state.bodyProfile);
      if (!p.age || !p.height) {
        return { kind: 'error', label: '先补充身体档案（年龄和身高），否则算不了 BMI' };
      }
      return { kind: 'weight', value: Math.round(v * 10) / 10, label: '记录体重 ' + v + ' kg', detail: '写进今天 · 回车执行' };
    }

    /* 新任务 交报告 明天 */
    m = txt.match(/^(?:新任务|新建任务|待办|todo)\s+(\S.*)$/i);
    if (m) {
      let body = m[1].trim();
      let due = todayStr();
      for (let i = 0; i < CMD_DUE_WORDS.length; i++) {
        const kw = CMD_DUE_WORDS[i][0];
        if (body.length > kw.length && body.slice(-kw.length) === kw) {
          body = body.slice(0, -kw.length).trim();
          due = fmt(addDays(new Date(), CMD_DUE_WORDS[i][1]));
          break;
        }
      }
      if (!body) return { kind: 'error', label: '任务标题不能为空' };
      /* 「新任务 今天」这种只有日期的，当成标题会把日期当名字建出来，提示一下更清楚 */
      if (CMD_DUE_WORDS.some(w => w[0] === body)) {
        return { kind: 'error', label: '任务标题不能只有一个日期，加上要做什么' };
      }
      return {
        kind: 'task', title: body, due: due,
        label: '新建待办「' + body + '」',
        detail: '截止 ' + due + ' · 回车执行'
      };
    }

    return null;
  }

  function runCommand(cmd) {
    if (!cmd) return false;
    if (cmd.kind === 'error') {
      toast(cmd.label);
      return true;
    }
    const d = todayStr();

    if (cmd.kind === 'habit') {
      const h = cmd.habit;
      const cur = countOf(d, h.id);
      const next = Math.max(0, cur + cmd.delta);
      if (next === cur) {
        toast(cur === 0 ? '已经是 0 了' : '无法再减');
        return true;
      }
      logHabit(h.id, cmd.delta);
      setCount(d, h.id, next);
      closeModal();
      render();
      toast(h.name + (cmd.delta > 0 ? ' +' : ' ') + cmd.delta);
      return true;
    }

    if (cmd.kind === 'weight') {
      const p = normalizeBodyProfile(state.bodyProfile);
      const list = Array.isArray(state.weights) ? state.weights : (state.weights = []);
      let rec = list.find(w => w && w.date === d);
      if (!rec) {
        rec = { id: 'w_' + uid(), date: d, createdAt: new Date().toISOString() };
        list.push(rec);
      }
      rec.date = d;
      rec.age = p.age;
      rec.height = p.height;
      rec.weight = cmd.value;
      rec.bmi = calcBmi(cmd.value, p.height);
      save();
      closeModal();
      render();
      toast('体重已记 ' + cmd.value + ' kg');
      return true;
    }

    if (cmd.kind === 'task') {
      state.tasks.unshift({
        id: uid(),
        title: cmd.title,
        note: '',
        tag: '其他',
        priority: '中',
        status: 'todo',
        due: cmd.due,
        repeat: 'none',
        repeatTime: '20:00',
        createdAt: new Date().toISOString(),
        doneAt: null,
        prevStatus: ''
      });
      save();
      closeModal();
      render();
      toast('已添加待办「' + cmd.title + '」');
      return true;
    }

    return false;
  }

  function searchBodyHtml() {
    const cmd = parseCommand(searchTerm);
    if (cmd) {
      return '<button type="button" class="se-item se-cmd' +
          (cmd.kind === 'error' ? ' is-bad' : '') + '" data-act="cmd-run">' +
          '<span class="se-title">' + esc(cmd.label) + '</span>' +
          '<span class="se-meta">' + esc(cmd.detail || '回车执行') + '</span>' +
        '</button>';
    }
    const results = searchResults(searchTerm);
    if (!String(searchTerm).trim()) {
      return '<div class="se-hint">可以搜待办标题与备注、随笔正文、药名与用途、习惯名称。<br>' +
        '↑↓ 选择，回车跳转，Esc 关闭。</div>' +
        '<div class="se-group" style="margin-top:12px">⌘ 也能直接执行</div>' +
        '<div class="se-hint" style="margin-top:6px">' +
          '<code>+1 喝水</code> 给习惯打卡　<code>-1 看书</code> 撤销<br>' +
          '<code>记 体重 68.5</code> 记录体重　<code>新任务 交报告 明天</code> 新建待办' +
        '</div>';
    }
    if (!results.length) {
      return '<div class="se-hint">没有匹配「' + esc(searchTerm) + '」的内容。</div>';
    }
    if (searchIndex >= results.length) searchIndex = 0;
    let html = '';
    let lastKind = null;
    results.forEach((it, i) => {
      if (it.kind !== lastKind) {
        const n = results.filter(x => x.kind === it.kind).length;
        html += '<div class="se-group">' + SEARCH_KIND[it.kind].icon + ' ' + SEARCH_KIND[it.kind].label + ' · ' + n + '</div>';
        lastKind = it.kind;
      }
      html += '<button type="button" class="se-item' + (i === searchIndex ? ' is-on' : '') +
        '" data-act="search-pick" data-i="' + i + '">' +
        '<span class="se-title">' + searchHighlight(it.title, searchTerm) + '</span>' +
        '<span class="se-meta">' + esc(it.meta || '') + '</span>' +
        '</button>';
    });
    return html;
  }

  function openSearch() {
    searchIndex = 0;
    openModal('' +
      '<div class="modal-card se-card">' +
        '<div class="se-head">' +
          '<span class="se-ico">🔍</span>' +
          '<input type="text" id="search-input" placeholder="搜索，或输入 +1 喝水 / 记 体重 68.5 / 新任务 …" ' +
            'autocomplete="off" spellcheck="false" value="' + esc(searchTerm) + '">' +
          '<button class="icon-btn" data-act="close-modal" title="关闭">✕</button>' +
        '</div>' +
        '<div class="se-body" id="search-body">' + searchBodyHtml() + '</div>' +
        '<div class="se-foot"><span id="se-hint">↑↓ 选择 · 回车跳转 · Esc 关闭</span>' +
          '<span id="se-count"></span></div>' +
      '</div>');
    const input = $('#search-input');
    if (input) {
      input.focus();
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
    }
    searchSyncCount();
  }

  function searchSyncCount() {
    const box = $('#se-count');
    const hint = $('#se-hint');
    /* 命令模式下没有「搜索结果」，右下角再显示「无结果」会误导用户，
       左下角也不该再说「回车跳转」 */
    if (parseCommand(searchTerm)) {
      if (box) box.textContent = '';
      if (hint) hint.textContent = '回车执行 · Esc 关闭';
      return;
    }
    if (hint) hint.textContent = '↑↓ 选择 · 回车跳转 · Esc 关闭';
    if (!box) return;
    const n = searchResults(searchTerm).length;
    box.textContent = String(searchTerm).trim() ? (n ? n + ' 条结果' : '无结果') : '';
  }

  function searchRerenderBody() {
    const body = $('#search-body');
    if (!body) return;
    body.innerHTML = searchBodyHtml();
    searchSyncCount();
  }

  function closeSearch() {
    clearTimeout(searchTimer);
    closeModal();
  }

  /* 跳到目标所在地：切视图 → 等一帧 → 滚动并高亮 */
  /* 卡片本身通常不带 data-id（挂在内部按钮上），所以用「锚点 + closest」定位，
     再退化为按标题文本找卡片，两级兜底。 */
  const SEARCH_CARD = {
    task:  '.task, .task-row',
    habit: '.habit-card, .vital-card, .habit-row',
    med:   '.med-item, .med-card, .med-row, .mh',
    essay: '.essay-card'
  };

  function searchLocate(it) {
    const anchor = document.querySelector('[data-id="' + it.id + '"]');
    if (anchor) {
      const card = anchor.closest(SEARCH_CARD[it.kind] || '');
      if (card) return card;
    }
    return Array.from(document.querySelectorAll(SEARCH_CARD[it.kind] || ''))
      .find(e => (e.textContent || '').indexOf(it.title) >= 0) || null;
  }

  function searchGo(it) {
    closeSearch();
    if (view !== it.view) {
      view = it.view;
      state.view = it.view;
      render();
    }
    requestAnimationFrame(() => {
      const el = searchLocate(it);
      if (!el) { toast('已切到「' + SEARCH_KIND[it.kind].label + '」，请自行定位'); return; }
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('is-focus');
      setTimeout(() => el.classList.remove('is-focus'), 1800);
    });
  }

  /* ============================================================
     打开即提醒（不做 Web Push：iOS 要装 PWA、Android 要推送服务）
     只在打开页面 / 切回来时提醒：顶部横幅 + 标签页标题计数闪烁。
     「今天不再提醒」记在 localStorage，不进 state，避免纯提示操作触发云保存。
     ============================================================ */
  const REMIND_DISMISS_KEY = 'lifeboard.remind.dismissed';
  const BASE_TITLE = document.title;
  let remindTimer = null;
  let remindFlip = false;
  let remindCount = 0;

  function remindDismissedOn() {
    try { return localStorage.getItem(REMIND_DISMISS_KEY) === todayStr(); } catch (e) { return false; }
  }

  /* 四类提醒来源：用药、重复任务到点、过截止日的待办、该打卡的习惯。
     统一在 9 点后才算，避免清早一打开就被催。
     每条带一个稳定 key：系统通知按 key + 日期去重，同一天不会反复轰炸，
     横幅和标签页计数也都读这一份，三处数字不会各算各的。 */
  function remindItems() {
    const d = todayStr();
    const now = new Date();
    if (now.getHours() < 9) return [];
    const hm = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    const items = [];

    let overdue = 0, pending = 0;
    medScheduledFor(d).forEach(s => {
      if (doseAt(d, s.med.id, s.slot)) return;
      if (s.slot < hm) overdue++; else pending++;
    });
    if (overdue) items.push({ key: 'med-overdue', text: overdue + ' 次用药已过时间', view: 'meds' });
    if (pending) items.push({ key: 'med-pending', text: pending + ' 次用药待服', view: 'meds' });

    /* 待办 1：重复任务过了今天的提醒时刻还没做（repeatTime 之前只在表单里存着，没人读） */
    const open = (state.tasks || []).filter(t => t && !t.archivedAt && t.status !== 'done');
    const repeatDue = open.filter(t =>
      t.repeat && t.repeat !== 'none' && String(t.repeatTime || '20:00') <= hm);
    if (repeatDue.length) {
      items.push({
        key: 'task-' + repeatDue[0].id,
        text: '「' + String(repeatDue[0].title || '待办') + '」到时间了' +
          (repeatDue.length > 1 ? '，另有 ' + (repeatDue.length - 1) + ' 件' : ''),
        view: 'board'
      });
    }
    /* 待办 2：过截止日的单次任务合并成一条，别一个任务一条把横幅撑爆 */
    const lateCount = open.filter(t =>
      t.due && String(t.due) < d && (!t.repeat || t.repeat === 'none')).length;
    if (lateCount) {
      items.push({ key: 'task-late', text: lateCount + ' 件待办已逾期', view: 'today' });
    }

    /* 习惯：只有填了「建议时间」的才会被催（如 478 呼吸法 15:00） */
    const habitDue = activeHabits(d).filter(h => {
      if (h.med || isQuitLike(h)) return false;
      const st = String(h.suggestTime || '');
      if (!/^\d{2}:\d{2}$/.test(st) || st > hm) return false;
      return countOf(d, h.id) < (Number(h.target) || 1);
    });
    if (habitDue.length) {
      items.push({
        key: 'habit-' + habitDue[0].id,
        text: '「' + String(habitDue[0].name || '习惯') + '」还没打卡',
        view: 'habits'
      });
    }

    const water = (state.habits || []).find(h => h.id === 'h_water' && !isArchived(h));
    if (water) {
      const target = Number(water.target) || 9;
      const done = countOf(d, water.id);
      if (done < target) {
        const last = (state.events || [])
          .filter(e => e.d === d && e.id === water.id && Number(e.delta) > 0)
          .map(e => String(e.at || '')).sort().pop();
        const gap = last ? (Date.now() - new Date(last).getTime()) / 3600000 : null;
        if (gap === null || gap >= 1.5) {
          items.push({
            key: 'water',
            text: '喝水还差 ' + (target - done) + ' ' + (water.unit || '杯') +
              (gap === null ? '，今天还没记' : '，已 ' + Math.floor(gap) + ' 小时没记'),
            view: 'today'
          });
        }
      }
    }
    return items;
  }

  /* 最多铺 3 条，剩下的折成「还有 N 条」——
     提醒来源从 3 类扩到 6 类之后，全铺开会把首屏整块顶下去 */
  function remindBannerHtml() {
    if (mode === 'landing' || !cloud.user) return '';
    if (remindDismissedOn()) return '';
    const items = remindItems();
    if (!items.length) return '';
    const shown = items.slice(0, 3);
    const rest = items.length - shown.length;
    return '<div class="remind-bar" role="status">' +
      '<span class="remind-ico">⏰</span>' +
      '<div class="remind-body">' +
        shown.map(i => '<span class="remind-item">' + esc(i.text) + '</span>').join('') +
        (rest > 0 ? '<span class="remind-item remind-more">还有 ' + rest + ' 条</span>' : '') +
      '</div>' +
      '<button type="button" class="remind-go" data-act="remind-go" data-view="' + esc(items[0].view) + '">去看看</button>' +
      '<button type="button" class="remind-x" data-act="remind-dismiss" title="今天不再提醒">今天不再提醒</button>' +
    '</div>';
  }

  /* 标题闪烁：只闪计数，切回来立即恢复原标题 */
  function remindSync() {
    remindCount = (mode === 'landing' || !cloud.user || remindDismissedOn()) ? 0 : remindItems().length;
    if (!remindCount) { remindStop(); return; }
    if (remindTimer) return;
    remindFlip = false;
    remindTimer = setInterval(() => {
      remindFlip = !remindFlip;
      document.title = remindFlip ? '(' + remindCount + ') ' + BASE_TITLE : BASE_TITLE;
    }, 1400);
  }

  function remindStop() {
    if (remindTimer) { clearInterval(remindTimer); remindTimer = null; }
    if (document.title !== BASE_TITLE) document.title = BASE_TITLE;
  }

  /* ============================================================
     系统通知
     浏览器只在页面还活着时才会跑定时器，所以「关掉网页也要响」
     只能靠系统日历接管（设置页里导出 .ics）。
     这里的通知补的是另一半场景：页面开着，但已经切到别的 App。
     ============================================================ */
  const NOTIFY_ON_KEY = 'lifeboard.notify.on';
  const NOTIFY_SENT_KEY = 'lifeboard.notify.sent';
  const INSTALL_TIP_KEY = 'lifeboard.install.dismissed';

  function notifySupported() {
    return typeof Notification !== 'undefined'
      && 'serviceWorker' in navigator
      && typeof ServiceWorkerRegistration !== 'undefined'
      && 'showNotification' in ServiceWorkerRegistration.prototype;
  }

  function notifyWanted() {
    try { return localStorage.getItem(NOTIFY_ON_KEY) === '1'; } catch (e) { return false; }
  }

  /* off / granted / denied / default / unsupported —— 设置页按这个改文案 */
  function notifyState() {
    if (!notifySupported()) return 'unsupported';
    if (!notifyWanted()) return 'off';
    return Notification.permission;
  }

  function notifySentKeys() {
    try {
      const raw = JSON.parse(localStorage.getItem(NOTIFY_SENT_KEY) || '{}');
      return (raw && raw.d === todayStr() && Array.isArray(raw.keys)) ? raw.keys : [];
    } catch (e) { return []; }
  }

  function notifyMarkSent(keys) {
    const all = notifySentKeys().concat(keys)
      .filter((k, i, arr) => arr.indexOf(k) === i).slice(-40);
    try {
      localStorage.setItem(NOTIFY_SENT_KEY, JSON.stringify({ d: todayStr(), keys: all }));
    } catch (e) {}
  }

  async function notifyEnable() {
    if (!notifySupported()) { toast('这个浏览器不支持系统通知'); return; }
    if (location.protocol !== 'https:' && !/^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
      toast('系统通知需要 HTTPS 才能开启');
      return;
    }
    let perm = Notification.permission;
    if (perm === 'default') {
      try { perm = await Notification.requestPermission(); } catch (e) { perm = 'denied'; }
    }
    if (perm !== 'granted') {
      try { localStorage.removeItem(NOTIFY_ON_KEY); } catch (e) {}
      render();
      toast(perm === 'denied' ? '浏览器拦下了通知，去站点设置里允许后再试' : '没有开启通知');
      return;
    }
    try { localStorage.setItem(NOTIFY_ON_KEY, '1'); } catch (e) {}
    render();
    if (remindItems().length) await notifyPing(true);
    toast('已开启 · 切到别的应用也会提醒');
  }

  function notifyDisable() {
    try { localStorage.removeItem(NOTIFY_ON_KEY); } catch (e) {}
    render();
    toast('已关闭系统通知');
  }

  /* force=true 时忽略「今天已经发过」，用于刚给权限时立刻验证一次 */
  async function notifyPing(force) {
    if (!notifySupported() || !notifyWanted() || Notification.permission !== 'granted') return;
    if (mode === 'landing' || !cloud.user || remindDismissedOn()) return;
    const sent = notifySentKeys();
    const items = remindItems().filter(i => force || sent.indexOf(i.key) < 0);
    if (!items.length) return;
    let reg = null;
    try { reg = await navigator.serviceWorker.ready; } catch (e) { return; }
    if (!reg || typeof reg.showNotification !== 'function') return;
    items.slice(0, 3).forEach(it => {
      try {
        const p = reg.showNotification('明序', {
          body: it.text,
          tag: it.key,
          icon: './icons/icon-192.png',
          badge: './icons/icon-192.png',
          data: { view: it.view }
        });
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) { /* 被系统限制时静默跳过，不影响页面本身 */ }
    });
    /* 标记全部而不是只标记发出去的 3 条：否则 60 秒后的下一次检查
       会把剩下几条当成新的补发一遍，连着弹两轮 */
    notifyMarkSent(items.map(i => i.key));
  }

  /* ---------- 装到主屏 ---------- */
  let deferredInstall = null;

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function isStandalone() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || navigator.standalone === true;
  }

  async function installApp() {
    if (deferredInstall) {
      const ev = deferredInstall;
      deferredInstall = null;
      try { ev.prompt(); await ev.userChoice; } catch (e) {}
      render();
      return;
    }
    toast(isIOS()
      ? 'Safari 里点底部「分享」→「添加到主屏幕」'
      : '浏览器菜单里找「安装应用」或「添加到主屏幕」');
  }

  function installTipDismissed() {
    try { return localStorage.getItem(INSTALL_TIP_KEY) === '1'; } catch (e) { return true; }
  }

  function toast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ============================================================
     今日视图
     ============================================================ */
  function habitCard(h, d, compact) {
    const c = countOf(d, h.id);
    const done = met(h, d);
    /* compact = 常驻区窄卡（vitalCard 里的戒除卡）继续用旧骨架，"小习惯"重构不波及它 */
    const streak = streakOn(h, d);
    const target = Math.max(1, Number(h.target) || 1);
    /* 截止型：今天晚于截止时刻多少分钟（0 = 没超时 / 不适用） */
    const late = deadlineDiff(h, d);
    const pct = isQuitLike(h) ? (done ? 100 : 0) : clamp(c / target, 0, 1) * 100;

    /* 三类卡片的区别只在「换掉哪一块」：
       build 保持：点圆点 = 今天达标
       quit  戒除：点右上角圆圈 = 今天没守住（不点 = 一直守着），骨架和保持完全一样
       smoke 戒烟：双按钮「点一根 / 忍一次」+ 烟盒，是站点自带的特殊卡 */
    const w = quitWord(h);
    const isQ = isQuitLike(h);
    const isSmokeH = isSmoke(h);
    const slips = isQ ? quitSlips(h, d) : 0;
    const broken = slips > 0;
    const isToday = d === todayStr();
    let control = '';
    if (isSmokeH) {
      const evs = dayCravings(h.id, d);
      const ns = evs.filter(function (e) { return e.k === 's'; }).length;
      const nr = evs.length - ns;
      const rate = evs.length ? Math.round(nr / evs.length * 100) : null;
      /* 今日页这张窄卡也走同一个闸门：这里还点得动，就又能记出第 21 支 */
      const full = packBlocked(h);
      const smokeAttr = (!isToday || full)
        ? ' disabled title="' + (isToday ? '这包已经抽完了 · 记一笔买烟后才能继续记' : '只能记今天，不能补记历史') + '"'
        : '';
      control = '<div class="crave-pair">' +
          '<button class="crave-btn smoke" data-act="crave-smoke" data-id="' + h.id + '"' +
            smokeAttr + '>' + w.s + '</button>' +
          '<button class="crave-btn resist" data-act="crave-resist" data-id="' + h.id + '"' +
            (isToday ? '' : ' disabled title="只能记今天，不能补记历史"') + '>' + w.r + '</button>' +
        '</div>' +
        '<div class="crave-meta">' +
          '<span>' + (isToday ? '今日' : (Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)))) + '</span>' +
          '<span>' + w.hero + ' <b>' + ns + '</b></span>' +
          '<span>' + w.hold + ' <b>' + nr + '</b></span>' +
          (rate === null ? '<span class="crave-none">还没有记录</span>'
                         : '<span>抵御率 <b>' + rate + '%</b></span>') +
        '</div>' +
        (evs.length
          ? '<div class="crave-log">' +
              evs.slice(-6).map(function (e) {
                return '<button class="cl-item ' + e.k + '" data-act="crave-tag" data-eid="' + e.id +
                  '" title="点一下补记诱因">' +
                  tsHHMM(e.t) + ' ' + craveCn(e.k, h) + '</button>';
              }).join('') +
              (evs.length > 6 ? '<span class="cl-more">+' + (evs.length - 6) + '</span>' : '') +
              (isToday ? '<button class="cl-item undo" data-act="crave-undo" data-id="' + h.id + '">撤销</button>' : '') +
            '</div>'
          : '');
    } else if (isQ) {
      /* 戒除跟保持长得完全一样：中间一条可点的横条。
         区别只在填充方向——保持「点了才满」，戒除「守住才满，点一下取消」。
         v103：**不再数失败次数**。单次模式整行删掉（横条空心就是失守，
         一周点阵和「连续守住」已经说清历史）；多次模式保留数字，
         因为一天记几次正是这个习惯本身，但改成事实口径「今天 N 次」，
         不再是「N 次未达标」那种评判。 */
      if (isMultiSlip(h)) {
        /* 多次模式（v79）：主按钮永远可点、点一次加一条，撤销单独放在数字右边。
           **不能沿用 toggle** —— 再点一下就删掉整天记录的话，第二次根本记不进去。
           撤销只退最后一条，不是整天清零。 */
        control = '<button type="button" class="quit-add' + (broken ? ' broken' : '') + '"' +
            ' data-act="quit-add" data-id="' + h.id + '"' +
            (isToday ? '' : ' disabled title="只能记今天，不能补记历史"') + '>' +
            '<i>' + (broken ? '!' : '✓') + '</i>' +
            '<span>' + (broken ? '又失守一次' : '今天守住了') + '</span>' +
          '</button>' +
          /* 没失守时「今天 0 次」是废话（按钮已经写「今天守住了」），整行不渲染；
             一旦有记录才出现数字和撤销，卡片高度也只在真出事那天变高。 */
          (broken
            ? '<div class="habit-count quit-count"><span>今天 </span>' + slips + '<span> 次</span>' +
                (isToday
                  ? '<button type="button" class="quit-undo" data-act="quit-dec" data-id="' + h.id + '">撤销</button>'
                  : '') +
              '</div>'
            : '');
      } else {
        control = '<div class="pips"><button type="button" class="pip' + (broken ? '' : ' on') + '"' +
            ' data-act="quit-mark" data-id="' + h.id + '"' +
            (isToday ? '' : ' disabled') +
            ' aria-label="' + (broken ? '撤销今天的记录' : '标记今天没守住') + '"' +
            ' title="' + (broken ? '点一下撤销今天的记录' : '今天没守住？点一下') + '"></button></div>';
      }
    } else if (target <= 1) {
      /* 目标 1 次：一个通栏按钮，点了就完成，再点就撤销。
         不做「已完成 / 未完成」两个并列按钮：没打卡的时候「未完成」没有语义
         （本来就是未完成），只会常年白占一半宽度。滴答清单的「完成全部」、
         Loop / Streaks 的 toggle 也都是单一主动作 + 二次撤销。
         data-val 直接给 1 / 0，复用 habit-set，不新增 action。 */
      control = '<button type="button" class="habit-done' + (done ? ' on' : '') + '"' +
        ' data-act="habit-set" data-id="' + h.id + '" data-val="' + (done ? 0 : 1) + '"' +
        ' title="' + (done ? '点一下撤销今天的打卡' : '点一下记为今天已完成') + '">' +
        '<i class="hd-mark">✓</i><span>' + (done ? '已完成 · 点一下撤销' : '今天完成') + '</span>' +
        '</button>';
    } else if (target <= 6) {
      let pips = '';
      for (let i = 1; i <= target; i++) {
        const on = i <= c;
        const val = i === c ? i - 1 : i;
        pips += '<button class="pip ' + (on ? 'on' : '') + '" data-act="habit-set" data-id="' + h.id +
          '" data-val="' + val + '" title="第 ' + i + ' ' + esc(h.unit || '次') + '"></button>';
      }
      /* v102：一行同时给「点到第几格」和「几 / 几」，不再上下两行 */
      control = '<div class="habit-pips-row"><div class="pips">' + pips + '</div>' +
        '<div class="habit-count">' + c + '<span> / ' + target + ' ' + esc(h.unit || '次') + '</span></div></div>';
    } else {
      control = '<div class="stepper">' +
        '<button data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>−</button>' +
        '<div class="habit-count">' + c + '<span> / ' + target + ' ' + esc(h.unit || '次') + '</span></div>' +
        '<button data-act="habit-inc" data-id="' + h.id + '">＋</button>' +
        '</div>';
    }

    /* v100：连续天数不再挤在标题小字里（它是全卡最该被看到的信息），
       标题下只留「目标 N 次」这种真正必要的约束；单次目标连目标值也不写。
       compact（常驻窄卡）保持旧文案，避免动到常驻区。 */
    const sub = compact
      ? (isQ
          ? (isSmokeH
              ? ('连续 ' + streak + ' 天' + w.keep + (streak === 0 ? ' · 今天已记一次' : ''))
              : (broken
                  ? '连续从今天重新数'
                  : ('连续 ' + streak + ' 天' + w.keep)))
          : (h.target > 0 ? '目标 ' + target + ' ' + esc(h.unit || '次') + (streak ? ' · 连续 ' + streak + ' 天' : '') : ''))
      : (isSmokeH
          ? ('连续 ' + streak + ' 天' + w.keep + (streak === 0 ? ' · 今天已记一次' : ''))
          : (!isQ && target > 1
              ? '目标 ' + target + ' ' + esc(h.unit || '次')
              : (isDeadlineHabit(h) ? esc(h.deadline) + ' 前' : '')));
    /* 证据层：连续多少天 + 最近七天的格子。用药靠排期不看 checks，戒烟卡自带
       hero/meta，两者都不叠这一层。 */
    /* 最长纪录只在「比当前长」时出现，否则一句话里两个数字容易看混 */
    const best = (compact || isSmokeH || h.med) ? 0 : habitBest(h, d);
    const proof = (compact || isSmokeH || h.med) ? '' :
      '<div class="habit-proof">' +
        (streak > 0 ? '<span class="hp-num"><b>' + streak + '</b><i>天</i></span>' : '') +
        '<span class="hp-cap">' +
          (streak > 0 ? (isQ ? '连续守住' : '连续达标')
                      : (isQ && broken ? '从今天重新数' : '今天开始')) +
          (best > streak ? ' · 最长 ' + best + ' 天' : '') +
        '</span>' +
        '<span class="habit-week">' + habitWeek(h, d) + '</span>' +
      '</div>';

    return '<article class="habit-card ' + (done ? 'is-done' : '') + '" data-hid="' + esc(h.id) + '"' +
      ' style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
      '<div class="habit-head">' +
        '<span class="habit-icon">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-title"><b>' + esc(h.name) + '</b><small>' + esc(sub) + '</small></div>' +
        /* v100：右上角从「看不懂的圆圈」换成文字状态；戒烟卡状态由 hero/meta 表达，
           这里不再叠一个。compact（常驻窄卡）保留原来的状态灯。 */
        (compact
          ? ((isQ && !isSmokeH)
              ? '<span class="habit-check quit-dot' + (broken ? ' broken' : '') + '">' +
                  (broken ? '!' : '') + '</span>'
              : '<span class="habit-check">✓</span>')
          : (isSmokeH
              ? ''
              : '<span class="habit-state' + (done ? ' on' : '')
                  + ((isQ && broken) || late > 0 ? ' bad' : '') + '"'
                  + (late > 0 ? ' title="比 ' + esc(h.deadline) + ' 晚 ' + late + ' 分"' : '') + '>' +
                  habitStateText(h, d) + '</span>')) +
      '</div>' +
      control +
      proof +
      /* 备注只显示用户自己填的，没填就整块不渲染（虚线也不出现）。
         不要给默认文案——那是替用户说话，还占掉他写自己规则的位置。 */
      (h.note ? '<div class="habit-note">' + esc(h.note) + '</div>' : '') +
      /* 小习惯卡不再画底部进度条：按钮说今天、点阵说历史、多目标还有 n/m 计数，
         三条信息已经够了。compact（常驻窄卡）与戒烟卡保持原样。 */
      (compact || isSmokeH
        ? '<div class="habit-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
        : '') +
      '</article>';
  }

  /* 补记诱因：点卡片上的时间条目进来。
     不放在「抽了 / 忍住了」的点击流程里——犯瘾那一刻没人有耐心填表单，
     先一键记录，事后再补标签。 */
  function craveTagModal(eid) {
    const e = craveList().find(function (x) { return x.id === eid; });
    if (!e) return;
    const opts = CRAVE_TRIGGERS.map(function (t) {
      return '<button type="button" class="tag-chip' + (e.g === t.k ? ' on' : '') +
        '" data-act="crave-set-tag" data-eid="' + eid + '" data-tag="' + t.k + '">' + t.label + '</button>';
    }).join('');
    const st = Number(e.s) || 0;
    const stars = [1, 2, 3, 4, 5].map(function (n) {
      return '<button type="button" class="cst-btn' + (st === n ? ' on' : '') +
        '" data-act="crave-set-s" data-eid="' + eid + '" data-s="' + n + '">' + n + '</button>';
    }).join('');
    const hh = habitById(e.h);
    const isSmokeH = isSmoke(hh);
    openModal('<div class="modal-card crave-tag-card">' +
      '<h3>' + tsHHMM(e.t) + ' · ' + craveCn(e.k, hh) + '</h3>' +
      '<p class="modal-sub">当时是什么情况？补一下，两三周就能看出主因。</p>' +
      '<div class="ct-chips">' + opts + '</div>' +
      (isSmokeH
        ? '<div class="cst-row"><span>当时有多想</span><div class="cst-btns">' + stars + '</div></div>'
        : '') +
      '<div class="modal-actions">' +
        '<button type="button" class="btn ghost" data-act="crave-del" data-eid="' + eid + '">删掉这条</button>' +
        '<span class="spacer"></span>' +
        '<button type="button" class="btn primary" data-act="close-modal">完成</button>' +
      '</div>' +
    '</div>');
  }

  /* 戒烟常驻卡。主视觉是「一包 20 支」，不是进度环——
     环是「完成度」语义（运动卡那样），戒烟是「消耗」语义，硬套会拧。
     20 支格子直接对着烟民的真实单位说话：这包还剩几支。
     卡的尺寸跟其他常驻卡一致，不跨列。 */
  function quitCard(h, d, compare) {
    const today = d === todayStr();
    const evs = dayCravings(h.id, d);
    const ns = evs.filter(function (e) { return e.k === 's'; }).length;
    const nr = evs.length - ns;
    const streak = quitStreak(h);
    const total = quitTotal(h);
    const best = quitBest(h);
    const saved = quitSaved(h);
    const mile = quitNextMile(streak);
    /* 历史日期要画「那天的包」，不是今天这包 */
    const span = today ? currentSpan(h) : spanOnDay(h, d);
    const pack = span ? span.pack : null;
    const blocked = packBlocked(h);
    const color = esc(h.color || '#7a8471');

    /* 文案不能有羞辱感。抽了就写「记了 N 次」，不要写「破戒」「失败」——
       一旦有指责味，人就干脆不点了。 */
    let status, sub;
    if (ns > 0) {
      status = '<span class="mv-status">今天记了 ' + ns + ' 次</span>';
      sub = '连续从今天重新数' + (total > 0 ? ' · 累计的 ' + total + ' 天还在' : '');
    } else if (streak > 0) {
      status = '<span class="mv-status ok">连续 ' + streak + ' 天没抽</span>';
      sub = today ? '今天还一次没记，保持住' : '这一天没有记录';
    } else {
      status = '<span class="mv-status">还没开始</span>';
      sub = '想抽时点一下 · 抽了也照实记，才看得出规律';
    }

    const lines = [];
    if (span) {
      if (!today) {
        /* 历史日期：只报「那天结束时还剩几支」，不报包开了多久（那是今天的状态） */
        const endTs = Math.round(parseD(d).getTime() / 1000) + 86399;
        const usedThen = usedUntil(h, span, endTs);
        const leftThen = Math.max(0, span.size - usedThen);
        lines.push('<span><i' + (leftThen ? '' : ' class="dim"') + '></i>那天结束时还剩 ' +
          leftThen + ' 支 · 当天记了 ' + evs.filter(function (e) { return e.k === 's'; }).length + ' 支</span>');
      } else if (span.done) {
        const stock = packStock(h);
        lines.push('<span><i class="dim"></i>这包抽完了 · 用了 ' + packSpanTextOf(span) +
          (stock ? ' · 库存还有 ' + stock + ' 包' : '') + '</span>');
      } else {
        const left = Math.max(0, span.size - span.used);
        lines.push('<span><i' + (left ? '' : ' class="dim"') + '></i>这包开了 ' +
          packSpanTextOf(span) + ' · 还剩 ' + left + ' 支</span>');
      }
      /* 戒烟页才展示「上一包对比」，今日页窄卡不塞这条（放不下也重复） */
      if (compare && today) {
        const cmp = packCompareLine(h);
        if (cmp) lines.push('<span><i class="dim"></i>' + cmp + '</span>');
      }
    }
    /* 库存空的时候抽的那些：不算丢，只是没包可归。不显示的话，
       「今天 5 支」和「这包 0 支」对不上，用户会以为算错了。 */
    /* 未归包只在两种情况下会出现：老数据里本来就有的，或者从备份导入的。
       正常操作路径上点不出来（见 packBlocked），所以这里只展示、不再增长。 */
    const orph = packOrphans(h);
    if (orph > 0) {
      lines.push('<span><i class="dim"></i>另有 ' + orph + ' 支没归包（当时库存空）</span>');
    }
    if (today && blocked && (!span || span.done)) {
      lines.push('<span><i class="dim"></i>这包已经抽完 · 记一笔买烟后才能继续记</span>');
    }
    if (saved) {
      lines.push('<span><i></i>少抽 ' + saved.sticks + ' 支 · 省了 ¥' + Math.round(saved.money) + '</span>');
    } else if (total > 0) {
      lines.push('<span><i class="dim"></i>累计 ' + total + ' 天' +
        (best > streak ? ' · 最长 ' + best + ' 天' : '') + '</span>');
    }

    /* 末支软确认：只在「刚抽完、还没确认」时挂一条，不弹窗、不打断连点。
       48 小时内有效——再久用户也想不起具体时刻，问了只会烦。
       取「最近一个抽完且未确认」的包，不能只看 currentSpan：
       后面还有整包在抽时，currentSpan 指向的是那包，先抽完的那包就永远等不到确认。
       确认值存 pack.cf：它是用户给的事实，不是派生量。 */
    const nowSec = Math.round(Date.now() / 1000);
    const cfList = packSpans(h).filter(function (x) {
      return x.done && !x.cf && nowSec - x.closeAt < 172800;
    });
    const cfSpan = cfList.length ? cfList[cfList.length - 1] : null;
    /* 后面还有整包在抽时，这条说的是「上一包」——不写清楚会被当成当前这包 */
    const cfIsLast = cfSpan && span && cfSpan.pack.id === span.pack.id;
    /* 昨天补记入口：只在今天出现，且昨天那包还有余量。
       「只补昨天」是用户定的——补更早的日子自己也想不起来，数据处理还容易乱。 */
    const yDay = fmt(addDays(new Date(), -1));
    const bfLeft = today ? backfillLeft(h, yDay) : 0;
    const bfBar = bfLeft > 0
      ? '<div class="pack-cf">' +
          '<span>昨天这包还剩 <b>' + bfLeft + '</b> 支 · 没记的可以补</span>' +
          '<button data-act="crave-backfill" data-ds="' + yDay + '">补记</button>' +
        '</div>'
      : '';
    const cfBar = cfSpan
      ? '<div class="pack-cf">' +
          '<span>' + (cfIsLast ? '这包 ' : '上一包 ') +
          '<b>' + tsDay(cfSpan.closeAt).slice(5) + ' ' + tsHHMM(cfSpan.closeAt) +
          '</b> 抽完的？</span>' +
          '<button data-act="pack-cf-ok" data-id="' + esc(cfSpan.pack.id) + '">对</button>' +
          '<button data-act="pack-cf-edit" data-id="' + esc(cfSpan.pack.id) + '">改时间</button>' +
        '</div>'
      : '';

    const foot = streak === 0
      ? '先撑过今天 · 头三天最难受，挺过去就顺了'
      : (mile
          ? '里程碑 ' + (QUIT_MILE_CN[mile.days] || (mile.days + ' 天')) + ' · 还差 ' + mile.left + ' 天'
          : '已走完全部里程碑 · 现在是第 ' + streak + ' 天');

    return '<article class="vital-card quit-card' + (ns === 0 && streak > 0 ? ' is-done' : '') +
        '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '🚭') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>戒除 · 每天保持 0 根</small></div>' +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="quit-body">' +
      '<div class="quit-head">' + status +
        '<div class="vital-sub">' + sub + '</div>' +
      '</div>' +
      '<div class="quit-side">' + packGridHtml(h, d) + '</div>' +
      cfBar +
      bfBar +
      '<div class="move-lines">' + lines.join('') + '</div>' +
      '<div class="move-foot">' + foot + '</div>' +
      (today
        ? '<div class="quit-actions">' +
            '<button class="quit-btn smoke" data-act="crave-smoke" data-id="' + h.id + '"' +
              (blocked ? ' disabled title="这包已经抽完了 · 记一笔买烟后才能继续记"' : '') + '>' +
              (blocked ? '这包抽完了' : '点一根') + '</button>' +
            '<button class="quit-btn resist" data-act="crave-resist" data-id="' + h.id + '">忍一次</button>' +
            '<button class="quit-btn undo" data-act="crave-undo" data-id="' + h.id + '"' +
              (evs.length ? '' : ' disabled') + '>撤销</button>' +
          '</div>'
        : '<div class="quit-actions"><button class="quit-btn" style="grid-column:1/-1" disabled>' +
            '只能记今天 · ' + Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) + '</button></div>') +
      '</div>' +
    '</article>';
  }

  /* 顺序数组只做去重和剔空值，**不剔未知 id**：将来 PINNED_IDS 加卡片时，
     用户之前存过的顺序仍能用上。真正排序时会按已知集合再过滤一遍。 */
  function normalizeCardOrder(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (id) {
      const v = String(id || '');
      if (!v || seen[v]) return;
      seen[v] = 1;
      out.push(v);
    });
    return out.slice(0, 32);
  }
  /* 常驻卡的显示顺序：先按用户排过的，没排到的按 PINNED_IDS 原顺序补在后面。
     集合始终是全部的 known，所以「排到一半」也不会少卡。 */
  function orderedPinnedIds() {
    const pref = Array.isArray(state.cardOrder) ? state.cardOrder : [];
    const seen = {};
    const out = [];
    pref.forEach(function (id) {
      const v = String(id || '');
      if (v && PINNED_IDS.indexOf(v) >= 0 && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    PINNED_IDS.forEach(function (id) { if (!seen[id]) out.push(id); });
    return out;
  }

  function isPinned(h) {
    return !!(h && PINNED_IDS.indexOf(h.id) >= 0);
  }

  function isArchived(h) {
    return !!(h && h.archivedAt);
  }

  function doseTimes(n) {
    const count = Math.max(1, Math.min(12, Number(n) || 1));
    if (count === 1) return ['08:00'];
    const start = 8 * 60, end = 20 * 60;
    const out = [];
    for (let i = 0; i < count; i++) {
      const m = Math.round(start + (end - start) * (i / (count - 1)));
      out.push(pad2(Math.floor(m / 60)) + ':' + pad2(m % 60));
    }
    return out;
  }

  function humanDuration(mins) {
    const m = Math.max(0, Math.round(mins));
    if (m < 60) return m + ' 分钟';
    const h = Math.floor(m / 60), r = m % 60;
    return h + ' 小时' + (r ? ' ' + r + ' 分' : '');
  }

  /* 喝水：毫升换算 / 上次时刻 / 今日时间线
     规则：前 (n-1) 杯按 perMl，最后一杯补齐到目标总量（2300 - 8×250 = 300 ml）。
     checks 里仍存「次数」，所以历史数据不用迁移。 */
  function waterTimesN(h) { return Math.max(1, Math.min(24, Math.round(Number(h.target) || 9))); }
  function waterPerMl(h) { return Math.max(50, Math.round(Number(h.perMl) || 250)); }
  function waterGoalMl(h) {
    const n = waterTimesN(h), per = waterPerMl(h);
    return Math.max(Number(h.goalMl) || n * per, n * per);
  }
  function waterMlOf(h, count) {
    const n = waterTimesN(h), per = waterPerMl(h);
    const lastMl = waterGoalMl(h) - (n - 1) * per;
    const c = Math.max(0, Math.round(count));
    if (c <= 0) return 0;
    if (c < n) return c * per;
    return (n - 1) * per + lastMl + (c - n) * per;
  }
  function waterLastAt(h, d) {
    if (d !== todayStr() || !Array.isArray(state.events)) return null;
    for (let i = state.events.length - 1; i >= 0; i--) {
      const e = state.events[i];
      if (e && e.id === h.id && e.d === d && Number(e.delta) > 0) {
        const at = new Date(e.at);
        if (!isNaN(at.getTime())) return at;
      }
    }
    return null;
  }
  /* 今日每次喝水的时刻；5 分钟内的连点合并成一条（14:45 ×3） */
  function waterDayTimes(h, d) {
    if (!Array.isArray(state.events)) return [];
    const raw = [];
    state.events.forEach(e => {
      if (!e || e.id !== h.id || e.d !== d || Number(e.delta) <= 0) return;
      const at = new Date(e.at);
      if (!isNaN(at.getTime())) raw.push(at);
    });
    raw.sort((a, b) => a - b);
    const merged = [];
    raw.forEach(at => {
      const last = merged[merged.length - 1];
      if (last && at.getTime() - last.at.getTime() < 5 * 60000) { last.n++; return; }
      merged.push({ at, n: 1 });
    });
    return merged.map(x => ({
      at: x.at,
      n: x.n,
      label: pad2(x.at.getHours()) + ':' + pad2(x.at.getMinutes()) + (x.n > 1 ? ' ×' + x.n : '')
    }));
  }

  /* 右上：近 7 天迷你柱（均量只算前 6 天，今天还没过完） */
  function waterWeekHtml(h) {
    const today = todayStr();
    const goal = waterGoalMl(h) || 1;
    const days = [];
    let sum = 0, cnt = 0;
    for (let i = 6; i >= 0; i--) {
      const ds = fmt(addDays(new Date(), -i));
      const ml = waterMlOf(h, countOf(ds, h.id));
      days.push({ ds, ml, today: ds === today });
      if (i >= 1) { sum += ml; cnt++; }
    }
    const avg = cnt ? Math.round(sum / cnt) : 0;
    const bars = days.map(d => {
      const cls = 'height:' + Math.min(100, Math.max(0, d.ml / goal * 100)).toFixed(1) + '%';
      return '<i class="' + (d.ml > 0 ? 'has' : '') + (d.today ? ' is-today' : '') + '"' +
        ' style="' + cls + '" title="' + d.ds.slice(5) + ' · ' + d.ml + ' ml"></i>';
    }).join('');
    return '<div class="water-week">' +
      '<div class="ww-bars">' + bars + '</div>' +
      '<span class="ww-avg">近 7 天均<b>' + avg + '</b>ml</span>' +
    '</div>';
  }

  /* 底部：06:00–23:00 分布条 */
  function waterDistHtml(h, d) {
    const list = waterDayTimes(h, d);
    if (!list.length) return '';
    const S = 6 * 60, E = 23 * 60;
    const pct = t => {
      const m = t.getHours() * 60 + t.getMinutes();
      return Math.max(0, Math.min(100, (m - S) / (E - S) * 100));
    };
    const dots = list.map(x =>
      '<i style="left:' + pct(x.at).toFixed(2) + '%" title="' + x.label + '"></i>').join('');
    const ticks = [6, 9, 12, 15, 18, 21].map(t =>
      '<span style="left:' + pct(new Date(2000, 0, 1, t, 0)).toFixed(2) + '%">' + pad2(t) + '</span>').join('');
    return '<div class="water-dist">' +
      '<div class="wd-track">' + dots + '</div>' +
      '<div class="wd-axis">' + ticks + '</div>' +
    '</div>';
  }

  /* 节奏建议：还剩几杯、离 22:00 还有多久、建议多久一杯 */
  function waterPaceText(h, count) {
    const n = waterTimesN(h);
    const left = n - Math.max(0, Math.round(count));
    if (left <= 0) return '';
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const remain = 22 * 60 - nowMin;
    if (remain <= 0) return '已经过了 22:00，还差 ' + left + ' 杯；睡前别一次灌太多';
    if (remain < 20) return '离 22:00 只剩 ' + remain + ' 分钟，还差 ' + left + ' 杯，有点赶';
    const gap = Math.round(remain / left);
    if (gap < 15) return '离 22:00 还有 ' + humanDuration(remain) + '，还差 ' + left + ' 杯，得赶一赶';
    return '离 22:00 还有 ' + humanDuration(remain) + ' · 还差 ' + left + ' 杯 · 建议每 ' + gap + ' 分钟一杯';
  }

  /* ============================================================
     运动卡：本周七段环 + 连续 / 本月 / 上次 / 习惯时刻
     ============================================================ */
  function weekDaysOf(h) {
    const today = todayStr();
    const now = parseD(today);
    const dow = (now.getDay() + 6) % 7;
    const monday = addDays(now, -dow);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      out.push({ ds, done: countOf(ds, h.id) > 0, today: ds === today, future: ds > today });
    }
    return out;
  }

  function moveMonthCount(h) {
    const ym = todayStr().slice(0, 7);
    let n = 0;
    Object.keys(state.checks || {}).forEach(ds => {
      if (ds.slice(0, 7) === ym && countOf(ds, h.id) > 0) n++;
    });
    return n;
  }

  function moveLastText(h) {
    const today = todayStr();
    const days = Object.keys(state.checks || {})
      .filter(ds => ds <= today && countOf(ds, h.id) > 0).sort();
    if (!days.length) return '';
    const ds = days[days.length - 1];
    if (ds === today) return '今天';
    const diff = Math.round((parseD(today) - parseD(ds)) / 86400000);
    if (diff === 1) return '昨天';
    if (diff === 2) return '前天';
    return Number(ds.slice(5, 7)) + '月' + Number(ds.slice(8, 10)) + '日';
  }

  /* 最近 12 次的平均时刻，样本少于 3 次就不猜 */
  function moveUsualTime(h) {
    const arr = (state.events || [])
      .filter(e => e && e.id === h.id && Number(e.delta) > 0)
      .map(e => new Date(e.at))
      .filter(t => !isNaN(t.getTime()))
      .slice(-12);
    if (arr.length < 3) return '';
    let sum = 0;
    arr.forEach(t => { sum += t.getHours() * 60 + t.getMinutes(); });
    const avg = Math.round(sum / arr.length);
    return pad2(Math.floor(avg / 60) % 24) + ':' + pad2(avg % 60);
  }

  function moveLastWeekCount(h) {
    const now = parseD(todayStr());
    const dow = (now.getDay() + 6) % 7;
    const monday = addDays(now, -dow);
    let n = 0;
    for (let i = 1; i <= 7; i++) {
      if (countOf(fmt(addDays(monday, -i)), h.id) > 0) n++;
    }
    return n;
  }

  function moveRingHtml(h) {
    const week = weekDaysOf(h);
    const doneN = week.filter(w => w.done).length;
    const R = 52;
    const C = 2 * Math.PI * R;
    const seg = C / 7;
    const dash = seg - 12.7;
    const circles = week.map((w, i) => {
      const cls = w.future ? 'future' : (w.done ? 'done' : '');
      return '<circle class="' + cls + '" cx="66" cy="66" r="' + R + '"' +
        ' stroke-dasharray="' + dash.toFixed(2) + ' ' + (C - dash).toFixed(2) + '"' +
        ' stroke-dashoffset="' + (-i * seg).toFixed(2) + '"/>';
    }).join('');
    return '<div class="move-ring">' +
      '<svg viewBox="0 0 132 132" aria-hidden="true">' +
        '<g transform="rotate(-90 66 66)" fill="none" stroke-width="9" stroke-linecap="round">' + circles + '</g>' +
      '</svg>' +
      '<div class="move-ring-txt"><b>' + doneN + '/7</b><small>本 周</small></div>' +
    '</div>';
  }

  function moveCardHtml(h, d) {
    const c = countOf(d, h.id);
    const target = Math.max(1, Number(h.target) || 1);
    const done = c >= target;
    const today = d === todayStr();
    const color = esc(h.color || '#b5733f');
    const week = weekDaysOf(h);
    const doneN = week.filter(w => w.done).length;
    const streak = habitStreak(h);
    const usual = moveUsualTime(h);
    const last = moveLastText(h);
    const monthN = moveMonthCount(h);
    const remainDays = week.filter(w => w.future).length;
    const gapWeek = moveLastWeekCount(h) - doneN;

    let status, sub, foot;
    if (done) {
      status = '<span class="mv-status ok">' + (today ? '今天已完成' : '这一天完成了') + '</span>';
      sub = '这 10,000 步已经记上了' + (streak ? ' · 连续 ' + streak + ' 天' : '');
      foot = '本周已达 ' + doneN + ' / 7 天' + (remainDays ? ' · 还有 ' + remainDays + ' 天' : '');
    } else {
      status = '<span class="mv-status">还没开始</span>';
      sub = (today ? '今天还没动' : '这一天没有记录') +
        (today && usual ? '，你通常在 ' + usual + ' 左右动起来' : '');
      if (remainDays) {
        foot = '距本周结束还有 ' + remainDays + ' 天' + (gapWeek > 0 ? ' · 再动 ' + gapWeek + ' 次就追平上周' : '');
      } else {
        foot = '本周还剩今天' + (gapWeek > 0 ? ' · 比上周少 ' + gapWeek + ' 天' : '');
      }
    }

    const lines = [];
    lines.push('<span><i' + (streak ? '' : ' class="dim"') + '></i>连续 ' + streak + ' 天 · 本月 ' + monthN + ' 天</span>');
    if (last) lines.push('<span><i class="dim"></i>上次 ' + last + '</span>');

    return '<article class="vital-card move-card' + (done ? ' is-done' : '') + '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '🏃') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>每天 ' + target + ' 次 · 目标 10,000 步</small></div>' +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="move-body">' +
        '<div class="move-left">' +
          status +
          '<div class="vital-sub">' + sub + '</div>' +
          '<div class="move-lines">' + lines.join('') + '</div>' +
        '</div>' +
        moveRingHtml(h) +
      '</div>' +
      '<div class="move-foot">' + foot + '</div>' +
      '<div class="vital-actions">' +
        (done
          ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
          : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">完成运动</button>' +
            '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>') +
      '</div>' +
    '</article>';
  }

  function fmtDur(sec) {
    const s = Math.max(0, Math.round(sec));
    const m = Math.floor(s / 60), r = s % 60;
    if (!m) return r + ' 秒';
    return m + ' 分' + (r ? ' ' + r + ' 秒' : '');
  }

  function habitTotalCount(h) {
    let n = 0;
    Object.keys(state.checks || {}).forEach(ds => { n += countOf(ds, h.id); });
    return n;
  }

  /* 4-7-8 波形：一个周期里吸 / 屏 / 呼 的宽度比 = 4 : 7 : 8 */
  function breathWavePath(cycles) {
    const U = 100, TOP = 6, BOT = 42, T = 19;
    let d = 'M0,' + BOT;
    for (let i = 0; i < cycles; i++) {
      const x = i * U;
      const xa = x + U * 4 / T;
      const xb = x + U * 11 / T;
      const xe = x + U;
      d += ' C' + (x + U * 0.10).toFixed(1) + ',' + BOT + ' ' + (x + U * 0.11).toFixed(1) + ',' + TOP + ' ' + xa.toFixed(1) + ',' + TOP;
      d += ' L' + xb.toFixed(1) + ',' + TOP;
      d += ' C' + (x + U * 0.75).toFixed(1) + ',' + TOP + ' ' + (x + U * 0.80).toFixed(1) + ',' + BOT + ' ' + xe.toFixed(1) + ',' + BOT;
    }
    return d;
  }

  function breathHHMM(min) {
    return pad2(Math.floor(min / 60) % 24) + ':' + pad2(min % 60);
  }

  function breathingCard(h, d) {
    const c = countOf(d, h.id);
    const target = Math.max(1, Number(h.target) || 1);
    const done = c >= target;
    const today = d === todayStr();
    const color = esc(h.color || '#5b8f8a');
    const cycles = Math.max(1, Math.min(8, Number(h.breatheCycles) || 4));
    const totalSec = cycles * 19;
    const suggest = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(h.suggestTime || '')) ? String(h.suggestTime) : '15:00';
    const streak = habitStreak(h);
    const week = weekDaysOf(h);
    const weekDone = week.filter(w => w.done).length;
    const totalN = habitTotalCount(h);

    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const sugMin = Number(suggest.slice(0, 2)) * 60 + Number(suggest.slice(3, 5));
    const diff = sugMin - nowMin;
    const warm = !done && today && diff <= 0 && diff > -60;

    let status, sub;
    if (done) {
      status = today ? '今天已完成' : '这一天完成了';
      sub = cycles + ' 次循环跑完了' + (streak ? ' · 连续 ' + streak + ' 天' : '');
    } else if (!today) {
      status = '这一天没有记录';
      sub = '补记这一天 · 建议时间 ' + suggest;
    } else if (diff > 0) {
      status = '还没开始';
      sub = '现在 ' + breathHHMM(nowMin) + ' · 建议 ' + suggest + ' 做一组，' +
        (diff >= 60 ? '还有 ' + humanDuration(diff) : '还有 ' + diff + ' 分钟');
    } else if (warm) {
      status = '现在正好';
      sub = '现在正是建议的 ' + suggest + ' 时段，做完这一组就踏实了';
    } else {
      status = '还没开始';
      sub = '现在 ' + breathHHMM(nowMin) + ' · 建议的 ' + suggest + ' 那组还没做，睡前补上也有用';
    }

    const mins = Math.round(totalN * totalSec / 60);
    return '<article class="vital-card breathing-card' + (done ? ' is-done' : '') + (warm ? ' is-warm' : '') +
        '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '🌬️') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>每天一组 · ' + cycles +
          ' 次循环 · 约 ' + fmtDur(totalSec) + '</small></div>' +
        (streak ? '<span class="breath-streak">🔥 连续 ' + streak + ' 天</span>' : '') +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="breath-status' + (done ? ' ok' : '') + '">' + status + '</div>' +
      '<div class="vital-sub">' + sub + '</div>' +
      '<div class="breath-wave-wrap">' +
        '<svg class="breath-wave" viewBox="0 0 ' + (cycles * 100) + ' 48" preserveAspectRatio="none" aria-hidden="true">' +
          '<path d="' + breathWavePath(cycles) + '" vector-effect="non-scaling-stroke"/>' +
        '</svg>' +
        '<div class="breath-wave-cap"><b>×' + cycles + ' 次循环</b><i></i><em>吸 4 · 屏 7 · 呼 8 · 共 ' +
          fmtDur(totalSec) + '</em></div>' +
      '</div>' +
      '<div class="breath-foot">本周 <b>' + weekDone + ' / 7</b> 天' +
        (totalN ? ' · 累计 ' + totalN + ' 组（约 ' + Math.max(1, mins) + ' 分钟）' : '') + '</div>' +
      '<div class="vital-actions">' +
        (done
          ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
          : '<button class="vital-btn primary" data-act="breathing-start" data-id="' + h.id + '">开始练习</button>' +
            '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>') +
      '</div>' +
    '</article>';
  }

  function vitalCard(h, d) {
    if (h.id === 'h_breathe') return breathingCard(h, d);
    /* 只有真戒烟有烟盒宽卡；戒糖/戒酒这类走普通卡片，不能出现烟的元素 */
    /* 戒烟走烟盒宽卡；普通戒除跟养成共用一张窄卡（只是点一下的含义相反） */
    if (isSmoke(h)) return quitCard(h, d);
    if (h.type === 'quit') return habitCard(h, d, true);
    const c = countOf(d, h.id);
    const target = Math.max(1, Number(h.target) || 1);
    const done = c >= target;
    const streak = habitStreak(h);
    const color = esc(h.color || '#2f6f5e');
    const unit = esc(h.unit || '次');
    const kind = h.id === 'h_med' ? 'med' : h.id === 'h_water' ? 'water' : h.id === 'h_move' ? 'move' : 'build';
    if (kind === 'move') return moveCardHtml(h, d);
    const times = kind === 'med' ? doseTimes(target) : [];
    const wN = kind === 'water' ? waterTimesN(h) : 0;
    const wPer = kind === 'water' ? waterPerMl(h) : 0;
    const wGoal = kind === 'water' ? waterGoalMl(h) : 0;
    const streakText = streak ? ' · 连续 ' + streak + ' 天' : '';
    const today = d === todayStr();

    let status = '', sub = '', body = '', actions = '';

    if (kind === 'med') {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const next = times[Math.min(c, times.length - 1)];
      const nextMin = Number(next.slice(0, 2)) * 60 + Number(next.slice(3, 5));
      const diff = nextMin - nowMin;
      if (done) {
        status = today ? '今日已完成' : '当日已完成';
        sub = '已记录 ' + target + ' 次' + streakText;
      } else if (!today) {
        status = c + ' / ' + target;
        sub = '补记这一天 · 还差 ' + (target - c) + ' 次' + streakText;
      } else if (diff > 0) {
        status = '下次 ' + next;
        sub = '还有 ' + humanDuration(diff) + streakText;
      } else {
        status = '现在该吃药了';
        sub = next + ' 已过 ' + humanDuration(-diff) + streakText;
      }
      const chips = times.map((t, i) => {
        const tMin = Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
        const cls = i < c ? 'done' : (today && i === c ? 'next' : '');
        const late = today && i === c && !done && nowMin > tMin;
        return '<span class="dose ' + cls + (late ? ' late' : '') + '">' + t + (i < c ? ' ✓' : '') + '</span>';
      }).join('');
      body = '<div class="dose-row">' + chips + '</div>';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">吃了一次</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>';
    } else if (kind === 'water') {
      const ml = waterMlOf(h, c);
      const left = Math.max(0, wGoal - ml);
      const lastAt = waterLastAt(h, d);
      const gapMin = lastAt ? Math.max(0, (Date.now() - lastAt.getTime()) / 60000) : 0;
      const need = today && !done && c > 0 && gapMin >= 90;
      const lastMl = wGoal - (wN - 1) * wPer;
      status = '<span class="vnum">' + ml + '</span><span class="vunit"> / ' + wGoal + ' ml</span>';
      sub = (done
          ? (today ? '今天的 ' + wN + ' ' + unit + '完成了 · 共 ' + ml + ' ml' : '这一天完成了 · ' + ml + ' ml')
          : (left > 0 ? '还差 ' + left + ' ml · ' + Math.max(0, wN - c) + ' ' + unit : '目标已达成')
        ) + streakText;
      const steps = [];
      for (let i = 0; i < wN; i++) {
        const cls = i < c ? 'on' : (i === c && today && !done ? 'cur' : '');
        steps.push('<i' + (cls ? ' class="' + cls + '"' : '') + '></i>');
      }
      const gapTxt = gapMin < 1 ? '刚刚' : humanDuration(gapMin);
      const gapCls = need ? ' need' : '';
      const gapText = lastAt
        ? (need ? '该喝水了 · 已隔 ' + gapTxt
                : '上次 ' + pad2(lastAt.getHours()) + ':' + pad2(lastAt.getMinutes()) + ' · 已隔 ' + gapTxt)
        : (today && !done ? '今天还没喝，先来一杯' : '');
      const pace = (today && !done) ? waterPaceText(h, c) : '';
      body = '<div class="water-steps">' + steps.join('') + '</div>' +
        (gapText ? '<div class="water-gap' + gapCls + '">' + gapText + '</div>' : '') +
        waterDistHtml(h, d) +
        (pace ? '<div class="water-pace">' + pace + '</div>' : '');
      const btnText = c === wN - 1 ? '＋ 最后一杯 ' + lastMl + ' ml' : '＋ 一杯 ' + wPer + ' ml';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">' + btnText + '</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>−</button>';
    } else {
      status = done ? '已完成' : (c > 0 ? c + ' / ' + target : '还没开始');
      sub = done ? (today ? '今天的运动完成了' : '这一天完成了') + streakText : '目标 ' + target + ' ' + unit + streakText;
      body = '<div class="vital-progress"><i style="width:' + Math.min(100, c / target * 100) + '%"></i></div>';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">' + (target > 1 ? '完成一次' : '完成运动') + '</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>';
    }

    return '<article class="vital-card' + (done ? ' is-done' : '') + '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '✅') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>' +
          (kind === 'med' ? '每天 ' + target + ' 次 · ' + times.join(' / ')
            : kind === 'water' ? '每天 ' + wN + ' ' + unit + ' · 共 ' + wGoal + ' ml'
            : '每天 ' + target + ' ' + unit) +
        '</small></div>' +
        (kind === 'water' ? waterWeekHtml(h) : '') +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="vital-status">' + status + '</div>' +
      '<div class="vital-sub">' + sub + '</div>' +
      body +
      '<div class="vital-actions">' + actions + '</div>' +
    '</article>';
  }

  function medCard(h, d) {
    const sched = medScheduledFor(d);
    const total = sched.length;
    const taken = medTakenCount(d);
    const done = total > 0 && taken >= total;
    const next = medNextDose(d);
    const activeMeds = (state.meds || []).filter(m => !isPrn(m) && medActiveOn(m, d));
    const prnMeds = (state.meds || []).filter(m => m.status === 'active' && isPrn(m));
    const low = (state.meds || [])
      .filter(m => m.status === 'active' && !isPrn(m))
      .map(m => ({ m: m, days: medStockDays(m) }))
      .filter(x => x.days !== null && x.days <= 3)
      .sort((a, b) => a.days - b.days)[0];

    let status, sub, actions;
    if (done) {
      status = d === todayStr() ? '今日已完成' : '当日已完成';
      sub = '全部 ' + total + ' 次已记录';
    } else if (total > 0) {
      status = taken + ' / ' + total + ' 次';
      if (next) {
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        const nextMin = Number(next.slot.slice(0, 2)) * 60 + Number(next.slot.slice(3, 5));
        const late = d === todayStr() && nowMin > nextMin;
        sub = (d === todayStr() ? (late ? '该服 ' + next.slot + ' 的药了' : '下次 ' + next.slot) : '补记 ' + next.slot) + ' · ' + next.med.name;
      } else {
        sub = '还有 ' + (total - taken) + ' 次';
      }
    } else if (prnMeds.length) {
      status = '按需用药';
      sub = '需要时记录，不计入完成率';
    } else {
      status = '暂无用药';
      sub = '还没有正在服用的药';
    }

    /* 规格统一：用药 ≥2 种时主按钮让给「查看全部」，记录仍保留为次按钮（一键记下一顿不丢） */
    const medCount = new Set(sched.map(x => x.med.id)).size;
    if (medCount >= 2) {
      actions = '<button class="vital-btn primary" data-nav="meds">查看详细</button>' +
        (next ? '<button class="vital-btn ghost" data-act="med-next">记录 ' + next.slot + '</button>'
              : '<button class="vital-btn ghost" disabled>已完成</button>');
    } else if (total > 0 && next) {
      actions = '<button class="vital-btn primary" data-act="med-next">记录 ' + next.slot + '</button>' +
        '<button class="vital-btn ghost" data-act="med-open">全部</button>';
    } else if (done) {
      actions = '<button class="vital-btn primary" disabled>已完成</button>' +
        '<button class="vital-btn ghost" data-act="med-open">查看</button>';
    } else if (prnMeds.length) {
      actions = '<button class="vital-btn primary" data-act="med-open">打开用药</button>';
    } else {
      actions = '<button class="vital-btn primary" data-act="med-new">添加用药</button>';
    }

    const progress = total ? Math.min(100, taken / total * 100) : 0;
    const titleSmall = total > 0
      ? (activeMeds.length + prnMeds.length) + ' 种药'
      : (prnMeds.length ? '按需用药' : '暂无用药');

    /* 今日用药清单：每种药 → 剂量 · 饭前/饭后+间隔 · 第几天 · 各时段打卡 */
    const groups = [];
    const gmap = {};
    sched.forEach(x => {
      if (!gmap[x.med.id]) {
        gmap[x.med.id] = { med: x.med, slots: [] };
        groups.push(gmap[x.med.id]);
      }
      gmap[x.med.id].slots.push(x.slot);
    });
    const curMin = new Date().getHours() * 60 + new Date().getMinutes();
    const isTd = d === todayStr();
    groups.sort((a, b) => medSortFn(a.med, b.med));

    /* 时段胶囊：单药可点打卡；轮播里只做展示（打卡走「记录」按钮或详情页） */
    const slotChips = (g, tappable) => g.slots.map(slot => {
      const entry = doseAt(d, g.med.id, slot);
      const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
      const isNext = !entry && next && next.med.id === g.med.id && next.slot === slot;
      const late = !entry && isTd && curMin > slotMin;
      const cls = entry ? 'done' : ((isNext ? 'next ' : '') + (late ? 'late' : ''));
      if (!tappable) {
        return '<span class="med-mini is-static ' + cls + '">' + esc(slot) + (entry ? ' ✓' : '') + '</span>';
      }
      return '<button class="med-mini ' + cls + '" data-act="' + (entry ? 'med-undo' : 'med-take') +
        '" data-id="' + g.med.id + '" data-slot="' + esc(slot) +
        '" title="' + (entry ? '点击撤销 ' : '点击记录 ') + esc(slot) + '">' + esc(slot) + (entry ? ' ✓' : '') + '</button>';
    }).join('');

    const medMetaText = g => {
      const dose = Math.round((Number(g.med.doseAmount) || 1) * 100) / 100;
      const mealTxt = mealTimingText(g.med);
      return dose + ' ' + esc(g.med.doseUnit || '') + (mealTxt ? ' · ' + esc(mealTxt) : '');
    };

    let bodyHtml = '';
    if (groups.length >= 2) {
      /* 两种及以上：轮播卡——药名条 + 左右箭头，一次看一种，高度恒定 */
      if (medCardIdx >= groups.length) medCardIdx = 0;
      if (medCardIdx < 0) medCardIdx = groups.length - 1;
      const g = groups[medCardIdx];
      const dayTxt = medDayText(g.med, d);
      const tabs = groups.map((x, i) =>
        '<button type="button" class="med-tab' + (i === medCardIdx ? ' active' : '') +
          '" data-act="med-card-pick" data-idx="' + i + '">' + esc(medShortName(x.med.name)) + '</button>'
      ).join('');
      bodyHtml = '<div class="med-carousel">' +
        '<div class="med-tabs">' + tabs + '</div>' +
        '<div class="med-pane">' +
          '<button type="button" class="med-nav" data-act="med-card-prev" aria-label="上一种">‹</button>' +
          '<div class="med-pane-body">' +
            '<div class="med-pane-top"><b>' + esc(g.med.name) + '</b>' +
              '<i class="med-pane-pos">' + (medCardIdx + 1) + ' / ' + groups.length + '</i></div>' +
            '<div class="med-pane-meta">' + medMetaText(g) +
              (dayTxt ? ' · ' + esc(dayTxt) : '') + '</div>' +
            '<div class="med-line-slots">' + slotChips(g, false) + '</div>' +
          '</div>' +
          '<button type="button" class="med-nav" data-act="med-card-next" aria-label="下一种">›</button>' +
        '</div>' +
      '</div>';
    } else if (groups.length === 1) {
      /* 只有一种药：保持卡面直接打卡，不显示箭头和药名条 */
      const g = groups[0];
      const dayTxt = medDayText(g.med, d);
      bodyHtml = '<div class="med-today"><div class="med-line">' +
        '<div class="med-line-top">' +
          '<b>' + esc(g.med.name) + '</b>' +
          '<span>' + medMetaText(g) + '</span>' +
          (dayTxt ? '<i class="med-line-day">' + esc(dayTxt) + '</i>' : '') +
        '</div>' +
        '<div class="med-line-slots">' + slotChips(g, true) + '</div>' +
      '</div></div>';
    }
    const prnRow = prnMeds.length
      ? '<div class="med-prn-row">按需：' + prnMeds.map(m => esc(m.name)).join('、') + '</div>'
      : '';
    const listHtml = bodyHtml
      ? bodyHtml + prnRow
      : (prnRow ? '<div class="med-today">' + prnRow + '</div>' : '');

    return '<article class="vital-card med-card' + (done ? ' is-done' : '') + '" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">💊</span>' +
        '<div class="vital-title"><b>用药</b><small>' + esc(titleSmall) + '</small></div>' +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="vital-status">' + status + '</div>' +
      '<div class="vital-sub">' + esc(sub) + '</div>' +
      listHtml +
      (low ? '<div class="med-warn">' + esc(low.m.name) + (low.days <= 0 ? ' 已用完' : ' 仅够 ' + low.days + ' 天') + '</div>' : '') +
      '<div class="vital-progress"><i style="width:' + progress + '%"></i></div>' +
      '<div class="vital-actions">' + actions + '</div>' +
    '</article>';
  }

  function medSheetHtml(d) {
    const isToday = d === todayStr();
    const sched = medScheduledFor(d);
    const total = sched.length;
    const taken = medTakenCount(d);
    const next = isToday ? medNextDose(d) : null;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const dd = parseD(d);

    const groups = [];
    const map = {};
    sched.forEach(x => {
      if (!map[x.med.id]) {
        map[x.med.id] = { med: x.med, slots: [] };
        groups.push(map[x.med.id]);
      }
      map[x.med.id].slots.push(x.slot);
    });

    const groupHtml = groups.map(g => {
      const med = g.med;
      const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
      const stock = medStockLabel(med);
      const head = '<div class="med-item-head">' +
        '<span class="med-item-ico">💊</span>' +
        '<div class="med-item-title"><b>' + esc(med.name) + '</b><small>' +
          '每次 ' + dose + ' ' + esc(med.doseUnit || '') +
          (med.strength ? '（' + esc(med.strength) + '）' : '') +
          (med.purpose && med.purpose !== '其他' ? ' · ' + esc(med.purpose) : '') +
          (mealTimingText(med) ? ' · ' + esc(mealTimingText(med)) : '') +
          (med.manufacturer ? ' · ' + esc(med.manufacturer) : '') +
          ((med.medInfo || med.note) ? ' · ' + esc(med.medInfo || med.note) : '') +
          ' · ' + esc(medCourseLabelOn(med, d)) +
        '</small></div>' +
        (stock ? '<span class="med-item-stock">' + esc(stock) + '</span>' : '') +
      '</div>';
      const doses = g.slots.map(slot => {
        const entry = doseAt(d, med.id, slot);
        const isTaken = !!entry;
        const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
        const isNext = !!(next && next.med.id === med.id && next.slot === slot);
        const late = !isTaken && (!isToday || nowMin > slotMin);
        const cls = isTaken ? 'done' : ((isNext ? 'next ' : '') + (late ? 'late' : ''));
        return '<button class="med-dose ' + cls + '" data-act="' + (isTaken ? 'med-undo' : 'med-take') +
          '" data-id="' + med.id + '" data-slot="' + slot + '">' +
          slot + (isTaken ? ' ✓' : '') +
        '</button>';
      }).join('');
      return '<div class="med-item">' + head +
        '<div class="med-dose-row">' + doses + '</div>' +
      '</div>';
    }).join('');

    const prnMeds = (state.meds || []).filter(m => m.status === 'active' && isPrn(m));
    const prnHtml = prnMeds.map(med => {
      const keys = prnKeys(d, med.id);
      const times = keys.map(k => {
        const e = state.doses[d][med.id][k];
        const at = new Date(e.at);
        return isNaN(at.getTime()) ? '' : pad2(at.getHours()) + ':' + pad2(at.getMinutes());
      }).filter(Boolean);
      const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
      return '<div class="med-item med-prn">' +
        '<div class="med-item-head"><span class="med-item-ico">💊</span>' +
          '<div class="med-item-title"><b>' + esc(med.name) + '</b><small>按需 · 每次 ' + dose + ' ' + esc(med.doseUnit || '') +
            (med.note ? ' · ' + esc(med.note) : '') + '</small></div>' +
          (medStockLabel(med) ? '<span class="med-item-stock">' + esc(medStockLabel(med)) + '</span>' : '') +
        '</div>' +
        '<div class="med-prn-row">' +
          '<span class="med-prn-count">' + (isToday ? '今日' : '当日') + ' ' + keys.length + ' 次' +
            (times.length ? ' · ' + times.join(' / ') : '') + '</span>' +
          '<button class="med-dose next" data-act="med-prn" data-id="' + med.id + '">＋ 记一次</button>' +
          (keys.length ? '<button class="med-dose" data-act="med-prn-undo" data-id="' + med.id + '">撤销</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    const body = groupHtml + prnHtml;
    const headText = total > 0 ? taken + ' / ' + total + ' 次' : (prnMeds.length ? '按需用药' : '暂无计划');

    return '<div class="modal-card med-sheet" id="med-sheet">' +
      '<div class="med-sheet-head"><div><h3>' + (isToday ? '今日用药' : '当日用药') + '</h3>' +
        '<span class="muted-sm">' + dd.getFullYear() + ' 年 ' + (dd.getMonth() + 1) + ' 月 ' + dd.getDate() + ' 日 · ' + headText + '</span></div>' +
        '<button class="icon-btn" data-act="close-modal" title="关闭">✕</button>' +
      '</div>' +
      (body || '<div class="empty-box">这一天没有用药计划。可在设置 → 用药管理里添加。</div>') +
      '<div class="modal-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-act="close-modal">关闭</button></div>' +
    '</div>';
  }

  function taskRow(t, d) {
    const overdue = t.status !== 'done' && t.due && t.due < d;
    const tagColor = TAGS[t.tag] || TAGS['其他'];
    const repeat = taskRepeatLabel(t);
    return '<div class="task-row ' + (t.status === 'done' ? 'done' : '') + '">' +
      '<button class="check" data-act="task-toggle" data-id="' + t.id + '" data-date="' + d + '" aria-label="切换完成">✓</button>' +
      '<div class="task-row-main">' +
        '<div class="task-row-title">' + esc(t.title) + '</div>' +
        '<div class="task-row-meta">' +
          '<span class="tag" style="--tag:' + tagColor + '">' + esc(t.tag || '其他') + '</span>' +
          (repeat ? '<span class="repeat-badge">' + esc(repeat) + '</span>' : '') +
          '<span class="due ' + (overdue ? 'overdue' : '') + '">' + dueText(t) + '</span>' +
        '</div>' +
      '</div>' +
      '<button class="icon-btn" data-act="task-edit" data-id="' + t.id + '" aria-label="编辑任务">✎</button>' +
      '</div>';
  }

  function weekPanel() {
    const base = parseD(selectedDate);
    const dow = (base.getDay() + 6) % 7;
    const monday = addDays(base, -dow);
    const days = [];
    let recCount = 0, sum = 0, qualified = 0;
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const future = ds > todayStr();
      const pct = Math.round(st.ratio * 100);
      if (rec) { recCount++; sum += st.ratio; if (st.ratio >= 0.75) qualified++; }
      const dd = parseD(ds);
      days.push({ ds: ds, rec: rec, pct: pct, wd: WEEK_CN[dd.getDay()], num: dd.getDate(), future: future });
    }
    const avg = recCount ? Math.round(sum / recCount * 100) : 0;
    const title = (todayStr() >= days[0].ds && todayStr() <= days[6].ds) ? '本周' : '这一周';
    const strip = days.map(x => {
      const sel = x.ds === selectedDate;
      const h = x.rec ? Math.max(6, x.pct) : 2;
      return '<button class="wk' + (sel ? ' is-sel' : '') + (x.rec ? ' has-data' : '') + (x.future ? ' is-future' : '') + '"' +
        ' data-act="pick-week-day" data-date="' + x.ds + '"' + (x.future ? ' disabled' : '') +
        ' title="' + x.ds + ' · ' + (x.future ? '未来' : (x.rec ? '完成 ' + x.pct + '%' : '无记录')) + '">' +
        '<span class="wk-wd">' + x.wd + '</span>' +
        '<span class="wk-track"><i class="' + (x.rec ? '' : 'empty') + '" style="height:' + h + '%"></i></span>' +
        '<span class="wk-num">' + x.num + '</span>' +
        '</button>';
    }).join('');
    return '<section class="panel week-panel">' +
      '<div class="panel-head"><h3>' + title + '</h3><span class="muted-sm">' +
        days[0].ds.slice(5).replace('-', '/') + ' – ' + days[6].ds.slice(5).replace('-', '/') +
      '</span></div>' +
      '<div class="week-strip">' + strip + '</div>' +
      '<div class="week-foot">' +
        '<span>记录 <b>' + recCount + '</b> 天</span>' +
        '<span>平均 <b>' + (recCount ? avg + '%' : '—') + '</b></span>' +
        '<span>达标 <b>' + qualified + '</b> 天</span>' +
      '</div>' +
    '</section>';
  }

        '<div class="hw-meta">记录 ' + recCount + ' 天 · 达标 ' + qualified + ' 天</div>' +
      '</div>' +
      '<div class="hw-chart">' +
        '<div class="hw-head"><span>' + title + '</span><span>' + range + '</span></div>' +
