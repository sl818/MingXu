        '<span class="hw-num">' + x.num + '</span>' +
      '</span>';
    }).join('');
    return '<div class="hero-week" aria-hidden="true">' +
      '<div class="hw-stats">' +
        '<div class="hw-big"><b>' + (recCount ? avg + '%' : '—') + '</b><span>本周平均</span></div>' +
        '<div class="hw-meta">记录 ' + recCount + ' 天 · 达标 ' + qualified + ' 天</div>' +
      '</div>' +
      '<div class="hw-chart">' +
        '<div class="hw-head"><span>' + title + '</span><span>' + range + '</span></div>' +
        '<div class="hw-strip">' + strip + '</div>' +
      '</div>' +
    '</div>';
  }

  /* 右栏：本周概览 */
  function railWeekHtml() {
    const base = parseD(selectedDate);
    const dow = (base.getDay() + 6) % 7;
    const monday = addDays(base, -dow);
    const days = [];
    let rec = 0, sum = 0;
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      const s = dayStats(ds);
      const has = hasRecords(ds);
      if (has) { rec++; sum += s.ratio; }
      days.push({ ds: ds, has: has, pct: Math.round(s.ratio * 100), wd: WEEK_CN[parseD(ds).getDay()] });
    }
    const avg = rec ? Math.round(sum / rec * 100) : 0;
    const end = addDays(monday, 6);
    const range = (monday.getMonth() + 1) + '/' + monday.getDate() + '–' + (end.getMonth() + 1) + '/' + end.getDate();
    const bars = days.map(x => {
      const bar = x.has
        ? '<i style="height:' + Math.max(8, x.pct) + '%"></i>'
        : '<i class="none"></i>';
      return '<span class="rail-day' + (x.ds === selectedDate ? ' is-today' : '') + '">' +
        '<span class="rail-bar">' + bar + '</span>' +
        '<span class="rail-wd">' + x.wd + '</span>' +
      '</span>';
    }).join('');
    return '<section class="rail-card">' +
      '<div class="rail-head"><h3>本周概览</h3><span>' + range + '</span></div>' +
      '<div class="rail-week">' + bars + '</div>' +
      '<p class="rail-note">' + (rec ? rec + ' 天有记录 · 平均 ' + avg + '%' : '本周还没有记录') + ' · 灰色为无记录日</p>' +
    '</section>';
  }

  /* 右栏：下一次用药提醒 */
  function railRemindHtml() {
    const d = todayStr();
    const sched = medScheduledFor(d);
    if (!sched.length) {
      return '<section class="rail-card">' +
        '<div class="rail-head"><h3>下一次提醒</h3></div>' +
        '<p class="rail-empty">还没有用药排期。在「习惯与用药」里添加后会在这里提示。</p>' +
      '</section>';
    }
    const taken = medTakenCount(d);
    const next = medNextDose(d);
    const stocks = (state.meds || [])
      .filter(m => m.status === 'active' && !isPrn(m))
      .map(m => ({ m: m, days: medStockDays(m) }))
      .filter(x => x.days !== null)
      .sort((a, b) => a.days - b.days);
    const stockTxt = stocks.length ? ' · 库存 ' + stocks[0].days + ' 天' : '';
    if (!next) {
      return '<section class="rail-card">' +
        '<div class="rail-head"><h3>下一次提醒</h3><span>已完成</span></div>' +
        '<div class="rail-remind"><span class="rail-clock">✓</span><div>' +
          '<b>今日 ' + sched.length + ' 次已全部完成</b>' +
          '<small>共 ' + sched.length + ' 次排期' + stockTxt + '</small>' +
        '</div></div>' +
      '</section>';
    }
    return '<section class="rail-card">' +
      '<div class="rail-head"><h3>下一次提醒</h3><span>' + taken + '/' + sched.length + '</span></div>' +
      '<div class="rail-remind"><span class="rail-clock">⏰</span><div>' +
        '<b>' + next.slot + ' · ' + esc(next.med.name) + '</b>' +
        '<small>今天还差 ' + (sched.length - taken) + ' 次' + stockTxt + '</small>' +
      '</div></div>' +
    '</section>';
  }

  function viewToday() {
    const d = selectedDate;
    const isToday = d === todayStr();
    const st = dayStats(d);
    const pct = Math.round(st.ratio * 100);
    const dd = parseD(d);
    const streak = overallStreak();
    const pend = pendingTasks(d);
    const doneToday = liveTasks().filter(t => t.status === 'done' && t.doneAt === d);
    const visibleHabits = state.habits.filter(h => !isArchived(h));

    let sub;
    if (!visibleHabits.length) {
      sub = '还没有习惯，先去「习惯」页添加第一个吧。';
    } else if (!hasRecords(d)) {
      sub = isToday ? '今天还没有开始，从最简单的那一项开始。' : '这一天还没有记录，可以补记。';
    } else if (st.done === st.total) {
      sub = '全部完成，今天做得很好 🎉';
    } else {
      const missed = activeHabits(d).filter(h => !met(h, d)).map(h => h.name);
      sub = '还差 ' + missed.length + ' 项：' + missed.join('、');
    }

    const pinned = PINNED_IDS.map(id => visibleHabits.find(h => h.id === id)).filter(Boolean);
    const others = visibleHabits.filter(h => pinned.indexOf(h) < 0);
    let habitHtml, habitMeta;
    if (!visibleHabits.length) {
      habitHtml = '<div class="empty-box">还没有习惯。去「习惯」页添加「喝水」「运动」等，开始记录。</div>';
      habitMeta = '还没有习惯';
    } else {
      habitHtml =
        (pinned.length ? '<div class="vital-grid">' + pinned.map(h => h.med ? medCard(h, d) : vitalCard(h, d)).join('') + '</div>' : '') +
        (others.length ? '<div class="section-sub">其他习惯</div><div class="habit-grid">' + others.map(h => habitCard(h, d)).join('') + '</div>' : '');
      habitMeta = (pinned.length ? pinned.length + ' 项常驻' : '') +
        (others.length ? (pinned.length ? ' · ' : '') + others.length + ' 项其他' : '');
    }

    const taskHtml = pend.length || doneToday.length
      ? pend.map(t => taskRow(t, d)).join('') +
        (doneToday.length
          ? '<div class="done-sep">已完成 ' + doneToday.length + ' 条</div>' + doneToday.map(t => taskRow(t, d)).join('')
          : '')
      : '<div class="empty-box">今天没有待办，享受空白的一天。</div>';

    const mood = (state.moods && state.moods[d]) || '';
    const moodPanel = '' +
      '<section class="panel mood-panel">' +
        '<div class="panel-head"><h3>' + (isToday ? '今日状态' : '当日状态') + '</h3><span class="muted-sm">' + (mood ? '已记录' : '选一个') + '</span></div>' +
        '<div class="mood-options">' +
          MOODS.map(m =>
            '<button class="mood ' + m.key + (mood === m.key ? ' active' : '') + '" data-act="set-mood" data-mood="' + m.key + '">' +
              '<span class="mood-e">' + m.emoji + '</span>' +
              '<span class="mood-l">' + m.label + '</span>' +
            '</button>'
          ).join('') +
        '</div>' +
        '<p class="mood-hint">' + (mood ? '点一次已选状态可以取消。' : '记录每天的心情，回看时会很有意义。') + '</p>' +
      '</section>';

    return '' +
      '<div class="today-grid">' +
      '<div class="today-col">' +
        '<section class="hero">' +
          '<div class="hero-main">' +
            '<div class="hero-date">' +
              '<button class="hero-arrow" data-act="date-shift" data-delta="-1" aria-label="前一天">‹</button>' +
              '<span>' + dd.getFullYear() + ' 年 ' + (dd.getMonth() + 1) + ' 月 ' + dd.getDate() + ' 日 · 星期' + WEEK_CN[dd.getDay()] + '</span>' +
              '<button class="hero-arrow" data-act="date-shift" data-delta="1" aria-label="后一天"' + (isToday ? ' disabled' : '') + '>›</button>' +
              (isToday ? '<span class="hero-tag">今天</span>' : '<button class="hero-today" data-act="date-today">回到今天</button>') +
            '</div>' +
            '<h1>' + (isToday ? greet() : '补记') + ' · 完成 ' + st.done + '/' + st.total + ' 项</h1>' +
            '<p>' + esc(sub) + '</p>' +
            '<div class="hero-chips">' +
              '<span>🔥 连续达标 ' + streak + ' 天</span>' +
              '<span>📋 待办 ' + pend.length + ' 条</span>' +
            '</div>' +
          '</div>' +
          heroWeekPanel() +
          '<div class="hero-ring">' + ring(st.ratio, 116, 8, '#d8b25f', 'rgba(246,240,227,.14)') +
            '<div class="hero-pct"><b>' + pct + '%</b><small><span class="pct-long">' + (isToday ? '今日完成度' : '当日完成度') + '</span><span class="pct-short">' + (isToday ? '今日完成' : '当日完成') + '</span></small></div>' +
          '</div>' +
        '</section>' +

        '<div class="section-head"><h2>' + (isToday ? '今日打卡' : '当日打卡') + '</h2><span class="muted-sm">' + habitMeta + (visibleHabits.length ? ' · 点击打卡' : '') + (isToday ? '' : ' · 补记模式') + '</span></div>' +
        habitHtml +

        '<div class="section-head"><h2>' + (isToday ? '今日待办' : '当日待办') + '</h2><span class="muted-sm">' + pend.length + ' 条未完成</span></div>' +
        '<div class="task-list">' + taskHtml + '</div>' +

        '<form class="quick-add" id="quick-form">' +
          '<input name="title" maxlength="80" autocomplete="off" placeholder="＋ 添加一条' + (isToday ? '今日' : '当天') + '待办，回车保存">' +
          '<button class="btn primary" type="submit">添加</button>' +
        '</form>' +

        '<div class="today-rule" aria-hidden="true"></div>' +
        '<div class="today-lower">' +
          weekPanel() +
          moodPanel +
        '</div>' +
      '</div>' +
      '<aside class="rail">' +
        railRemindHtml() +
        '<div class="rail-sync" id="rail-sync"></div>' +
      '</aside>' +
      '</div>';
  }

  /* ============================================================
     看板视图
     ============================================================ */
  /* 右栏日期筛选：只存内存，不进 state（避免纯视图操作触发云保存） */
  let boardFilterDay = '';
  /* 双击展开的任务 id：视图状态，同样不进 state */
  const openTaskIds = new Set();
  /* 统计页「打卡时间」是否展开全部 */
  let statsLogOpen = false;
  /* 体重折线图区间：0 = 全部 */
  let weightRange = 0;

  function boardDayLabel(ds) {
    const today = todayStr();
    if (ds === today) return '今天';
    if (ds === fmt(addDays(new Date(), 1))) return '明天';
    if (ds === fmt(addDays(new Date(), -1))) return '昨天';
    return Number(ds.slice(5, 7)) + ' 月 ' + Number(ds.slice(8, 10)) + ' 日';
  }

  function boardMdText(ds) {
    return Number(ds.slice(5, 7)) + '/' + Number(ds.slice(8, 10));
  }

  function boardMiniCalHtml() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const lead = new Date(y, m, 1).getDay();
    const total = new Date(y, m + 1, 0).getDate();
    const today = todayStr();
    const marks = {};
    liveTasks().forEach(t => {
      if (!t.due || t.status === 'done' || t.status === 'cancelled') return;
      marks[t.due] = (marks[t.due] || 0) + 1;
    });
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span class="bcal-d is-blank"></span>';
    for (let d = 1; d <= total; d++) {
      const ds = fmt(new Date(y, m, d));
      const cls = ['bcal-d'];
      if (marks[ds]) cls.push('has');
      if (ds === today) cls.push('is-today');
      if (ds === boardFilterDay) cls.push('on');
      cells += '<button class="' + cls.join(' ') + '" data-act="board-filter-day" data-day="' + ds + '"' +
        ' title="' + (marks[ds] || 0) + ' 条待处理">' + d + '</button>';
    }
    return '<div class="rail-card">' +
      '<div class="rail-head"><h3>' + (m + 1) + ' 月</h3><span>点日期筛选</span></div>' +
      '<div class="bcal">' +
        ['日', '一', '二', '三', '四', '五', '六'].map(w => '<span class="bcal-wd">' + w + '</span>').join('') +
        cells +
      '</div>' +
    '</div>';
  }

  function boardUpcomingHtml() {
    const today = todayStr();
    const live = liveTasks().filter(t => (t.status === 'todo' || t.status === 'doing') && t.due);
    const over = live.filter(t => t.due < today).sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
    const days = [];
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(new Date(), i));
      const list = live.filter(t => t.due === ds);
      if (list.length) days.push({ ds, i, list });
    }
    const totalCount = over.length + days.reduce((s, g) => s + g.list.length, 0);
    const item = (t, withDate) => {
      const prio = PRIO[t.priority] || PRIO['中'];
      return '<button class="bup-i' + (t.due < today ? ' is-over' : '') + '" data-act="board-focus"' +
        ' data-id="' + t.id + '" title="' + esc(t.title) + '">' +
        '<i class="bd" style="--prio:' + prio + '"></i>' +
        '<span class="bt">' + (withDate ? '<span class="bmd">' + boardMdText(t.due) + '</span>' : '') + esc(t.title) + '</span>' +
      '</button>';
    };
    if (!totalCount) {
      return '<div class="rail-card">' +
        '<div class="rail-head"><h3>接下来 7 天</h3></div>' +
        '<div class="rail-empty">近 7 天没有到期的任务，可以先松一口气。</div>' +
      '</div>';
    }
    let html = '';
    if (over.length) {
      html += '<div class="bup-g"><b>已逾期</b><em>' + over.length + ' 条</em><i></i></div>' +
        over.map(t => item(t, true)).join('');
    }
    days.forEach(g => {
      const label = g.i === 0 ? '今天' : g.i === 1 ? '明天' : '周' + WEEK_CN[parseD(g.ds).getDay()];
      html += '<div class="bup-g"><b>' + label + '</b><em>' + g.list.length + ' 条</em><i></i></div>' +
        g.list.map(t => item(t, false)).join('');
    });
    return '<div class="rail-card">' +
      '<div class="rail-head"><h3>接下来 7 天</h3><span>' + totalCount + ' 条待办</span></div>' +
      '<div class="bup">' + html + '</div>' +
    '</div>';
  }

  /* 双击展开的任务详情：备注全文 + 元信息 */
  function taskDetailHtml(t) {
    const parts = [];
    if (t.note) parts.push('<div class="td-note">' + esc(t.note) + '</div>');
    const meta = [];
    if (t.due) {
      meta.push('截止 ' + t.due + (t.status === 'done' || t.status === 'cancelled' ? '' : '（' + dueText(t) + '）'));
    } else {
      meta.push('无期限');
    }
    meta.push('优先级 ' + (t.priority || '中'));
    const rep = taskRepeatLabel(t);
    if (rep) meta.push('重复 ' + rep);
    if (t.createdAt) meta.push('创建 ' + String(t.createdAt).slice(0, 10));
    if (t.status === 'done' && t.doneAt) meta.push('完成 ' + t.doneAt);
    parts.push('<div class="td-meta">' + meta.map(m => '<span>' + esc(m) + '</span>').join('') + '</div>');
    if (!t.archivedAt) {
      parts.push('<div class="td-acts">' +
        '<button type="button" class="td-btn" data-act="task-archive" data-id="' + t.id + '">归档</button>' +
      '</div>');
    }
    return parts.join('');
  }

  function taskCard(t) {
    const overdue = t.status !== 'done' && t.status !== 'cancelled' && t.due && t.due < todayStr();
    const tagColor = TAGS[t.tag] || TAGS['其他'];
    const prio = PRIO[t.priority] || PRIO['中'];
    const cancelled = t.status === 'cancelled';
    const repeat = taskRepeatLabel(t);
    return '<article class="task ' + (t.status === 'done' ? 'done' : '') + (cancelled ? ' cancelled' : '') +
        (openTaskIds.has(t.id) ? ' is-open' : '') + '" draggable="true" data-id="' + t.id +
        '" title="双击展开详情" style="--prio:' + prio + '">' +
      '<div class="task-top">' +
        '<span class="tag" style="--tag:' + tagColor + '">' + esc(t.tag || '其他') + '</span>' +
        (repeat ? '<span class="repeat-badge">' + esc(repeat) + '</span>' : '') +
        '<span class="prio" style="--prio:' + prio + '">' + esc(t.priority || '中') + '</span>' +
      '</div>' +
      '<h4>' + esc(t.title) + '</h4>' +
      (t.note ? '<p>' + esc(t.note) + '</p>' : '') +
      '<div class="task-foot">' +
        '<span class="due ' + (overdue ? 'overdue' : '') + '">' + dueText(t) + '</span>' +
        '<div class="task-btns">' +
          (!cancelled && t.status !== 'todo' ? '<button class="icon-btn" data-act="task-move" data-id="' + t.id + '" data-dir="-1" title="移到上一列">←</button>' : '') +
          (!cancelled && t.status !== 'done' ? '<button class="icon-btn" data-act="task-move" data-id="' + t.id + '" data-dir="1" title="移到下一列">→</button>' : '') +
          (cancelled ? '<button class="icon-btn" data-act="task-restore" data-id="' + t.id + '" title="恢复为待办">↩</button>' : '') +
          '<button class="icon-btn" data-act="task-edit" data-id="' + t.id + '" title="编辑">✎</button>' +
        '</div>' +
      '</div>' +
      '<div class="task-detail">' + taskDetailHtml(t) + '</div>' +
      '</article>';
  }

  function viewBoard() {
    const cols = [
      { key: 'todo', label: '待办', color: '#8a8f83', hint: '想到的事先放这里，拖动卡片可推进' },
      { key: 'doing', label: '进行中', color: '#b8893b', hint: '一次只推进一件事' },
      { key: 'done', label: '已完成', color: '#2f7d5c', hint: '完成的任务会收在这里' },
      { key: 'cancelled', label: '已取消', color: '#9c5a5a', hint: '把卡片拖到这一列即可取消，可随时恢复' }
    ];
    const doneCount = liveTasks().filter(t => t.status === 'done').length;
    const archCount = archivedTasks().length;
    const filt = boardFilterDay;
    const board = '<div class="board">' +
      cols.map(c => {
        const list = liveTasks().filter(t => t.status === c.key && (!filt || t.due === filt));
        return '<section class="col" data-status="' + c.key + '">' +
          '<header class="col-head">' +
            '<span class="dot" style="background:' + c.color + '"></span>' +
            '<b>' + c.label + '</b>' +
            '<span class="col-count">' + list.length + '</span>' +
            '<button class="icon-btn add" data-act="task-new" data-status="' + c.key + '" title="在此列新建">＋</button>' +
          '</header>' +
          '<div class="col-body" data-status="' + c.key + '">' +
            (list.length ? list.map(taskCard).join('')
              : '<div class="col-empty">' + (filt ? '这天没有' + c.label + '的任务' : c.hint) + '</div>') +
          '</div>' +
        '</section>';
      }).join('') +
    '</div>';
    return '' +
      '<div class="page-head">' +
        '<div><h2>待办</h2><p>拖动卡片切换状态，拖到右侧「归档」即收进历史；双击卡片展开详情；右键可在列内新建或在卡片上编辑。</p></div>' +
        '<div class="head-actions">' +
          (doneCount ? '<button class="btn ghost" data-act="clear-done">清理已完成</button>' : '') +
          '<button class="btn ghost" data-act="archive-open">归档' + (archCount ? ' ' + archCount : '') + '</button>' +
          '<button class="btn primary" data-act="task-new" data-status="todo">＋ 新建任务</button>' +
        '</div>' +
      '</div>' +
      '<div class="board-shell">' +
        '<div class="board-col-wrap">' +
          (filt
            ? '<div class="board-filter">正在看 <b>' + boardDayLabel(filt) + '</b> 到期的任务' +
              '<button class="bf-clear" data-act="board-filter-clear" title="显示全部任务">✕</button></div>'
            : '') +
          board +
        '</div>' +
        '<aside class="board-rail">' + boardMiniCalHtml() + boardUpcomingHtml() +
          '<div class="arch-zone" data-arch="1">' +
            '<span class="az-ico">↓</span>' +
            '<b>拖到这里归档</b>' +
            '收进历史，随时可以找回' +
          '</div>' +
        '</aside>' +
      '</div>';
  }

  /* ============================================================
     日历视图
     ============================================================ */
  function monthMedPanel(y, m) {
    const meds = Array.isArray(state.meds) ? state.meds : [];
    if (!meds.length) return '<div class="empty-box">还没有用药记录。</div>';
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const rows = meds.map(med => {
      let scheduled = 0, taken = 0, prn = 0;
      const slots = medDoseSlots(med);
      for (let day = 1; day <= days; day++) {
        const ds = fmt(new Date(y, m, day));
        if (ds > now) break;
        if (isPrn(med)) {
          prn += prnKeys(ds, med.id).length;
          continue;
        }
        if (!medActiveOn(med, ds)) continue;
        slots.forEach(slot => {
          scheduled++;
          if (doseAt(ds, med.id, slot)) taken++;
        });
      }
      const rate = scheduled ? Math.round(taken / scheduled * 100) : 0;
      const paused = med.status !== 'active';
      const status = paused ? '已暂停' : (scheduled ? '' : '暂无排期');
      const count = isPrn(med)
        ? '按需 · ' + prn + ' 次'
        : (scheduled ? taken + ' / ' + scheduled + ' 次' : '—');
      return '<div class="mh med-mh">' +
        '<span class="habit-icon sm" style="--hc:#6f7f91">💊</span>' +
        '<div class="mh-main">' +
          '<div class="mh-top"><b>' + esc(med.name) + '</b><span>' + esc(count) + '</span></div>' +
          '<div class="mh-bar"><i style="width:' + (isPrn(med) ? 0 : rate) + '%"></i></div>' +
          '<small class="mh-extra">' + esc(medCourseLabel(med)) +
            (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
            (status ? ' · ' + esc(status) : '') +
          '</small>' +
        '</div>' +
      '</div>';
    }).filter(Boolean).join('');
    return rows || '<div class="empty-box">本月还没有用药数据。</div>';
  }

  function monthSide(y, m) {
    const days = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    let rec = 0, best = 0, run = 0;

    for (let day = 1; day <= days; day++) {
      const ds = fmt(new Date(y, m, day));
      if (ds > now) break;
      if (hasRecords(ds)) rec++;
      if (dayQualified(ds)) {
        run++;
        if (run > best) best = run;
      } else {
        run = 0;
      }
    }

    const rows = state.habits.filter(h => !h.optional && !isArchived(h)).map(h => {
      let hit = 0, total = 0, lapse = 0;
      for (let day = 1; day <= days; day++) {
        const ds = fmt(new Date(y, m, day));
        if (ds > now || !hasRecords(ds)) continue;
        total++;
        if (h.type === 'quit') {
          if (countOf(ds, h.id) > 0) lapse++;
          else hit++;
        } else if (met(h, ds)) {
          hit++;
        }
      }
      return { h: h, hit: hit, total: total, lapse: lapse, rate: total ? hit / total : 0 };
    });

    let bestRow = null, weakRow = null;
    rows.forEach(r => {
      if (!r.total) return;
      if (!bestRow || r.rate > bestRow.rate) bestRow = r;
      if (!weakRow || r.rate < weakRow.rate) weakRow = r;
    });

    const habitRows = rows.map(r => {
      const pct = Math.round(r.rate * 100);
      const num = r.h.type === 'quit'
        ? '保持 ' + r.hit + ' / ' + r.total + ' 天'
        : '达标 ' + r.hit + ' / ' + r.total + ' 天';
      return '<div class="mh" style="--hc:' + esc(r.h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(r.h.color || '#2f6f5e') + '">' + esc(r.h.icon || '✅') + '</span>' +
        '<div class="mh-main">' +
          '<div class="mh-top"><b>' + esc(r.h.name) + '</b><span>' + num + '</span></div>' +
          '<div class="mh-bar"><i style="width:' + pct + '%"></i></div>' +
          (r.h.type === 'quit' && r.lapse ? '<small class="mh-extra">破戒 ' + r.lapse + ' 次</small>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    const statLine = rec
      ? (bestRow ? '最稳：<b>' + esc(bestRow.h.name) + '</b>（' + Math.round(bestRow.rate * 100) + '%）' : '')
      : '本月还没有记录，点日历里的任意一天可以补记。';

    const moodCounts = { sad: 0, ok: 0, happy: 0 };
    let moodDays = 0;
    for (let day = 1; day <= days; day++) {
      const ds = fmt(new Date(y, m, day));
      if (ds > now) break;
      const mv = state.moods && state.moods[ds];
      if (mv && Object.prototype.hasOwnProperty.call(moodCounts, mv)) {
        moodCounts[mv]++;
        moodDays++;
      }
    }
    const moodMax = Math.max(1, moodCounts.sad, moodCounts.ok, moodCounts.happy);
    const moodRows = MOODS.map(m => {
      const n = moodCounts[m.key];
      return '<div class="mstat ' + m.key + '">' +
        '<div class="mstat-top"><span>' + m.emoji + ' ' + m.label + '</span><b>' + n + ' 天</b></div>' +
        '<div class="mstat-bar"><i style="width:' + Math.round(n / moodMax * 100) + '%"></i></div>' +
      '</div>';
    }).join('');

    return '' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月习惯</h3>' +
        (habitRows || '<div class="empty-box">还没有习惯。</div>') +
      '</section>' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月用药</h3>' +
        monthMedPanel(y, m) +
      '</section>' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月小结</h3>' +
        '<div class="cal-highlight"><b>' + best + '</b><span>天最长连续达标</span></div>' +
        '<p class="cal-note">' + statLine +
          (rec && weakRow && weakRow !== bestRow ? '<br>待加强：<b>' + esc(weakRow.h.name) + '</b>（' + Math.round(weakRow.rate * 100) + '%）' : '') +
        '</p>' +
        '<div class="cal-hint">达标 = 当天完成率 ≥ 75%；连续达标按天累计。</div>' +
      '</section>' +
      '<section class="panel cal-side-panel">' +
        '<h3>本月心情</h3>' +
        '<div class="mstat-list">' + moodRows + '</div>' +
        '<div class="cal-hint">' + (moodDays ? '本月记录 ' + moodDays + ' 天心情' : '本月还没有心情记录，去今日页选一个。') + '</div>' +
      '</section>' +
      monthWeightSide(y, m);
  }

  function monthWeightSide(y, m) {
    const prefix = y + '-' + pad2(m + 1);
    const list = weightRecords().filter(w => String(w.date).indexOf(prefix) === 0 && w.date <= todayStr());
    if (!list.length) {
      return '<section class="panel cal-side-panel">' +
        '<h3>本月体重</h3>' +
        '<div class="empty-box">本月还没有体重记录。</div>' +
        '<div class="cal-hint">去「体重」页记录一次，这里会显示变化。</div>' +
      '</section>';
    }
    const latest = list[list.length - 1];
    const first = list[0];
    const info = bmiCategory(latest.bmi);
    const diff = Math.round((latest.weight - first.weight) * 10) / 10;
    const delta = diff === 0 ? '持平' : (diff > 0 ? '+' : '') + diff + ' kg';
    return '<section class="panel cal-side-panel">' +
      '<h3>本月体重</h3>' +
      '<div class="cal-highlight weight-month"><b>' + esc(latest.weight) + '</b><span>kg · BMI ' + esc(latest.bmi) + ' ' + esc(info.label) + '</span></div>' +
      '<p class="cal-note">记录 ' + list.length + ' 次 · 较本月首次 ' + delta + '</p>' +
      '<div class="cal-hint">最近一次 ' + esc(latest.date) + (latest.age < 18 ? ' · 未成年 BMI 仅参考' : '') + '</div>' +
    '</section>';
  }

  function viewCalendar() {
    const y = calMonth.getFullYear();
    const m = calMonth.getMonth();
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const now = todayStr();
    const ym = y + '-' + pad2(m + 1);
    const wmap = {};
    weightRecords().forEach(w => {
      if (String(w.date).indexOf(ym) === 0) wmap[w.date] = w;
    });

    let recorded = 0, sum = 0, qualified = 0;
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div class="cal-cell blank"></div>';

    for (let day = 1; day <= daysInMonth; day++) {
      const ds = fmt(new Date(y, m, day));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const future = ds > now;
      if (rec) {
        recorded++;
        sum += st.ratio;
        if (st.ratio >= 0.75) qualified++;
      }
      const pct = Math.round(st.ratio * 100);
      const level = future || !rec ? 0
        : pct >= 100 ? 4
        : pct >= 75 ? 3
        : pct >= 40 ? 2
        : pct > 0 ? 1 : 0;
      const moodKey = (state.moods && state.moods[ds]) || '';
      const moodInfo = MOOD_MAP[moodKey];
      const wr = wmap[ds];
      cells += '<button class="cal-cell ' + (rec ? 'has-data' : '') + (ds === now ? ' is-today' : '') +
        (ds === selectedDate ? ' is-sel' : '') + (future ? ' is-future' : '') + (wr ? ' has-weight' : '') +
        '" data-level="' + level + '" data-act="pick-day" data-date="' + ds + '"' + (future ? ' disabled' : '') +
        ' title="' + ds + ' · 完成 ' + st.done + '/' + st.total + (rec ? '' : '（无记录）') +
          (moodInfo ? ' · 心情：' + moodInfo.label : '') +
          (wr ? ' · 体重 ' + wr.weight + ' kg · BMI ' + wr.bmi : '') + '">' +
        '<span class="cal-fill"></span>' +
        '<span class="cal-num">' + day + '</span>' +
        '<span class="cal-foot">' +
          (wr ? '<span class="cal-weight-dot" title="体重 ' + wr.weight + ' kg · BMI ' + wr.bmi + '"></span>' : '') +
          '<span class="cal-pct">' + (rec && !future ? pct + '%' : '') + '</span>' +
          (moodInfo ? '<span class="cal-mood" title="' + moodInfo.label + '">' + moodInfo.emoji + '</span>' : '') +
        '</span>' +
        '</button>';
    }

    const avg = recorded ? Math.round(sum / recorded * 100) : 0;
    const side = monthSide(y, m);

    return '' +
      '<div class="page-head">' +
        '<div><h2>打卡日历</h2><p>颜色越深，当天完成度越高；日期右下角是当天心情。点击任意一天可以补记。</p></div>' +
      '</div>' +
      '<div class="cal-layout">' +
      '<div class="panel cal-wrap">' +
        '<div class="cal-top">' +
          '<div class="month-nav">' +
            '<button class="arrow" data-act="month-shift" data-delta="-1" aria-label="上个月">‹</button>' +
            '<b>' + y + ' 年 ' + (m + 1) + ' 月</b>' +
            '<button class="arrow" data-act="month-shift" data-delta="1" aria-label="下个月">›</button>' +
            '<button class="btn sm ghost" data-act="cal-today">本月</button>' +
          '</div>' +
          '<div class="cal-summary">' +
            '<span>记录 <b>' + recorded + '</b> 天</span>' +
            '<span>平均完成率 <b>' + (recorded ? avg + '%' : '—') + '</b></span>' +
            '<span>达标 <b>' + qualified + '</b> 天</span>' +
          '</div>' +
        '</div>' +
        '<div class="cal-wd-row">' +
          MONTH_CN.map(w => '<div class="cal-wd">' + w + '</div>').join('') +
        '</div>' +
        '<div class="cal-grid">' +
          cells +
        '</div>' +
        '<div class="cal-legend">' +
          '<span>完成度</span>' +
          '<span class="leg"><i class="l0"></i>0</span>' +
          '<span class="leg"><i class="l1"></i>1–39%</span>' +
          '<span class="leg"><i class="l2"></i>40–74%</span>' +
          '<span class="leg"><i class="l3"></i>75–99%</span>' +
          '<span class="leg"><i class="l4"></i>100%</span>' +
          '<span class="leg-note">≥ 75% 记为达标日；右下角小表情为当天心情</span>' +
        '</div>' +
      '</div>' +
      '<aside class="cal-side">' + side + '</aside>' +
      '</div>';
  }

  /* ============================================================
     统计视图
     ============================================================ */
  function viewStats() {
    const now = new Date();
    const range = [7, 30, 90].indexOf(statsRange) >= 0 ? statsRange : 30;
    const last7 = [];
    const rangeDays = [];
    for (let i = 6; i >= 0; i--) last7.push(fmt(addDays(now, -i)));
    for (let i = range - 1; i >= 0; i--) rangeDays.push(fmt(addDays(now, -i)));

    const week = rateOver(last7);
    const rangeStats = rateOver(rangeDays);
    const monthStart = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
    const monthDays = [];
    for (let i = 0; i < 31; i++) {
      const ds = fmt(addDays(now, -i));
      if (ds < monthStart) break;
      monthDays.push(ds);
    }
    const month = rateOver(monthDays);
    const doneTasks = state.tasks.filter(t => t.status === 'done');
    const weekDone = doneTasks.filter(t => t.doneAt && t.doneAt >= last7[0]).length;

    const pct = v => v.days ? Math.round(v.rate * 100) + '%' : '—';

    const bars = rangeDays.map((ds, bi) => {
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const pctv = rec ? Math.round(st.ratio * 100) : 0;
      const h = rec ? Math.max(4, pctv) : 0;
      const barCls = !rec ? 'zero' : (st.ratio >= 0.75 ? '' : 'low');
      const labelStep = Math.max(1, Math.ceil(rangeDays.length / 10));
      const showLabel = (rangeDays.length - 1 - bi) % labelStep === 0;
      const label = showLabel ? String(parseD(ds).getDate()) : '';
      return '<div class="bar-col ' + (ds === todayStr() ? 'is-today' : '') + '" title="' + ds +
          (rec ? ' 完成 ' + st.done + '/' + st.total + '（' + pctv + '%）' : ' 无记录') + '">' +
        '<div class="bar-wrap"><i class="' + barCls + '"' + (rec ? ' style="height:' + h + '%"' : '') + '></i></div>' +
        '<span>' + label + '</span>' +
      '</div>';
    }).join('');

    const hstats = state.habits.filter(h => !h.optional && !isArchived(h)).map(h => {
      const dots = rangeDays.map(ds => {
        const rec = hasRecords(ds);
        const ok = rec && met(h, ds);
        const cls = rec ? (ok ? 'ok' : 'miss') : '';
        return '<i class="' + cls + '" title="' + ds + ' · ' + countOf(ds, h.id) + ' ' + esc(h.unit || '次') + '"></i>';
      }).join('');

      let detail;
      if (h.type === 'quit') {
        detail = '每天保持 0 次';
      } else {
        detail = '每天 ' + (h.target || 1) + ' ' + (h.unit || '次');
      }

      let hitText = '';
      if (h.type === 'quit') {
        let lapse = 0;
        rangeDays.forEach(ds => { lapse += countOf(ds, h.id); });
        hitText = '近 ' + range + ' 天记录 <b>' + lapse + '</b> 次';
      } else {
        let hit = 0;
        rangeDays.forEach(ds => {
          if (hasRecords(ds) && met(h, ds)) hit++;
        });
        hitText = '近 ' + range + ' 天达标 <b>' + hit + '</b> 天';
      }

      return '<div class="hstat" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<div class="hstat-name">' +
          '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
          '<div><b>' + esc(h.name) + '</b><small>' + esc(detail) + '</small></div>' +
        '</div>' +
        '<div class="hstat-dots" style="grid-template-columns:repeat(' + rangeDays.length + ',1fr);gap:' + (rangeDays.length > 30 ? '2px' : '4px') + ';max-width:' + (rangeDays.length > 30 ? '100%' : '240px') + '">' + dots + '</div>' +
        '<div class="hstat-meta">' + hitText + '<span class="streak">🔥 连续 ' + habitStreak(h) + ' <i>天</i></span></div>' +
        '</div>';
    }).join('');

    const doneToday = state.tasks.filter(t => t.status === 'done' && t.doneAt === todayStr()).length;

    const nowMin = now.getHours() * 60 + now.getMinutes();
    const medStats = (state.meds || []).map(med => {
      if (isPrn(med)) {
        let prn = 0;
        rangeDays.forEach(ds => { prn += prnKeys(ds, med.id).length; });
        return '<div class="med-stat">' +
          '<div class="med-stat-head"><span>💊 ' + esc(med.name) + '</span><b>按需 · 记录 ' + prn + ' 次</b></div>' +
          '<div class="med-stat-sub">' + esc(medCourseLabel(med)) + (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
            (med.status !== 'active' ? ' · 已暂停' : '') + '</div>' +
        '</div>';
      }
      let sched = 0, taken = 0;
      rangeDays.forEach(ds => {
        if (!medActiveOn(med, ds)) return;
        medDoseSlots(med).forEach(slot => {
          if (ds === todayStr()) {
            const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
            if (slotMin > nowMin) return;
          }
          sched++;
          if (doseAt(ds, med.id, slot)) taken++;
        });
      });
      const rate = sched ? Math.round(taken / sched * 100) : 0;
      const status = med.status !== 'active' ? '已暂停' : (sched ? '' : '暂无排期');
      return '<div class="med-stat">' +
        '<div class="med-stat-head"><span>💊 ' + esc(med.name) + '</span><b>' +
          (sched ? taken + ' / ' + sched + ' 次 · ' + rate + '%' : '—') + '</b></div>' +
        '<div class="med-stat-bar"><i style="width:' + rate + '%"></i></div>' +
        '<div class="med-stat-sub">' + esc(medCourseLabel(med)) + (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
          (status ? ' · ' + esc(status) : '') + '</div>' +
      '</div>';
    }).join('');
    const medPanel = '<div class="panel"><h3>用药记录 <span class="muted-sm">（近 ' + range + ' 天，按应服次数）</span></h3>' +
      (medStats || '<div class="empty-box">还没有用药记录。</div>') +
      '</div>';

    /* 同一习惯同一分钟内的 +1 / -1 合并成净变化，来回撤销不再刷屏 */
    const rawLog = (Array.isArray(state.events) ? state.events : [])
      .filter(e => e && e.at && e.id && e.delta && !isNaN(new Date(e.at).getTime()))
      .slice(-80)
      .reverse();
    const logBuckets = new Map();
    rawLog.forEach(e => {
      const at = new Date(e.at);
      const minute = pad2(at.getHours()) + ':' + pad2(at.getMinutes());
      const key = e.id + '|' + fmt(at) + '|' + minute;
      if (logBuckets.has(key)) {
        logBuckets.get(key).delta += Number(e.delta);
      } else {
        logBuckets.set(key, { id: e.id, delta: Number(e.delta), at: at, d: e.d, minute: minute });
      }
    });
    const logList = [...logBuckets.values()].filter(b => b.delta !== 0).slice(0, 24);
    const logShown = statsLogOpen ? logList : logList.slice(0, 5);
    const logHidden = logList.length - logShown.length;
    const todayS = todayStr();
    const logRows = logShown.map(e => {
      const h = state.habits.find(x => x.id === e.id);
      const at = e.at;
      const opDate = fmt(at);
      let rel;
      if (opDate === todayS) rel = '今天';
      else if (opDate === fmt(addDays(new Date(), -1))) rel = '昨天';
      else rel = (at.getMonth() + 1) + '/' + at.getDate();
      const backfill = e.d && e.d !== opDate ? '补记 ' + (Number(e.d.slice(5, 7)) + '/' + Number(e.d.slice(8, 10))) : '';
      return '<div class="log-row" style="--hc:' + esc((h && h.color) || '#8a8f83') + '">' +
        '<span class="log-time">' + e.minute + '</span>' +
        '<span class="log-ico">' + esc((h && h.icon) || '·') + '</span>' +
        '<span class="log-name">' + esc(h ? h.name : '已删除的习惯') + '</span>' +
        '<span class="log-delta' + (e.delta < 0 ? ' minus' : (h && h.type === 'quit' ? ' bad' : '')) + '">' + (e.delta > 0 ? '+' : '') + e.delta + '</span>' +
        '<span class="log-date">' + rel + (backfill ? ' · ' + backfill : '') + '</span>' +
      '</div>';
    }).join('');
    const logToggle = logList.length > 5
      ? '<button type="button" class="log-more" data-act="stats-log-toggle">' +
          (statsLogOpen ? '收起' : '查看更多' + (logHidden > 0 ? ' · 还有 ' + logHidden + ' 条' : '')) +
        '</button>'
      : '';
    const logPanel = '<div class="panel">' +
      '<div class="panel-head"><h3>打卡时间 <span class="muted-sm">（最近 ' + logList.length + ' 次操作）</span></h3>' + logToggle + '</div>' +
      (logRows || '<div class="empty-box">还没有操作记录，去今日页点一下习惯试试。</div>') +
      '</div>';

    return '' +
      '<div class="page-head"><div><h2>数据统计</h2><p>不追求完美，只看趋势。只统计有记录的日子：柱状图灰线 = 无记录，浅色 = 未达标，实心 = 达标（≥75%）。</p></div>' +
        '<div class="range-switch">' + [7, 30, 90].map(n =>
          '<button type="button" class="' + (range === n ? 'active' : '') + '" data-act="set-stats-range" data-range="' + n + '">' + n + ' 天</button>'
        ).join('') + '</div></div>' +
      '<div class="stat-grid">' +
        '<div class="stat-card"><small>连续达标</small><b>' + overallStreak() + ' <i>天</i></b><span>完成率 ≥ 75% 记一天</span></div>' +
        '<div class="stat-card"><small>近 ' + range + ' 天完成率</small><b>' + pct(rangeStats) + '</b><span>' + rangeStats.days + ' 天有记录</span></div>' +
        '<div class="stat-card"><small>本月完成率</small><b>' + pct(month) + '</b><span>' + month.days + ' 天有记录</span></div>' +
        '<div class="stat-card"><small>已完成任务</small><b>' + doneTasks.length + ' <i>条</i></b><span>近 7 天 +' + weekDone + ' · 今天 +' + doneToday + '</span></div>' +
      '</div>' +
      '<div class="panel"><h3>近 ' + range + ' 天完成率</h3><div class="chart" style="gap:' + (range > 30 ? '2px' : '8px') + '">' + bars + '</div></div>' +
      '<div class="panel"><h3>习惯明细 <span class="muted-sm">（最近 ' + range + ' 天）</span></h3>' +
        (hstats || '<div class="empty-box">还没有习惯数据。</div>') +
      '</div>' +
      weightStatsPanel(range) +
      medPanel +
      logPanel +
      '<div class="panel"><h3>任务概览</h3>' +
        '<div class="cal-summary" style="margin:0">' +
          '<span>待办 <b>' + liveTasks().filter(t => t.status === 'todo').length + '</b></span>' +
          '<span>进行中 <b>' + liveTasks().filter(t => t.status === 'doing').length + '</b></span>' +
          '<span>已完成 <b>' + doneTasks.length + '</b></span>' +
        '</div>' +
      '</div>';
  }

  /* ============================================================
     设置视图
     ============================================================ */
  function calcBmi(weight, heightCm) {
    const h = Number(heightCm) / 100;
    const w = Number(weight);
    if (!isFinite(h) || !isFinite(w) || h <= 0 || w <= 0) return 0;
    return Math.round(w / (h * h) * 10) / 10;
  }

  function bmiCategory(bmi) {
    const v = Number(bmi);
    if (!isFinite(v) || v <= 0) return { label: '—', tone: '', note: '还没有 BMI 数据' };
    if (v < 18.5) return { label: '偏轻', tone: 'low', note: '低于成人正常范围' };
    if (v < 24) return { label: '正常', tone: 'ok', note: '在成人正常范围内' };
    if (v < 28) return { label: '超重', tone: 'warn', note: '高于成人正常范围' };
    return { label: '肥胖', tone: 'high', note: '明显高于成人正常范围' };
  }

  function weightRecords() {
    return (Array.isArray(state.weights) ? state.weights : [])
      .filter(w => w && w.date && Number(w.weight) > 0)
      .slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) ||
        String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  }

  function weightForDate(d) {
    const list = weightRecords().filter(w => w.date === d);
    return list.length ? list[list.length - 1] : null;
  }

  function weightInRange(list, range) {
    if (!range) return list;
    const start = fmt(addDays(new Date(), -(range - 1)));
    return list.filter(w => w.date >= start);
  }

  function weightRangeSwitchHtml() {
    return '<div class="range-switch">' + [[7, '7 天'], [30, '30 天'], [90, '90 天'], [0, '全部']].map(p =>
      '<button type="button" class="' + (weightRange === p[0] ? 'active' : '') + '" data-act="set-weight-range" data-range="' + p[0] + '">' + p[1] + '</button>'
    ).join('') + '</div>';
  }

  /* 历史体重折线图：等比缩放的 SVG，含健康区间背景带 */
  function weightLineChart(list, profile) {
    if (!list || !list.length) {
      return '<div class="ww-empty">这个区间还没有体重记录<br>记一笔之后，这里会画出曲线</div>';
    }
    const W = 600, H = 200, L = 38, R = 14, T = 16, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const pts = list.map(w => ({ date: w.date, v: Number(w.weight), bmi: w.bmi })).filter(p => isFinite(p.v));
    if (!pts.length) return '<div class="ww-empty">这个区间还没有体重记录</div>';

    let lo = pts[0].v, hi = pts[0].v;
    pts.forEach(p => { if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; });

    const height = Number(profile && profile.height) || 0;
    let bandLo = null, bandHi = null;
    if (height > 0) {
      const m2 = (height / 100) * (height / 100);
      bandLo = Math.round(18.5 * m2 * 10) / 10;
      bandHi = Math.round(23.9 * m2 * 10) / 10;
    }
    const pad = Math.max(0.6, (hi - lo) * 0.16);
    lo -= pad; hi += pad;
    const span = Math.max(0.5, hi - lo);
    const yy = v => T + (hi - v) / span * ph;
    const xx = i => pts.length === 1 ? L + pw / 2 : L + (i / (pts.length - 1)) * pw;

    let g = '';
    [0, 0.5, 1].forEach(t => {
      const v = hi - span * t;
      const y = T + ph * t;
      g += '<line class="ww-grid" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text class="ww-lbl" x="' + (L - 6) + '" y="' + (y + 3.4).toFixed(1) + '" text-anchor="end">' + v.toFixed(1) + '</text>';
    });

    if (bandLo !== null) {
      const clampY = v => Math.max(T, Math.min(T + ph, v));
      const yTop = clampY(yy(bandHi)), yBot = clampY(yy(bandLo));
      if (yBot - yTop > 0.5) {
        g += '<rect class="ww-band" x="' + L + '" y="' + yTop.toFixed(1) + '" width="' + pw + '" height="' + (yBot - yTop).toFixed(1) + '"/>';
        if (yy(bandHi) >= T && yy(bandHi) <= T + ph) {
          g += '<line class="ww-band-line" x1="' + L + '" y1="' + yTop.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yTop.toFixed(1) + '"/>';
        }
        if (yy(bandLo) >= T && yy(bandLo) <= T + ph) {
          g += '<line class="ww-band-line" x1="' + L + '" y1="' + yBot.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yBot.toFixed(1) + '"/>';
        }
      }
    }

    const d = pts.map((p, i) => (i ? 'L' : 'M') + xx(i).toFixed(1) + ',' + yy(p.v).toFixed(1)).join(' ');
    g += '<path class="ww-line" d="' + d + '"/>';
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      g += '<circle class="ww-dot' + (last ? ' last' : '') + '" cx="' + xx(i).toFixed(1) + '" cy="' + yy(p.v).toFixed(1) + '" r="' + (last ? 3.6 : 2.6) + '">' +
        '<title>' + p.date + ' · ' + p.v + ' kg</title></circle>';
    });

    const idx = pts.length === 1 ? [0] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    const used = [];
    idx.forEach(i => {
      const cx = Math.round(xx(i));
      if (used.indexOf(cx) >= 0) return;
      used.push(cx);
      g += '<text class="ww-lbl" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' +
        (pts[i].date.slice(5).replace('-', '/')) + '</text>';
    });

    return '<svg class="ww-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="历史体重折线图">' + g + '</svg>';
  }

  function weightBandText(profile) {
    const h = Number(profile && profile.height) || 0;
    if (!h) return 'BMI = 体重(kg) ÷ 身高(m)²；成人参考范围 18.5–23.9，未成年人仅参考。';
    const m2 = (h / 100) * (h / 100);
    const lo = Math.round(18.5 * m2 * 10) / 10;
    const hi = Math.round(23.9 * m2 * 10) / 10;
    return '浅绿色带是健康区间 ' + lo + '–' + hi + ' kg（BMI 18.5–23.9，按 ' + h + ' cm 换算）；未成年人仅参考。';
  }

  function weightSummaryHtml(list) {
    if (!list || !list.length) return '<div class="ww-empty">还没有数据</div>';
    const first = list[0], last = list[list.length - 1];
    let hi = Number(first.weight), lo = Number(first.weight), sum = 0;
    list.forEach(w => {
      const v = Number(w.weight);
      if (v > hi) hi = v;
      if (v < lo) lo = v;
      sum += v;
    });
    const avg = Math.round(sum / list.length * 10) / 10;
    const delta = Math.round((Number(last.weight) - Number(first.weight)) * 10) / 10;
    const deltaText = delta === 0 ? '持平' : (delta > 0 ? '↑ +' : '↓ ') + Math.abs(delta) + ' kg';
    const info = bmiCategory(last.bmi);
    const row = (label, value, unit) =>
      '<div class="wsum-row"><small>' + label + '</small><b>' + value + (unit ? '<i>' + unit + '</i>' : '') + '</b></div>';
    return row('起始 → 当前', first.weight + ' → ' + last.weight, ' kg') +
      row('区间变化', deltaText, '') +
      row('最高 / 最低', hi + ' / ' + lo, ' kg') +
      row('平均', avg, ' kg') +
      row('记录', list.length, ' 次') +
      row('当前 BMI', last.bmi + ' ' + info.label, '');
  }

  function weightStatsPanel(days) {
    const count = Math.max(1, Number(days) || 30);
    const start = fmt(addDays(new Date(), -(count - 1)));
    const list = weightRecords().filter(w => w.date >= start);
    if (!list.length) {
      return '<div class="panel"><h3>体重与 BMI</h3>' +
        '<div class="empty-box">最近 ' + count + ' 天没有体重记录，去「体重」页记录一次。</div></div>';
    }
    const latest = list[list.length - 1];
    const first = list[0];
    const info = bmiCategory(latest.bmi);
    const diff = Math.round((latest.weight - first.weight) * 10) / 10;
    const delta = diff === 0 ? '持平' : (diff > 0 ? '+' : '') + diff + ' kg';
    return '<div class="panel">' +
      '<div class="panel-head"><h3>体重与 BMI</h3><span class="muted-sm">最近 ' + count + ' 天</span></div>' +
      '<div class="weight-stat-row">' +
        '<div><small>最新体重</small><b>' + esc(latest.weight) + ' <i>kg</i></b></div>' +
        '<div><small>BMI</small><b>' + esc(latest.bmi) + ' <i>' + esc(info.label) + '</i></b></div>' +
        '<div><small>较区间首次</small><b>' + delta + '</b></div>' +
      '</div>' +
      weightLineChart(list, normalizeBodyProfile(state.bodyProfile)) +
      '<p class="cal-hint">' + esc(latest.date) + ' 记录 · ' + esc(latest.age) + ' 岁 · ' + esc(latest.height) + ' cm' +
        (latest.age < 18 ? ' · 未成年 BMI 仅参考' : '') + '</p>' +
    '</div>';
  }

  function habitManageRows() {
    return state.habits.filter(h => !h.med && !isArchived(h)).map(h => {
      const pin = isPinned(h);
      const detail = h.id === 'h_breathe'
        ? '每天一组 · ' + (Number(h.breatheCycles) || 4) + ' 次循环 · 建议 ' + String(h.suggestTime || '15:00')
        : (h.type === 'quit'
          ? '戒除 · 保持 0 次 / 天'
          : '养成 · 每天 ' + (h.target || 1) + ' ' + esc(h.unit || '次'));
      return '<div class="habit-row" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-row-info"><b>' + esc(h.name) + '</b><small>' + detail + (h.note ? ' · ' + esc(h.note) : '') + '</small></div>' +
        (pin ? '<span class="pin-tag">常驻</span>' : '') +
        '<button class="icon-btn" data-act="habit-edit" data-id="' + h.id + '" title="编辑">✎</button>' +
        (pin ? '' : '<button class="icon-btn" data-act="habit-archive" data-id="' + h.id + '" title="归档">🗄</button>') +
        (pin ? '' : '<button class="icon-btn danger" data-act="habit-del" data-id="' + h.id + '" title="删除">✕</button>') +
        '</div>';
    }).join('');
  }

  function archivedHabitRows() {
    return state.habits.filter(h => !h.med && isArchived(h)).map(h => {
      return '<div class="habit-row archived" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-row-info"><b>' + esc(h.name) + '</b><small>已归档 · 历史打卡保留，不计入今日和统计</small></div>' +
        '<button class="mini-btn" data-act="habit-restore" data-id="' + h.id + '">恢复</button>' +
        '<button class="icon-btn danger" data-act="habit-del" data-id="' + h.id + '" title="永久删除">✕</button>' +
        '</div>';
    }).join('');
  }

  /* ============ 用药页面：进行中 / 未开始 / 暂停 / 已停用 ============ */
  const MED_PHASES = [
    { key: 'active',  label: '进行中', hint: '' },
    { key: 'future',  label: '未开始', hint: '还没到开始日期' },
    { key: 'paused',  label: '暂停中', hint: '恢复后会重新出现在今日页' },
    { key: 'stopped', label: '已停用', hint: '' }
  ];
  function medPhaseOf(med) {
    const t = todayStr();
    if (med.status === 'paused') return 'paused';
    if (med.status === 'stopped' || med.status === 'done') return 'stopped';
    if (!isPrn(med) && med.startDate && med.startDate > t) return 'future';
    if (!isPrn(med) && med.courseType === 'short' && med.endDate && med.endDate < t) return 'stopped';
    return 'active';
  }
  /* 板块内排序：餐前 → 随餐 → 空腹 → 餐后 → 未设置，同组按第一个服药时间 */
  const MED_MEAL_RANK = { before: 0, with: 1, empty: 2, after: 3 };
  function medMealRank(m) {
    const k = (m && m.mealTiming) || '';
    return MED_MEAL_RANK[k] === undefined ? 4 : MED_MEAL_RANK[k];
  }
  function medSortFn(a, b) {
    const d = medMealRank(a) - medMealRank(b);
    if (d) return d;
    const ta = medDoseSlots(a)[0] || '\uffff';
    const tb = medDoseSlots(b)[0] || '\uffff';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return String(a.name || '').localeCompare(String(b.name || ''), 'zh');
  }
  /* 药名简称：去掉常见剂型后缀，太长再截断——用于卡片顶部的药名条 */
  const MED_FORM_TAIL = /(肠溶胶囊|软胶囊|缓释胶囊|胶囊|肠溶片|缓释片|分散片|咀嚼片|薄膜衣片|片|颗粒|口服液|糖浆|滴剂|喷雾剂|散剂|散|丸|注射剂|乳膏|软膏|凝胶|贴剂)$/;
  function medShortName(name) {
    let s = String(name || '').trim();
    const trimmed = s.replace(MED_FORM_TAIL, '');
    if (trimmed.length >= 2) s = trimmed;
    return s.length > 8 ? s.slice(0, 8) + '…' : s;
  }

  /* 一行一种药：主信息＝每天几次 / 每次几颗 / 餐前餐后多久（重点），次要信息＝用途厂商疗程 */
  function medRowHtml(med) {
    const t = todayStr();
    const slots = medDoseSlots(med);
    const prn = isPrn(med);
    const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
    const meal = mealTimingText(med);
    const phase = medPhaseOf(med);

    const head = [];
    if (prn) head.push('按需服用');
    else if (slots.length) head.push('每天' + cnCount(slots.length) + '次');
    head.push('每次 ' + dose + ' ' + (med.doseUnit || ''));
    const mainText = head.join('，') + (meal ? ' ' + meal : '');

    const sec = [];
    if (med.purpose && med.purpose !== '其他') sec.push(med.purpose);
    if (med.manufacturer) sec.push(med.manufacturer);
    if (med.strength) sec.push(med.strength);
    const course = medCourseLabelOn(med, t);
    if (course) sec.push(course);

    const canTap = phase === 'active';
    const slotHtml = slots.map(slot => {
      if (!canTap) return '<span class="med-slot is-static">' + esc(slot) + '</span>';
      const entry = doseAt(t, med.id, slot);
      return '<button type="button" class="med-slot' + (entry ? ' done' : '') + '"' +
        ' data-act="' + (entry ? 'med-undo' : 'med-take') + '" data-id="' + med.id + '" data-slot="' + esc(slot) + '"' +
        ' title="' + (entry ? '点击撤销 ' : '点击记录 ') + esc(slot) + '">' + esc(slot) + (entry ? ' ✓' : '') + '</button>';
    }).join('');

    const stock = medStockLabel(med);
    let info = med.medInfo || med.note || '';
    /* 备注若只是把用餐时机又写了一遍（旧数据常见），不再重复显示 */
    if (info && meal) {
      const norm = s => String(s || '').replace(/[\s·,，、]/g, '');
      const onlyTiming = /^(餐前|餐后|随餐|空腹|饭前|饭后)/.test(info) && norm(info).length <= 8;
      if (norm(info) === norm(meal) || onlyTiming) info = '';
    }

    return '<article class="med-row">' +
      '<span class="med-row-ico">' + esc(med.emoji || '💊') + '</span>' +
      '<div class="med-row-main">' +
        '<div class="med-row-title"><b>' + esc(med.name) + '</b></div>' +
        '<p class="med-row-dose"><b>' + esc(mainText) + '</b>' +
          (sec.length ? '<span>· ' + esc(sec.join(' · ')) + '</span>' : '') + '</p>' +
        (info ? '<p class="med-row-note">' + esc(info) + '</p>' : '') +
        (slotHtml ? '<div class="med-row-slots">' + slotHtml + '</div>' : '') +
      '</div>' +
      '<div class="med-row-side">' +
        (stock ? '<span class="med-row-stock">' + esc(stock) + '</span>' : '') +
        '<div class="med-row-ops">' +
          '<button class="icon-btn" data-act="med-edit" data-id="' + med.id + '" title="编辑">✎</button>' +
          '<button class="icon-btn" data-act="med-toggle" data-id="' + med.id + '" title="' +
            (med.status === 'active' ? '暂停' : '恢复') + '">' + (med.status === 'active' ? '⏸' : '▶') + '</button>' +
          '<button class="icon-btn danger" data-act="med-del" data-id="' + med.id + '" title="删除">✕</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function viewMeds() {
    const list = state.meds || [];
    const buckets = { active: [], future: [], paused: [], stopped: [] };
    list.forEach(m => { buckets[medPhaseOf(m)].push(m); });
    Object.keys(buckets).forEach(k => buckets[k].sort(medSortFn));

    const sched = medScheduledFor(todayStr());
    const taken = medTakenCount(todayStr());
    const prnCount = list.filter(m => m.status === 'active' && isPrn(m)).length;
    let sub = '记录医生给你的用药方案，按时服完。';
    if (sched.length) sub = '今天 ' + taken + ' / ' + sched.length + ' 次已记录' + (prnCount ? ' · 另有 ' + prnCount + ' 种按需药' : '');
    else if (prnCount) sub = '今天没有定时用药，有 ' + prnCount + ' 种按需药';
    else if (list.length) sub = '今天没有需要服的药';

    const groups = MED_PHASES.map(ph => {
      const arr = buckets[ph.key];
      if (!arr.length) return '';
      return '<section class="med-group">' +
        '<div class="med-group-head"><h3>' + ph.label + '</h3><i>' + arr.length + ' 种</i>' +
          (ph.hint ? '<span class="med-group-hint">' + ph.hint + '</span>' : '') + '</div>' +
        '<div class="med-board">' + arr.map(medRowHtml).join('') + '</div>' +
      '</section>';
    }).join('');

    const stockWarn = buckets.active.filter(m => {
      const d = medStockDays(m);
      return d !== null && d <= 7;
    }).length;
    const todayPct = sched.length ? Math.min(100, Math.round(taken / sched.length * 100)) : 0;
    const statsHtml = '<div class="med-stats">' +
      '<div class="ms-card"><small>药品总数</small><b>' + list.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>进行中</small><b>' + buckets.active.length + '<i>种</i></b>' +
        (buckets.future.length ? '<span class="ms-sub">另有 ' + buckets.future.length + ' 种未开始</span>' : '') + '</div>' +
      '<div class="ms-card"><small>已暂停</small><b>' + buckets.paused.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>已停用</small><b>' + buckets.stopped.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>今日服药</small><b>' + taken + ' / ' + sched.length + '</b>' +
        '<span class="ms-bar"><i style="width:' + todayPct + '%"></i></span></div>' +
      '<div class="ms-card' + (stockWarn ? ' warn' : '') + '"><small>库存告急</small><b>' + stockWarn + '<i>种</i></b>' +
        '<span class="ms-sub">' + (stockWarn ? '7 天内会吃完' : '都在 7 天以上') + '</span></div>' +
      '</div>';

    return '' +
      '<div class="page-head"><div><h2>用药</h2><p>' + esc(sub) + '</p></div>' +
        '<button class="btn primary" data-act="med-new">＋ 添加用药</button></div>' +
      (list.length
        ? statsHtml + groups + '<p class="hint">点时间胶囊记录服药，再点一次撤销。进行中的药会出现在今日页的用药卡里。</p>'
        : '<div class="panel"><div class="empty-box">还没有用药记录。点右上角「添加用药」，添加后会在今日页出现「用药」卡。</div></div>' +
          '<p class="hint">只记录医生给你的方案；应用不提供剂量建议。支持长期、短期疗程和按需用药。</p>');
  }

  function viewHabits() {
    const rows = habitManageRows();
    const archivedRows = archivedHabitRows();
    return '' +
      '<div class="page-head"><div><h2>习惯</h2><p>管理每日习惯与常驻卡。用药在「用药」页单独管理。</p></div>' +
        '<button class="btn primary" data-act="habit-new">＋ 添加习惯</button></div>' +
      '<div class="settings-wrap">' +
      '<div class="panel"><h3>我的习惯</h3>' +
        (rows || '<div class="empty-box">还没有习惯，点右上角添加一个。</div>') +
        '<p class="hint">带「常驻」标记的习惯不能删除或归档；归档后不计入今日、日历和统计，但历史打卡保留。</p>' +
      '</div>' +
      (archivedRows ? '<div class="panel"><h3>已归档</h3>' + archivedRows +
        '<p class="hint">恢复后会重新出现在今日、日历和统计里；永久删除才会移除历史打卡。</p></div>' : '') +
      '</div>';
  }

  function viewWeight() {
    const list = weightRecords();
    const latest = list.length ? list[list.length - 1] : null;
    const previous = list.length > 1 ? list[list.length - 2] : null;
    const first = list.length ? list[0] : null;
    const profile = normalizeBodyProfile(state.bodyProfile);
    const hasProfile = profile.age > 0 && profile.height > 0;
    const info = latest ? bmiCategory(latest.bmi) : bmiCategory(0);
    const diff = latest && previous ? Math.round((latest.weight - previous.weight) * 10) / 10 : null;
    const total = latest && first && list.length > 1 ? Math.round((latest.weight - first.weight) * 10) / 10 : null;
    const deltaText = v => v === null ? '首次记录' : (v === 0 ? '持平' : (v > 0 ? '↑ ' : '↓ ') + Math.abs(v) + ' kg');

    const profileHtml = '<section class="panel profile-card">' +
      '<div class="panel-head"><h3>身体档案</h3>' +
        '<button type="button" class="btn sm" data-act="profile-edit">' + (hasProfile ? '编辑档案' : '建立档案') + '</button></div>' +
      (hasProfile
        ? '<div class="profile-grid"><div><small>年龄</small><b>' + esc(profile.age) + ' <i>岁</i></b></div>' +
          '<div><small>身高</small><b>' + esc(profile.height) + ' <i>cm</i></b></div>' +
          '<div><small>BMI 参考</small><b>18.5–23.9</b></div></div>' +
          '<p class="hint">年龄和身高只需维护一次；之后记录体重只填日期和体重。</p>'
        : '<div class="empty-box">还没有身体档案。先补全年龄和身高，之后记录体重只需要填体重。</div>') +
    '</section>';

    const rows = list.slice().reverse().map(w => {
      const wi = bmiCategory(w.bmi);
      return '<div class="weight-row">' +
        '<span class="weight-day">' + esc(w.date.slice(5).replace('-', '/')) + '</span>' +
        '<b class="weight-value">' + esc(w.weight) + ' <i>kg</i></b>' +
        '<span class="bmi-pill ' + wi.tone + '">BMI ' + esc(w.bmi) + ' · ' + esc(wi.label) + '</span>' +
        '<small>' + esc(w.age) + ' 岁 · ' + esc(w.height) + ' cm</small>' +

          '<button type="button" class="mini-btn" data-act="weight-edit" data-id="' + w.id + '">编辑</button>' +
          '<button type="button" class="mini-btn ghost" data-act="weight-del" data-id="' + w.id + '">删除</button>' +
        '</span>' +

    const empty = '<div class="panel"><div class="empty-box">还没有体重记录。记下第一次，之后就能看到体重和 BMI 趋势。</div>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="weight-new">记录第一次</button></div></div>';

      '<div class="weight-main">' +
        '<small>最新体重</small>' +
        '<div class="weight-big">' + esc(latest.weight) + '<i>kg</i></div>' +
        '<div class="weight-date">' + esc(latest.date) + ' · ' + esc(latest.age) + ' 岁 · ' + esc(latest.height) + ' cm</div>' +
      '</div>' +
      '<div class="weight-bmi ' + info.tone + '">' +
        '<b>' + esc(latest.bmi) + '</b>' +

        '<div><small>记录</small><b>' + list.length + ' 次</b></div>' +
      '</div>' +
    '</section>' : '';

    return '' +
      '<div class="page-head"><div><h2>体重</h2><p>维护身体档案，记录体重，自动计算 BMI。</p></div>' +
        '<button class="btn primary" data-act="weight-new">＋ 记录体重</button></div>' +
      profileHtml +
      (latest ? hero : empty) +
      '<div class="weight-charts">' +
        '<section class="panel">' +
          '<div class="panel-head"><h3>历史体重折线图</h3>' + weightRangeSwitchHtml() + '</div>' +
          weightLineChart(chartList, profile) +
          '<p class="cal-hint">' + weightBandText(profile) + '</p>' +
        '</section>' +
        '<section class="panel">' +
          '<div class="panel-head"><h3>统计</h3><span class="muted-sm">' + (weightRange ? '近 ' + weightRange + ' 天' : '全部记录') + '</span></div>' +

        '</section>' +
      '</div>' +
      (latest ? '<div class="panel"><h3>记录明细</h3><div class="weight-list">' + rows + '</div></div>' : '');
  }

  function essayAll() {
    return (Array.isArray(state.essays) ? state.essays : []).filter(e => e && String(e.text || '').trim())
      .slice()
      .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
  }

  function essayList() {
    const all = essayAll();
    return essayTag ? all.filter(e => (e.tags || []).indexOf(essayTag) >= 0) : all;
  }

  function essayExcerpt(text) {
    const s = String(text || '').replace(/\s+/g, ' ').trim();
    return s.length > 180 ? s.slice(0, 180) + '…' : s;
  }

  function viewEssays() {
    const all = essayAll();
    const allTags = [];
    all.forEach(e => (e.tags || []).forEach(tag => { if (allTags.indexOf(tag) < 0) allTags.push(tag); }));
    if (essayTag && allTags.indexOf(essayTag) < 0) essayTag = '';
    const list = essayList();
    const cards = list.map(e => {
      const title = e.title || '无标题';
      const count = String(e.text || '').replace(/\s/g, '').length;
      const tags = (e.tags || []).map(tag =>
        '<button type="button" class="essay-tag" data-act="essay-tag-filter" data-tag="' + esc(tag) + '">#' + esc(tag) + '</button>'
      ).join('');
      return '<article class="essay-card">' +
        '<div class="essay-meta"><span>' + esc(e.date) + '</span><span>' + count + ' 字</span></div>' +
        '<h3 class="essay-title">' + esc(title) + '</h3>' +
        '<p class="essay-text">' + esc(essayExcerpt(e.text)) + '</p>' +
        (tags ? '<div class="essay-tags">' + tags + '</div>' : '') +
        '<div class="essay-actions">' +
          '<button type="button" class="mini-btn" data-act="essay-edit" data-id="' + e.id + '">编辑</button>' +
          '<button type="button" class="mini-btn ghost" data-act="essay-del" data-id="' + e.id + '">删除</button>' +
        '</div>' +
      '</article>';
    }).join('');

    const tagFilter = allTags.length
      ? '<div class="essay-tags essay-tag-filter">' +
        '<button type="button" class="tag-chip' + (!essayTag ? ' active' : '') + '" data-act="essay-tag-filter" data-tag="">全部</button>' +
        allTags.map(tag => '<button type="button" class="tag-chip' + (essayTag === tag ? ' active' : '') + '" data-act="essay-tag-filter" data-tag="' + esc(tag) + '">#' + esc(tag) + '</button>').join('') +
        '</div>'
      : '';

    return '' +
      '<div class="page-head"><div><h2>随笔</h2><p>随手记下想法、片段和今天发生的事。</p></div>' +
        '<button class="btn primary" data-act="essay-new">＋ 写一篇</button></div>' +

          '<div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="essay-new">写第一篇</button></div></div>');
  }

  function clearDropMarks() {
    $$('.task.drop-before, .task.drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
  }

  function cnDate(ds) {
    if (!ds) return '';
    const d = parseD(ds);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  let archDropAt = 0;

  function archiveTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t || t.archivedAt) return;
    t.archivedAt = new Date().toISOString();
    save();
    render();
    toast('已归档 · 可在「归档」里找回');
  }

  function unarchiveTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t || !t.archivedAt) return;
    t.archivedAt = '';
    save();
    render();
    if ($('#modal-root') && $('#modal-root').innerHTML.trim()) archiveModal();
    toast('已恢复到看板');

  function archiveModal() {
    const list = archivedTasks();
    const rows = list.map(t => {
      const bits = [];
      if (t.doneAt) bits.push('完成于 ' + cnDate(t.doneAt));
      bits.push('优先级 ' + (t.priority || '中'));
      if (t.tag) bits.push(t.tag);
      if (t.due) bits.push('截止 ' + cnDate(t.due));
      return '<div class="arch-row">' +
        '<div class="ar-main"><b title="' + esc(t.title) + '">' + esc(t.title) + '</b>' +
          '<small>' + esc(bits.join(' · ')) + '</small></div>' +
        '<div class="ar-btns">' +
          '<button type="button" class="ar-btn" data-act="task-unarchive" data-id="' + t.id + '">恢复</button>' +
          '<button type="button" class="ar-btn del" data-act="task-archive-del" data-id="' + t.id + '">删除</button>' +
        '</div>' +
      '</div>';
    }).join('');
    openModal('' +
      '<div class="modal-card arch-modal">' +
        '<h3>归档任务 <span class="muted-sm">' + list.length + ' 条</span></h3>' +
        '<p class="hint" style="margin:0 0 10px">归档只是把卡片从看板收进历史，任务本身和记录都还在，可以随时恢复。</p>' +
        (rows
          ? '<div class="arch-list">' + rows + '</div>'
          : '<div class="empty-box">还没有归档的任务。把看板上的卡片拖到右栏的「拖到这里归档」，就会收进来。</div>') +
        '<div class="modal-actions">' +
          (list.length ? '<button type="button" class="btn ghost" data-act="archive-clear">清空归档</button>' : '') +
          '<span class="spacer"></span>' +
          '<button type="button" class="btn primary" data-act="close-modal">关闭</button>' +
        '</div>' +
      '</div>');
  }

  function bindBoard() {
    $$('.task').forEach(card => {
      card.addEventListener('dragstart', e => {
        dragId = card.dataset.id;
        card.classList.add('dragging');
        document.body.classList.add('is-dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
        }
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragId = null;
        document.body.classList.remove('is-dragging');
        const z = $('.arch-zone');
        if (z) z.classList.remove('is-over');
        clearDropMarks();
      });
      card.addEventListener('dblclick', e => {
        if (e.target.closest('button')) return;
        const id = card.dataset.id;
        if (openTaskIds.has(id)) openTaskIds.delete(id);
        else openTaskIds.add(id);
        card.classList.toggle('is-open');
        if (card.classList.contains('is-open')) {
          // center 而非 nearest：展开后的卡片（含底部操作行）不会被移动端固定底栏盖住
          setTimeout(() => card.scrollIntoView({ block: 'center', behavior: 'smooth' }), 40);
        }
      });
      card.addEventListener('dragover', e => {
        if (!dragId) return;
        e.preventDefault();
        e.stopPropagation();
        clearDropMarks();
        const rect = card.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        card.classList.add(after ? 'drop-after' : 'drop-before');
      });
      card.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if (!id) return;
        const after = card.classList.contains('drop-after');
        clearDropMarks();
        reorderTask(id, card.closest('.col').dataset.status, card.dataset.id, after);
      });
    });

    const zone = $('.arch-zone');
    if (zone) {
      zone.addEventListener('dragover', e => {
        if (!dragId) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        zone.classList.add('is-over');
      });
      zone.addEventListener('dragleave', e => {
        if (e.relatedTarget && zone.contains(e.relatedTarget)) return;
        zone.classList.remove('is-over');
      });
      zone.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove('is-over');
        const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if (id) {
          archDropAt = Date.now();
          archiveTask(id);
        }
      });
      zone.addEventListener('click', () => {
        if (Date.now() - archDropAt < 500) return;
        archiveModal();
      });
    }

    $$('.col-body').forEach(body => {
      body.addEventListener('dragover', e => { if (dragId) e.preventDefault(); });
      body.addEventListener('drop', e => {
        if (!dragId) return;
        e.preventDefault();
        const status = body.closest('.col').dataset.status;
        clearDropMarks();
        reorderTask(dragId, status, null, false);
      });
    });
  }

  function reorderTask(id, status, beforeId, after) {
    if (!id || id === beforeId) return;
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx < 0) return;
    const task = state.tasks[idx];
    const changed = task.status !== status;
    const wasDone = task.status === 'done';
    state.tasks.splice(idx, 1);
    if (changed) task.prevStatus = task.status;
    task.status = status;
    if (status === 'done') {
      if (!task.doneAt || changed) task.doneAt = todayStr();
      if (changed && !wasDone) completeRecurringTask(task, task.doneAt);
    } else {
      task.doneAt = null;
      if (changed && wasDone) uncompleteRecurringTask(task);
    }
    let insertAt = state.tasks.length;
    if (beforeId) {
      const ti = state.tasks.findIndex(t => t.id === beforeId);
      if (ti >= 0) insertAt = after ? ti + 1 : ti;
    }
    state.tasks.splice(insertAt, 0, task);
    save();
    render();
    if (changed && status === 'done') toast('完成 ✓');
  }

  let breathingTimer = null;
  let breathingPhaseTimer = null;

  function stopBreathing() {
    if (breathingTimer) { clearInterval(breathingTimer); breathingTimer = null; }
    if (breathingPhaseTimer) { clearTimeout(breathingPhaseTimer); breathingPhaseTimer = null; }
  }

  function openBreathingModal() {
    stopBreathing();
    const hb = state.habits.find(x => x.id === 'h_breathe');
    const n = Math.max(1, Math.min(8, Number(hb && hb.breatheCycles) || 4));

        '<div class="breathing-stage">' +

        '<div class="modal-actions">' +

  function breathingStart() {
    if (!$('#breathing-modal')) {
      openBreathingModal();
      return;
    }
    stopBreathing();
    const orb = $('#breathing-orb');
    const phase = $('#breathing-phase');
    const timer = $('#breathing-timer');
    const btn = $('#breathing-start-btn');
    if (!orb || !phase || !timer) return;
    const hb = state.habits.find(x => x.id === 'h_breathe');
    const totalCycles = Math.max(1, Math.min(8, Number(hb && hb.breatheCycles) || 4));
    if (btn) {
      btn.textContent = '进行中';
      btn.disabled = true;
    }
    const phases = [
      { key: 'inhale', label: '吸气', seconds: 4 },
      { key: 'hold', label: '屏息', seconds: 7 },
      { key: 'exhale', label: '呼气', seconds: 8 }
    ];
    let index = 0;
    let cycle = 1;
    const showTimer = left => {
      timer.textContent = '第 ' + cycle + ' / ' + totalCycles + ' 次 · ' + Math.max(0, left) + ' 秒';
    };

    const finish = () => {
      orb.className = 'breathing-orb done';
      phase.textContent = '完成 · ' + totalCycles + ' 次循环';
      timer.textContent = '这一组记下了';
      if (btn) {
        btn.textContent = '再来一组';
        btn.disabled = false;
      }
      const h = state.habits.find(x => x.id === 'h_breathe');
      if (h) {
        logHabit(h.id, 1);
        setCount(selectedDate, h.id, countOf(selectedDate, h.id) + 1);
        render();
        toast('478 呼吸 · 一组完成');
      }
    };

    const run = () => {
      if (!$('#breathing-modal')) return;
      const p = phases[index];
      if (index === 0) {
        orb.className = 'breathing-orb';
        void orb.offsetWidth;
      }
      orb.className = 'breathing-orb ' + p.key;
      phase.textContent = p.label;
      let left = p.seconds;
      showTimer(left);
      breathingTimer = setInterval(() => {
        left--;
        showTimer(left);
        if (left <= 0) {
          clearInterval(breathingTimer);
          breathingTimer = null;
          index++;
          if (index >= phases.length) {
            index = 0;
            cycle++;
            if (cycle > totalCycles) { finish(); return; }
          }
          breathingPhaseTimer = setTimeout(run, 250);
        }
      }, 1000);
    };

    run();
  }

  function bindMedForm() {
    const form = $('#med-form');
    if (!form) return;
    const course = form.querySelector('[name="courseType"]');
    const countSel = form.querySelector('[name="doseTimes"]');
    const slots = form.querySelector('#time-slots');
    const formSel = form.querySelector('[name="form"]');
    const unitSel = form.querySelector('[name="doseUnit"]');
    if (!course) return;
    const syncUnit = () => {
      if (!formSel || !unitSel) return;
      const v = formSel.value;
      if (Array.prototype.some.call(unitSel.options, o => o.value === v)) unitSel.value = v;
    };
    const readSlots = () => {
      if (!slots) return [];
      return Array.prototype.map.call(slots.querySelectorAll('input'), el => el.value);
    };
    const renderSlots = (n, keep) => {
      if (!slots) return;
      slots.innerHTML = timeSlotsHtml(keep ? readSlots() : [], n);
    };
    const mealSel = form.querySelector('[name="mealTiming"]');
    const offSel = form.querySelector('[name="mealOffset"]');
    const syncTiming = () => {
      const prn = course.value === 'prn';
      const hasMeal = !!mealSel && (mealSel.value === 'before' || mealSel.value === 'after');
      const custom = hasMeal && !!offSel && offSel.value === 'custom';
      form.querySelectorAll('[data-timing]').forEach(el => {
        let show = !prn;
        if (show && el.hasAttribute('data-off')) show = hasMeal;
        if (show && el.hasAttribute('data-off-custom')) show = custom;
        el.style.display = show ? '' : 'none';
      });
    };
    const onMealChange = () => {
      syncTiming();
      const offCustom = form.querySelector('[data-off-custom]');
      if (offCustom && offCustom.style.display !== 'none' && offSel && offSel.value === 'custom') {
        const inp = offCustom.querySelector('input');
        if (inp && !inp.value) inp.focus();
      }
    };
    if (mealSel) mealSel.addEventListener('change', onMealChange);
    if (offSel) offSel.addEventListener('change', onMealChange);
    const sync = () => {
      const c = course.value;
      form.querySelectorAll('[data-course]').forEach(el => {
        el.style.display = el.dataset.course === c ? '' : 'none';
      });
      syncTiming();
    };
    course.addEventListener('change', sync);
    if (countSel) countSel.addEventListener('change', () => renderSlots(Number(countSel.value) || 1, true));
    if (formSel) formSel.addEventListener('change', syncUnit);
    syncUnit();
    sync();
  }

    const list = Array.isArray(state.weights) ? state.weights : (state.weights = []);
    let rec = id ? list.find(w => w.id === id) : null;

    if (!rec) {

    rec.age = profile.age;
    rec.height = profile.height;
    rec.weight = Math.round(weight * 10) / 10;

  function saveTaskForm(form) {

    };

    if (!title) return;
    const repeatTimeRaw = get('repeatTime');
    const repeatTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(repeatTimeRaw) ? repeatTimeRaw : '20:00';
    const repeatRaw = get('repeat');
    const repeat = ['daily', 'weekly', 'monthly'].indexOf(repeatRaw) >= 0 ? repeatRaw : 'none';
    const due = get('due') || (repeat !== 'none' ? todayStr() : '');
    const dueD = due && /^\d{4}-\d{2}-\d{2}$/.test(due) ? parseD(due) : new Date();
    const wdVal = parseInt(get('repeatWeekday'), 10);
    const rdVal = parseInt(get('repeatDay'), 10);
    const repeatWeekday = Number.isFinite(wdVal) ? clamp(wdVal, 0, 6) : dueD.getDay();
    const repeatDay = Number.isFinite(rdVal) ? clamp(rdVal, 1, 31) : dueD.getDate();
    const payload = {
      title: title,
      note: get('note'),
      status: get('status') || 'todo',
      tag: get('tag') || '其他',
      priority: get('priority') || '中',
      due: due,
      repeat: repeat,
      repeatTime: repeatTime,
      repeatWeekday: repeatWeekday,
      repeatDay: repeatDay
    };
    if (id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        const wasDone = t.status === 'done';
        if (!wasDone && payload.status === 'done') t.prevStatus = t.status;
        Object.assign(t, payload);
        if (payload.status === 'done' && !wasDone) {
          t.doneAt = todayStr();
          completeRecurringTask(t, t.doneAt);
        }
        if (payload.status !== 'done' && wasDone) {
          t.doneAt = null;
          uncompleteRecurringTask(t);
        }
        if (payload.status !== 'done') t.doneAt = null;
      }
    } else {
      const t = Object.assign({ id: uid(), createdAt: new Date().toISOString(), doneAt: null, repeatNextId: '', repeatFrom: '' }, payload);
      if (t.status === 'done') {
        t.doneAt = todayStr();
        completeRecurringTask(t, t.doneAt);
      }
      state.tasks.unshift(t);
    }
    save();
    closeModal();
    render();
