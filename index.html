  function saveMoneyDebt(form) {
    const get = function (n) {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const name = get('name');
    const balance = moneyNum(get('balance'));
    if (!name) { toast('给它起个名字'); return; }
    if (!(balance > 0) && !form.dataset.id) { toast('剩余欠款要大于 0'); return; }
    const rec = {
      name: name.slice(0, 24),
      type: get('type') || 'card',
      balance: balance,
      apr: Math.min(200, Math.max(0, Number(get('apr')) || 0)),
      min: Math.max(0, Number(get('min')) || 0),
      /* 0 / 空 = 没有具体还款日 */
      due: (function (v) {
        const n = Math.round(Number(v));
        return isFinite(n) && n >= 1 && n <= 31 ? n : 0;
      })(get('due')),
      note: get('note').slice(0, 60),
      u: Date.now()
    };
    const m = normalizeMoney(money());
    const id = form.dataset.id || '';
    if (id) {
      const p = m.debts.filter(function (x) { return x.id === id; })[0];
      if (!p) { closeModal(); return; }
      /* 余额改动后初始额不动——进度条要的是「一共欠过多少」 */
      Object.assign(p, rec);
    } else {
      rec.id = uid();
      rec.start = balance;
      rec.clearedAt = '';
      m.debts.push(rec);
    }
    state.money = m;
    state.moneyAt = Date.now();
    save();
    render();
    closeModal();
    toast(id ? '债务已更新' : '债务已记下');
  }

  function viewStats() {
    const now = new Date();
    const range = [7, 30, 90].indexOf(statsRange) >= 0 ? statsRange : 30;
    const last7 = [];
    const rangeDays = [];
    for (let i = 6; i >= 0; i--) last7.push(fmt(addDays(now, -i)));
    for (let i = range - 1; i >= 0; i--) rangeDays.push(fmt(addDays(now, -i)));

    const week = rateOver(last7);
    const rangeStats = rateOver(rangeDays);
    const monthStart = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
    const monthDays = [];
    for (let i = 0; i < 31; i++) {
      const ds = fmt(addDays(now, -i));
      if (ds < monthStart) break;
      monthDays.push(ds);
    }
    const month = rateOver(monthDays);
    const doneTasks = state.tasks.filter(t => t.status === 'done');
    const weekDone = doneTasks.filter(t => t.doneAt && t.doneAt >= last7[0]).length;

    const pct = v => v.days ? Math.round(v.rate * 100) + '%' : '—';

    const bars = rangeDays.map((ds, bi) => {
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const pctv = rec ? Math.round(st.ratio * 100) : 0;
      const h = rec ? Math.max(4, pctv) : 0;
      const barCls = !rec ? 'zero' : (st.ratio >= 0.75 ? '' : 'low');
      const labelStep = Math.max(1, Math.ceil(rangeDays.length / 10));
      const showLabel = (rangeDays.length - 1 - bi) % labelStep === 0;
      const label = showLabel ? String(parseD(ds).getDate()) : '';
      return '<div class="bar-col ' + (ds === todayStr() ? 'is-today' : '') + '" title="' + ds +
          (rec ? ' 完成 ' + st.done + '/' + st.total + '（' + pctv + '%）' : ' 无记录') + '">' +
        '<div class="bar-wrap"><i class="' + barCls + '"' + (rec ? ' style="height:' + h + '%"' : '') + '></i></div>' +
        '<span>' + label + '</span>' +
      '</div>';
    }).join('');

    const hstats = state.habits.filter(h => !h.optional && !isArchived(h)).map(h => {
      const isQuit = isQuitLike(h);
      /* 戒烟的点阵按事件算：有「抽了」= miss，只有「忍住了」= ok，
         一条都没有 = 空（没记录 ≠ 成功，不能混为一谈）。 */
      const dots = rangeDays.map(ds => {
        let rec, ok, tip;
        if (isQuit) {
          const evs = dayCravings(h.id, ds);
          const ns = evs.filter(function (e) { return e.k === 's'; }).length;
          const nr = evs.length - ns;
          rec = evs.length > 0;
          ok = rec && ns === 0;
          tip = isSmoke(h)
            ? (ds + ' · ' + (rec ? ns + ' 抽 / ' + nr + ' 忍' : '无记录'))
            : (ds + ' · ' + (rec ? '未达标 ' + ns + ' 次' : '无记录'));
        } else {
          rec = hasRecords(ds);
          ok = rec && met(h, ds);
          tip = ds + ' · ' + countOf(ds, h.id) + ' ' + esc(h.unit || '次');
        }
        const cls = rec ? (ok ? 'ok' : 'miss') : '';
        return '<i class="' + cls + '" title="' + tip + '"></i>';
      }).join('');

      let detail;
      if (isQuit) {
        detail = (isSmoke(h) ? '戒烟' : '戒除') + ' · 连续 ' + quitStreak(h) + ' 天'
          + (quitTotal(h) > quitStreak(h) ? ' · 累计 ' + quitTotal(h) + ' 天' : '');
      } else {
        detail = '每天 ' + (h.target || 1) + ' ' + (h.unit || '次');
      }

      let hitText = '';
      if (isQuit) {
        const q = quitRange(h, range);
        const w = quitWord(h);
        /* 戒除只有一个按钮，不点就是守住——没有「忍」这个事件，
           硬摆「守 0」会让人以为是数据丢了。 */
        hitText = isSmoke(h)
          ? ('近 ' + range + ' 天 ' + w.hero + ' <b>' + q.smoke + '</b> · ' + w.hold + ' <b>' + q.resist + '</b>'
             + (q.total ? ' · 抵御率 <b>' + Math.round(q.rate * 100) + '%</b>' : ''))
          : ('近 ' + range + ' 天未达标 <b>' + q.smoke + '</b> 次');
      } else {
        let hit = 0;
        rangeDays.forEach(ds => {
          if (hasRecords(ds) && met(h, ds)) hit++;
        });
        hitText = '近 ' + range + ' 天达标 <b>' + hit + '</b> 天';
      }

      return '<div class="hstat" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<div class="hstat-name">' +
          '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
          '<div><b>' + esc(h.name) + '</b><small>' + esc(detail) + '</small></div>' +
        '</div>' +
        '<div class="hstat-dots" style="grid-template-columns:repeat(' + rangeDays.length + ',1fr);gap:' + (rangeDays.length > 30 ? '2px' : '4px') + ';max-width:' + (rangeDays.length > 30 ? '100%' : '240px') + '">' + dots + '</div>' +
        '<div class="hstat-meta">' + hitText + '<span class="streak">🔥 连续 ' + habitStreak(h) + ' <i>天</i></span></div>' +
        '</div>';
    }).join('');

    const doneToday = state.tasks.filter(t => t.status === 'done' && t.doneAt === todayStr()).length;

    const nowMin = now.getHours() * 60 + now.getMinutes();
    const medStats = (state.meds || []).map(med => {
      if (isPrn(med)) {
        let prn = 0;
        rangeDays.forEach(ds => { prn += prnKeys(ds, med.id).length; });
        return '<div class="med-stat">' +
          '<div class="med-stat-head"><span>💊 ' + esc(med.name) + '</span><b>按需 · 记录 ' + prn + ' 次</b></div>' +
          '<div class="med-stat-sub">' + esc(medCourseLabel(med)) + (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
            (med.status !== 'active' ? ' · 已暂停' : '') + '</div>' +
        '</div>';
      }
      let sched = 0, taken = 0;
      rangeDays.forEach(ds => {
        if (!medActiveOn(med, ds)) return;
        medDoseSlots(med).forEach(slot => {
          if (ds === todayStr()) {
            const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
            if (slotMin > nowMin) return;
          }
          sched++;
          if (doseAt(ds, med.id, slot)) taken++;
        });
      });
      const rate = sched ? Math.round(taken / sched * 100) : 0;
      const status = med.status !== 'active' ? '已暂停' : (sched ? '' : '暂无排期');
      return '<div class="med-stat">' +
        '<div class="med-stat-head"><span>💊 ' + esc(med.name) + '</span><b>' +
          (sched ? taken + ' / ' + sched + ' 次 · ' + rate + '%' : '—') + '</b></div>' +
        '<div class="med-stat-bar"><i style="width:' + rate + '%"></i></div>' +
        '<div class="med-stat-sub">' + esc(medCourseLabel(med)) + (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
          (status ? ' · ' + esc(status) : '') + '</div>' +
      '</div>';
    }).join('');

    /* 同一习惯同一分钟内的 +1 / -1 合并成净变化，来回撤销不再刷屏 */
    const rawLog = (Array.isArray(state.events) ? state.events : [])
      .filter(e => e && e.at && e.id && e.delta && !isNaN(new Date(e.at).getTime()))
      .slice(-80)
      .reverse();
    const logBuckets = new Map();
    rawLog.forEach(e => {
      const at = new Date(e.at);
      const minute = pad2(at.getHours()) + ':' + pad2(at.getMinutes());
      /* 用药带 slot（比如 08:00），把 slot 也放进键里，同一分钟两种药不会被并成一条 */
      const slot = e.slot || '';
      const key = e.id + '|' + slot + '|' + fmt(at) + '|' + minute;
      if (logBuckets.has(key)) {
        logBuckets.get(key).delta += Number(e.delta);
      } else {
        logBuckets.set(key, { id: e.id, slot: slot, kind: e.kind || '', delta: Number(e.delta), at: at, d: e.d, minute: minute });
      }
    });
    const logList = [...logBuckets.values()].filter(b => b.delta !== 0).slice(0, 24);
    const logShown = statsLogOpen ? logList : logList.slice(0, 5);
    const logHidden = logList.length - logShown.length;
    const todayS = todayStr();
    const logRows = logShown.map(e => {
      const h = state.habits.find(x => x.id === e.id);
      const md = h ? null : medById(e.id);
      const at = e.at;
      const opDate = fmt(at);
      let rel;
      if (opDate === todayS) rel = '今天';
      else if (opDate === fmt(addDays(new Date(), -1))) rel = '昨天';
      else rel = (at.getMonth() + 1) + '/' + at.getDate();
      const backfill = e.d && e.d !== opDate ? '补记 ' + (Number(e.d.slice(5, 7)) + '/' + Number(e.d.slice(8, 10))) : '';
      const logName = md
        ? md.name + (e.slot ? ' · ' + e.slot : '')
        : (h ? h.name : '已删除的习惯');
      const logIco = md ? '💊' : ((h && h.icon) || '·');
      return '<div class="log-row" style="--hc:' + esc(md ? '#6f7f91' : ((h && h.color) || '#8a8f83')) + '">' +
        '<span class="log-time">' + e.minute + '</span>' +
        '<span class="log-ico">' + esc(logIco) + '</span>' +
        '<span class="log-name">' + esc(logName) + '</span>' +
        '<span class="log-delta' + (e.delta < 0 ? ' minus' : (!md && isQuitLike(h) ? ' bad' : '')) + '">' + (e.delta > 0 ? '+' : '') + e.delta + '</span>' +
        '<span class="log-date">' + rel + (backfill ? ' · ' + backfill : '') + '</span>' +
      '</div>';
    }).join('');
    const logToggle = logList.length > 5
      ? '<button type="button" class="log-more" data-act="stats-log-toggle">' +
          (statsLogOpen ? '收起' : '查看更多' + (logHidden > 0 ? ' · 还有 ' + logHidden + ' 条' : '')) +
        '</button>'
      : '';

    /* 没有戒烟习惯时两块都不渲染；有的话「汇总」在前、「分析」在后 */
    const qhSum = quitHabit();

    /* ---- v84 面板合并 ----
       以前 14 个独立面板，同一件事散在三四块（习惯 4 处、用药 4 处、戒烟 2 处），
       一路要滑 4 屏多。现在按主题并成 6 块，同主题用分段控件切。 */
    const hTab = ['month', 'range', 'log'].indexOf(statsHabitTab) >= 0 ? statsHabitTab : 'month';
    const mTab = ['month', 'range', 'trend'].indexOf(statsMedTab) >= 0 ? statsMedTab : 'month';
    const habitSub = hTab === 'month' ? '只看有记录的日子'
      : (hTab === 'range' ? '最近 ' + range + ' 天' : '最近 ' + logList.length + ' 次操作，含服药');
    /* v115：把习惯页的「本月概览」同步进来（口径都是本月，与「本月」分段放一起）。
       没有可统计的习惯时 habitMonthOverview 返回空串，不影响月份网格。 */
    const habitBody = hTab === 'month'
      ? habitMonthOverview() +
        (monthHabitRowsHtml(now.getFullYear(), now.getMonth()) || '<div class="empty-box">本月还没有记录。</div>')
      : (hTab === 'range'
        ? (hstats || '<div class="empty-box">还没有习惯数据。</div>')
        : (logRows
          ? logRows + logToggle
          : '<div class="empty-box">还没有操作记录，去今日页点一下习惯试试。</div>'));
    const medSub = mTab === 'month' ? '本月 · 按应服次数'
      : (mTab === 'range' ? '近 ' + range + ' 天 · 按应服次数' : '近 ' + range + ' 天 · 每天一根柱');
    const medBody = mTab === 'month'
      ? (monthMedPanel(now.getFullYear(), now.getMonth()) || '<div class="empty-box">本月还没有用药数据。</div>')
      : (mTab === 'range'
        ? (medStats || '<div class="empty-box">还没有用药记录。</div>')
        : medTrendBody(range, rangeDays));

    /* 任务：原来是独立一块「任务完成度」，与待办页底部完全重复（v84 删掉了）。
       但统计页少了任务就等于缺一角，所以在总览末尾压成一行三格 + 一条细进度条；
       完整五格仍然只在待办页（点「看待办」过去看）。口径跟那边同一套 taskStats。 */
    const tst = taskStats(taskRange);
    const tkPct = Math.round(tst.rate * 100);
    const tkRange = (TASK_RANGES.find(r => r[0] === taskRange) || [30, '近 1 月'])[1];

    return '' +
      '<div class="page-head"><div><h2>数据统计</h2><p>不追求完美，只看趋势。只统计有记录的日子：柱状图灰线 = 无记录，浅色 = 未达标，实心 = 达标（≥75%）。</p></div>' +
        '<div class="stats-acts">' +
          '<button type="button" class="btn sm" data-act="algo-open">考核算法</button>' +
          '<div class="range-switch">' + [7, 30, 90].map(n =>
            '<button type="button" class="' + (range === n ? 'active' : '') + '" data-act="set-stats-range" data-range="' + n + '">' + n + ' 天</button>'
          ).join('') + '</div>' +
        '</div></div>' +
      '<div class="panel"><h3>总览 <span class="muted-sm">（近 ' + range + ' 天 · 只看有记录的日子）</span></h3>' +
        '<div class="stat-grid">' +
          '<div class="stat-card"><small>连续达标</small><b>' + overallStreak() + ' <i>天</i></b><span>完成率 ≥ 75% 记一天</span></div>' +
          '<div class="stat-card"><small>近 ' + range + ' 天完成率</small><b>' + pct(rangeStats) + '</b><span>' + rangeStats.days + ' 天有记录</span></div>' +
          '<div class="stat-card"><small>本月完成率</small><b>' + pct(month) + '</b><span>' + month.days + ' 天有记录</span></div>' +
          '<div class="stat-card"><small>已完成任务</small><b>' + doneTasks.length + ' <i>条</i></b><span>近 7 天 +' + weekDone + ' · 今天 +' + doneToday + '</span></div>' +
        '</div>' +
        '<div class="sblock">' +
          '<div class="sblock-head"><b>近 ' + range + ' 天完成率</b>' +
            '<span class="muted-sm">灰线 = 无记录 · 浅色 = 未达标 · 实心 = 达标（≥75%）</span></div>' +
          '<div class="chart" style="gap:' + (range > 30 ? '1px' : (range > 14 ? '3px' : '8px')) + '">' + bars + '</div>' +
        '</div>' +
        monthReviewBody() +
        '<div class="sblock">' +
          '<div class="sblock-head"><b>任务</b>' +
            '<div class="sh-right">' +
              '<span class="muted-sm">完整的五格明细在待办页底部</span>' +
              '<button type="button" class="btn sm" data-act="more-go" data-view="board">看待办</button>' +
            '</div>' +
          '</div>' +
          '<div class="rv-grid tk-grid">' +
            '<div class="rv-cell"><small>新增</small><b>' + tst.n + ' <i>条</i></b>' +
              '<span>' + tkRange + '</span></div>' +
            '<div class="rv-cell"><small>已完成</small><b>' + tst.done + ' <i>条</i></b>' +
              '<span>含归档 ' + tst.arch + ' 条</span></div>' +
            '<div class="rv-cell"><small>达成率</small><b>' + tkPct + '%</b>' +
              '<span>完成 ÷ 新增</span></div>' +
          '</div>' +
          '<div class="tk-bar"><i style="width:' + tkPct + '%"></i></div>' +
        '</div>' +
      '</div>' +

      /* 习惯：本月网格 / 近 N 天明细 / 操作时间线，同一份数据的三种粒度 */
      '<div class="panel">' +
        '<div class="shead"><h3>习惯 <span class="muted-sm">（' + habitSub + '）</span></h3>' +
          statsSegHtml('stats-habit-tab', hTab, [['month', '本月'], ['range', '近 ' + range + ' 天'], ['log', '时间线']]) +
        '</div>' +
        habitBody +
      '</div>' +

      /* 用药：本月 / 近 N 天 / 趋势，三处的百分比口径都写在标题的括号里 */
      '<div class="panel">' +
        '<div class="shead"><h3>用药 <span class="muted-sm">（' + medSub + '）</span></h3>' +
          statsSegHtml('stats-med-tab', mTab, [['month', '本月'], ['range', '近 ' + range + ' 天'], ['trend', '趋势']]) +
        '</div>' +
        medBody +
      '</div>' +

      /* 戒烟：8 张卡常显，分析（勋章 + 时段图）默认折起来 */
      (qhSum
        ? '<div class="panel">' +
            '<div class="shead"><h3>戒烟 <span class="muted-sm">（口径同戒烟页）</span></h3>' +
              (statsQuitOpen
                ? '<button type="button" class="btn sm" data-act="stats-quit-fold">收起分析</button>'
                : '<button type="button" class="btn sm" data-act="stats-quit-fold">展开分析</button>') +
            '</div>' +
            quitSumCardsHtml(qhSum, false) +
            (statsQuitOpen ? quitPanelBody(range) : '') +
          '</div>'
        : '') +

      weightStatsPanel(range) +
    '';
  }

  /* 统计页分段控件：一组按钮，当前格高亮。状态是模块级变量，见 statsHabitTab */
  function statsSegHtml(act, cur, pairs) {
    return '<div class="stab">' + pairs.map(function (p) {
      return '<button type="button" class="' + (p[0] === cur ? 'on' : '') +
        '" data-act="' + act + '" data-tab="' + p[0] + '">' + p[1] + '</button>';
    }).join('') + '</div>';
  }

  /* ============================================================
     设置视图
     ============================================================ */
  function calcBmi(weight, heightCm) {
    const h = Number(heightCm) / 100;
    const w = Number(weight);
    if (!isFinite(h) || !isFinite(w) || h <= 0 || w <= 0) return 0;
    return Math.round(w / (h * h) * 10) / 10;
  }

  function bmiCategory(bmi) {
    const v = Number(bmi);
    if (!isFinite(v) || v <= 0) return { label: '—', tone: '', note: '还没有 BMI 数据' };
    if (v < 18.5) return { label: '偏轻', tone: 'low', note: '低于成人正常范围' };
    if (v < 24) return { label: '正常', tone: 'ok', note: '在成人正常范围内' };
    if (v < 28) return { label: '超重', tone: 'warn', note: '高于成人正常范围' };
    return { label: '肥胖', tone: 'high', note: '明显高于成人正常范围' };
  }

  function weightRecords() {
    return (Array.isArray(state.weights) ? state.weights : [])
      .filter(w => w && w.date && Number(w.weight) > 0)
      .slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) ||
        String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  }

  function weightForDate(d) {
    const list = weightRecords().filter(w => w.date === d);
    return list.length ? list[list.length - 1] : null;
  }

  function weightInRange(list, range) {
    if (!range) return list;
    const start = fmt(addDays(new Date(), -(range - 1)));
    return list.filter(w => w.date >= start);
  }

  function weightRangeSwitchHtml() {
    return '<div class="range-switch">' + [[7, '7 天'], [30, '30 天'], [90, '90 天'], [0, '全部']].map(p =>
      '<button type="button" class="' + (weightRange === p[0] ? 'active' : '') + '" data-act="set-weight-range" data-range="' + p[0] + '">' + p[1] + '</button>'
    ).join('') + '</div>';
  }

  /* 历史体重折线图：等比缩放的 SVG，含健康区间背景带 */
  function weightLineChart(list, profile) {
    if (!list || !list.length) {
      return '<div class="ww-empty">这个区间还没有体重记录<br>记一笔之后，这里会画出曲线</div>';
    }
    /* v114：H 从 200 提到 340 —— 右栏多了体脂卡之后，200 高的图会把卡片拉开一块空白 */
    const W = 600, H = 340, L = 38, R = 14, T = 16, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const pts = list.map(w => ({ date: w.date, v: Number(w.weight), bmi: w.bmi })).filter(p => isFinite(p.v));
    if (!pts.length) return '<div class="ww-empty">这个区间还没有体重记录</div>';

    let lo = pts[0].v, hi = pts[0].v;
    pts.forEach(p => { if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; });

    const height = Number(profile && profile.height) || 0;
    let bandLo = null, bandHi = null;
    if (height > 0) {
      const m2 = (height / 100) * (height / 100);
      bandLo = Math.round(18.5 * m2 * 10) / 10;
      bandHi = Math.round(23.9 * m2 * 10) / 10;
    }
    const pad = Math.max(0.6, (hi - lo) * 0.16);
    lo -= pad; hi += pad;
    /* 目标体重：纳入值域，保证虚线一定可见（否则目标在区间外时画不出来） */
    const goal = Number(profile && profile.goalWeight) || 0;
    if (goal > 0) {
      if (goal < lo) lo = goal - pad * 0.4;
      if (goal > hi) hi = goal + pad * 0.4;
    }
    const span = Math.max(0.5, hi - lo);
    const yy = v => T + (hi - v) / span * ph;
    const xx = i => pts.length === 1 ? L + pw / 2 : L + (i / (pts.length - 1)) * pw;

    let g = '';
    /* 图从 200 加高到 340 之后三条线太稀，改四等分 */
    [0, 1 / 3, 2 / 3, 1].forEach(t => {
      const v = hi - span * t;
      const y = T + ph * t;
      g += '<line class="ww-grid" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text class="ww-lbl" x="' + (L - 6) + '" y="' + (y + 3.4).toFixed(1) + '" text-anchor="end">' + v.toFixed(1) + '</text>';
    });

    if (bandLo !== null) {
      const clampY = v => Math.max(T, Math.min(T + ph, v));
      const yTop = clampY(yy(bandHi)), yBot = clampY(yy(bandLo));
      if (yBot - yTop > 0.5) {
        g += '<rect class="ww-band" x="' + L + '" y="' + yTop.toFixed(1) + '" width="' + pw + '" height="' + (yBot - yTop).toFixed(1) + '"/>';
        if (yy(bandHi) >= T && yy(bandHi) <= T + ph) {
          g += '<line class="ww-band-line" x1="' + L + '" y1="' + yTop.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yTop.toFixed(1) + '"/>';
        }
        if (yy(bandLo) >= T && yy(bandLo) <= T + ph) {
          g += '<line class="ww-band-line" x1="' + L + '" y1="' + yBot.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yBot.toFixed(1) + '"/>';
        }
      }
    }

    /* 目标体重虚线 + 右侧标签 */
    if (goal > 0) {
      const gy = Math.max(T, Math.min(T + ph, yy(goal)));
      g += '<line class="ww-goal" x1="' + L + '" y1="' + gy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + gy.toFixed(1) + '">' +
        '<title>目标 ' + goal.toFixed(1) + ' kg</title></line>' +
        '<text class="ww-goal-lbl" x="' + (W - R) + '" y="' + (gy - 4).toFixed(1) + '" text-anchor="end">目标 ' + goal.toFixed(1) + '</text>';
    }

    const d = pts.map((p, i) => (i ? 'L' : 'M') + xx(i).toFixed(1) + ',' + yy(p.v).toFixed(1)).join(' ');    g += '<path class="ww-line" d="' + d + '"/>';
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      g += '<circle class="ww-dot' + (last ? ' last' : '') + '" cx="' + xx(i).toFixed(1) + '" cy="' + yy(p.v).toFixed(1) + '" r="' + (last ? 3.6 : 2.6) + '">' +
        '<title>' + p.date + ' · ' + p.v + ' kg</title></circle>';
    });

    const idx = pts.length === 1 ? [0] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    const used = [];
    idx.forEach(i => {
      const cx = Math.round(xx(i));
      if (used.indexOf(cx) >= 0) return;
      used.push(cx);
      g += '<text class="ww-lbl" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' +
        (pts[i].date.slice(5).replace('-', '/')) + '</text>';
    });

    return '<svg class="ww-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="历史体重折线图">' + g + '</svg>';
  }

  function weightBandText(profile) {
    const h = Number(profile && profile.height) || 0;
    if (!h) return 'BMI = 体重(kg) ÷ 身高(m)²；成人参考范围 18.5–23.9，未成年人仅参考。';
    const m2 = (h / 100) * (h / 100);
    const lo = Math.round(18.5 * m2 * 10) / 10;
    const hi = Math.round(23.9 * m2 * 10) / 10;
    return '浅绿色带是健康区间 ' + lo + '–' + hi + ' kg（BMI 18.5–23.9，按 ' + h + ' cm 换算）；未成年人仅参考。';
  }

  function weightSummaryHtml(list) {
    if (!list || !list.length) return '<div class="ww-empty">还没有数据</div>';
    const first = list[0], last = list[list.length - 1];
    let hi = Number(first.weight), lo = Number(first.weight), sum = 0;
    list.forEach(w => {
      const v = Number(w.weight);
      if (v > hi) hi = v;
      if (v < lo) lo = v;
      sum += v;
    });
    const avg = Math.round(sum / list.length * 10) / 10;
    const delta = Math.round((Number(last.weight) - Number(first.weight)) * 10) / 10;
    const deltaText = delta === 0 ? '持平' : (delta > 0 ? '↑ +' : '↓ ') + Math.abs(delta) + ' kg';
    const info = bmiCategory(last.bmi);
    const row = (label, value, unit) =>
      '<div class="wsum-row"><small>' + label + '</small><b>' + value + (unit ? '<i>' + unit + '</i>' : '') + '</b></div>';
    return row('起始 → 当前', first.weight + ' → ' + last.weight, ' kg') +
      row('区间变化', deltaText, '') +
      row('最高 / 最低', hi + ' / ' + lo, ' kg') +
      row('平均', avg, ' kg') +
      row('记录', list.length, ' 次') +
      row('当前 BMI', last.bmi + ' ' + info.label, '');
  }

  /* 体脂（v114）：只做记录和趋势，**不给参考范围** —— 不同体脂秤的算法差异很大，
     给一个「正常 15–20%」只会误导。0 / 缺省 = 没填。 */
  function weightFatPanel(list) {
    const pts = (list || []).filter(w => Number(w.fat) > 0);
    if (!pts.length) {
      return '<section class="panel weight-fat">' +
        '<div class="panel-head"><h3>体脂率</h3></div>' +
        '<div class="ww-empty">还没有体脂数据。<br>记录体重时顺手填一下，这里就会出现趋势。</div>' +
        '<p class="hint">只记录趋势，不给参考范围。</p>' +
      '</section>';
    }
    const last = pts[pts.length - 1];
    const prev = pts.length > 1 ? pts[pts.length - 2] : null;
    const first = pts[0];
    const delta = (a, b) => {
      if (b === null) return '首次记录';
      const v = Math.round((Number(a) - Number(b)) * 10) / 10;
      if (v === 0) return '持平';
      return (v > 0 ? '↑ ' : '↓ ') + Math.abs(v).toFixed(1) + '%';
    };
    let lo = Number(first.fat), hi = Number(first.fat);
    pts.forEach(p => {
      const v = Number(p.fat);
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    });
    return '<section class="panel weight-fat">' +
      '<div class="panel-head"><h3>体脂率</h3><span class="muted-sm">' + pts.length + ' 次有记录</span></div>' +
      '<div class="wfat-main"><b>' + esc(last.fat) + '<i>%</i></b>' +
        '<span>较上次 ' + delta(last.fat, prev ? prev.fat : null) + '</span></div>' +
      weightFatSpark(pts) +
      '<div class="wfat-grid">' +
        '<div><small>区间变化</small><b>' + (pts.length > 1 ? delta(last.fat, first.fat) : '—') + '</b></div>' +
        '<div><small>最低 / 最高</small><b>' + lo + ' / ' + hi + '%</b></div>' +
      '</div>' +
      '<p class="hint">只记录趋势，不给参考范围——不同体脂秤的算法差别很大。</p>' +
    '</section>';
  }

  function weightFatSpark(pts) {
    const W = 240, H = 58, P = 5;
    const vs = pts.map(p => Number(p.fat));
    let lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    if (hi - lo < 0.8) { lo -= 0.4; hi += 0.4; }
    const n = vs.length;
    const xx = i => n === 1 ? W / 2 : P + i / (n - 1) * (W - 2 * P);
    const yy = v => P + (1 - (v - lo) / (hi - lo)) * (H - 2 * P);
    const line = vs.map((v, i) => (i ? 'L' : 'M') + xx(i).toFixed(1) + ' ' + yy(v).toFixed(1)).join(' ');
    const area = line + ' L' + xx(n - 1).toFixed(1) + ' ' + (H - P) +
      ' L' + xx(0).toFixed(1) + ' ' + (H - P) + ' Z';
    return '<svg class="wfat-spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="体脂率趋势">' +
      '<path class="wfat-area" d="' + area + '"/>' +
      '<path class="wfat-line" d="' + line + '"/>' +
      pts.map((p, i) => '<circle class="wfat-dot" cx="' + xx(i).toFixed(1) + '" cy="' +
        yy(Number(p.fat)).toFixed(1) + '" r="2.2"><title>' + p.date + ' · ' + Number(p.fat) +
        '%</title></circle>').join('') +
    '</svg>';
  }

  function weightStatsPanel(days) {
    const count = Math.max(1, Number(days) || 30);
    const start = fmt(addDays(new Date(), -(count - 1)));
    const list = weightRecords().filter(w => w.date >= start);
    if (!list.length) {
      return '<div class="panel"><h3>体重与 BMI</h3>' +
        '<div class="empty-box">最近 ' + count + ' 天没有体重记录，去「体重」页记录一次。</div></div>';
    }
    const latest = list[list.length - 1];
    const first = list[0];
    const info = bmiCategory(latest.bmi);
    const diff = Math.round((latest.weight - first.weight) * 10) / 10;
    const delta = diff === 0 ? '持平' : (diff > 0 ? '+' : '') + diff + ' kg';
    return '<div class="panel">' +
      '<div class="panel-head"><h3>体重与 BMI</h3><span class="muted-sm">最近 ' + count + ' 天</span></div>' +
      '<div class="weight-stat-row">' +
        '<div><small>最新体重</small><b>' + esc(latest.weight) + ' <i>kg</i></b></div>' +
        '<div><small>BMI</small><b>' + esc(latest.bmi) + ' <i>' + esc(info.label) + '</i></b></div>' +
        '<div><small>较区间首次</small><b>' + delta + '</b></div>' +
      '</div>' +
      weightLineChart(list, normalizeBodyProfile(state.bodyProfile)) +
      '<p class="cal-hint">' + esc(latest.date) + ' 记录 · ' + esc(latest.age) + ' 岁 · ' + esc(latest.height) + ' cm' +
        (latest.age < 18 ? ' · 未成年 BMI 仅参考' : '') + '</p>' +
    '</div>';
  }

  /* 习惯页排序：纯视图偏好，不进 state。刻意「离开页面仍保留」——
     排序不会隐藏任何数据，用户选过一次多半希望它记住。 */
  let habitSort = 'created';
  const HABIT_SORTS = [['created', '按创建'], ['progress', '今日进度'], ['streak', '连续天数']];

  function habitSortHtml() {
    return '<div class="habit-sort">' +
      HABIT_SORTS.map(s =>
        '<button type="button" class="tag-chip' + (habitSort === s[0] ? ' active' : '') +
        '" data-act="habit-sort" data-sort="' + s[0] + '" title="按' + s[1] + '排序">' + s[1] + '</button>'
      ).join('') +
    '</div>';
  }

  function habitManageRows() {
    const base = state.habits.filter(h => !h.med && !isArchived(h));
    const d = todayStr();
    const ratioOf = h => {
      /* 戒烟不写 checks，countOf 恒为 0，只能看 met（当天有没有「点一根」） */
      if (isQuitLike(h)) return met(h, d) ? 1 : 0;
      const c = countOf(d, h.id);
      const t = Number(h.target) || 1;
      return Math.min(1, c / t);
    };
    const order = new Map(base.map((h, i) => [h.id, i]));
    const list = base.slice();
    if (habitSort === 'progress') {
      list.sort((a, b) => ratioOf(b) - ratioOf(a) || order.get(a.id) - order.get(b.id));
    } else if (habitSort === 'streak') {
      list.sort((a, b) => habitStreak(b) - habitStreak(a) || order.get(a.id) - order.get(b.id));
    }
    /* 今日状态：管理页一眼看出今天还剩几个没打。
       保持看次数（0/3 也要说清楚），戒除看有没有破（不点就是守住）。 */
    const todayMark = h => {
      if (isQuitLike(h)) {
        return met(h, d)
          ? { ok: true, tip: '今日守住了' }
          : { ok: false, tip: '今日未达标（记了 ' + quitSlips(h, d) + ' 次）' };
      }
      const c = countOf(d, h.id);
      const t = Math.max(1, Number(h.target) || 1);
      if (c >= t) return { ok: true, tip: '今日达标（' + c + '/' + t + '）' };
      return { ok: false, tip: '今日 ' + c + '/' + t + ' ' + (h.unit || '次') };
    };
    return list.map(h => {
      const pin = isPinned(h);
      const tm = todayMark(h);
      const detail = h.id === 'h_breathe'
        ? '每天一组 · ' + (Number(h.breatheCycles) || 4) + ' 次循环 · 建议 ' + String(h.suggestTime || '15:00')
        : (isQuitLike(h)
          ? (isSmoke(h) ? '戒烟' : '戒除') + ' · 连续 ' + quitStreak(h) + ' 天达标'
          : '养成 · 每天 ' + (h.target || 1) + ' ' + esc(h.unit || '次'));
      return '<div class="habit-row" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-row-info"><b>' + esc(h.name) + '</b><small>' + detail + (h.note ? ' · ' + esc(h.note) : '') + '</small></div>' +
        '<span class="habit-today' + (tm.ok ? ' ok' : '') + '" title="' + esc(tm.tip) + '">' +
          (tm.ok ? '✓' : '—') + '</span>' +
        (pin ? '<span class="pin-tag">常驻</span>' : '') +
        '<button class="icon-btn" data-act="habit-edit" data-id="' + h.id + '" title="编辑">✎</button>' +
        (pin ? '' : '<button class="icon-btn" data-act="habit-archive" data-id="' + h.id + '" title="归档">🗄</button>') +
        (pin ? '' : '<button class="icon-btn danger" data-act="habit-del" data-id="' + h.id + '" title="删除">✕</button>') +
        '</div>';
    }).join('');
  }

  function archivedHabitRows() {
    return state.habits.filter(h => !h.med && isArchived(h)).map(h => {
      return '<div class="habit-row archived" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-row-info"><b>' + esc(h.name) + '</b><small>已归档 · 历史打卡保留，不计入今日和统计</small></div>' +
        '<button class="mini-btn" data-act="habit-restore" data-id="' + h.id + '">恢复</button>' +
        '<button class="icon-btn danger" data-act="habit-del" data-id="' + h.id + '" title="永久删除">✕</button>' +
        '</div>';
    }).join('');
  }

  /* ============ 用药页面：进行中 / 未开始 / 暂停 / 已停用 ============ */
  const MED_PHASES = [
    { key: 'active',  label: '进行中', hint: '' },
    { key: 'future',  label: '未开始', hint: '还没到开始日期' },
    { key: 'paused',  label: '暂停中', hint: '恢复后会重新出现在今日页' },
    { key: 'stopped', label: '已停用', hint: '' }
  ];
  function medPhaseOf(med) {
    const t = todayStr();
    if (med.status === 'paused') return 'paused';
    if (med.status === 'stopped' || med.status === 'done') return 'stopped';
    if (!isPrn(med) && med.startDate && med.startDate > t) return 'future';
    if (!isPrn(med) && med.courseType === 'short' && med.endDate && med.endDate < t) return 'stopped';
    return 'active';
  }
  /* 板块内排序：餐前 → 随餐 → 空腹 → 餐后 → 未设置，同组按第一个服药时间 */
  const MED_MEAL_RANK = { before: 0, with: 1, empty: 2, after: 3 };
  function medMealRank(m) {
    const k = (m && m.mealTiming) || '';
    return MED_MEAL_RANK[k] === undefined ? 4 : MED_MEAL_RANK[k];
  }
  function medSortFn(a, b) {
    const d = medMealRank(a) - medMealRank(b);
    if (d) return d;
    const ta = medDoseSlots(a)[0] || '\uffff';
    const tb = medDoseSlots(b)[0] || '\uffff';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return String(a.name || '').localeCompare(String(b.name || ''), 'zh');
  }
  /* 药名简称：去掉常见剂型后缀，太长再截断——用于卡片顶部的药名条 */
  const MED_FORM_TAIL = /(肠溶胶囊|软胶囊|缓释胶囊|胶囊|肠溶片|缓释片|分散片|咀嚼片|薄膜衣片|片|颗粒|口服液|糖浆|滴剂|喷雾剂|散剂|散|丸|注射剂|乳膏|软膏|凝胶|贴剂)$/;
  function medShortName(name) {
    let s = String(name || '').trim();
    const trimmed = s.replace(MED_FORM_TAIL, '');
    if (trimmed.length >= 2) s = trimmed;
    return s.length > 8 ? s.slice(0, 8) + '…' : s;
  }

  /* 一行一种药：主信息＝每天几次 / 每次几颗 / 餐前餐后多久（重点），次要信息＝用途厂商疗程 */
  function medRowHtml(med) {
    const t = todayStr();
    const slots = medDoseSlots(med);
    const prn = isPrn(med);
    const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
    const meal = mealTimingText(med);
    const phase = medPhaseOf(med);

    const head = [];
    if (prn) head.push('按需服用');
    else if (slots.length) head.push('每天' + cnCount(slots.length) + '次');
    head.push('每次 ' + dose + ' ' + (med.doseUnit || ''));
    const mainText = head.join('，') + (meal ? ' ' + meal : '');

    const sec = [];
    if (med.purpose && med.purpose !== '其他') sec.push(med.purpose);
    if (med.manufacturer) sec.push(med.manufacturer);
    if (med.strength) sec.push(med.strength);
    const course = medCourseLabelOn(med, t);
    if (course) sec.push(course);

    const canTap = phase === 'active';
    const slotHtml = slots.map(slot => {
      if (!canTap) return '<span class="med-slot is-static">' + esc(slot) + '</span>';
      const entry = doseAt(t, med.id, slot);
      return '<button type="button" class="med-slot' + (entry ? ' done' : '') + '"' +
        ' data-act="' + (entry ? 'med-undo' : 'med-take') + '" data-id="' + med.id + '" data-slot="' + esc(slot) + '"' +
        ' data-date="' + t + '"' +
        ' title="' + (entry ? '点击撤销 ' : '点击记录 ') + esc(slot) + '">' + esc(slot) + (entry ? ' ✓' : '') + '</button>';
    }).join('');

    /* 按需药：在行内直接给「＋ 记一次」，不再依赖用药弹层 */
    const prnKeysToday = prn ? prnKeys(t, med.id).sort() : [];
    const prnTimes = prnKeysToday.map(k => {
      const e = state.doses[t][med.id][k];
      const at = new Date(e.at);
      return isNaN(at.getTime()) ? '' : pad2(at.getHours()) + ':' + pad2(at.getMinutes());
    }).filter(Boolean);
    const prnHtml = (prn && canTap)
      ? '<div class="med-row-prn">' +
          '<span class="med-row-prn-cnt">今日已记 <b>' + prnKeysToday.length + '</b> 次' +
            (prnTimes.length ? ' · ' + esc(prnTimes.join(' / ')) : '') + '</span>' +
          '<button type="button" class="med-prn-add" data-act="med-prn" data-id="' + med.id + '" data-date="' + t + '">＋ 记一次</button>' +
          (prnKeysToday.length ? '<button type="button" class="med-prn-undo" data-act="med-prn-undo" data-id="' + med.id + '" data-date="' + t + '">撤销</button>' : '') +
        '</div>'
      : '';

    const stock = medStockLabel(med);
    let info = med.medInfo || med.note || '';
    /* 备注若只是把用餐时机又写了一遍（旧数据常见），不再重复显示 */
    if (info && meal) {
      const norm = s => String(s || '').replace(/[\s·,，、]/g, '');
      const onlyTiming = /^(餐前|餐后|随餐|空腹|饭前|饭后)/.test(info) && norm(info).length <= 8;
      if (norm(info) === norm(meal) || onlyTiming) info = '';
    }

    return '<article class="med-row">' +
      '<span class="med-row-ico">' + esc(med.emoji || '💊') + '</span>' +
      '<div class="med-row-main">' +
        '<div class="med-row-title"><b>' + esc(med.name) + '</b></div>' +
        '<p class="med-row-dose"><b>' + esc(mainText) + '</b>' +
          (sec.length ? '<span>· ' + esc(sec.join(' · ')) + '</span>' : '') + '</p>' +
        (info ? '<p class="med-row-note">' + esc(info) + '</p>' : '') +
        (slotHtml ? '<div class="med-row-slots">' + slotHtml + '</div>' : '') +
        prnHtml +
      '</div>' +
      '<div class="med-row-side">' +
        (stock ? '<span class="med-row-stock">' + esc(stock) + '</span>' : '') +
        '<div class="med-row-ops">' +
          '<button class="icon-btn" data-act="med-edit" data-id="' + med.id + '" title="编辑">✎</button>' +
          '<button class="icon-btn" data-act="med-toggle" data-id="' + med.id + '" title="' +
            (med.status === 'active' ? '暂停' : '恢复') + '">' + (med.status === 'active' ? '⏸' : '▶') + '</button>' +
          '<button class="icon-btn danger" data-act="med-del" data-id="' + med.id + '" title="删除">✕</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function viewMeds() {
    const list = state.meds || [];
    const buckets = { active: [], future: [], paused: [], stopped: [] };
    list.forEach(m => { buckets[medPhaseOf(m)].push(m); });
    Object.keys(buckets).forEach(k => buckets[k].sort(medSortFn));

    const sched = medScheduledFor(todayStr());
    const taken = medTakenCount(todayStr());
    const prnCount = list.filter(m => m.status === 'active' && isPrn(m)).length;
    let sub = '记录医生给你的用药方案，按时服完。';
    if (sched.length) sub = '今天 ' + taken + ' / ' + sched.length + ' 次已记录' + (prnCount ? ' · 另有 ' + prnCount + ' 种按需药' : '');
    else if (prnCount) sub = '今天没有定时用药，有 ' + prnCount + ' 种按需药';
    else if (list.length) sub = '今天没有需要服的药';

    /* 「进行中」组内再按疗程切三段：长期 / 短期 / 按需。
       只有一个疗程时不加小标题，免得少量药品被切得太碎。 */
    const COURSE_PARTS = [
      { key: 'long',  label: '长期' },
      { key: 'short', label: '短期' },
      { key: 'prn',   label: '按需' }
    ];
    const courseOf = m => (isPrn(m) ? 'prn' : (m.courseType === 'short' ? 'short' : 'long'));
    const activeBoardHtml = arr => {
      const byCourse = { long: [], short: [], prn: [] };
      arr.forEach(m => byCourse[courseOf(m)].push(m));
      const used = COURSE_PARTS.filter(p => byCourse[p.key].length);
      if (used.length < 2) return '<div class="med-board">' + arr.map(medRowHtml).join('') + '</div>';
      return used.map(p =>
        '<div class="med-sub-head">' + p.label + '<i>' + byCourse[p.key].length + ' 种</i></div>' +
        '<div class="med-board">' + byCourse[p.key].map(medRowHtml).join('') + '</div>'
      ).join('');
    };

    const groups = MED_PHASES.map(ph => {
      const arr = buckets[ph.key];
      if (!arr.length) return '';
      return '<section class="med-group">' +
        '<div class="med-group-head"><h3>' + ph.label + '</h3><i>' + arr.length + ' 种</i>' +
          (ph.hint ? '<span class="med-group-hint">' + ph.hint + '</span>' : '') + '</div>' +
        (ph.key === 'active'
          ? activeBoardHtml(arr)
          : '<div class="med-board">' + arr.map(medRowHtml).join('') + '</div>') +
      '</section>';
    }).join('');

    const stockWarn = buckets.active.filter(m => {
      const d = medStockDays(m);
      return d !== null && d <= 7;
    }).length;
    const todayPct = sched.length ? Math.min(100, Math.round(taken / sched.length * 100)) : 0;
    const statsHtml = '<div class="med-stats">' +
      '<div class="ms-card"><small>药品总数</small><b>' + list.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>进行中</small><b>' + buckets.active.length + '<i>种</i></b>' +
        (buckets.future.length ? '<span class="ms-sub">另有 ' + buckets.future.length + ' 种未开始</span>' : '') + '</div>' +
      '<div class="ms-card"><small>已暂停</small><b>' + buckets.paused.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>已停用</small><b>' + buckets.stopped.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>今日服药</small><b>' + taken + ' / ' + sched.length + '</b>' +
        '<span class="ms-bar"><i style="width:' + todayPct + '%"></i></span></div>' +
      '<div class="ms-card' + (stockWarn ? ' warn' : '') + '"><small>库存告急</small><b>' + stockWarn + '<i>种</i></b>' +
        '<span class="ms-sub">' + (stockWarn ? '7 天内会吃完' : '都在 7 天以上') + '</span></div>' +
      '</div>';

    return '' +
      '<div class="page-head"><div><h2>用药</h2><p>' + esc(sub) + '</p></div>' +
        '<div class="page-acts">' +
          '<button class="btn" data-act="stock-check">盘点库存</button>' +
          '<button class="btn primary" data-act="med-new">＋ 添加用药</button>' +
        '</div></div>' +
      (list.length
        ? statsHtml + groups + '<p class="hint">点时间胶囊记录服药，再点一次撤销。进行中的药会出现在今日页的用药卡里。</p>'
        : '<div class="panel"><div class="empty-box">还没有用药记录。点右上角「添加用药」，添加后会在今日页出现「用药」卡。</div></div>' +
          '<p class="hint">只记录医生给你的方案；应用不提供剂量建议。支持长期、短期疗程和按需用药。</p>');
  }

  /* ============================================================
     习惯页「本月概览」（v109）
     ------------------------------------------------------------
     全部现算，不新增任何字段。两个口径写死在这里，别散到别处：
       · 达标 = met(h,d)，和今日/日历/统计用的是同一个判定
       · 应打卡 = 按 notifyFreq 逐日判断（daily 每天、weekly 每周那一天、
         monthly 每月那一天），不是「本月过了多少天就除多少天」
     用药习惯（h.med）当天没有排期就不计入应打卡——「没有用药需求就不参与」。
     ============================================================ */
  function habitDueOn(h, d) {
    if (!h || isArchived(h) || h.optional) return false;
    /* 习惯创建之前的日子不算：新建的习惯不该因为「上月全勤」被扣分 */
    const born = String(h.createdAt || '').slice(0, 10);
    if (born && d < born) return false;
    if (h.med) return medScheduledCount(d) > 0;
    const freq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
    if (freq === 'daily') return true;
    const dt = parseD(d);
    /* 别写 `Number(x) || 1`：周日是 0，falsy，会被当成周一。
       Number(undefined) 是 NaN，一样要回落到 1。 */
    const wd = Number(h.notifyWeekday);
    if (freq === 'weekly') return dt.getDay() === (isFinite(wd) ? clamp(Math.round(wd), 0, 6) : 1);
    const mdN = Number(h.notifyMonthday);
    const md = isFinite(mdN) ? clamp(Math.round(mdN), 1, 31) : 1;
    const lastDay = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
    return dt.getDate() === Math.min(md, lastDay);
  }

  /* 某个习惯在 [1 号, upto 号] 区间里的达标与应打卡天数 */
  function habitMonthRow(h, y, m, upto) {
    let hit = 0, due = 0;
    for (let i = 1; i <= upto; i++) {
      const d = fmt(new Date(y, m, i));
      if (!habitDueOn(h, d)) continue;
      due++;
      if (met(h, d)) hit++;
    }
    return { id: h.id, name: String(h.name || '未命名'), med: !!h.med,
             hit: hit, due: due, rate: due ? hit / due : 0 };
  }

  /* 整块汇总。没有需要打卡的习惯时返回空串，页面不留一块空板。 */
  function habitMonthOverview() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const upto = now.getDate();
    const list = (state.habits || [])
      .filter(h => h && !isArchived(h) && !h.optional)
      .map(h => habitMonthRow(h, y, m, upto))
      .filter(r => r.due > 0);
    if (!list.length) return '';

    /* 排名按达标率，但**只让本月应打卡 ≥5 次的参与**：
       比天数的话，「每周一次」的习惯永远垫底（最多 4 天）；
       比率的活，「做满 4 次 = 100%」又会压过「23 天 92%」。
       把低频的排除掉，剩下的频率相近，率才有可比性。 */
    const MIN_DUE = 5;
    const ranked = list.filter(r => r.due >= MIN_DUE).sort(function (a, b) {
      return (b.rate - a.rate) || (b.hit - a.hit) || a.name.localeCompare(b.name);
    });
    const top = ranked.length ? ranked[0] : null;
    const never = list.filter(r => r.hit === 0);
    /* 最低只在「至少达标过一天」里挑：0 天的那批已经归到「从未完成」，
       否则同一个人会同时出现在两栏里。全都 0 天时 low 为空。 */
    const scored = ranked.filter(r => r.hit > 0);
    const low = scored.length ? scored[scored.length - 1] : null;

    let hitSum = 0, dueSum = 0;
    list.forEach(function (r) { hitSum += r.hit; dueSum += r.due; });
    const rateAll = dueSum ? Math.round(hitSum / dueSum * 100) : 0;

    /* 上月同期：只取到「上月的今天号」，不然月初就跟整月比，永远显示下降 */
    const pmY = m === 0 ? y - 1 : y;
    const pmM = m === 0 ? 11 : m - 1;
    const pmLast = new Date(pmY, pmM + 1, 0).getDate();
    const pmUpto = Math.min(upto, pmLast);
    let pmHit = 0;
    (state.habits || []).filter(h => h && !isArchived(h) && !h.optional)
      .forEach(function (h) { pmHit += habitMonthRow(h, pmY, pmM, pmUpto).hit; });
    const delta = hitSum - pmHit;
    const deltaText = delta === 0 ? '持平' : (delta > 0 ? '↑ ' + delta + ' 天' : '↓ ' + (-delta) + ' 天');
    const deltaSub = '上月同期 ' + pmHit + ' 天';

    const fmtRow = function (r, sub) {
      return '<b>' + esc(r.name) + '</b><span>' + sub + '</span>';
    };
    const pct = function (r) { return Math.round(r.rate * 100) + '%'; };
    const neverText = never.length
      ? esc(never.slice(0, 2).map(r => r.name).join('、')) + (never.length > 2 ? ' 等 ' + never.length + ' 个' : '')
      : '';

    return '<section class="panel hsum">' +
      '<div class="panel-head"><h3>本月概览</h3>' +
        '<span class="hsum-range">' + (m + 1) + '月1日 – ' + (m + 1) + '月' + upto + '日 · ' +
          list.length + ' 项' + (list.some(r => r.med) ? '（含用药）' : '') + '</span></div>' +
      '<div class="hsum-kpi">' +
        '<div class="hs-k"><small>达标总天数</small><b>' + hitSum + ' <i>天</i></b>' +
          '<span class="hs-long">应打卡 ' + dueSum + ' 天</span>' +
          '<span class="hs-short">应打卡 ' + dueSum + '</span></div>' +
        '<div class="hs-k"><small>平均达标率</small><b>' + rateAll + ' <i>%</i></b>' +
          '<span class="hs-long">达标天数 ÷ 应打卡天数</span>' +
          '<span class="hs-short">达标 ÷ 应打卡</span></div>' +
        '<div class="hs-k"><small>比上月同期</small><b>' + deltaText + '</b>' +
          '<span class="hs-long">' + deltaSub + '</span>' +
          '<span class="hs-short">上月 ' + pmHit + ' 天</span></div>' +
      '</div>' +
      '<div class="hsum-list">' +
        '<div class="hs-l"><small>达标最高</small>' +
          (top ? fmtRow(top, top.hit + ' 天 / ' + pct(top))
               : '<b class="hs-none">—</b><span>本月还没有应打卡满 ' + MIN_DUE + ' 次的习惯</span>') + '</div>' +
        '<div class="hs-l"><small>达标最低</small>' +
          (low ? fmtRow(low, low.hit + ' 天 / ' + pct(low))
               : '<b class="hs-none">—</b><span>本月还没有习惯达标</span>') + '</div>' +
        '<div class="hs-l"><small>从未完成</small>' +
          (never.length
            ? '<b>' + neverText + '</b><span>本月 0 天达标</span>'
            : '<b class="hs-none">没有</b><span>每个习惯本月都至少达标 1 天</span>') + '</div>' +
      '</div>' +
    '</section>';
  }

    const rows = list.slice().reverse().map(w => {

        '<small>' + esc(w.age) + ' 岁 · ' + esc(w.height) + ' cm' +

        '<span class="weight-row-actions">' +
          '<button type="button" class="mini-btn" data-act="weight-edit" data-id="' + w.id + '">编辑</button>' +
          '<button type="button" class="mini-btn ghost" data-act="weight-del" data-id="' + w.id + '">删除</button>' +
        '</span>' +
      '</div>';
    }).join('');

    const empty = '<div class="panel"><div class="empty-box">还没有体重记录。记下第一次，之后就能看到体重和 BMI 趋势。</div>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="weight-new">记录第一次</button></div></div>';

    const chartList = weightInRange(list, weightRange);
    const hero = latest ? '<section class="weight-hero panel">' +
      '<div class="weight-main">' +
        '<small>最新体重</small>' +
        '<div class="weight-big">' + esc(latest.weight) + '<i>kg</i></div>' +
        '<div class="weight-date">' + esc(latest.date) + ' · ' + esc(latest.age) + ' 岁 · ' + esc(latest.height) + ' cm</div>' +
      '</div>' +
      '<div class="weight-bmi ' + info.tone + '">' +
        '<b>' + esc(latest.bmi) + '</b>' +
        '<span>BMI · ' + esc(info.label) + '</span>' +
        '<small>' + (latest.age < 18 ? '未成年 BMI 仅参考' : esc(info.note)) + '</small>' +
      '</div>' +
      '<div class="weight-metrics">' +
        '<div><small>较上次</small><b>' + deltaText(diff) + '</b></div>' +
        '<div><small>累计变化</small><b>' + deltaText(total) + '</b></div>' +
        '<div><small>记录</small><b>' + list.length + ' 次</b></div>' +

    return '' +
      '<div class="page-head"><div><h2>体重</h2><p>维护身体档案，记录体重，自动计算 BMI。</p></div>' +

        '</section>' +
        '<div class="weight-side">' +
          '<section class="panel">' +
            '<div class="panel-head"><h3>统计</h3><span class="muted-sm">' + (weightRange ? '近 ' + weightRange + ' 天' : '全部记录') + '</span></div>' +
            weightSummaryHtml(chartList) +
          '</section>' +
          weightFatPanel(chartList) +
        '</div>' +
      '</div>' +
      (latest ? '<div class="panel"><h3>记录明细</h3><div class="weight-list">' + rows + '</div></div>' : '');

  function essayAll() {

    const s = String(text || '').replace(/\s+/g, ' ').trim();

        '<button type="button" class="tag-chip' + (!essayTag ? ' active' : '') + '" data-act="essay-tag-filter" data-tag="">全部</button>' +
        allTags.map(tag => '<button type="button" class="tag-chip' + (essayTag === tag ? ' active' : '') + '" data-act="essay-tag-filter" data-tag="' + esc(tag) + '">#' + esc(tag) + '</button>').join('') +
        '</div>'
      : '';

    return '' +
      '<div class="page-head"><div><h2>随笔</h2><p>随手记下想法、片段和今天发生的事。</p></div>' +

          : '<div class="panel"><div class="empty-box">这个标签下还没有随笔。</div><div class="btn-row" style="justify-content:center"><button class="btn" data-act="essay-tag-filter" data-tag="">查看全部</button></div></div>')
        : '<div class="panel"><div class="empty-box">还没有随笔。写下一句话，也算今天留下的痕迹。</div>' +
          '<div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="essay-new">写第一篇</button></div></div>');
  }

  /* 手机端「更多」抽屉：一次列出所有页面，不必再进设置往下找。
     桌面端不显示（桌面侧栏本来就有全部页面），但留着也无害。 */
  function morePagesSheet() {
    /* 抽屉顺序跟 PC 导航共用同一份排序（v86）：
       只取「手机上没常驻 tabbar 的那些页」+ 设置，按 orderedNav 的顺序摆。 */
    const moreSet = {};
    MORE_PAGES.forEach(function (pg) { moreSet[pg.key] = 1; });
    moreSet.settings = 1;
    const items = orderedNav()
      .filter(function (n) { return moreSet[n.key]; })
      .map(function (n) { return { key: n.key, label: n.label, icon: n.icon }; });
    const cells = items.map(function (p2) {
      return '<button type="button" class="ps-cell' + (view === p2.key ? ' active' : '') + '"' +
        ' data-act="more-go" data-view="' + p2.key + '">' +
        '<span class="ps-ico">' + icon(p2.icon) + '</span>' +
        '<span class="ps-label">' + esc(p2.label) + '</span>' +
      '</button>';
    }).join('');
    openModal('' +
      '<div class="modal-card page-sheet" id="more-sheet">' +
        '<span class="ps-grip"></span>' +
        '<h3>去哪个页面</h3>' +
        '<div class="ps-grid">' + cells + '</div>' +
      '</div>');
    /* 抽屉和遮罩都让出底部导航的高度：这样抽屉开着时，底部 4 个 tab 仍然能直接点，
       不必先关抽屉再切页。点遮罩空白处依然会关闭。 */
    requestAnimationFrame(function () {
      const sheet = $('#more-sheet');
      if (!sheet) return;
      const barEl = $('#mobile-nav');
      const shown = barEl && getComputedStyle(barEl).display !== 'none';
      const h = shown ? Math.round(barEl.getBoundingClientRect().height) : 0;
      /* 注意：遮罩带 backdrop-filter，会形成包含块，里面的 fixed 元素是相对遮罩定位的。
         所以只把遮罩的底边抬起来，抽屉自己保持 bottom:0，就会正好落在导航条上方。 */
      const back = sheet.parentElement;
      if (back && h) back.style.bottom = h + 'px';
    });
  }

  /* ---------- 日历订阅 ----------
     订阅地址由服务端发：系统日历不带 Cookie，只能靠 URL 里的令牌认人。
     icsUrl 三态：undefined = 还没问过；null = 没有链接；string = 已有。 */
  let icsUrl;
  let icsLoading = false;

  function icsStateText() {
    if (icsUrl === undefined) return '读取中';
    return icsUrl ? '已生成 · 系统日历会自己来拉' : '还没生成';
  }

  async function icsLoad() {
    if (icsLoading || icsUrl !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    icsLoading = true;
    try {
      const r = await cloudApi('ics_status');
      icsUrl = (r && r.ok && typeof r.url === 'string' && r.url) ? r.url : null;
    } catch (e) {
      icsUrl = null;
    }
    icsLoading = false;
    if (view === 'settings') render();
  }

  async function icsReset() {
    if (icsUrl && !confirm('重新生成会让旧链接立刻失效，已经订阅的日历要重新添加一次。继续吗？')) return;
    try {
      const r = await cloudApi('ics_reset', {});
      if (r && r.ok && typeof r.url === 'string' && r.url) {
        icsUrl = r.url;
        render();
        toast('订阅链接已生成 · 复制后去日历里添加');
      } else {
        toast('生成失败，请稍后再试');
      }
    } catch (e) {
      toast('网络连接失败');
    }
  }

  async function icsCopy() {
    if (!icsUrl) return;
    try {
      await navigator.clipboard.writeText(icsUrl);
      toast('已复制，去日历里粘贴');
      return;
    } catch (e) { /* 没有剪贴板权限时退到选中 */ }
    const el = document.getElementById('ics-url');
    if (el) {
      el.focus();
      el.select();
      toast('已选中，按 Ctrl/⌘ + C 复制');
    }
  }

  /* ---------- 手机推送 ----------
     走企业微信机器人，不用 Web Push：国行安卓没有 FCM，Bark 只有 iOS，
     ntfy 这类要靠 App 自己保活会被系统杀掉。微信/企业微信在厂商白名单里。
     pushCfg 三态：undefined = 还没问过；null = 没配置；对象 = 已读到。 */
  let pushCfg;
  let pushLoading = false;
  let pushBusy = false;
  /* webhook 只在点「修改链接」时才允许编辑。平时是只读的：
     这个地址存在服务器上（users.push_webhook），跟浏览器无关，
     切设备照样生效——框里空着只是没渲染出来，不代表没存。 */
  let pushEditing = false;

  function pushStateText() {
    if (pushCfg === undefined) return '读取中';
    if (!pushCfg || !pushCfg.webhook) return '还没设置';
    return pushCfg.enabled ? '已开启 · 每分钟检查一次' : '已填地址，未开启';
  }

  async function pushLoad() {
    if (pushLoading || pushCfg !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    pushLoading = true;
    try {
      const r = await cloudApi('push_status');
      pushCfg = {
        enabled: !!(r && r.enabled),
        webhook: (r && typeof r.webhook === 'string') ? r.webhook : '',
        sentToday: (r && Number(r.sent_today)) || 0,
        lastSent: (r && r.last_sent) ? String(r.last_sent) : '',
        recent: (r && Array.isArray(r.recent)) ? r.recent : [],
        plan: []
      };
      /* 今日计划是独立的只读接口；它失败不该影响配置区显示 */
      try {
        const p = await cloudApi('push_preview');
        pushCfg.plan = (p && Array.isArray(p.items)) ? p.items : [];
      } catch (e) {
        pushCfg.plan = [];
      }
    } catch (e) {
      pushCfg = null;
    }
    pushLoading = false;
    /* v71 把这块搬到配置页之后忘了改这里：只在 settings 重绘，
       结果配置页的输入框永远停在渲染那一刻的空值。 */
    if (view === 'settings' || view === 'config') render();
  }

  function pushHookInput() {
    const el = document.getElementById('push-hook');
    return el ? el.value.trim() : ((pushCfg && pushCfg.webhook) || '');
  }

  /* useInput=true 才读输入框；否则一律用已保存的地址。
     为什么：只读态下 DOM 里的 input 可能是「还没加载完的空框」，
     拿它去保存会把服务器上的地址清空 —— 这就是「切设备后点一下暂停推送，
     推送地址没了」的成因。 */
  async function pushSave(enable, useInput) {
    const hook = useInput
      ? pushHookInput()
      : String((pushCfg && pushCfg.webhook) || '');
    if (enable && !hook) {
      toast('先把 webhook 地址填进来');
      const el = document.getElementById('push-hook');
      if (el) el.focus();
      return false;
    }
    try {
      const r = await cloudApi('push_save', { webhook: hook, enabled: !!enable });
      pushCfg = Object.assign({ sentToday: 0, lastSent: '' }, pushCfg || {}, {
        webhook: hook, enabled: !!(r && r.enabled)
      });
      pushEditing = false;
      render();
      toast(enable ? '推送已开启 · 到点会发到手机上'
        : (hook ? '已保存，推送已关闭' : '地址已清空，推送已停用'));
      return true;
    } catch (e) {
      toast(e && e.message ? e.message : '保存失败');
      return false;
    }
  }

  async function pushTest() {
    if (pushBusy) return;
    pushBusy = true;
    try {
      const saved = await pushSave(true);
      if (!saved) return;
      toast('正在发送…');
      try {
        await cloudApi('push_test', {});
        toast('发出去了，看看手机');
      } catch (e) {
        toast(e && e.message ? e.message : '发送失败');
      }
    } finally {
      pushBusy = false;
    }
  }

  function pushBoxHtml() {
    const cfg = pushCfg;
    const hook = cfg && cfg.webhook ? cfg.webhook : '';
    const on = !!(cfg && cfg.enabled);
    /* 没填过就直接可编辑（没什么可保护的）；填过就锁住，点「修改链接」才放开。
       地址存在服务器，切设备也在——框里空着只是没加载出来，不代表没存。 */
    const editing = pushEditing || !hook;
    const plan = (cfg && Array.isArray(cfg.plan)) ? cfg.plan : [];
    const recent = (cfg && Array.isArray(cfg.recent)) ? cfg.recent : [];
    const KIND_LABEL = { med: '用药', task: '待办', habit: '习惯', report: '汇报' };

    /* 今日计划：时间 + 类型 + 标题/正文 */
    const planHtml = plan.length
      ? plan.map(function (it) {
          const k = String(it.kind || '');
          const body = String(it.body || '').replace(/\n/g, ' · ');
          return '<li class="pc-row">' +
            '<span class="pc-time">' + esc(it.time) + '</span>' +
            '<span class="pc-tag pc-tag-' + esc(k) + '">' + esc(KIND_LABEL[k] || k) + '</span>' +
            '<span class="pc-txt"><b>' + esc(it.title) + '</b>' +
              (body ? '<small>' + esc(body) + '</small>' : '') + '</span>' +
          '</li>';
        }).join('')
      : '<li class="pc-empty">今天没有要推送的内容</li>';

    /* 最近发送：只有时间 + 正文（正文依赖 content 列，旧库为空时退回 slot_key） */
    const recentHtml = recent.length
      ? recent.map(function (r) {
          const txt = String(r.text || '').replace(/\n/g, ' · ');
          const at = String(r.at || '');
          return '<li class="pc-row">' +
            '<span class="pc-time">' + esc(at.slice(11, 16) || at) + '</span>' +
            '<span class="pc-txt"><small>' + esc(txt || r.key || '') + '</small></span>' +
          '</li>';
        }).join('')
      : '<li class="pc-empty">还没有发送记录</li>';

    return '<div class="ntf-box push-center">' +
      '<div class="ntf-head"><span class="ntf-dot ' + (on ? 'on' : '') + '"></span><b>手机推送</b>' +
        '<span class="ntf-state">' + esc(pushStateText()) + '</span></div>' +
      '<p class="muted-sm" style="margin:0 0 10px">用药、到点的任务、习惯会直接发到你的微信。' +
      '和日历订阅的区别是：日历由手机自己算，这个由服务器在那一分钟主动发，' +
      '所以关掉网页也能收到，而且能看到具体是「该吃药了」还是「该做这件事了」。</p>' +
      '<input class="ics-url push-hook' + (editing ? '' : ' is-locked') + '" id="push-hook" ' +
        'spellcheck="false" autocomplete="off" ' +
        'placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..." ' +
        'value="' + esc(editing ? '' : hook) + '"' +
        (editing ? '' : ' readonly') + '>' +
      '<div class="btn-row">' +
        (editing
          ? '<button class="btn primary" data-act="push-save">保存</button>' +
            (hook ? '<button class="btn ghost" data-act="push-cancel">取消</button>' : '')
          : '<button class="btn primary" data-act="push-edit">修改链接</button>' +
            '<button class="btn" data-act="push-test">发一条测试</button>' +
            (on ? '<button class="btn" data-act="push-off">暂停推送</button>' : '') +
            '<button class="btn ghost" data-act="push-refresh">刷新</button>') +
      '</div>' +
      '<p class="ics-hint">' + (editing
        ? '企业微信 → 建一个只有自己的<b>内部群</b>（外部群加不了机器人）→ ' +
          '群设置 → 群机器人 → 添加 → 复制 webhook 地址粘到这里。' +
          (hook ? '<br>保存后才会换成新地址；点「取消」保留原来的。' : '')
        : '地址已经存在服务器上，换手机、换浏览器都会保留，到点照常发。' +
          '想换一个再点「修改链接」。清空地址才会停用推送。') + '</p>' +
      '<p class="ics-warn">⚠️ 这个地址等于往你群里发消息的钥匙，别贴到公开的地方。' +
      '万一泄露，在企业微信里删掉机器人再重新添加一个就是新地址。</p>' +
      '<div class="pc-sec">' +
        '<div class="pc-sec-head">今日推送计划<span class="pc-count">' + plan.length + ' 条</span></div>' +
        '<ul class="pc-list">' + planHtml + '</ul>' +
      '</div>' +
      '<div class="pc-sec">' +
        '<div class="pc-sec-head">最近发送' +
          (cfg && cfg.sentToday ? '<span class="pc-count">今天已发 ' + cfg.sentToday + ' 条</span>' : '') +
        '</div>' +
        '<ul class="pc-list">' + recentHtml + '</ul>' +
      '</div>' +
    '</div>';
  }

  /* ---------- 邮件提醒（QQ 邮箱 SMTP）----------
     mailCfg 三态：undefined = 还没问过；null = 没配置/读取失败；对象 = 已读到。
     授权码只进不出：后端不回显明文，输入框永远留空，留空 = 保留已存的。 */
  let mailCfg;
  /* v122 通知通道矩阵：undefined=未加载 / null=加载失败 / 对象=矩阵 */
  let notifyPrefs;
  let notifyMeta = null;
  let notifyLoading = false;
  /* v124：夜间静默（默认关）与每日小结的三个时刻 */
  let notifyQuiet = false;
  /* v125 站点邮件：管理员配一次，全站用于注册确认与找回密码 */
  let siteMailCfg;
  let siteMailReady = false;
  let siteMailLoading = false;
  let notifyReport = { morning: '08:20', noon: '12:30', evening: '20:00' };
  let mailLoading = false;
  let mailBusy = false;
  let mailRecipient = '';
  let mailTestResult = null;   // {ok:boolean, msg:string}

  function mailField(name) {
    const el = document.getElementById('mail-' + name);
    return el ? String(el.value || '').trim() : '';
  }

  function mailStateText() {
    if (mailCfg === undefined) return '读取中';
    if (!mailCfg) return '还没配置';
    if (mailCfg.enabled) return '已开启 · 到点会发邮件';
    return mailCfg.hasSecret ? '已配置，已暂停' : '还没填授权码';
  }

  async function mailLoad() {
    if (mailLoading || mailCfg !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    mailLoading = true;
    try {
      const r = await cloudApi('mail_status');
      mailCfg = (r && r.config && typeof r.config === 'object') ? r.config : null;
      mailRecipient = (r && typeof r.recipient === 'string') ? r.recipient : '';
      if (r && r.crypto_ready === false) {
        mailTestResult = { ok: false, msg: '服务器加密组件不可用：请执行数据库迁移，或在 api/config.php 配置 mail_secret' };
      }
    } catch (e) {
      mailCfg = null;
    }
    mailLoading = false;
    if (view === 'config' || view === 'settings') render();
  }

  function mailValues() {
    return {
      host: mailField('host'),
      port: Number(mailField('port')),
      secure: mailField('secure'),
      user: mailField('user'),
      from: mailField('from'),
      name: mailField('name'),
      secret: mailField('secret')
    };
  }

  function mailCheck(v, needSecret) {
    if (!v.host) return '先填 SMTP 服务器';
    if (!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(v.host)) return '服务器只接受域名，例如 smtp.qq.com';
    if (!Number.isInteger(v.port) || v.port < 1 || v.port > 65535) return '端口要填 1–65535 的数字';
    if (!v.user || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.user)) return '用户名要填完整邮箱地址';
    if (v.from && v.from.toLowerCase() !== v.user.toLowerCase()) {
      return '发件人必须和用户名完全一致，否则会被判为伪造发件人';
    }
    if (v.name && Array.from(v.name).length > 60) return '称呼最多 60 个字';
    if (needSecret && !v.secret && !(mailCfg && mailCfg.hasSecret)) return '先填 16 位授权码';
    return '';
  }

  async function mailSave(enabled) {
    const v = mailValues();
    const bad = mailCheck(v, !!enabled);
    if (bad) { toast(bad); return false; }
    try {
      const r = await cloudApi('mail_save', Object.assign({}, v, { enabled: !!enabled }));
      mailCfg = (r && r.config) ? r.config : null;
      mailTestResult = null;
      render();
      toast(enabled ? '邮件提醒已保存并开启' : '已保存，邮件提醒已暂停');
      return true;
    } catch (e) {
      toast(e && e.message ? e.message : '保存失败');
      return false;
    }
  }

  async function mailTest() {
    if (mailBusy) return;
    const v = mailValues();
    const bad = mailCheck(v, true);
    if (bad) { toast(bad); return; }
    mailBusy = true;
    mailTestResult = null;
    const sendingBtn = document.querySelector('[data-act="mail-test"]');
    if (sendingBtn) sendingBtn.disabled = true;
    toast('正在发送…');
    try {
      const r = await cloudApi('mail_test', v);
      mailTestResult = { ok: true, msg: '测试邮件已发出，收件人：' + ((r && r.to) || mailRecipient || '你的账号邮箱') };
      toast('发出去了，看看邮箱');
    } catch (e) {
      const msg = e && e.message ? e.message : '发送失败';
      mailTestResult = { ok: false, msg: msg };
      toast(msg);
    } finally {
      mailBusy = false;
      /* 只更新表单里的结果条，不整页 render —— 否则用户刚填的内容会丢 */
      const box = document.getElementById('mail-result');
      if (box) {
        box.hidden = false;
        box.className = 'mail-result ' + (mailTestResult && mailTestResult.ok ? 'ok' : 'bad');
        box.textContent = mailTestResult ? mailTestResult.msg : '';
      }
      const btn = document.querySelector('[data-act="mail-test"]');
      if (btn) btn.disabled = false;
    }
  }

  async function siteMailLoad() {
    if (siteMailLoading || siteMailCfg !== undefined) return;
    if (mode === 'landing' || !cloud.user || !cloud.user.is_admin) return;
    siteMailLoading = true;
    try {
      const r = await cloudApi('site_mail_status');
      siteMailCfg = (r && r.config && typeof r.config === 'object') ? r.config : null;
      siteMailReady = !!(r && r.ready);
    } catch (e) {
      siteMailCfg = null;
    }
    siteMailLoading = false;
  }

  function siteMailPanelHtml() {
    if (!cloud.user || !cloud.user.is_admin) return '';
    const head = '<div class="panel"><h3>站点邮件<span class="muted-sm" style="margin-left:8px">管理员</span></h3>';
    if (siteMailCfg === undefined) {
      return head + '<p class="muted-sm">正在读取…</p></div>';
    }
    if (siteMailCfg === null) {
      return head + '<p class="muted-sm">读不到配置，或者需要管理员权限。</p></div>';
    }
    const c = siteMailCfg;
    const val = function (k, d) { return c && c[k] !== undefined && c[k] !== null ? String(c[k]) : String(d || ''); };
    const secured = [
      ['ssl', 'SSL/TLS（QQ 465）'],
      ['tls', 'STARTTLS（QQ 587）'],
      ['none', '不加密（不推荐）']
    ];
    const secHtml = secured.map(function (o) {
      return '<option value="' + o[0] + '"' + (val('secure', 'ssl') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
    return head +
      '<p class="muted-sm" style="margin:0 0 10px">这个邮箱<b>只用两件事</b>：注册确认、找回密码。' +
      '<b>提醒通知不会走它</b>——那些由每个用户自己绑定的邮箱发出，站点邮箱不当中继。</p>' +
      '<p class="muted-sm" style="margin:0 0 10px">当前状态：' +
        (siteMailReady ? '<b style="color:var(--good)">已就绪</b>' : '<b style="color:var(--bad)">未配置完整</b>') +
      '</p>' +
      '<div class="form-grid mail-grid">' +
        '<label class="field"><span>SMTP 服务器</span>' +
          '<input id="sm-host" value="' + val('host', 'smtp.qq.com') + '" spellcheck="false" placeholder="smtp.qq.com"></label>' +
        '<label class="field"><span>端口</span>' +
          '<input id="sm-port" type="number" min="1" max="65535" value="' + val('port', 465) + '"></label>' +
        '<label class="field"><span>安全协议</span><select id="sm-secure">' + secHtml + '</select></label>' +
        '<label class="field"><span>用户名（完整邮箱）</span>' +
          '<input id="sm-user" type="email" value="' + val('user', '') + '" spellcheck="false" placeholder="mingxu-todo@foxmail.com"></label>' +
        '<label class="field"><span>发件人（须与用户名一致）</span>' +
          '<input id="sm-from" type="email" value="' + val('from', '') + '" spellcheck="false"></label>' +
        '<label class="field"><span>称呼</span>' +
          '<input id="sm-name" value="' + val('name', '明序') + '" maxlength="60"></label>' +
        '<label class="field wide"><span>授权码' + (c.hasSecret ? '（已保存，留空不修改）' : '') + '</span>' +
          '<input id="sm-secret" type="password" autocomplete="new-password" placeholder="' +
            (c.hasSecret ? '已保存 · 留空不改动' : '16 位授权码') + '">' +
          (c.hasSecret ? '<span class="mail-saved-hint">✓ 授权码已保存（加密存放，不回显）</span>' : '') +
        '</label>' +
      '</div>' +
      '<div id="sm-result" class="mail-result" hidden></div>' +
      '<div class="btn-row">' +
        '<button type="button" class="btn primary" data-act="site-mail-save">保存</button>' +
        '<button type="button" class="btn" data-act="site-mail-test">发一封测试</button>' +
      '</div>' +
      '<p class="ics-hint">发件人会显示成「称呼 &lt;邮箱&gt;」。测试信只发到管理员自己的邮箱。</p>' +
      '</div>';
  }

  async function siteMailSave() {
    const g = function (id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    };
    const body = {
      host: g('sm-host'), port: Number(g('sm-port')) || 465, secure: g('sm-secure'),
      user: g('sm-user'), from: g('sm-from'), name: g('sm-name'), secret: g('sm-secret')
    };
    const box = document.getElementById('sm-result');
    if (box) { box.hidden = true; box.textContent = ''; }
    try {
      const r = await cloudApi('site_mail_save', body);
      if (r && r.config) siteMailCfg = r.config;
      siteMailReady = !!(r && r.ready);
      toast('站点邮件已保存');
      render();
    } catch (e) {
      if (box) { box.hidden = false; box.className = 'mail-result bad'; box.textContent = e.message || '保存失败'; }
      else toast(e.message || '保存失败');
    }
  }

  async function siteMailTest() {
    const box = document.getElementById('sm-result');
    if (box) { box.hidden = false; box.className = 'mail-result'; box.textContent = '正在发送…'; }
    try {
      const r = await cloudApi('site_mail_test', {});
      if (box) { box.hidden = false; box.className = 'mail-result ok'; box.textContent = '已发出，收件人 ' + ((r && r.to) || '管理员'); }
    } catch (e) {
      if (box) { box.hidden = false; box.className = 'mail-result bad'; box.textContent = e.message || '发送失败'; }
    }
  }

  async function notifyLoad() {
    if (notifyLoading || notifyPrefs !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    notifyLoading = true;
    try {
      const r = await cloudApi('notify_prefs');
      notifyPrefs = (r && r.prefs && typeof r.prefs === 'object') ? r.prefs : null;
      notifyMeta = { kinds: (r && r.kinds) || {}, channels: (r && r.channels) || {} };
      notifyQuiet = !!(r && r.quiet);
      if (r && r.report && typeof r.report === 'object') {
        notifyReport = {
          morning: String(r.report.morning ?? ''),
          noon: String(r.report.noon ?? ''),
          evening: String(r.report.evening ?? '')
        };
      }
    } catch (e) {
      notifyPrefs = null;
      notifyMeta = null;
    }
    notifyLoading = false;
  }

  /* 把矩阵翻译成一句人话：用户不该靠推理知道「谁会收到什么」 */
  function notifySummary() {
    if (!notifyPrefs || !notifyMeta) return '';
    const kinds = notifyMeta.kinds || {};
    const both = [];
    const wecomOnly = [];
    const mailOnly = [];
    const none = [];
    Object.keys(kinds).forEach(function (k) {
      const w = !!(notifyPrefs[k] && notifyPrefs[k].wecom);
      const m = !!(notifyPrefs[k] && notifyPrefs[k].mail);
      if (w && m) both.push(kinds[k]);
      else if (w) wecomOnly.push(kinds[k]);
      else if (m) mailOnly.push(kinds[k]);
      else none.push(kinds[k]);
    });
    if (none.length === Object.keys(kinds).length) {
      return '全部关闭，不会收到任何提醒。';
    }
    const parts = [];
    if (both.length) parts.push(both.join('、') + ' 发到企业微信和邮箱');
    if (wecomOnly.length) parts.push(wecomOnly.join('、') + ' 只发企业微信');
    if (mailOnly.length) parts.push(mailOnly.join('、') + ' 只发邮箱');
    if (none.length) parts.push(none.join('、') + ' 不提醒');
    return parts.length ? parts.join('；') + '。' : '全部关闭，不会收到任何提醒。';
  }

  function notifyMatrixHtml() {
    if (!cloud.user) return '';
    const head = '<div class="panel"><h3>通知通道矩阵</h3>';
    if (notifyPrefs === undefined) {
      return head + '<p class="muted-sm">正在读取…</p></div>';
    }
    if (notifyPrefs === null || !notifyMeta) {
      return head + '<p class="muted-sm">读不到配置。可能没登录，或者服务器上的 `api/push.php` 还没更新。</p></div>';
    }
    const kinds = notifyMeta.kinds || {};
    const chs = notifyMeta.channels || {};
    const chKeys = Object.keys(chs);
    const headRow = '<tr><th scope="col">提醒类型</th>' +
      chKeys.map(function (c) { return '<th scope="col">' + esc(chs[c]) + '</th>'; }).join('') + '</tr>';
    const bodyRows = Object.keys(kinds).map(function (k) {
      const cells = chKeys.map(function (c) {

  async function notifySave() {
    if (!notifyPrefs) return;
    const prefs = {};
    document.querySelectorAll('.mx-table input[data-kind]').forEach(function (el) {
      const k = el.getAttribute('data-kind');
      const c = el.getAttribute('data-chan');
      prefs[k] = prefs[k] || {};
      prefs[k][c] = !!el.checked;
    });
    const qEl = document.getElementById('mx-quiet');
    const quiet = !!(qEl && qEl.checked);
    const readT = function (id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    };
    const report = {
      morning: readT('mx-rep-morning'),
      noon: readT('mx-rep-noon'),
      evening: readT('mx-rep-evening')
    };
    try {
      const r = await cloudApi('notify_prefs_save', { prefs: prefs, quiet: quiet, report: report });
      if (r && r.prefs) notifyPrefs = r.prefs;
      if (r && r.report) notifyReport = r.report;
      notifyQuiet = !!(r && r.quiet);
      toast('通知设置已保存');
      render();
    } catch (e) {
      toast(e.message || '保存失败');
    }
  }

  /* 一条通知的「什么时候」文案。单次过了日期直接标已过期——
     发没发过前端不知道（那是后端的 push_sent），但日期过了就是过去了。 */
  /* 单次通知「日期 + 时刻」已经过去 = 不会再发了。
     为什么判到分钟、不只比日期：今天 11:40 那条，到了 12:13 就已经发完了，
     只比日期会让它整天都显示成「还有效」，列表上一眼看不出哪条是活着的。 */
  function noticePast(n) {
    if (!n || n.mode !== 'once') return false;
    const d = String(n.date || '');
    const t = String(n.time || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)) return false;
    const at = Math.round(parseD(d).getTime() / 1000) +
      (Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5))) * 60;
    return at <= Math.round(Date.now() / 1000);
  }
  function noticeWhenText(n) {
    const t = n.time;
    if (n.mode === 'once') {
      const d = n.date || '未设日期';
      return d + ' ' + t + ' · 单次' + (noticePast(n) ? ' · 已过期' : '');
    }
    if (n.mode === 'weekly') {
      const ws = (n.weeks || []).slice().sort();
      if (!ws.length) return '每周 · 还没选星期';
      return '每周' + ws.map(function (w) { return WEEK_CN[w]; }).join('、') + ' ' + t;
    }
    if (n.mode === 'monthly') {
      return '每月 ' + n.monthday + ' 号 ' + t +
        (n.monthday > 28 ? '（小月按月末那天发）' : '');
    }
    return '每天 ' + t;
  }

  function noticeModal(n) {

    const cur = n || { text: '', time: '20:00', mode: 'daily', date: todayStr(), weeks: [], monthday: 1, on: true };
    const wks = (cur.weeks || []).slice();
    /* 周一到周日排（WEEK_CN 的 0 是周日，放到最后更符合中文习惯） */
    const wkHtml = [1, 2, 3, 4, 5, 6, 0].map(function (w) {
      return '<button type="button" class="' + (wks.indexOf(w) >= 0 ? 'on' : '') +
        '" data-act="notice-wk" data-w="' + w + '">' + WEEK_CN[w] + '</button>';
    }).join('');
    const modes = [
      ['daily', '每天'], ['weekly', '每周（可多选）'], ['monthly', '每月'], ['once', '单次']
    ];
    openModal('<form class="modal-card" id="notice-form" data-id="' + esc(cur.id || '') + '">' +
      '<h3>' + (isNew ? '新增自定义通知' : '编辑通知') + '</h3>' +
      '<div class="form-grid">' +
        '<label class="field" style="grid-column:1/-1"><span>通知内容</span>' +
          '<textarea name="text" rows="4" placeholder="例如：该吃维生素了">' + esc(cur.text || '') + '</textarea>' +
          '<em class="nt-count" id="nt-count"></em></label>' +
        '<label class="field"><span>发送时间</span>' +
          '<input type="time" name="time" value="' + esc(cur.time || '20:00') + '"></label>' +
        '<label class="field"><span>重复方式</span><select name="mode" id="notice-mode">' +
          modes.map(function (m) {
            return '<option value="' + m[0] + '"' + (cur.mode === m[0] ? ' selected' : '') + '>' + m[1] + '</option>';
          }).join('') +
        '</select></label>' +
        '<label class="field" id="nf-date"><span>哪天</span>' +
          '<input type="date" name="date" value="' + esc(cur.date || todayStr()) + '"></label>' +
        '<label class="field" id="nf-md"><span>每月几号</span>' +
          '<input type="number" name="monthday" min="1" max="31" value="' + (cur.monthday || 1) + '"></label>' +
        '<div class="field" id="nf-weeks" style="grid-column:1/-1"><span>星期几</span>' +
          '<div class="wk-pick" id="wk-pick">' + wkHtml + '</div></div>' +
      '</div>' +
      '<div class="notice-warn">同一分钟超过 20 条企业微信会静默丢弃，多条通知请把时间错开 5 分钟以上。</div>' +

        '<button type="button" class="btn ghost" data-act="close-modal">取消</button>' +
        '<button type="submit" class="btn primary">保存</button></div>' +
    '</form>');

    const form = document.getElementById('notice-form');

  function saveNoticeForm(form) {
    const id = form.dataset.id || '';
    const text = String((form.querySelector('[name="text"]') || {}).value || '').trim();
    if (!text) { toast('先写点内容'); return; }
    if (text.length > 500) { toast('内容超过 500 字，精简一下再存'); return; }
    const time = String((form.querySelector('[name="time"]') || {}).value || '');
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) { toast('请选一个发送时间'); return; }
    const mode = (form.querySelector('[name="mode"]') || {}).value || 'daily';
    const date = String((form.querySelector('[name="date"]') || {}).value || '');
    const monthday = parseInt((form.querySelector('[name="monthday"]') || {}).value, 10) || 1;
    const picked = [].slice.call(form.querySelectorAll('#wk-pick button.on'))
      .map(function (b) { return Number(b.dataset.w); })
      .filter(function (w) { return w >= 0 && w <= 6; });
    if (mode === 'once' && !/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('单次通知要选一天'); return; }
    if (mode === 'weekly' && !picked.length) { toast('至少选一个星期几'); return; }

    if (!Array.isArray(state.notices)) state.notices = [];
    const cur = id ? state.notices.find(function (x) { return x.id === id; }) : null;
    const rec = cur || { id: uid(), on: true };
    rec.text = text;
    rec.time = time;
    rec.mode = mode;
    rec.date = mode === 'once' ? date : '';
    rec.weeks = mode === 'weekly' ? picked.sort() : [];
    rec.monthday = clamp(monthday, 1, 31);
    if (!cur) state.notices.push(rec);
    save();
    render();
    closeModal();
    toast(id ? '通知已更新' : '通知已添加');
  }

  /* 导航顺序的清洗：只留字符串 + 去重。
     **刻意不在这里过滤「NAV 里有没有这个 key」** —— NAV 是下面才声明的 const，
     状态初始化时它还在 TDZ 里，引用会直接报错。未知 key 交给 orderedNav() 在渲染时忽略。 */
  function normalizeNavOrder(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (k) {
      const v = String(k || '');
      if (!v || seen[v]) return;
      seen[v] = 1;
      out.push(v);
    });
    return out.slice(0, 32);
  }

  /* 实际导航顺序：NAV 常量只管「有哪些页 + 默认顺序」，顺序全部由这里算。
     跟 PINNED_IDS / orderedPinnedIds 是同一个分工——常量管集合，顺序单独算。 */
  const NAV_GROUPS = ['记录', '回顾'];
  function orderedNav() {
    const pref = Array.isArray(state.navOrder) ? state.navOrder : [];
    const rank = function (k) {
      const i = pref.indexOf(k);
      return i < 0 ? 1e4 + NAV.findIndex(function (n) { return n.key === k; }) : i;
    };
    return NAV.slice().sort(function (a, b) {
      /* 组间固定：记录在前、回顾在后。UI 只给组内上下调，
         但导入的备份不一定规整，这里兜一层。 */
      const ga = NAV_GROUPS.indexOf(a.group);
      const gb = NAV_GROUPS.indexOf(b.group);
      if (ga !== gb) return ga - gb;
      return rank(a.key) - rank(b.key);
    });
  }

  function clearDropMarks() {

  }

  function cnDate(ds) {
    if (!ds) return '';
    /* parseD 只认 'YYYY-MM-DD'，把 ISO 串（createdAt / archivedAt 都是 ISO）
       塞进去会得到 NaN月NaN日。非纯日期的一律交给 Date 解析，按本地时区算。 */
    const raw = String(ds);
    const d = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? parseD(raw) : new Date(raw);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  let archDropAt = 0;

  /* 归档任务的只读详情（v108）。归档行里已经有完成时间/优先级/标签/截止，
     唯独备注全文没地方放——这里补上，其余字段也一并列清楚，免得还要去恢复才能看。 */
  function taskArchViewModal(id) {

    const note = String(t.note || '').trim();
    const rows = [];
    const push = function (k, v) { if (v) rows.push([k, v]); };
    push('优先级', t.priority || '中');
    push('标签', t.tag || '');
    push('截止日期', t.due ? cnDate(t.due) : '');
    push('完成时间', t.doneAt ? cnDate(t.doneAt) : '');
    push('创建时间', t.createdAt ? cnDate(t.createdAt) : '');
    push('归档时间', t.archivedAt ? cnDate(t.archivedAt) : '');
    if (t.repeat && t.repeat !== 'none') {
      const cn = { daily: '每天', weekly: '每周', monthly: '每月' }[t.repeat] || '';
      push('重复', cn + (t.repeatTime ? ' · ' + t.repeatTime : ''));
    }
    if (t.startTime) push('时间块', t.startTime + (t.duration ? ' · ' + t.duration + ' 分钟' : ''));
    push('提醒', t.notify === false ? '已关闭' : (t.notifyTime || '09:00'));
