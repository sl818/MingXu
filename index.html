  function bindBoard() {
    $$('.task').forEach(card => {
      card.addEventListener('dragstart', e => {
        dragId = card.dataset.id;
        card.classList.add('dragging');
        document.body.classList.add('is-dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
        }
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragId = null;
        document.body.classList.remove('is-dragging');
        const z = $('.arch-zone');
        if (z) z.classList.remove('is-over');
        clearDropMarks();
      });
      /* v127：单击直接开编辑弹窗。原来要双击展开内联详情、再点铅笔编辑，两步；
         备注、子任务、时间都已经在弹窗里，内联详情没有独占内容了。 */
      card.addEventListener('click', e => {
        if (e.target.closest('button')) return;
        if (dragId) return;
        const id = card.dataset.id;
        const item = state.tasks.find(x => x.id === id);
        if (item) taskModal(item);
      });
      card.addEventListener('dragover', e => {
        if (!dragId) return;
        e.preventDefault();
        e.stopPropagation();
        clearDropMarks();
        const rect = card.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        card.classList.add(after ? 'drop-after' : 'drop-before');
      });
      card.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if (!id) return;
        const after = card.classList.contains('drop-after');
        clearDropMarks();
        reorderTask(id, card.closest('.col').dataset.status, card.dataset.id, after);
      });
    });

    const zone = $('.arch-zone');
    if (zone) {
      zone.addEventListener('dragover', e => {
        if (!dragId) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        zone.classList.add('is-over');
      });
      zone.addEventListener('dragleave', e => {
        if (e.relatedTarget && zone.contains(e.relatedTarget)) return;
        zone.classList.remove('is-over');
      });
      zone.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove('is-over');
        const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if (id) {
          archDropAt = Date.now();
          archiveTask(id);
        }
      });
      zone.addEventListener('click', () => {
        if (Date.now() - archDropAt < 500) return;
        archiveModal();
      });
    }

    $$('.col-body').forEach(body => {
      body.addEventListener('dragover', e => { if (dragId) e.preventDefault(); });
      body.addEventListener('drop', e => {
        if (!dragId) return;
        e.preventDefault();
        const status = body.closest('.col').dataset.status;
        clearDropMarks();
        reorderTask(dragId, status, null, false);
      });
    });
  }

  function reorderTask(id, status, beforeId, after) {
    if (!id || id === beforeId) return;
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx < 0) return;
    const task = state.tasks[idx];
    const changed = task.status !== status;
    const wasDone = task.status === 'done';
    state.tasks.splice(idx, 1);
    if (changed) task.prevStatus = task.status;
    task.status = status;
    if (status === 'done') {
      if (!task.doneAt || changed) task.doneAt = todayStr();
      if (changed && !wasDone) completeRecurringTask(task, task.doneAt);
    } else {
      task.doneAt = null;
      if (changed && wasDone) uncompleteRecurringTask(task);
    }
    let insertAt = state.tasks.length;
    if (beforeId) {
      const ti = state.tasks.findIndex(t => t.id === beforeId);
      if (ti >= 0) insertAt = after ? ti + 1 : ti;
    }
    state.tasks.splice(insertAt, 0, task);
    save();
    render();
    if (changed && status === 'done') toast('完成 ✓');
  }

  function breathingStart() {
    if (!$('#breathing-modal')) {
      openBreathingModal();
      return;
    }
    stopBreathing();
    const orb = $('#breathing-orb');
    const phase = $('#breathing-phase');
    const timer = $('#breathing-timer');
    const btn = $('#breathing-start-btn');
    if (!orb || !phase || !timer) return;
    const hb = state.habits.find(x => x.id === 'h_breathe');
    const totalCycles = Math.max(1, Math.min(8, Number(hb && hb.breatheCycles) || 4));
    if (btn) {
      btn.textContent = '进行中';
      btn.disabled = true;
    }
    const phases = [
      { key: 'inhale', label: '吸气', seconds: 4 },
      { key: 'hold', label: '屏息', seconds: 7 },
      { key: 'exhale', label: '呼气', seconds: 8 }
    ];
    let index = 0;
    let cycle = 1;
    const showTimer = left => {
      timer.textContent = '第 ' + cycle + ' / ' + totalCycles + ' 次 · ' + Math.max(0, left) + ' 秒';
    };

    const finish = () => {
      orb.className = 'breathing-orb done';
      phase.textContent = '完成 · ' + totalCycles + ' 次循环';
      timer.textContent = '这一组记下了';
      if (btn) {
        btn.textContent = '再来一组';
        btn.disabled = false;
      }
      const h = state.habits.find(x => x.id === 'h_breathe');
      if (h) {
        logHabit(h.id, 1);
        setCount(selectedDate, h.id, countOf(selectedDate, h.id) + 1);
        render();
        toast('478 呼吸 · 一组完成');
      }
    };

    const run = () => {
      if (!$('#breathing-modal')) return;
      const p = phases[index];
      if (index === 0) {
        orb.className = 'breathing-orb';
        void orb.offsetWidth;
      }
      orb.className = 'breathing-orb ' + p.key;
      phase.textContent = p.label;
      let left = p.seconds;
      showTimer(left);
      breathingTimer = setInterval(() => {
        left--;
        showTimer(left);
        if (left <= 0) {
          clearInterval(breathingTimer);
          breathingTimer = null;
          index++;
          if (index >= phases.length) {
            index = 0;
            cycle++;
            if (cycle > totalCycles) { finish(); return; }
          }
          breathingPhaseTimer = setTimeout(run, 250);
        }
      }, 1000);
    };

    run();
  }

  /* 打开弹窗前后的焦点归属：关闭时归还，键盘用户不丢位置 */
  let modalTrigger = null;

  function openModal(html) {
    /* 记住是谁打开的，关闭时把焦点还回去——键盘用户不会丢失位置 */
    modalTrigger = (document.activeElement && document.activeElement !== document.body)
      ? document.activeElement : null;
    const root = $('#modal-root');
    root.innerHTML = '<div class="modal-backdrop">' + html + '</div>';
    document.body.classList.add('modal-open');
    const backdrop = $('.modal-backdrop', root);
    if (backdrop) {
      backdrop.addEventListener('mousedown', e => {
        if (e.target === backdrop) closeModal();
      });
    }
    bindHabitForm();
    bindTaskForm();
    bindMedForm();
    bindWeightForm();
    const first = root.querySelector('input:not([type="hidden"]), textarea, select');
    if (first) setTimeout(() => { try { first.focus(); } catch (e) {} }, 40);
  }
  function closeModal() {
    stopBreathing();
    $('#modal-root').innerHTML = '';
    document.body.classList.remove('modal-open');
    const back = modalTrigger;
    modalTrigger = null;
    if (back && document.contains(back)) {
      try { back.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  function bindTaskForm() {
    const form = $('#task-form');
    if (!form) return;
    const repeat = form.querySelector('[name="repeat"]');
    if (!repeat) return;
    const sync = () => {
      form.querySelectorAll('[data-repeat-field]').forEach(field => {
        const kind = field.dataset.repeatFor || '';
        const show = kind === 'time'
          ? repeat.value !== 'none'
          : kind === repeat.value;
        field.style.display = show ? '' : 'none';
      });
    };
    repeat.addEventListener('change', sync);
    sync();
    /* 填了「开始时间」但没手动动过通知时间时，通知时间自动跟着走：
       下午的事不会在早上 9 点响，同时保留了手动提前提醒的余地
       （一旦手动改过通知时间，就不再自动同步）。 */
    const stEl = form.querySelector('[name="startTime"]');
    const ntEl = form.querySelector('[name="notifyTime"]');
    if (stEl && ntEl) {
      let touched = false;
      ntEl.addEventListener('input', () => { touched = true; });
      stEl.addEventListener('input', () => {
        if (touched || !stEl.value) return;
        ntEl.value = stEl.value;
      });
    }
  }

  function bindHabitForm() {
    const form = $('#habit-form');
    if (!form) return;
    const type = form.querySelector('[name="type"]');
    const target = form.querySelector('[name="target"]');
    if (!type || !target) return;
    const sync = () => {
      const tv = type.value;
      const isQuit = tv === 'quit' || tv === 'smoke';
      const isSmokeType = tv === 'smoke';
      if (isQuit) {
        target.disabled = true;
        target.value = '1';
      } else {
        target.disabled = false;
        if (!target.value || Number(target.value) < 1) target.value = '1';
      }
      /* 戒除专属区（开始日期 + 烟字段）只在「戒除 / 戒烟」时出现 */
      form.querySelectorAll('[data-quit-only]').forEach(el => { el.hidden = !isQuit; });
      /* 烟专属字段（每天几支 / 烟价 / 一包几支）只在戒烟时出现。
         「不熬夜」出现「一包多少钱」会让人莫名其妙。 */
      form.querySelectorAll('[data-smoke-only]').forEach(el => { el.hidden = !isSmokeType; });
      /* 「打卡方式」只给通用戒除：戒烟走双按钮，不适用单次/多次 */
      form.querySelectorAll('[data-quit-plain]').forEach(el => { el.hidden = tv !== 'quit'; });
      /* 提示文案按「戒烟 / 单次戒除 / 多次戒除」三选一，切下拉时要跟着变 */
      const slipSel = form.querySelector('[name="slipMode"]');
      const isMulti = tv === 'quit' && !!slipSel && slipSel.value === 'multi';
      form.querySelectorAll('[data-quit-hint]').forEach(el => {
        const kind = el.dataset.quitHint;
        if (kind === 'smoke') { el.hidden = !isSmokeType; return; }
        if (tv !== 'quit') { el.hidden = true; return; }
        el.hidden = (el.dataset.slip || 'once') !== (isMulti ? 'multi' : 'once');
      });
      /* 「目标次数 / 单位」对戒除没意义，disabled 留着只会让人以为坏了 */
      ['target', 'unit'].forEach(function (nm) {
        const el = form.querySelector('[name="' + nm + '"]');
        const f = el && el.closest('.field');
        if (f) f.hidden = isQuit;
      });
    };
    type.addEventListener('change', sync);
    /* 只改「打卡方式」不改类型时，提示文案也要跟着换 */
    const slipPicker = form.querySelector('[name="slipMode"]');
    if (slipPicker) slipPicker.addEventListener('change', sync);
    sync();
    /* 通知频率联动：weekly 显示「每周几」，monthly 显示「每月几号」 */
    const freq = form.querySelector('[name="notifyFreq"]');
    if (freq) {
      const syncFreq = () => {
        form.querySelectorAll('[data-habit-freq]').forEach(field => {
          const kind = field.dataset.habitFor || '';
          field.style.display = kind === freq.value ? '' : 'none';
        });
      };
      freq.addEventListener('change', syncFreq);
      syncFreq();
    }
  }

  /* ===== 子任务（v127）=====
     存在 task.subtasks 里：[{id, title, done}]。父任务的状态和截止日期**不跟着子任务自动变**，
     只做进度展示——自动改状态会让人意外（勾完四个子任务，主任务突然消失）。 */
  function taskSubs(t) {
    const arr = t && Array.isArray(t.subtasks) ? t.subtasks : [];
    return arr.filter(function (x) { return x && typeof x === 'object'; });
  }

  function taskSubsHtml(t) {
    return taskSubs(t).map(function (x) {
      return '<div class="tk-sub' + (x.done ? ' done' : '') + '" data-sid="' + esc(x.id || '') + '">' +
        '<input type="checkbox"' + (x.done ? ' checked' : '') + '>' +
        '<span>' + esc(x.title || '') + '</span>' +
        '<button type="button" class="tk-sub-del" aria-label="删除子任务">✕</button>' +
        '</div>';
    }).join('');
  }

  /* 折叠区里有内容就默认展开，否则用户会以为没设过 */
  function taskFoldOpen(t) {
    if (!t) return false;
    if (t.startTime || Number(t.duration) > 0) return true;
    if (t.repeat && t.repeat !== 'none') return true;
    if (t.notify === false || (t.notifyNote || '') !== '') return true;
    return false;
  }

  function taskSubCount(form) {
    const box = form.querySelector('[data-sub-count]');
    if (!box) return;
    const rows = form.querySelectorAll('.tk-sub');
    let done = 0;
    rows.forEach(function (r) {
      const cb = r.querySelector('input');
      if (cb && cb.checked) done++;
    });
    box.textContent = done + '/' + rows.length;
  }

  function bindTaskSubs(form) {
    if (!form) return;
    const list = form.querySelector('[data-sub-list]');
    const input = form.querySelector('[data-sub-input]');
    if (!list || !input) return;
    const refresh = function () {
      list.querySelectorAll('.tk-sub').forEach(function (row) {
        const cb = row.querySelector('input');
        if (cb) {
          cb.onchange = function () {
            row.classList.toggle('done', cb.checked);
            taskSubCount(form);
          };
        }
        const del = row.querySelector('.tk-sub-del');
        if (del) {
          del.onclick = function () {
            row.remove();
            taskSubCount(form);
          };
        }
      });
      taskSubCount(form);
    };
    input.onkeydown = function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      const div = document.createElement('div');
      div.className = 'tk-sub';
      div.setAttribute('data-sid', '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      const sp = document.createElement('span');
      sp.textContent = v;
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'tk-sub-del';
      del.setAttribute('aria-label', '删除子任务');
      del.textContent = '✕';
      div.appendChild(cb);
      div.appendChild(sp);
      div.appendChild(del);
      list.appendChild(div);
      input.value = '';
      refresh();
    };
    refresh();
  }

  function bindMedForm() {
    const form = $('#med-form');
    if (!form) return;
    const course = form.querySelector('[name="courseType"]');
    const countSel = form.querySelector('[name="doseTimes"]');
    const slots = form.querySelector('#time-slots');
    const formSel = form.querySelector('[name="form"]');
    const unitSel = form.querySelector('[name="doseUnit"]');
    if (!course) return;
    const syncUnit = () => {
      if (!formSel || !unitSel) return;
      const v = formSel.value;
      if (Array.prototype.some.call(unitSel.options, o => o.value === v)) unitSel.value = v;
    };
    const readSlots = () => {
      if (!slots) return [];
      return Array.prototype.map.call(slots.querySelectorAll('input'), el => el.value);
    };
    const renderSlots = (n, keep) => {
      if (!slots) return;
      slots.innerHTML = timeSlotsHtml(keep ? readSlots() : [], n);
    };
    const mealSel = form.querySelector('[name="mealTiming"]');
    const offSel = form.querySelector('[name="mealOffset"]');
    const syncTiming = () => {
      const prn = course.value === 'prn';
      const hasMeal = !!mealSel && (mealSel.value === 'before' || mealSel.value === 'after');
      const custom = hasMeal && !!offSel && offSel.value === 'custom';
      form.querySelectorAll('[data-timing]').forEach(el => {
        let show = !prn;
        if (show && el.hasAttribute('data-off')) show = hasMeal;
        if (show && el.hasAttribute('data-off-custom')) show = custom;
        el.style.display = show ? '' : 'none';
      });
    };
    const onMealChange = () => {
      syncTiming();
      const offCustom = form.querySelector('[data-off-custom]');
      if (offCustom && offCustom.style.display !== 'none' && offSel && offSel.value === 'custom') {
        const inp = offCustom.querySelector('input');
        if (inp && !inp.value) inp.focus();
      }
    };
    if (mealSel) mealSel.addEventListener('change', onMealChange);
    if (offSel) offSel.addEventListener('change', onMealChange);
    const sync = () => {
      const c = course.value;
      form.querySelectorAll('[data-course]').forEach(el => {
        el.style.display = el.dataset.course === c ? '' : 'none';
      });
      syncTiming();
    };
    course.addEventListener('change', sync);
    if (countSel) countSel.addEventListener('change', () => renderSlots(Number(countSel.value) || 1, true));
    if (formSel) formSel.addEventListener('change', syncUnit);
    syncUnit();
    sync();
  }

    state.bodyProfile = {
      age: Math.round(age),

    };

  function saveWeightForm(form) {
    const get = n => {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const error = form.querySelector('.form-error');
    const date = get('date');
    const weight = Number(get('weight'));
    const fatRaw = get('fat');
    const fat = Number(fatRaw);
    const profile = normalizeBodyProfile(state.bodyProfile);
    const fail = msg => { if (error) error.textContent = msg; };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > todayStr()) return fail('请选择今天或之前的日期。');
    if (!profile.age || !profile.height) return fail('请先补充身体档案（年龄和身高）。');
    if (!isFinite(weight) || weight < 1 || weight > 500) return fail('体重请填 1–500 kg。');
    if (fatRaw !== '' && (!isFinite(fat) || fat < 1 || fat > 70)) return fail('体脂率请填 1–70%，没有就留空。');
    const bmi = calcBmi(weight, profile.height);
    const id = form.dataset.id || '';
    const list = Array.isArray(state.weights) ? state.weights : (state.weights = []);
    let rec = id ? list.find(w => w.id === id) : null;
    let isUpdate = !!rec;
    if (!rec) {
      rec = list.find(w => w.date === date);
      isUpdate = !!rec;
    }
    if (!rec) {
      rec = { id: 'w_' + uid(), date: date, createdAt: new Date().toISOString() };
      list.push(rec);
    }
    rec.date = date;
    rec.age = profile.age;
    rec.height = profile.height;
    rec.weight = Math.round(weight * 10) / 10;
    rec.bmi = bmi;
    /* 留空 = 0，表示这次没有量体脂；不要写 null，normalize 里也要能兜住 */
    rec.fat = (fatRaw !== '' && isFinite(fat) && fat >= 1 && fat <= 70) ? Math.round(fat * 10) / 10 : 0;
    save();
    closeModal();
    render();
    toast(isUpdate ? '体重已更新' : '体重已记录');
  }

          '<li><b>统计</b>：连续天数、完成率、体重趋势和每次打卡的时间记录。</li>' +
          '<li><b>设置</b>：主题、账号同步、数据备份。</li>' +
          '<li><b>账号</b>：邀请码注册；登录后数据同步到你的服务器，未登录只能看到介绍页。</li>' +

      '</div>');
  }

  /* ============================================================
     动作
     ============================================================ */
  function currentHabit(id) {
    return state.habits.find(h => h.id === id);
  }

  function saveTaskForm(form) {
    const id = form.dataset.id || '';
    const get = n => {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const title = get('title');
    if (!title) return;
    const repeatTimeRaw = get('repeatTime');
    const repeatTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(repeatTimeRaw) ? repeatTimeRaw : '20:00';
    const notifyTimeRaw = get('notifyTime');
    const notifyTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(notifyTimeRaw) ? notifyTimeRaw : '09:00';
    const startTimeRaw = get('startTime');
    const startTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(startTimeRaw) ? startTimeRaw : '';
    const durRaw = parseInt(get('duration'), 10);
    const duration = (Number.isFinite(durRaw) && durRaw >= 15 && durRaw <= 720)
      ? Math.round(durRaw / 15) * 15 : 0;
    const repeatRaw = get('repeat');
    const repeat = ['daily', 'weekly', 'monthly'].indexOf(repeatRaw) >= 0 ? repeatRaw : 'none';
    const due = get('due') || (repeat !== 'none' ? todayStr() : '');
    const dueD = due && /^\d{4}-\d{2}-\d{2}$/.test(due) ? parseD(due) : new Date();
    const wdVal = parseInt(get('repeatWeekday'), 10);
    const rdVal = parseInt(get('repeatDay'), 10);
    const repeatWeekday = Number.isFinite(wdVal) ? clamp(wdVal, 0, 6) : dueD.getDay();
    const repeatDay = Number.isFinite(rdVal) ? clamp(rdVal, 1, 31) : dueD.getDate();
    /* 子任务从 DOM 收：新增的行没有 id，这里补一个；保存时整组替换 */
    const subRows = Array.from(form.querySelectorAll('.tk-sub')).map(function (row, i) {
      const cb = row.querySelector('input');
      const sp = row.querySelector('span');
      return {
        id: row.getAttribute('data-sid') || ('sub_' + Date.now().toString(36) + '_' + i),
        title: (sp ? sp.textContent : '').trim(),
        done: !!(cb && cb.checked)
      };
    }).filter(function (x) { return x.title !== ''; });

    const payload = {
      title: title,
      note: get('note'),
      subtasks: subRows,
      status: get('status') || 'todo',
      tag: get('tag') || '其他',
      priority: get('priority') || '中',
      due: due,
      repeat: repeat,
      repeatTime: repeatTime,
      repeatWeekday: repeatWeekday,
      repeatDay: repeatDay,
      notify: get('notify') !== '0',
      notifyTime: notifyTime,
      notifyNote: get('notifyNote'),
      startTime: startTime,
      duration: duration
    };
    if (id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        const wasDone = t.status === 'done';
        if (!wasDone && payload.status === 'done') t.prevStatus = t.status;
        Object.assign(t, payload);
        if (payload.status === 'done' && !wasDone) {
          t.doneAt = todayStr();
          completeRecurringTask(t, t.doneAt);
        }
        if (payload.status !== 'done' && wasDone) {
          t.doneAt = null;
          uncompleteRecurringTask(t);
        }
        if (payload.status !== 'done') t.doneAt = null;
      }
    } else {
      const t = Object.assign({ id: uid(), createdAt: new Date().toISOString(), doneAt: null, repeatNextId: '', repeatFrom: '' }, payload);
      if (t.status === 'done') {
        t.doneAt = todayStr();
        completeRecurringTask(t, t.doneAt);
      }
      state.tasks.unshift(t);
    }
    save();
    closeModal();
    render();
    toast(id ? '任务已更新' : '任务已创建');
  }

  function saveHabitForm(form) {
    const id = form.dataset.id || '';
    const get = n => {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const rawType = get('type');
    const type = (rawType === 'quit' || rawType === 'smoke') ? rawType : 'build';
    const payload = {
      name: get('name'),
      icon: get('icon') || '✅',
      type: type,
      target: type === 'quit' ? 1 : clamp(parseInt(get('target'), 10) || 1, 1, 99),
      unit: get('unit') || '次',
      /* 截止时刻：类型不是保持、或目标 >1 时一律存空，避免出现无意义的组合 */
      deadline: '',
      color: get('color') || '#2f6f5e',
      note: get('note'),
      notify: get('notify') !== '0',
      notifyFreq: get('notifyFreq') || 'daily',
      notifyWeekday: clamp(parseInt(get('notifyWeekday'), 10) || 1, 0, 6),
      notifyMonthday: clamp(parseInt(get('notifyMonthday'), 10) || 1, 1, 31),
      notifyNote: get('notifyNote')
    };
    if (type === 'quit' || type === 'smoke') {
      const qs = get('quitStart');
      payload.quitStart = /^\d{4}-\d{2}-\d{2}$/.test(qs) ? qs : '';
      /* 打卡方式只对通用戒除有意义；戒烟是两个按钮 + 烟盒，没有「单次/多次」之分。
         缺省写 'once' 而不是留空，避免 mergeStates 并集时一端有值一端没有、
         合并后变成 undefined（那就退回单次了）。 */
      payload.slipMode = (type === 'quit' && get('slipMode') === 'multi') ? 'multi' : 'once';
      if (type === 'smoke') {
        payload.quitPerDay = clamp(parseInt(get('quitPerDay'), 10) || 0, 0, 100);
        payload.quitPackPrice = Math.max(0, Math.min(9999, Number(get('quitPackPrice')) || 0));
        payload.quitPackSize = clamp(parseInt(get('quitPackSize'), 10) || 20, 1, 50);
      } else {
        /* 通用戒除不抽烟，把烟字段清零——留着会让省钱折算去算一个不存在的烟 */
        payload.quitPerDay = 0;
        payload.quitPackPrice = 0;
        payload.quitPackSize = 0;
      }
    }
    const dl = get('deadline');
    payload.deadline = (type === 'build' && payload.target <= 1
      && /^([01]\d|2[0-3]):[0-5]\d$/.test(dl)) ? dl : '';
    const st = get('suggestTime');
    payload.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(st) ? st : '15:00';
    if (form.querySelector('[name="breatheCycles"]')) {
      payload.breatheCycles = clamp(parseInt(get('breatheCycles'), 10) || 4, 1, 8);
    }
    if (!payload.name) return;
    if (id) {
      const h = currentHabit(id);
      if (h) Object.assign(h, payload);
    } else {
      payload.id = 'h_' + uid();
      payload.createdAt = new Date().toISOString();
      state.habits.push(payload);
    }
    save();
    closeModal();
    render();
    toast(id ? '习惯已更新' : '习惯已添加');
  }

  function saveMedForm(form) {
    const id = form.dataset.id || '';
    const get = n => {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const name = get('name');
    if (!name) return;
    const courseType = get('courseType') === 'short' ? 'short' : get('courseType') === 'prn' ? 'prn' : 'long';
    let times = [];
    if (courseType !== 'prn') {
      const slotEls = form.querySelectorAll('#time-slots input');
      if (!slotEls.length) {
        alert('请设置每日用药次数');
        return;
      }
      const seen = {};
      for (let i = 0; i < slotEls.length; i++) {
        const v = (slotEls[i].value || '').trim();
        if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) {
          alert('请把第 ' + (i + 1) + ' 次的时间填完整');
          return;
        }
        seen[v] = true;
      }
      times = Object.keys(seen).sort();
      if (!times.length) {
        alert('请至少设置一个服药时间');
        return;
      }
    }
    const startDate = get('startDate') || todayStr();
    const endDate = courseType === 'short' ? get('endDate') : '';
    if (courseType === 'short') {
      if (!endDate) {
        alert('短期疗程请填写结束日期');
        return;
      }
      if (endDate < startDate) {
        alert('结束日期不能早于开始日期');
        return;
      }
    }
    const stockRaw = get('stock');
    const mealTiming = get('mealTiming');
    let mealOffset = '';
    if (mealTiming === 'before' || mealTiming === 'after') {
      const rawOff = get('mealOffset');
      if (rawOff === 'custom') {
        const cv = Number(get('mealOffsetCustom'));
        if (isFinite(cv) && cv >= 0) mealOffset = Math.min(720, Math.round(cv));
      } else if (rawOff !== '') {
        const nv = Number(rawOff);
        if (isFinite(nv) && nv >= 0) mealOffset = Math.min(720, Math.round(nv));
      }
    }
    /* 库存：输入框里是「现在手里有多少」。
       - 留空 → 不跟踪
       - 数字和当前余量相同 → 什么都没变，保留原基线（否则历史扣减会被“洗掉”）
       - 数字不同 → 视为一次重新登记，把此刻设为新基线 */
    const existingMed = id ? medById(id) : null;
    const shownRemain = existingMed ? medStockRemain(existingMed) : null;
    const inputStock = stockRaw === '' ? null : Math.max(0, Number(stockRaw) || 0);
    let stockBase = '';
    let stockBaseAt = '';
    if (inputStock !== null) {
      if (existingMed && shownRemain !== null && Math.abs(inputStock - shownRemain) < 0.001) {
        stockBase = existingMed.stockBase;
        stockBaseAt = existingMed.stockBaseAt;
      } else {
        stockBase = inputStock;
        stockBaseAt = new Date().toISOString();
      }
    }

    const payload = {
      name: name,
      purpose: get('purpose') || '其他',
      form: get('form') || '片',
      strength: get('strength'),
      doseAmount: Math.max(0.01, Number(get('doseAmount')) || 1),
      doseUnit: get('doseUnit') || '片',
      times: times,
      mealTiming: mealTiming,
      mealOffset: mealOffset,
      courseType: courseType,
      startDate: startDate,
      endDate: endDate,
      reviewDate: courseType === 'long' ? get('reviewDate') : '',
      status: get('status') || 'active',
      stockBase: stockBase,
      stockBaseAt: stockBaseAt,
      stockReview: false,
      updatedAt: Date.now(),
      manufacturer: get('manufacturer'),
      medInfo: get('medInfo'),
      note: id ? ((medById(id) || {}).note || '') : ''
    };
    if (id) {
      const m = medById(id);
      if (m) Object.assign(m, payload);
    } else {
      payload.id = 'med_' + uid();
      payload.createdAt = new Date().toISOString();
      if (!Array.isArray(state.meds)) state.meds = [];
      state.meds.push(payload);
    }
    save();
    closeModal();
    render();
    toast(id ? '用药已更新' : '用药已添加');
  }

  function repairBackup(data) {
    const usedIds = new Set();
    const fixId = (prefix, raw) => {
      let id = String(raw == null ? '' : raw);
      if (!id || usedIds.has(id)) id = prefix + uid();
      usedIds.add(id);
      return id;
    };
    const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
    const list = v => (Array.isArray(v) ? v : []).filter(x => x && typeof x === 'object');
    const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
    const dateStr = v => {
      const s = String(v || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
      return fmt(parseD(s)) === s ? s : '';
    };

    const habits = list(data.habits)
      .filter(h => String(h.name || '').trim())
      .map(h => {
        const id = fixId('h_', h.id);
        return Object.assign({}, h, {
          id: id,
          name: String(h.name).trim().slice(0, 20),
          icon: String(h.icon || '✅').slice(0, 4),
          type: (h.type === 'quit' || h.type === 'smoke') ? h.type : 'build',
          target: clamp(parseInt(h.target, 10) || 1, 1, 99),
          unit: String(h.unit || '次').slice(0, 4),
          color: /^#[0-9a-f]{6}$/i.test(String(h.color || '')) ? String(h.color) : '#2f6f5e',
          note: String(h.note || '').slice(0, 40),
          pinned: PINNED_IDS.indexOf(id) >= 0,
          med: id === 'h_med',
          deadline: (String(h.type || 'build') === 'build' && (Number(h.target) || 1) <= 1
            && /^([01]\d|2[0-3]):[0-5]\d$/.test(String(h.deadline || ''))) ? String(h.deadline) : '',
          archivedAt: h.archivedAt ? String(h.archivedAt) : (h.archived === true ? new Date().toISOString() : '')
        });
      });

    const tasks = list(data.tasks)
      .filter(t => String(t.title || '').trim())
      .map(t => Object.assign({}, t, {
        id: fixId('t_', t.id),
        title: String(t.title).trim().slice(0, 80),
        note: String(t.note || '').slice(0, 300),
        status: has(STATUS, t.status) ? t.status : 'todo',
        tag: has(TAGS, t.tag) ? t.tag : '其他',
        priority: has(PRIO, t.priority) ? t.priority : '中',
        due: dateStr(t.due),
        doneAt: dateStr(t.doneAt) || null,
        prevStatus: has(STATUS, t.prevStatus) ? t.prevStatus : '',
        repeat: ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none',
        repeatTime: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.repeatTime || '')) ? t.repeatTime : '20:00',
        repeatWeekday: (Number(t.repeatWeekday) >= 0 && Number(t.repeatWeekday) <= 6)
          ? Math.round(Number(t.repeatWeekday))
          : (dateStr(t.due) ? parseD(dateStr(t.due)).getDay() : 0),
        repeatDay: (Number(t.repeatDay) >= 1 && Number(t.repeatDay) <= 31)
          ? Math.round(Number(t.repeatDay))
          : (dateStr(t.due) ? parseD(dateStr(t.due)).getDate() : 1),
        repeatNextId: String(t.repeatNextId || ''),
        repeatFrom: String(t.repeatFrom || '')
      }));

    const meds = list(data.meds)
      .filter(m => String(m.name || '').trim())
      .map(m => Object.assign({}, m, {
        id: fixId('med_', m.id),
        name: String(m.name).trim().slice(0, 30)
      }));

    const weights = list(data.weights)
      .map(w => normalizeWeightRecord(w))
      .filter(Boolean)
      .map(w => Object.assign(w, { id: fixId('w_', w.id) }));

    const essays = list(data.essays)
      .map(e => normalizeEssayRecord(e))
      .filter(Boolean)
      .map(e => Object.assign(e, { id: fixId('e_', e.id) }));

    let bodyProfile = normalizeBodyProfile(data.bodyProfile);
    if ((!bodyProfile.age || !bodyProfile.height) && weights.length) {
      const latestWeight = weights.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
      if (latestWeight && latestWeight.age && latestWeight.height) {
        bodyProfile = normalizeBodyProfile({ age: latestWeight.age, height: latestWeight.height });
      }
    }

    const cleanChecks = normalizeChecks(data.checks, list(data.events));

    const cleanDoses = {};
    Object.keys(obj(data.doses)).forEach(d => {
      const day = data.doses[d];
      if (!dateStr(d) || !day || typeof day !== 'object' || Array.isArray(day)) return;
      const outDay = {};
      Object.keys(day).forEach(mid => {
        const slots = day[mid];
        if (!slots || typeof slots !== 'object' || Array.isArray(slots)) return;
        const outSlots = {};
        Object.keys(slots).forEach(slot => {
          const entry = slots[slot];
          if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(slot) && slot.indexOf('prn_') !== 0) return;
          if (entry && typeof entry === 'object' && !Array.isArray(entry)) outSlots[slot] = entry;
        });
        if (Object.keys(outSlots).length) outDay[mid] = outSlots;
      });
      if (Object.keys(outDay).length) cleanDoses[d] = outDay;
    });

    const cleanMoods = normalizeMoods(data.moods);

    /* v78 前这里是「白名单」：只列上面这 14 个字段，其余一概丢弃。
       v68 加进来的 cravings / packs、v71 的 notices、v75 的 cardOrder、v76 的 countdowns
       全都没同步进来——导入那一刻它们被静默丢掉，紧接着 save() 又把这份残缺的 state
       推上云端，等于把用户数据直接抹掉（导出是全量、导入是白名单，两边从来就不对称）。
       现在改成：已知的新字段显式 normalize，**其余不认识的顶层键原样带过**。
       多带一个无害字段的代价是零，漏记一次的代价是用户的数据。 */
    const out = {
      version: 2,
      schemaVersion: SCHEMA_VERSION,
      view: 'today',
      habits: habits,
      checks: cleanChecks,
      notes: obj(data.notes),
      moods: cleanMoods,
      events: list(data.events),
      meds: meds,
      doses: cleanDoses,
      tasks: tasks,
      bodyProfile: bodyProfile,
      weights: weights,
      essays: essays,
      cravings: normalizeCravings(data.cravings),
      packs: normalizePacks(data.packs),
      notices: normalizeNotices(data.notices),
      countdowns: normalizeCountdowns(data.countdowns),
      cardOrder: normalizeCardOrder(data.cardOrder),
      cardOrderAt: Math.max(0, Math.round(Number(data.cardOrderAt) || 0)),
      money: normalizeMoney(data.money),
      moneyAt: Math.max(0, Math.round(Number(data.moneyAt) || 0)),
      navOrder: normalizeNavOrder(data.navOrder),
      navOrderAt: Math.max(0, Math.round(Number(data.navOrderAt) || 0))
    };

    /* 兜底：以后再加顶层字段也不会被这张表吃掉 */
    Object.keys(data).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(out, k)) return;
      out[k] = data[k];
    });
    return out;
  }

  /* 从「导出备份 JSON」还原数据，让备份链条闭环。
     三条原则：
     1) 确认框必须让用户看到「要拿回什么」和「会失去什么」，不允许盲确认；
     2) 任一步失败都停手，绝不留半成品数据；
     3) 统一走 repairBackup 清洗，导入后的结构与主状态完全一致。 */
  function handleImport(e) {
    const input = e.target;
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;

    if (file.size > 20 * 1024 * 1024) {
      alert('导入失败：文件超过 20MB，不是本站导出的备份。');
      return;
    }

    const reader = new FileReader();
    reader.onerror = () => alert('导入失败：文件读取出错，请重新选择。');
    reader.onload = () => {
      let data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (err) {
        alert('导入失败：不是有效的 JSON 文件。');
        return;
      }
      if (!data || typeof data !== 'object' || Array.isArray(data) || (!Array.isArray(data.habits) && !Array.isArray(data.tasks))) {
        alert('导入失败：文件里没有习惯或待办数据，可能不是本站导出的备份。');
        return;
      }

      const n = v => (Array.isArray(v) ? v.length : 0);
      const summary = [
        '习惯 ' + n(data.habits) + ' 个',
        '待办 ' + n(data.tasks) + ' 条',
        '打卡 ' + Object.keys(data.checks || {}).length + ' 天',
        '药品 ' + n(data.meds) + ' 项',
        '体重 ' + n(data.weights) + ' 条',
        '随笔 ' + n(data.essays) + ' 篇'
      ].join(' · ');

      if (!confirm(
        '即将导入这份备份：\n' + summary + '\n\n' +
        '导入会整体替换当前的全部数据，之后无法撤销。\n' +
        '建议先点「导出备份 JSON」留一份当前数据。\n\n' +
        '确定继续吗？'
      )) return;

      try {
        migrateColors(data);
        const clean = repairBackup(data);
        migratePinned(clean);
        migrateMeds(clean);
        migrateQuitHabit(clean);
        ensureBreathingHabit(clean);
        state = clean;
        ensureStateMaps();
        if (Array.isArray(state.events) && state.events.length > 1000) state.events = state.events.slice(-1000);
        view = 'today';
        state.view = 'today';
        selectedDate = todayStr();
        save();
        render();
        toast('导入成功');
      } catch (err) {
        alert('导入失败：' + (err && err.message ? err.message : '未知错误'));
      }
    };
    reader.readAsText(file);
  }

  function csvCell(value) {
    let s = String(value == null ? '' : value);
    if (/^[\s]*[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }

  /* ============================================================
     日历导出（.ics）
     系统日历是唯一「关掉网页也会响」的通道，而且不需要推送服务器：
     把用药时段、重复任务、带建议时间的习惯输出成标准 iCalendar，
     导入后交给 iOS 日历 / 安卓日历 / Outlook 到点提醒。

     两个细节决定它能不能真的用起来：
     1) 时间统一转成 UTC（Z 后缀）。中国没有夏令时，+8 换算绝对可靠，
        比写 TZID 再去定义 VTIMEZONE 稳得多。
     2) UID 用「业务类型-业务 id」，同一条日程重复导入只会覆盖，
        不会像流水账一样越导越多。
     ============================================================ */
  const ICS_DOMAIN = 'wanfeng-todo';
  const ICS_TZ = 'Asia/Shanghai';
  const ICS_WEEK = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  /* 北京时间固定 +8、没有夏令时，所以只要一个 STANDARD 块就够，
     不用跟着日历 App 的时区库走 */
  const ICS_VTIMEZONE = [
    'BEGIN:VTIMEZONE',
    'TZID:' + ICS_TZ,
    'BEGIN:STANDARD',
    'DTSTART:19700101T000000',
    'TZOFFSETFROM:+0800',
    'TZOFFSETTO:+0800',
    'TZNAME:CST',
    'END:STANDARD',
    'END:VTIMEZONE'
  ].join('\r\n');

  function icsEsc(v) {
    return String(v == null ? '' : v)
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  /* RFC 5545 折行：每行不超过 75 字节，续行以单个空格开头。
     中文一个字 3 字节，必须按字符累加字节数，不能按字符数切。 */
  function icsFold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    const out = [];
    let cur = '', curLen = 0;
    for (const ch of line) {
      const n = enc.encode(ch).length;
      if (curLen + n > 74) { out.push(cur); cur = ' ' + ch; curLen = 1 + n; }
      else { cur += ch; curLen += n; }
    }
    if (cur) out.push(cur);
    return out.join('\r\n');
  }

  function icsUtc(d) {
    return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
      'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + '00Z';
  }

  /* 本地时间字段，配合 DTSTART;TZID 使用。
     为什么不用 UTC：07:00 的事件换算成 UTC 是前一天 23:00，
     带 BYDAY 的每周重复就会被系统日历算到前一天去。 */
  function icsLocal(d) {
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
      'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00';
  }

  /* 按天推进但保留时分。全局 addDays() 只保留年月日，
     直接用在日程上会把 08:00 的药变成半夜 00:00。 */
  function icsAddDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
  }

  /* 把一个「北京时间的某天某时」换算成 UTC，供 RRULE 的 UNTIL 使用。
     手工减 8 小时，不经过浏览器时区，免得在非东八区打开时偏掉。 */
  function icsUtcCst(y, mo, day, hh, mm) {
    const t = new Date(Date.UTC(y, mo - 1, day, hh - 8, mm));
    return t.getUTCFullYear() + pad2(t.getUTCMonth() + 1) + pad2(t.getUTCDate()) +
      'T' + pad2(t.getUTCHours()) + pad2(t.getUTCMinutes()) + '00Z';
  }

  function icsEvent(uidStr, start, end, summary, desc, rrule) {
    const lines = [
      'BEGIN:VEVENT',
      'UID:' + uidStr + '@' + ICS_DOMAIN,
      'DTSTAMP:' + icsUtc(new Date()),
      'DTSTART;TZID=' + ICS_TZ + ':' + icsLocal(start),
      'DTEND;TZID=' + ICS_TZ + ':' + icsLocal(end),
      'SUMMARY:' + icsEsc(summary),
      'DESCRIPTION:' + icsEsc(desc || '来自 明序'),
      'TRANSP:TRANSPARENT'
    ];
    if (rrule) lines.push('RRULE:' + rrule);
    lines.push(
      'BEGIN:VALARM',
      'TRIGGER:-PT0M',
      'ACTION:DISPLAY',
      'DESCRIPTION:' + icsEsc(summary),
      'END:VALARM',
      'END:VEVENT'
    );
    return lines.map(icsFold).join('\r\n');
  }

  function buildICS() {
    const now = new Date();
    const today = todayStr();
    const out = [];
    let count = 0;

    out.push([
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//WanfengTodo//Reminder//CN',
      'CALSCALE:GREGORIAN',
      'X-WR-CALNAME:' + icsEsc('明序 提醒'),
      'X-WR-TIMEZONE:Asia/Shanghai',
      'REFRESH-INTERVAL;VALUE=DURATION:PT6H',
      'X-PUBLISHED-TTL:PT6H'
    ].map(icsFold).join('\r\n'));
    out.push(ICS_VTIMEZONE);

    /* 用药：每个服用时刻一条每日重复；有停药日就截止到那天 */
    (state.meds || []).forEach(m => {
      if (!m || m.status !== 'active') return;
      if (m.courseType === 'prn') return;        /* 备用药按需服用，没有固定时刻 */
      const times = (Array.isArray(m.times) ? m.times : [])
        .filter(t => /^\d{2}:\d{2}$/.test(String(t)));
      if (!times.length) return;
      const startDay = /^\d{4}-\d{2}-\d{2}$/.test(String(m.startDate || '')) ? m.startDate : today;
      /* 只有短期疗程才有结束日。长期服药即便填了 endDate 也不该停在日历里 */
      const endDay = (m.courseType === 'short' && /^\d{4}-\d{2}-\d{2}$/.test(String(m.endDate || '')))
        ? m.endDate : '';
      const dose = (Number(m.doseAmount) || 1) + String(m.doseUnit || m.form || '片');
      times.forEach(t => {
        const hm = t.split(':').map(Number);
        const base = parseD(startDay);
        let start = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hm[0], hm[1]);
        while (start <= now) start = icsAddDays(start, 1);
        let rrule = 'FREQ=DAILY';
        if (endDay) {
          const e = parseD(endDay);
          const untilDate = new Date(e.getFullYear(), e.getMonth(), e.getDate(), hm[0], hm[1] + 15);
          if (untilDate < start) return;         /* 疗程已经结束的药不进日历 */
          rrule += ';UNTIL=' + icsUtcCst(e.getFullYear(), e.getMonth() + 1, e.getDate(),
            hm[0], hm[1] + 15);
        }
        out.push(icsEvent('med-' + m.id + '-' + t.replace(':', ''), start,
          new Date(start.getTime() + 15 * 60000),
          '💊 ' + String(m.name || '用药') + ' ' + dose,
          m.note || ('每天 ' + t), rrule));
        count++;
      });
    });

    /* 待办：单次任务只在还没过点时进日历；重复任务用 RRULE 表示 */
    (state.tasks || []).forEach(t => {
      if (!t || t.archivedAt || t.status === 'done' || t.status === 'cancelled') return;
      if (t.notify === false) return;            /* 通知开关：默认开 */
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.due || ''))) return;
      const repeat = ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none';
      const dueD = parseD(t.due);
      /* 日历是「日程」语义：填了开始时间就按它画，否则退回通知时间 */
      const hm = String(t.startTime || t.notifyTime || '09:00').split(':').map(Number);
      const durMin = (Number(t.duration) >= 15 && Number(t.duration) <= 720)
        ? Number(t.duration) : 15;
      let start, rrule = '';
      if (repeat === 'none') {
        if (String(t.due) < today) return;       /* 已经逾期的由横幅去催，别塞满日历 */
        start = new Date(dueD.getFullYear(), dueD.getMonth(), dueD.getDate(), hm[0], hm[1]);
        if (start <= now) return;
      } else {
        start = new Date(dueD.getFullYear(), dueD.getMonth(), dueD.getDate(), hm[0], hm[1]);
        if (repeat === 'daily') {
          rrule = 'FREQ=DAILY';
        } else if (repeat === 'weekly') {
          rrule = 'FREQ=WEEKLY;BYDAY=' + ICS_WEEK[clamp(Number(t.repeatWeekday) || dueD.getDay(), 0, 6)];
        } else {
          rrule = 'FREQ=MONTHLY;BYMONTHDAY=' + clamp(Number(t.repeatDay) || dueD.getDate(), 1, 31);
        }
        while (start <= now) {
          if (repeat === 'daily') start = icsAddDays(start, 1);
          else if (repeat === 'weekly') start = icsAddDays(start, 7);
          else start = new Date(start.getFullYear(), start.getMonth() + 1, start.getDate(), hm[0], hm[1]);
        }
      }
      out.push(icsEvent('task-' + t.id, start, new Date(start.getTime() + durMin * 60000),
        '📌 ' + String(t.title || '待办'), t.note || '', rrule));
      count++;
    });

    /* 习惯：只导出填了建议时间的（没有时间的打卡没法排进日历） */
    (state.habits || []).forEach(h => {
      if (!h || h.archivedAt || h.med || h.optional || h.type === 'quit') return;
      if (h.notify === false) return;            /* 通知开关：默认开 */
      const st = String(h.suggestTime || '');
      if (!/^\d{2}:\d{2}$/.test(st)) return;
      const hm = st.split(':').map(Number);
      let start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hm[0], hm[1]);
      const freq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
      let rrule = 'FREQ=DAILY';
      if (freq === 'weekly') {
        const wd = clamp(Number(h.notifyWeekday) || 1, 0, 6);
        rrule = 'FREQ=WEEKLY;BYDAY=' + ICS_WEEK[wd];
        while (start <= now) start = icsAddDays(start, 7);
      } else if (freq === 'monthly') {
        const md = clamp(Number(h.notifyMonthday) || 1, 1, 31);
        rrule = 'FREQ=MONTHLY;BYMONTHDAY=' + md;
        while (start <= now) start = new Date(start.getFullYear(), start.getMonth() + 1, start.getDate(), hm[0], hm[1]);
      } else {
        while (start <= now) start = icsAddDays(start, 1);
      }
      out.push(icsEvent('habit-' + h.id, start, new Date(start.getTime() + 15 * 60000),
        String(h.icon || '🔔') + ' ' + String(h.name || '习惯'), h.note || '', rrule));
      count++;
    });

    /* 还款日：每月固定一天，跟着 money.notify.on 走。
       **必须和 api/ics.php 里那段完全一致** —— 前端导出文件和订阅地址
       是两条路，一处口径不同就会出现「下载的日历有、订阅的没有」。

       due 是「每月几号」：超出当月天数时按月末（31 号在 2 月就是 28/29 号），
       跟后端 lb_schedule_debts 用同一个兜底。 */
    const mnt = (state.money && state.money.notify && typeof state.money.notify === 'object')
      ? state.money.notify : null;
    if (mnt && mnt.on) {
      const [nh, nm] = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(mnt.time || ''))
        ? String(mnt.time).split(':').map(Number) : [9, 0];
      (Array.isArray(state.money.debts) ? state.money.debts : []).forEach(d => {
        if (!d || !(Number(d.balance) > 0.005)) return;
        const due = Math.round(Number(d.due));
        /* 0 / 空 = 没有具体还款日，不生成日历条目。
           跟 dayDebts()、api/ics.php 同一口径。 */
        if (!isFinite(due) || due < 1 || due > 31) return;
        /* 从本月开始找第一个「今天之后」的还款日 */
        let start = new Date(now.getFullYear(), now.getMonth(), 1, nh, nm);
        start = new Date(start.getFullYear(), start.getMonth(),
          Math.min(due, new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate()), nh, nm);
        let guard = 0;
        while (start <= now && guard < 40) {
          const ny = start.getFullYear(), nmo = start.getMonth() + 1;
          start = new Date(ny, nmo, Math.min(due, new Date(ny, nmo + 1, 0).getDate()), nh, nm);
          guard++;
        }
        const note = '还剩 ¥' + moneyFmt(d.balance) +
          ' · 最低 ¥' + moneyFmt(d.min) + ' · 年化 ' + (Number(d.apr) || 0) + '%';
        out.push(icsEvent('debt-' + d.id, start, new Date(start.getTime() + 15 * 60000),
          '💳 还款 · ' + String(d.name || '债务'), note, 'FREQ=MONTHLY;BYMONTHDAY=' + due));
        count++;
      });
    }

    out.push('END:VCALENDAR');
    return { text: out.join('\r\n') + '\r\n', count: count };
  }

  /* 移动端悬浮「+」：一处进入所有新建动作 */
  function quickAddModal() {
    const items = [
      { act: 'task-new', label: '待办', icon: 'board', desc: '安排一件要做的事' },
      { act: 'habit-new', label: '习惯', icon: 'habits', desc: '新建一个每日习惯' },
      { act: 'med-new', label: '用药', icon: 'pill', desc: '记录一种在吃的药' },
      { act: 'essay-new', label: '随笔', icon: 'essay', desc: '随手写点东西' },
      { act: 'weight-new', label: '体重', icon: 'weight', desc: '记下今天的体重' }
    ];
    openModal('' +
      '<div class="modal-card qa-card" id="quick-add">' +
        '<div class="qa-head"><h3>新建</h3>' +
          '<button type="button" class="icon-btn" data-act="close-modal" title="关闭">✕</button></div>' +
        '<div class="qa-grid">' +
          items.map(x =>
            '<button type="button" class="qa-item" data-act="' + x.act + '">' +
              '<span class="qa-ico">' + icon(x.icon) + '</span>' +
              '<b>' + x.label + '</b><small>' + x.desc + '</small>' +
            '</button>'
          ).join('') +
        '</div>' +
      '</div>');
  }

  function refreshMedSheet() {
    const sheet = $('#med-sheet');
    if (!sheet) return;
    /* 弹窗自身就是滚动容器，重建后要还原滚动位置，否则连点几个时段会一直跳回顶部 */
    const y = sheet.scrollTop;
    openModal(medSheetHtml(selectedDate));
    const after = $('#med-sheet');
    if (after) after.scrollTop = y;
  }

  function nextRepeatDate(date, repeat, weekday, day) {
    const base = /^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) ? parseD(date) : parseD(todayStr());
    if (repeat === 'weekly') {
      const target = clamp(Number.isFinite(Number(weekday)) ? Number(weekday) : base.getDay(), 0, 6);
      let d = addDays(base, 1);
      for (let i = 0; i < 7 && d.getDay() !== target; i++) d = addDays(d, 1);
      return fmt(d);
    }
    if (repeat === 'monthly') {
      const target = clamp(Number(day) || base.getDate(), 1, 31);
      const y = base.getFullYear();
      const m = base.getMonth() + 1;
      const last = new Date(y, m + 1, 0).getDate();
      return fmt(new Date(y, m, Math.min(target, last)));
    }
    return fmt(addDays(base, 1));
  }

  function completeRecurringTask(t, date) {
    if (!t || ['daily', 'weekly', 'monthly'].indexOf(t.repeat) < 0) return null;
    if (t.repeatNextId) {
      const existing = state.tasks.find(x => x.id === t.repeatNextId);
      if (existing) return existing;
    }
    const base = /^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) ? date : (t.doneAt || todayStr());
    const dueBase = t.due && t.due > base ? t.due : base;
    const dueDate = parseD(dueBase);
    const repeatWeekday = Number.isFinite(Number(t.repeatWeekday)) ? clamp(Number(t.repeatWeekday), 0, 6) : dueDate.getDay();
    const repeatDay = Number.isFinite(Number(t.repeatDay)) ? clamp(Number(t.repeatDay), 1, 31) : dueDate.getDate();
    const next = {
      id: uid(),
      title: t.title,
      note: t.note || '',
      tag: t.tag || '其他',
      priority: t.priority || '中',
      status: 'todo',
      due: nextRepeatDate(dueBase, t.repeat, repeatWeekday, repeatDay),
      repeat: t.repeat,
      repeatTime: t.repeatTime || '20:00',
      repeatWeekday: repeatWeekday,
      repeatDay: repeatDay,
      repeatFrom: t.id,
      repeatNextId: '',
      createdAt: new Date().toISOString(),
      doneAt: null,
      prevStatus: ''
    };
    t.repeatNextId = next.id;
    state.tasks.unshift(next);
    return next;
  }

  function uncompleteRecurringTask(t) {
    if (!t) return;
    let nextId = t.repeatNextId;
    if (!nextId) {
      const generated = state.tasks.find(x => x.repeatFrom === t.id);
      nextId = generated ? generated.id : '';
    }
    if (!nextId) return;
    const next = state.tasks.find(x => x.id === nextId);
    if (!next) { t.repeatNextId = ''; return; }
    if (next.status === 'done') return;
    state.tasks = state.tasks.filter(x => x.id !== next.id);
    t.repeatNextId = '';
  }

  const ACTIONS = {
    'date-shift': el => {
      const next = fmt(addDays(parseD(selectedDate), Number(el.dataset.delta) || 0));
      selectedDate = next > todayStr() ? todayStr() : next;
      render();
    },
    'date-today': () => { selectedDate = todayStr(); render(); },
    'pick-week-day': el => {
      if (el.dataset.date > todayStr()) return;
      selectedDate = el.dataset.date;
      render();
    },
    'set-mood': el => {
      if (!state.moods) state.moods = {};
      const m = el.dataset.mood;
      if (!m) return;
      if (state.moods[selectedDate] === m) delete state.moods[selectedDate];
      else state.moods[selectedDate] = m;
      save();
      render();
    },
    'cal-today': () => {
      const n = new Date();
      calMonth = new Date(n.getFullYear(), n.getMonth(), 1);
      render();
    },
    'set-stats-range': el => {
      const r = Number(el.dataset.range) || 30;
      if ([7, 30, 90].indexOf(r) < 0) return;
      statsRange = r;
      render();
    },
    'algo-open': () => { algoModal(); },
    'task-range': el => {
      const v = Number(el.dataset.v);
      if ([0, 7, 30, 90].indexOf(v) < 0) return;
      taskRange = v;
      render();
    },
    'pick-day': el => {
      if (el.dataset.date > todayStr()) return;
      selectedDate = el.dataset.date;
      view = 'today';
      state.view = 'today';
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    'quit-month-shift': el => {
      quitCalMonth = new Date(quitCalMonth.getFullYear(), quitCalMonth.getMonth() + (Number(el.dataset.delta) || 0), 1);
      render();
    },
    'quit-month-today': () => {
      const n = new Date();
      quitCalMonth = new Date(n.getFullYear(), n.getMonth(), 1);
      render();
    },
    'quit-trend-range': el => {
      quitTrendRange = Number(el.dataset.range) || 7;
      render();
    },
    'month-shift': el => {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (Number(el.dataset.delta) || 0), 1);
      render();
    },
    'cal-mode': el => {
      const mode = el.dataset.mode === 'week' ? 'week' : 'month';
      if (mode === calMode) return;
      calMode = mode;
      /* 从月切到周时，让周视图落在月视图正在看的那个月里，
         否则用户刚翻到 9 月，一切周视图却跳回本周。 */
      if (mode === 'week') {
        const t = todayStr();
        const firstOfMonth = fmt(calMonth);
        const inMonth = t.slice(0, 7) === firstOfMonth.slice(0, 7);
        calWeek = inMonth ? new Date() : new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
      }
      render();
    },
    'week-shift': el => {
      calWeek = addDays(weekStartOf(calWeek), (Number(el.dataset.delta) || 0) * 7);
      /* 底部三卡按 calMonth 算，滚到别的月份时让它跟着走 */
      calMonth = new Date(calWeek.getFullYear(), calWeek.getMonth(), 1);
      render();
    },
    'week-today': () => {
      const n = new Date();
      calWeek = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      calMonth = new Date(n.getFullYear(), n.getMonth(), 1);
      render();
    },
    'wk-open': el => {
      const ds = el.dataset.date || '';
      const kind = el.dataset.kind || 'task';
      const start = Number(el.dataset.start);
      const data = weekDayBlocks(ds);
      let head = '';
      let titles = [];
      if (start < 0) {
        head = ds + ' · 全天';
        titles = data.allday.map(x => x.title);
      } else {
        const hit = data.blocks.find(b => b.kind === kind && b.startMin === start);
        if (!hit) return;
        head = ds + ' ' + pad2(Math.floor(start / 60)) + ':' + pad2(start % 60) + ' · ' + (WK_KIND_CN[kind] || kind);
        titles = hit.titles;
      }
      if (!titles.length) return;
      openModal('' +
        '<div class="modal-card wk-detail">' +
          '<h3>' + esc(head) + '</h3>' +
          '<ul class="wk-detail-list">' +
            titles.map(t => '<li>' + esc(t) + '</li>').join('') +
          '</ul>' +
          '<div class="modal-actions"><span class="spacer"></span>' +
            '<button type="button" class="btn primary" data-act="close-modal">关闭</button>' +
          '</div>' +
        '</div>');
    },
    /* 买烟记录折叠（v107）：纯视图开关，不动数据 */
    'pack-fold': () => {
      quitPackOpen = !quitPackOpen;
      /* 收起时把分页计数复位，下次展开又是从 20 条开始 */
      if (!quitPackOpen) quitPackShown = PACK_PAGE;
      render();
    },
    'pack-more': () => {
      quitPackShown += PACK_PAGE;
      render();

    'task-toggle': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      if (t.status === 'done') {
        t.status = t.prevStatus || 'todo';
        t.prevStatus = '';
        t.doneAt = null;
        uncompleteRecurringTask(t);
      } else {
        t.prevStatus = t.status;
        t.status = 'done';
        t.doneAt = el.dataset.date || todayStr();
        const next = completeRecurringTask(t, t.doneAt);
        toast(next ? '完成 ✓ 下一次已生成' : '完成 ✓');
      }
      save();
      render();
    },
    'task-move': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      const dir = Number(el.dataset.dir) || 0;
      if (t.status === 'cancelled') {
        t.status = 'todo';
        t.doneAt = null;
        save();
        render();
        return;
      }
      const idx = FLOW.indexOf(t.status);
      if (idx < 0) return;
      const next = FLOW[clamp(idx + dir, 0, FLOW.length - 1)];
      if (next === t.status) return;
      const wasDone = t.status === 'done';
      if (next === 'done') t.prevStatus = t.status;
      t.status = next;
      t.doneAt = next === 'done' ? todayStr() : null;
      if (next === 'done' && !wasDone) completeRecurringTask(t, t.doneAt);
      if (next !== 'done' && wasDone) uncompleteRecurringTask(t);
      save();
      render();
    },

      if (cloud.user && !cloud.ready) { toast('云端数据还没加载完成，请稍候'); return; }
      ensureStateMaps();
      const rows = [['日期', '类型', '名称', '数值', '单位', '标签', '详情']];
      Object.keys(state.checks || {}).sort().forEach(d => {
        const day = state.checks[d] || {};
        state.habits.forEach(h => {
          const c = Number(day[h.id]) || 0;
          if (c > 0) rows.push([d, '习惯', h.name, String(c), h.unit || '次', h.archivedAt ? '已归档' : '', '']);
        });
      });
      Object.keys(state.doses || {}).sort().forEach(d => {
        const day = state.doses[d] || {};
        Object.keys(day).forEach(medId => {
          const med = medById(medId);
          Object.keys(day[medId] || {}).forEach(slot => {
            rows.push([d, '用药', med ? med.name : '已删除药物', '1', '次', '', slot.indexOf('prn_') === 0 ? '按需' : slot]);
          });
        });
      });
      (state.weights || []).forEach(w => {
        rows.push([w.date, '体重', '体重', String(w.weight), 'kg', '', 'BMI ' + w.bmi]);
      });
      Object.keys(state.moods || {}).sort().forEach(d => {
        const info = MOOD_MAP[state.moods[d]];
        if (info) rows.push([d, '心情', info.label, '1', '', '', '']);
      });
      (state.essays || []).forEach(e => {
        rows.push([e.date, '随笔', e.title || '无标题', String(String(e.text || '').replace(/\s/g, '').length), '字', (e.tags || []).join(' / '), e.text || '']);
      });
      const body = rows.slice(1).sort((a, b) => a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]) || a[2].localeCompare(b[2]));
      const csv = '\ufeff' + [rows[0]].concat(body).map(r => r.map(csvCell).join(',')).join('\r\n');

    /* 导航顺序：只在同组内换位。写的是**完整一份 key 数组**，
       合并时才能整份覆盖，不会拼出两端交错的顺序（同 cardOrder）。 */
    'nav-move': el => {
      const key = el.dataset.key || '';
      const dir = Number(el.dataset.dir) || 0;
      const list = orderedNav();
      const cur = list.find(function (n) { return n.key === key; });
      if (!cur || !dir) return;
      const same = list.filter(function (n) { return n.group === cur.group; }).map(function (n) { return n.key; });
      const i = same.indexOf(key);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= same.length) return;
      const tmp = same[i];
      same[i] = same[j];
      same[j] = tmp;
      let k = 0;
      const out = list.map(function (n) { return n.group === cur.group ? same[k++] : n.key; });
      state.navOrder = out;
      state.navOrderAt = Date.now();
      save();
      render();
    },

  /* ============================================================
     事件绑定
     ============================================================ */
  /* 统一跳页入口：底部 tab、抽屉、通知点击都走这里，
     免得三条路径各写一份状态同步逻辑 */
  function goView(next, noScroll) {
    if (!next || !VIEWS[next] || next === view) return;
    if ($('#more-sheet')) closeModal();
    view = next;
    state.view = next;
    save();
    render();
    if (!noScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.addEventListener('click', e => {
    const navEl = e.target.closest('[data-nav]');
    if (navEl) {
      /* 抽屉开着时点底部 tab：先关抽屉再切页，免得面板残留在新页面上 */
      goView(navEl.dataset.nav);
      return;
    }
    /* 待办表单里「明日 / 三日」快捷填截止日 */
    const dueQuick = e.target.closest('[data-due-quick]');
    if (dueQuick) {
      const dueInput = document.querySelector('#task-form [name="due"]');
      if (dueInput) {
        const days = dueQuick.dataset.dueQuick === 'tomorrow' ? 1 : 3;
        dueInput.value = fmt(addDays(new Date(), days));
      }
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) {
      e.preventDefault();
      fn(el, e);
    }
  });

  document.addEventListener('submit', e => {
    const form = e.target;
    if (form.id === 'task-form') {
      e.preventDefault();
      saveTaskForm(form);
    } else if (form.id === 'habit-form') {
      e.preventDefault();
      saveHabitForm(form);

      saveMoneyIncome(form);

      e.preventDefault();
      saveMoneyCat(form);

      e.preventDefault();
      saveMoneySpend(form);

      savePackForm(form);

      saveCountdownForm(form);

      saveBackfillForm(form);
    } else if (form.id === 'pack-cf-form') {
      e.preventDefault();
      savePackCfForm(form);

      e.preventDefault();
      saveEssayForm(form);
    } else if (form.id === 'forgot-form') {
      e.preventDefault();
      cloudDoForgot(form);
    } else if (form.id === 'reset-form') {
      e.preventDefault();
      cloudDoReset(form);
    } else if (form.id === 'cloud-login-form') {
      e.preventDefault();
      cloudDoLogin(form);
    } else if (form.id === 'cloud-register-form') {
      e.preventDefault();
      cloudDoRegister(form);
    } else if (form.id === 'admin-reset-form') {

      adminDoReset(form);
    } else if (form.id === 'admin-settings-form') {
      e.preventDefault();
      adminSaveSettings(form);
    } else if (form.id === 'quick-form') {
      e.preventDefault();
      const input = form.querySelector('[name="title"]');
      const title = input ? input.value.trim() : '';
      if (!title) return;
      state.tasks.unshift({
        id: uid(), title: title, note: '', tag: '生活', priority: '中',
        status: 'todo', due: selectedDate, createdAt: new Date().toISOString(), doneAt: null
      });
      save();
      render();
      const again = $('#quick-form [name="title"]');
      if (again) again.focus();
      toast('已添加到待办');
    }
  }, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#modal-root').children.length) {
      if (isSearchOpen()) closeSearch(); else closeModal();
      return;
    }
    /* Cmd/Ctrl + K：全局搜索 */
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      if (isSearchOpen()) closeSearch(); else openSearch();
      return;
    }
    /* 弹窗焦点陷阱：Tab / Shift+Tab 在弹窗内循环，跑不出去 */
    if (e.key === 'Tab' && $('#modal-root').children.length) {
      const focusables = Array.from($('#modal-root').querySelectorAll(
        'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),' +
        'select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
      )).filter(el => el.offsetWidth || el.offsetHeight || el === document.activeElement);
      if (focusables.length) {
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        const active = document.activeElement;
        if (e.shiftKey && (active === first || !$('#modal-root').contains(active))) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && (active === last || !$('#modal-root').contains(active))) {
          e.preventDefault();
          first.focus();
        }
      }
      return;
    }
    if (!isSearchOpen()) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const list = $('#search-body');
      const n = searchResults(searchTerm).length;
      if (!list || !n) return;
      searchIndex = (searchIndex + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
      searchRerenderBody();
      const cur = list.querySelector('.se-item.is-on');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter') {
      /* 命令优先：认得出来就执行，认不出来才当搜索跳转 */
      const cmd = parseCommand(searchTerm);
      if (cmd) {
        e.preventDefault();
        runCommand(cmd);
        return;
      }
      const items = searchResults(searchTerm);
      if (!items.length) return;
      e.preventDefault();
      searchGo(items[Math.min(searchIndex, items.length - 1)]);
    }
  });

  /* 搜索在 modal-root 里，这里是它的输入与渲染绑定 */
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'search-input') {
      if (e.target.value) searchTerm = e.target.value;
      else searchTerm = '';
      searchIndex = 0;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(searchRerenderBody, 150);
    }
  });

  const importFile = document.getElementById('import-file');
  if (importFile) importFile.addEventListener('change', handleImport);

  window.addEventListener('online', () => {
    if (cloud.pending && cloud.user && !cloud.pushing) cloudPush(false);
    else if (!cloud.user && cloud.error) cloudInit(true);
  });
  window.addEventListener('beforeunload', e => {
    if (cloud.user && cloud.pending) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  window.addEventListener('focus', () => {
    if (mode === 'landing' && !cloud.user) cloudInit(true);
    else cloudMaybePull();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      flushPendingSave();
      return;
    }
    if (document.visibilityState === 'visible') {
      remindStop();          /* 切回来立即恢复原标题 */
      refreshAutoTheme();
      if (mode === 'landing' && !cloud.user) cloudInit(true);
      else cloudMaybePull();
    }
  });
  window.addEventListener('pagehide', flushPendingSave);
  setInterval(() => {
    if (cloud.pending && cloud.user && !cloud.pushing && !cloud.conflict) cloudPush();
  }, 45000);
  setInterval(refreshAutoTheme, 60000);
  /* 每分钟看一次有没有该提醒的；只在页面还活着时有效，关掉网页要靠日历订阅 */
  setInterval(() => { notifyPing(false); }, 60000);

  /* 浏览器主动问「要不要装」时先拦下来存着，改由设置页/今日页的按钮触发，
     不然 Chrome 会自己弹一条很难看的横条 */
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstall = e;
    if (view === 'settings' || view === 'today') render();
  });
  window.addEventListener('appinstalled', () => {
    deferredInstall = null;
    render();
    toast('已装到桌面');
  });

  /* 从通知点进来时，服务线程会把目标页面发过来 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', e => {
      const d = e.data || {};
      if (d.type === 'goto' && d.view && VIEWS[d.view]) {
        if (mode === 'landing') return;   /* 还没登录先不动，等登录后回今日页 */
        goView(d.view);
      }
    });
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      /* v131：注册 URL 带版本串 + updateViaCache:'none'。
         原来直接注册裸地址，浏览器按 HTTP 缓存判断「脚本没变」就不更新 SW，
         于是新 HTML 配着旧 SW、旧 CSS——发版后怎么刷都不对。 */
      navigator.serviceWorker.register('service-worker.js?v=134', { updateViaCache: 'none' }).catch(() => {});
    });
  }

  /* ============================================================
     启动
     ============================================================ */
  if (!VIEWS[view]) {
    view = 'today';
    state.view = 'today';
  }
  render();
  cloudInit();
  checkResetToken();
})();
</script>
</body>
</html>
