  function bindWaterPage() {
    const sf = $('#water-settings-form');
    if (sf) {
      const g = sf.querySelector('[name="goalMl"]');
      const p = sf.querySelector('[name="perMl"]');
      const c = sf.querySelector('[name="cups"]');
      const hint = $('#water-link-hint');
      const num = function (el, lo, hi) { return Math.max(lo, Math.min(hi, Math.round(Number(el.value) || 0))); };
      const syncHint = function () {
        const goal = num(g, 200, 8000), per = num(p, 50, 1000), cups = num(c, 1, 24);
        const total = cups * per;
        const last = Math.max(per, goal - (cups - 1) * per);
        let html = '每天 <b>' + cups + '</b> 杯 × 每杯 <b>' + per + '</b> ml = <b>' + total + '</b> ml';
        if (goal >= total) {
          html += ' · 总量 <b>' + goal + '</b> ml，最后一杯 <b>' + last + '</b> ml';
        } else {
          html += ' · <b>已超过设定的总量 ' + goal + ' ml</b>，实际按 ' + total + ' ml 算（最后一杯 ' + per + ' ml）';
        }
        if (hint) hint.innerHTML = html;
      };
      if (g && p && c) {
        /* v206：把三向互相覆盖改成**单向**
           · 改「总量」或「每杯」→ 杯数自动重算（杯数是派生量，重算不丢用户数据，这是原设计，保留）
           · 改「杯数」→ **不再倒推覆盖总量**（那是主数据；原来一碰杯数，2300 就永久变成 2250，线上实测复现过）
           真正的目标仍由 waterGoalMl() 读取时兜底（保证最后一杯不溢出）。 */
        g.addEventListener('input', function () { c.value = Math.max(1, Math.ceil(num(g, 200, 8000) / num(p, 50, 1000))); syncHint(); });
        p.addEventListener('input', function () { c.value = Math.max(1, Math.ceil(num(g, 200, 8000) / num(p, 50, 1000))); syncHint(); });
        c.addEventListener('input', syncHint);
        syncHint();
      }
    }

    const nf = $('#water-notify-form');
    if (nf) {
      const sw = nf.querySelector('[name="notify"]');
      if (sw) sw.addEventListener('change', function () {
        const body = $('#water-notify-body');
        if (body) body.classList.toggle('w-notify-off', !sw.checked);
      });
      nf.querySelectorAll('[name="channels"]').forEach(function (box) {
        box.addEventListener('change', function () { box.closest('.w-chan').classList.toggle('on', box.checked); });
      });
      nf.querySelectorAll('[name="mode"]').forEach(function (r) {
        r.addEventListener('change', function () {
          nf.querySelectorAll('.w-mode').forEach(function (x) { x.classList.remove('on'); });
          r.closest('.w-mode').classList.add('on');
          const each = r.value === 'each';
          const e = $('#water-mode-each'), d = $('#water-mode-daily');
          if (e) e.style.display = each ? '' : 'none';
          if (d) d.style.display = each ? 'none' : '';
        });
      });
      const seg = $('#water-daily-count');
      const timesBox = $('#water-daily-times');
      const water = (state.modules && state.modules.water) ? state.modules.water : null;
      const dt = (water && isPlainObject(water.notifyDailyTimes)) ? water.notifyDailyTimes : {};
      const renderDaily = function (n) {
        if (seg) seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.n) === n); });
        const names = ['早上', '中午', '下午'];
        const flds = ['dailyMorning', 'dailyNoon', 'dailyAfternoon'];
        const defaults = [dt.morning || '08:00', dt.noon || '12:30', dt.afternoon || '15:00'];
        let html = '';
        for (let i = 0; i < n; i++) {
          html += '<div class="w-dt-row"><span>' + names[i] + '</span><input type="time" name="' + flds[i] + '" value="' + defaults[i] + '"></div>';
        }
        if (timesBox) timesBox.innerHTML = html;
      };
      if (seg) seg.addEventListener('click', function (ev) {
        const b = ev.target.closest('button'); if (!b) return;
        renderDaily(Number(b.dataset.n));
      });
      const cur = seg ? Number((seg.querySelector('button.on') || seg.querySelector('button')).dataset.n) : 2;
      renderDaily(cur);
    }
  }

  function saveWaterSettings(form) {
    const get = function (n) { const el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    if (!state.modules) state.modules = {};
    const m = state.modules.water || moduleDefaults('water');
    const per = clamp(Math.round(Number(get('perMl')) || 250), 50, 1000);
    const cups = clamp(Math.round(Number(get('cups')) || 9), 1, 24);
    /* v206：不再用 Math.max(goalMl, cups×per) 抬高用户填的值 —— 那会让「改杯数就吞掉自定义总量」。
       存的就是用户填的；读取时 waterGoalMl() 会取 max 兜底（保证最后一杯不溢出）。 */
    const goal = clamp(Math.round(Number(get('goalMl')) || 2300), 200, 8000);
    m.perMl = per; m.cups = cups; m.goalMl = goal;
    m.updatedAt = new Date().toISOString();
    state.modules.water = m;
    state.modulesAt = Date.now();
    save(); render();
    toast('喝水设置已保存');
  }

  function saveWaterNotify(form) {
    const get = function (n) { const el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    if (!state.modules) state.modules = {};
    const m = state.modules.water || moduleDefaults('water');
    m.notify = !!form.querySelector('[name="notify"]').checked;
    /* v216：渠道不再写进模块快照（旧字段保留但不再使用），真源是通知路由板块矩阵。
       时间与频率仍归模块自己（schedule / ICS 读这里）。 */
    const chOn = { wecom: false, mail: false, browser: false };
    form.querySelectorAll('[name="channels"]:checked').forEach(function (el) {
      if (chOn[el.value] !== undefined) chOn[el.value] = true;
    });
    const modeEl = form.querySelector('[name="mode"]:checked');
    m.notifyMode = modeEl && modeEl.value === 'daily' ? 'daily' : 'each';
    const segOn = form.querySelector('#water-daily-count button.on');
    m.notifyDailyCount = segOn ? clamp(Number(segOn.dataset.n) || 2, 1, 3) : 2;
    const TIME_OK = function (s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(s); };
    const dt = isPlainObject(m.notifyDailyTimes) ? m.notifyDailyTimes : {};
    m.notifyDailyTimes = {
      morning: TIME_OK(get('dailyMorning')) ? get('dailyMorning') : (dt.morning || '08:00'),
      noon: TIME_OK(get('dailyNoon')) ? get('dailyNoon') : (dt.noon || '12:30'),
      afternoon: TIME_OK(get('dailyAfternoon')) ? get('dailyAfternoon') : (dt.afternoon || '15:00')
    };
    m.notifyStart = TIME_OK(get('notifyStart')) ? get('notifyStart') : '08:00';
    m.notifyEnd = TIME_OK(get('notifyEnd')) ? get('notifyEnd') : '21:00';
    m.updatedAt = new Date().toISOString();
    state.modules.water = m;
    state.modulesAt = Date.now();
    save();
    /* 渠道部分更新：成功回填 boards 再重绘（失败则还原为服务端真源并提示） */
    saveModuleNotifyChannels('water', chOn)
      .then(function () { render(); toast('提醒设置已保存 · 渠道已同步到通知路由'); })
      .catch(function (e) {
        render();
        toast('提醒设置已保存；渠道保存失败：' + (e && e.message ? e.message : '网络错误'));
      });
  }

  /* ============ 478 呼吸法页改版（v194）：页内设置 + 提醒 ============ */
  /* 组数一变，提醒区的时间框数量跟着变（已填的值保留，新增的补不重复的默认点）。
     v200：走 breatheFillTimes —— 扩容时不会再补出一个跟现有时间一模一样的点。 */
  function syncBreatheTimes(n) {
    const box = $('#breathe-times');
    if (!box) return;
    const cur = Array.prototype.map.call(box.querySelectorAll('input[type="time"]'), function (el) { return el.value; });
    const k = Math.max(1, Math.min(BREATHE_MAX_GROUPS, Math.round(Number(n) || 1)));
    const times = breatheFillTimes(cur, k);
    let html = '';
    for (let i = 0; i < k; i++) {
      html += '<div class="w-dt-row"><span>第 ' + (i + 1) + ' 组</span>' +
        '<input type="time" name="bt' + i + '" value="' + esc(times[i] || '') + '"></div>';
    }
    box.innerHTML = html;
  }

        const rawG = Math.round(Number(g.value) || 0), rawC = Math.round(Number(c.value) || 0);

          (rawG < 1 ? ' · <b>至少 1 组</b>' : '') +
          (rawC > 8 ? ' · <b>每组最多 8 次</b>' : '') +
          (rawC < 1 ? ' · <b>每组至少 1 次</b>' : '');
        syncBreatheTimes(gr);
      };

    }
  }

  function saveBreatheSettings(form) {
    const get = function (n) { const el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    if (!state.modules) state.modules = {};
    const m = state.modules.breathe || moduleDefaults('breathe');
    const prevGroups = breatheGroups(m);
    const rawG = Math.round(Number(get('groups')) || 0);
    const rawC = Math.round(Number(get('cycles')) || 0);
    const groups = clamp(rawG, 1, BREATHE_MAX_GROUPS);
    const cycles = clamp(rawC, 1, 8);
    const old = Array.isArray(m.notifyTimes) ? m.notifyTimes : [];
    /* v200：扩组数时保留已填的时间点、只补不重复的缺口。
       以前直接取 dflt[i]，dflt 末位恒为 21:00，而旧末位通常也是 21:00 →
       补出一个一模一样的时刻 → 后端推送去重把后一条吃掉，那一组永远收不到提醒。 */
    const times = breatheFillTimes(old, groups);
    m.groups = groups;
    m.cycles = cycles;
    m.notifyTimes = times;
    m.suggestTime = times[0] || m.suggestTime;
    m.updatedAt = new Date().toISOString();
    state.modules.breathe = m;
    state.modulesAt = Date.now();
    /* render 会用新的 groups 重绘输入框 → 被夹住的值自动回填到界面上（用户看得见改成了几） */
    save(); render();
    /* v204（方案 A）：改组数会让历史达标天数按新目标重判，明说一句，别让人以为数据丢了 */
    toast(rawG > BREATHE_MAX_GROUPS
      ? '已保存 · 每天几组按上限改为 ' + BREATHE_MAX_GROUPS + ' 组，历史达标率会按新目标重算'
      : (rawC > 8 ? '已保存 · 每组循环次数按上限改为 8 次'
        : ((rawG < 1 || rawC < 1) ? '已保存 · 数值已按最小 1 修正'
          : (groups !== prevGroups
            ? '已保存 · 每天 ' + groups + ' 组，历史达标率会按新目标重算'
            : '478呼吸法设置已保存'))));
  }

  function saveBreatheNotify(form) {
    if (!state.modules) state.modules = {};
    const m = state.modules.breathe || moduleDefaults('breathe');
    m.notify = !!form.querySelector('[name="notify"]').checked;
    /* v216：渠道不再写进模块快照，真源是通知路由板块矩阵（breathe） */
    const chOn = { wecom: false, mail: false, browser: false };
    form.querySelectorAll('[name="channels"]:checked').forEach(function (el) {
      if (chOn[el.value] !== undefined) chOn[el.value] = true;
    });
    /* v200：以界面上实际存在的输入框为准 —— 用户把「每天几组」改大但没点「保存设置」时，
       提醒区已经多出几个框，以前只读已保存的 groups，多填的时间会被静默丢掉。 */
    const boxes = Array.prototype.slice.call(form.querySelectorAll('[name^="bt"]'));
    const olds = boxes.map(function (el) { return String(el.value || '').trim(); });
    const prevGroups = breatheGroups(m);
    const n = clamp(boxes.length || prevGroups, 1, BREATHE_MAX_GROUPS);
    const TIME_OK = function (s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s || '')); };
    const valid = olds.filter(TIME_OK);
    const dup = valid.length !== new Set(valid).size;
    const times = breatheFillTimes(olds, n);
    m.groups = n;
    m.notifyTimes = times;
    m.suggestTime = times[0] || m.suggestTime;
    m.notifyFreq = 'daily';
    m.updatedAt = new Date().toISOString();
    state.modules.breathe = m;
    state.modulesAt = Date.now();
    save();
    const baseMsg = dup
      ? '提醒设置已保存 · 重复的时间已自动错开'
      : (n !== prevGroups ? '提醒设置已保存 · 每天几组同步为 ' + n + ' 组' : '提醒设置已保存');
    saveModuleNotifyChannels('breathe', chOn)
      .then(function () { render(); toast(baseMsg + ' · 渠道已同步到通知路由'); })
      .catch(function (e) {
        render();
        toast(baseMsg + '；渠道保存失败：' + (e && e.message ? e.message : '网络错误'));
      });
  }

  /* ============ 运动 2.0（v175）：新建/编辑弹窗、打卡、记录、提醒保存 ============ */

  /* 渠道能力检测（v177）：勾选渠道时如实告诉用户「这个渠道现在能不能真的收到」。
     浏览器通知看 Notification.permission；企业微信看 push_status；邮件看 mail_status。
     缓存只在打开弹窗时刷新，避免每次都打两个接口。 */
  let moveChanCfg = null;        // null = 还没拿到；{ push, mail, offline }
  let moveChanLoading = false;
  let moveChanTipRefresher = null;  // 弹窗打开时挂上「重算渠道提示」的函数，异步拿到配置后回刷

  async function moveLoadChanCfg() {
    if (moveChanLoading || moveChanCfg) return;
    if (mode === 'landing' || !cloud.available || !cloud.user) {
      moveChanCfg = { push: null, mail: null, offline: true };
      return;
    }
    moveChanLoading = true;
    const out = { push: null, mail: null, offline: false };
    try {
      const r = await cloudApi('push_status');
      out.push = {
        enabled: !!(r && r.enabled),
        webhook: (r && typeof r.webhook === 'string') ? r.webhook : ''
      };
    } catch (e) { out.push = null; }
    try {
      const r = await cloudApi('mail_status');
      const c = (r && r.config && typeof r.config === 'object') ? r.config : {};
      out.mail = {
        enabled: !!c.enabled,
        host: String(c.host || ''),
        user: String(c.user || ''),
        hasSecret: !!c.hasSecret
      };
    } catch (e) { out.mail = null; }
    moveChanCfg = out;
    moveChanLoading = false;
    /* 配置拿到后，把弹窗里的渠道提示就地刷新一遍（用户可能已经看到「正在检测」） */
    if (moveChanTipRefresher) moveChanTipRefresher();
  }

  /* 单个渠道的能力状态：{ ok, pending?, reason }
     reason 只说原因、不带渠道名 —— 多条一起列的时候才不会重复啰嗦。 */
  function moveChanState(key) {
    if (key === 'browser') {
      if (typeof Notification === 'undefined') {
        return { ok: false, reason: '这个浏览器不支持系统通知，换 Chrome / Edge 试试' };
      }
      const p = Notification.permission;
      if (p === 'granted') return { ok: true };
      if (p === 'denied') return { ok: false, reason: '被系统拦截了，请到浏览器设置里允许本站通知' };
      return { ok: false, reason: '还没开启，请到「配置」页的通知配置里开启' };
    }
    if (!moveChanCfg) return { ok: false, pending: true, reason: '正在检测配置…' };
    if (moveChanCfg.offline) return { ok: false, reason: '现在是本地模式，登录账号后才可用' };
    if (key === 'wecom') {
      const p = moveChanCfg.push;
      if (!p) return { ok: false, reason: '拿不到配置，请到「配置」页保存一次机器人地址' };
      if (p.enabled && p.webhook) return { ok: true };
      return { ok: false, reason: '还没配置机器人地址，请到「配置」页的通知配置里填写' };
    }
    if (key === 'mail') {
      const c = moveChanCfg.mail;
      if (!c) return { ok: false, reason: '拿不到配置，请到「配置」页保存一次邮箱设置' };
      if (c.enabled && c.host && c.user && c.hasSecret) return { ok: true };
      return { ok: false, reason: '还没配置邮箱与授权码，请到「配置」页的通知配置里填写' };
    }
    return { ok: true };
  }
  const MOVE_CHAN_NAME = { browser: '浏览器通知', wecom: '企业微信群', mail: '邮件通知' };

  /* 渠道提示的渲染放在弹窗里（要读 chanSel 闭包），这里只留能力判断 */

  function moveSportModal(id) {
    /* 每次打开都重新探一次：用户可能刚在配置页开通过渠道 */
    moveChanCfg = null;
    moveLoadChanCfg();
    const editing = moveSportById(id);
    const key = editing ? editing.key : 'steps';
    /* v179：只列可用的 7 种模式。若在编辑一条已下线的历史运动（游泳/瑜伽），
       把它补进网格并标「已下线」，否则当前选中项会看不见。 */
    const pick = MOVE_PICKABLE.slice();
    if (editing && MOVE_TYPES[editing.key] && MOVE_TYPES[editing.key].retired && pick.indexOf(editing.key) < 0) {
      pick.push(editing.key);
    }
    const grid = pick.map(function (k) {
      const T = MOVE_TYPES[k];
      /* v183：编辑时类型锁定 —— 只有当前类型可选，其余灰掉 */
      const dis = editing && k !== key;
      return '<div class="sp-opt' + (key === k ? ' on' : '') + (dis ? ' dis' : '') + '" data-k="' + k + '"' +
        (dis ? ' aria-disabled="true" title="运动类型建好后不能改，需要别的运动请新建一个"' : '') + '>' +
        '<span class="ci">' + T.icon + '</span>' + esc(T.name) +
        (T.retired ? '<small class="sp-retired">已下线</small>' : '') + '</div>';
    }).join('');
    openModal(
      '<form class="modal-card" id="move-sport-form" data-id="' + (editing ? editing.id : '') + '">' +
        '<h3>' + (editing ? '编辑运动' : '新建运动') + '</h3>' +
        '<span class="f-label">' + (editing ? '运动类型 🔒' : '选择运动模式') + '</span>' +
        '<div class="sp-grid">' + grid + '</div>' +
        (editing ? '<p class="sp-hint sp-locked">🔒 运动类型建好后不能修改。如果需要其他运动，请新建一个运动。</p>' : '') +
        '<div id="move-sport-body"></div>' +
        '<div class="modal-actions">' +
          '<span class="spacer"></span>' +
          '<button type="button" class="btn ghost" data-act="close-modal">取消</button>' +
          '<button type="submit" class="btn primary">' + (editing ? '保存修改' : '添加运动') + '</button>' +
        '</div>' +
      '</form>');
    bindMoveSportForm(editing);
  }

  /* v176：弹窗里的所有选择都先存在闭包里，提交时由 _moveState() 一次性取出。
     名称不再让用户填（由模式固定），与喝水 / 478 的交互一致。 */
  function bindMoveSportForm(init) {
    const form = $('#move-sport-form');
    if (!form) return;
    const grid = form.querySelector('.sp-grid');
    let curKey = init ? init.key : 'steps';
    let tIdx = init ? (init.tIdx || 0) : 0;
    let tVal = init ? (init.tVal || MOVE_TYPES[curKey].targets[0].def) : MOVE_TYPES[curKey].targets[0].def;
    let freqKind = init ? init.freqKind : 'daily';
    let freqN = init ? (init.freqN || 1) : 1;
    let perDay = init ? (init.perDay || 1) : 1;
    let weekSel = init ? (init.weekSel || []).slice() : [new Date().getDay()];
    let recMode = init ? (init.recMode || 'manual') : 'manual';
    let fixedSteps = init ? (init.fixedSteps || 1000) : 1000;
    /* v184：运动开始时间（HH:MM），默认留空；每日步数不用 */
    let startTime = init ? (init.startTime || '') : '';
    /* v185：勾选状态改成严格判断 —— 先把该模式的全部字段置为「未勾」，
       再把存档里明确勾上的置回 true。
       原来只往 fieldOn 里塞 true、渲染时用「不等于 false 就算勾上」，
       编辑老运动时存档里没出现的字段（undefined）就被当成勾中了：
       表现为「全部取消 → 保存 → 重开又全勾上」。 */
    const fieldOn = {};
    MOVE_TYPES[curKey].fields.forEach(function (f) { fieldOn[f.k] = false; });
    if (init) {
      (Array.isArray(init.fields) ? init.fields : []).forEach(function (k) {
        if (k in fieldOn) fieldOn[k] = true;
      });
    } else {
      MOVE_TYPES[curKey].fields.forEach(function (f) { fieldOn[f.k] = true; });
    }
    let strokePick = (init && init.strokePick) || '自由泳';
    /* v178：通知开关与渠道都按「这个运动」自己存。
       编辑老运动（还没有 channels 字段）时，回落到模块级渠道。 */
    /* v216：实例通知设置的真源是板块矩阵 move.instances；没存过回落旧快照值（兼容） */
    const _inst = init ? notifyMoveInstance(init.id) : null;
    let notifyOn = _inst ? !!_inst.on : (init ? (init.notifyOn !== false) : true);
    let chanSel = _inst && _inst.channels
      ? Object.keys(_inst.channels).filter(function (k) { return _inst.channels[k]; })
      : (init && Array.isArray(init.channels))
      ? init.channels.slice()
      : (moveModule().notifyChannels || ['browser']).slice();

    function renderBody() {
      const T = MOVE_TYPES[curKey];
      const TGT = T.targets;
      const isSteps = curKey === 'steps';
      if (!(tIdx >= 0 && tIdx < TGT.length)) tIdx = 0;
      const tf = TGT[tIdx];
      const box = $('#move-sport-body');
      let h = '';
      h += '<span class="f-label">运动说明</span>';
      h += '<div class="sp-desc">' + esc(T.icon) + ' ' + esc(T.desc) + '</div>';
      h += '<span class="f-label">目标</span>';
      if (TGT.length > 1) {
        h += '<div class="sp-trow"><select id="sp-target">' + TGT.map(function (t, i) {
          return '<option value="' + i + '"' + (i === tIdx ? ' selected' : '') + '>' + esc(t.label) + '</option>';
        }).join('') + '</select>' +
          '<input type="number" id="sp-tval" min="1" value="' + tVal + '"><span class="u">' + esc(tf.unit) + '</span></div>';
      } else {
        h += '<div class="sp-tlbl">' + esc(tf.label) + '</div>' +
          '<div class="sp-trow"><input type="number" id="sp-tval" min="1" value="' + tVal + '"><span class="u">' + esc(tf.unit) + '</span></div>';
      }
      h += '<span class="f-label">运动频率</span>';
      h += '<div class="sp-freq">' + MOVE_FREQ.map(function (f) {
        return '<div class="sp-freq-opt' + (freqKind === f[0] ? ' on' : '') + '" data-fk2="' + f[0] + '">' + f[1] + '</div>';
      }).join('') + '</div>';
      /* v184：每日步数是独立的运动类型，不设「每天做几次」——
         它的完成度只看累计步数 ÷ 目标步数，点几次都不影响判定。 */
      if (freqKind === 'daily') {
        if (!isSteps) {
          h += '<div class="sp-nrow"><span class="lbl">每天</span><input type="number" id="sp-freqn" min="1" max="99" value="' + freqN + '"><span class="u">次</span></div>';
        }
      } else {
        h += '<div class="sp-week" id="sp-week">' + MOVE_WEEK.map(function (w) {
          return '<button type="button" data-d="' + w[0] + '" class="' + (weekSel.indexOf(w[0]) >= 0 ? 'on' : '') + '">' + w[1] + '</button>';
        }).join('') + '</div>';
        if (!isSteps) {
          h += '<div class="sp-nrow"><span class="lbl">每个选中的日子做</span><input type="number" id="sp-perday" min="1" max="99" value="' + perDay + '"><span class="u">次</span></div>';
        }
        h += '<p class="sp-hint">' + (isSteps
          ? '勾选哪几天就只在这些天记步数；没勾的日子算按计划休息，不计入未达标。'
          : '勾选哪几天就是每周哪几天运动；再填每个执行日要做几次。没勾的日子算按计划休息，不计入未达标。') + '</p>';
      }
      /* v184：运动开始时间（每日步数是全天持续统计，不需要） */
      if (!isSteps) {
        h += '<span class="f-label">运动开始时间</span>' +
          '<div class="sp-trow"><input type="time" id="sp-starttime" value="' + esc(startTime) + '"></div>' +
          '<p class="sp-hint">填了到这个点会提醒你来运动；留空就只打卡、不提醒。</p>';
      }
      if (T.recordMode) {
        /* v185：记录方式建好后锁定 —— 与 v183 的运动类型同款手法。
           编辑时把「另一种」置灰不可点，误点只给提示不切换；
           锁的是「选哪一种」，固定步数的数值仍可改。 */
        const lockMode = !!init;
        h += '<span class="f-label">记录方式' + (lockMode ? ' 🔒' : '') + '</span>';
        h += '<div class="sp-rec">' +
          '<div class="sp-rec-opt' + (recMode === 'manual' ? ' on' : '') + (lockMode && recMode !== 'manual' ? ' locked' : '') + '" data-rm="manual"' +
            (lockMode && recMode !== 'manual' ? ' aria-disabled="true"' : '') + '><div class="t"><span class="dot"></span>手动输入今日步数</div><div class="d">打卡时填今天走了多少步</div></div>' +
          '<div class="sp-rec-opt' + (recMode === 'fixed' ? ' on' : '') + (lockMode && recMode !== 'fixed' ? ' locked' : '') + '" data-rm="fixed"' +
            (lockMode && recMode !== 'fixed' ? ' aria-disabled="true"' : '') + '><div class="t"><span class="dot"></span>每次记录固定步数</div><div class="d">点一次按固定步数累加</div></div>' +
          '</div>';
        if (lockMode) {
          h += '<p class="sp-hint sp-locked">🔒 记录方式建好后不能修改。如果想换一种，请新建一个运动。</p>';
        }
        if (recMode === 'fixed') {
          h += '<div class="sp-fixed"><span class="lbl">每次记录</span><input type="number" id="sp-fixed" min="1" value="' + fixedSteps + '"><span class="u">步</span></div>';
        }
      }
      h += '<span class="f-label">运动数据记录</span>';
      if (T.fields.length) {
        h += '<p class="sp-hint">勾选这次运动要记录的数据。打勾的项目会出现在「运动后数据」表单里，不勾的不显示。</p>';
        T.fields.forEach(function (f) {
          const unitTxt = f.unit ? ('（' + f.unit + '）') : '';
          const sub = f.k === 'pace' ? '记录本次平均配速'
            : f.k === 'cadence' ? (curKey === 'ride' ? '记录平均踏频' : '记录平均步频')
              : f.k === 'heart' ? '记录平均心率'
                : f.k === 'hrZone' ? '记录运动时的心率区间'
                  : f.k === 'distM' ? '记录今天走了多少米'
                    : f.k === 'dur' ? '本次运动消耗的时长'
                      : '记录本次' + f.n;
          h += '<div class="sp-field-chk"><div><b>' + esc(f.n) + unitTxt + '</b><small>' + esc(sub) + '</small></div>' +
            '<span class="switch"><input type="checkbox" data-fld="' + f.k + '"' + (fieldOn[f.k] === true ? ' checked' : '') + '><i></i></span></div>';
          /* 泳姿这类带选项的字段，勾着的时候把选项也放出来（历史数据的游泳模式用） */
          if (f.type === 'select' && f.opts && fieldOn[f.k] === true) {
            h += '<div class="sp-stroke" id="sp-stroke">' + f.opts.map(function (o) {
              return '<button type="button" data-s="' + esc(o) + '" class="' + (strokePick === o ? 'on' : '') + '">' + esc(o) + '</button>';
            }).join('') + '</div>';
          }
        });
      } else {
        h += '<div class="sp-desc">该模式没有可记录的运动数据。</div>';
      }
      /* v178：先给一个总开关。关掉就不用管渠道，三个渠道也能全不选。 */
      h += '<span class="f-label">通知提醒</span>';
      h += '<div class="mv-toggle-row"><div><b>接收这个运动的提醒</b><small>' +
        (notifyOn ? '到点按下面选的渠道通知你' : '已关闭：不为这个运动发任何通知') +
        '</small></div>' +
        '<label class="w-switch"><input type="checkbox" id="sp-notify"' + (notifyOn ? ' checked' : '') + '><i></i></label></div>';
      if (notifyOn) {
        h += '<span class="f-label">提醒渠道（可单选，也可多选）</span>';
        h += '<p class="sp-hint">勾选时会当场检测这条渠道是否已配置：能收到会提示「服务正常」，没配置会告诉你先去「配置」页开通。三个都不选，就等同于不提醒。</p>';
        h += '<div class="sp-chan">' + MOVE_CHANS.map(function (c) {
          const on = chanSel.indexOf(c[0]) >= 0;
          return '<label class="sp-chan-opt' + (on ? ' on' : '') + '"><span class="ch-dot" data-k="' + c[0] + '"></span><span class="ci">' + ({ browser: '🔔', wecom: '💬', mail: '✉️' })[c[0]] + '</span>' + c[1] +
            '<input type="checkbox" value="' + c[0] + '"' + (on ? ' checked' : '') + '></label>';
        }).join('') + '</div>';
        h += '<p class="sp-chan-tip" id="sp-chan-tip"></p>';
      }
      box.innerHTML = h;
      bindBody();
      checkSelected();
    }

    /* v180：把已选渠道**逐条**列出来。
       之前只显示一条（第一个未配置的 / 刚点的那条），勾三个都没配时用户会以为另外两个是好的。
       同时给每张渠道卡片刷一个状态点：绿=已配置、黄=未配置、灰=检测中。 */
    function checkSelected() {
      const box = document.getElementById('sp-chan-tip');
      /* 卡片上的状态点 */
      document.querySelectorAll('#move-sport-body .ch-dot').forEach(function (d) {
        const st = moveChanState(d.dataset.k);
        d.className = 'ch-dot ' + (st.pending ? 'wait' : st.ok ? 'ok' : 'bad');
        d.title = st.ok ? '已配置' : (st.pending ? '正在检测' : '未配置');
      });
      if (!box) return;
      if (!chanSel.length) {
        box.className = 'sp-chan-tip';

          ? '每次记录固定步数' : '手动输入今日步数';
        lines.push('<div class="field"><span>记录方式</span>' +
          '<div class="f-ro">' + esc(modeTxt) + '</div>' +
          '<small class="f-sub">建运动时设定，这里不能改</small></div>');
        /* v187：这次已经补过运动后数据（距离）—— 补过即锁定，表单里不给改，
           但要说明一句，否则用户会以为距离丢了。 */
        if (r && Number(r.distM) > 0) {
          lines.push('<p class="sp-hint">这次已记录运动后数据：<b>距离 ' + Number(r.distM) +
            ' 米</b>。补过即锁定，不在这里修改。</p>');
        }
      }
      /* v197：当天已经补过距离 → 这一天的距离锁住了，不再给输入框。
         「补过即锁定」现在记在**那一天**上（运动实例的 distLocked），
         删掉那条记录也不会解锁，当天补不了第二次。 */
      const lockDay = r ? r.d : dfltD;
      const dayLocked = !!(sport && isPlainObject(sport.distLocked) && sport.distLocked[lockDay]);
      /* 只出勾选过的项。没勾的不显示 —— 补数据就只补这些。
         v185：每日步数的**打卡**表单只出步数与记录方式。距离属于「运动后数据」
         （达标之后才记），不该混在打卡弹窗里；达标后的 mode='after' 才渲染它。 */
      const chosen = (!after && k === 'steps') ? [] : T.fields.filter(function (f) {
        if (dayLocked && f.k === 'distM') return false;
        if (sport && Array.isArray(sport.fields)) return sport.fields.indexOf(f.k) >= 0;
        return true;
      });
      if (after && dayLocked && !chosen.length) {
        lines.push('<p class="sp-hint">这一天已经补过运动后数据了（距离补过即锁定），不能再补第二次。</p>');
      }
      chosen.forEach(function (f) {
        const raw = r ? r[f.k] : '';
        const val = (raw === 0 || raw) ? raw : '';
        /* v187：运动后数据补过就锁定（陛下定：达标即封板，不允许再更新）。
           目前只有每日步数的「距离（米）」属于这一类，所以直接按 distM 判。 */
        if (f.k === 'distM' && r && Number(r.distM) > 0) {
          lines.push('<div class="field"><span>' + esc(f.n) + (f.unit ? '（' + esc(f.unit) + '）' : '') + '</span>' +
            '<div class="f-ro">' + esc(String(r.distM)) + (f.unit ? ' ' + esc(f.unit) : '') + '</div>' +
            '<small class="f-sub">已记录 · 运动后数据补过就锁定，不能再改</small></div>');
          return;
        }
        const sub = f.k === 'pace' ? '记录本次平均配速'
          : f.k === 'cadence' ? (k === 'ride' ? '记录平均踏频' : '记录平均步频')
            : f.k === 'heart' ? '记录平均心率'
              : f.k === 'hrZone' ? '记录运动时的心率区间'
                : f.k === 'distM' ? '记录今天走了多少米'
                  : f.k === 'dur' ? '本次运动消耗的时长'
                    : '记录本次' + f.n;
        if (f.type === 'select') {
          const opts = (f.opts || []).slice();
          const cur = String(val || (sport && sport.strokePick) || opts[0] || '');
          lines.push('<div class="field"><span>' + esc(f.n) + '</span><select name="' + f.k + '">' +
            opts.map(function (o) { return '<option' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
            '</select><small class="f-sub">' + esc(sub) + '</small></div>');
        } else if (f.type === 'text') {
          lines.push('<div class="field"><span>' + esc(f.n) + '</span><input name="' + f.k + '" placeholder="' + esc(f.ph || '') + '" value="' + esc(val) + '"><small class="f-sub">' + esc(sub) + '</small></div>');
        } else {
          lines.push('<div class="field"><span>' + esc(f.n) + (f.unit ? '（' + esc(f.unit) + '）' : '') + '</span>' +
            '<input name="' + f.k + '" type="number" min="0" step="' + (f.step || 1) + '" value="' + esc(val) + '"><small class="f-sub">' + esc(sub) + '</small></div>');
        }
      });
      if (!lines.length) {
        return '<p class="sp-desc">' + (after
          ? '这个运动没有勾选要记录的数据，可以直接「跳过不记录」。'
          : '这个运动没有勾选要记录的数据，可以直接保存。') + '</p>';
      }
      return '<div class="form-grid">' + lines.join('') + '</div>';
    }

    /* 今日已记录明细（只有从某个运动点「补数据」时才有意义） */
    let listHtml = '';
    if (!editing && todayRecs.length) {
      const sum = key === 'steps'
        ? '合计 <b>' + todayRecs.reduce(function (a, x) { return a + (Number(x.steps) || 0); }, 0).toLocaleString() + ' 步</b>'
        : '共 <b>' + todayRecs.length + ' 次</b>';
      listHtml = '<div class="sp-reclist"><div class="sp-reclist-h"><span>今日已记录 · ' + todayRecs.length + ' 条</span><span>' + sum + '</span></div>' +
        todayRecs.map(function (x) {
          return '<div class="sp-recrow"><span class="rt">' + esc(moveRecSummary(x)) + '</span>' +
            '<span class="rtime">' + esc(moveRecHM(x)) + '</span>' +
            '<span class="ra">' +
              '<button type="button" class="lnk" data-rec-edit="' + x.id + '">修改</button>' +
              '<button type="button" class="lnk danger" data-rec-del="' + x.id + '">删除</button>' +
            '</span></div>';
        }).join('') + '</div>';
    }

    /* v179：新建记录只列可用模式；编辑一条历史记录时，把它自己的模式补进来 */
    const typeKeys = MOVE_PICKABLE.slice();
    if (MOVE_TYPES[key] && MOVE_TYPES[key].retired && typeKeys.indexOf(key) < 0) typeKeys.push(key);
    const typeOpts = typeKeys.map(function (k) {
      return '<option value="' + k + '"' + (key === k ? ' selected' : '') + '>' + MOVE_TYPES[k].icon + ' ' + esc(MOVE_TYPES[k].name) +
        (MOVE_TYPES[k].retired ? '（已下线）' : '') + '</option>';
    }).join('');
    /* v184：mode='after' = 「运动后数据」弹窗（打卡后填、或补数据时填） */
    const mode = opts.mode || '';
    const isAfter = mode === 'after';
    const isPending = isAfter || !!(rec && rec.pending);
    const nth = (isPending && sport) ? moveRecsOfSport(sport, todayStr()).length : 0;
    const title = isAfter
      ? (key === 'steps'
        ? ('补充运动数据 · ' + MOVE_TYPES[key].name)
        : (rec && rec.pending
          ? ('记录第 ' + nth + ' 次运动数据 · ' + MOVE_TYPES[key].name)
          : ('补填运动数据 · ' + MOVE_TYPES[key].name)))
      : (editing ? '修改记录'
        : (key === 'steps' ? ('记录步数 · ' + MOVE_TYPES[key].name)
          : (sport ? ('补充运动数据 · ' + MOVE_TYPES[key].name) : '添加记录')));

    let head = '<h3>' + esc(title) + '</h3>';
    if (isAfter) {
      head += '<p class="sp-hint">' + (key === 'steps'
        ? '今天的步数已经达标。下面补一条这次运动的运动后数据；填完就收工，不填可以选「跳过不记录」，之后点卡片右上角的「待补」补上。'
        : (rec && rec.pending
          ? '这一次已经算完成。填完数据（或选择跳过）后，才能开始今天的下一次。跳过后可以点卡片右上角的「待补」补填。'
          : '这次当时跳过了记录数据。补上运动后数据就好；现在不想补可以点「取消」，它还留在「补数据」列表里。')) + '</p>';
    } else if (isPending) {
      head += '<p class="sp-hint">这一次已经算完成。填完数据（或选择跳过）后，才能开始今天的下一次。</p>';
    }
    if (sport || editing) {
      head += '<div class="form-grid">' +
        '<div class="field"><span>日期</span><input name="d" type="date" value="' + esc(dfltD) + '"' + (editing ? '' : '') + '></div>' +
        '</div>';
    } else {
      /* v197：＋添加记录时让用户选「属于哪个运动」。
         原来这类记录不写 sportId，只能按运动类型猜归属 ——
         同类型有两个实例（比如两个「跑步」）时归属不清，删掉实例还会变成没人管的孤儿。 */
      const sportOpts = opts.add ? moveSports().map(function (sp) {
        const TT = MOVE_TYPES[sp.key] || MOVE_TYPES.steps;
        return '<option value="' + esc(sp.id) + '" data-k="' + esc(sp.key) + '">' +
          esc(TT.icon) + ' ' + esc(sp.name) + '</option>';
      }).join('') : '';
      head += '<div class="form-grid">' +
        '<div class="field"><span>运动模式</span><select name="key">' + typeOpts + '</select></div>' +
        (sportOpts ? '<div class="field"><span>属于哪个运动</span><select name="sportId">' + sportOpts + '</select></div>' : '') +
        '<div class="field"><span>日期</span><input name="d" type="date" value="' + esc(dfltD) + '"></div>' +
        '</div>';
    }
    head += '<div class="field"><span>任务完成时间</span><input name="t" type="time" value="' + esc(dfltT) + '"><small class="f-sub">记录本次运动结束的时间</small></div>';

    /* v188：达标后自动弹的那条（记录处于「待填数据」）必须二选一 —— 跳过，或把数据填了。
       点「取消」只是关掉弹窗、数据一点没改，记录仍是待填，等于把用户卡在「弹窗关了、入口也没了」。
       从「待补 N」列表点「补填」进来的那条（已跳过）保留「取消」：随时可以退出去看别的。 */
    const mustSettle = !!(rec && rec.pending && !rec.skipped);
    openModal(
      '<form class="modal-card" id="move-record-form" data-sport="' + (sportId || '') + '" data-rec="' + (rec ? rec.id : '') + '" data-for="' + (sport ? 'sport' : '') + '" data-mode="' + esc(mode) + '"' + (mustSettle ? ' data-must-settle="1"' : '') + '>' +
        head +
        '<div id="move-record-body">' + fieldsHtml(key, rec, mode) + '</div>' +
        listHtml +
        '<div class="modal-actions">' +
          '<span class="spacer"></span>' +
          (isPending ? '<button type="button" class="btn ghost" data-act="move-skip" data-rec="' + rec.id + '">跳过不记录</button>' : '') +
          (mustSettle ? '' : '<button type="button" class="btn ghost" data-act="close-modal">取消</button>') +
          '<button type="submit" class="btn primary">' + (editing ? '更新这条' : '保存') + '</button>' +
        '</div>' +
      '</form>');

    const f = $('#move-record-form');
    const ksel = f.querySelector('[name="key"]');
    if (ksel && !editing) {
      ksel.onchange = function () {
        $('#move-record-body').innerHTML = fieldsHtml(ksel.value, null, mode);
      };
    }
    /* v197：模式是主、实例从属 —— 换模式就换到对应类型的实例，换实例就换模式。
       两者对不上时（这个类型还没有实例）不硬挂实例，记录按类型归类即可。 */
    const ssel = f.querySelector('[name="sportId"]');
    if (ssel && ksel) {
      const fillSports = function () {
        const k = ksel.value;
        const list = moveSports().filter(function (sp) { return sp.key === k; });
        ssel.innerHTML = list.length
          ? list.map(function (sp) {
              const TT = MOVE_TYPES[sp.key] || MOVE_TYPES.steps;
              return '<option value="' + esc(sp.id) + '">' + esc(TT.icon) + ' ' + esc(sp.name) + '</option>';
            }).join('')
          : '<option value="">（这个模式还没有运动实例）</option>';
        ssel.disabled = !list.length;
      };
      ksel.onchange = function () {
        fillSports();
        $('#move-record-body').innerHTML = fieldsHtml(ksel.value, null, mode);
      };
      ssel.onchange = function () {
        const sp = moveSportById(ssel.value);
        if (sp) ksel.value = sp.key;
        $('#move-record-body').innerHTML = fieldsHtml(ksel.value, null, mode);
      };
      fillSports();
    }
    f.querySelectorAll('[data-rec-edit]').forEach(function (b) {
      b.onclick = function (e) {
        e.preventDefault();
        moveRecordModal({ recordId: b.dataset.recEdit });
      };
    });
    f.querySelectorAll('[data-rec-del]').forEach(function (b) {
      b.onclick = function (e) {
        e.preventDefault();
        moveDelRecord(b.dataset.recDel, true);
      };
    });
  }

  /* v184：这个运动「运动后数据」要填的字段清单。
     有 sport 就只认它勾选的；没有 sport（顶部＋添加记录）就按模式的全集。 */
  function moveDataFields(sport, key) {
    const T = MOVE_TYPES[key];
    if (!T) return [];
    if (sport && Array.isArray(sport.fields)) return sport.fields.slice();
    return T.fields.map(function (f) { return f.k; });
  }
  /* 这条记录在指定字段里有没有填上有效数据（0 与空串都算没填） */
  function moveFieldsFilled(rec, keys) {
    const T = MOVE_TYPES[rec.key];
    if (!T) return false;
    return keys.some(function (k) {
      const f = T.fields.find(function (x) { return x.k === k; });
      if (!f) return false;
      const v = rec[k];
      if (f.type === 'text' || f.type === 'select') return !!String(v == null ? '' : v).trim();
      return Number(v) > 0;
    });
  }
  /* 给某条记录打上「待填运动后数据」的标记 */
  function markMovePending(recId) {
    const m = moveModule();
    if (!Array.isArray(m.records)) return;
    m.records = m.records.map(function (r) {
      return r.id === recId ? Object.assign({}, r, { pending: true }) : r;
    });
    m.updatedAt = new Date().toISOString();
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    /* v188：打完标记要重绘卡片 —— 否则卡片还停在「已完成 · 点击撤销」，
       用户看到的和存档里的「待填」状态不一致（v187 前取消掉弹窗就会卡住）。 */
    render();
  }

  function saveMoveRecordForm(form) {
    const get = function (n) { const el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    const isAfter = form.dataset.mode === 'after';
    const recId = form.dataset.rec || '';
    /* v184：补「运动后数据」时表单里没有步数/记录方式，
       要以原记录为基底，别把已有的步数冲成 0。 */
    const prev = recId ? (moveRecords().find(function (r) { return r.id === recId; }) || null) : null;
    /* v197：＋添加记录时实例来自表单里的「属于哪个运动」。
       实例只决定这条记录**归谁**（写 sportId），不决定能填哪些字段 ——
       手动补录不该受某个实例「勾了哪些数据项」的限制（比如「球类运动」没勾数据项，
       补一条时长也该能存进去）。所以 add 模式下字段与校验仍按类型默认。 */
    const isAddNew = !recId && !form.dataset.sport;
    const sportSel = get('sportId');
    const sport0 = sportSel ? moveSportById(sportSel) : null;
    const sportId = form.dataset.sport || (sport0 ? sport0.id : '');
    const sport = isAddNew ? null : (sportId ? moveSportById(sportId) : null);
    /* 编辑保留原记录的 key；否则用用户选的模式。
       注意用 prev（原记录）而不是 rec —— rec 在下面才声明，这里取会撞 const 暂时性死区。 */
    const key = prev ? prev.key : (get('key') || (sport ? sport.key : 'steps'));
    if (!MOVE_TYPES[key]) { toast('请选择运动模式'); return; }
    const num = function (v) { return isFinite(Number(v)) ? Math.max(0, Number(v)) : 0; };
    const d = /^\d{4}-\d{2}-\d{2}$/.test(get('d')) ? get('d') : todayStr();
    const t = /^([01]\d|2[0-3]):[0-5]\d$/.test(get('t')) ? get('t') : '18:00';
    const dt = new Date(d + 'T' + t + ':00');
    const at = isNaN(dt.getTime()) ? new Date().toISOString() : dt.toISOString();
    const rec = {
      id: recId || uid(),
      sportId: sportId || '',
      key: key,
      d: d,
      at: at,
      hour: Number(t.slice(0, 2)),
      steps: key === 'steps'
        ? (isAfter ? (prev ? (Number(prev.steps) || 0) : 0) : num(get('steps')))
        : 0,
      recMode: key === 'steps'
        ? (isAfter
          ? (prev ? (prev.recMode || 'manual') : 'manual')
          /* v187：打卡表单里已经没有记录方式控件 —— 跟运动自己的设置走，
             别再回落到 manual（固定步数的运动点了「添加记录」也不会被改标签） */
          : (sport ? (sport.recMode === 'fixed' ? 'fixed' : 'manual')
            : (get('recMode') === 'fixed' ? 'fixed' : 'manual')))
        : ''
    };
    /* v179：这个模式定义了哪些数据项，就按类型读哪些，不再写死字段 */
    (MOVE_TYPES[key].fields || []).forEach(function (f) {
      const raw = get(f.k);
      /* 补数据时没填的项保留原值，别把已有数据抹掉。
         v187：锁定的运动后数据（distM）在编辑表单里是只读的、没有 input，
         这里也必须保留原值，否则一保存就把距离冲成 0。 */
      if (raw === '' && prev && prev[f.k] !== undefined && (isAfter || f.k === 'distM')) {
        rec[f.k] = prev[f.k];
        return;
      }
      if (f.type === 'text' || f.type === 'select') {
        if (raw) rec[f.k] = raw.slice(0, 16);
      } else if (raw !== '') {
        rec[f.k] = num(raw);
      }
    });
    if (key === 'steps' && !rec.steps && !isAfter) { toast('请填写步数'); return; }
    /* v184：空数据不许提交 —— 至少要有一项有效数据。
       运动后数据弹窗看的是「勾选的那些项」；步数本身已经有数了，
       不算作运动后数据，所以补距离时必须真的填一个数。 */
    if (isAfter) {
      const keys = moveDataFields(sport, key);
      if (!moveFieldsFilled(rec, keys)) {
        toast(keys.length ? '至少填写一项有效数据' : '这个运动没有勾选要记录的数据，请点「跳过不记录」');
        return;
      }
    } else if (key !== 'steps') {
      const keys = moveDataFields(sport, key);
      if (!moveFieldsFilled(rec, keys)) { toast('至少填写一项有效数据'); return; }
    }
    /* v181：存了数据就说明这一次处理完了，清掉待填/跳过标记 */
    rec.pending = false;
    rec.skipped = false;
    /* v198：记录每次改动都盖一个时间戳 —— 并发合并时靠它判新旧 */
    rec.updatedAt = new Date().toISOString();
    /* v197：补了距离就把「这一天已经补过」记在运动实例上（distLocked）。
       这样删掉记录也不会解锁，当天补不了第二次。 */
    if (key === 'steps' && Number(rec.distM) > 0 && sport && sport.id) {
      const sp = (state.modules && state.modules.move && Array.isArray(state.modules.move.sports))
        ? state.modules.move.sports.find(function (x) { return x && x.id === sport.id; }) : null;
      if (sp) {
        if (!isPlainObject(sp.distLocked)) sp.distLocked = {};
        sp.distLocked[d] = true;
      }
    }
    if (!state.modules) state.modules = {};
    const m = moveModule();
    if (!Array.isArray(m.records)) m.records = [];
    if (recId) {
      m.records = m.records.map(function (r) { return r.id === recId ? normalizeMoveRecord(rec) : r; });
    } else {
      m.records.push(normalizeMoveRecord(rec));
    }
    m.updatedAt = new Date().toISOString();
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    closeModal();
    render();
    /* v184：每日步数达标 → 紧接着弹「补充运动数据（距离）」。
       距离写在**同一条**步数记录上，不另开记录，免得统计里次数翻倍。 */
    if (key === 'steps' && !isAfter && sport) {
      const p = moveProgress(sport, d);
      if (p.val >= p.target) {
        const dkeys = moveDataFields(sport, key);
        /* v185：这个运动一个运动后数据都没勾选时，不弹空白补充弹窗
           （否则用户只能点「跳过不记录」，等于白弹一次） */
        if (!dkeys.length) {
          toast('步数达标了 · ' + p.val + ' / ' + p.target + ' 步');
          return;
        }
        /* 已经在「记录步数」里顺手填了运动后数据（比如距离），就不用再弹一次 */
        if (!moveFieldsFilled(rec, dkeys)) {
          markMovePending(rec.id);
          moveRecordModal({ sportId: sport.id, recordId: rec.id, mode: 'after' });
        }
        toast('步数达标了 · ' + p.val + ' / ' + p.target + ' 步');
        return;
      }
    }
    toast(recId ? '已更新这条记录' : '已记录');
  }

  function saveMoveNotify(form) {
    if (!state.modules) state.modules = {};
    const m = moveModule();
    m.notify = !!form.querySelector('[name="notify"]').checked;
    /* v177：渠道改由「新建 / 编辑运动」弹窗管理，这里不再读写，免得把已选渠道冲成默认值 */
    if (!Array.isArray(m.notifyChannels) || !m.notifyChannels.length) m.notifyChannels = ['browser'];
    /* v216：notifyScenes 假开关已撤，不再写入（旧数据保留不删） */
    m.updatedAt = new Date().toISOString();
    state.modules.move = m;
    state.modulesAt = Date.now();
    save(); render();
    toast('提醒设置已保存');
  }

  /* 每日步数「每次记录固定步数」：点一下直接累加，不弹输入框（v176 陛下指出过） */
  function movePushFixed(s) {
    const m = moveModule();
    if (!Array.isArray(m.records)) m.records = [];
    const now = new Date();
    m.records.push(normalizeMoveRecord({
      sportId: s.id, key: s.key, d: todayStr(), at: now.toISOString(), hour: now.getHours(),
      steps: s.fixedSteps, recMode: 'fixed', updatedAt: now.toISOString()
    }));
    m.updatedAt = now.toISOString();
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    render();
    const p = moveProgress(s, todayStr());
    /* v184：固定步数也一样 —— 达标后紧接着补「运动后数据（距离）」 */
    if (p.val >= p.target && moveDataFields(s, s.key).length) {
      const last = m.records[m.records.length - 1];
      if (last) {
        markMovePending(last.id);
        moveRecordModal({ sportId: s.id, recordId: last.id, mode: 'after' });
        toast('步数达标了 · ' + p.val + ' / ' + p.target + ' 步');
        return;
      }
    }
    toast(p.val >= p.target
      ? ('已记录 +' + s.fixedSteps + ' 步 · 今日达标 ' + p.val + ' / ' + p.target)
      : ('已记录 +' + s.fixedSteps + ' 步 · 累计 ' + p.val + ' / ' + p.target + ' 步'));
  }

  function moveDoSport(id) {
    const s = moveSportById(id);
    if (!s) return;
    if (moveIsRest(s)) { toast('今天是这项运动的休息日，按计划休息'); return; }
    /* v181：上一次还没记录数据时，「去运动」直接转成「记录数据」，绝不加次数 */
    const pend = movePendingRec(s);
    if (pend) { moveRecordModal({ sportId: id, recordId: pend.id }); return; }
    if (moveSportDone(s, todayStr())) { moveUndoSport(id); return; }
    if (s.key === 'steps') {
      if (s.recMode === 'fixed') { movePushFixed(s); return; }
      moveRecordModal({ sportId: id });
      return;
    }
    /* 非步数（v181）：先记一条「待填数据」的记录 —— 算这次运动已完成，
       然后立刻打开数据表单；填完或明确跳过，主按钮才回到「去运动」。 */
    const m = moveModule();
    if (!Array.isArray(m.records)) m.records = [];
    const now = new Date();
    const rec = normalizeMoveRecord({
      sportId: s.id, key: s.key, d: todayStr(), at: now.toISOString(),
      hour: now.getHours(), pending: true
    });
    m.records.push(rec);
    m.updatedAt = now.toISOString();
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    render();
    moveRecordModal({ sportId: id, recordId: rec.id, mode: 'after' });
  }

  /* v181：跳过记录这次的详细数据 —— 仍算完成，但统计里看不到时长/距离等，先讲清楚再跳 */
  function moveSkipConfirm(recId) {
    openModal(
      '<div class="modal-card" style="max-width:440px">' +
        '<h3>跳过不记录这次的数据？</h3>' +
        '<p class="sp-hint" style="margin:12px 0 0;font-size:12.5px">' +
          '跳过之后，这一次运动仍然算完成；但<b>数据统计页不会显示它的详细数据</b>' +
          '（时长、距离、配速、心率等）。之后也可以点卡片右上角的「待补」补录。' +
        '</p>' +
        '<div class="modal-actions">' +
          '<span class="spacer"></span>' +
          '<button type="button" class="btn ghost" data-act="close-modal">回去填写</button>' +
          '<button type="button" class="btn primary" data-act="move-skip-ok" data-rec="' + esc(recId) + '">确定跳过</button>' +
        '</div>' +
      '</div>');
  }

  function moveSkipRec(recId) {
    const m = moveModule();
    if (!Array.isArray(m.records)) return;
    let hit = false;
    m.records = m.records.map(function (r) {
      if (r.id !== recId) return r;
      hit = true;
      return Object.assign({}, r, { pending: false, skipped: true, updatedAt: new Date().toISOString() });
    });
    if (!hit) { closeModal(); render(); return; }
    m.updatedAt = new Date().toISOString();
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    closeModal();
    render();
    toast('已跳过：这次算完成，统计里没有它的详细数据');
  }

  /* 撤销：删当天这条运动的最后一条记录（多次记录时逐条退，不会一次清空整天） */
  function moveUndoSport(id) {
    const s = moveSportById(id);
    if (!s) return;
    const recs = moveRecsOfSport(s, todayStr());
    if (!recs.length) { toast('今天还没有记录'); return; }
    const last = recs[recs.length - 1];
    const m = moveModule();
    /* v198：撤销也走软删除（留墓碑，防止另一台设备同步回来把它复活） */
    const delAt = new Date().toISOString();
    m.records = (m.records || []).map(function (r) {
      if (!r || r.id !== last.id) return r;
      return Object.assign({}, r, { deletedAt: delAt, updatedAt: delAt });
    });
    m.updatedAt = delAt;
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    render();
    toast('已撤销最后一条记录');
  }

  function moveDelSport(id) {
    const s = moveSportById(id);
    if (!s) return;
    const n = moveRecords().filter(function (r) { return r && r.sportId === id; }).length;
    if (!confirm('删除「' + s.name + '」？\n它的 ' + n + ' 条运动记录会一起删除，不能恢复。')) return;
    const m = moveModule();
    m.sports = (m.sports || []).filter(function (x) { return x.id !== id; });
    m.records = (m.records || []).filter(function (r) { return !(r && r.sportId === id); });
    m.updatedAt = new Date().toISOString();
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    render();
    toast('已删除 ' + s.name);
  }

  function moveEditRecord(rid) {
    if (!moveRecords().some(function (r) { return r.id === rid; })) return;
    moveRecordModal({ recordId: rid });
  }

  /* 删一条记录。keepOpen=true 时留在「补数据」弹窗里，重新打开它让列表刷新 */
  function moveDelRecord(rid, keepOpen) {
    const rec = moveRecords().find(function (r) { return r.id === rid; });
    if (!rec) return;
    /* v187：这条记录带着当天的运动后数据（距离）时，删除会把距离一起带走 —— 先说清楚 */
    let ask = '删除这条记录？\n' + moveRecSummary(rec);
    if (rec.key === 'steps' && Number(rec.distM) > 0) {
      ask += '\n\n注意：这条带着今天的运动后数据（距离 ' + rec.distM + ' 米）。' +
        '删掉它，今天的距离也一起消失。不过「今天已经补过」这件事会保留，当天不能再补第二次距离。';
    }
    if (!confirm(ask)) return;
    const m = moveModule();
    const sportId = rec.sportId;
    /* v198：软删除 —— 记录不真删，留个墓碑（deletedAt）。
       界面上立刻消失（moveRecords 过滤墓碑），但另一台设备的旧数据同步回来时
       不会把这条「复活」；30 天后墓碑自动清理。 */
    const delAt = new Date().toISOString();
    m.records = (m.records || []).map(function (r) {
      if (!r || r.id !== rid) return r;
      return Object.assign({}, r, { deletedAt: delAt, updatedAt: delAt });
    });
    m.updatedAt = delAt;
    state.modules.move = m;
    state.modulesAt = Date.now();
    save();
    if (keepOpen && sportId) {
      moveRecordModal({ sportId: sportId });
      render();
    } else {
      closeModal();
      render();
    }
    toast('已删除该条记录');
  }

  function saveMedForm(form) {
    const id = form.dataset.id || '';
    const get = n => {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const name = get('name');
    if (!name) return;
    const courseType = get('courseType') === 'short' ? 'short' : get('courseType') === 'prn' ? 'prn' : 'long';
    let times = [];
    if (courseType !== 'prn') {
      const slotEls = form.querySelectorAll('#time-slots input');
      if (!slotEls.length) {
        alert('请设置每日用药次数');
        return;
      }
      const seen = {};
      for (let i = 0; i < slotEls.length; i++) {
        const v = (slotEls[i].value || '').trim();
        if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) {
          alert('请把第 ' + (i + 1) + ' 次的时间填完整');
          return;
        }
        seen[v] = true;
      }
      times = Object.keys(seen).sort();
      if (!times.length) {
        alert('请至少设置一个服药时间');
        return;
      }
    }
    const startDate = get('startDate') || todayStr();
    const endDate = courseType === 'short' ? get('endDate') : '';
    if (courseType === 'short') {
      if (!endDate) {
        alert('短期疗程请填写结束日期');
        return;
      }
      if (endDate < startDate) {
        alert('结束日期不能早于开始日期');
        return;
      }
    }
    const stockRaw = get('stock');
    const mealTiming = get('mealTiming');
    let mealOffset = '';
    if (mealTiming === 'before' || mealTiming === 'after') {
      const rawOff = get('mealOffset');
      if (rawOff === 'custom') {
        const cv = Number(get('mealOffsetCustom'));
        if (isFinite(cv) && cv >= 0) mealOffset = Math.min(720, Math.round(cv));
      } else if (rawOff !== '') {
        const nv = Number(rawOff);
        if (isFinite(nv) && nv >= 0) mealOffset = Math.min(720, Math.round(nv));
      }
    }
    /* 库存：输入框里是「现在手里有多少」。
       - 留空 → 不跟踪
       - 数字和当前余量相同 → 什么都没变，保留原基线（否则历史扣减会被“洗掉”）
       - 数字不同 → 视为一次重新登记，把此刻设为新基线 */
    const existingMed = id ? medById(id) : null;
    const shownRemain = existingMed ? medStockRemain(existingMed) : null;
    const inputStock = stockRaw === '' ? null : Math.max(0, Number(stockRaw) || 0);
    let stockBase = '';
    let stockBaseAt = '';
    if (inputStock !== null) {
      if (existingMed && shownRemain !== null && Math.abs(inputStock - shownRemain) < 0.001) {
        stockBase = existingMed.stockBase;
        stockBaseAt = existingMed.stockBaseAt;
      } else {
        stockBase = inputStock;
        stockBaseAt = new Date().toISOString();
      }
    }

    const payload = {
      name: name,
      purpose: get('purpose') || '其他',
      form: get('form') || '片',
      strength: get('strength'),
      doseAmount: Math.max(0.01, Number(get('doseAmount')) || 1),
      doseUnit: get('doseUnit') || '片',
      times: times,
      mealTiming: mealTiming,
      mealOffset: mealOffset,
      courseType: courseType,
      startDate: startDate,
      endDate: endDate,
      reviewDate: courseType === 'long' ? get('reviewDate') : '',
      status: get('status') || 'active',
      stockBase: stockBase,
      stockBaseAt: stockBaseAt,
      stockReview: false,
      updatedAt: Date.now(),
      manufacturer: get('manufacturer'),
      medInfo: get('medInfo'),
      note: id ? ((medById(id) || {}).note || '') : ''
    };
    if (id) {
      const m = medById(id);
      if (m) Object.assign(m, payload);
    } else {
      payload.id = 'med_' + uid();
      payload.createdAt = new Date().toISOString();
      if (!Array.isArray(state.meds)) state.meds = [];
      state.meds.push(payload);
    }
    save();
    closeModal();
    render();
    toast(id ? '用药已更新' : '用药已添加');
  }

  function repairBackup(data) {
    const usedIds = new Set();
    const fixId = (prefix, raw) => {
      let id = String(raw == null ? '' : raw);
      if (!id || usedIds.has(id)) id = prefix + uid();
      usedIds.add(id);
      return id;
    };
    const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
    const list = v => (Array.isArray(v) ? v : []).filter(x => x && typeof x === 'object');
    const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
    const dateStr = v => {
      const s = String(v || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
      return fmt(parseD(s)) === s ? s : '';
    };

    const habits = list(data.habits)
      .filter(h => String(h.name || '').trim())
      .map(h => {
        const id = fixId('h_', h.id);
        return Object.assign({}, h, {
          id: id,
          name: String(h.name).trim().slice(0, 20),
          icon: String(h.icon || '✅').slice(0, 4),
          type: (h.type === 'quit' || h.type === 'smoke') ? h.type : 'build',
          target: clamp(parseInt(h.target, 10) || 1, 1, 99),
          unit: String(h.unit || '次').slice(0, 4),
          color: /^#[0-9a-f]{6}$/i.test(String(h.color || '')) ? String(h.color) : '#2f6f5e',
          note: String(h.note || '').slice(0, 40),
          pinned: PINNED_IDS.indexOf(id) >= 0,
          med: id === 'h_med',
          deadline: (String(h.type || 'build') === 'build' && (Number(h.target) || 1) <= 1
            && /^([01]\d|2[0-3]):[0-5]\d$/.test(String(h.deadline || ''))) ? String(h.deadline) : '',
          archivedAt: h.archivedAt ? String(h.archivedAt) : (h.archived === true ? new Date().toISOString() : ''),
          /* 小习惯 2.0：节奏只做结构校验，非法值归一成 daily 而不是抛错 */
          sched: (h.sched && typeof h.sched === 'object') ? schedOf(h) : undefined,
          notifyPlan: (h.notifyPlan && typeof h.notifyPlan === 'object')
            ? (sanitizeNotifyPlan(h.notifyPlan) || undefined) : undefined,
          updatedAt: (Number(h.updatedAt) > 0) ? Number(h.updatedAt) : 0
        });
      });

    const tasks = list(data.tasks)
      .filter(t => String(t.title || '').trim())
      .map(t => Object.assign({}, t, {
        id: fixId('t_', t.id),
        title: String(t.title).trim().slice(0, 80),
        note: String(t.note || '').slice(0, 300),
        status: has(STATUS, t.status) ? t.status : 'todo',
        tag: has(TAGS, t.tag) ? t.tag : '其他',
        priority: has(PRIO, t.priority) ? t.priority : '中',
        due: dateStr(t.due),
        doneAt: dateStr(t.doneAt) || null,
        prevStatus: has(STATUS, t.prevStatus) ? t.prevStatus : '',
        repeat: ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none',
        repeatTime: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.repeatTime || '')) ? t.repeatTime : '20:00',
        repeatWeekday: (Number(t.repeatWeekday) >= 0 && Number(t.repeatWeekday) <= 6)
          ? Math.round(Number(t.repeatWeekday))
          : (dateStr(t.due) ? parseD(dateStr(t.due)).getDay() : 0),
        repeatDay: (Number(t.repeatDay) >= 1 && Number(t.repeatDay) <= 31)
          ? Math.round(Number(t.repeatDay))
          : (dateStr(t.due) ? parseD(dateStr(t.due)).getDate() : 1),
        repeatNextId: String(t.repeatNextId || ''),
        repeatFrom: String(t.repeatFrom || '')
      }));

    const meds = list(data.meds)
      .filter(m => String(m.name || '').trim())
      .map(m => Object.assign({}, m, {
        id: fixId('med_', m.id),
        name: String(m.name).trim().slice(0, 30)
      }));

    const weights = list(data.weights)
      .map(w => normalizeWeightRecord(w))
      .filter(Boolean)
      .map(w => Object.assign(w, { id: fixId('w_', w.id) }));

    const essays = list(data.essays)
      .map(e => normalizeEssayRecord(e))
      .filter(Boolean)
      .map(e => Object.assign(e, { id: fixId('e_', e.id) }));

    let bodyProfile = normalizeBodyProfile(data.bodyProfile);
    if ((!bodyProfile.age || !bodyProfile.height) && weights.length) {
      const latestWeight = weights.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
      if (latestWeight && latestWeight.age && latestWeight.height) {
        bodyProfile = normalizeBodyProfile({ age: latestWeight.age, height: latestWeight.height });
      }
    }

    const cleanChecks = normalizeChecks(data.checks, list(data.events));

    const cleanDoses = {};
    Object.keys(obj(data.doses)).forEach(d => {
      const day = data.doses[d];
      if (!dateStr(d) || !day || typeof day !== 'object' || Array.isArray(day)) return;
      const outDay = {};
      Object.keys(day).forEach(mid => {
        const slots = day[mid];
        if (!slots || typeof slots !== 'object' || Array.isArray(slots)) return;
        const outSlots = {};
        Object.keys(slots).forEach(slot => {
          const entry = slots[slot];
          if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(slot) && slot.indexOf('prn_') !== 0) return;
          if (entry && typeof entry === 'object' && !Array.isArray(entry)) outSlots[slot] = entry;
        });
        if (Object.keys(outSlots).length) outDay[mid] = outSlots;
      });
      if (Object.keys(outDay).length) cleanDoses[d] = outDay;
    });

    const cleanMoods = normalizeMoods(data.moods);

    /* v78 前这里是「白名单」：只列上面这 14 个字段，其余一概丢弃。
       v68 加进来的 cravings / packs、v71 的 notices、v75 的 cardOrder、v76 的 countdowns
       全都没同步进来——导入那一刻它们被静默丢掉，紧接着 save() 又把这份残缺的 state
       推上云端，等于把用户数据直接抹掉（导出是全量、导入是白名单，两边从来就不对称）。
       现在改成：已知的新字段显式 normalize，**其余不认识的顶层键原样带过**。
       多带一个无害字段的代价是零，漏记一次的代价是用户的数据。 */
    const out = {
      version: 2,
      schemaVersion: SCHEMA_VERSION,
      view: 'today',
      habits: habits,
      /* 模块配置：导入旧备份时 habits 里还有四条锚点，normalizeModules 会从它们提取 */
      modules: normalizeModules(data.modules, habits),
      modulesAt: Math.max(0, Math.round(Number(data.modulesAt) || 0)),
      checks: cleanChecks,
      notes: obj(data.notes),
      moods: cleanMoods,
      events: list(data.events),
      meds: meds,
      doses: cleanDoses,
      tasks: tasks,
      bodyProfile: bodyProfile,
      weights: weights,
      essays: essays,
      cravings: normalizeCravings(data.cravings),
      packs: normalizePacks(data.packs),
      notices: normalizeNotices(data.notices),
      countdowns: normalizeCountdowns(data.countdowns),
      cardOrder: normalizeCardOrder(data.cardOrder),
      cardOrderAt: Math.max(0, Math.round(Number(data.cardOrderAt) || 0)),
      money: normalizeMoney(data.money),
      moneyAt: Math.max(0, Math.round(Number(data.moneyAt) || 0)),
      navOrder: normalizeNavOrder(data.navOrder),
      navOrderAt: Math.max(0, Math.round(Number(data.navOrderAt) || 0))
    };

    /* 兜底：以后再加顶层字段也不会被这张表吃掉 */
    Object.keys(data).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(out, k)) return;
      out[k] = data[k];
    });
    return out;
  }

  /* 从「导出备份 JSON」还原数据，让备份链条闭环。
     三条原则：
     1) 确认框必须让用户看到「要拿回什么」和「会失去什么」，不允许盲确认；
     2) 任一步失败都停手，绝不留半成品数据；
     3) 统一走 repairBackup 清洗，导入后的结构与主状态完全一致。 */
  function handleImport(e) {
    const input = e.target;
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;

    if (file.size > 20 * 1024 * 1024) {
      alert('导入失败：文件超过 20MB，不是本站导出的备份。');
      return;
    }

    const reader = new FileReader();
    reader.onerror = () => alert('导入失败：文件读取出错，请重新选择。');
    reader.onload = () => {
      let data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (err) {
        alert('导入失败：不是有效的 JSON 文件。');
        return;
      }
      if (!data || typeof data !== 'object' || Array.isArray(data) || (!Array.isArray(data.habits) && !Array.isArray(data.tasks))) {
        alert('导入失败：文件里没有习惯或待办数据，可能不是本站导出的备份。');
        return;
      }

      const n = v => (Array.isArray(v) ? v.length : 0);
      const summary = [
        '习惯 ' + n(data.habits) + ' 个',
        '待办 ' + n(data.tasks) + ' 条',
        '打卡 ' + Object.keys(data.checks || {}).length + ' 天',
        '药品 ' + n(data.meds) + ' 项',
        '体重 ' + n(data.weights) + ' 条',
        '随笔 ' + n(data.essays) + ' 篇'
      ].join(' · ');

      if (!confirm(
        '即将导入这份备份：\n' + summary + '\n\n' +
        '导入会整体替换当前的全部数据，之后无法撤销。\n' +
        '建议先点「导出备份 JSON」留一份当前数据。\n\n' +
        '确定继续吗？'
      )) return;

      try {
        migrateColors(data);
        const clean = repairBackup(data);
        migratePinned(clean);
        migrateMeds(clean);
        migrateQuitHabit(clean);
        ensureBreathingHabit(clean);
        state = clean;
        ensureStateMaps();
        if (Array.isArray(state.events) && state.events.length > 1000) state.events = state.events.slice(-1000);
        view = 'today';
        state.view = 'today';
        try { history.replaceState(null, '', '#today'); } catch (err) { /* file:// */ }
        selectedDate = todayStr();
        save();
        render();
        toast('导入成功');
      } catch (err) {
        alert('导入失败：' + (err && err.message ? err.message : '未知错误'));
      }
    };
    reader.readAsText(file);
  }

  function csvCell(value) {
    let s = String(value == null ? '' : value);
    if (/^[\s]*[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }

  /* ============================================================
     日历导出（.ics）
     系统日历是唯一「关掉网页也会响」的通道，而且不需要推送服务器：
     把用药时段、重复任务、带建议时间的习惯输出成标准 iCalendar，
     导入后交给 iOS 日历 / 安卓日历 / Outlook 到点提醒。

     两个细节决定它能不能真的用起来：
     1) 时间统一转成 UTC（Z 后缀）。中国没有夏令时，+8 换算绝对可靠，
        比写 TZID 再去定义 VTIMEZONE 稳得多。
     2) UID 用「业务类型-业务 id」，同一条日程重复导入只会覆盖，
        不会像流水账一样越导越多。
     ============================================================ */
  const ICS_DOMAIN = 'wanfeng-todo';
  const ICS_TZ = 'Asia/Shanghai';
  const ICS_WEEK = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  /* 北京时间固定 +8、没有夏令时，所以只要一个 STANDARD 块就够，
     不用跟着日历 App 的时区库走 */
  const ICS_VTIMEZONE = [
    'BEGIN:VTIMEZONE',
    'TZID:' + ICS_TZ,
    'BEGIN:STANDARD',
    'DTSTART:19700101T000000',
    'TZOFFSETFROM:+0800',
    'TZOFFSETTO:+0800',
    'TZNAME:CST',
    'END:STANDARD',
    'END:VTIMEZONE'
  ].join('\r\n');

  function icsEsc(v) {
    return String(v == null ? '' : v)
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  /* RFC 5545 折行：每行不超过 75 字节，续行以单个空格开头。
     中文一个字 3 字节，必须按字符累加字节数，不能按字符数切。 */
  function icsFold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    const out = [];
    let cur = '', curLen = 0;
    for (const ch of line) {
      const n = enc.encode(ch).length;
      if (curLen + n > 74) { out.push(cur); cur = ' ' + ch; curLen = 1 + n; }
      else { cur += ch; curLen += n; }
    }
    if (cur) out.push(cur);
    return out.join('\r\n');
  }

  function icsUtc(d) {
    return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
      'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + '00Z';
  }

  /* 本地时间字段，配合 DTSTART;TZID 使用。
     为什么不用 UTC：07:00 的事件换算成 UTC 是前一天 23:00，
     带 BYDAY 的每周重复就会被系统日历算到前一天去。 */
  function icsLocal(d) {
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
      'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00';
  }

  /* 按天推进但保留时分。全局 addDays() 只保留年月日，
     直接用在日程上会把 08:00 的药变成半夜 00:00。 */
  function icsAddDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
  }

  /* 把一个「北京时间的某天某时」换算成 UTC，供 RRULE 的 UNTIL 使用。
     手工减 8 小时，不经过浏览器时区，免得在非东八区打开时偏掉。 */
  function icsUtcCst(y, mo, day, hh, mm) {
    const t = new Date(Date.UTC(y, mo - 1, day, hh - 8, mm));
    return t.getUTCFullYear() + pad2(t.getUTCMonth() + 1) + pad2(t.getUTCDate()) +
      'T' + pad2(t.getUTCHours()) + pad2(t.getUTCMinutes()) + '00Z';
  }

  function icsEvent(uidStr, start, end, summary, desc, rrule) {
    const lines = [
      'BEGIN:VEVENT',
      'UID:' + uidStr + '@' + ICS_DOMAIN,
      'DTSTAMP:' + icsUtc(new Date()),
      'DTSTART;TZID=' + ICS_TZ + ':' + icsLocal(start),
      'DTEND;TZID=' + ICS_TZ + ':' + icsLocal(end),
      'SUMMARY:' + icsEsc(summary),
      'DESCRIPTION:' + icsEsc(desc || '来自 明序'),
      'TRANSP:TRANSPARENT'
    ];
    if (rrule) lines.push('RRULE:' + rrule);
    lines.push(
      'BEGIN:VALARM',
      'TRIGGER:-PT0M',
      'ACTION:DISPLAY',
      'DESCRIPTION:' + icsEsc(summary),
      'END:VALARM',
      'END:VEVENT'
    );
    return lines.map(icsFold).join('\r\n');
  }

  function buildICS() {
    const now = new Date();
    const today = todayStr();
    const out = [];
    let count = 0;

    out.push([
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//WanfengTodo//Reminder//CN',
      'CALSCALE:GREGORIAN',
      'X-WR-CALNAME:' + icsEsc('明序 提醒'),
      'X-WR-TIMEZONE:Asia/Shanghai',
      'REFRESH-INTERVAL;VALUE=DURATION:PT6H',
      'X-PUBLISHED-TTL:PT6H'
    ].map(icsFold).join('\r\n'));
    out.push(ICS_VTIMEZONE);

    /* 用药：每个服用时刻一条每日重复；有停药日就截止到那天 */
    (state.meds || []).forEach(m => {
      if (!m || m.status !== 'active') return;
      if (m.courseType === 'prn') return;        /* 备用药按需服用，没有固定时刻 */
      const times = (Array.isArray(m.times) ? m.times : [])
        .filter(t => /^\d{2}:\d{2}$/.test(String(t)));
      if (!times.length) return;
      const startDay = /^\d{4}-\d{2}-\d{2}$/.test(String(m.startDate || '')) ? m.startDate : today;
      /* 只有短期疗程才有结束日。长期服药即便填了 endDate 也不该停在日历里 */
      const endDay = (m.courseType === 'short' && /^\d{4}-\d{2}-\d{2}$/.test(String(m.endDate || '')))
        ? m.endDate : '';
      const dose = (Number(m.doseAmount) || 1) + String(m.doseUnit || m.form || '片');
      times.forEach(t => {
        const hm = t.split(':').map(Number);
        const base = parseD(startDay);
        let start = new Date(base.getFullYear(), base.getMonth(), base.getDate(), hm[0], hm[1]);
        while (start <= now) start = icsAddDays(start, 1);
        let rrule = 'FREQ=DAILY';
        if (endDay) {
          const e = parseD(endDay);
          const untilDate = new Date(e.getFullYear(), e.getMonth(), e.getDate(), hm[0], hm[1] + 15);
          if (untilDate < start) return;         /* 疗程已经结束的药不进日历 */
          rrule += ';UNTIL=' + icsUtcCst(e.getFullYear(), e.getMonth() + 1, e.getDate(),
            hm[0], hm[1] + 15);
        }
        out.push(icsEvent('med-' + m.id + '-' + t.replace(':', ''), start,
          new Date(start.getTime() + 15 * 60000),
          '💊 ' + String(m.name || '用药') + ' ' + dose,
          m.note || ('每天 ' + t), rrule));
        count++;
      });
    });

    /* 待办：单次任务只在还没过点时进日历；重复任务用 RRULE 表示 */
    (state.tasks || []).forEach(t => {
      if (!t || t.archivedAt || t.status === 'done' || t.status === 'cancelled') return;
      if (t.notify === false) return;            /* 通知开关：默认开 */
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.due || ''))) return;
      const repeat = ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none';
      const dueD = parseD(t.due);
      /* 日历是「日程」语义：填了开始时间就按它画，否则退回通知时间 */
      const hm = String(t.startTime || t.notifyTime || '09:00').split(':').map(Number);
      const durMin = (Number(t.duration) >= 15 && Number(t.duration) <= 720)
        ? Number(t.duration) : 15;
      let start, rrule = '';
      if (repeat === 'none') {
        if (String(t.due) < today) return;       /* 已经逾期的由横幅去催，别塞满日历 */
        start = new Date(dueD.getFullYear(), dueD.getMonth(), dueD.getDate(), hm[0], hm[1]);
        if (start <= now) return;
      } else {
        start = new Date(dueD.getFullYear(), dueD.getMonth(), dueD.getDate(), hm[0], hm[1]);
        if (repeat === 'daily') {
          rrule = 'FREQ=DAILY';
        } else if (repeat === 'weekly') {
          rrule = 'FREQ=WEEKLY;BYDAY=' + ICS_WEEK[clamp(Number(t.repeatWeekday) || dueD.getDay(), 0, 6)];
        } else {
          rrule = 'FREQ=MONTHLY;BYMONTHDAY=' + clamp(Number(t.repeatDay) || dueD.getDate(), 1, 31);
        }
        while (start <= now) {
          if (repeat === 'daily') start = icsAddDays(start, 1);
          else if (repeat === 'weekly') start = icsAddDays(start, 7);
          else start = new Date(start.getFullYear(), start.getMonth() + 1, start.getDate(), hm[0], hm[1]);
        }
      }
      out.push(icsEvent('task-' + t.id, start, new Date(start.getTime() + durMin * 60000),
        '📌 ' + String(t.title || '待办'), t.note || '', rrule));
      count++;
    });

    /* 习惯：只导出填了建议时间的（没有时间的打卡没法排进日历）。
       四个健康模块的锚点不在这里导出——它们由下面的模块循环接管。 */
    (state.habits || []).forEach(h => {
      if (!h || h.archivedAt || h.med || h.optional || h.type === 'quit' || isModuleAnchor(h)) return;
      if (h.notify === false) return;            /* 通知开关：默认开 */
      const st = String(h.suggestTime || '');
      if (!/^\d{2}:\d{2}$/.test(st)) return;
      const hm = st.split(':').map(Number);
      let start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hm[0], hm[1]);
      const freq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
      let rrule = 'FREQ=DAILY';
      if (freq === 'weekly') {
        const wd = clamp(Number(h.notifyWeekday) || 1, 0, 6);
        rrule = 'FREQ=WEEKLY;BYDAY=' + ICS_WEEK[wd];
        while (start <= now) start = icsAddDays(start, 7);
      } else if (freq === 'monthly') {
        const md = clamp(Number(h.notifyMonthday) || 1, 1, 31);
        rrule = 'FREQ=MONTHLY;BYMONTHDAY=' + md;
        while (start <= now) start = new Date(start.getFullYear(), start.getMonth() + 1, start.getDate(), hm[0], hm[1]);
      } else {
        while (start <= now) start = icsAddDays(start, 1);
      }
      out.push(icsEvent('habit-' + h.id, start, new Date(start.getTime() + 15 * 60000),
        String(h.icon || '🔔') + ' ' + String(h.name || '习惯'), h.note || '', rrule));
      count++;
    });

    /* 喝水模块的提醒时间点（v173）：与 api/ics.php 的 lb_water_slots 口径一致 */
    function waterNotifySlots(m, cups) {
      const TIME_OK = function (s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s || '')); };
      const mode = m.notifyMode === 'daily' ? 'daily' : 'each';
      if (mode === 'daily') {
        const n = [1, 2, 3].indexOf(Number(m.notifyDailyCount)) >= 0 ? Number(m.notifyDailyCount) : 2;
        const dt = isPlainObject(m.notifyDailyTimes) ? m.notifyDailyTimes : {};
        const names = ['morning', 'noon', 'afternoon'];
        const slots = [];
        for (let i = 0; i < n; i++) {
          const t = dt[names[i]];
          if (TIME_OK(t)) slots.push(t);
        }
        return slots;
      }
      const s = m.notifyStart || '08:00', e = m.notifyEnd || '21:00';
      if (!TIME_OK(s) || !TIME_OK(e)) return [];
      const sm = s.split(':').map(Number), em = e.split(':').map(Number);
      const sMin = sm[0] * 60 + sm[1], eMin = em[0] * 60 + em[1];
      const total = eMin > sMin ? eMin - sMin : eMin - sMin + 1440;
      const step = cups > 1 ? total / (cups - 1) : 0;
      const slots = [];
      for (let i = 0; i < cups; i++) {
        const mm = (sMin + Math.round(step * i)) % 1440;
        slots.push(pad2(Math.floor(mm / 60)) + ':' + pad2(mm % 60));
      }
      return slots;
    }

    /* 健康模块（水/运动/478）：喝水按 notifyMode 拆多时间点（v173），运动/478 仍单条。 */
    ['water', 'move', 'breathe'].forEach(function (key) {
      const m = state.modules && state.modules[key];
      if (!m || m.on === false || m.notify === false) return;
      const icon = String(m.icon || '🔔');
      const name = String(m.name || MODULE_LABEL[key]);

      if (key === 'water') {
        const cups = Math.max(1, Math.round(Number(m.cups) || 9));
        waterNotifySlots(m, cups).forEach(function (t, i) {
          const hm = t.split(':').map(Number);
          let start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hm[0], hm[1]);
          if (start <= now) start = icsAddDays(start, 1);
          out.push(icsEvent('habit-' + RECORD_IDS[key] + '-' + (i + 1), start, new Date(start.getTime() + 15 * 60000),
            icon + ' ' + name + ' · 第 ' + (i + 1) + ' 杯', m.note || '', 'FREQ=DAILY'));
          count++;
        });
        return;
      }

      /* v184：运动实例级提醒 —— 每个运动有自己的「运动开始时间」，
         按它自己的频率生成日历事件。有实例时间就不再出模块级那条。
         口径必须和 api/ics.php / api/schedule.php 一致。 */
      if (key === 'move') {
        const sports = Array.isArray(m.sports) ? m.sports : [];
        let instCount = 0;
        sports.forEach(function (sp) {
          if (!sp) return;
          const stt = String(sp.startTime || '');
          if (!/^\d{2}:\d{2}$/.test(stt)) return;
          const hm2 = stt.split(':').map(Number);
          let start2 = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hm2[0], hm2[1]);
          let rrule2 = 'FREQ=DAILY';
          if (String(sp.freqKind || 'daily') === 'weekly') {
            const sel = (Array.isArray(sp.weekSel) ? sp.weekSel : []).map(function (x) { return clamp(Number(x) || 0, 0, 6); });
            if (!sel.length) return;
            rrule2 = 'FREQ=WEEKLY;BYDAY=' + sel.map(function (d) { return ICS_WEEK[d]; }).join(',');
            while (start2 <= now) start2 = icsAddDays(start2, 7);
          } else {
            while (start2 <= now) start2 = icsAddDays(start2, 1);
          }
          const spname = String(sp.name || '运动');
          const spicon = String(sp.icon || '');
          out.push(icsEvent('sport-' + (sp.id || RECORD_IDS[key]), start2,
            new Date(start2.getTime() + 15 * 60000),
            (spicon ? spicon + ' ' : '') + spname, m.note || '', rrule2));
          count++;
          instCount++;
        });
        if (instCount) return;
      }

      /* v194：478 呼吸 —— 每天固定时间推送，做几组就有几个时间点。
         口径必须和 api/ics.php / api/schedule.php 一致。 */
      if (key === 'breathe') {
        /* 兜底：没存时间点就按「每天几组」算默认点，
           与 api/ics.php、api/schedule.php 完全同口径（否则 UID 一个带序号一个不带）。 */
        const times = (Array.isArray(m.notifyTimes) && m.notifyTimes.length)
          ? m.notifyTimes
          : breatheDefaultTimes(breatheGroups(m));
        let bn = 0;
        const seen = {};
        const bGroups = breatheGroups(m);
        times.forEach(function (t, i) {
          if (bn >= bGroups) return;   // 最多到「每天几组」那么多条（与后端一致）
          if (!/^\d{2}:\d{2}$/.test(String(t || ''))) return;
          /* v200：同一时刻只出一条（与 api/ics.php 同段逻辑）——
             推送去重键含时刻，重复时刻会让后一条被吃掉 */
          if (seen[t]) return;
          seen[t] = 1;
          const hm = t.split(':').map(Number);
          let start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hm[0], hm[1]);
          while (start <= now) start = icsAddDays(start, 1);
          out.push(icsEvent('habit-' + RECORD_IDS[key] + '-' + (i + 1), start, new Date(start.getTime() + 15 * 60000),
            icon + ' ' + name + ' · 第 ' + (i + 1) + ' 组', m.note || '', 'FREQ=DAILY'));
          count++;
          bn++;
        });
        if (bn) return;
      }

      const st = String(m.suggestTime || '');
      if (!/^\d{2}:\d{2}$/.test(st)) return;
      const hm = st.split(':').map(Number);
      let start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hm[0], hm[1]);
      const freq = ['daily', 'weekly', 'monthly'].indexOf(m.notifyFreq) >= 0 ? m.notifyFreq : 'daily';
      let rrule = 'FREQ=DAILY';
      if (freq === 'weekly') {
        const wd = clamp(Number(m.notifyWeekday) || 1, 0, 6);
        rrule = 'FREQ=WEEKLY;BYDAY=' + ICS_WEEK[wd];
        while (start <= now) start = icsAddDays(start, 7);
      } else if (freq === 'monthly') {
        const md = clamp(Number(m.notifyMonthday) || 1, 1, 31);
        rrule = 'FREQ=MONTHLY;BYMONTHDAY=' + md;
        while (start <= now) start = new Date(start.getFullYear(), start.getMonth() + 1, start.getDate(), hm[0], hm[1]);
      } else {
        while (start <= now) start = icsAddDays(start, 1);
      }
      out.push(icsEvent('habit-' + RECORD_IDS[key], start, new Date(start.getTime() + 15 * 60000),
        icon + ' ' + name, m.note || '', rrule));
      count++;
    });

    /* 还款日：每月固定一天，跟着 money.notify.on 走。
       **必须和 api/ics.php 里那段完全一致** —— 前端导出文件和订阅地址
       是两条路，一处口径不同就会出现「下载的日历有、订阅的没有」。

       due 是「每月几号」：超出当月天数时按月末（31 号在 2 月就是 28/29 号），
       跟后端 lb_schedule_debts 用同一个兜底。 */
    const mnt = (state.money && state.money.notify && typeof state.money.notify === 'object')
      ? state.money.notify : null;
    /* v211：清债模块停用后，还款日历条目一并停止（提醒跟着日历走） */
    if (isModuleOn('money') && mnt && mnt.on) {
      const [nh, nm] = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(mnt.time || ''))
        ? String(mnt.time).split(':').map(Number) : [9, 0];
      (Array.isArray(state.money.debts) ? state.money.debts : []).forEach(d => {
        if (!d || !(Number(d.balance) > 0.005)) return;
        const due = Math.round(Number(d.due));
        /* 0 / 空 = 没有具体还款日，不生成日历条目。
           跟 dayDebts()、api/ics.php 同一口径。 */
        if (!isFinite(due) || due < 1 || due > 31) return;
        /* 从本月开始找第一个「今天之后」的还款日 */
        let start = new Date(now.getFullYear(), now.getMonth(), 1, nh, nm);
        start = new Date(start.getFullYear(), start.getMonth(),
          Math.min(due, new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate()), nh, nm);
        let guard = 0;
        while (start <= now && guard < 40) {
          const ny = start.getFullYear(), nmo = start.getMonth() + 1;
          start = new Date(ny, nmo, Math.min(due, new Date(ny, nmo + 1, 0).getDate()), nh, nm);
          guard++;
        }
        const note = '还剩 ¥' + moneyFmt(d.balance) +
          ' · 最低 ¥' + moneyFmt(d.min) + ' · 年化 ' + (Number(d.apr) || 0) + '%';
        out.push(icsEvent('debt-' + d.id, start, new Date(start.getTime() + 15 * 60000),
          '💳 还款 · ' + String(d.name || '债务'), note, 'FREQ=MONTHLY;BYMONTHDAY=' + due));
        count++;
      });
    }

    out.push('END:VCALENDAR');
    return { text: out.join('\r\n') + '\r\n', count: count };
  }

  /* 移动端悬浮「+」：一处进入所有新建动作 */
  function quickAddModal() {
    const items = [
      { act: 'task-new', label: '待办', icon: 'board', desc: '安排一件要做的事' },
