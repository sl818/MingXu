  function cloudMaybePull() {
    /* 方案 A：不在后台自动拉取，避免覆盖内存里尚未保存的修改。 */
  }

  /* ============================================================
     指标计算
     ============================================================ */
  function countOf(d, id) {
    const day = state.checks[d];
    return (day && day[id]) || 0;
  }
  /* 这一天是否被明确记为「没做完」。与「压根没记录」区分开：
     前者是用户下过的判断（周条画 ✕），后者只是空白（周条留空）。 */
  function isSkipped(d, id) {
    const day = state.skips && state.skips[d];
    return !!(day && day[id]);
  }
  function setSkipped(d, id, on) {
    if (!state.skips) state.skips = {};
    if (on) {
      if (!state.skips[d]) state.skips[d] = {};
      state.skips[d][id] = 1;
    } else if (state.skips[d]) {
      delete state.skips[d][id];
      if (!Object.keys(state.skips[d]).length) delete state.skips[d];
    }
    save();
  }
  function setCount(d, id, value) {
    const v = Math.max(0, Math.round(value));
    if (!state.checks[d]) state.checks[d] = {};
    if (v <= 0) delete state.checks[d][id];
    else state.checks[d][id] = v;
    if (Object.keys(state.checks[d]).length === 0) delete state.checks[d];
    save();
  }
  /* ============================================================
     戒烟：事件流
     一次「想抽」只有两种结局：抽了(s) / 忍住了(r)。两个都要记——
     它们回答的不是同一个问题：s 是失守，r 是胜利。
     只让用户记 s 的话，人会因为「不想承认」而少记，数据就废了。
     不参与 checks 计数：checks 是「今天做了几次」的计数语义，
     混进去会让完成度、连续天数、月历每一处都要再判一次类型。
     ============================================================ */
  const CRAVE_TRIGGERS = [
    { k: 'meal',   label: '饭后' },
    { k: 'stress', label: '压力' },
    { k: 'social', label: '社交' },
    { k: 'bored',  label: '无聊' },
    { k: 'drive',  label: '开车' },
    { k: 'drink',  label: '喝酒' },
    { k: 'other',  label: '其他' }
  ];
  /* 习惯只有三类，靠 type 分，不再用子字段：
       build = 保持（早睡这类）：点一下 = 今天达标
       quit  = 戒除（不熬夜这类）：点一下 = 今天没守住，不点 = 一直守着
       smoke = 戒烟，站点自带的特殊常驻卡（只有 h_drink 一条）：
               双按钮「点一根 / 忍一次」+ 烟盒 + 买烟记录 + 抽烟趋势
     戒烟不放进「添加习惯」的类型下拉里——它是内置卡，不是可选类型。 */
  const QUIT_WORD = {
    quit:  { hero: '破', hold: '守', keep: '守住' },
    smoke: { s: '点一根', r: '忍一次', hero: '抽', hold: '忍', keep: '无烟',
             note: '想抽的时候点一下 · 抽了和忍住了都记', unit: '每天保持 0 根' }
  };

  /* 戒烟是独立类型；老数据里它是 type:'quit' + quitKind:'smoke'，
     迁移时会被改成 'smoke'（见 ensureStateMaps），这里兜一刀。 */
  function isSmoke(h) {
    return !!h && (h.type === 'smoke' || (h.type === 'quit' && h.quitKind === 'smoke'));
  }
  /* 两类都走事件流、都进统计：别用 type === 'quit' 判断，会漏掉戒烟 */
  /* 戒除语义类：quit（普通戒除）与 smoke（戒烟）共用「失守/守住」的行为模型，
     周条徽标、日历、月报、日志都在这一层——改名是为了诚实，不是拆行为。 */
  function isQuitSemantics(h) { return !!h && (h.type === 'quit' || h.type === 'smoke'); }

  /* 小习惯 2.0 铁律：sched 判定、notifyPlan、时间矩阵、提醒路由这些新逻辑
     一律用 isQuit（只认普通戒除），绝不碰戒烟——戒烟走自己的旧路径。
     见 docs/HABITS-NOTIFY-EXEC.md 批 0。 */
  function isQuit(h) { return !!h && h.type === 'quit'; }
  /* v204：戒除（quit）与戒烟（smoke）判定分家。
     戒烟靠「当天没点一根」自动成立；戒除不再自动打卡——从生效日起，
     必须当天点一次「完成」写进 checks 才算守住。
     生效日之前的历史沿用旧口径（没记失守即守住），既保住已有统计，
     也让固定时钟在生效日前的全部回归脚本不受影响。 */
  const QUIT_CHECKIN_FROM = '2026-11-27';
  function quitNeedsCheckin(h, d) {
    return !!h && h.type === 'quit' && !!d && d >= QUIT_CHECKIN_FROM;
  }
  /* 戒除的打卡方式（v79）：
     once  = 每日单次，点了就是破了，再点撤销（老行为）
     multi = 每日多次，一天可以记好几次（比如奶茶喝了两杯）
     **缺省 once**，所以所有老习惯零迁移、行为一点不变。
     戒烟（type:'smoke'）走自己的双按钮 + 烟盒，不用这个字段。 */
  function isMultiSlip(h) {
    return !!h && h.type === 'quit' && h.slipMode === 'multi';
  }

  function quitWord(h) { return QUIT_WORD[isSmoke(h) ? 'smoke' : 'quit']; }
  /* 按钮文案（含补记诱因弹窗、时间线条目）——只有戒烟有「两个结局」 */
  function craveCn(k, h) {
    const w = quitWord(h);
    return k === 's' ? w.s : w.r;
  }
  /* 当天「没守住」的次数。戒除/戒烟的事件都存 cravings，k==='s' 就是失守 */
  function quitSlips(h, d) {
    return dayCravings(h.id, d).filter(function (e) { return e.k === 's'; }).length;
  }
  /* 里程碑：粗粒度，太密会让人一直「差一点」，反而不想看 */
  const QUIT_MILESTONES = [1, 3, 7, 14, 30, 60, 90, 180, 365];
  const QUIT_MILE_CN = {
    1: '1 天', 3: '3 天', 7: '一周', 14: '两周', 30: '一个月',
    60: '两个月', 90: '三个月', 180: '半年', 365: '一年'
  };

  function craveList() {
    return Array.isArray(state.cravings) ? state.cravings : [];
  }
  /* 秒级时间戳 → 'YYYY-MM-DD' / 'HH:MM'（本地时区，和 todayStr 同一口径） */
  function tsDay(ts) { return fmt(new Date(Number(ts) * 1000)); }
  function tsHHMM(ts) {
    const d = new Date(Number(ts) * 1000);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  /* <input type="datetime-local"> 要的是 'YYYY-MM-DDTHH:MM'（本地时区，不带秒） */
  function dtLocalVal(ts) {
    const d = new Date(Number(ts) * 1000);
    return fmt(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function habitById(hid) {
    /* 模块的记录键（h_water 等）优先返回模块视图，别去读冻结锚点 */
    const key = moduleKeyOf(hid);
    if (key) return moduleAsHabit(key);
    return (state.habits || []).find(function (x) { return x.id === hid; }) || null;
  }
  function cravingsOf(hid) {
    return craveList().filter(function (e) { return e.h === hid; });
  }
  function dayCravings(hid, ds) {
    return cravingsOf(hid).filter(function (e) { return tsDay(e.t) === ds; });
  }
  function lastSmokeTs(hid) {
    const list = cravingsOf(hid);
    for (let i = list.length - 1; i >= 0; i--) if (list[i].k === 's') return list[i].t;
    return 0;
  }
  /* 戒烟起点：优先显式设置，否则退回习惯创建日 */
  function quitStartDay(h) {
    const s = String(h.quitStart || '');
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    return h.createdAt ? String(h.createdAt).slice(0, 10) : todayStr();
  }
  /* 连续无烟天数：今天 - 最后一次「抽了」那天。今天抽过就是 0；
     从没抽过则从戒烟起点算（含当天，所以 +1）。 */
  function quitStreak(h) {
    /* v204：生效日起戒除类看连续打卡；戒烟（smoke）与历史日期都不变 */
    if (quitNeedsCheckin(h, todayStr())) return streakOn(h, todayStr());
    const last = lastSmokeTs(h.id);
    const diff = Math.round((parseD(todayStr()) - parseD(last ? tsDay(last) : quitStartDay(h))) / 86400000);
    return Math.max(0, last ? diff : diff + 1);
  }
  /* 区间统计。days=0 表示只看今天，days>0 表示最近 N 天。 */
  function quitRange(h, days) {
    const t0 = parseD(todayStr()).getTime();
    let smoke = 0, resist = 0;
    cravingsOf(h.id).forEach(function (e) {
      const diff = Math.round((t0 - parseD(tsDay(e.t)).getTime()) / 86400000);
      if (days > 0 ? (diff >= days || diff < 0) : diff !== 0) return;
      if (e.k === 's') smoke++; else resist++;
    });
    const total = smoke + resist;
    return { smoke: smoke, resist: resist, total: total, rate: total ? resist / total : 0 };
  }
  /* 最长连续无烟段：扫全部「抽了」事件，求相邻两条之间的最大间隔 */
  function quitBest(h) {
    /* 只算戒烟起点之后的「点一根」。起点之前的记录属于上一轮，
       混进来会出现「累计 0 天 · 最长 4 天」这种自相矛盾。 */
    const startMs = parseD(quitStartDay(h)).getTime();
    const list = cravingsOf(h.id).filter(function (e) {
      return e.k === 's' && parseD(tsDay(e.t)).getTime() >= startMs;
    });
    if (!list.length) return quitStreak(h);
    let best = 0;
    let prev = startMs;
    list.forEach(function (e) {
      const cur = parseD(tsDay(e.t)).getTime();
      best = Math.max(best, Math.round((cur - prev) / 86400000));
      prev = cur;
    });
    return Math.max(best, quitStreak(h));
  }
  /* 累计无烟天数：起点到今天的天数 - 有「抽了」的天数 */
  function quitTotal(h) {
    const start = parseD(quitStartDay(h)).getTime();
    const span = Math.max(0, Math.round((parseD(todayStr()) - start) / 86400000)) + 1;
    const badDays = {};
    cravingsOf(h.id).forEach(function (e) { if (e.k === 's') badDays[tsDay(e.t)] = 1; });
    return Math.max(0, span - Object.keys(badDays).length);
  }
  /* 24 小时分布：只数「抽了」——想抽但忍住的那个时段，其实不是危险时段 */
  function craveHours(hid) {
    const bins = new Array(24).fill(0);
    cravingsOf(hid).forEach(function (e) {
      if (e.k !== 's') return;
      bins[new Date(Number(e.t) * 1000).getHours()]++;
    });
    return bins;
  }
  /* 失守诱因排行：只数「抽了」。
     把「忍住了」的诱因也混进来会出现「压力 7 次」但其实只抽了 3 根的矛盾，
     而且两件事回答的是不同的问题：什么是危险场景 vs 什么场景能扛住。 */
  function craveTriggers(hid) {
    const map = {};
    cravingsOf(hid).forEach(function (e) {
      if (!e.g || e.k !== 's') return;
      map[e.g] = (map[e.g] || 0) + 1;
    });
    return Object.keys(map).map(function (k) {
      const t = CRAVE_TRIGGERS.find(function (x) { return x.k === k; });
      return { k: k, label: t ? t.label : k, n: map[k] };
    }).sort(function (a, b) { return b.n - a.n; });
  }

  /* ===== 一包烟的区间（全部派生，一个字段都不存） =====
     「哪包在抽 / 抽到第几支 / 还剩几包」如果存成字段，就要维护：撤销、补记、
     改买烟日期、两台设备同时点，每条路径都会让它对不上（跟药品库存同一个道理）。
     规则：第 k 包起点 = max(这包的买烟时刻, 上一包抽完的时刻)，
           终点 = 第 size 支的记录时刻；不足 size 支就是还没抽完。
     max() 那一下就是「自动绑定下一包」——不用字段，也不用用户点「开新包」。
     一次买三条只抽第一条时，后两包的起点还在未来，天然就是库存。
     顺带解决：同一天买两包（at 相同）不再共用同一个计数窗口，两包各吃各的一段。 */
  function packSpans(h) {
    const packs = Array.isArray(state.packs) ? state.packs : [];
    const hits = cravingsOf(h.id).filter(function (e) { return e.k === 's'; })
      .sort(function (a, b) { return Number(a.t) - Number(b.t); });
    const out = [];
    let idx = 0, prevEnd = 0;
    packs.forEach(function (p) {
      const size = Math.max(1, Number(p.size) || 20);
      const openAt = Math.max(Number(p.at) || 0, prevEnd);
      const base = {
        pack: p, size: size, used: 0, openAt: openAt, closeAt: 0, done: false,
        cf: Math.round(Number(p.cf) || 0)
      };
      /* 上一包还没抽完（prevEnd 是无穷大），这包就还没拆，used 恒 0 */
      if (!isFinite(openAt)) { out.push(base); return; }
      let n = 0, end = 0;
      while (idx < hits.length && n < size) {
        const t = Number(hits[idx].t);
        if (t < openAt) { idx++; continue; }   /* 早于开包：属于更早的包，或者散烟 */
        n++; end = t; idx++;
      }
      base.used = n;
      base.done = n >= size;
      base.closeAt = base.done ? end : 0;
      out.push(base);
      prevEnd = base.done ? end + 1 : Infinity;
    });
    return out;
  }
  function spanOf(h, pack) {
    if (!pack) return null;
    const id = String(pack.id || '');
    const list = packSpans(h);
    for (let i = 0; i < list.length; i++) if (String(list[i].pack.id) === id) return list[i];
    return null;
  }
  /* 当前这包 = 第一个没抽满的；全抽满了就退回最后一包，用来展示「已抽完」状态 */
  function currentSpan(h) {
    const list = packSpans(h);
    if (!list.length) return null;
    for (let i = 0; i < list.length; i++) if (!list[i].done) return list[i];
    return list[list.length - 1];
  }
  function currentPack(h) {
    const sp = currentSpan(h);
    return sp ? sp.pack : null;
  }
  /* 这包抽掉几支。封顶到 size —— 超出部分归下一包，归不进去就是「未归包」的散烟 */
  function packUsed(h, pack) {
    const sp = spanOf(h, pack);
    return sp ? sp.used : 0;
  }
  /* 没归进任何一包的支数：库存空的时候抽的那些。
     它们不是脏数据 —— 那天确实抽了，只是当时手里没有这一批里的包。 */
  function packOrphans(h) {
    let total = 0, used = 0;
    cravingsOf(h.id).forEach(function (e) { if (e.k === 's') total++; });
    packSpans(h).forEach(function (sp) { used += sp.used; });
    return Math.max(0, total - used);
  }
  /* 还没轮到的包 = 库存 */
  function packStock(h) {
    const now = Math.round(Date.now() / 1000);
    return packSpans(h).filter(function (sp) { return !sp.done && sp.openAt > now; }).length;
  }
  /* 某一天结束时（23:59:59）正在抽的那包。历史日期要显示「那天的烟盒」，
     靠它才能知道那天还剩几支——用 currentSpan 会拿到今天的包，数字对不上。 */
  function spanOnDay(h, ds) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ds || ''))) return null;
    const end = Math.round(parseD(ds).getTime() / 1000) + 86399;
    let hit = null;
    packSpans(h).forEach(function (sp) {
      if (sp.openAt <= end) hit = sp;
    });
    return hit;
  }
  /* 这包截至 ts 已经抽掉几支（不含 ts 之后的记录） */
  function usedUntil(h, sp, ts) {
    if (!sp || sp.openAt > ts) return 0;
    if (sp.closeAt && sp.closeAt <= ts) return sp.size;
    let n = 0;
    cravingsOf(h.id).forEach(function (e) {
      if (e.k === 's' && Number(e.t) >= sp.openAt && Number(e.t) <= ts) n++;
    });
    return Math.min(n, sp.size);
  }
  /* 那天还能补几支：那包在那天结束时的剩余。0 表示那天已经抽完了。 */
  function backfillLeft(h, ds) {
    const sp = spanOnDay(h, ds);
    if (!sp) return 0;
    const end = Math.round(parseD(ds).getTime() / 1000) + 86399;
    return Math.max(0, sp.size - usedUntil(h, sp, end));
  }
  /* 补记用的时间槽：那天 06:00 起每 30 分钟一个，跳过已被占用的分钟。
     首末两支的真实时间由用户在卡面上确认（pack.cf），这里只要顺序对、不跨天。 */
  function backfillSlots(h, ds, n) {
    const base = Math.round(parseD(ds).getTime() / 1000);
    const taken = {};
    cravingsOf(h.id).forEach(function (e) {
      if (tsDay(e.t) === ds) taken[Math.round((Number(e.t) - base) / 60)] = 1;
    });
    const out = [];
    /* 起点不能早于这包的开包时刻：早于 openAt 的记录归不进这包，
       会变成「未归包」，补了等于白补。 */
    const sp = spanOnDay(h, ds);
    let m = 6 * 60;
    if (sp && Number(sp.openAt) > base) {
      m = Math.max(m, Math.ceil((Number(sp.openAt) - base) / 60));
    }
    while (out.length < n && m <= 23 * 60 + 30) {
      if (!taken[m]) { out.push(base + m * 60); taken[m] = 1; }
      m += 30;
    }
    /* 一天槽位被塞满的极端情况，直接往后排，保证条数不缺 */
    while (out.length < n) out.push(base + (out.length + 1) * 60);
    return out;
  }
  /* 库存为 0 且当前这包已经抽满 = 不能再记。
     这是库存模型的原意：一包 size 支，抽满就到底，没有下一包就没有下一支。
     不加这道闸，超出部分会被记成「未归包」，于是「今天抽了几支」能涨到 21，
     而烟盒和买烟记录仍然是 20/20 —— 两个数字打架，看起来就是算错了。 */
  function packBlocked(h) {
    const sp = currentSpan(h);
    if (!sp) return true;          /* 一条买烟记录都没有，先让他记一笔 */
    if (sp.openAt > Math.round(Date.now() / 1000)) return true;  /* 这包还没轮到拆 */
    return sp.done && packStock(h) === 0;
  }

  function packSpanText(sec) {
    const m = Math.max(0, Math.round(sec / 60));
    if (m < 60) return m + ' 分钟';
    const hh = Math.floor(m / 60), mm = m % 60;
    if (hh < 24) return hh + ' 小时' + (mm ? ' ' + mm + ' 分' : '');
    const dd = Math.floor(hh / 24), rh = hh % 24;
    /* 超过一周后小时粒度没意义，反而像在报秒表 */
    if (dd >= 7) return dd + ' 天';
    return dd + ' 天' + (rh ? ' ' + rh + ' 小时' : '');
  }

  function packSpanEnd(sp) { return sp.cf || sp.closeAt; }
  /* 抽完了算「首支 → 末支」，还在抽算「开包 → 现在」。
     补记会把末支的记录时间推后，所以末支允许用户确认一次（见 quitCard 的软确认条）。 */
  function packSpanTextOf(sp) {
    if (!sp) return '';
    const end = sp.done ? packSpanEnd(sp) : Math.round(Date.now() / 1000);
    return packSpanText(Math.max(0, end - sp.openAt));

  function packSpan(h, pack) {

  /* 上一包 vs 这一包：两边都按「首支 → 末支」算，不再用「下一包的开包时间」倒推 */
  function packCompareLine(h) {
    const spans = packSpans(h);
    if (spans.length < 2) return '';
    const cur = spans[spans.length - 1];
    const prev = spans[spans.length - 2];
    if (!prev.done) return '';
    const prevSpan = Math.max(0, packSpanEnd(prev) - prev.openAt);
    if (prevSpan <= 0) return '';
    if (!cur.done) return '上一包 ' + packSpanText(prevSpan) + ' 就抽完了';
    const curSpan = Math.max(0, packSpanEnd(cur) - cur.openAt);
    return '上一包 ' + packSpanText(prevSpan) + ' · 这一包 ' + packSpanText(curSpan);
  }

  /* d 省略 = 今天，画当前这包；传了历史日期就画「那天结束时的样子」，
     否则用户切到昨天看到的剩余是今天的，补记必然记错。 */
  function packGridHtml(h, d) {
    const isToday = !d || d === todayStr();
    const sp = isToday ? currentSpan(h) : spanOnDay(h, d);
    const used = isToday
      ? (sp ? sp.used : 0)
      : usedUntil(h, sp, Math.round(parseD(d).getTime() / 1000) + 86399);
    if (!sp) {
      return '<div class="pack-grid is-empty">' +
        '<button type="button" class="pack-open" data-act="pack-open">记一笔买烟</button>' +
      '</div>';
    }
    const filled = Math.min(used, sp.size);
    let cells = '';
    for (let i = 0; i < sp.size; i++) {

  }

  /* 省钱：按「累计无烟天数」折算，不用「连续」——
     复吸一次就把省下的钱清零，等于告诉用户「白戒了」，会让人干脆不记。 */
  function quitSaved(h) {
    const perDay = Number(h.quitPerDay) || 0;
    const price = Number(h.quitPackPrice) || 0;
    const pack = Math.max(1, Number(h.quitPackSize) || 20);
    if (!perDay || !price) return null;
    const days = quitTotal(h);
    const sticks = Math.round(days * perDay);
    return { days: days, sticks: sticks, money: sticks * (price / pack) };
  }

  function quitNextMile(streak) {
    const next = QUIT_MILESTONES.find(function (m) { return m > streak; });
    if (next === undefined) return null;
    const prev = QUIT_MILESTONES.filter(function (m) { return m <= streak; }).pop() || 0;
    const pct = clamp(Math.round((streak - prev) / (next - prev) * 100), 0, 100);
    return { days: next, left: next - streak, pct: pct };
  }

  function addCraving(hid, kind) {
    const h = habitById(hid);
    if (!isQuitSemantics(h)) return;
    if (kind !== 's' && kind !== 'r') return;
    /* 一包抽满、库存又是 0 时不再收这条记录。挡在数据层而不是只靠按钮的 disabled：
       disabled 能被回车提交绕过，也可能来自没刷新的旧页面。 */
    if (kind === 's' && isSmoke(h) && packBlocked(h)) {
      toast('这包已经抽完了 · 记一笔买烟后才能继续记');
      return;
    }
    if (!Array.isArray(state.cravings)) state.cravings = [];
    const now = Math.round(Date.now() / 1000);
    const last = state.cravings[state.cravings.length - 1];
    /* 手抖双击挡掉，但别挡「补记今天抽了几支」——那种是一分钟连点几次的。
       1 秒以内才算误触；有撤销兜底，漏记比错记更难忍。
       **多次破戒模式不挡**：一天两杯奶茶就是两次，用户可能一秒内连点，
       挡掉等于记不进去；误点有旁边的「撤销」兜底。 */
    if (!isMultiSlip(h) && last && last.h === hid && last.k === kind && now - last.t < 1) {
      toast('刚刚已经记过了');
      return;
    }
    /* 抽了就要记下来，任何时候都不拦——记录是事实，归包只是口径。
       但要让用户知道这一次落在哪里：接到下一包了，还是没包可归。 */
    const watchPack = isSmoke(h) && kind === 's';
    const doneBefore = watchPack ? packSpans(h).filter(function (x) { return x.done; }).length : 0;
    const orphBefore = watchPack ? packOrphans(h) : 0;
    state.cravings.push({ id: uid(), t: now, k: kind, h: hid, g: '', s: 0 });
    save();
    render();
    if (watchPack) {
      const doneAfter = packSpans(h).filter(function (x) { return x.done; }).length;

    } else {
      toast(kind === 's'
        ? (isMultiSlip(h)
            ? '又记一次 · 今天 ' + quitSlips(h, todayStr()) + ' 次'
            : '今天没守住 · 连续从今天重新数')

  }
  function undoCraving(hid) {
    const list = cravingsOf(hid);
    if (!list.length) return;
    const last = list[list.length - 1];
    state.cravings = craveList().filter(function (e) { return e.id !== last.id; });
    save();
    render();
    toast('已撤销：' + tsHHMM(last.t) + ' ' + craveCn(last.k, habitById(hid)));
  }

  function logHabit(id, delta) {
    if (!delta) return;
    if (!Array.isArray(state.events)) state.events = [];
    state.events.push({
      at: new Date().toISOString(),
      d: selectedDate,
      id: id,
      delta: delta
    });
    if (state.events.length > 1000) state.events = state.events.slice(-1000);
  }
  /* 服药也进操作日志：以前只有习惯打卡写 events，所以统计页永远看不到用药 */
  function logMed(medId, slot, delta, d) {
    if (!delta) return;
    if (!Array.isArray(state.events)) state.events = [];
    state.events.push({
      at: new Date().toISOString(),
      d: d || selectedDate,
      id: medId,
      delta: delta,
      kind: 'med',
      slot: slot || ''
    });
    if (state.events.length > 1000) state.events = state.events.slice(-1000);
  }

  function medById(id) {
    return (state.meds || []).find(m => m.id === id);
  }
  function isPrn(med) {
    return !!med && med.courseType === 'prn';
  }
  /* 饭前 / 饭后 标签 */
  /* 用餐前后：全站统一用「餐前 / 餐后 / 随餐 / 空腹」+ 口语化时长 */
  const MED_MEAL_CN = { before: '餐前', after: '餐后', with: '随餐', empty: '空腹' };
  const MED_CN_NUM = { 1: '一', 2: '两', 3: '三', 4: '四', 5: '五', 6: '六' };
  function cnCount(n) {
    return MED_CN_NUM[Number(n)] || String(Number(n) || 0);
  }
  function mealLabelOf(med) {
    return (med && med.mealTiming && MED_MEAL_CN[med.mealTiming]) || '';
  }
  /* 间隔时长口语化：0→立即 · 30→半小时 · 60→1 小时 · 90→1.5 小时 · 其余→N 分钟 */
  function offsetText(off) {
    const n = Number(off);
    if (!isFinite(n) || n < 0) return '';
    if (n === 0) return '立即';
    if (n === 30) return '半小时';
    if (n === 90) return '1.5 小时';
    if (n % 60 === 0) return (n / 60) + ' 小时';
    return n + ' 分钟';
  }
  /* 餐前/餐后 + 多久，例如「餐后半小时」「餐前 15 分钟」「随餐」 */
  function mealTimingText(med) {
    const base = mealLabelOf(med);
    if (!base) return '';
    if (med.mealTiming === 'with' || med.mealTiming === 'empty') return base;
    const raw = med ? med.mealOffset : '';
    if (raw === '' || raw === null || raw === undefined) return base;
    const t = offsetText(raw);
    if (!t) return base;
    return base + (/^\d/.test(t) ? ' ' : '') + t;
  }
  /* 今天是服药第几天：短期显示「第 5/7 天」，长期「第 12 天」 */
  function medDayText(med, d) {
    if (!med || isPrn(med) || !med.startDate) return '';
    const s = parseD(med.startDate), e = parseD(d || todayStr());
    if (!s || !e) return '';
    const n = Math.floor((e - s) / 86400000) + 1;
    if (!isFinite(n) || n < 1) return '';
    if (med.courseType === 'short' && med.endDate) {
      const t = Math.floor((parseD(med.endDate) - s) / 86400000) + 1;
      if (isFinite(t) && t >= n) return '第 ' + n + '/' + t + ' 天';
    }
    return '第 ' + n + ' 天';
  }
  /* 按次数给出默认时间点 */
  function defaultSlots(n) {
    const k = Math.max(1, Math.min(6, Number(n) || 1));
    if (k === 1) return ['08:00'];
    if (k === 2) return ['08:00', '20:00'];
    if (k === 3) return ['08:00', '12:00', '20:00'];
    if (k === 4) return ['08:00', '12:00', '18:00', '22:00'];
    const out = [];
    for (let i = 0; i < k; i++) {
      const h = 8 + Math.round(i * (13 / (k - 1)));
      out.push((h < 10 ? '0' : '') + h + ':00');
    }
    return out;
  }
  function timeSlotsHtml(times, n) {
    const k = Math.max(1, Math.min(6, Number(n) || 1));
    const def = defaultSlots(k);
    const cur = Array.isArray(times) ? times : [];
    const used = {};
    const vals = [];
    for (let i = 0; i < k; i++) {
      let v = cur[i] || '';
      if (!v || used[v]) {
        // 补一个还没用过的默认时间，避免新增槽位与已有时间重复
        v = def.filter(x => !used[x])[0] || def[i] || '08:00';
      }
      used[v] = true;
      vals.push(v);
    }
    return vals.map((v, i) => '<input type="time" name="slot' + i + '" value="' + esc(v) + '">').join('');
  }
  function medDoseSlots(med) {
    return med && Array.isArray(med.times) ? med.times.slice().sort() : [];
  }
  function medActiveOn(med, d) {
    if (!med || isPrn(med)) return false;
    if (med.status !== 'active' && d >= todayStr()) return false;
    if (med.startDate && d < med.startDate) return false;
    if (med.courseType === 'short' && med.endDate && d > med.endDate) return false;
    return true;
  }
  function medScheduledFor(d) {
    /* v209：用药停用后不再产生排期（提醒与日历同步停止），数据保留 */
    if (!isModuleOn('meds')) return [];
    const list = [];
    (state.meds || []).forEach(med => {
      if (!medActiveOn(med, d)) return;
      medDoseSlots(med).forEach(slot => list.push({ med: med, slot: slot }));
    });
    list.sort((a, b) => a.slot.localeCompare(b.slot));
    return list;
  }
  function medScheduledCount(d) {
    return medScheduledFor(d).length;
  }
  function doseAt(d, medId, slot) {
    const day = state.doses && state.doses[d];
    const m = day && day[medId];
    return m && m[slot];
  }
  function medTakenFor(d) {
    return medScheduledFor(d).filter(x => doseAt(d, x.med.id, x.slot));
  }
  function medTakenCount(d) {
    return medTakenFor(d).length;
  }
  function medAllTaken(d) {
    const s = medScheduledFor(d);
    return s.length > 0 && s.every(x => doseAt(d, x.med.id, x.slot));
  }
  function medNextDose(d) {
    return medScheduledFor(d).find(x => !doseAt(d, x.med.id, x.slot)) || null;
  }
  function hasMedDoses(d) {
    const day = state.doses && state.doses[d];
    return !!day && Object.keys(day).some(mid => day[mid] && Object.keys(day[mid]).length > 0);
  }
  function prnKeys(d, medId) {
    const m = state.doses && state.doses[d] && state.doses[d][medId];
    return m ? Object.keys(m).filter(k => k.indexOf('prn_') === 0) : [];
  }
  /* ===== 库存：基线 + 按记录推算 =====
     以前的实现是把「剩余数量」当成一个绝对数存进 med.stock，每次服药减一点。
     问题是这个数一旦因为冲突合并、丢写而偏差，就永久错了，而且系统没有任何办法发现。
     现在改成：只记录「某时刻我手里有多少」（stockBase + stockBaseAt），
     余量 = 基线 − 基线之后所有服药记录累计的剂量。
     因为 doses 在合并时是并集（只增不减），任何设备算出来的余量都一样；
     即使某次写入丢了，下一次重算会自动纠正。 */
  function medStockBaseAtMs(med) {
    if (!med) return 0;
    const raw = med.stockBaseAt;
    if (raw === '' || raw === null || raw === undefined) return 0;
    if (typeof raw === 'number') return raw;
    const t = new Date(raw).getTime();
    return isNaN(t) ? 0 : t;
  }
  function medStockBase(med) {
    if (!med) return null;
    const v = med.stockBase;
    if (v === '' || v === null || v === undefined) return null;
    const n = Number(v);
    return (isFinite(n) && n >= 0) ? n : null;
  }
  /* 基线之后已服的累计剂量（含按需记录）。撤销会删掉记录，所以余量会自动退回。 */
  function medStockUsed(med) {
    const base = medStockBaseAtMs(med);
    const per = Math.max(0.01, Number(med.doseAmount) || 1);
    const doses = state.doses || {};
    let n = 0;
    Object.keys(doses).forEach(function (d) {
      const day = doses[d] && doses[d][med.id];
      if (!day) return;
      Object.keys(day).forEach(function (slot) {
        const e = day[slot];
        if (!e || !e.at) return;
        const t = new Date(e.at).getTime();
        if (isNaN(t) || t <= base) return;
        n += per;
      });
    });
    return Math.round(n * 100) / 100;
  }
  function medStockRemain(med) {
    const base = medStockBase(med);
    if (base === null) return null;
    return Math.round(Math.max(0, base - medStockUsed(med)) * 100) / 100;
  }
  function medStockDays(med) {
    const remain = medStockRemain(med);
    if (remain === null) return null;
    const perDay = (Math.max(0.01, Number(med.doseAmount) || 1)) * medDoseSlots(med).length;
    if (!perDay) return null;
    return Math.floor(remain / perDay);
  }
  function medStockLabel(med) {
    const remain = medStockRemain(med);
    if (remain === null) return '';
    const days = medStockDays(med);
    const flag = med.stockReview ? ' · 待核对' : '';
    return '剩 ' + remain + ' ' + (med.doseUnit || '') + (days !== null ? '（约 ' + days + ' 天）' : '') + flag;
  }
  /* 基线登记日期，用于让人判断这个数字是不是旧了 */
  function medStockBaseLabel(med) {
    const ms = medStockBaseAtMs(med);
    if (!ms) return '';
    const d = new Date(ms);
    return (d.getMonth() + 1) + '-' + d.getDate() + ' 登记';
  }
  /* ---------- 库存盘点 ----------
     以前想校正余量，得点进每个药的编辑表单改「基线数量」，四个药就是四次弹窗。
     这里一次性填完：填「手里实际还剩多少」，以此为新的基线重新推算。 */
  function openStockCheck() {
    const list = (state.meds || []).filter(m => m.status === 'active' && medStockBase(m) !== null);
    if (!list.length) {
      toast('还没有可以盘点的药（需要有库存基线）');
      return;
    }
    const rows = list.map(m => {
      const remain = medStockRemain(m);
      const unit = m.doseUnit || m.form || '片';
      const since = medStockBaseLabel(m);
      const flag = m.stockReview ? '<span class="stock-flag"> · 待核对</span>' : '';
      return '<label class="stock-row">' +
        '<span class="stock-main">' +
          '<span class="stock-name">' + esc(m.name || '用药') + '</span>' +
          '<span class="stock-now">算出剩 ' + remain + ' ' + esc(unit) + flag +
            (since ? '<i> · ' + esc(since) + '</i>' : '') + '</span>' +
        '</span>' +
        '<input class="stock-input" type="number" min="0" step="0.5" inputmode="decimal" ' +
          'data-stock-for="' + esc(m.id) + '" placeholder="' + remain + '">' +
      '</label>';
    }).join('');
    openModal(
      '<div class="modal-card">' +
        '<h3>盘点库存</h3>' +
        '<p class="muted-sm" style="margin:0 0 6px">把手里<b>实际还剩多少</b>填进来。' +
        '系统会以此为新的基线，之后的余量从这一刻重新推算。留空的不动。</p>' +
        '<div class="stock-list">' + rows + '</div>' +
        '<p class="stock-hint">为什么要定期盘一次：余量是按服药记录推算的，' +
        '如果你有几天没记录、或者多买了一盒，推算值就会慢慢偏离实际。' +
        '盘一次等于校准，比让它一直错下去强。</p>' +
        '<div class="btn-row">' +
          '<button class="btn primary" data-act="stock-check-save">保存盘点</button>' +
          '<button class="btn" data-act="close-modal">取消</button>' +
        '</div>' +
      '</div>'
    );
  }

  function saveStockCheck() {
    const inputs = document.querySelectorAll('[data-stock-for]');
    if (!inputs.length) return;
    const now = new Date().toISOString();
    let n = 0;
    inputs.forEach(el => {
      const raw = String(el.value || '').trim();
      if (raw === '') return;                       /* 留空表示这个药不动 */
      const v = Number(raw);
      if (!isFinite(v) || v < 0) return;
      const med = (state.meds || []).find(m => m.id === el.dataset.stockFor);
      if (!med) return;
      med.stockBase = Math.round(Math.max(0, v) * 100) / 100;
      med.stockBaseAt = now;
      med.stockReview = false;                      /* 刚盘过，自然不再「待核对」 */
      n++;
    });
    if (!n) {
      toast('没有填任何数字');
      return;
    }
    closeModal();
    save();
    render();
    toast('已更新 ' + n + ' 种药的库存');
  }

  function medCourseLabelOn(med, d) {
    if (d >= todayStr()) {
      if (med.status === 'paused') return '已暂停';
      if (med.status === 'stopped') return '已停用';
      if (med.status === 'done') return '已完成';
    }
    if (isPrn(med)) return '按需';
    if (med.courseType === 'short') {
      if (med.startDate && d < med.startDate) return '未开始';
      if (med.endDate && d > med.endDate) return '已结束';
      if (med.startDate && med.endDate) {
        const total = Math.round((parseD(med.endDate) - parseD(med.startDate)) / 86400000) + 1;
        const cur = Math.round((parseD(d) - parseD(med.startDate)) / 86400000) + 1;
        return '短期 · 第 ' + Math.max(1, Math.min(cur, total)) + '/' + total + ' 天';
      }
      return '短期';
    }
    return '长期';
  }
  function medCourseLabel(med) {
    return medCourseLabelOn(med, todayStr());
  }
  function takeDose(d, medId, slot) {
    const med = medById(medId);
    if (!med) return false;
    if (!state.doses[d]) state.doses[d] = {};
    if (!state.doses[d][medId]) state.doses[d][medId] = {};
    if (state.doses[d][medId][slot]) return false;
    /* 库存不再在这里改：余量由「基线 − 记录」实时算出来，避免绝对数被写歪 */
    state.doses[d][medId][slot] = { at: new Date().toISOString() };
    logMed(medId, slot, 1, d);
    save();
    return true;
  }
  function undoDose(d, medId, slot) {
    const day = state.doses[d];
    if (!day || !day[medId] || !day[medId][slot]) return false;
    delete day[medId][slot];
    if (!Object.keys(day[medId]).length) delete day[medId];
    if (!Object.keys(day).length) delete state.doses[d];
    /* 记录删掉，余量自然退回，不需要再加数 */
    logMed(medId, slot, -1, d);
    save();
    return true;
  }
  function hasRecords(d) {
    const day = state.checks[d];
    if (day) {
      const hasVisibleCheck = Object.keys(day).some(id => {
        const h = habitById(id);
        return h && !isArchived(h) && Number(day[id]) > 0;
      });
      if (hasVisibleCheck) return true;
    }
    /* 运动 2.0：运动记录存 records 而非 checks，这里补一条「当天有运动记录」也算有记录 */
    if (moveRecords().some(function (r) { return r && r.d === d; })) return true;
    return hasMedDoses(d);
  }
  function met(h, d) {
    if (h.med) {
      const sched = medScheduledCount(d);
      return sched > 0 && medTakenCount(d) >= sched;
    }
    /* 运动 2.0（v175）：达标看「当天有任意运动完成」，见 moveMet()（含老数据回退） */
    if (h.id === 'h_move') {
      return moveMet(d);
    }
    /* v206（陛下定的口径）：喝水按**毫升**判达标。
       实现上等价于「喝满 每天几杯」（waterMlOf 的最后一杯会补齐差额，喝满 N 杯正好 = 目标 ml），
       但语义更明确 —— 以后改 waterMlOf 的分配公式时，不会再出现"杯数对了 ml 不对"的错位。 */
    if (h.id === 'h_water') {
      return waterMlOf(h, countOf(d, h.id)) >= waterGoalMl(h);
    }
    /* 戒烟（smoke）看事件不看计数：今天只要有一条「抽了」就不算达标。
       老数据里 checks 的残值不再参与判断（v5 迁移时已转成事件）。 */
    if (isSmoke(h)) {
      return !dayCravings(h.id, d).some(function (e) { return e.k === 's'; });
    }
    /* v204：戒除（quit）从生效日起必须主动打卡才算守住。
       一天里既没打卡也没记失守，就是「还没做」，不能再自动算完成。 */
    if (h.type === 'quit') {
      if (dayCravings(h.id, d).some(function (e) { return e.k === 's'; })) return false;
      if (quitNeedsCheckin(h, d)) return countOf(d, h.id) >= 1;
      return true;
    }
    const c = countOf(d, h.id);
    return c >= Math.max(1, Number(h.target) || 1);
  }
  function activeHabits(d) {
    /* 四个常驻模块的锚点不在习惯体系里了：它们由 moduleAsHabit() 单独提供 */
    return state.habits.filter(h => !h.optional && !isArchived(h) && !isModuleAnchor(h)
      && !(h.med && medScheduledCount(d) === 0));
  }
  /* 考核口径的唯一入口：普通习惯 + 四个模块。
     dayStats / 横幅 / 「还差几项」/ 日历页都从这里取，避免两套名单打架。 */
  /* 小习惯 2.0 的日口径：
     · 周期型（每周 N 次）不进日完成率，另出「本周节奏」
     · 今天不需要做的（周一三五型在周二）不进分母，否则「不需要做」会被写成欠账
     模块四项照旧全算，不受影响。 */
  function assessmentHabits(d) {
    const list = activeHabits(d).filter(function (h) {
      if (isPeriodic(h)) return false;
      return habitDueOn(h, d);
    });
    return list.concat(moduleHabits());
  }

  /* 今日页该不该出现这张卡：要做的显示；今天不需要做的不显示；
     周期型凑够了次数也要显示（折叠成「已达成」，不能凭空消失）；
     interval（每 N 天）同样恒显示——消失是 BUG-②（陛下实测：点完成卡片就不见了）。 */
  function todayVisible(h, d) {
    if (!h || isArchived(h) || isModuleAnchor(h)) return false;
    if (habitDueOn(h, d)) return true;
    if (schedOf(h).kind === 'interval') return true;
    const mp = metPeriod(h, d);
    return !!(mp && mp.met);
  }
  function dayStats(d) {
    const habits = assessmentHabits(d);
    const total = habits.length;
    const done = habits.filter(h => met(h, d)).length;
    return { total: total, done: done, ratio: total ? done / total : 0 };
  }
  function rateOver(days) {
    let sum = 0, n = 0;
    const now = todayStr();
    days.forEach(d => {
      if (d > now || !hasRecords(d)) return;
      sum += dayStats(d).ratio;
      n++;
    });
    return { rate: n ? sum / n : 0, days: n };
  }
  /* v203：把「统计档位天数」转成日期数组。R = 0 表示「全部」——
     从最早有记录那天铺到今天（rateOver 会跳过没记录的日子，分母仍是有记录的天数）。 */
  function statsRangeDays(R) {
    const now = new Date();
    const out = [];
    const n = Number(R) || 0;
    if (n > 0) {
      for (let i = n - 1; i >= 0; i--) out.push(fmt(addDays(now, -i)));
      return out;
    }
    const keys = Object.keys(state.checks || {}).sort();
    const start = keys.length ? parseD(keys[0]) : now;
    const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let guard = 0;
    while (cur <= end && guard++ < 4000) {
      out.push(fmt(cur));
      cur.setDate(cur.getDate() + 1);
    }
    if (!out.length) out.push(fmt(now));
    return out;
  }

  function dayQualified(d) {
    if (!hasRecords(d)) return false;
    const s = dayStats(d);
    return s.total > 0 && s.ratio >= 0.75;
  }
  function overallStreak() {
    let d = new Date(), n = 0;
    if (!dayQualified(todayStr())) d = addDays(d, -1);
    while (n < 3650 && dayQualified(fmt(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function habitStreak(h) {
    if (isQuitSemantics(h)) return quitStreak(h);
    let d = new Date(), n = 0;
    const created = h.createdAt ? String(h.createdAt).slice(0, 10) : todayStr();
    const ok = ds => hasRecords(ds) && met(h, ds);
    if (!ok(todayStr())) d = addDays(d, -1);
    while (n < 3650 && ok(fmt(d))) { n++; d = addDays(d, -1); }
    return n;
  }

  function shiftDay(d, n) { return fmt(addDays(new Date(d + 'T00:00:00'), n)); }
  /* 某一天的连续天数（不是固定的「今天」）：切到历史日期时也要说真话。
     当天还没达标就从昨天起算，和 habitStreak 的口径一致。 */
  function streakOn(h, d) {
    if (!h || h.med) return 0;
    if (isSmoke(h)) {
      let last = '';
      cravingsOf(h.id).forEach(function (e) {
        if (e.k === 's') {
          const day = tsDay(e.t);
          if (day <= d && day > last) last = day;
        }
      });
      const base = last || quitStartDay(h);
      const diff = Math.round((parseD(d) - parseD(base)) / 86400000);
      return Math.max(0, last ? diff : diff + 1);
    }
    if (h.type === 'quit') {
      /* v204：生效日起戒除类按「连续打卡」算，没打卡就断；
         生效日之前沿用老的「距上次破戒天数」，历史纪录不翻旧账。 */
      if (quitNeedsCheckin(h, d)) {
        const born = quitStartDay(h);
        let n = 0, cur = d;
        if (!met(h, cur)) cur = shiftDay(cur, -1);
        while (n < 3650 && cur >= born && met(h, cur)) { n++; cur = shiftDay(cur, -1); }
        return n;
      }
      let last = '';
      cravingsOf(h.id).forEach(function (e) {
        if (e.k === 's') {
          const day = tsDay(e.t);
          if (day <= d && day > last) last = day;
        }
      });
      const base = last || quitStartDay(h);
      const diff = Math.round((parseD(d) - parseD(base)) / 86400000);
      return Math.max(0, last ? diff : diff + 1);
    }
    const target = Math.max(1, Number(h.target) || 1);
    const ok = ds => countOf(ds, h.id) >= target;
    let n = 0, cur = d;
    if (!ok(cur)) cur = shiftDay(cur, -1);
    while (n < 3650 && ok(cur)) { n++; cur = shiftDay(cur, -1); }
    return n;
  }
  /* 最近 7 天点阵：把「坚持」从形容词变成可数的格子。 */
  function habitWeek(h, d) {
    const target = Math.max(1, Number(h.target) || 1);
    const q = isQuitSemantics(h);
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const ds = shiftDay(d, -i);
      let cls = 'hd-dot', ratio = 0, tip = ds.slice(5) + ' · ';
      if (q) {
        const evs = dayCravings(h.id, ds);
        const slip = evs.some(function (e) { return e.k === 's'; });
        if (slip) { cls += ' broken'; tip += '失守'; }
        /* v204：戒除类生效日起看打卡，没打卡就是空圈；戒烟/历史仍看事件 */
        else if (quitNeedsCheckin(h, ds)) {
          if (countOf(ds, h.id) >= 1) { cls += ' on'; ratio = 1; tip += '守住了'; }
          else { cls += ' empty'; tip += '没打卡'; }
        }
        else if (!evs.length) { cls += ' empty'; tip += '没记录'; }
        else { cls += ' on'; ratio = 1; tip += '守住'; }
      } else {
        const c = countOf(ds, h.id);
        if (c <= 0) { cls += ' empty'; tip += '没记录'; }
        else if (c >= target) { cls += ' on'; ratio = 1; tip += '完成 ' + c + '/' + target; }
        else { cls += ' part'; ratio = clamp(c / target, 0, 1); tip += '完成 ' + c + '/' + target; }
      }
      if (ds === d) cls += ' today';
      out.push('<i class="' + cls + '" style="--r:' + ratio.toFixed(2) + '" title="' + tip + '"></i>');
    }
    return out.join('');
  }

  /* 非常驻习惯卡的七日条：每天一个字 + 一个圆圈。
     原来只有 7 个 8px 小点，既看不出星期几，也点不准；这一版把「哪一天」
     和「什么状态」分开表达：字说日期，圈说状态。 */
  const HC_TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  const HC_CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  /* 本周的周一（周序从这天起算；项目里「周几」一律 0-6 且 0=周日） */
  function weekMonday(d) {
    return shiftDay(d, -((parseD(d).getDay() + 6) % 7));
  }

  /* 非常驻习惯卡的七日条：周一 → 周日，固定七列。
     以前是「滚动的最近 7 天」，所以周日排第一、每天的位置都在动——
     卡片之间对不齐，也读不出「这一周」。改成自然周后，同一列永远是同一个星期几。
     圈内符号：对号 = 完成，叉 = 明确记为未完成（或戒除失守），空 = 当日没有记录。 */
  /* 一天的「标记」：圈里画什么、本周计数怎么算，都只认这一个函数。
     以前两处各算一套，于是出现过「七个空圈 + 本周 7/7」这种一张卡讲两套话。 */
  function habitDayMark(h, ds, d) {
    if (ds > d) return 'future';
    if (isSmoke(h)) {
      /* 戒烟仍是「没点一根就守住」，和以前一样 */
      if (dayCravings(h.id, ds).some(function (e) { return e.k === 's'; })) return 'fail';
      if (ds < quitStartDay(h)) return 'none';
      return 'done';
    }
    if (h.type === 'quit') {
      if (dayCravings(h.id, ds).some(function (e) { return e.k === 's'; })) return 'fail';
      if (ds < quitStartDay(h)) return 'none';
      /* v204：生效日起，戒除类当天没主动打卡就是空圈，不再自动画勾 */
      if (quitNeedsCheckin(h, ds) && countOf(ds, h.id) < 1) return 'none';
      return 'done';
    }
    /* 小习惯 2.0：这一天不需要做（周一三五型在周二）——周条画虚线，不画叉，
       否则用户会把空白误读成「漏打卡」。纯函数判断，不看是否已达成。 */
    if (!schedDueRaw(h, ds)) return 'off';
    /* interval：本轮已经做过 → 本轮剩余天数全部 off（「哪天做都行」的天然结果）；
       轮内没做的日子不画叉（历史轮未做也不追账，只在本轮内滚动要求）。 */
    if (schedOf(h).kind === 'interval') {
      if (met(h, ds)) return 'done';
      if (intervalDone(h, ds)) return 'off';
      return isSkipped(ds, h.id) ? 'fail' : 'none';
    }
    const target = Math.max(1, Number(h.target) || 1);
    const c = countOf(ds, h.id);
    if (isSkipped(ds, h.id)) return 'fail';
    if (c >= target) return 'done';
    if (c > 0) return 'part';
    return 'none';
  }

  function habitWeekLabelled(h, d) {
    const target = Math.max(1, Number(h.target) || 1);
    const q = isQuitSemantics(h);
    const WD = ['日', '一', '二', '三', '四', '五', '六'];
    const mon = weekMonday(d);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const ds = shiftDay(mon, i);
      const dt = parseD(ds);
      const st = habitDayMark(h, ds, d);
      let tip = ds.slice(5) + ' · ';
      if (st === 'future') tip += '还没到';
      else if (st === 'off') tip += '今天不需要做';
      else if (st === 'fail') tip += (q ? '失守' : '记为未完成');
      else if (st === 'done') tip += (q ? '守住了' : '完成 ' + countOf(ds, h.id) + '/' + target);
      else if (st === 'part') tip += '完成 ' + countOf(ds, h.id) + '/' + target;
      else tip += (q ? '还没开始' : '没记录');
      out.push('<div class="hw-cell is-' + st + (ds === d ? ' is-today' : '') +
        (st === 'future' ? ' is-future' : '') + '" title="' + esc(tip) + '">' +
        '<b>' + WD[dt.getDay()] + '</b>' +
        '<i>' + (st === 'done' ? HC_TICK : (st === 'fail' ? HC_CROSS : '')) + '</i></div>');
    }
    return out.join('');
  }

  /* 本周已达标的格数（分母固定 7）。与圈共用 habitDayMark，两者不可能再对不上。 */
  function habitWeekDone(h, d) {
    const mon = weekMonday(d);
    let n = 0;
    for (let i = 0; i < 7; i++) {
      if (habitDayMark(h, shiftDay(mon, i), d) === 'done') n++;
    }
    return n;
  }
  /* 截止型习惯：在某个时刻之前完成才算「准时」。
     只对「保持 × 单次目标」生效——多次目标谈截止没有意义，戒除/戒烟也不需要。
     打卡时刻从 state.events 里取当天最后一条增量记录，**不额外存字段**。 */
  function isDeadlineHabit(h) {
    return !!h && h.type === 'build' && !h.med && !!h.deadline &&
      Math.max(1, Number(h.target) || 1) <= 1;
  }
  function checkTimeOf(h, d) {
    if (!isDeadlineHabit(h) || d !== todayStr()) return '';
    const evs = (Array.isArray(state.events) ? state.events : []).filter(function (e) {
      return e && e.id === h.id && e.d === d && Number(e.delta) > 0;
    });
    if (!evs.length) return '';
    const dt = new Date(evs[evs.length - 1].at);
    if (isNaN(dt.getTime())) return '';
    return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
  }
  /* 相对截止时刻差多少分钟：>0 超时，<0 提前。
     跨零点按「前一天晚上 → 次日凌晨」归一，否则 01:00 截止、23:30 打卡会被算成超时 22 小时。 */
  function deadlineDiff(h, d) {
    if (!isDeadlineHabit(h) || d !== todayStr()) return 0;
    const t = checkTimeOf(h, d);
    if (!t) return 0;
    const toMin = s => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
    const T = toMin(t), D = toMin(h.deadline);
    let diff = T - D;
    if (D <= 240 && T > D + 720) diff -= 1440;
    else if (D > 240 && T < D - 720) diff += 1440;
    return diff;
  }

  /* 最长纪录：和 streakOn 同一套口径，只是取「历史最大值」而不是「当前值」。
     不存字段——每次从 checks / cravings 现算，导出导入和多端合并都不用管。
     扫描区间由最早一条记录决定，没有记录时只算今天，不会白转几千轮。 */
  function habitBest(h, d) {
    if (!h || h.med) return 0;
    if (isSmoke(h)) {
      const slips = [];
      cravingsOf(h.id).forEach(function (e) {
        if (e.k === 's') {
          const day = tsDay(e.t);
          if (day <= d) slips.push(day);
        }
      });
      if (!slips.length) return streakOn(h, d);
      slips.sort();
      let best = 0, prev = quitStartDay(h);
      slips.forEach(function (day) {
        best = Math.max(best, Math.round((parseD(day) - parseD(prev)) / 86400000));
        prev = day;
      });
      return Math.max(best, Math.round((parseD(d) - parseD(prev)) / 86400000));
    }
    if (h.type === 'quit') {
      /* v204：生效日起戒除类按打卡算最长连续；之前的历史仍按破戒间隔算 */
      if (quitNeedsCheckin(h, d)) {
        const born = quitStartDay(h);
        let best = 0, run = 0, cur = d;
        const span = Math.max(1, Math.round((parseD(d) - parseD(born)) / 86400000) + 1);
        for (let i = 0; i < span; i++) {
          if (met(h, cur)) { run++; if (run > best) best = run; } else run = 0;
          cur = shiftDay(cur, -1);
        }
        return best;
      }
      const slips = [];
      cravingsOf(h.id).forEach(function (e) {
        if (e.k === 's') {
          const day = tsDay(e.t);
          if (day <= d) slips.push(day);
        }
      });
      if (!slips.length) return streakOn(h, d);
      slips.sort();
      let best = 0, prev = quitStartDay(h);
      slips.forEach(function (day) {
        best = Math.max(best, Math.round((parseD(day) - parseD(prev)) / 86400000));
        prev = day;
      });
      return Math.max(best, Math.round((parseD(d) - parseD(prev)) / 86400000));
    }
    const target = Math.max(1, Number(h.target) || 1);
    const ok = ds => countOf(ds, h.id) >= target;
    let earliest = d;
    Object.keys(state.checks || {}).forEach(function (k) { if (k < earliest) earliest = k; });
    const span = Math.max(1, Math.round((parseD(d) - parseD(earliest)) / 86400000) + 1);
    let best = 0, run = 0, cur = d;
    for (let i = 0; i < span; i++) {
      if (ok(cur)) { run++; if (run > best) best = run; } else run = 0;
      cur = shiftDay(cur, -1);
    }
    return best;
  }
  /* v102：打卡的即时回馈。render() 会重建整张卡，所以动效必须排在重绘之后，
     用 WAAPI 打在重建出来的节点上（CSS 动画会随重绘重放，反而变成噪音）。
     系统开了「减少动效」就只震动、不放大。 */
  function canAnimate() {
    try { return !window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return true; }
  }
  function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 系统拒绝就静默 */ }
  }
  function habitPulse(id, kind) {
    if (kind !== 'on' && kind !== 'slip') return;
    buzz(kind === 'slip' ? [12, 36, 12] : 12);
    if (!canAnimate()) return;
    requestAnimationFrame(function () {
      const card = document.querySelector('.habit-card[data-hid="' + id + '"]');
      if (!card) return;
      /* 只放大「刚点的那颗」和「今天那一格」：撤销不给动效，
         否则点了撤销也像一次奖励。 */
      const pairs = [];
      const ctrl = card.querySelector('.habit-done, .quit-add, .habit-pips-row .pip.on, .pips .pip.on');
      if (ctrl) pairs.push([ctrl, 1.06]);
      const dot = card.querySelector('.hd-dot.today');
      if (dot) pairs.push([dot, 1.5]);
      pairs.forEach(function (t) {
        try {
          t[0].animate(
            [{ transform: 'scale(1)' }, { transform: 'scale(' + t[1] + ')' }, { transform: 'scale(1)' }],
            { duration: 260, easing: 'cubic-bezier(.2,.8,.3,1)' }
          );
        } catch (e) { /* 老浏览器没有 animate 就跳过 */ }
      });
    });
  }

  /* 一张卡同一时刻只有一个「今天怎样」，右上角用文字说，不用猜图标。 */
  function habitStateText(h, d) {
    if (h.med) return met(h, d) ? '已完成' : '待打卡';
    /* v103：状态位与按钮用同一组词，不再一个「守住」一个「守住了」 */
    if (isQuitSemantics(h)) {
      const slip = dayCravings(h.id, d).some(function (e) { return e.k === 's'; });
      return slip ? '今天失守了' : '今天守住了';
    }
    /* 截止型：状态位直接写「几点完成的」，比「已完成」信息量大 */
    if (isDeadlineHabit(h)) {
      if (!met(h, d)) return '待打卡';
      return checkTimeOf(h, d) || '已完成';
    }
    const c = countOf(d, h.id), target = Math.max(1, Number(h.target) || 1);
    if (c >= target) return '已完成';
    if (target > 1 && c > 0) return '进行中';
    return '待打卡';
  }  /* 未归档的任务：看板、今日、右栏、日历一律只看这一批 */
  function liveTasks() {
    return state.tasks.filter(t => !t.archivedAt);
  }

  function archivedTasks() {
    return state.tasks.filter(t => t.archivedAt)
      .sort((a, b) => String(b.archivedAt).localeCompare(String(a.archivedAt)));
  }

  function pendingTasks(d) {
    const prioRank = { '高': 0, '中': 1, '低': 2 };
    return liveTasks().filter(t => t.status !== 'done' && t.status !== 'cancelled' && (t.status === 'doing' || (t.due && t.due <= d)))
      .sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')) ||
        (prioRank[a.priority] ?? 1) - (prioRank[b.priority] ?? 1));
  }
  function taskRepeatLabel(t) {
    if (!t || ['daily', 'weekly', 'monthly'].indexOf(t.repeat) < 0) return '';
    const time = t.repeatTime || '20:00';
    if (t.repeat === 'daily') return '每天 ' + time;
    if (t.repeat === 'weekly') {
      const wd = Number.isFinite(Number(t.repeatWeekday)) ? Number(t.repeatWeekday) : (t.due ? parseD(t.due).getDay() : 0);
      return '每周' + WEEK_CN[clamp(wd, 0, 6)] + ' ' + time;
    }
    const day = Number.isFinite(Number(t.repeatDay)) ? Number(t.repeatDay) : (t.due ? parseD(t.due).getDate() : 1);
    return '每月 ' + clamp(day, 1, 31) + ' 日 ' + time;
  }
  function dueText(t) {
    if (!t.due) return '无期限';
    const md = Number(t.due.slice(5, 7)) + '月' + Number(t.due.slice(8, 10)) + '日';
    if (t.status === 'done') return md + ' 截止';
    if (t.status === 'cancelled') return md;
    if (t.due === todayStr()) return '今天';
    if (t.due === fmt(addDays(new Date(), 1))) return '明天';
    if (t.due < todayStr()) {
      const diff = Math.round((parseD(todayStr()) - parseD(t.due)) / 86400000);
      return '逾期 ' + diff + ' 天';
    }
    return md;
  }
  function greet() {
    const h = new Date().getHours();
    if (h < 5) return '夜深了';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  /* ============================================================
     图标与小组件

  const ICONS = {

    config: '<path d="M6.2 8.6a5.8 5.8 0 0 1 11.6 0c0 4 1.6 5.6 2.2 6.2H4c.6-.6 2.2-2.2 2.2-6.2z"/><path d="M9.8 18.4a2.2 2.2 0 0 0 4.4 0"/>'

  function icon(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }
  function ring(ratio, size, stroke, color, track) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const val = clamp(Number(ratio) || 0, 0, 1);
    const offset = c * (1 - val);
    const mid = size / 2;
    return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
      '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="' + (track || 'var(--line)') + '" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke +
        '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) +
        '" transform="rotate(-90 ' + mid + ' ' + mid + ')" style="transition:stroke-dashoffset .5s ease"/>' +
      '</svg>';
  }
  /* ============================================================
     全局搜索（Cmd / Ctrl + K）
     检索 tasks / essays / meds / habits，结果按类型分组，
     回车跳到对应页面并高亮目标。搜索状态全部留在模块级变量里。
     ============================================================ */
  const SEARCH_MAX = 24;
  let searchTerm = '';
  let searchIndex = 0;
  let searchTimer = null;

  /* 用 DOM 判断浮层是否开着，不用布尔量：
     点 ✕、点遮罩、Esc 都会绕过 state 变量，布尔量会漂移，
     导致下一次 Ctrl+K 变成「关闭一个已关闭的浮层」。 */
  function isSearchOpen() { return !!$('#search-input'); }

  function searchPool() {
    const pool = [];
    (state.tasks || []).forEach(t => {
      if (isArchived(t)) return;
      pool.push({ kind: 'task', id: t.id, title: t.title || '', text: t.note || '',
                  view: 'board', meta: (t.tag || '其他') + ' · ' + dueText(t) });
    });
    (state.essays || []).forEach(e => {
      pool.push({ kind: 'essay', id: e.id, title: e.title || '(无标题)', text: e.text || '',
                  view: 'essays', meta: (e.date || '') + ((e.tags || []).length ? ' · ' + e.tags.join('/') : '') });
    });
    (state.meds || []).forEach(m => {
      pool.push({ kind: 'med', id: m.id, title: m.name || '', text: [m.purpose, m.form, m.note].filter(Boolean).join(' '),
                  view: 'meds', meta: medCourseLabel(m) });
    });
    (state.habits || []).forEach(h => {
      /* h_med 是「用药卡」的占位习惯，习惯页会跳过它（habitManageRows 过滤 !h.med），
         跳过去只会落空；用药本身有独立入口，这里不重复收录。
         v170：四个常驻卡的锚点也不收录，改成下面按模块收录，落点是各自页面。 */
      if (h.med || isModuleAnchor(h) || !String(h.name || '').trim()) return;
      pool.push({ kind: 'habit', id: h.id, title: h.name, text: h.note || '',
                  view: 'habits', meta: isArchived(h) ? '已归档' : (h.unit || '次') });
    });
    MODULE_KEYS.forEach(function (k) {
      const m = state.modules && state.modules[k];
      if (!m || m.on === false || !String(m.name || '').trim()) return;
      pool.push({ kind: 'module', id: RECORD_IDS[k], title: m.name, text: m.note || '',
                  view: k, meta: MODULE_LABEL[k] });
    });
    return pool;
  }

  const SEARCH_KIND = {
    task:  { label: '待办', icon: '📋' },
    habit: { label: '习惯', icon: '✅' },
    med:   { label: '用药', icon: '💊' },
    essay: { label: '随笔', icon: '📝' }
  };

  function searchTextOf(it) {
    return (it.title + '\n' + it.text).toLowerCase();
  }

  function searchResults(term) {
    const q = String(term || '').trim().toLowerCase();
    if (!q) return [];
    const pool = searchPool();
    const starts = [], contains = [];
    pool.forEach(it => {
      const t = it.title.toLowerCase();
      if (t.indexOf(q) === 0) starts.push(it);
      else if (t.indexOf(q) > 0 || searchTextOf(it).indexOf(q) >= 0) contains.push(it);
    });
    return starts.concat(contains).slice(0, SEARCH_MAX);
  }

  function searchHighlight(text, term) {
    const src = String(text || '');
    const q = String(term || '').trim();
    if (!q) return esc(src);
    const lower = src.toLowerCase();
    const needle = q.toLowerCase();
    const at = lower.indexOf(needle);
    if (at < 0) return esc(src);
    return esc(src.slice(0, at)) + '<mark>' + esc(src.slice(at, at + q.length)) + '</mark>' + esc(src.slice(at + q.length));
  }

  /* ---------- 命令面板 ----------
     Ctrl+K 原来只能搜。现在同一个输入框直接认命令：
       +1 喝水 / -1 喝水      给习惯打卡
       记 体重 68.5           记录今天的体重
       新任务 交报告 明天      新建待办
     认不出来就当搜索词，所以老用法一点没变。
     解析和执行分开，是为了解析能单测（不碰 state）。 */
  function findHabitByName(q) {
    const t = String(q || '').trim().toLowerCase();
    if (!t) return null;
    /* h_med 是「用药」这个虚拟习惯，它的对勾由药品记录驱动，
       手动 +1 不会影响完成判定，所以不参与命令匹配 */
    const list = assessmentHabits(todayStr()).filter(h => !h.med);
    const exact = list.find(h => String(h.name || '').toLowerCase() === t);
    if (exact) return exact;
    return list.find(h => String(h.name || '').toLowerCase().indexOf(t) >= 0) || null;
  }

  const CMD_DUE_WORDS = [['大后天', 3], ['后天', 2], ['明天', 1], ['今天', 0], ['今日', 0]];

  function parseCommand(raw) {
    const txt = String(raw || '').trim();
    if (!txt) return null;

    /* +1 喝水 ／ -2 看书 ／ +喝水（数字省略按 1） */
    let m = txt.match(/^([+\-])\s*(\d+(?:\.\d+)?)?\s*(\S.*)$/);
    if (m) {
      const h = findHabitByName(m[3]);
      if (!h) return null;                    /* 不认识的习惯名 → 交回搜索 */
      const n = m[2] ? Number(m[2]) : 1;
      const delta = m[1] === '-' ? -n : n;
      if (!delta) return { kind: 'error', label: '数量不能是 0' };
      return {
        kind: 'habit', habit: h, delta: delta,
        label: h.name + ' ' + (delta > 0 ? '+' : '') + delta,
        detail: '今天已记录 ' + countOf(todayStr(), h.id) + ' 次 · 回车执行'
      };
    }

    /* 记 体重 68.5 ／ 体重 68.5 ／ 68.5 体重 */
    m = txt.match(/^(?:记|记录|写下)?\s*(?:体重)\s*([0-9]+(?:\.[0-9]+)?)\s*(?:kg|公斤)?$/i);
    if (m) {
      const v = Number(m[1]);
      if (!isFinite(v) || v < 1 || v > 500) {
        return { kind: 'error', label: '体重要在 1–500 kg 之间' };
      }
      const p = normalizeBodyProfile(state.bodyProfile);
      if (!p.age || !p.height) {
        return { kind: 'error', label: '先补充身体档案（年龄和身高），否则算不了 BMI' };
      }
      return { kind: 'weight', value: Math.round(v * 10) / 10, label: '记录体重 ' + v + ' kg', detail: '写进今天 · 回车执行' };
    }

    /* 新任务 交报告 明天 */
    m = txt.match(/^(?:新任务|新建任务|待办|todo)\s+(\S.*)$/i);
    if (m) {
      let body = m[1].trim();
      let due = todayStr();
      for (let i = 0; i < CMD_DUE_WORDS.length; i++) {
        const kw = CMD_DUE_WORDS[i][0];
        if (body.length > kw.length && body.slice(-kw.length) === kw) {
          body = body.slice(0, -kw.length).trim();
          due = fmt(addDays(new Date(), CMD_DUE_WORDS[i][1]));
          break;
        }
      }
      if (!body) return { kind: 'error', label: '任务标题不能为空' };
      /* 「新任务 今天」这种只有日期的，当成标题会把日期当名字建出来，提示一下更清楚 */
      if (CMD_DUE_WORDS.some(w => w[0] === body)) {
        return { kind: 'error', label: '任务标题不能只有一个日期，加上要做什么' };
      }
      return {
        kind: 'task', title: body, due: due,
        label: '新建待办「' + body + '」',
        detail: '截止 ' + due + ' · 回车执行'
      };
    }

    return null;
  }

  function runCommand(cmd) {
    if (!cmd) return false;
    if (cmd.kind === 'error') {
      toast(cmd.label);
      return true;
    }
    const d = todayStr();

    if (cmd.kind === 'habit') {
      const h = cmd.habit;
      const cur = countOf(d, h.id);
      const next = Math.max(0, cur + cmd.delta);
      if (next === cur) {
        toast(cur === 0 ? '已经是 0 了' : '无法再减');
        return true;
      }
      logHabit(h.id, cmd.delta);
      setCount(d, h.id, next);
      closeModal();
      render();
      toast(h.name + (cmd.delta > 0 ? ' +' : ' ') + cmd.delta);
      return true;
    }

    if (cmd.kind === 'weight') {
      const p = normalizeBodyProfile(state.bodyProfile);
      const list = Array.isArray(state.weights) ? state.weights : (state.weights = []);
      let rec = list.find(w => w && w.date === d);
      if (!rec) {
        rec = { id: 'w_' + uid(), date: d, createdAt: new Date().toISOString() };
        list.push(rec);
      }
      rec.date = d;
      rec.age = p.age;
      rec.height = p.height;
      rec.weight = cmd.value;
      rec.bmi = calcBmi(cmd.value, p.height);
      save();
      closeModal();
      render();
      toast('体重已记 ' + cmd.value + ' kg');
      return true;
    }

    if (cmd.kind === 'task') {
      state.tasks.unshift({
        id: uid(),
        title: cmd.title,
        note: '',
        tag: '其他',
        priority: '中',
        status: 'todo',
        due: cmd.due,
        repeat: 'none',
        repeatTime: '20:00',
        createdAt: new Date().toISOString(),
        doneAt: null,
        prevStatus: ''
      });
      save();
      closeModal();
      render();
      toast('已添加待办「' + cmd.title + '」');
      return true;
    }

    return false;
  }

  function searchBodyHtml() {
    const cmd = parseCommand(searchTerm);
    if (cmd) {
      return '<button type="button" class="se-item se-cmd' +
          (cmd.kind === 'error' ? ' is-bad' : '') + '" data-act="cmd-run">' +
          '<span class="se-title">' + esc(cmd.label) + '</span>' +
          '<span class="se-meta">' + esc(cmd.detail || '回车执行') + '</span>' +
        '</button>';
    }
    const results = searchResults(searchTerm);
    if (!String(searchTerm).trim()) {
      return '<div class="se-hint">可以搜待办标题与备注、随笔正文、药名与用途、习惯名称。<br>' +
        '↑↓ 选择，回车跳转，Esc 关闭。</div>' +
        '<div class="se-group" style="margin-top:12px">⌘ 也能直接执行</div>' +
        '<div class="se-hint" style="margin-top:6px">' +
          '<code>+1 喝水</code> 给习惯打卡　<code>-1 看书</code> 撤销<br>' +
          '<code>记 体重 68.5</code> 记录体重　<code>新任务 交报告 明天</code> 新建待办' +
        '</div>';
    }
    if (!results.length) {
      return '<div class="se-hint">没有匹配「' + esc(searchTerm) + '」的内容。</div>';
    }
    if (searchIndex >= results.length) searchIndex = 0;
    let html = '';
    let lastKind = null;
    results.forEach((it, i) => {
      if (it.kind !== lastKind) {
        const n = results.filter(x => x.kind === it.kind).length;
        html += '<div class="se-group">' + SEARCH_KIND[it.kind].icon + ' ' + SEARCH_KIND[it.kind].label + ' · ' + n + '</div>';
        lastKind = it.kind;
      }
      html += '<button type="button" class="se-item' + (i === searchIndex ? ' is-on' : '') +
        '" data-act="search-pick" data-i="' + i + '">' +
        '<span class="se-title">' + searchHighlight(it.title, searchTerm) + '</span>' +
        '<span class="se-meta">' + esc(it.meta || '') + '</span>' +
        '</button>';
    });
    return html;
  }

  function openSearch() {
    searchIndex = 0;
    openModal('' +
      '<div class="modal-card se-card">' +
        '<div class="se-head">' +
          '<span class="se-ico">🔍</span>' +
          '<input type="text" id="search-input" placeholder="搜索，或输入 +1 喝水 / 记 体重 68.5 / 新任务 …" ' +
            'autocomplete="off" spellcheck="false" value="' + esc(searchTerm) + '">' +
          '<button class="icon-btn" data-act="close-modal" title="关闭">✕</button>' +
        '</div>' +
        '<div class="se-body" id="search-body">' + searchBodyHtml() + '</div>' +
        '<div class="se-foot"><span id="se-hint">↑↓ 选择 · 回车跳转 · Esc 关闭</span>' +
          '<span id="se-count"></span></div>' +
      '</div>');
    const input = $('#search-input');
    if (input) {
      input.focus();
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
    }
    searchSyncCount();
  }

  function searchSyncCount() {
    const box = $('#se-count');
    const hint = $('#se-hint');
    /* 命令模式下没有「搜索结果」，右下角再显示「无结果」会误导用户，
       左下角也不该再说「回车跳转」 */
    if (parseCommand(searchTerm)) {
      if (box) box.textContent = '';
      if (hint) hint.textContent = '回车执行 · Esc 关闭';
      return;
    }
    if (hint) hint.textContent = '↑↓ 选择 · 回车跳转 · Esc 关闭';
    if (!box) return;
    const n = searchResults(searchTerm).length;
    box.textContent = String(searchTerm).trim() ? (n ? n + ' 条结果' : '无结果') : '';
  }

  function searchRerenderBody() {
    const body = $('#search-body');
    if (!body) return;
    body.innerHTML = searchBodyHtml();
    searchSyncCount();
  }

  function closeSearch() {
    clearTimeout(searchTimer);
    closeModal();
  }

  /* 跳到目标所在地：切视图 → 等一帧 → 滚动并高亮 */
  /* 卡片本身通常不带 data-id（挂在内部按钮上），所以用「锚点 + closest」定位，
     再退化为按标题文本找卡片，两级兜底。 */
  const SEARCH_CARD = {
    task:  '.task, .task-row',
    habit: '.habit-card, .vital-card, .habit-row',
    med:   '.med-item, .med-card, .med-row, .mh',
    essay: '.essay-card'
  };

  function searchLocate(it) {
    const anchor = document.querySelector('[data-id="' + it.id + '"]');
    if (anchor) {
      const card = anchor.closest(SEARCH_CARD[it.kind] || '');
      if (card) return card;
    }
    return Array.from(document.querySelectorAll(SEARCH_CARD[it.kind] || ''))
      .find(e => (e.textContent || '').indexOf(it.title) >= 0) || null;
  }

  function searchGo(it) {
    closeSearch();
    if (view !== it.view) {
      view = it.view;
      state.view = it.view;
      render();
    }
    requestAnimationFrame(() => {
      const el = searchLocate(it);
      if (!el) { toast('已切到「' + SEARCH_KIND[it.kind].label + '」，请自行定位'); return; }
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('is-focus');
      setTimeout(() => el.classList.remove('is-focus'), 1800);
      /* 随笔：搜到了就直接把全文打开，省得再点一次卡片 */
      if (it.kind === 'essay') {
        const e = (state.essays || []).find(x => x.id === it.id);
        if (e) essayViewModal(e);
      }
    });
  }

  /* ============================================================
     打开即提醒（不做 Web Push：iOS 要装 PWA、Android 要推送服务）
     只在打开页面 / 切回来时提醒：顶部横幅 + 标签页标题计数闪烁。
     「今天不再提醒」记在 localStorage，不进 state，避免纯提示操作触发云保存。
     ============================================================ */
  const REMIND_DISMISS_KEY = 'lifeboard.remind.dismissed';
  const BASE_TITLE = document.title;
  let remindTimer = null;
  let remindFlip = false;
  let remindCount = 0;

  function remindDismissedOn() {
    try { return localStorage.getItem(REMIND_DISMISS_KEY) === todayStr(); } catch (e) { return false; }
  }

  /* 四类提醒来源：用药、重复任务到点、过截止日的待办、该打卡的习惯。
     统一在 9 点后才算，避免清早一打开就被催。
     每条带一个稳定 key：系统通知按 key + 日期去重，同一天不会反复轰炸，
     横幅和标签页计数也都读这一份，三处数字不会各算各的。 */
  function remindItems() {
    const d = todayStr();
    const now = new Date();
    if (now.getHours() < 9) return [];
    const hm = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    const items = [];

    let overdue = 0, pending = 0;
    medScheduledFor(d).forEach(s => {
      if (doseAt(d, s.med.id, s.slot)) return;
      if (s.slot < hm) overdue++; else pending++;
    });
    if (overdue) items.push({ key: 'med-overdue', text: overdue + ' 次用药已过时间', view: 'meds' });
    if (pending) items.push({ key: 'med-pending', text: pending + ' 次用药待服', view: 'meds' });

    /* 待办 1：重复任务过了今天的提醒时刻还没做（repeatTime 之前只在表单里存着，没人读） */
    const open = (state.tasks || []).filter(t => t && !t.archivedAt && t.status !== 'done');
    const repeatDue = open.filter(t =>
      t.repeat && t.repeat !== 'none' && String(t.repeatTime || '20:00') <= hm);
    if (repeatDue.length) {
      items.push({
        key: 'task-' + repeatDue[0].id,
        text: '「' + String(repeatDue[0].title || '待办') + '」到时间了' +
          (repeatDue.length > 1 ? '，另有 ' + (repeatDue.length - 1) + ' 件' : ''),
        view: 'board'
      });
    }
    /* 待办 2：过截止日的单次任务合并成一条，别一个任务一条把横幅撑爆 */
    const lateCount = open.filter(t =>
      t.due && String(t.due) < d && (!t.repeat || t.repeat === 'none')).length;
    if (lateCount) {
      items.push({ key: 'task-late', text: lateCount + ' 件待办已逾期', view: 'today' });
    }

    /* 习惯：只有填了「建议时间」的才会被催
       v201：478 有多个提醒点，按 notifyTimes 的**全部**判断（任一已过且当天没达标就催），
       文案也说清是「还差 N 组」而不是笼统的「还没打卡」（做了 1/3 组时那样写是错的）。
       批 4：有 notifyPlan 的习惯（含戒除类）按时间矩阵催——任一时间已过且当日未做满；
       无 notifyPlan 的维持老路径。 */
    (state.habits || []).forEach(function (h) {
      if (!h || h.archivedAt || h.optional || h.med || isModuleAnchor(h)) return;
      if (!h.notifyPlan) return;                       // 无计划的走下面老逻辑
      if (!habitDueOn(h, d)) return;                   // 今天不是要求日
      const plan = notifyPlanOf(h);
      const times = plan.wd ? (plan.wd[String(new Date().getDay())] || [])
        : (plan.daily || [plan.intervalTime || '09:00']);
      const target = Math.max(1, Number(h.target) || 1);
      const count = countOf(d, h.id);
      if (count >= target) return;                     // 今日已做满
      const hit = times.some(function (t) {
        const s = String(t || '');
        return /^\d{2}:\d{2}$/.test(s) && s <= hm;
      });
      if (!hit) return;
      items.push({
        key: 'habit2-' + h.id,
        text: '「' + String(h.name || '习惯') + '」' +
          (target > 1 ? '已完成 ' + count + '/' + target + ' · 还差 ' + (target - count)
                      : '还没打卡'),
        view: 'habits'
      });
    });
    const habitDue = assessmentHabits(d).filter(function (h) {
      if (h.med || isQuitSemantics(h) || h.notifyPlan) return false;
      const target = Number(h.target) || 1;
      if (countOf(d, h.id) >= target) return false;
      if (h.id === 'h_breathe') {
        const bm = (state.modules && state.modules.breathe) ? state.modules.breathe : null;
        const list = (bm && Array.isArray(bm.notifyTimes) && bm.notifyTimes.length)
          ? bm.notifyTimes
          : [String(h.suggestTime || '')];
        return list.some(function (t) {
          const s = String(t || '');
          return /^\d{2}:\d{2}$/.test(s) && s <= hm;
        });
      }
      const st = String(h.suggestTime || '');
      if (!/^\d{2}:\d{2}$/.test(st) || st > hm) return false;
      return true;
    });
    if (habitDue.length) {
      const h0 = habitDue[0];
      const target0 = Number(h0.target) || 1;
      const left0 = Math.max(1, target0 - countOf(d, h0.id));
      items.push({
        key: 'habit-' + h0.id,
        text: h0.id === 'h_breathe'
          ? '「' + String(h0.name || '478呼吸法') + '」今天还差 ' + left0 + ' 组'
          : '「' + String(h0.name || '习惯') + '」还没打卡',
        view: h0.id === 'h_breathe' ? 'breathe' : 'habits'
      });
    }

    const wmod = state.modules && state.modules.water;
    if (wmod && wmod.on !== false) {
      const water = moduleAsHabit('water');
      const target = Math.max(1, Number(water.target) || 9);
      const done = countOf(d, water.id);
      if (done < target) {
        const last = (state.events || [])
          .filter(e => e.d === d && e.id === water.id && Number(e.delta) > 0)
          .map(e => String(e.at || '')).sort().pop();
        const gap = last ? (Date.now() - new Date(last).getTime()) / 3600000 : null;
        if (gap === null || gap >= 1.5) {
          items.push({
            key: 'water',
            text: '喝水还差 ' + (target - done) + ' ' + (water.unit || '杯') +
              (gap === null ? '，今天还没记' : '，已 ' + Math.floor(gap) + ' 小时没记'),
            view: 'today'
          });
        }
      }
    }

    /* v223：自定义提醒的浏览器本地通知——之前 notifyChannels 勾了「浏览器」也永远不弹
       （这里根本没有 notice 条目），数据列表却标「会发送」，属于虚假承诺。
       口径与后端 lb_schedule_notices 一致：once/daily/weekly/monthly（31 号小月按月末）。 */
    (state.notices || []).forEach(function (n) {
      if (!n || (n.on === false)) return;
      const id = String(n.id || '');
      const text = String(n.text || '').trim();
      const time = String(n.time || '');
      if (!id || !text || !/^([01]\d|2[0-3]):[0-5]\d$/.test(time) || time > hm) return;
      const mode = String(n.mode || 'daily');
      let hit = false;
      if (mode === 'once') {
        hit = String(n.date || '') === d;
      } else if (mode === 'daily') {
        hit = true;
      } else if (mode === 'weekly') {
        hit = (Array.isArray(n.weeks) ? n.weeks : []).map(Number).indexOf(now.getDay()) >= 0;
      } else if (mode === 'monthly') {
        const md = Math.max(1, Math.min(31, Math.round(Number(n.monthday)) || 1));
        const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        hit = now.getDate() === Math.min(md, dim);
      }
      if (!hit) return;
      items.push({ key: 'notice-' + id, text: text, view: 'config', time: time });
    });
    return items;
  }

  /* 最多铺 3 条，剩下的折成「还有 N 条」——
     提醒来源从 3 类扩到 6 类之后，全铺开会把首屏整块顶下去 */
  function remindBannerHtml() {
    if (mode === 'landing' || !cloud.user) return '';
    if (remindDismissedOn()) return '';
    const items = remindItems();
    if (!items.length) return '';
    const shown = items.slice(0, 3);
    const rest = items.length - shown.length;
    return '<div class="remind-bar" role="status">' +
      '<span class="remind-ico">⏰</span>' +
      '<div class="remind-body">' +
        shown.map(i => '<span class="remind-item">' + esc(i.text) + '</span>').join('') +
        (rest > 0 ? '<span class="remind-item remind-more">还有 ' + rest + ' 条</span>' : '') +
      '</div>' +
      '<button type="button" class="remind-go" data-act="remind-go" data-view="' + esc(items[0].view) + '">去看看</button>' +
      '<button type="button" class="remind-x" data-act="remind-dismiss" title="今天不再提醒">今天不再提醒</button>' +
    '</div>';
  }

  /* 标题闪烁：只闪计数，切回来立即恢复原标题 */
  function remindSync() {
    remindCount = (mode === 'landing' || !cloud.user || remindDismissedOn()) ? 0 : remindItems().length;
    if (!remindCount) { remindStop(); return; }
    if (remindTimer) return;
    remindFlip = false;
    remindTimer = setInterval(() => {
      remindFlip = !remindFlip;
      document.title = remindFlip ? '(' + remindCount + ') ' + BASE_TITLE : BASE_TITLE;
    }, 1400);
  }

  function remindStop() {
    if (remindTimer) { clearInterval(remindTimer); remindTimer = null; }
    if (document.title !== BASE_TITLE) document.title = BASE_TITLE;
  }

  /* ============================================================
     系统通知
     浏览器只在页面还活着时才会跑定时器，所以「关掉网页也要响」
     只能靠系统日历接管（设置页里导出 .ics）。
     这里的通知补的是另一半场景：页面开着，但已经切到别的 App。
     ============================================================ */
  const NOTIFY_ON_KEY = 'lifeboard.notify.on';
  const NOTIFY_SENT_KEY = 'lifeboard.notify.sent';
  const INSTALL_TIP_KEY = 'lifeboard.install.dismissed';

  function notifySupported() {
    return typeof Notification !== 'undefined'
      && 'serviceWorker' in navigator
      && typeof ServiceWorkerRegistration !== 'undefined'
      && 'showNotification' in ServiceWorkerRegistration.prototype;
  }

  function notifyWanted() {
    try { return localStorage.getItem(NOTIFY_ON_KEY) === '1'; } catch (e) { return false; }
  }

  /* off / granted / denied / default / unsupported —— 设置页按这个改文案 */
  function notifyState() {
    if (!notifySupported()) return 'unsupported';
    if (!notifyWanted()) return 'off';
    return Notification.permission;
  }

  function notifySentKeys() {
    try {
      const raw = JSON.parse(localStorage.getItem(NOTIFY_SENT_KEY) || '{}');
      return (raw && raw.d === todayStr() && Array.isArray(raw.keys)) ? raw.keys : [];
    } catch (e) { return []; }
  }

  function notifyMarkSent(keys) {
    const all = notifySentKeys().concat(keys)
      .filter((k, i, arr) => arr.indexOf(k) === i).slice(-40);
    try {
      localStorage.setItem(NOTIFY_SENT_KEY, JSON.stringify({ d: todayStr(), keys: all }));
    } catch (e) {}
  }

  async function notifyEnable() {
    if (!notifySupported()) { toast('这个浏览器不支持系统通知'); return; }
    if (location.protocol !== 'https:' && !/^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
      toast('系统通知需要 HTTPS 才能开启');
      return;
    }
    let perm = Notification.permission;
    if (perm === 'default') {
      try { perm = await Notification.requestPermission(); } catch (e) { perm = 'denied'; }
    }
    if (perm !== 'granted') {
      try { localStorage.removeItem(NOTIFY_ON_KEY); } catch (e) {}
      render();
      toast(perm === 'denied' ? '浏览器拦下了通知，去站点设置里允许后再试' : '没有开启通知');
      return;
    }
    try { localStorage.setItem(NOTIFY_ON_KEY, '1'); } catch (e) {}
    render();
    if (remindItems().length) await notifyPing(true);
    toast('已开启 · 切到别的应用也会提醒');
  }

  function notifyDisable() {
    try { localStorage.removeItem(NOTIFY_ON_KEY); } catch (e) {}
    render();
    toast('已关闭系统通知');
  }

  /* force=true 时忽略「今天已经发过」，用于刚给权限时立刻验证一次 */
  /* v211：浏览器通知也套同一份文案模板。remindItems 的条目只有 key/text/view，
     这里按 key 前缀推断场景；没有模板时退回原来的「明序 + text」。 */
  function remindKind(it) {
    const k = String(it.key || '');
    if (k.indexOf('med-') === 0) return 'med';
    if (k.indexOf('task-') === 0) return 'task';
    if (k.indexOf('h_water') >= 0) return 'water';
    if (k.indexOf('h_move') >= 0) return 'move';
    if (k.indexOf('h_breathe') >= 0) return 'breathe';
    return 'habit';
  }

  /* 板块的浏览器渠道：关掉就不弹本地通知（服务端不发送，这一列只由前端消费） */
  function notifyBrowserChannelOn(kind) {
    const b = (notifyRoute && notifyRoute.boards) ? notifyRoute.boards[kind] : null;
    if (!b || !b.channels) return true;
    return b.channels.browser !== false;
  }

  function notifyBrowserTpl(it) {
    const kind = remindKind(it);
    const t = notifyRoute && notifyRoute.templates;
    const scene = (t && t.scenes) ? t.scenes[kind] : null;
    if (!scene) return { title: '明序', body: String(it.text || '') };
    const vars = {
      '{标题}': '明序',
      '{正文}': String(it.text || ''),
      '{时间}': '',
      '{类目}': (notifyRoute.kinds && notifyRoute.kinds[kind]) || '',
      '{场景}': notifyBoardName(kind),
      '{来源}': kind,
      '{功能}': notifyBoardName(kind),
      '{优先级}': '',
      '{浏览器文案}': String(it.text || '')
    };
    const apply = function (s) {
      return String(s || '').replace(/\{[^{}]+\}/g, function (m) {
        return vars[m] !== undefined ? vars[m] : m;
      });
    };
    return {
      title: apply(scene.title) || '明序',
      body: apply(scene.browser || scene.body || '') || String(it.text || '')
    };
  }

  async function notifyPing(force) {
    if (!notifySupported() || !notifyWanted() || Notification.permission !== 'granted') return;
    if (mode === 'landing' || !cloud.user || remindDismissedOn()) return;
    if (notifyRoute === undefined) {
      await notifyRouteLoad();   /* 通知可能先于打开通知路由页，先静默取一次板块配置 */
    }
    const sent = notifySentKeys();
    const items = remindItems().filter(function (i) {
      if (!force && sent.indexOf(i.key) >= 0) return false;
      /* force = 授权后的验证推送，不受渠道开关限制；日常通知按板块浏览器渠道过滤 */
      return force || notifyBrowserChannelOn(remindKind(i));
    });
    if (!items.length) return;
    let reg = null;
    try { reg = await navigator.serviceWorker.ready; } catch (e) { return; }
    if (!reg || typeof reg.showNotification !== 'function') return;
    items.slice(0, 3).forEach(it => {
      try {
        const nt = notifyBrowserTpl(it);
        const p = reg.showNotification(nt.title, {
          body: nt.body,
          tag: it.key,
          icon: './icons/icon-192.png',
          badge: './icons/icon-192.png',
          data: { view: it.view }
        });
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) { /* 被系统限制时静默跳过，不影响页面本身 */ }
    });
    /* 标记全部而不是只标记发出去的 3 条：否则 60 秒后的下一次检查
       会把剩下几条当成新的补发一遍，连着弹两轮 */
    notifyMarkSent(items.map(i => i.key));
  }

  /* ---------- 装到主屏 ---------- */
  let deferredInstall = null;

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function isStandalone() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || navigator.standalone === true;
  }

  async function installApp() {
    if (deferredInstall) {
      const ev = deferredInstall;
      deferredInstall = null;
      try { ev.prompt(); await ev.userChoice; } catch (e) {}
      render();
      return;
    }
    toast(isIOS()
      ? 'Safari 里点底部「分享」→「添加到主屏幕」'
      : '浏览器菜单里找「安装应用」或「添加到主屏幕」');
  }

  function installTipDismissed() {
    try { return localStorage.getItem(INSTALL_TIP_KEY) === '1'; } catch (e) { return true; }
  }

  function toast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ============================================================
     今日视图
     ============================================================ */
  /* ============================================================
     非常驻习惯卡（v2 版式）
     ------------------------------------------------------------
     **与常驻五项彻底分开**：喝水 / 戒烟 / 运动 / 478 / 用药 走 vitalCard 与
     各自的模块卡，本函数只负责「其他习惯」。两套设计互不影响。

     版式语法照对标站：
       顶部身份色条 → 标题行（类型徽标 + 节奏 + 本周计数 + 右上状态）
       → 七日条（周一起，固定七列）→ 副行（点阵 / 戒除计数 / 连续天数）
       → 未完成 | 完成 → 备注
     ============================================================ */
  function habitCardV2(h, d) {
    const target = Math.max(1, Number(h.target) || 1);
    const isQ = isQuitSemantics(h);
    const c = countOf(d, h.id);
    const done = met(h, d);
    const skip = isSkipped(d, h.id);
    const slips = isQ ? quitSlips(h, d) : 0;
    const broken = slips > 0;
    const streak = streakOn(h, d);
    const best = habitBest(h, d);

    /* 右上状态：三种文案，两种底色。红只给「还没做完」。
       v204：戒除生效日起没打卡就是「今日待打卡」（走 badge 初值），
       与周条空圈、连续天数断掉保持一致；戒烟与历史仍按「没记失守即守住」。 */
    let badge = '今日待打卡', badgeCls = 'wait';
    if (skip || broken) { badge = '今日未完成'; badgeCls = 'bad'; }
    else if (done) { badge = '今日已完成'; badgeCls = 'ok'; }
    else if (schedOf(h).kind === 'interval' && intervalDone(h, d) && !met(h, d)) {
      badge = '未到打卡时间'; badgeCls = 'wait';
    }

    /* 节奏：一句话说清「多久做一次、做到多少」 */
    const sc = schedOf(h);
    let pace = '每天';
    if (isSmoke(h)) pace = '每天保持 0 次';
    else if (isQ) pace = quitNeedsCheckin(h, d) ? '每天打卡守住' : '每天保持 0 次';
    else if (sc.kind === 'weekdays') pace = schedDaysText(sc.days);
    else if (sc.kind === 'weekly') pace = '每周 ' + sc.perWeek + ' 次';
    else if (sc.kind === 'interval') pace = '每 ' + sc.intervalDays + ' 天';
    else if (sc.kind === 'monthly') pace = '每月 ' + sc.day + ' 日';
    else if (isDeadlineHabit(h)) pace = '每天 · ' + h.deadline + ' 前';
    else if (target > 1) pace = '每天 · 目标 ' + target + ' ' + (h.unit || '次');

    /* 计数位的分母跟着节奏走：周型用选中天数，周配额用 perWeek，其余仍是 7 */
    let weekText = '本周 ' + habitWeekDone(h, d) + '/7';
    if (sc.kind === 'weekdays') {
      weekText = '本周 ' + habitWeekDone(h, d) + '/' + sc.days.length;
    } else if (sc.kind === 'weekly') {
      const mp = metPeriod(h, d);
      weekText = mp.left > 0
        ? ('本周 ' + mp.done + '/' + mp.target + ' · 还差 ' + mp.left)
        : ('本周 ' + mp.done + '/' + mp.target + ' · 已达成');
    } else if (sc.kind === 'interval') {
      weekText = '每 ' + sc.intervalDays + ' 天';
    }

    const meta = '<span class="habit-kind ' + (isQ ? 'quit' : 'build') + '">' +
        (isQ ? '戒除' : '养成') + '</span>' +
      '<span class="hc-pace">' + esc(pace) + '</span>' +
      '<span class="hc-sep">·</span>' +
      '<span class="hc-weekn">' + esc(weekText) + '</span>';

    /* 副行：多目标给点阵，戒除给今日得失，右侧永远是连续天数 */
    let sub = '';
    if (isQ) {
      if (broken) {
        const cap = Math.min(slips, 5);
        let dots = '';
        for (let i = 0; i < cap; i++) dots += '<i></i>';
        sub += '<span class="hc-tally bad">今日失守<b>' + slips + '</b>次' +
          '<span class="hc-dots">' + dots +
          (slips > 5 ? '<em>+' + (slips - 5) + '</em>' : '') + '</span></span>';
      }
      /* 守住时整行不写：右上角已经说「今日已完成」，再补一句是重复。 */
    } else if (target > 1 && target <= 6) {
      let pips = '';
      for (let i = 1; i <= target; i++) {
        const on = i <= c;
        const val = i === c ? i - 1 : i;
        pips += '<button type="button" class="pip' + (on ? ' on' : '') + '"' +
