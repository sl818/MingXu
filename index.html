      weightTxt = '<p class="sum-lead">本月只记录了 1 次体重（' + r.weight.last.weight + ' kg）。</p>';
    } else {
      const d = r.weight.delta;
      weightTxt = '<p class="sum-big">' + (d > 0 ? '+' : '') + d + '<small>kg</small></p>' +
        '<p class="sum-lead">' + r.weight.first.date + ' 的 ' + r.weight.first.weight + ' kg → ' +
        r.weight.last.date + ' 的 ' + r.weight.last.weight + ' kg，共 ' + r.weight.count + ' 次记录。</p>';
    }

    openModal(
      '<div class="modal-card summary-card">' +
        '<div class="sum-head"><h3>月度健康小结</h3><span>' + esc(r.label) + ' · ' + esc(r.span) + '</span></div>' +

        '<div class="sum-sec"><h4>用药依从</h4>' +
          (r.med.pct === null
            ? '<p class="sum-lead">本月没有定时用药。</p>'
            : '<p class="sum-big">' + r.med.pct + '<small>%</small></p>' +
              '<p class="sum-lead">应服 ' + r.med.sched + ' 次，已记录 ' + r.med.taken + ' 次。</p>') +
          medTable +
        '</div>' +

        '<div class="sum-sec"><h4>体重</h4>' + weightTxt + '</div>' +

        '<div class="sum-sec"><h4>习惯完成</h4>' + habitTable + '</div>' +

        '<div class="sum-sec"><h4>记录情况</h4>' +
          '<p class="sum-lead">' + esc(r.label) + '已过 ' + r.elapsed + ' 天：有记录 <b>' + r.recorded +
          '</b> 天（' + pctOf(r.recorded) + '%），达标 <b>' + r.qualified + '</b> 天，最长连续 <b>' +
          r.best + '</b> 天。' +
          (r.avgRate.days ? '有记录的日子里平均完成率 ' +
            Math.round(r.avgRate.rate * 100) + '%。' : '') +
          '</p>' +
        '</div>' +

        '<div class="sum-foot">晚风 Todo · 生成于 ' + esc(r.generatedAt) +
          ' · 本页只反映记录内容，不构成医疗建议</div>' +

        '<div class="btn-row no-print" style="margin-top:14px">' +
          '<button class="btn primary" data-act="print-summary">打印 / 存为 PDF</button>' +
          '<button class="btn" data-act="close-modal">关闭</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* ============================================================
     戒烟页：宽卡 + 月历 + 汇总 + 买烟记录
     ============================================================ */
  function quitHabit() {
    return (state.habits || []).find(function (x) {
      return x && !x.archivedAt && isSmoke(x);
    });
  }

  /* 戒烟页标题：跟用药/待办页一样的 page-head。
     副标题动态——今天没抽写「连续 X 天没抽」，抽了写「今天 X 支 · 比昨天多/少 Y 支」。 */
  function quitPageHead(h) {
    const todayS = dayCravings(h.id, todayStr()).filter(function (e) { return e.k === 's'; }).length;
    const yestS = dayCravings(h.id, fmt(addDays(new Date(), -1))).filter(function (e) { return e.k === 's'; }).length;
    let sub;
    if (todayS === 0) {
      sub = '连续 ' + quitStreak(h) + ' 天没抽';
    } else {
      const diff = todayS - yestS;
      sub = '今天抽了 ' + todayS + ' 支 · ' +
        (diff > 0 ? '比昨天多 ' + diff + ' 支' : (diff < 0 ? '比昨天少 ' + (-diff) + ' 支' : '和昨天一样'));
    }
    return '<div class="page-head">' +
      '<div><h2>戒烟</h2><p>' + sub + '</p></div>' +
      '<div class="head-actions">' +
        '<button class="btn primary" data-act="pack-new">记一笔买烟</button>' +
      '</div>' +
    '</div>';
  }

  function viewQuit() {
    const h = quitHabit();
    if (!h) {
      return '<div class="panel"><h3>戒烟</h3><div class="empty-box">还没有戒烟习惯。去「习惯」页添加一个类型为「戒除」的习惯。</div></div>';
    }
    return '<div class="quit-page">' +
      quitPageHead(h) +
      quitSumPanel(h) +
      '<div class="quit-top">' +
        '<div class="quit-hero">' + quitCard(h, todayStr(), true) + '</div>' +
        quitCalPanel(h) +
      '</div>' +
      quitPacksPanel(h) +
      quitTrendPanel(h) +
    '</div>';
  }

  /* 月历：每天抽了几支。有点一根的日子标红，点过但没抽的标 ✓，其余空白 */
  function quitCalPanel(h) {
    const y = quitCalMonth.getFullYear(), m = quitCalMonth.getMonth();
    /* 周一起始，跟主日历页一致 */
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    const total = new Date(y, m + 1, 0).getDate();
    const today = todayStr();
    const startDay = quitStartDay(h);
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="qc-day blank"></div>';
    for (let dd = 1; dd <= total; dd++) {
      const ds = fmt(new Date(y, m, dd));
      if (ds > today) { cells += '<div class="qc-day fut"><span>' + dd + '</span></div>'; continue; }
      const evs = dayCravings(h.id, ds);
      const ns = evs.filter(function (e) { return e.k === 's'; }).length;
      const nr = evs.length - ns;
      const cls = ns > 0 ? 'bad' : (nr > 0 ? 'ok' : '');
      cells += '<div class="qc-day ' + cls + (ds === today ? ' today' : '') + '">' +
        '<span>' + dd + '</span>' +
        '<b>' + (ns ? ns + ' 支' : (nr ? '✓' : '·')) + '</b>' +
      '</div>';
    }
    return '<div class="panel">' +
      '<div class="qc-head">' +
        '<h3>戒烟月历</h3>' +
        '<div class="month-nav">' +
          '<button class="arrow" data-act="quit-month-shift" data-delta="-1" aria-label="上个月">‹</button>' +
          '<b>' + y + ' 年 ' + (m + 1) + ' 月</b>' +
          '<button class="arrow" data-act="quit-month-shift" data-delta="1" aria-label="下个月">›</button>' +
          '<button class="btn sm ghost" data-act="quit-month-today">本月</button>' +
        '</div>' +
      '</div>' +
      '<div class="qc-wd">' + MONTH_CN.map(function (w) {
        return '<span>' + w + '</span>';
      }).join('') + '</div>' +
      '<div class="qc-grid">' + cells + '</div>' +
      '<div class="qc-legend muted-sm">红=抽了 · 绿✓=忍住 · 灰·=没记</div>' +
    '</div>';
  }

  /* 抽烟趋势折线图：x 轴日期、y 轴每日「点一根」次数，右上角切周/月/季。
     只统计 k==='s'（抽了），「忍一次」不是抽烟，不混进来。 */
  function quitTrendPanel(h) {
    const range = quitTrendRange;
    const today = new Date();
    const days = [];
    for (let i = range - 1; i >= 0; i--) {
      const ds = fmt(addDays(today, -i));
      const n = dayCravings(h.id, ds).filter(function (e) { return e.k === 's'; }).length;
      days.push({ date: ds, v: n });
    }
    const total = days.reduce(function (s, d) { return s + d.v; }, 0);
    const avg = total / range;
    const RANGE_CN = { 7: '周', 30: '月', 90: '季' };
    const tabs = [7, 30, 90].map(function (r) {
      return '<button type="button" class="qt-tab' + (r === range ? ' on' : '') +
        '" data-act="quit-trend-range" data-range="' + r + '">' + RANGE_CN[r] + '</button>';
    }).join('');
    const body = total
      ? quitTrendSvg(days, avg, range)
      : '<div class="qt-empty">这个区间还没有抽烟记录，记几笔之后这里会画出趋势</div>';
    return '<div class="panel"><div class="qc-head">' +
      '<h3>抽烟趋势</h3>' +
      '<div class="qt-tabs">' + tabs + '</div>' +
      '</div>' +
      '<div class="qt-sub muted-sm">近 ' + range + ' 天 · 平均每天 ' + avg.toFixed(1) + ' 支</div>' +
      body +
    '</div>';
  }

  function quitTrendSvg(days, avg, range) {
    const W = 960, H = 150, L = 34, R = 16, T = 14, B = 24;
    const pw = W - L - R, ph = H - T - B;
    let hi = 1;
    days.forEach(function (d) { if (d.v > hi) hi = d.v; });
    hi = Math.max(1, Math.ceil(hi));
    const yy = function (v) { return T + (hi - v) / hi * ph; };
    const xx = function (i) { return days.length === 1 ? L + pw / 2 : L + i / (days.length - 1) * pw; };

    let g = '';
    /* y 轴刻度：hi 小时每个整数一个刻度（0/1/2...），hi 大时取 0/中/顶 三个。
       别用 Math.round(hi*(1-t)) 那套——hi=1 时中间刻度 round 成 1，和顶部重复。 */
    const ticks = [];
    if (hi <= 3) { for (let v = 0; v <= hi; v++) ticks.push(v); }
    else { ticks.push(0, Math.round(hi / 2), hi); }
    ticks.forEach(function (v) {
      const y = yy(v);
      g += '<line class="qt-grid" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text class="qt-lbl" x="' + (L - 6) + '" y="' + (y + 3.4).toFixed(1) + '" text-anchor="end">' + v + '</text>';
    });

    /* 平均虚线：一眼看出最近在平均线之上还是之下 */
    const ay = yy(Math.min(avg, hi));
    g += '<line class="qt-avg" x1="' + L + '" y1="' + ay.toFixed(1) + '" x2="' + (W - R) + '" y2="' + ay.toFixed(1) + '"><title>平均 ' + avg.toFixed(1) + ' 支</title></line>';
    /* 平均标签放左上：放右上会盖住最新数据点（折线尾部） */
    g += '<text class="qt-avg-lbl" x="' + (L + 4) + '" y="' + (ay - 4).toFixed(1) + '" text-anchor="start">平均 ' + avg.toFixed(1) + '</text>';

    /* 折线连所有天（含 0 值），圆点只标有抽烟的天 */
    const d = days.map(function (dd, i) {
      return (i ? 'L' : 'M') + xx(i).toFixed(1) + ',' + yy(dd.v).toFixed(1);
    }).join(' ');
    g += '<path class="qt-line" d="' + d + '"/>';
    days.forEach(function (dd, i) {
      if (!dd.v) return;
      const last = i === days.length - 1;
      g += '<circle class="qt-dot' + (last ? ' last' : '') + '" cx="' + xx(i).toFixed(1) + '" cy="' + yy(dd.v).toFixed(1) + '" r="' + (last ? 3.6 : 2.6) + '">' +
        '<title>' + dd.date + ' · ' + dd.v + ' 支</title></circle>';
    });

    /* x 轴标签：7 天每天都标，30 天每 7 天，90 天每 15 天 */
    const step = range <= 7 ? 1 : (range <= 30 ? 7 : 15);
    const idx = [];
    for (let i = 0; i < days.length; i += step) idx.push(i);
    if (idx[idx.length - 1] !== days.length - 1) idx.push(days.length - 1);
    const used = [];
    idx.forEach(function (i) {
      const cx = Math.round(xx(i));
      if (used.indexOf(cx) >= 0) return;
      used.push(cx);
      g += '<text class="qt-lbl" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' +
        days[i].date.slice(5).replace('-', '/') + '</text>';
    });

    return '<svg class="qt-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="抽烟趋势折线图">' + g + '</svg>';
  }

  /* 汇总：买烟（本周/本月）+ 抽吸（今天/平均/同比） */
  function quitSumPanel(h) {
    const packs = Array.isArray(state.packs) ? state.packs : [];
    const now = new Date();
    const dow = (now.getDay() + 6) % 7;
    const monday = addDays(now, -dow); monday.setHours(0, 0, 0, 0);
    const monthFirst = new Date(now.getFullYear(), now.getMonth(), 1);
    const nowTs = now.getTime() / 1000;
    const wk = packs.filter(function (p) { return p.at >= monday.getTime() / 1000 && p.at <= nowTs; });
    const mo = packs.filter(function (p) { return p.at >= monthFirst.getTime() / 1000 && p.at <= nowTs; });
    const wkCost = wk.reduce(function (s, p) { return s + (Number(p.price) || 0); }, 0);
    const moCost = mo.reduce(function (s, p) { return s + (Number(p.price) || 0); }, 0);

    const t0 = todayStr();
    const t1 = fmt(addDays(now, -1));
    const todayS = dayCravings(h.id, t0).filter(function (e) { return e.k === 's'; }).length;
    const yestS = dayCravings(h.id, t1).filter(function (e) { return e.k === 's'; }).length;
    const diff = todayS - yestS;
    const diffText = diff === 0
      ? '和昨天一样'
      : (diff > 0 ? '比昨天多 ' + diff + ' 支' : '比昨天少 ' + (-diff) + ' 支');

    let sum30 = 0;
    for (let i = 0; i < 30; i++) {
      const ds = fmt(addDays(now, -i));
      sum30 += dayCravings(h.id, ds).filter(function (e) { return e.k === 's'; }).length;
    }
    const avg = sum30 / 30;

    const card = function (label, big, sub) {
      return '<div class="qsum"><small>' + label + '</small><b>' + big + '</b><span>' + sub + '</span></div>';
    };
    return '<div class="panel"><h3>数据汇总</h3>' +
      '<div class="qsum-grid">' +
        card('本周买烟', wk.length + ' 包', '¥' + wkCost.toFixed(0)) +
        card('本月消费', '¥' + moCost.toFixed(0) + ' 元', '共 ' + mo.length + ' 包') +
        card('今天', todayS + ' 支', diffText) +
        card('平均每天', avg.toFixed(1) + ' 支', '近 30 天' + (avg > 0 ? ' · 折合每 ' + (24 / avg).toFixed(1) + ' 小时一根' : '')) +
      '</div></div>';
  }

  /* 买烟记录列表 */
  function quitPacksPanel(h) {
    const packs = Array.isArray(state.packs) ? state.packs : [];
    const curId = currentPack() ? currentPack().id : '';
    const rows = packs.slice().reverse().map(function (p) {
      const used = packUsed(h, p).length;
      const isCur = p.id === curId;
      return '<div class="qpack' + (isCur ? ' cur' : '') + '">' +
        '<div class="qpack-main">' +
          '<b>' + esc(p.name || '未命名') + (isCur ? ' <em>当前</em>' : '') + '</b>' +
          '<small>' + tsDay(p.at) + ' 开包 · ' + (p.price ? '¥' + p.price : '未填价格') +
            ' · ' + used + '/' + p.size + ' 支</small>' +
        '</div>' +
        '<button class="icon-btn" data-act="pack-edit" data-id="' + p.id + '" title="编辑">✎</button>' +
        '<button class="icon-btn" data-act="pack-del" data-id="' + p.id + '" title="删除">🗑</button>' +
      '</div>';
    }).join('');
    return '<div class="panel"><h3>买烟记录 <button class="btn primary sm" data-act="pack-new">记一笔</button></h3>' +
      '<div class="qpack-list">' + (rows || '<div class="empty-box">还没有买烟记录，点右上角「记一笔」。</div>') + '</div></div>';
  }

  function packModal(pack) {
    const isNew = !pack;
    const p = pack || { name: '', price: '', size: 20, at: Math.round(Date.now() / 1000) };
    openModal('<form class="modal-card" id="pack-form" data-id="' + esc(p.id || '') + '">' +
      '<h3>' + (isNew ? '记一笔买烟' : '编辑买烟记录') + '</h3>' +
      '<div class="form-grid">' +
        '<label class="field"><span>买烟日期</span><input type="date" name="date" value="' + tsDay(p.at) + '"></label>' +
        '<label class="field"><span>烟的名称</span><input name="name" maxlength="20" value="' + esc(p.name || '') + '" placeholder="例如：黄鹤楼"></label>' +
        '<label class="field"><span>价格（元）</span><input name="price" type="number" min="0" step="0.5" value="' + (Number(p.price) || '') + '" placeholder="例如 25"></label>' +
        '<label class="field"><span>一包几支（可选）</span><input name="size" type="number" min="1" max="50" value="' + (Number(p.size) || 20) + '"></label>' +
      '</div>' +
      '<p class="hint">开包日期是「这包开了多久」的起算点。改成今天，就从今天重新计。</p>' +
      '<div class="modal-actions"><span class="spacer"></span>' +
        '<button type="button" class="btn ghost" data-act="close-modal">取消</button>' +
        '<button type="submit" class="btn primary">保存</button></div>' +
    '</form>');
  }

  function savePackForm(form) {
    const id = form.dataset.id || '';
    const get = function (n) {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const date = get('date');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('请选一个买烟日期'); return; }
    const at = Math.round(parseD(date).getTime() / 1000);
    const name = get('name');
    const price = Math.max(0, Math.min(99999, Number(get('price')) || 0));
    const size = clamp(parseInt(get('size'), 10) || 20, 1, 50);
    if (!Array.isArray(state.packs)) state.packs = [];
    if (id) {
      const p = state.packs.find(function (x) { return x.id === id; });
      if (p) { p.at = at; p.name = name; p.price = price; p.size = size; }
    } else {
      state.packs.push({ id: uid(), at: at, name: name, price: price, size: size });
    }
    state.packs.sort(function (a, b) { return a.at - b.at; });
    save();
    render();
    closeModal();
    toast('买烟记录已保存');
  }

  function viewStats() {
    const now = new Date();
    const range = [7, 30, 90].indexOf(statsRange) >= 0 ? statsRange : 30;
    const last7 = [];
    const rangeDays = [];
    for (let i = 6; i >= 0; i--) last7.push(fmt(addDays(now, -i)));
    for (let i = range - 1; i >= 0; i--) rangeDays.push(fmt(addDays(now, -i)));

    const week = rateOver(last7);
    const rangeStats = rateOver(rangeDays);
    const monthStart = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
    const monthDays = [];
    for (let i = 0; i < 31; i++) {
      const ds = fmt(addDays(now, -i));
      if (ds < monthStart) break;
      monthDays.push(ds);
    }
    const month = rateOver(monthDays);
    const doneTasks = state.tasks.filter(t => t.status === 'done');
    const weekDone = doneTasks.filter(t => t.doneAt && t.doneAt >= last7[0]).length;

    const pct = v => v.days ? Math.round(v.rate * 100) + '%' : '—';

    const bars = rangeDays.map((ds, bi) => {
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const pctv = rec ? Math.round(st.ratio * 100) : 0;
      const h = rec ? Math.max(4, pctv) : 0;
      const barCls = !rec ? 'zero' : (st.ratio >= 0.75 ? '' : 'low');
      const labelStep = Math.max(1, Math.ceil(rangeDays.length / 10));
      const showLabel = (rangeDays.length - 1 - bi) % labelStep === 0;
      const label = showLabel ? String(parseD(ds).getDate()) : '';
      return '<div class="bar-col ' + (ds === todayStr() ? 'is-today' : '') + '" title="' + ds +
          (rec ? ' 完成 ' + st.done + '/' + st.total + '（' + pctv + '%）' : ' 无记录') + '">' +
        '<div class="bar-wrap"><i class="' + barCls + '"' + (rec ? ' style="height:' + h + '%"' : '') + '></i></div>' +
        '<span>' + label + '</span>' +
      '</div>';
    }).join('');

    const hstats = state.habits.filter(h => !h.optional && !isArchived(h)).map(h => {
      const isQuit = h.type === 'quit';
      /* 戒烟的点阵按事件算：有「抽了」= miss，只有「忍住了」= ok，
         一条都没有 = 空（没记录 ≠ 成功，不能混为一谈）。 */
      const dots = rangeDays.map(ds => {
        let rec, ok, tip;
        if (isQuit) {
          const evs = dayCravings(h.id, ds);
          const ns = evs.filter(function (e) { return e.k === 's'; }).length;
          const nr = evs.length - ns;
          rec = evs.length > 0;
          ok = rec && ns === 0;
          tip = ds + ' · ' + (rec ? ns + ' ' + quitWord(h).hero + ' / ' + nr + ' ' + quitWord(h).hold : '无记录');
        } else {
          rec = hasRecords(ds);
          ok = rec && met(h, ds);
          tip = ds + ' · ' + countOf(ds, h.id) + ' ' + esc(h.unit || '次');
        }
        const cls = rec ? (ok ? 'ok' : 'miss') : '';
        return '<i class="' + cls + '" title="' + tip + '"></i>';
      }).join('');

      let detail;
      if (isQuit) {
        detail = '戒除 · 连续 ' + quitStreak(h) + ' 天'
          + (quitTotal(h) > quitStreak(h) ? ' · 累计 ' + quitTotal(h) + ' 天' : '');
      } else {
        detail = '每天 ' + (h.target || 1) + ' ' + (h.unit || '次');
      }

      let hitText = '';
      if (isQuit) {
        const q = quitRange(h, range);
        const w = quitWord(h);
        hitText = '近 ' + range + ' 天 ' + w.hero + ' <b>' + q.smoke + '</b> · ' + w.hold + ' <b>' + q.resist + '</b>'
          + (q.total ? ' · 抵御率 <b>' + Math.round(q.rate * 100) + '%</b>' : '');
      } else {
        let hit = 0;
        rangeDays.forEach(ds => {
          if (hasRecords(ds) && met(h, ds)) hit++;
        });
        hitText = '近 ' + range + ' 天达标 <b>' + hit + '</b> 天';
      }

      return '<div class="hstat" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<div class="hstat-name">' +
          '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
          '<div><b>' + esc(h.name) + '</b><small>' + esc(detail) + '</small></div>' +
        '</div>' +
        '<div class="hstat-dots" style="grid-template-columns:repeat(' + rangeDays.length + ',1fr);gap:' + (rangeDays.length > 30 ? '2px' : '4px') + ';max-width:' + (rangeDays.length > 30 ? '100%' : '240px') + '">' + dots + '</div>' +
        '<div class="hstat-meta">' + hitText + '<span class="streak">🔥 连续 ' + habitStreak(h) + ' <i>天</i></span></div>' +
        '</div>';
    }).join('');

    const doneToday = state.tasks.filter(t => t.status === 'done' && t.doneAt === todayStr()).length;

    const nowMin = now.getHours() * 60 + now.getMinutes();
    const medStats = (state.meds || []).map(med => {
      if (isPrn(med)) {
        let prn = 0;
        rangeDays.forEach(ds => { prn += prnKeys(ds, med.id).length; });
        return '<div class="med-stat">' +
          '<div class="med-stat-head"><span>💊 ' + esc(med.name) + '</span><b>按需 · 记录 ' + prn + ' 次</b></div>' +
          '<div class="med-stat-sub">' + esc(medCourseLabel(med)) + (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
            (med.status !== 'active' ? ' · 已暂停' : '') + '</div>' +
        '</div>';
      }
      let sched = 0, taken = 0;
      rangeDays.forEach(ds => {
        if (!medActiveOn(med, ds)) return;
        medDoseSlots(med).forEach(slot => {
          if (ds === todayStr()) {
            const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
            if (slotMin > nowMin) return;
          }
          sched++;
          if (doseAt(ds, med.id, slot)) taken++;
        });
      });
      const rate = sched ? Math.round(taken / sched * 100) : 0;
      const status = med.status !== 'active' ? '已暂停' : (sched ? '' : '暂无排期');
      return '<div class="med-stat">' +
        '<div class="med-stat-head"><span>💊 ' + esc(med.name) + '</span><b>' +
          (sched ? taken + ' / ' + sched + ' 次 · ' + rate + '%' : '—') + '</b></div>' +
        '<div class="med-stat-bar"><i style="width:' + rate + '%"></i></div>' +
        '<div class="med-stat-sub">' + esc(medCourseLabel(med)) + (medStockLabel(med) ? ' · ' + esc(medStockLabel(med)) : '') +
          (status ? ' · ' + esc(status) : '') + '</div>' +
      '</div>';
    }).join('');
    const medPanel = '<div class="panel"><h3>用药记录 <span class="muted-sm">（近 ' + range + ' 天，按应服次数）</span></h3>' +
      (medStats || '<div class="empty-box">还没有用药记录。</div>') +
      '</div>';

    /* 同一习惯同一分钟内的 +1 / -1 合并成净变化，来回撤销不再刷屏 */
    const rawLog = (Array.isArray(state.events) ? state.events : [])
      .filter(e => e && e.at && e.id && e.delta && !isNaN(new Date(e.at).getTime()))
      .slice(-80)
      .reverse();
    const logBuckets = new Map();
    rawLog.forEach(e => {
      const at = new Date(e.at);
      const minute = pad2(at.getHours()) + ':' + pad2(at.getMinutes());
      /* 用药带 slot（比如 08:00），把 slot 也放进键里，同一分钟两种药不会被并成一条 */
      const slot = e.slot || '';
      const key = e.id + '|' + slot + '|' + fmt(at) + '|' + minute;
      if (logBuckets.has(key)) {
        logBuckets.get(key).delta += Number(e.delta);
      } else {
        logBuckets.set(key, { id: e.id, slot: slot, kind: e.kind || '', delta: Number(e.delta), at: at, d: e.d, minute: minute });
      }
    });
    const logList = [...logBuckets.values()].filter(b => b.delta !== 0).slice(0, 24);
    const logShown = statsLogOpen ? logList : logList.slice(0, 5);
    const logHidden = logList.length - logShown.length;
    const todayS = todayStr();
    const logRows = logShown.map(e => {
      const h = state.habits.find(x => x.id === e.id);
      const md = h ? null : medById(e.id);
      const at = e.at;
      const opDate = fmt(at);
      let rel;
      if (opDate === todayS) rel = '今天';
      else if (opDate === fmt(addDays(new Date(), -1))) rel = '昨天';
      else rel = (at.getMonth() + 1) + '/' + at.getDate();
      const backfill = e.d && e.d !== opDate ? '补记 ' + (Number(e.d.slice(5, 7)) + '/' + Number(e.d.slice(8, 10))) : '';
      const logName = md
        ? md.name + (e.slot ? ' · ' + e.slot : '')
        : (h ? h.name : '已删除的习惯');
      const logIco = md ? '💊' : ((h && h.icon) || '·');
      return '<div class="log-row" style="--hc:' + esc(md ? '#6f7f91' : ((h && h.color) || '#8a8f83')) + '">' +
        '<span class="log-time">' + e.minute + '</span>' +
        '<span class="log-ico">' + esc(logIco) + '</span>' +
        '<span class="log-name">' + esc(logName) + '</span>' +
        '<span class="log-delta' + (e.delta < 0 ? ' minus' : (!md && h && h.type === 'quit' ? ' bad' : '')) + '">' + (e.delta > 0 ? '+' : '') + e.delta + '</span>' +
        '<span class="log-date">' + rel + (backfill ? ' · ' + backfill : '') + '</span>' +
      '</div>';
    }).join('');
    const logToggle = logList.length > 5
      ? '<button type="button" class="log-more" data-act="stats-log-toggle">' +
          (statsLogOpen ? '收起' : '查看更多' + (logHidden > 0 ? ' · 还有 ' + logHidden + ' 条' : '')) +
        '</button>'
      : '';
    const logPanel = '<div class="panel">' +
      '<div class="panel-head"><h3>打卡时间 <span class="muted-sm">（最近 ' + logList.length + ' 次操作，含服药）</span></h3>' + logToggle + '</div>' +
      (logRows || '<div class="empty-box">还没有操作记录，去今日页点一下习惯试试。</div>') +
      '</div>';

    return '' +
      '<div class="page-head"><div><h2>数据统计</h2><p>不追求完美，只看趋势。只统计有记录的日子：柱状图灰线 = 无记录，浅色 = 未达标，实心 = 达标（≥75%）。</p></div>' +
        '<div class="range-switch">' + [7, 30, 90].map(n =>
          '<button type="button" class="' + (range === n ? 'active' : '') + '" data-act="set-stats-range" data-range="' + n + '">' + n + ' 天</button>'
        ).join('') + '</div></div>' +
      '<div class="stat-grid">' +
        '<div class="stat-card"><small>连续达标</small><b>' + overallStreak() + ' <i>天</i></b><span>完成率 ≥ 75% 记一天</span></div>' +
        '<div class="stat-card"><small>近 ' + range + ' 天完成率</small><b>' + pct(rangeStats) + '</b><span>' + rangeStats.days + ' 天有记录</span></div>' +
        '<div class="stat-card"><small>本月完成率</small><b>' + pct(month) + '</b><span>' + month.days + ' 天有记录</span></div>' +
        '<div class="stat-card"><small>已完成任务</small><b>' + doneTasks.length + ' <i>条</i></b><span>近 7 天 +' + weekDone + ' · 今天 +' + doneToday + '</span></div>' +
      '</div>' +
      '<div class="panel"><h3>近 ' + range + ' 天完成率</h3><div class="chart" style="gap:' + (range > 30 ? '1px' : (range > 14 ? '3px' : '8px')) + '">' + bars + '</div></div>' +
      monthReviewPanel() +
      /* 这两个原来在日历右栏。挪到统计页是因为它们本质是「本月的汇总」，
         和「看哪一天发生了什么」无关，而且占掉了时间线要用的宽度。 */
      '<div class="panel"><h3>本月用药 <span class="muted-sm">（按应服次数）</span></h3>' +
        monthMedPanel(now.getFullYear(), now.getMonth()) +
      '</div>' +
      '<div class="panel"><h3>本月习惯 <span class="muted-sm">（只看有记录的日子）</span></h3>' +
        monthHabitRowsHtml(now.getFullYear(), now.getMonth()) +
      '</div>' +
      quitPanel(range) +
      medTrendPanel(range, rangeDays) +
      '<div class="panel"><h3>习惯明细 <span class="muted-sm">（最近 ' + range + ' 天）</span></h3>' +
        (hstats || '<div class="empty-box">还没有习惯数据。</div>') +
      '</div>' +
      weightStatsPanel(range) +
      medPanel +
      logPanel +
      '<div class="panel"><h3>任务概览</h3>' +
        '<div class="cal-summary" style="margin:0">' +
          '<span>待办 <b>' + liveTasks().filter(t => t.status === 'todo').length + '</b></span>' +
          '<span>进行中 <b>' + liveTasks().filter(t => t.status === 'doing').length + '</b></span>' +
          '<span>已完成 <b>' + doneTasks.length + '</b></span>' +
        '</div>' +
      '</div>';
  }

  /* ============================================================
     设置视图
     ============================================================ */
  function calcBmi(weight, heightCm) {
    const h = Number(heightCm) / 100;
    const w = Number(weight);
    if (!isFinite(h) || !isFinite(w) || h <= 0 || w <= 0) return 0;
    return Math.round(w / (h * h) * 10) / 10;
  }

  function bmiCategory(bmi) {
    const v = Number(bmi);
    if (!isFinite(v) || v <= 0) return { label: '—', tone: '', note: '还没有 BMI 数据' };
    if (v < 18.5) return { label: '偏轻', tone: 'low', note: '低于成人正常范围' };
    if (v < 24) return { label: '正常', tone: 'ok', note: '在成人正常范围内' };
    if (v < 28) return { label: '超重', tone: 'warn', note: '高于成人正常范围' };
    return { label: '肥胖', tone: 'high', note: '明显高于成人正常范围' };
  }

  function weightRecords() {
    return (Array.isArray(state.weights) ? state.weights : [])
      .filter(w => w && w.date && Number(w.weight) > 0)
      .slice()
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) ||
        String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  }

  function weightForDate(d) {
    const list = weightRecords().filter(w => w.date === d);
    return list.length ? list[list.length - 1] : null;
  }

  function weightInRange(list, range) {
    if (!range) return list;
    const start = fmt(addDays(new Date(), -(range - 1)));
    return list.filter(w => w.date >= start);
  }

  function weightRangeSwitchHtml() {
    return '<div class="range-switch">' + [[7, '7 天'], [30, '30 天'], [90, '90 天'], [0, '全部']].map(p =>
      '<button type="button" class="' + (weightRange === p[0] ? 'active' : '') + '" data-act="set-weight-range" data-range="' + p[0] + '">' + p[1] + '</button>'
    ).join('') + '</div>';
  }

  /* 历史体重折线图：等比缩放的 SVG，含健康区间背景带 */
  function weightLineChart(list, profile) {
    if (!list || !list.length) {
      return '<div class="ww-empty">这个区间还没有体重记录<br>记一笔之后，这里会画出曲线</div>';
    }
    const W = 600, H = 200, L = 38, R = 14, T = 16, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const pts = list.map(w => ({ date: w.date, v: Number(w.weight), bmi: w.bmi })).filter(p => isFinite(p.v));
    if (!pts.length) return '<div class="ww-empty">这个区间还没有体重记录</div>';

    let lo = pts[0].v, hi = pts[0].v;
    pts.forEach(p => { if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; });

    const height = Number(profile && profile.height) || 0;
    let bandLo = null, bandHi = null;
    if (height > 0) {
      const m2 = (height / 100) * (height / 100);
      bandLo = Math.round(18.5 * m2 * 10) / 10;
      bandHi = Math.round(23.9 * m2 * 10) / 10;
    }
    const pad = Math.max(0.6, (hi - lo) * 0.16);
    lo -= pad; hi += pad;
    /* 目标体重：纳入值域，保证虚线一定可见（否则目标在区间外时画不出来） */
    const goal = Number(profile && profile.goalWeight) || 0;
    if (goal > 0) {
      if (goal < lo) lo = goal - pad * 0.4;
      if (goal > hi) hi = goal + pad * 0.4;
    }
    const span = Math.max(0.5, hi - lo);
    const yy = v => T + (hi - v) / span * ph;
    const xx = i => pts.length === 1 ? L + pw / 2 : L + (i / (pts.length - 1)) * pw;

    let g = '';
    [0, 0.5, 1].forEach(t => {
      const v = hi - span * t;
      const y = T + ph * t;
      g += '<line class="ww-grid" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text class="ww-lbl" x="' + (L - 6) + '" y="' + (y + 3.4).toFixed(1) + '" text-anchor="end">' + v.toFixed(1) + '</text>';
    });

    if (bandLo !== null) {
      const clampY = v => Math.max(T, Math.min(T + ph, v));
      const yTop = clampY(yy(bandHi)), yBot = clampY(yy(bandLo));
      if (yBot - yTop > 0.5) {
        g += '<rect class="ww-band" x="' + L + '" y="' + yTop.toFixed(1) + '" width="' + pw + '" height="' + (yBot - yTop).toFixed(1) + '"/>';
        if (yy(bandHi) >= T && yy(bandHi) <= T + ph) {
          g += '<line class="ww-band-line" x1="' + L + '" y1="' + yTop.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yTop.toFixed(1) + '"/>';
        }
        if (yy(bandLo) >= T && yy(bandLo) <= T + ph) {
          g += '<line class="ww-band-line" x1="' + L + '" y1="' + yBot.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yBot.toFixed(1) + '"/>';
        }
      }
    }

    /* 目标体重虚线 + 右侧标签 */
    if (goal > 0) {
      const gy = Math.max(T, Math.min(T + ph, yy(goal)));
      g += '<line class="ww-goal" x1="' + L + '" y1="' + gy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + gy.toFixed(1) + '">' +
        '<title>目标 ' + goal.toFixed(1) + ' kg</title></line>' +
        '<text class="ww-goal-lbl" x="' + (W - R) + '" y="' + (gy - 4).toFixed(1) + '" text-anchor="end">目标 ' + goal.toFixed(1) + '</text>';
    }

    const d = pts.map((p, i) => (i ? 'L' : 'M') + xx(i).toFixed(1) + ',' + yy(p.v).toFixed(1)).join(' ');    g += '<path class="ww-line" d="' + d + '"/>';
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      g += '<circle class="ww-dot' + (last ? ' last' : '') + '" cx="' + xx(i).toFixed(1) + '" cy="' + yy(p.v).toFixed(1) + '" r="' + (last ? 3.6 : 2.6) + '">' +
        '<title>' + p.date + ' · ' + p.v + ' kg</title></circle>';
    });

    const idx = pts.length === 1 ? [0] : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    const used = [];
    idx.forEach(i => {
      const cx = Math.round(xx(i));
      if (used.indexOf(cx) >= 0) return;
      used.push(cx);
      g += '<text class="ww-lbl" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' +
        (pts[i].date.slice(5).replace('-', '/')) + '</text>';
    });

    return '<svg class="ww-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="历史体重折线图">' + g + '</svg>';
  }

  function weightBandText(profile) {
    const h = Number(profile && profile.height) || 0;
    if (!h) return 'BMI = 体重(kg) ÷ 身高(m)²；成人参考范围 18.5–23.9，未成年人仅参考。';
    const m2 = (h / 100) * (h / 100);
    const lo = Math.round(18.5 * m2 * 10) / 10;
    const hi = Math.round(23.9 * m2 * 10) / 10;
    return '浅绿色带是健康区间 ' + lo + '–' + hi + ' kg（BMI 18.5–23.9，按 ' + h + ' cm 换算）；未成年人仅参考。';
  }

  function weightSummaryHtml(list) {
    if (!list || !list.length) return '<div class="ww-empty">还没有数据</div>';
    const first = list[0], last = list[list.length - 1];
    let hi = Number(first.weight), lo = Number(first.weight), sum = 0;
    list.forEach(w => {
      const v = Number(w.weight);
      if (v > hi) hi = v;
      if (v < lo) lo = v;
      sum += v;
    });
    const avg = Math.round(sum / list.length * 10) / 10;
    const delta = Math.round((Number(last.weight) - Number(first.weight)) * 10) / 10;
    const deltaText = delta === 0 ? '持平' : (delta > 0 ? '↑ +' : '↓ ') + Math.abs(delta) + ' kg';
    const info = bmiCategory(last.bmi);
    const row = (label, value, unit) =>
      '<div class="wsum-row"><small>' + label + '</small><b>' + value + (unit ? '<i>' + unit + '</i>' : '') + '</b></div>';
    return row('起始 → 当前', first.weight + ' → ' + last.weight, ' kg') +
      row('区间变化', deltaText, '') +
      row('最高 / 最低', hi + ' / ' + lo, ' kg') +
      row('平均', avg, ' kg') +
      row('记录', list.length, ' 次') +
      row('当前 BMI', last.bmi + ' ' + info.label, '');
  }

  function weightStatsPanel(days) {
    const count = Math.max(1, Number(days) || 30);
    const start = fmt(addDays(new Date(), -(count - 1)));
    const list = weightRecords().filter(w => w.date >= start);
    if (!list.length) {
      return '<div class="panel"><h3>体重与 BMI</h3>' +
        '<div class="empty-box">最近 ' + count + ' 天没有体重记录，去「体重」页记录一次。</div></div>';
    }
    const latest = list[list.length - 1];
    const first = list[0];
    const info = bmiCategory(latest.bmi);
    const diff = Math.round((latest.weight - first.weight) * 10) / 10;
    const delta = diff === 0 ? '持平' : (diff > 0 ? '+' : '') + diff + ' kg';
    return '<div class="panel">' +
      '<div class="panel-head"><h3>体重与 BMI</h3><span class="muted-sm">最近 ' + count + ' 天</span></div>' +
      '<div class="weight-stat-row">' +
        '<div><small>最新体重</small><b>' + esc(latest.weight) + ' <i>kg</i></b></div>' +
        '<div><small>BMI</small><b>' + esc(latest.bmi) + ' <i>' + esc(info.label) + '</i></b></div>' +
        '<div><small>较区间首次</small><b>' + delta + '</b></div>' +
      '</div>' +
      weightLineChart(list, normalizeBodyProfile(state.bodyProfile)) +
      '<p class="cal-hint">' + esc(latest.date) + ' 记录 · ' + esc(latest.age) + ' 岁 · ' + esc(latest.height) + ' cm' +
        (latest.age < 18 ? ' · 未成年 BMI 仅参考' : '') + '</p>' +
    '</div>';
  }

  /* 习惯页排序：纯视图偏好，不进 state。刻意「离开页面仍保留」——
     排序不会隐藏任何数据，用户选过一次多半希望它记住。 */
  let habitSort = 'created';
  const HABIT_SORTS = [['created', '按创建'], ['progress', '今日进度'], ['streak', '连续天数']];

  function habitSortHtml() {
    return '<div class="habit-sort">' +
      HABIT_SORTS.map(s =>
        '<button type="button" class="tag-chip' + (habitSort === s[0] ? ' active' : '') +
        '" data-act="habit-sort" data-sort="' + s[0] + '" title="按' + s[1] + '排序">' + s[1] + '</button>'
      ).join('') +
    '</div>';
  }

  function habitManageRows() {
    const base = state.habits.filter(h => !h.med && !isArchived(h));
    const d = todayStr();
    const ratioOf = h => {
      /* 戒烟不写 checks，countOf 恒为 0，只能看 met（当天有没有「点一根」） */
      if (h.type === 'quit') return met(h, d) ? 1 : 0;
      const c = countOf(d, h.id);
      const t = Number(h.target) || 1;
      return Math.min(1, c / t);
    };
    const order = new Map(base.map((h, i) => [h.id, i]));
    const list = base.slice();
    if (habitSort === 'progress') {
      list.sort((a, b) => ratioOf(b) - ratioOf(a) || order.get(a.id) - order.get(b.id));
    } else if (habitSort === 'streak') {
      list.sort((a, b) => habitStreak(b) - habitStreak(a) || order.get(a.id) - order.get(b.id));
    }
    return list.map(h => {
      const pin = isPinned(h);
      const detail = h.id === 'h_breathe'
        ? '每天一组 · ' + (Number(h.breatheCycles) || 4) + ' 次循环 · 建议 ' + String(h.suggestTime || '15:00')
        : (h.type === 'quit'
          ? '戒除 · 连续 ' + quitStreak(h) + ' 天'
          : '养成 · 每天 ' + (h.target || 1) + ' ' + esc(h.unit || '次'));
      return '<div class="habit-row" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-row-info"><b>' + esc(h.name) + '</b><small>' + detail + (h.note ? ' · ' + esc(h.note) : '') + '</small></div>' +
        (pin ? '<span class="pin-tag">常驻</span>' : '') +
        '<button class="icon-btn" data-act="habit-edit" data-id="' + h.id + '" title="编辑">✎</button>' +
        (pin ? '' : '<button class="icon-btn" data-act="habit-archive" data-id="' + h.id + '" title="归档">🗄</button>') +
        (pin ? '' : '<button class="icon-btn danger" data-act="habit-del" data-id="' + h.id + '" title="删除">✕</button>') +
        '</div>';
    }).join('');
  }

  function archivedHabitRows() {
    return state.habits.filter(h => !h.med && isArchived(h)).map(h => {
      return '<div class="habit-row archived" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
        '<span class="habit-icon sm" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-row-info"><b>' + esc(h.name) + '</b><small>已归档 · 历史打卡保留，不计入今日和统计</small></div>' +
        '<button class="mini-btn" data-act="habit-restore" data-id="' + h.id + '">恢复</button>' +
        '<button class="icon-btn danger" data-act="habit-del" data-id="' + h.id + '" title="永久删除">✕</button>' +
        '</div>';
    }).join('');
  }

  /* ============ 用药页面：进行中 / 未开始 / 暂停 / 已停用 ============ */
  const MED_PHASES = [
    { key: 'active',  label: '进行中', hint: '' },
    { key: 'future',  label: '未开始', hint: '还没到开始日期' },
    { key: 'paused',  label: '暂停中', hint: '恢复后会重新出现在今日页' },
    { key: 'stopped', label: '已停用', hint: '' }
  ];
  function medPhaseOf(med) {
    const t = todayStr();
    if (med.status === 'paused') return 'paused';
    if (med.status === 'stopped' || med.status === 'done') return 'stopped';
    if (!isPrn(med) && med.startDate && med.startDate > t) return 'future';
    if (!isPrn(med) && med.courseType === 'short' && med.endDate && med.endDate < t) return 'stopped';
    return 'active';
  }
  /* 板块内排序：餐前 → 随餐 → 空腹 → 餐后 → 未设置，同组按第一个服药时间 */
  const MED_MEAL_RANK = { before: 0, with: 1, empty: 2, after: 3 };
  function medMealRank(m) {
    const k = (m && m.mealTiming) || '';
    return MED_MEAL_RANK[k] === undefined ? 4 : MED_MEAL_RANK[k];
  }
  function medSortFn(a, b) {
    const d = medMealRank(a) - medMealRank(b);
    if (d) return d;
    const ta = medDoseSlots(a)[0] || '\uffff';
    const tb = medDoseSlots(b)[0] || '\uffff';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return String(a.name || '').localeCompare(String(b.name || ''), 'zh');
  }
  /* 药名简称：去掉常见剂型后缀，太长再截断——用于卡片顶部的药名条 */
  const MED_FORM_TAIL = /(肠溶胶囊|软胶囊|缓释胶囊|胶囊|肠溶片|缓释片|分散片|咀嚼片|薄膜衣片|片|颗粒|口服液|糖浆|滴剂|喷雾剂|散剂|散|丸|注射剂|乳膏|软膏|凝胶|贴剂)$/;
  function medShortName(name) {
    let s = String(name || '').trim();
    const trimmed = s.replace(MED_FORM_TAIL, '');
    if (trimmed.length >= 2) s = trimmed;
    return s.length > 8 ? s.slice(0, 8) + '…' : s;
  }

  /* 一行一种药：主信息＝每天几次 / 每次几颗 / 餐前餐后多久（重点），次要信息＝用途厂商疗程 */
  function medRowHtml(med) {
    const t = todayStr();
    const slots = medDoseSlots(med);
    const prn = isPrn(med);
    const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
    const meal = mealTimingText(med);
    const phase = medPhaseOf(med);

    const head = [];
    if (prn) head.push('按需服用');
    else if (slots.length) head.push('每天' + cnCount(slots.length) + '次');
    head.push('每次 ' + dose + ' ' + (med.doseUnit || ''));
    const mainText = head.join('，') + (meal ? ' ' + meal : '');

    const sec = [];
    if (med.purpose && med.purpose !== '其他') sec.push(med.purpose);
    if (med.manufacturer) sec.push(med.manufacturer);
    if (med.strength) sec.push(med.strength);
    const course = medCourseLabelOn(med, t);
    if (course) sec.push(course);

    const canTap = phase === 'active';
    const slotHtml = slots.map(slot => {
      if (!canTap) return '<span class="med-slot is-static">' + esc(slot) + '</span>';
      const entry = doseAt(t, med.id, slot);
      return '<button type="button" class="med-slot' + (entry ? ' done' : '') + '"' +
        ' data-act="' + (entry ? 'med-undo' : 'med-take') + '" data-id="' + med.id + '" data-slot="' + esc(slot) + '"' +
        ' data-date="' + t + '"' +
        ' title="' + (entry ? '点击撤销 ' : '点击记录 ') + esc(slot) + '">' + esc(slot) + (entry ? ' ✓' : '') + '</button>';
    }).join('');

    /* 按需药：在行内直接给「＋ 记一次」，不再依赖用药弹层 */
    const prnKeysToday = prn ? prnKeys(t, med.id).sort() : [];
    const prnTimes = prnKeysToday.map(k => {
      const e = state.doses[t][med.id][k];
      const at = new Date(e.at);
      return isNaN(at.getTime()) ? '' : pad2(at.getHours()) + ':' + pad2(at.getMinutes());
    }).filter(Boolean);
    const prnHtml = (prn && canTap)
      ? '<div class="med-row-prn">' +
          '<span class="med-row-prn-cnt">今日已记 <b>' + prnKeysToday.length + '</b> 次' +
            (prnTimes.length ? ' · ' + esc(prnTimes.join(' / ')) : '') + '</span>' +
          '<button type="button" class="med-prn-add" data-act="med-prn" data-id="' + med.id + '" data-date="' + t + '">＋ 记一次</button>' +
          (prnKeysToday.length ? '<button type="button" class="med-prn-undo" data-act="med-prn-undo" data-id="' + med.id + '" data-date="' + t + '">撤销</button>' : '') +
        '</div>'
      : '';

    const stock = medStockLabel(med);
    let info = med.medInfo || med.note || '';
    /* 备注若只是把用餐时机又写了一遍（旧数据常见），不再重复显示 */
    if (info && meal) {
      const norm = s => String(s || '').replace(/[\s·,，、]/g, '');
      const onlyTiming = /^(餐前|餐后|随餐|空腹|饭前|饭后)/.test(info) && norm(info).length <= 8;
      if (norm(info) === norm(meal) || onlyTiming) info = '';
    }

    return '<article class="med-row">' +
      '<span class="med-row-ico">' + esc(med.emoji || '💊') + '</span>' +
      '<div class="med-row-main">' +
        '<div class="med-row-title"><b>' + esc(med.name) + '</b></div>' +
        '<p class="med-row-dose"><b>' + esc(mainText) + '</b>' +
          (sec.length ? '<span>· ' + esc(sec.join(' · ')) + '</span>' : '') + '</p>' +
        (info ? '<p class="med-row-note">' + esc(info) + '</p>' : '') +
        (slotHtml ? '<div class="med-row-slots">' + slotHtml + '</div>' : '') +
        prnHtml +
      '</div>' +
      '<div class="med-row-side">' +
        (stock ? '<span class="med-row-stock">' + esc(stock) + '</span>' : '') +
        '<div class="med-row-ops">' +
          '<button class="icon-btn" data-act="med-edit" data-id="' + med.id + '" title="编辑">✎</button>' +
          '<button class="icon-btn" data-act="med-toggle" data-id="' + med.id + '" title="' +
            (med.status === 'active' ? '暂停' : '恢复') + '">' + (med.status === 'active' ? '⏸' : '▶') + '</button>' +
          '<button class="icon-btn danger" data-act="med-del" data-id="' + med.id + '" title="删除">✕</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }

  function viewMeds() {
    const list = state.meds || [];
    const buckets = { active: [], future: [], paused: [], stopped: [] };
    list.forEach(m => { buckets[medPhaseOf(m)].push(m); });
    Object.keys(buckets).forEach(k => buckets[k].sort(medSortFn));

    const sched = medScheduledFor(todayStr());
    const taken = medTakenCount(todayStr());
    const prnCount = list.filter(m => m.status === 'active' && isPrn(m)).length;
    let sub = '记录医生给你的用药方案，按时服完。';
    if (sched.length) sub = '今天 ' + taken + ' / ' + sched.length + ' 次已记录' + (prnCount ? ' · 另有 ' + prnCount + ' 种按需药' : '');
    else if (prnCount) sub = '今天没有定时用药，有 ' + prnCount + ' 种按需药';
    else if (list.length) sub = '今天没有需要服的药';

    /* 「进行中」组内再按疗程切三段：长期 / 短期 / 按需。
       只有一个疗程时不加小标题，免得少量药品被切得太碎。 */
    const COURSE_PARTS = [
      { key: 'long',  label: '长期' },
      { key: 'short', label: '短期' },
      { key: 'prn',   label: '按需' }
    ];
    const courseOf = m => (isPrn(m) ? 'prn' : (m.courseType === 'short' ? 'short' : 'long'));
    const activeBoardHtml = arr => {
      const byCourse = { long: [], short: [], prn: [] };
      arr.forEach(m => byCourse[courseOf(m)].push(m));
      const used = COURSE_PARTS.filter(p => byCourse[p.key].length);
      if (used.length < 2) return '<div class="med-board">' + arr.map(medRowHtml).join('') + '</div>';
      return used.map(p =>
        '<div class="med-sub-head">' + p.label + '<i>' + byCourse[p.key].length + ' 种</i></div>' +
        '<div class="med-board">' + byCourse[p.key].map(medRowHtml).join('') + '</div>'
      ).join('');
    };

    const groups = MED_PHASES.map(ph => {
      const arr = buckets[ph.key];
      if (!arr.length) return '';
      return '<section class="med-group">' +
        '<div class="med-group-head"><h3>' + ph.label + '</h3><i>' + arr.length + ' 种</i>' +
          (ph.hint ? '<span class="med-group-hint">' + ph.hint + '</span>' : '') + '</div>' +
        (ph.key === 'active'
          ? activeBoardHtml(arr)
          : '<div class="med-board">' + arr.map(medRowHtml).join('') + '</div>') +
      '</section>';
    }).join('');

    const stockWarn = buckets.active.filter(m => {
      const d = medStockDays(m);
      return d !== null && d <= 7;
    }).length;
    const todayPct = sched.length ? Math.min(100, Math.round(taken / sched.length * 100)) : 0;
    const statsHtml = '<div class="med-stats">' +
      '<div class="ms-card"><small>药品总数</small><b>' + list.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>进行中</small><b>' + buckets.active.length + '<i>种</i></b>' +
        (buckets.future.length ? '<span class="ms-sub">另有 ' + buckets.future.length + ' 种未开始</span>' : '') + '</div>' +
      '<div class="ms-card"><small>已暂停</small><b>' + buckets.paused.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>已停用</small><b>' + buckets.stopped.length + '<i>种</i></b></div>' +
      '<div class="ms-card"><small>今日服药</small><b>' + taken + ' / ' + sched.length + '</b>' +
        '<span class="ms-bar"><i style="width:' + todayPct + '%"></i></span></div>' +
      '<div class="ms-card' + (stockWarn ? ' warn' : '') + '"><small>库存告急</small><b>' + stockWarn + '<i>种</i></b>' +
        '<span class="ms-sub">' + (stockWarn ? '7 天内会吃完' : '都在 7 天以上') + '</span></div>' +
      '</div>';

    return '' +
      '<div class="page-head"><div><h2>用药</h2><p>' + esc(sub) + '</p></div>' +
        '<div class="page-acts">' +
          '<button class="btn" data-act="stock-check">盘点库存</button>' +
          '<button class="btn primary" data-act="med-new">＋ 添加用药</button>' +
        '</div></div>' +
      (list.length
        ? statsHtml + groups + '<p class="hint">点时间胶囊记录服药，再点一次撤销。进行中的药会出现在今日页的用药卡里。</p>'
        : '<div class="panel"><div class="empty-box">还没有用药记录。点右上角「添加用药」，添加后会在今日页出现「用药」卡。</div></div>' +
          '<p class="hint">只记录医生给你的方案；应用不提供剂量建议。支持长期、短期疗程和按需用药。</p>');
  }

  function viewHabits() {
    const rows = habitManageRows();
    const archivedRows = archivedHabitRows();
    return '' +
      '<div class="page-head"><div><h2>习惯</h2><p>管理每日习惯与常驻卡。用药在「用药」页单独管理。</p></div>' +
        '<button class="btn primary" data-act="habit-new">＋ 添加习惯</button></div>' +
      '<div class="settings-wrap">' +
      '<div class="panel"><div class="panel-head"><h3>我的习惯</h3>' + habitSortHtml() + '</div>' +
        (rows || '<div class="empty-box">还没有习惯，点右上角添加一个。</div>') +
        '<p class="hint">带「常驻」标记的习惯不能删除或归档；归档后不计入今日、日历和统计，但历史打卡保留。</p>' +
      '</div>' +
      (archivedRows ? '<div class="panel"><h3>已归档</h3>' + archivedRows +
        '<p class="hint">恢复后会重新出现在今日、日历和统计里；永久删除才会移除历史打卡。</p></div>' : '') +
      '</div>';
  }

  function viewWeight() {
    const list = weightRecords();
    const latest = list.length ? list[list.length - 1] : null;
    const previous = list.length > 1 ? list[list.length - 2] : null;
    const first = list.length ? list[0] : null;
    const profile = normalizeBodyProfile(state.bodyProfile);
    const hasProfile = profile.age > 0 && profile.height > 0;
    const info = latest ? bmiCategory(latest.bmi) : bmiCategory(0);
    const diff = latest && previous ? Math.round((latest.weight - previous.weight) * 10) / 10 : null;
    const total = latest && first && list.length > 1 ? Math.round((latest.weight - first.weight) * 10) / 10 : null;
    const deltaText = v => v === null ? '首次记录' : (v === 0 ? '持平' : (v > 0 ? '↑ ' : '↓ ') + Math.abs(v) + ' kg');

    const profileHtml = '<section class="panel profile-card">' +
      '<div class="panel-head"><h3>身体档案</h3>' +
        '<button type="button" class="btn sm" data-act="profile-edit">' + (hasProfile ? '编辑档案' : '建立档案') + '</button></div>' +
      (hasProfile
        ? '<div class="profile-grid"><div><small>年龄</small><b>' + esc(profile.age) + ' <i>岁</i></b></div>' +
          '<div><small>身高</small><b>' + esc(profile.height) + ' <i>cm</i></b></div>' +
          '<div><small>' + (profile.goalWeight > 0 ? '目标体重' : 'BMI 参考') + '</small><b>' +
            (profile.goalWeight > 0
              ? esc(profile.goalWeight) + ' <i>kg</i>'
              : '18.5–23.9') + '</b></div>' +
          (profile.goalWeight > 0 && latest
            ? '<div><small>距目标</small><b>' + (Math.round((latest.weight - profile.goalWeight) * 10) / 10 > 0 ? '还差 ' : '已低于目标 ') +
                Math.abs(Math.round((latest.weight - profile.goalWeight) * 10) / 10) + ' <i>kg</i></b></div>'
            : '') +
          '</div>' +
          '<p class="hint">年龄和身高只需维护一次；之后记录体重只填日期和体重。' +
            (profile.goalWeight > 0 ? '目标体重可随时在档案里改或清空，清空后折线图不再画目标线。' : '') + '</p>'
        : '<div class="empty-box">还没有身体档案。先补全年龄和身高，之后记录体重只需要填体重。</div>') +
    '</section>';

    const rows = list.slice().reverse().map(w => {
      const wi = bmiCategory(w.bmi);
      return '<div class="weight-row">' +
        '<span class="weight-day">' + esc(w.date.slice(5).replace('-', '/')) + '</span>' +
        '<b class="weight-value">' + esc(w.weight) + ' <i>kg</i></b>' +
        '<span class="bmi-pill ' + wi.tone + '">BMI ' + esc(w.bmi) + ' · ' + esc(wi.label) + '</span>' +
        '<small>' + esc(w.age) + ' 岁 · ' + esc(w.height) + ' cm</small>' +
        '<span class="weight-row-actions">' +
          '<button type="button" class="mini-btn" data-act="weight-edit" data-id="' + w.id + '">编辑</button>' +
          '<button type="button" class="mini-btn ghost" data-act="weight-del" data-id="' + w.id + '">删除</button>' +
        '</span>' +
      '</div>';
    }).join('');

    const empty = '<div class="panel"><div class="empty-box">还没有体重记录。记下第一次，之后就能看到体重和 BMI 趋势。</div>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="weight-new">记录第一次</button></div></div>';

    const chartList = weightInRange(list, weightRange);
    const hero = latest ? '<section class="weight-hero panel">' +
      '<div class="weight-main">' +
        '<small>最新体重</small>' +
        '<div class="weight-big">' + esc(latest.weight) + '<i>kg</i></div>' +
        '<div class="weight-date">' + esc(latest.date) + ' · ' + esc(latest.age) + ' 岁 · ' + esc(latest.height) + ' cm</div>' +
      '</div>' +
      '<div class="weight-bmi ' + info.tone + '">' +
        '<b>' + esc(latest.bmi) + '</b>' +
        '<span>BMI · ' + esc(info.label) + '</span>' +
        '<small>' + (latest.age < 18 ? '未成年 BMI 仅参考' : esc(info.note)) + '</small>' +
      '</div>' +
      '<div class="weight-metrics">' +
        '<div><small>较上次</small><b>' + deltaText(diff) + '</b></div>' +
        '<div><small>累计变化</small><b>' + deltaText(total) + '</b></div>' +
        '<div><small>记录</small><b>' + list.length + ' 次</b></div>' +
      '</div>' +
    '</section>' : '';

    return '' +
      '<div class="page-head"><div><h2>体重</h2><p>维护身体档案，记录体重，自动计算 BMI。</p></div>' +
        '<button class="btn primary" data-act="weight-new">＋ 记录体重</button></div>' +
      profileHtml +
      (latest ? hero : empty) +
      '<div class="weight-charts">' +
        '<section class="panel">' +
          '<div class="panel-head"><h3>历史体重折线图</h3>' + weightRangeSwitchHtml() + '</div>' +
          weightLineChart(chartList, profile) +
          '<p class="cal-hint">' + weightBandText(profile) + '</p>' +
        '</section>' +
        '<section class="panel">' +
          '<div class="panel-head"><h3>统计</h3><span class="muted-sm">' + (weightRange ? '近 ' + weightRange + ' 天' : '全部记录') + '</span></div>' +
          weightSummaryHtml(chartList) +
        '</section>' +
      '</div>' +
      (latest ? '<div class="panel"><h3>记录明细</h3><div class="weight-list">' + rows + '</div></div>' : '');
  }

  function essayAll() {
    return (Array.isArray(state.essays) ? state.essays : []).filter(e => e && String(e.text || '').trim())
      .slice()
      .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0));
  }

  function essayList() {
    const all = essayAll();
    return essayTag ? all.filter(e => (e.tags || []).indexOf(essayTag) >= 0) : all;
  }

  function essayExcerpt(text) {
    const s = String(text || '').replace(/\s+/g, ' ').trim();
    return s.length > 180 ? s.slice(0, 180) + '…' : s;
  }

  function viewEssays() {
    const all = essayAll();
    const allTags = [];
    all.forEach(e => (e.tags || []).forEach(tag => { if (allTags.indexOf(tag) < 0) allTags.push(tag); }));
    if (essayTag && allTags.indexOf(essayTag) < 0) essayTag = '';
    const list = essayList();
    const cards = list.map(e => {
      const title = e.title || '无标题';
      const count = String(e.text || '').replace(/\s/g, '').length;
      const tags = (e.tags || []).map(tag =>
        '<button type="button" class="essay-tag" data-act="essay-tag-filter" data-tag="' + esc(tag) + '">#' + esc(tag) + '</button>'
      ).join('');
      return '<article class="essay-card">' +
        '<div class="essay-meta"><span>' + esc(e.date) + '</span><span>' + count + ' 字</span></div>' +
        '<h3 class="essay-title">' + esc(title) + '</h3>' +
        '<p class="essay-text">' + esc(essayExcerpt(e.text)) + '</p>' +
        (tags ? '<div class="essay-tags">' + tags + '</div>' : '') +
        '<div class="essay-actions">' +
          '<button type="button" class="mini-btn" data-act="essay-edit" data-id="' + e.id + '">编辑</button>' +
          '<button type="button" class="mini-btn ghost" data-act="essay-del" data-id="' + e.id + '">删除</button>' +
        '</div>' +
      '</article>';
    }).join('');

    const tagFilter = allTags.length
      ? '<div class="essay-tags essay-tag-filter">' +
        '<button type="button" class="tag-chip' + (!essayTag ? ' active' : '') + '" data-act="essay-tag-filter" data-tag="">全部</button>' +
        allTags.map(tag => '<button type="button" class="tag-chip' + (essayTag === tag ? ' active' : '') + '" data-act="essay-tag-filter" data-tag="' + esc(tag) + '">#' + esc(tag) + '</button>').join('') +
        '</div>'
      : '';

    return '' +
      '<div class="page-head"><div><h2>随笔</h2><p>随手记下想法、片段和今天发生的事。</p></div>' +
        '<button class="btn primary" data-act="essay-new">＋ 写一篇</button></div>' +
      tagFilter +
      (all.length
        ? (list.length
          ? '<div class="essay-grid">' + cards + '</div>'
          : '<div class="panel"><div class="empty-box">这个标签下还没有随笔。</div><div class="btn-row" style="justify-content:center"><button class="btn" data-act="essay-tag-filter" data-tag="">查看全部</button></div></div>')
        : '<div class="panel"><div class="empty-box">还没有随笔。写下一句话，也算今天留下的痕迹。</div>' +
          '<div class="btn-row" style="justify-content:center"><button class="btn primary" data-act="essay-new">写第一篇</button></div></div>');
  }

  /* 手机端「更多」抽屉：一次列出所有页面，不必再进设置往下找。
     桌面端不显示（桌面侧栏本来就有全部页面），但留着也无害。 */
  function morePagesSheet() {
    const items = MORE_PAGES.concat([{ key: 'settings', label: '设置', icon: 'settings' }]);
    const cells = items.map(function (p2) {
      return '<button type="button" class="ps-cell' + (view === p2.key ? ' active' : '') + '"' +
        ' data-act="more-go" data-view="' + p2.key + '">' +
        '<span class="ps-ico">' + icon(p2.icon) + '</span>' +
        '<span class="ps-label">' + esc(p2.label) + '</span>' +
      '</button>';
    }).join('');
    openModal('' +
      '<div class="modal-card page-sheet" id="more-sheet">' +
        '<span class="ps-grip"></span>' +
        '<h3>去哪个页面</h3>' +
        '<div class="ps-grid">' + cells + '</div>' +
      '</div>');
    /* 抽屉和遮罩都让出底部导航的高度：这样抽屉开着时，底部 4 个 tab 仍然能直接点，
       不必先关抽屉再切页。点遮罩空白处依然会关闭。 */
    requestAnimationFrame(function () {
      const sheet = $('#more-sheet');
      if (!sheet) return;
      const barEl = $('#mobile-nav');
      const shown = barEl && getComputedStyle(barEl).display !== 'none';
      const h = shown ? Math.round(barEl.getBoundingClientRect().height) : 0;
      /* 注意：遮罩带 backdrop-filter，会形成包含块，里面的 fixed 元素是相对遮罩定位的。
         所以只把遮罩的底边抬起来，抽屉自己保持 bottom:0，就会正好落在导航条上方。 */
      const back = sheet.parentElement;
      if (back && h) back.style.bottom = h + 'px';
    });
  }

  function viewMore() {
    const items = [
      ['meds', 'pill', '用药', '进行中的药、疗程进度和库存'],
      ['essays', 'essay', '随笔', '随手记录文字和片段'],
      ['weight', 'weight', '体重', '身体档案、BMI 和体重趋势'],
      ['calendar', 'calendar', '日历', '按天回看完成度和体重'],

      '<div class="more-grid">' + items.map(x =>
        '<button type="button" class="more-card" data-nav="' + x[0] + '">' +
          '<span class="habit-icon" style="--hc:var(--accent)">' + icon(x[1]) + '</span>' +
          '<span><b>' + x[2] + '</b><small>' + x[3] + '</small></span>' +

      ).join('') + '</div>' +

        '<button type="button" class="btn" data-act="theme">切换深色 / 浅色</button>' +

  /* 今日页顶部的安装提示：只在没装、没被关掉时出现，点 × 之后永久不打扰 */
  function installTipHtml() {
    if (view !== 'today') return '';
    if (mode === 'landing' || !cloud.user) return '';
    if (isStandalone() || installTipDismissed()) return '';
    return '<div class="install-tip">' +

  /* ---------- 日历订阅 ----------
     订阅地址由服务端发：系统日历不带 Cookie，只能靠 URL 里的令牌认人。
     icsUrl 三态：undefined = 还没问过；null = 没有链接；string = 已有。 */
  let icsUrl;
  let icsLoading = false;

  function icsStateText() {
    if (icsUrl === undefined) return '读取中';
    return icsUrl ? '已生成 · 系统日历会自己来拉' : '还没生成';
  }

  async function icsLoad() {
    if (icsLoading || icsUrl !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    icsLoading = true;
    try {
      const r = await cloudApi('ics_status');
      icsUrl = (r && r.ok && typeof r.url === 'string' && r.url) ? r.url : null;
    } catch (e) {
      icsUrl = null;
    }
    icsLoading = false;
    if (view === 'settings') render();
  }

  async function icsReset() {
    if (icsUrl && !confirm('重新生成会让旧链接立刻失效，已经订阅的日历要重新添加一次。继续吗？')) return;
    try {
      const r = await cloudApi('ics_reset', {});
      if (r && r.ok && typeof r.url === 'string' && r.url) {
        icsUrl = r.url;
        render();
        toast('订阅链接已生成 · 复制后去日历里添加');
      } else {
        toast('生成失败，请稍后再试');
      }
    } catch (e) {
      toast('网络连接失败');
    }
  }

  async function icsCopy() {
    if (!icsUrl) return;
    try {
      await navigator.clipboard.writeText(icsUrl);
      toast('已复制，去日历里粘贴');
      return;
    } catch (e) { /* 没有剪贴板权限时退到选中 */ }
    const el = document.getElementById('ics-url');
    if (el) {
      el.focus();
      el.select();
      toast('已选中，按 Ctrl/⌘ + C 复制');
    }
  }

  /* ---------- 手机推送 ----------
     走企业微信机器人，不用 Web Push：国行安卓没有 FCM，Bark 只有 iOS，
     ntfy 这类要靠 App 自己保活会被系统杀掉。微信/企业微信在厂商白名单里。
     pushCfg 三态：undefined = 还没问过；null = 没配置；对象 = 已读到。 */
  let pushCfg;
  let pushLoading = false;
  let pushBusy = false;

  function pushStateText() {
    if (pushCfg === undefined) return '读取中';
    if (!pushCfg || !pushCfg.webhook) return '还没设置';
    return pushCfg.enabled ? '已开启 · 每分钟检查一次' : '已填地址，未开启';
  }

  async function pushLoad() {
    if (pushLoading || pushCfg !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    pushLoading = true;
    try {
      const r = await cloudApi('push_status');
      pushCfg = {
        enabled: !!(r && r.enabled),
        webhook: (r && typeof r.webhook === 'string') ? r.webhook : '',
        sentToday: (r && Number(r.sent_today)) || 0,
        lastSent: (r && r.last_sent) ? String(r.last_sent) : '',
        recent: (r && Array.isArray(r.recent)) ? r.recent : [],
        plan: []
      };
      /* 今日计划是独立的只读接口；它失败不该影响配置区显示 */
      try {
        const p = await cloudApi('push_preview');
        pushCfg.plan = (p && Array.isArray(p.items)) ? p.items : [];
      } catch (e) {
        pushCfg.plan = [];
      }
    } catch (e) {
      pushCfg = null;
    }
    pushLoading = false;
    if (view === 'settings') render();
  }

  function pushHookInput() {
    const el = document.getElementById('push-hook');
    return el ? el.value.trim() : ((pushCfg && pushCfg.webhook) || '');
  }

  async function pushSave(enable) {
    const hook = pushHookInput();
    if (enable && !hook) {
      toast('先把 webhook 地址填进来');
      const el = document.getElementById('push-hook');
      if (el) el.focus();
      return false;
    }
    try {
      const r = await cloudApi('push_save', { webhook: hook, enabled: !!enable });
      pushCfg = Object.assign({ sentToday: 0, lastSent: '' }, pushCfg || {}, {
        webhook: hook, enabled: !!(r && r.enabled)
      });
      render();
      toast(enable ? '推送已开启 · 到点会发到手机上' : '已保存，推送已关闭');
      return true;
    } catch (e) {
      toast(e && e.message ? e.message : '保存失败');
      return false;
    }
  }

  async function pushTest() {
    if (pushBusy) return;
    pushBusy = true;
    try {
      const saved = await pushSave(true);
      if (!saved) return;
      toast('正在发送…');
      try {
        await cloudApi('push_test', {});
        toast('发出去了，看看手机');
      } catch (e) {
        toast(e && e.message ? e.message : '发送失败');
      }
    } finally {
      pushBusy = false;
    }
  }

  function pushBoxHtml() {
    const cfg = pushCfg;
    const hook = cfg && cfg.webhook ? cfg.webhook : '';
    const on = !!(cfg && cfg.enabled);
    const plan = (cfg && Array.isArray(cfg.plan)) ? cfg.plan : [];
    const recent = (cfg && Array.isArray(cfg.recent)) ? cfg.recent : [];
    const KIND_LABEL = { med: '用药', task: '待办', habit: '习惯', report: '汇报' };

    /* 今日计划：时间 + 类型 + 标题/正文 */
    const planHtml = plan.length
      ? plan.map(function (it) {
          const k = String(it.kind || '');
          const body = String(it.body || '').replace(/\n/g, ' · ');
          return '<li class="pc-row">' +
            '<span class="pc-time">' + esc(it.time) + '</span>' +
            '<span class="pc-tag pc-tag-' + esc(k) + '">' + esc(KIND_LABEL[k] || k) + '</span>' +
            '<span class="pc-txt"><b>' + esc(it.title) + '</b>' +
              (body ? '<small>' + esc(body) + '</small>' : '') + '</span>' +
          '</li>';
        }).join('')
      : '<li class="pc-empty">今天没有要推送的内容</li>';

    /* 最近发送：只有时间 + 正文（正文依赖 content 列，旧库为空时退回 slot_key） */
    const recentHtml = recent.length
      ? recent.map(function (r) {
          const txt = String(r.text || '').replace(/\n/g, ' · ');
          const at = String(r.at || '');
          return '<li class="pc-row">' +
            '<span class="pc-time">' + esc(at.slice(11, 16) || at) + '</span>' +
            '<span class="pc-txt"><small>' + esc(txt || r.key || '') + '</small></span>' +
          '</li>';
        }).join('')
      : '<li class="pc-empty">还没有发送记录</li>';

    return '<div class="ntf-box push-center">' +
      '<div class="ntf-head"><span class="ntf-dot ' + (on ? 'on' : '') + '"></span><b>手机推送</b>' +
        '<span class="ntf-state">' + esc(pushStateText()) + '</span></div>' +
      '<p class="muted-sm" style="margin:0 0 10px">用药、到点的任务、习惯会直接发到你的微信。' +
      '和日历订阅的区别是：日历由手机自己算，这个由服务器在那一分钟主动发，' +
      '所以关掉网页也能收到，而且能看到具体是「该吃药了」还是「该做这件事了」。</p>' +
      '<input class="ics-url" id="push-hook" spellcheck="false" ' +
        'placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..." ' +
        'value="' + esc(hook) + '">' +
      '<div class="btn-row">' +
        '<button class="btn primary" data-act="push-test">保存并发一条测试</button>' +
        (on ? '<button class="btn" data-act="push-off">暂停推送</button>' : '') +
        '<button class="btn ghost" data-act="push-refresh">刷新</button>' +
      '</div>' +
      '<p class="ics-hint">企业微信 → 建一个只有自己的<b>内部群</b>（外部群加不了机器人）→ ' +
      '群设置 → 群机器人 → 添加 → 复制 webhook 地址粘到这里。</p>' +
      '<p class="ics-warn">⚠️ 这个地址等于往你群里发消息的钥匙，别贴到公开的地方。' +
      '万一泄露，在企业微信里删掉机器人再重新添加一个就是新地址。</p>' +
      '<div class="pc-sec">' +
        '<div class="pc-sec-head">今日推送计划<span class="pc-count">' + plan.length + ' 条</span></div>' +
        '<ul class="pc-list">' + planHtml + '</ul>' +
      '</div>' +
      '<div class="pc-sec">' +
        '<div class="pc-sec-head">最近发送' +
          (cfg && cfg.sentToday ? '<span class="pc-count">今天已发 ' + cfg.sentToday + ' 条</span>' : '') +
        '</div>' +
        '<ul class="pc-list">' + recentHtml + '</ul>' +
      '</div>' +
    '</div>';
  }

  /* ---------- 提醒设置面板 ---------- */

    const st = notifyState();
    if (st === 'granted') return '已开启 · 页面开着时切到别的 App 也能收到';

       请求一旦失败（cloud.error）就放行，绝不能把用户锁在骨架上。 */
    if (!cloud.error && !cloud.ready && (cloudProbing || cloud.user)) {
      $('#nav').innerHTML = '';

      if (skelNav) skelNav.innerHTML = '';
      $('#main').innerHTML = bootSkelHtml();
      updateSyncIndicator();
      return;

    if (mode === 'landing') {
      $('#nav').innerHTML = '';

      $('#main').innerHTML = landingHtml();
      updateSyncIndicator();

            '<button class="su-btn" data-act="theme">' + (theme === 'dark' ? '浅色' : '深色') + '</button>' +
            '<button class="su-btn" data-act="cloud-logout">退出</button>' +
          '</div>';
      } else {
        su.innerHTML = '';

    const mnav = $('#mobile-nav');

          return '<button class="mobile-add" data-act="quick-add" aria-label="新建">' + icon('plus') + '</button>';
        }
        if (n.key === '__more') {

          return '<button class="mobile-tab ' + (moreActive ? 'active' : '') + '" data-act="more-open" aria-label="更多页面">' +
            icon('more') + '<span>更多</span></button>';
        }
        const active = view === n.key;
        return '<button class="mobile-tab ' + (active ? 'active' : '') + '" data-nav="' + n.key + '" aria-label="' + n.label + '">' +
          icon(n.icon) + '<span>' + n.label + '</span></button>';
      }).join('');

    if (themeBtn) themeBtn.textContent = theme === 'dark' ? '切换浅色模式' : '切换深色模式';
    $('#main').innerHTML = remindBannerHtml() + installTipHtml() + (VIEWS[view] || viewToday)() + siteFooter();
    bindView();

    remindSync();

  function bindView() {
    if (view === 'board') {
      bindBoard();
      bindBoardContext();
    }
    /* 周视图：打开时滚到当前时刻附近。0:00 起算的话一进来全是空白，
       得手动往下拖很久才看到今天的事。只有这一周包含今天才滚。 */
    if (view === 'calendar' && calMode === 'week') {
      const box = $('#wk-scroll');
      if (box) {
        const ws = weekStartOf(calWeek);
        const today = todayStr();
        const inWeek = today >= fmt(ws) && today <= fmt(addDays(ws, 6));
        if (inWeek) {
          const n = new Date();
          box.scrollTop = Math.max(0, (n.getHours() * 60 + n.getMinutes()) / 60 * WK_HOUR_H - 120);
        }
      }
    }
  }

  function bindBoardContext() {
    $$('.col').forEach(col => {
      col.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (col.dataset.status === 'cancelled') return;
        const card = e.target.closest('.task');
        if (card) {
          const t = state.tasks.find(x => x.id === card.dataset.id);
          if (t) taskModal(t);
          return;
        }
        taskModal(null, col.dataset.status);
      });
    });
