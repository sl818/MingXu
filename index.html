  /* 抽烟趋势折线图：x 轴日期、y 轴每日「点一根」次数，右上角切周/月/季。
     只统计 k==='s'（抽了），「忍一次」不是抽烟，不混进来。 */
  function quitTrendPanel(h) {
    const range = quitTrendRange;
    const today = new Date();
    const days = [];
    for (let i = range - 1; i >= 0; i--) {
      const ds = fmt(addDays(today, -i));
      const n = dayCravings(h.id, ds).filter(function (e) { return e.k === 's'; }).length;
      days.push({ date: ds, v: n });
    }
    const total = days.reduce(function (s, d) { return s + d.v; }, 0);
    const avg = total / range;
    const RANGE_CN = { 7: '周', 30: '月', 90: '季' };
    const tabs = [7, 30, 90].map(function (r) {
      return '<button type="button" class="qt-tab' + (r === range ? ' on' : '') +
        '" data-act="quit-trend-range" data-range="' + r + '">' + RANGE_CN[r] + '</button>';
    }).join('');
    const body = total
      ? quitTrendSvg(days, avg, range)
      : '<div class="qt-empty">这个区间还没有抽烟记录，记几笔之后这里会画出趋势</div>';
    return '<div class="panel"><div class="qc-head">' +
      '<h3>抽烟趋势</h3>' +
      '<div class="qt-tabs">' + tabs + '</div>' +
      '</div>' +
      '<div class="qt-sub muted-sm">近 ' + range + ' 天 · 平均每天 ' + avg.toFixed(1) + ' 支</div>' +
      body +
    '</div>';
  }

  function quitTrendSvg(days, avg, range) {
    const W = 960, H = 150, L = 34, R = 16, T = 14, B = 24;
    const pw = W - L - R, ph = H - T - B;
    let hi = 1;
    days.forEach(function (d) { if (d.v > hi) hi = d.v; });
    hi = Math.max(1, Math.ceil(hi));
    const yy = function (v) { return T + (hi - v) / hi * ph; };
    const xx = function (i) { return days.length === 1 ? L + pw / 2 : L + i / (days.length - 1) * pw; };

    let g = '';
    /* y 轴刻度：hi 小时每个整数一个刻度（0/1/2...），hi 大时取 0/中/顶 三个。
       别用 Math.round(hi*(1-t)) 那套——hi=1 时中间刻度 round 成 1，和顶部重复。 */
    const ticks = [];
    if (hi <= 3) { for (let v = 0; v <= hi; v++) ticks.push(v); }
    else { ticks.push(0, Math.round(hi / 2), hi); }
    ticks.forEach(function (v) {
      const y = yy(v);
      g += '<line class="qt-grid" x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '"/>';
      g += '<text class="qt-lbl" x="' + (L - 6) + '" y="' + (y + 3.4).toFixed(1) + '" text-anchor="end">' + v + '</text>';
    });

    /* 平均虚线：一眼看出最近在平均线之上还是之下 */
    const ay = yy(Math.min(avg, hi));
    g += '<line class="qt-avg" x1="' + L + '" y1="' + ay.toFixed(1) + '" x2="' + (W - R) + '" y2="' + ay.toFixed(1) + '"><title>平均 ' + avg.toFixed(1) + ' 支</title></line>';
    /* 平均标签放左上：放右上会盖住最新数据点（折线尾部） */
    g += '<text class="qt-avg-lbl" x="' + (L + 4) + '" y="' + (ay - 4).toFixed(1) + '" text-anchor="start">平均 ' + avg.toFixed(1) + '</text>';

    /* 折线连所有天（含 0 值），圆点只标有抽烟的天 */
    const d = days.map(function (dd, i) {
      return (i ? 'L' : 'M') + xx(i).toFixed(1) + ',' + yy(dd.v).toFixed(1);
    }).join(' ');
    g += '<path class="qt-line" d="' + d + '"/>';
    days.forEach(function (dd, i) {
      if (!dd.v) return;
      const last = i === days.length - 1;
      g += '<circle class="qt-dot' + (last ? ' last' : '') + '" cx="' + xx(i).toFixed(1) + '" cy="' + yy(dd.v).toFixed(1) + '" r="' + (last ? 3.6 : 2.6) + '">' +
        '<title>' + dd.date + ' · ' + dd.v + ' 支</title></circle>';
    });

    /* x 轴标签：7 天每天都标，30 天每 7 天，90 天每 15 天 */
    const step = range <= 7 ? 1 : (range <= 30 ? 7 : 15);
    const idx = [];
    for (let i = 0; i < days.length; i += step) idx.push(i);
    if (idx[idx.length - 1] !== days.length - 1) idx.push(days.length - 1);
    const used = [];
    idx.forEach(function (i) {
      const cx = Math.round(xx(i));
      if (used.indexOf(cx) >= 0) return;
      used.push(cx);
      g += '<text class="qt-lbl" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' +
        days[i].date.slice(5).replace('-', '/') + '</text>';
    });

    return '<svg class="qt-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="抽烟趋势折线图">' + g + '</svg>';
  }
  /* 数据汇总：8 张卡 + 24 小时时段条。全部现算，不存字段——包区间和事件流
     本来就推得出这些。两处口径刻意写进小字：
     ① 「本月消费」按买烟日期算（月头买一条整笔算在月头，看的是支出不是消耗）；
     ② 「平均每天」的分母是戒烟天数（上限 30），不是固定 30 天——刚开始记的前
        半个月会被当成 0 支，均值被压低，「折合几小时一根」跟着一起错。 */
  /* ---- 汇总派生值（v107）---------------------------------------------
     全部从 cravings 现算，不新增任何字段：
       quitStartAvg  起始 7 天的日均支数（不足 7 天按实际天数）
       quitNowAvg    近 N 天日均（默认 7）
       quitWeekAvgs  近 4 周的各自日均（最后一个是本周，可能不满 7 天）
     quitStartDay 之前的日子不计入——那是「开始记」之前，没数据不等于没抽。
     ---------------------------------------------------------------- */
  function quitDailySmoke(h, ds) {
    return dayCravings(h.id, ds).filter(function (e) { return e.k === 's'; }).length;
  }
  function quitStartAvg(h) {
    const start = parseD(quitStartDay(h));
    const today = parseD(todayStr());
    const n = Math.min(7, Math.round((today - start) / 86400000) + 1);
    if (!(n > 0)) return 0;
    let sum = 0;
    for (let i = 0; i < n; i++) sum += quitDailySmoke(h, fmt(addDays(start, i)));
    return sum / n;
  }
  function quitNowAvg(h, days) {
    const d = days || 7;
    let sum = 0;
    for (let i = 0; i < d; i++) sum += quitDailySmoke(h, fmt(addDays(new Date(), -i)));
    return sum / d;
  }
  function quitWeekAvgs(h) {
    const start = quitStartDay(h);
    const out = [];
    for (let w = 3; w >= 0; w--) {
      let sum = 0, n = 0;
      for (let i = 0; i < 7; i++) {
        const ds = fmt(addDays(new Date(), -(w * 7 + i)));
        if (ds < start || ds > todayStr()) continue;
        sum += quitDailySmoke(h, ds);
        n++;
      }
      out.push(n ? sum / n : 0);
    }
    return out;
  }

  function quitSumCardsHtml(h, withHours) {
    const packs = Array.isArray(state.packs) ? state.packs : [];
    const now = new Date();
    const dow = (now.getDay() + 6) % 7;
    const monday = addDays(now, -dow); monday.setHours(0, 0, 0, 0);
    const monthFirst = new Date(now.getFullYear(), now.getMonth(), 1);
    const nowTs = now.getTime() / 1000;
    const since = function (ms) {
      return packs.filter(function (p) { return p.at >= ms / 1000 && p.at <= nowTs; });
    };
    const wk = since(monday.getTime());
    const mo = since(monthFirst.getTime());
    const sumPrice = function (arr) {
      return arr.reduce(function (s, p) { return s + (Number(p.price) || 0); }, 0);
    };
    const wkCost = sumPrice(wk);
    const moCost = sumPrice(mo);

    const t0 = todayStr();
    const todayS = dayCravings(h.id, t0).filter(function (e) { return e.k === 's'; }).length;
    const yestS = dayCravings(h.id, fmt(addDays(now, -1)))
      .filter(function (e) { return e.k === 's'; }).length;
    const diff = todayS - yestS;
    const diffText = diff === 0
      ? '和昨天一样'
      : (diff > 0 ? '比昨天多 ' + diff + ' 支' : '比昨天少 ' + (-diff) + ' 支');

    /* 平均每天：分母 = 戒烟天数（上限 30） */
    const spanDays = Math.min(30, Math.max(1,
      Math.round((parseD(t0).getTime() - parseD(quitStartDay(h)).getTime()) / 86400000) + 1));
    let sumDays = 0;
    for (let i = 0; i < spanDays; i++) {
      sumDays += dayCravings(h.id, fmt(addDays(now, -i)))
        .filter(function (e) { return e.k === 's'; }).length;
    }
    const avg = sumDays / spanDays;

    /* 忍住：累计次数 + 忍住率。分母是「想抽的次数」（抽了 + 忍住），不是天数——
       这才回答得了「每次想抽的时候我有多大概率忍住」。 */
    let smokeAll = 0, resistAll = 0;
    cravingsOf(h.id).forEach(function (e) { if (e.k === 's') smokeAll++; else resistAll++; });
    const tries = smokeAll + resistAll;
    const resistRate = tries ? Math.round(resistAll / tries * 100) : 0;

    /* 每支成本：按「本月买的烟」的单价加权；本月没买就退回最近一包。
       拿当月消耗去除会低估——买来的包可能还有大半没抽。 */
    const unitOf = function (arr) {
      let cost = 0, sticks = 0;
      arr.forEach(function (p) {
        const pr = Number(p.price) || 0;
        if (!pr) return;
        cost += pr;
        sticks += Math.max(1, Number(p.size) || 20);
      });
      return sticks ? { unit: cost / sticks, sticks: sticks } : null;
    };
    let unit = unitOf(mo);
    let unitSub = unit ? '按本月 ' + unit.sticks + ' 支均价' : '';
    if (!unit && packs.length) {
      unit = unitOf(packs.slice(-1));
      if (unit) unitSub = '按最近一包均价';
    }

    /* 上次抽：按事件时间算。quitStreak 是按天算的，回答不了「几小时前」 */
    const lastTs = lastSmokeTs(h.id);
    /* 这里不复用 packSpanText：那是给「这包抽了多久」写的，会输出
       「1 小时 33 分」，手机两列卡面里折成三行。卡面要的是紧凑值 */
    let lastText = '还没有记录';
    const lastMin = lastTs ? Math.max(0, Math.round((nowTs - Number(lastTs)) / 60)) : 0;
    if (lastTs) {
      lastText = lastMin < 60
        ? lastMin + ' 分钟前'
        : (lastMin < 1440 ? (lastMin / 60).toFixed(1) + ' 小时前'
          : Math.round(lastMin / 1440) + ' 天前');
    }
    const lastSub = lastTs ? tsDay(lastTs).slice(5) + ' ' + tsHHMM(lastTs) : '想抽时点一下';

    const streak = quitStreak(h), best = quitBest(h);
    const streakSub = best > streak
      ? '最长 ' + best + ' 天'
      : (streak > 0 ? '就是最长纪录' : (best ? '最长 ' + best + ' 天' : '还没开始'));

    /* ---- v107 新增的四格：减量进度 / 无烟天数 / 本周守住 / 近 4 周走向 ---- */
    /* 减量进度：起始 7 天日均 → 近 7 天日均。起始就是 0 支的没什么可降，
       直接说「一开始就没抽」，不要硬算一个 0% 出来。 */
    const qStartAvg = quitStartAvg(h);
    const qNowAvg = quitNowAvg(h, 7);
    const qCut = qStartAvg > 0.3
      ? Math.round((qStartAvg - qNowAvg) / qStartAvg * 100)
      : null;

    /* 无烟天数：从戒烟起点到今天，一支没记的天数。
       戒除型不点就是没抽，所以「没记录」在这里按守住算。 */
    const qStart = parseD(quitStartDay(h));
    const qDays = Math.max(1, Math.round((parseD(t0) - qStart) / 86400000) + 1);
    let qDry = 0;
    for (let i = 0; i < qDays; i++) {
      if (!quitDailySmoke(h, fmt(addDays(new Date(), -i)))) qDry++;
    }

    /* 本周守住：本周已过且有记录覆盖的天数里，0 支的天数。 */
    let qWeekDry = 0, qWeekDays = 0;
    for (let i = 0; i < 7; i++) {
      const dt = addDays(new Date(), -i);
      const ds = fmt(dt);
      if (ds < quitStartDay(h) || ds > t0) continue;
      qWeekDays++;
      if (!quitDailySmoke(h, ds)) qWeekDry++;
    }

    /* 近 4 周走向：4 根柱，末根是本周。最高的一根定高度基准。 */
    const qWeeks = quitWeekAvgs(h);
    const qWMax = Math.max(0.5, Math.max.apply(null, qWeeks));
    const qSpark = qWeeks.map(function (v, i) {
      const hp = Math.max(6, Math.round(v / qWMax * 100));
      return '<i class="' + (i === 3 ? 'last' : '') + '" style="height:' + hp + '%"' +
        ' title="第 ' + (i + 1) + ' 周 · 日均 ' + v.toFixed(1) + ' 支"></i>';
    }).join('');
    const qWTrend = (function () {
      const a = qWeeks[0], b = qWeeks[3];
      if (!a && !b) return '这四周都没记抽烟';
      if (b < a - 0.2) return '从 <b>' + a.toFixed(1) + '</b> 降到 <b>' + b.toFixed(1) + '</b> 支/天';
      if (b > a + 0.2) return '从 <b>' + a.toFixed(1) + '</b> 升到 <b>' + b.toFixed(1) + '</b> 支/天';
      return '四周稳定在 <b>' + b.toFixed(1) + '</b> 支/天';
    })();

    const card = function (label, big, sub) {
      return '<div class="qsum"><small>' + label + '</small><b>' + big + '</b><span>' + sub + '</span></div>';
    };
    return '<div class="qsum-grid">' +
        card('今天', todayS + ' 支', diffText) +
        card('本周买烟', wk.length + ' 包', '¥' + wkCost.toFixed(0)) +
        card('本月消费', '¥' + moCost.toFixed(0) + ' 元', '按买烟日期 · ' + mo.length + ' 包') +
        card('平均每天', avg.toFixed(1) + ' 支',
          '近 ' + spanDays + ' 天' + (avg > 0 ? ' · 折合每 ' + (24 / avg).toFixed(1) + ' 小时一根' : '')) +
        card('连续无烟', streak + ' 天', streakSub) +
        /* 抵御率当主数字：它回答「每次想抽我多大把握忍住」，
           比「忍住了 N 次」这个累计值更能反映当下的自控力。 */
        card('抵御率', tries ? resistRate + '%' : '—',
          tries ? '想抽 ' + tries + ' 次 · 忍住 ' + resistAll + ' 次' : '还没有记录') +
        card('每支成本', unit ? '¥' + unit.unit.toFixed(2) : '—',
          unit ? unitSub : '买烟时填价格就能算') +
        card('上次抽', lastText, lastSub) +
        /* ---- v107 新增 ---- */
        card('减量进度',
          qCut === null ? '—' : (qCut > 0 ? '↓ ' + qCut + '%' : (qCut < 0 ? '↑ ' + (-qCut) + '%' : '持平')),
          qCut === null
            ? '开始时就没有抽烟记录'
            : '起始 7 天 ' + qStartAvg.toFixed(1) + ' → 近 7 天 ' + qNowAvg.toFixed(1) + ' 支/天') +
        card('无烟天数', qDry + ' / ' + qDays + ' 天',
          '占 ' + Math.round(qDry / qDays * 100) + '% · 从 ' + quitStartDay(h).slice(5) + ' 起算') +
        card('本周守住', qWeekDry + ' / ' + qWeekDays + ' 天',
          qWeekDays ? '本周已过 ' + qWeekDays + ' 天，没记抽烟 ' + qWeekDry + ' 天' : '本周还没开始') +
        '<div class="qsum"><small>近 4 周</small>' +
          '<div class="qs-spark">' + qSpark + '</div>' +
          '<span>' + qWTrend + '</span></div>' +
      '</div>' +
      (withHours === false ? '' : quitHoursStrip(h));
  }

  /* 戒烟页要一整块面板。统计页并进「戒烟」块里，只取卡片那部分 */
  function quitSumPanel(h) {
    return '<div class="panel"><h3>数据汇总</h3>' + quitSumCardsHtml(h, true) + '</div>';
  }

  /* 24 小时时段条（戒烟页速览）。统计页也有 24 根柱，那是「分析」视角、可切区间；
     这里是顶部速览，一根细条。样本少于 5 支不报峰值——3 条记录里 1 条就能当峰值。 */
  function quitHoursStrip(h) {
    const bins = craveHours(h.id);
    let max = 0, total = 0;
    bins.forEach(function (n) { total += n; if (n > max) max = n; });
    const bars = bins.map(function (n, i) {
      const hp = max ? Math.max(n ? 8 : 3, Math.round(n / max * 100)) : 3;
      return '<i class="qs-bar' + (n === 0 ? ' zero' : (n === max ? ' on' : '')) +
        '" style="height:' + hp + '%" title="' + pad2(i) + ':00 · ' + n + ' 支"></i>';
    }).join('');
    let tip;
    if (!total) tip = '还没有记录，记几笔就能看出你栽在哪个时段';
    else if (total < 5) tip = '样本还少（' + total + ' 支），先攒几天';
    else tip = '最常见：' + pad2(bins.indexOf(max)) + ':00 前后 · ' + max + ' 支';
    return '<div class="qsum-hours">' +
      '<div class="qs-head"><small>时段分布</small><span>' + tip + '</span></div>' +
      '<div class="qs-bars">' + bars + '</div>' +
      '<div class="qs-axis"><span>0 点</span><span>6</span><span>12</span><span>18</span><span>23 点</span></div>' +
    '</div>';
  }

  /* 按天清空抽烟记录。删的是这一天全部的 cravings（含「忍一次」），
     删完区间自动重算：包还是那个包，只是支数少了——不用同步任何字段。 */
  function craveClearModal() {
    const h = quitHabit();
    if (!h) return;
    const map = {};
    craveList().forEach(function (e) {
      if (e.h !== h.id) return;
      const ds = tsDay(e.t);
      if (!map[ds]) map[ds] = { s: 0, r: 0 };
      if (e.k === 's') map[ds].s++; else map[ds].r++;
    });
    const days = Object.keys(map).sort().reverse();
    const rows = days.map(function (ds) {
      const b = map[ds];
      const parts = [];
      if (b.s) parts.push(b.s + ' 支');
      if (b.r) parts.push(b.r + ' 次忍');
      return '<div class="cc-row">' +
        '<b>' + ds.slice(5) + '</b>' +
        '<small>' + (parts.join(' · ') || '无记录') + '</small>' +
        '<button class="btn danger-red sm" data-act="crave-clear-day" data-ds="' + ds + '">清空</button>' +
      '</div>';
    }).join('');
    openModal('<div class="modal-card">' +
      '<h3>清空抽烟记录</h3>' +
      '<p class="muted-sm">按天清空。删的是这一天的全部记录（含「忍一次」），删完不可恢复。</p>' +
      '<div class="cc-list">' + (rows || '<div class="empty-box">还没有任何记录。</div>') + '</div>' +
      '<div class="modal-actions"><span class="spacer"></span>' +
        '<button type="button" class="btn ghost" data-act="close-modal">关闭</button></div>' +
    '</div>');
  }

  /* 买烟记录列表：最新在上。每行带状态，抽完的显示「这包从拆到抽完用了多久」。
     v107 起折叠：收起只看最近 5 条，展开每次多 20 条。
     条数是「包」为单位——一包一行，不是一支一行。 */
  const PACK_FOLD = 5, PACK_PAGE = 20;
  function quitPacksPanel(h) {
    const spans = packSpans(h);
    const cur = currentSpan(h);
    const curId = cur && !cur.done ? String(cur.pack.id) : '';
    const now = Math.round(Date.now() / 1000);
    const all = spans.slice().reverse();
    const total = all.length;
    const shown = total <= PACK_FOLD ? total
      : (quitPackOpen ? Math.min(total, Math.max(PACK_FOLD, quitPackShown)) : PACK_FOLD);
    const rows = all.slice(0, shown).map(function (sp) {
      const p = sp.pack;
      const isCur = String(p.id) === curId;
      const stocking = !sp.done && sp.openAt > now;
      let st, stCn, meta;
      if (sp.done) {
        st = 'done'; stCn = '已抽完';
        meta = sp.size + '/' + sp.size + ' 支 · 抽了 ' + packSpanTextOf(sp);
      } else if (stocking) {
        st = 'stock'; stCn = '库存';
        meta = sp.size + ' 支 · 还没拆';
      } else {
        st = 'live'; stCn = '在抽';
        meta = sp.used + '/' + sp.size + ' 支 · 还剩 ' + (sp.size - sp.used) + ' 支';
      }
      return '<div class="qpack' + (isCur ? ' cur' : '') + '">' +
        '<div class="qpack-main">' +
          /* 不再挂「当前」小标签：状态标签里的「在抽」已经是这个意思，
             两个并排看着像两条不同的信息。靠 .qpack.cur 的边框做高亮就够了。 */
          '<b>' + esc(p.name || '未命名') +
            '<i class="qpack-st ' + st + '">' + stCn + '</i>' +
          '</b>' +
          '<small>' + tsDay(p.at).slice(5) + ' ' + tsHHMM(p.at) + ' 买' +
            ' · ' + (p.price ? '¥' + p.price : '未填价格') +
            ' · ' + meta + '</small>' +
        '</div>' +
        '<button class="icon-btn" data-act="pack-edit" data-id="' + p.id + '" title="编辑">✎</button>' +
        '<button class="icon-btn danger" data-act="pack-del" data-id="' + p.id + '" title="删除">🗑</button>' +
      '</div>';
    }).join('');
    const rest = total - shown;
    /* 折叠条：总数在左，动作在右。收起时写「只看最近 5 条」，
       展开时写「已显示 X / N」——都是事实陈述，不用「展开/收起」这种动词当主文案。 */
    const fold = total <= PACK_FOLD ? '' :
      '<button type="button" class="qpack-fold' + (quitPackOpen ? ' open' : '') + '"' +
        ' data-act="pack-fold" aria-expanded="' + (quitPackOpen ? 'true' : 'false') + '">' +
        '<span>共 ' + total + ' 条 · ' + (quitPackOpen ? '已显示 ' + shown + ' 条' : '只看最近 ' + PACK_FOLD + ' 条') + '</span>' +
        '<i>⌄</i>' +
      '</button>';
    const more = (quitPackOpen && rest > 0)
      ? '<button type="button" class="qpack-more" data-act="pack-more">再显示 ' +
          Math.min(PACK_PAGE, rest) + ' 条（还剩 ' + rest + ' 条）</button>'
      : '';
    return '<div class="panel"><h3>买烟记录 <button class="btn primary sm" data-act="pack-new">记一笔</button></h3>' +
      fold +
      '<div class="qpack-list">' + (rows || '<div class="empty-box">还没有买烟记录，点右上角「记一笔」。</div>') + '</div>' +
      more + '</div>';
  }
  function packModal(pack) {
    const isNew = !pack;
    const p = pack || { name: '', price: '', size: 20, at: Math.round(Date.now() / 1000) };
    openModal('<form class="modal-card" id="pack-form" data-id="' + esc(p.id || '') + '">' +
      '<h3>' + (isNew ? '记一笔买烟' : '编辑买烟记录') + '</h3>' +
      '<div class="form-grid">' +
        '<label class="field"><span>买烟日期</span><input type="date" name="date" value="' + tsDay(p.at) + '"></label>' +
        '<label class="field"><span>时间</span><input type="time" name="time" value="' + tsHHMM(p.at) + '"></label>' +
        '<label class="field"><span>烟的名称</span><input name="name" maxlength="20" value="' + esc(p.name || '') + '" placeholder="例如：黄鹤楼"></label>' +
        '<label class="field"><span>价格（元）</span><input name="price" type="number" min="0" step="0.5" value="' + (Number(p.price) || '') + '" placeholder="例如 25"></label>' +
        '<label class="field"><span>一包几支（可选）</span><input name="size" type="number" min="1" max="50" value="' + (Number(p.size) || 20) + '"></label>' +
      '</div>' +
      '<p class="hint">时间用来分清同一天买的两包。这包从什么时候开始算，要等上一包抽完——没抽完就先算库存。</p>' +
      '<div class="modal-actions"><span class="spacer"></span>' +
        '<button type="button" class="btn ghost" data-act="close-modal">取消</button>' +
        '<button type="submit" class="btn primary">保存</button></div>' +
    '</form>');
  }

  function savePackForm(form) {
    const id = form.dataset.id || '';
    const get = function (n) {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const date = get('date');
    const time = get('time');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('请选一个买烟日期'); return; }
    if (!/^\d{2}:\d{2}$/.test(time)) { toast('请填一个买烟时间'); return; }
    /* 日期只到天，同一天买两包会撞成同一个时刻；加上时分才分得清先后 */
    const at = Math.round(parseD(date).getTime() / 1000) +
      (Number(time.slice(0, 2)) * 60 + Number(time.slice(3, 5))) * 60;
    const name = get('name');
    const price = Math.max(0, Math.min(99999, Number(get('price')) || 0));
    const size = clamp(parseInt(get('size'), 10) || 20, 1, 50);
    if (!Array.isArray(state.packs)) state.packs = [];
    if (id) {
      const p = state.packs.find(function (x) { return x.id === id; });
      if (p) {
        /* 支数一改，「末支是哪一支」就变了，旧的抽完确认作废 */
        if (Number(p.size) !== size) p.cf = 0;
        p.at = at; p.name = name; p.price = price; p.size = size;
      }
    } else {
      state.packs.push({ id: uid(), at: at, name: name, price: price, size: size });
    }
    /* at 主键 + id 次键：同一分钟买两包时，两端算出来的顺序必须一致 */
    state.packs.sort(function (a, b) {
      return (Number(a.at) - Number(b.at)) || String(a.id).localeCompare(String(b.id));
    });
    save();
    render();
    closeModal();
    toast('买烟记录已保存');
  }

  /* 补记昨天：填数量，不是一支一支地点。
     上限 = 那包在昨天结束时的剩余，这样补不出第 21 支。 */
  function backfillModal(ds) {
    const h = quitHabit();
    if (!h) return;
    const left = backfillLeft(h, ds);
    if (left <= 0) { toast('昨天没有可补的余量'); return; }
    const have = cravingsOf(h.id).filter(function (e) { return tsDay(e.t) === ds; }).length;
    openModal('<form class="modal-card" id="backfill-form" data-ds="' + ds + '">' +
      '<h3>补记 ' + ds.slice(5) + '</h3>' +
      '<p class="muted-sm">这包在昨天结束时还剩 <b>' + left + '</b> 支，最多补 ' + left + ' 支。' +
        (have ? '当天已经记了 ' + have + ' 条。' : '当天还没有任何记录。') + '</p>' +
      '<div class="form-grid">' +
        '<label class="field"><span>抽了几支</span>' +
          '<input type="number" name="smoke" min="0" max="' + left + '" value="0"></label>' +
        '<label class="field"><span>忍了几次</span>' +
          '<input type="number" name="resist" min="0" max="60" value="0"></label>' +
      '</div>' +
      '<p class="hint">时间是按当天 06:00 起每 30 分钟一支补的，只影响「那天抽了几支」。' +
      '首末两支的真实时间，用卡面上的「改时间」确认。</p>' +
      '<div class="modal-actions"><span class="spacer"></span>' +
        '<button type="button" class="btn ghost" data-act="close-modal">取消</button>' +
        '<button type="submit" class="btn primary">补记</button></div>' +
    '</form>');
  }

  function saveBackfillForm(form) {
    const ds = form.dataset.ds || '';
    const h = quitHabit();
    if (!h || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
    /* 只补昨天。挡住改 data-ds 的越界调用 */
    if (ds !== fmt(addDays(new Date(), -1))) { toast('只能补昨天'); return; }
    const left = backfillLeft(h, ds);
    const rawSmoke = parseInt((form.querySelector('[name="smoke"]') || {}).value, 10) || 0;
    const resistN = clamp(parseInt((form.querySelector('[name="resist"]') || {}).value, 10) || 0, 0, 60);
    if (rawSmoke < 0) { toast('支数不能是负数'); return; }
    if (rawSmoke > left) { toast('这天最多补 ' + left + ' 支'); return; }
    if (!rawSmoke && !resistN) { toast('两个都填 0，没有要补的'); return; }
    const times = backfillSlots(h, ds, rawSmoke + resistN);
    if (!Array.isArray(state.cravings)) state.cravings = [];
    for (let i = 0; i < rawSmoke; i++) {
      state.cravings.push({ id: uid(), t: times[i], k: 's', h: h.id, g: '', s: 0 });
    }
    for (let i = 0; i < resistN; i++) {
      state.cravings.push({ id: uid(), t: times[rawSmoke + i], k: 'r', h: h.id, g: '', s: 0 });
    }
    /* 槽位是散着给的，整体排一遍，区间算法要拿有序列 */
    state.cravings.sort(function (a, b) { return Number(a.t) - Number(b.t); });
    save();
    render();
    closeModal();
    const parts = [];
    if (rawSmoke) parts.push(rawSmoke + ' 支');
    if (resistN) parts.push(resistN + ' 次忍');
    toast('已补记 ' + parts.join(' · '));
  }
  /* 末支确认的第二档：用户想改时间才弹这个窗。
     只改「这包抽了多久」的口径，不动打卡记录、不动支数。 */
  function packCfModal(pack, sp) {
    openModal('<form class="modal-card" id="pack-cf-form" data-id="' + esc(pack.id) + '">' +
      '<h3>这包是什么时候抽完的</h3>' +
      '<p class="muted-sm">只影响「抽了多久」这个数字，不改打卡记录，也不改动支数。</p>' +
      '<label class="field"><span>抽完时间</span>' +
        '<input type="datetime-local" name="dt" value="' +
          dtLocalVal(sp.cf || sp.closeAt) + '"></label>' +
      '<p class="hint">默认是最后一条记录的时刻。如果当时是补记的，这里填真实抽完的时间。</p>' +
      '<div class="modal-actions"><span class="spacer"></span>' +
        '<button type="button" class="btn ghost" data-act="close-modal">取消</button>' +
        '<button type="submit" class="btn primary">保存</button></div>' +
    '</form>');
  }

  function savePackCfForm(form) {
    const id = form.dataset.id || '';
    const el = form.querySelector('[name="dt"]');
    const v = el ? el.value : '';
    const d = v ? new Date(v) : null;
    if (!d || isNaN(d.getTime())) { toast('请选一个抽完时间'); return; }
    const pack = (state.packs || []).find(function (x) { return x.id === id; });
    if (!pack) return;
    pack.cf = Math.round(d.getTime() / 1000);
    save();
    render();
    closeModal();
    toast('已记下抽完时间');
  }


  /* 考核算法说明（v81）。
     **里面的每条判定都必须和代码一一对应**：met() / dayStats() / dayQualified() /
     rateOver() / habitDayAcc() / taskStats()。阈值改了这里不同步，说明就会跟数字对不上，
     那比没有说明更糟。改这些函数时顺手看一眼这个弹窗。 */
  function algoModal() {
    const tr = (a, b) => '<tr><td>' + a + '</td><td>' + b + '</td></tr>';
    openModal(
      '<div class="modal-card algo-card">' +
        '<h3>考核算法</h3>' +
        '<p class="algo-lead">本站只看<b>当天做到了没有</b>，不累计分数、不扣分、不倒扣历史。' +
          '每个习惯先各自判定「今天算不算做到」，再把当天所有该做的习惯汇总成一个百分比。</p>' +

        '<h4 class="algo-h">一、单个习惯：今天算不算「做到」</h4>' +
        '<table class="sum-table algo-table">' +
          '<tr><th>类型</th><th>判定</th></tr>' +
          tr('<b>计数类</b><br><span class="algo-ex">喝水、读书</span>',
             '当天次数 <b>≥ 目标次数</b>。目标 8 杯喝了 8 杯才算，7 杯不算') +
          tr('<b>单次类</b><br><span class="algo-ex">早睡、签到</span>',
             '目标 1 次，打个卡就算做到') +
          tr('<b>戒除类</b><br><span class="algo-ex">不喝奶茶</span>',

             '此前历史仍按「没记失守即守住」口径') +

  /* ============================================================
     清债（v88 起）
     数据全在 state.money 一个子对象里，**不碰 habits / checks / tasks**，
     所以达成率、完成率、日历热力一律不会把它算进去。
     ============================================================ */

  function moneySeed() {
    return {
      v: 1,
      /* v211：模块开关 —— 停用后导航隐藏、还款日历与提醒同步停止；数据原样保留 */
      on: true,
      debts: [],
      /* 每月在最低还款之外多还的钱（加速钱） */
      extra: 0,
      strategy: 'snowball',
      customOrder: [],
      /* 一次性多还：年终奖、退税 */
      snowflakes: [],
      /* 计划起始月，空字符串 = 下个月 */
      startYM: '',
      log: [],
      incomes: [],
      cats: [],
      spends: [],
      /* v92 用，先占位。默认关闭，用户自己开 */
      notify: { on: false, before: [3, 1, 0], time: '09:00' }
    };
  }

  const MONEY_TYPES = [
    { key: 'card', label: '信用卡' },
    { key: 'loan', label: '网贷' },
    { key: 'friend', label: '亲友借款' },
    { key: 'other', label: '其他' }
  ];
  const MONEY_STRATEGIES = [
    { key: 'snowball', label: '雪球法', desc: '先还金额最小的，最快看到进展' },
    { key: 'avalanche', label: '雪崩法', desc: '先还利息最高的，总利息最少' },
    { key: 'custom', label: '自定义', desc: '自己排顺序' }
  ];
  /* 30 年还不够就不算了——数字再大也只是吓人，没有参考价值 */
  const MONEY_MAX_MONTHS = 360;

  function money() {
    const m = state.money;
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : moneySeed();
  }
  function moneyNum(v) {
    const n = Number(v);
    return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0;
  }
  function moneyList(k) {
    const v = money()[k];
    return Array.isArray(v) ? v : [];
  }
  function moneyTypeLabel(k) {
    const t = MONEY_TYPES.filter(function (x) { return x.key === k; })[0];
    return t ? t.label : '其他';
  }
  function moneyStrategyLabel(k) {
    const t = MONEY_STRATEGIES.filter(function (x) { return x.key === k; })[0];
    return t ? t.label : '雪球法';
  }
  /* 还在欠的债。余额 ≤ 0.01 视为还完（跟原版一致） */
  function moneyLive() {
    return moneyList('debts').filter(function (d) { return Number(d.balance) > 0.005; });
  }
  /* 某天是不是还款日。debts[].due 是「每月几号」，小月按月末算 ——
     跟后端 lb_schedule_debts、api/ics.php 必须同一口径，否则日历、订阅、
     企微提醒三处会对不上。 */
  function dayDebts(ds) {
    /* v218：清债模块停用后，站内月历/周视图/汇总的还款标记一并隐藏 ——
       这是 v211 漏接的第四条路径（与 v209 首页卡同款模式）：dayDebts 是
       所有日历视图还款标记的共同数据源，在源头断一处即全线生效。 */
    if (!isModuleOn('money')) return [];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ds || ''))) return [];
    const d = parseD(ds);
    const dom = d.getDate();
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return moneyLive().filter(function (x) {
      const due = Math.round(Number(x.due));
      /* 0 / 空 = 没有具体还款日：不上日历 */
      if (!isFinite(due) || due < 1 || due > 31) return false;
      return Math.min(due, last) === dom;
    });
  }

  function moneyTotals() {
    let start = 0, left = 0;
    moneyList('debts').forEach(function (d) {
      const st = Number(d.start) || Number(d.balance) || 0;
      start += Math.max(0, st);
      left += Math.max(0, Number(d.balance) || 0);
    });
    return { start: start, left: left, paid: Math.max(0, start - left), n: moneyLive().length };
  }

  /* 月份工具（不带时分秒，避免夏令时那种坑） */
  function ymNow() {
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function ymAdd(ym, n) {
    const y = Number(String(ym).slice(0, 4));
    const m = Number(String(ym).slice(5, 7)) - 1 + n;
    const d = new Date(y, m, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function ymLabel(ym) {
    if (!/^\d{4}-\d{2}$/.test(String(ym || ''))) return '—';
    return Number(String(ym).slice(0, 4)) + ' 年 ' + Number(String(ym).slice(5, 7)) + ' 月';
  }
  /* 表格 / 对比表里用短格式：手机上「2028 年 5 月」会被挤成两行 */
  function ymShort(ym) {
    if (!/^\d{4}-\d{2}$/.test(String(ym || ''))) return '—';
    return String(ym).replace('-', '.');
  }

  /* 按 id 并集，**同一 id 取 u 更大的那份**。
     债、流水这类是可编辑实体，跟 packs 不一样——远端那份可能是旧的，
     直接 remote 优先会把本地刚改的余额吃掉。 */
  function mergeById(rm, lm) {
    const out = [];
    const pos = {};
    rm.forEach(function (x) {
      if (!x || !x.id) return;
      pos[x.id] = out.length;
      out.push(x);
    });
    lm.forEach(function (x) {
      if (!x || !x.id) return;
      if (pos[x.id] === undefined) { pos[x.id] = out.length; out.push(x); return; }
      const i = pos[x.id];
      if ((Number(x.u) || 0) > (Number(out[i].u) || 0)) out[i] = x;
    });
    return out;
  }

  function normalizeMoney(raw) {
    const out = moneySeed();
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    out.on = raw.on !== false;
    const arr = function (v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === 'object'; }) : []; };
    out.debts = arr(raw.debts).map(function (d) {
      const bal = moneyNum(d.balance);
      return {
        id: String(d.id || uid()),
        name: String(d.name || '').slice(0, 24),
        type: MONEY_TYPES.some(function (t) { return t.key === d.type; }) ? d.type : 'card',
        balance: bal,
        /* 初始额缺省就等于余额：老数据或手写 JSON 都能用 */
        start: moneyNum(d.start) || bal,
        apr: Math.min(200, Math.max(0, Number(d.apr) || 0)),
        min: Math.min(999999, Math.max(0, Number(d.min) || 0)),
        /* v110：0 = 没有具体还款日（不填或填 0）。以前缺省成 1 号，
           会把亲友借款这种「没约定哪天还」的债硬塞进每月 1 号的提醒与日历。 */
        due: (function (v) {
          const n = Math.round(Number(v));
          return isFinite(n) && n >= 1 && n <= 31 ? n : 0;
        })(d.due),
        note: String(d.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(d.u) || 0))
      };
    });
    out.log = arr(raw.log).map(function (x) {
      return {
        id: String(x.id || uid()), date: String(x.date || '').slice(0, 10),
        debtId: String(x.debtId || ''), debtName: String(x.debtName || '').slice(0, 24),
        amount: moneyNum(x.amount), note: String(x.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(x.u) || 0))
      };
    });
    out.snowflakes = arr(raw.snowflakes).map(function (x) {
      return {
        id: String(x.id || uid()), ym: /^\d{4}-\d{2}$/.test(String(x.ym || '')) ? x.ym : '',
        amount: moneyNum(x.amount), note: String(x.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(x.u) || 0))
      };
    });
    out.incomes = arr(raw.incomes).map(function (x) {
      return { id: String(x.id || uid()), name: String(x.name || '').slice(0, 20),
        amount: moneyNum(x.amount), u: Math.max(0, Math.round(Number(x.u) || 0)) };
    });
    out.cats = arr(raw.cats).map(function (x) {
      return { id: String(x.id || uid()), name: String(x.name || '').slice(0, 20),
        kind: x.kind === 'fixed' ? 'fixed' : 'daily', budget: moneyNum(x.budget),
        u: Math.max(0, Math.round(Number(x.u) || 0)) };
    });
    out.spends = arr(raw.spends).map(function (x) {
      return { id: String(x.id || uid()), date: String(x.date || '').slice(0, 10),
        catId: String(x.catId || ''), catName: String(x.catName || '').slice(0, 20),
        amount: moneyNum(x.amount), note: String(x.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(x.u) || 0)) };
    });
    out.extra = moneyNum(raw.extra);
    out.strategy = MONEY_STRATEGIES.some(function (t) { return t.key === raw.strategy; })
      ? raw.strategy : 'snowball';
    out.customOrder = Array.isArray(raw.customOrder)
      ? raw.customOrder.map(String).filter(Boolean).slice(0, 60) : [];
    out.startYM = /^\d{4}-\d{2}$/.test(String(raw.startYM || '')) ? raw.startYM : '';
    const nt = (raw.notify && typeof raw.notify === 'object') ? raw.notify : {};
    out.notify = {
      on: !!nt.on,
      time: /^\d{2}:\d{2}$/.test(String(nt.time || '')) ? nt.time : '09:00',
      before: Array.isArray(nt.before)
        ? nt.before.map(function (x) { return Math.max(0, Math.round(Number(x) || 0)); }).slice(0, 5)
        : [3, 1, 0]
    };
    return out;
  }

  /* 策略只决定顺序，金额分配逻辑三套完全一样 */
  function moneyOrder(list, strat) {
    const arr = list.slice();
    if (strat === 'avalanche') {
      arr.sort(function (a, b) {
        return (Number(b.apr) || 0) - (Number(a.apr) || 0) ||
          (Number(a.balance) || 0) - (Number(b.balance) || 0);
      });
    } else if (strat === 'custom') {
      const pref = Array.isArray(money().customOrder) ? money().customOrder : [];
      arr.sort(function (a, b) {
        const ia = pref.indexOf(a.id), ib = pref.indexOf(b.id);
        return (ia < 0 ? 1e4 : ia) - (ib < 0 ? 1e4 : ib);
      });
    } else {
      arr.sort(function (a, b) {
        return (Number(a.balance) || 0) - (Number(b.balance) || 0) ||
          (Number(b.apr) || 0) - (Number(a.apr) || 0);
      });
    }
    return arr;
  }

  /* 逐月模拟。规则跟原版「还清日」一致：
     ① 每笔先计息（余额 × 年化 ÷ 12，四舍五入到分）
     ② 每笔各还最低还款（不超过余额）
     ③ 剩下的钱（加速钱 + 当月一次性多还）按策略顺序全砸第一笔，清掉后滚到下一笔
     最多算 360 个月。 */
  function moneySimulate(strat, detail, override) {
    const live = moneyLive();
    const total = live.reduce(function (a, d) { return a + (Number(d.balance) || 0); }, 0);
    const res = {
      done: true, months: 0, payoff: '', totalInt: 0, series: [Math.round(total * 100) / 100],
      monthlyMin: 0, monthly: 0, startYM: '', left: total, clearAt: {}
    };
    if (!live.length) return res;
    const order = moneyOrder(live, strat || money().strategy);
    const cur = order.map(function (d) { return Number(d.balance) || 0; });
    const apr = order.map(function (d) { return Math.max(0, Number(d.apr) || 0) / 100; });
    const min = order.map(function (d) { return Math.max(0, Number(d.min) || 0); });
    res.monthlyMin = Math.round(min.reduce(function (a, b) { return a + b; }, 0) * 100) / 100;
    /* override 只在「工具页算不加速要还多久」时用：传 0 = 假设一分加速钱都没有。
       不传就照旧读 state，现有调用一个都不用改。 */
    const extra = override === undefined
      ? Math.max(0, Number(money().extra) || 0)
      : Math.max(0, Number(override) || 0);
    res.monthly = Math.round((res.monthlyMin + extra) * 100) / 100;
    const start = /^\d{4}-\d{2}$/.test(String(money().startYM || ''))
      ? money().startYM : ymAdd(ymNow(), 1);
    res.startYM = start;
    /* 月供总额**在计划开始时就固定**：各笔最低还款之和 + 加速钱。
       某笔清掉后它不再吃钱，那份额自然留在预算里给下一笔 ——
       这才是「清掉一笔，它原来的月供自动加到下一笔上」。
       每月重新算 Σ最低 的话，清掉一笔预算就少一块，永远滚不起来。 */
    const base = res.monthlyMin + extra;
    let series = [Math.round(total * 100) / 100];
    let totalInt = 0;
    let m = 0;
    /* detail=true 时额外记按月明细，供「逐月还款表」用。
       默认不算——总览每次渲染都要跑一遍，多算这份纯浪费。 */
    const rows = detail ? [] : null;
    res.rows = rows;
    while (m < MONEY_MAX_MONTHS) {
      const ym = ymAdd(start, m);
      /* ① 计息 */
      for (let i = 0; i < cur.length; i++) {
        if (cur[i] <= 0.005) continue;
        const it = Math.round(cur[i] * apr[i] / 12 * 100) / 100;
        cur[i] = Math.round((cur[i] + it) * 100) / 100;
        totalInt = Math.round((totalInt + it) * 100) / 100;
      }
      /* ② 各还最低，累计本月已经花掉多少 */
      const paid = {};
      let spent = 0;
      for (let i = 0; i < cur.length; i++) {
        if (cur[i] <= 0.005) continue;
        const pay = Math.min(min[i], cur[i]);
        cur[i] = Math.round((cur[i] - pay) * 100) / 100;
        spent = Math.round((spent + pay) * 100) / 100;
        paid[order[i].id] = Math.round(((paid[order[i].id] || 0) + pay) * 100) / 100;
        if (cur[i] <= 0.005 && !res.clearAt[order[i].id]) res.clearAt[order[i].id] = ym;
      }
      /* ③ 预算里剩下的（含清账腾出来的份额 + 一次性多还）按顺序砸 */
      let pool = base;
      moneyList('snowflakes').forEach(function (sf) {
        if (sf.ym === ym) pool += Math.max(0, Number(sf.amount) || 0);
      });
      pool = Math.round((pool - spent) * 100) / 100;
      for (let i = 0; i < cur.length && pool > 0.005; i++) {
        if (cur[i] <= 0.005) continue;
        const pay = Math.min(pool, cur[i]);
        cur[i] = Math.round((cur[i] - pay) * 100) / 100;
        pool = Math.round((pool - pay) * 100) / 100;
        paid[order[i].id] = Math.round(((paid[order[i].id] || 0) + pay) * 100) / 100;
        if (cur[i] <= 0.005 && !res.clearAt[order[i].id]) res.clearAt[order[i].id] = ym;
      }
      let left = 0;
      for (let i = 0; i < cur.length; i++) if (cur[i] > 0.005) left += cur[i];
      left = Math.round(left * 100) / 100;
      series.push(left);
      if (rows) {
        rows.push({
          ym: ym,
          items: order.map(function (d, i) {
            return {
              id: d.id, name: d.name,
              pay: paid[d.id] || 0,
              after: cur[i] > 0.005 ? cur[i] : 0
            };
          }).filter(function (x) { return x.pay > 0.005; }),
          left: left
        });
      }
      m++;
      if (left <= 0.005) {
        res.done = true; res.months = m; res.payoff = ym; res.left = 0;
        break;
      }
      res.done = false; res.months = m; res.left = left;
      if (m >= MONEY_MAX_MONTHS) break;
    }
    res.totalInt = totalInt;
    res.series = series;
    return res;
  }

  /* ---------- 通用子页面（v88） ----------
     状态是模块级字典，**不进 state**：进了 state 就要改 normalizeState /
     mergeStates / repairBackup 三处，而且两端切换的子页不同会互相覆盖。
     别的页面想分子页，传 [{key,label,render}] 就行。 */
  const subTab = {};
  function subTabOf(pageKey, tabs) {
    const cur = subTab[pageKey];
    return tabs.some(function (t) { return t.key === cur; }) ? cur : (tabs[0] ? tabs[0].key : '');
  }
  function subTabsHtml(pageKey, tabs, cur) {
    return '<div class="stab subtab">' + tabs.map(function (t) {
      return '<button type="button" class="' + (t.key === cur ? 'on' : '') +
        '" data-act="subtab" data-page="' + pageKey + '" data-tab="' + t.key + '">' + t.label + '</button>';
    }).join('') + '</div>';
  }

  /* ---------- 清债页 ----------
     六个子页一次注册，但**只渲染做完了的那几个**（没有 v 字段 = 已就绪）。
     点进去一片空白比看不到更让人恼火，做完一版放出一版。 */
  const MONEY_TABS = [
    { key: 'overview', label: '总览' },
    { key: 'debts', label: '债务' },
    { key: 'budget', label: '预算' },
    { key: 'plan', label: '计划' },
    { key: 'log', label: '记录' },
    { key: 'tools', label: '工具' }
  ];

  function moneySubtitle() {
    const t = moneyTotals();
    if (!t.n) return '把每一笔债填进来，才能算出哪天还清。';
    const sim = moneySimulate(money().strategy);
    /* 不再用「X 万」：那是四舍五入的概览，跟 hero 里的精确数对不上。
       总欠款 hero 里已经有了，这里只说笔数 + 还清月份。 */
    if (!sim.done) return '共 ' + t.n + ' 笔 · 按当前计划 30 年也还不完';
    return '共 ' + t.n + ' 笔 · 按「' + moneyStrategyLabel(money().strategy) + '」' +
      ymLabel(sim.payoff) + '还清';
  }
  /* 金额显示。整数不补小数，有角分才补两位 ——
     以前一律 toFixed(0)，填 780.5 会显示成 781，账面差 5 毛。
     四舍五入到分再判断，避免 0.1+0.2 那种浮点尾巴把整数显示成 780.00。 */
  function moneyFmt(n) {
    const v = Math.round((Number(n) || 0) * 100) / 100;
    if (Math.abs(v % 1) < 0.005) return String(Math.round(v));
    return v.toFixed(2);
  }

  function moneyCurveSvg(series) {
    const W = 640, H = 132, L = 6, R = 6, T = 10, B = 16;
    const n = series.length;
    const max = Math.max.apply(null, series.concat([1]));
    const px = function (i) { return L + (n <= 1 ? 0 : i / (n - 1) * (W - L - R)); };
    const py = function (v) { return T + (1 - v / max) * (H - T - B); };
    let d = '';
    series.forEach(function (v, i) { d += (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1) + ' '; });
    const area = d + 'L' + px(n - 1).toFixed(1) + ' ' + py(0).toFixed(1) +
      ' L' + px(0).toFixed(1) + ' ' + py(0).toFixed(1) + ' Z';
    return '<svg class="money-curve" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="剩余欠款曲线">' +
      '<path class="mc-area" d="' + area + '"/>' +
      '<path class="mc-line" d="' + d + '"/></svg>';
  }

    /* 按模拟出来的清账月份排——这才是「先还哪笔」，

    const list = moneyLive().slice().sort(function (a, b) {

    /* 动线：先看结论（哪天还完）→ 再看先还哪笔（可执行）→ 最后看曲线（趋势参考）。

  function moneyDebtsView() {

      const pct = closed ? 100 : (st ? Math.min(100, Math.round(paid / st * 100)) : 0);

          '<span class="mdebt-tag">' + moneyTypeLabel(d.type) + '</span></div>' +

        (d.note ? '<div class="mdebt-note"><i>备注</i><span>' + esc(d.note) + '</span></div>' : '') +
        '<div class="mdebt-num"><b>¥' + moneyFmt(d.balance) + '</b>' +
          '<span>年化 ' + (Number(d.apr) || 0) + '% · 月还 ¥' + moneyFmt(d.min) +

          '<div class="mdebt-bar"><i style="width:' + pct + '%"></i></div>' +

  /* 页底汇总（v111）。口径跟总览 hero 一致：分母是**初始总额**，不另算一套；
     平均年化按余额加权 —— 小额高息不能跟大额低息平均成一个假数。 */
  function moneyDebtsSummaryHtml(live, done) {
    const t = moneyTotals();
    const pct = t.start ? Math.min(100, Math.round(t.paid / t.start * 100)) : 0;
    const minSum = live.reduce(function (a, d) { return a + Math.max(0, Number(d.min) || 0); }, 0);
    const balSum = live.reduce(function (a, d) { return a + Math.max(0, Number(d.balance) || 0); }, 0);
    const aprSum = live.reduce(function (a, d) {
      return a + Math.max(0, Number(d.apr) || 0) * Math.max(0, Number(d.balance) || 0);
    }, 0);
    const aprAvg = balSum > 0 ? Math.round(aprSum / balSum * 10) / 10 : 0;
    const cell = function (label, val) {
      return '<div><span>' + label + '</span><b>' + val + '</b></div>';
    };
    return '<div class="panel"><div class="mhead-row"><h3>汇总</h3>' +
        '<span class="muted-sm">总进度 ' + pct + '%</span></div>' +
      '<div class="mdebt-bar" style="margin-bottom:14px"><i style="width:' + pct + '%"></i></div>' +
      '<div class="mdebt-sum">' +
        cell('当前总待还', '¥' + moneyFmt(t.left)) +
        cell('当前总已还', '¥' + moneyFmt(t.paid)) +
        cell('一共欠过', '¥' + moneyFmt(t.start)) +
        cell('每月最低合计', '¥' + moneyFmt(minSum)) +
        cell('平均年化', aprAvg + '%') +
        cell('在还 / 已还清', live.length + ' / ' + done.length + ' 笔') +
      '</div></div>';
  }

  /* 自定义顺序：只有选了「自定义」才显示，↑↓ 调 */
  function moneyCustomOrderHtml() {
    const list = moneyOrder(moneyLive(), 'custom');
    const rows = list.map(function (d, i) {
      const btn = function (dir, off) {
        return '<button type="button" class="icon-btn"' + (off ? ' disabled' : '') +
          ' data-act="money-order-move" data-id="' + esc(d.id) + '" data-dir="' + dir + '">' +

  /* 三种办法并排对比：还清日 / 总利息 / 第一笔什么时候清掉 */
  function moneyCompareHtml() {
    const list = MONEY_STRATEGIES.map(function (t) {
      const sim = moneySimulate(t.key);
      const first = moneyLive().slice().sort(function (a, b) {
        return String(sim.clearAt[a.id] || '9999-99').localeCompare(String(sim.clearAt[b.id] || '9999-99'));
      })[0];
      return {
        key: t.key, label: t.label, done: sim.done, months: sim.months,
        payoff: sim.payoff, int: sim.totalInt,
        firstAt: first ? (sim.clearAt[first.id] || '') : ''
      };
    });
    const ok = list.filter(function (x) { return x.done; });
    const bestInt = ok.length ? Math.min.apply(null, ok.map(function (x) { return x.int; })) : null;
    const firsts = list.filter(function (x) { return x.firstAt; }).map(function (x) { return x.firstAt; }).sort();
    const firstBest = firsts.length ? firsts[0] : '';
    const row = function (x) {
      const tags = [];
      if (x.done && x.int === bestInt && ok.length > 1) tags.push('最省利息');
      if (x.firstAt && x.firstAt === firstBest && list.length > 1) tags.push('最快清掉第一笔');
      if (money().strategy === x.key) tags.push('当前');
      return '<div class="mcmp-row' + (money().strategy === x.key ? ' on' : '') + '">' +
        '<span class="mcmp-name">' + x.label + (tags.length
          ? '<i>' + tags.join(' · ') + '</i>' : '') + '</span>' +
        '<span class="mcmp-cell">' + (x.done ? ymShort(x.payoff) : '30 年内还不完') + '</span>' +
        '<span class="mcmp-cell">¥' + moneyFmt(x.int) + '</span>' +
        '<span class="mcmp-cell">' + (x.firstAt ? ymShort(x.firstAt) : '—') + '</span>' +
      '</div>';
    };
    return '<div class="panel"><h3>三种办法对比</h3>' +
      '<div class="mcmp">' +
        '<div class="mcmp-row head"><span class="mcmp-name">办法</span>' +
          '<span class="mcmp-cell">还清日</span><span class="mcmp-cell">总利息</span>' +
          '<span class="mcmp-cell">第一笔清掉</span></div>' +
        list.map(row).join('') +
      '</div>' +
      '<p class="hint">日期是「年.月」。同样的钱，雪崩法总利息最少；雪球法最早清掉一笔，看着有劲。' +
      '「自定义」按你自己排的顺序走。</p></div>';
  }

  /* ---------- 记录 ---------- */
  /* ---------- 预算（v90） ----------
     口径说明（页面小字上也要写）：
     · 固定开支 / 日常预算都是**每月额度**，不是本月实际
     · 「每日可花」只算日常类，固定开支（房租水电）不参与按天摊
     · 剩余 = 收入 - 固定 - 日常 - 债务月供，可以是负数 */
  let moneySpendYM = '';
  function moneySpendMonth() {
    return /^\d{4}-\d{2}$/.test(String(moneySpendYM || '')) ? moneySpendYM : ymNow();
  }
  function moneyCats(kind) {
    const list = moneyList('cats');
    return kind ? list.filter(function (c) { return c.kind === kind; }) : list;
  }
  function moneySum(list, key) {
    return Math.round(list.reduce(function (a, x) {
      return a + (Number(x[key]) || 0);
    }, 0) * 100) / 100;
  }
  function moneyBudgetSplit() {
    const income = moneySum(moneyList('incomes'), 'amount');
    const fixed = moneySum(moneyCats('fixed'), 'budget');
    const daily = moneySum(moneyCats('daily'), 'budget');
    const sim = moneySimulate(money().strategy, false);
    const debt = moneyLive().length ? (Number(sim.monthly) || 0) : 0;
    return {
      income: income, fixed: fixed, daily: daily, debt: debt,
      rest: Math.round((income - fixed - daily - debt) * 100) / 100
    };
  }
  /* 本月日常类已花。分类被删掉的流水按「日常」算——
     钱已经花出去了，不能因为它挂的分类不存在就从账上消失。 */
  function moneyDailySpentThisMonth() {
    const ym = ymNow();
    const dailyIds = moneyCats('daily').map(function (c) { return c.id; });
    return Math.round(moneyList('spends').filter(function (x) {
      if (String(x.date).slice(0, 7) !== ym) return false;
      const c = moneyCats().filter(function (y) { return y.id === x.catId; })[0];
      return c ? c.kind === 'daily' : (dailyIds.indexOf(x.catId) >= 0 || !x.catId);
    }).reduce(function (a, x) { return a + (Number(x.amount) || 0); }, 0) * 100) / 100;
  }
  function moneyDailyLeft() {
    const now = new Date();
    const y = now.getFullYear(), mo = now.getMonth();
    const days = new Date(y, mo + 1, 0).getDate();
    const restDays = Math.max(1, days - now.getDate() + 1);
    const budget = moneySum(moneyCats('daily'), 'budget');
    const spent = moneyDailySpentThisMonth();
    const left = Math.round((budget - spent) * 100) / 100;
    return {
      budget: budget, spent: spent, left: left, rest: restDays,
      perDay: Math.round(left / restDays * 100) / 100,
      pct: budget > 0 ? Math.min(100, Math.round(spent / budget * 100)) : 0
    };
  }

  /* ---------- 工具（v91） ---------- */
  /* 两个计算器都是「输入 → 点按钮算 → 结果显示在页面上」，
     不做实时联动：全量重绘的页面里，input 事件一触发就重新渲染，焦点会丢。 */
  let moneyRateApr = 18;
  let moneyLoanTry = { cash: 10000, pay: 1000, n: 12 };

  /* 月息几分：1 分 = 1% 月息，1 厘 = 0.1% */
  function moneyRateWords(apr) {
    const m = apr / 12;
    if (!(m > 0)) return '0';
    return m >= 1 ? (Math.round(m * 10) / 10) + ' 分' : (Math.round(m * 100) / 100 * 10) + ' 厘';
  }

  /* 真实年化：借 cash，每月还 pay，还 n 期。
     二分求月利率让「未来还款的现值 = 到手金额」，再乘 12。
     这比「利息 ÷ 本金」准得多——后者会把「先扣手续费」那种贷款算便宜一半。 */
  function moneyAprOf(cash, pay, n) {
    if (!(cash > 0) || !(pay > 0) || !(n > 0)) return 0;
    if (pay * n <= cash) return 0;
    let lo = 0, hi = 1;
    for (let i = 0; i < 80; i++) {
      const mid = (lo + hi) / 2;
      let pv = 0;
      for (let k = 1; k <= n; k++) pv += pay / Math.pow(1 + mid, k);
      if (pv > cash) lo = mid; else hi = mid;
    }
    return Math.round((lo + hi) / 2 * 1200 * 10) / 10;
  }

  function moneyRiskRows() {
    const rows = [];
    const live = moneyLive();
    const sp = moneyBudgetSplit();
    const sim = moneySimulate(money().strategy, false);
    const noExtra = moneySimulate(money().strategy, false, 0);

    const hi = live.filter(function (d) { return (Number(d.apr) || 0) >= 15; })
      .sort(function (a, b) { return (Number(b.apr) || 0) - (Number(a.apr) || 0); });
    if (hi.length) {
      rows.push({ warn: true, t: hi.length + ' 笔债年化超过 15%',
        d: '最高是「' + hi[0].name + '」' + (Number(hi[0].apr) || 0) + '%。' +
           '同样的钱先砸最高息那笔（雪崩法），总利息最少。' });
    } else if (live.length) {
      rows.push({ warn: false, t: '没有高息债',
        d: '所有债年化都在 15% 以下，先还哪笔差别不大，按雪球法图个痛快也行。' });
    }

    if (sp.debt > 0 && sp.income > 0) {
      const pct = Math.round(sp.debt / sp.income * 100);
      rows.push({ warn: pct > 40, t: '月供占收入 ' + pct + '%',
        d: pct > 40
          ? '超过 40% 了，日子会很紧。先看能不能把高息那笔换成低息的，' +
            '或者把加速钱压一压换口气——撑不住的时候，少还一点比断了强。'
          : '还在 40% 以内，属于能扛的范围。' });
    }

    if (live.length && (Number(money().extra) > 0) && noExtra.months > sim.months) {
      rows.push({ warn: false,
        t: '加速钱让你早 ' + (noExtra.months - sim.months) + ' 个月还完',
        d: '只还最低要 ' + noExtra.months + ' 个月，现在每月多还 ¥' +
           moneyFmt(money().extra) + '，' + sim.months + ' 个月就清了。' });
    } else if (live.length && !(Number(money().extra) > 0)) {
      rows.push({ warn: false, t: '还没设加速钱',
        d: '加速钱是每月在最低还款之外多还的部分。哪怕只填 200，还清日都会明显提前。' });
    }

    if (sp.income > 0 && sp.rest < 0) {
      rows.push({ warn: true, t: '每月缺口 ¥' + moneyFmt(Math.abs(sp.rest)),
        d: '固定开支 + 日常预算 + 月供已经超过收入。要么减预算，要么加收入，' +
           '不然迟早要借新钱——以贷养贷是滚起来最快的那种。' });
    } else if (sp.income > 0) {
      rows.push({ warn: false, t: '每月还能剩 ¥' + moneyFmt(sp.rest),
        d: '建议先留够 1 个月开销当应急金，剩下的再拿去加速还款。' });
    }
    return rows;
  }

        '<div class="mrate-cell"><small>日息</small><b>万 ' +
          (Math.round(apr / 365 * 100 * 10) / 10) + '</b></div>' +

        '<div class="mtbl-row head"><span>说法</span><span>折合年化</span><span>借 1 万每月</span></div>' +
        [['月息 5 厘', 6], ['月息 1 分', 12], ['月息 1.5 分', 18],

    const t = moneyLoanTry;
    const real = moneyAprOf(t.cash, t.pay, t.n);
    const totalPay = t.pay * t.n;
    const interest = Math.max(0, totalPay - t.cash);
    const loanPanel = '<div class="panel"><h3>这笔钱实际多贵 ' +
      '<span class="muted-sm">（按「到手多少、每月还多少」反算年化）</span></h3>' +
      '<div class="form-grid">' +
        '<label class="field"><span>到手金额（元）</span>' +
          '<input id="money-loan-cash" type="number" min="0" step="0.01" value="' + t.cash + '"></label>' +
        '<label class="field"><span>每月还（元）</span>' +

      '</div>' +
      /* 按钮不能塞进 .field：那个类里的控件是 width:100%，一进去就撑成整行宽 */
      '<div class="btn-row" style="margin-top:10px">' +
        '<button type="button" class="btn" data-act="money-loan-calc">算真实年化</button></div>' +
      '<div class="mapr"><b>' + (real > 0 ? real + '%' : '0%') + '</b>' +
        '<span>真实年化</span></div>' +
      '<div class="msum"><span>总还款 <b>¥' + moneyFmt(totalPay) + '</b></span>' +
        '<span>总利息 <b>¥' + moneyFmt(interest) + '</b></span>' +
        '<span>本金 <b>¥' + moneyFmt(t.cash) + '</b></span></div>' +
      '<p class="hint">' + (real >= 24
        ? '这个年化已经很高了——借 1 万一年要还 ' + Math.round(real) + '% 的利息，' +
          '能换低息的就换，换不了就优先砸它。'
        : (real > 0
          ? '这是「分期还款」的真实成本，比「利息 ÷ 本金」算出来的高，因为本金在逐月变少。'
          : '还款总额不高于到手金额，利息为 0 或数字不对，检查一下输入。')) + '</p></div>';

    const risks = moneyRiskRows();
    const riskPanel = '<div class="panel"><h3>风险体检 ' +
      '<span class="muted-sm">（按你填的债和预算现算，不上传）</span></h3>' +
      (risks.length ? risks.map(function (r) {
        return '<div class="mrisk"><i class="mrisk-dot' + (r.warn ? ' warn' : '') + '"></i>' +
          '<div class="mrisk-body"><b>' + esc(r.t) + '</b><span>' + esc(r.d) + '</span></div></div>';
      }).join('') : '<div class="empty-box">先记一笔债，才有得体检。</div>') +
      '<p class="hint">这只是帮你算账，不构成任何借贷或投资建议。</p></div>';

    const nt = (money().notify && typeof money().notify === 'object')
      ? money().notify : { on: false, before: [3, 1, 0], time: '09:00' };
    const before = Array.isArray(nt.before) ? nt.before : [3, 1, 0];
    const notifyPanel = '<div class="panel"><h3>还款提醒 ' +

      '</div>' +
      '<div class="mfield" style="margin-top:10px"><span>提前提醒</span>' +
        '<span class="stab">' + [3, 1, 0].map(function (d) {
          return '<button type="button" class="' + (before.indexOf(d) >= 0 ? 'on' : '') +
            '" data-act="money-notify-day" data-day="' + d + '">' +
            (d === 0 ? '当天' : '提前 ' + d + ' 天') + '</button>';
        }).join('') + '</span>' +
      '</div>' +
      '<div class="mfield" style="margin-top:10px"><span>推送时刻</span>' +
        '<input id="money-notify-time" type="time" value="' + esc(nt.time || '09:00') + '">' +
        '<button type="button" class="btn sm" data-act="money-notify-save">保存</button>' +
      '</div>' +
      '<p class="hint">还款日只会标在日历上，<b>不会变成待办</b>，所以不参与任何完成率计算。' +
      (nt.on ? '<br>推送走「配置 → 企业微信推送」里那个机器人，没配过先去配。' : '') +
      (moneyLive().length ? '' : '<br>目前还没有未还清的债，开了也不会响。') + '</p></div>';

    /* 不再有「清债备份」面板：清债数据本来就在整份 state 里，
       设置页的「导出备份 JSON」已经把它一起带上了。
       两套导出只会让人以为要分别备份两次。 */
    return ratePanel + loanPanel + riskPanel + notifyPanel;
  }

        '利息按 余额 × 年化 ÷ 12 估算，跟银行实际账单会有几分钱误差，以账单为准。</p>' +
