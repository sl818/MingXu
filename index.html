<script>
(function(){
  try{
    var s = localStorage.getItem('lifeboard.skin');
    if(['paper','slate','mono','clay','mist','forest','neu','cyber','retro'].indexOf(s) >= 0) document.documentElement.setAttribute('data-skin', s);
    var lay = localStorage.getItem('lifeboard.layout');
    if(['top','side','wide'].indexOf(lay) < 0) lay = 'top';
    document.documentElement.setAttribute('data-layout', lay);
    var m = localStorage.getItem('lifeboard.theme.mode');
    if(['auto','light','dark'].indexOf(m) < 0) m = 'auto';
    var h = new Date().getHours();
    var t = m === 'auto' ? ((h >= 7 && h < 19) ? 'light' : 'dark') : m;
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

      .then(function (s) { if (s && s.installed === false) location.replace('install/'); })
      .catch(function () {});

})();
</script>
<style>
/* ============================================================
   CSS 维护须知（2026-10-25 补记）

   本页有 5 个 <style> 块，按历史顺序叠加，靠 cascade 优先级生效：
     1. <style>              设计变量 + 布局 + 基础组件
     2. #visual-v2           视觉改版，覆盖第 1 块
     3. #skins               9 套皮肤变量与派生样式
     4. #new-pages           今日/习惯/体重/随笔等新页面
     5. #layout-v3           三布局（wide / top / side），优先级最高

   已知问题：同一选择器在多个块中被重复定义（此前统计有 299 个重复）。
   因此——修改样式前请先在全部 5 个块里搜索目标选择器，确认最终生效位置，
   再改那一处；切勿只在最靠前的块里改，否则看起来"没生效"。

   删除样式前先确认类名仍在被引用：项目里所有 class 都由 JS 字符串拼出，
   搜索 `class="类名` 而非 DOM；确认无引用后再删。
   ============================================================ */
/* ============ 设计变量 ============ */
:root{
  --bg:#f4f5f9;
  --surface:#ffffff;
  --surface-2:#f7f8fc;
  --text:#1b2030;
  --muted:#727a90;
  --line:#e5e7f0;
  --accent:#2f6f5e;
  --accent-2:#8b5cf6;
  --accent-soft:#eef0ff;
  --good:#1f9d67;
  --warn:#e08a3c;
  --bad:#dd5a5a;
  --shadow:0 1px 2px rgba(20,25,40,.04), 0 10px 26px rgba(20,25,40,.06);
  --radius:16px;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--accent-soft)}
.muted-sm{font-size:12px;font-weight:400}

/* ============ 布局 ============ */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;padding:24px 14px 18px;background:var(--surface);z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.logo{border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.brand-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-search{
  margin-left:auto;flex:none;width:32px;height:32px;border-radius:9px;
  display:grid;place-items:center;font-size:13px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
  cursor:pointer;transition:color .15s,border-color .15s,background .15s;
}
.brand-search:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}
/* 手机端悬浮搜索入口：默认隐藏，窄屏才显示，避开中间的「+」 */
.search-fab{display:none}
@media (max-width:960px){
  .search-fab{
    display:grid;place-items:center;
    position:fixed;right:14px;z-index:41;
    bottom:calc(74px + env(safe-area-inset-bottom));
    width:44px;height:44px;border-radius:50%;font-size:16px;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);
    box-shadow:0 10px 24px -12px rgba(20,25,40,.5);cursor:pointer;
    transition:transform .16s,color .16s,border-color .16s;
  }
  .search-fab:active{transform:scale(.93)}
}
/* ---------- 触控目标：仅触摸设备扩大热区，视觉尺寸不变 ----------
   做法：::after 绝对定位铺一层透明热区，尺寸取 max(原尺寸, 44px)，
   所以已经够大的那一维不会再被放大（例如 91px 宽的药条只补高度）。
   整套规则都在 pointer: coarse 下，桌面端完全不受影响。
   不处理的两类：正文行内链接、页脚外部链接——它们彼此相邻，
   放大后热区互相覆盖反而会误触，且都不是主要操作。 */
@media (pointer: coarse){
  .check,.icon-btn,.link-btn,.hero-arrow,.hero-today,.mini-btn,.tag-chip,.essay-tag,
  .arrow,.pip,.med-slot,.med-mini,.sync-indicator,.bf-clear,
  .remind-go,.remind-x,.backfill-today,.med-prn-add,.med-prn-undo{position:relative}
  .check::after,.icon-btn::after,.link-btn::after,.hero-arrow::after,.hero-today::after,
  .mini-btn::after,.tag-chip::after,.essay-tag::after,.arrow::after,.pip::after,
  .med-slot::after,.med-mini::after,.sync-indicator::after,.bf-clear::after,
  .remind-go::after,.remind-x::after,.backfill-today::after,
  .med-prn-add::after,.med-prn-undo::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(100%,44px);height:max(100%,44px);
  }
}
.brand-text b{font-size:15px}
.brand-text small{font-size:9px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;font-size:14px;font-weight:500;transition:background .16s ease,color .16s ease;text-align:left}
.nav-item svg{flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 10px;font-size:11.5px}
.link-btn{text-align:left;transition:color .15s}
.main{width:100%;max-width:1240px;margin:0 auto;padding:28px 34px 70px}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-size:22px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.section-head{display:flex;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-head h2{font-size:15px;font-weight:650}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-size:13px;font-weight:500;
  transition:background .15s,border-color .15s,transform .1s;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--line)}
.btn.danger:hover{background:rgba(221,90,90,.08);border-color:var(--bad)}
.btn.sm{padding:6px 10px;border-radius:8px}
.icon-btn{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:13px;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.danger:hover{background:rgba(221,90,90,.12)}
.icon-btn.add{font-size:16px;line-height:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.panel h3{font-size:15px}
.empty-box{padding:26px;border:1px dashed var(--line);border-radius:14px;text-align:center;background:var(--surface-2)}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ============ 今日 ============ */
.hero{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:22px;
  padding:26px 30px;border-radius:22px;color:#fff;
  background:linear-gradient(135deg,#2f6f5e 0%,#7c5cf0 58%,#9a5cf0 100%);
  box-shadow:0 22px 46px -24px rgba(91,107,240,.9);
  margin-bottom:8px;
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero::after{background:rgba(255,255,255,.07)}
.hero-main{position:relative;z-index:1;min-width:0}
.hero-date{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hero-arrow{border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);line-height:1;transition:background .15s}
.hero-arrow:hover{background:rgba(255,255,255,.28)}
.hero-arrow:disabled{opacity:.3;cursor:default}
.hero-tag{padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.hero-today{padding:2px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.45)}
.hero-today:hover{background:rgba(255,255,255,.15)}
.hero h1{font-size:25px;margin:12px 0 6px;font-weight:700}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap}
.hero-chips span{padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12)}
.hero-ring{position:relative;flex:none;display:grid;place-items:center;z-index:1}
.hero-ring .ring{position:absolute;inset:0}
.hero-pct{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.hero-pct b{font-size:24px}

.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.habit-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px 14px;border-top:3px solid var(--hc,var(--accent));transition:transform .18s ease,box-shadow .18s ease,border-color .18s;overflow:hidden}
.habit-card.is-done{background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 9%,var(--surface)) 0%,var(--surface) 70%)}
.habit-head{display:flex;align-items:center;gap:11px}
.habit-icon{flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--hc) 14%,var(--surface-2))}
.habit-icon.sm{width:30px;height:30px;font-size:16px;border-radius:9px}
.habit-title{display:flex;flex-direction:column;min-width:0;flex:1}
.habit-title b{font-size:14.5px;font-weight:650}
.habit-title small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-check{border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);color:transparent}
.habit-card.is-done .habit-check{background:var(--hc);border-color:var(--hc)}
.habit-card .pips{display:flex;gap:6px;margin:14px 0 10px}
.pip{flex:1;border-radius:6px;background:var(--surface-2);transition:background .18s,box-shadow .18s,transform .12s}
.pip.on{background:var(--hc)}
.habit-count{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.habit-count span{font-size:11.5px;font-weight:500}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
.stepper button{border-radius:50%;flex:none;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;transition:background .15s,color .15s,border-color .15s}
.stepper button:hover{background:var(--hc);border-color:var(--hc)}
.stepper button:disabled{opacity:.35;pointer-events:none}
.quit-ctrl{display:flex;align-items:center;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.state-pill{font-size:11.5px;padding:3px 9px;border-radius:99px;font-weight:600}
.state-pill.ok{background:rgba(31,157,103,.12)}
.state-pill.bad{background:rgba(221,90,90,.12)}
.mini-btn{padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.mini-btn:hover{border-color:var(--hc)}
.mini-btn.ghost{background:transparent}
.habit-bar{position:absolute;background:var(--surface-2)}
.habit-bar i{display:block;height:100%;background:var(--hc);transition:width .3s ease}

.task-list{display:flex;flex-direction:column;gap:8px}
.task-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:border-color .15s}
.task-row:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.check{border-radius:50%;flex:none;border:1.6px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--good)}
.task-row.done .check,.task-row.done .check:hover{background:var(--good);border-color:var(--good);color:#fff}
.task-row-main{flex:1;min-width:0}
.task-row-title{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-row.done .task-row-title{color:var(--muted);text-decoration:line-through}
.task-row-meta{display:flex;align-items:center;gap:8px}
.done-sep{margin:10px 2px 2px}
.quick-add{display:flex;gap:8px}
.quick-add input{flex:1;padding:11px 14px;border-radius:11px;border:1px dashed var(--line);background:var(--surface)}
.quick-add input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--surface)}

/* ============ 看板 ============ */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}
.col-head b{font-size:13.5px}
.dot{border-radius:50%;flex:none}
.col-count{background:var(--surface);border-radius:99px;padding:1px 7px;border:1px solid var(--line)}
.col-head .icon-btn{margin-left:auto}
.col-body{display:flex;flex-direction:column;gap:9px;min-height:200px;flex:1}
.col-empty{text-align:center;padding:26px 8px;border:1px dashed var(--line);border-radius:12px;background:transparent;width:100%;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;justify-content:center;transition:border-color .16s,background .16s,color .16s}
.col-empty:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft);color:var(--accent-strong)}
.col-empty .ce-plus{font-size:20px;line-height:1;color:var(--accent);opacity:.75}
.col-empty:hover .ce-plus{opacity:1}
.col-empty .ce-main{font-size:12px;font-weight:500}
.col-empty .ce-sub{font-size:10.5px;color:color-mix(in srgb,var(--muted) 80%,var(--text));line-height:1.5}
.task{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:grab;position:relative;border-left:3px solid var(--prio,var(--line));transition:box-shadow .15s,transform .12s,opacity .15s}
.task:active{cursor:grabbing}
.task.dragging{opacity:.35;transform:rotate(1.5deg)}
.task.drop-before{box-shadow:0 -3px 0 -1px var(--accent)}
.task.drop-after{box-shadow:0 3px 0 -1px var(--accent)}
.task-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.task h4{font-size:13.5px;font-weight:600;line-height:1.45;word-break:break-word}
.task p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task.done h4{text-decoration:line-through}
.task-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.task-btns{display:flex;gap:2px;transition:opacity .15s}
.tag{
  font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;
  color:var(--tag,var(--muted));
  background:color-mix(in srgb,var(--tag,var(--muted)) 13%,transparent);
  white-space:nowrap;
}
.prio{font-size:10.5px;color:var(--prio);font-weight:600;white-space:nowrap}
.due{white-space:nowrap}
.due.overdue{font-weight:600}

/* ============ 日历 ============ */
.cal-wrap{max-width:700px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav b{font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.month-nav .arrow{border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;background:var(--surface)}
.month-nav .arrow:hover{border-color:var(--muted)}
.cal-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cal-summary span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.cal-summary b{font-variant-numeric:tabular-nums}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-wd{text-align:center;padding:2px 0 6px}
.cal-cell{border-radius:14px;place-items:center;border:1px solid transparent;transition:background .15s,border-color .15s,transform .12s}
.cal-cell.blank{pointer-events:none}
.cal-cell:not(.blank):not(:disabled):hover{background:var(--surface-2)}
.cal-cell:disabled{cursor:default}
.cal-cell.is-today{border-color:var(--accent)}
.cal-cell.is-sel{background:var(--accent-soft)}
.cal-num{inset:0;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cal-cell.has-data .cal-num{color:var(--text)}
.cal-legend{display:flex;align-items:center;gap:6px}
.cal-legend i{border-radius:4px}

/* ============ 统计 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 17px}
.stat-card b{display:block;font-size:27px;margin:5px 0 1px;font-variant-numeric:tabular-nums}
.stat-card b i{font-style:normal;font-size:12px;font-weight:500}
.chart{display:flex;align-items:flex-end;gap:7px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar-wrap i{
  display:block;width:100%;min-height:3px;border-radius:7px;
  background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff));
  transition:height .45s cubic-bezier(.2,.8,.3,1);
}
.bar-wrap i.zero{background:var(--line)}
.bar-col span{color:var(--muted);white-space:nowrap}
.hstat{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(160px,1.3fr) auto;align-items:center;gap:16px;padding:12px 4px}
.hstat:last-child{border-bottom:0}
.hstat-name{display:flex;align-items:center;gap:10px;min-width:0}
.hstat-name b{display:block;font-size:13px}
.hstat-name small{display:block}
.hstat-dots{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.hstat-dots i{aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.hstat-dots i.ok{background:var(--hc,var(--accent))}
.hstat-dots i.miss{background:color-mix(in srgb,var(--bad) 38%,var(--surface-2))}

.task:hover .task-btns{opacity:1}
.tag{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:color-mix(in srgb,var(--tag) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--tag) 20%,transparent);
  letter-spacing:.02em;
}
.due{font-size:10px;color:var(--muted)}
.due.overdue{color:color-mix(in srgb,var(--bad) 86%,var(--text))}

/* ---------- 看板：宽屏右侧信息栏 ---------- */
.board-shell{display:block}
.board-rail{display:none}
.board-col-wrap{min-width:0}
.board-filter{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  padding:9px 10px 9px 14px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));
  background:var(--accent-soft);font-size:11.5px;color:var(--text);line-height:1.5;
}
.board-filter b{font-weight:600}
.board-filter .bf-clear{
  margin-left:auto;flex:none;width:24px;height:24px;border-radius:7px;
  border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));
  background:var(--surface);color:var(--muted);font-size:12px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
}
.board-filter .bf-clear:hover{color:var(--text);border-color:var(--line-strong)}
.board-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px}
.board-tools .bt-sep{width:1px;height:16px;background:var(--line);margin:0 3px;flex:none}
.board-tools .tag-chip{display:inline-flex;align-items:center;gap:5px}
.board-tools .bt-dot{width:6px;height:6px;border-radius:50%;flex:none}
/* 选中态原来的 accent 色在 mono / clay 上只有 3.4~3.7，往 --text 拉一点过 AA。
   必须带前缀提高优先级：#new-pages 块里有同名的 .tag-chip.active 写在后面，
   只用单类选择器会被它覆盖。看板筛选、习惯排序、随笔标签三处共用。 */
.board-tools .tag-chip.active,
.habit-sort .tag-chip.active,
.essay-tags .tag-chip.active{color:color-mix(in srgb,var(--accent) 72%,var(--text))}
.se-card{width:min(560px,calc(100vw - 32px));padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.se-head{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
.se-ico{font-size:15px;opacity:.7;flex:none}
.se-head input{
  flex:1;min-width:0;background:transparent;border:0;outline:none;
  font-size:14.5px;color:var(--text);
}
.se-head input::placeholder{color:var(--muted)}
.se-body{overflow:auto;padding:8px;flex:1;-webkit-overflow-scrolling:touch}
.se-hint{padding:22px 12px;text-align:center;font-size:12px;color:var(--muted);line-height:1.8}
.se-group{font-size:10px;letter-spacing:.08em;color:var(--muted);padding:9px 10px 5px}
.se-item{
  display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
  padding:8px 10px;border-radius:10px;border:1px solid transparent;
  cursor:pointer;transition:background .12s,border-color .12s;
}
.se-item:hover{background:var(--surface-2)}
.se-item.is-on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 34%,transparent)}
.se-item .se-title{font-size:13px;color:var(--text);line-height:1.45;word-break:break-word}
.se-item .se-title mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:3px;padding:0 1px}
/* 往 --text 方向拉，比直接用 --muted 对比度更高（9 皮肤实测均过 AA） */
.se-item .se-meta{font-size:10.5px;color:color-mix(in srgb,var(--text) 74%,var(--muted))}
.se-foot{
  flex:none;display:flex;justify-content:space-between;gap:10px;
  padding:8px 14px;border-top:1px solid var(--line);
  font-size:10.5px;color:color-mix(in srgb,var(--text) 74%,var(--muted));
}
.task.is-focus{box-shadow:0 0 0 2px var(--accent),0 14px 26px -20px rgba(60,45,25,.55)}
/* 双击展开详情 */
.task.is-open{border-color:var(--line-strong);box-shadow:0 14px 30px -22px rgba(60,45,25,.55)}
.task.is-open p{display:block;-webkit-line-clamp:unset;overflow:visible}
.task-detail{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.task.is-open .task-detail{display:block}
.td-note{font-size:11.5px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-word}
.td-note + .td-meta{margin-top:8px}
.td-meta{display:flex;flex-wrap:wrap;gap:4px 7px}
.td-meta span{
  font-size:10px;color:var(--muted);background:var(--surface-2);
  border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap;
}
.td-acts{display:flex;gap:6px;margin-top:9px}
.td-btn{
  font-size:10.5px;font-family:inherit;cursor:pointer;white-space:nowrap;
  padding:4px 11px;border-radius:8px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
}
.td-btn:hover{border-color:var(--accent);color:var(--accent-strong)}

/* 迷你月历 */
.bcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.bcal-wd{font-size:9.5px;color:var(--muted);text-align:center;padding-bottom:5px;letter-spacing:.02em}
.bcal-d{
  height:30px;border-radius:8px;border:1px solid transparent;background:transparent;
  display:grid;place-items:center;font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;cursor:pointer;transition:background .12s,color .12s;
}
.bcal-d:hover{background:var(--surface-2);color:var(--text)}
.bcal-d.is-blank{visibility:hidden;pointer-events:none}
.bcal-d.has{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.bcal-d.has:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-strong)}
.bcal-d.is-today{border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--text);font-weight:700}
.bcal-d.on,.bcal-d.on:hover{
  background:var(--accent-strong);color:var(--on-accent);border-color:var(--accent-strong);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-strong) 34%,transparent);
}

/* 接下来 7 天 */
.bup{display:flex;flex-direction:column;gap:1px}
.bup-g{display:flex;align-items:center;gap:7px;padding:9px 2px 4px}
.bup-g:first-child{padding-top:0}
.bup-g b{font-size:10.5px;font-weight:600;color:var(--text);letter-spacing:.02em;white-space:nowrap}
.bup-g em{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.bup-g i{flex:1;height:1px;background:var(--line)}
.bup-i{
  display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
  padding:6px 7px;border:0;border-radius:8px;background:transparent;cursor:pointer;
}
.bup-i:hover{background:var(--surface-2)}
.bup-i .bd{width:5px;height:5px;border-radius:50%;flex:none;margin-top:6px;background:var(--prio)}
.bup-i .bt{
  flex:1;min-width:0;font-size:11.5px;line-height:1.45;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bup-i .bmd{color:var(--muted);font-size:10px;margin-right:4px;font-variant-numeric:tabular-nums}
.bup-i.is-over .bt{color:color-mix(in srgb,var(--bad) 86%,var(--text))}
.bup-i.is-over .bmd{color:color-mix(in srgb,var(--bad) 86%,var(--text))}

/* 归档投放槽：平时低对比度，拖卡片时才浮现 */
.arch-zone{
  display:block;width:100%;text-align:center;cursor:default;
  border:1.5px dashed var(--line-strong);border-radius:14px;
  background:transparent;padding:13px 12px;
  color:color-mix(in srgb,var(--muted) 74%,var(--text));font-size:10.5px;line-height:1.55;
  transition:border-color .18s ease,background .18s ease,color .18s ease,transform .18s ease;
}
.arch-zone .az-ico{display:block;font-size:15px;line-height:1;margin-bottom:5px;color:inherit}
.arch-zone b{display:block;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--muted) 60%,var(--text));margin-bottom:2px}
body.is-dragging .arch-zone{
  border-color:color-mix(in srgb,var(--accent) 52%,var(--line-strong));
  background:color-mix(in srgb,var(--accent-soft) 65%,transparent);
}
body.is-dragging .arch-zone b{color:var(--accent-strong)}
body.is-dragging .arch-zone .az-ico{color:var(--accent-strong)}
.arch-zone.is-over{
  border-style:solid;border-color:var(--accent-strong);
  background:var(--accent-soft);transform:scale(1.015);
}
.arch-zone.is-over b,.arch-zone.is-over .az-ico{color:var(--accent-strong)}

/* 归档列表弹层 */
.arch-modal{max-width:520px}
.arch-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin:2px 0 4px}
.arch-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);
}
.arch-row .ar-main{flex:1;min-width:0}
.arch-row .ar-main b{
  display:block;font-size:12.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.arch-row .ar-main small{display:block;font-size:10px;color:color-mix(in srgb,var(--muted) 88%,var(--text));margin-top:3px;line-height:1.5}
.arch-row .ar-btns{display:flex;gap:6px;flex:none}
.arch-row .ar-btn{
  font-size:10.5px;font-family:inherit;cursor:pointer;white-space:nowrap;
  border-radius:8px;padding:5px 10px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
}
.arch-row .ar-btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.arch-row .ar-btn.del{color:color-mix(in srgb,var(--bad) 86%,var(--text))}
.arch-row .ar-btn.del:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}

@media (min-width:1520px){
  :root[data-layout="top"] #main{max-width:1680px}
  :root[data-layout="top"] .board-shell{
    display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;
  }
  :root[data-layout="top"] .board-rail{
    display:flex;flex-direction:column;gap:14px;position:sticky;top:24px;
  }
}

/* ---------- 日历（改为热力格） ---------- */
/* width:100% 不能省：.main 是 flex 容器，不给宽度时 item 会退化成 max-content，
   周视图 620px 的时间线会把整个面板撑出屏幕 */
/* 右栏那两个面板挪走后，日历不必再挤在 780 里：宽屏用 1040，7 列才够舒展 */
.cal-wrap{max-width:1040px;width:100%;margin-left:auto;margin-right:auto;min-width:0}
.cal-top{margin-bottom:18px}
.month-nav b{font-size:15px;font-weight:600;letter-spacing:.01em;min-width:120px}
.month-nav .arrow{
  width:32px;height:32px;border:1px solid var(--line);
  background:var(--surface);border-radius:9px;color:var(--muted);
}
.month-nav .arrow:hover{color:var(--text);border-color:var(--line-strong);background:var(--surface-2)}
.cal-summary span{
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--muted);font-size:10.5px;padding:5px 11px;letter-spacing:.02em;
}
.cal-summary b{color:var(--text);font-weight:600}
.cal-grid{gap:7px}
.cal-wd-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cal-wd{font-size:10px;letter-spacing:.12em;color:var(--muted);padding:4px 0 8px}
.cal-cell{
  position:relative;aspect-ratio:auto;height:92px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;
  padding:9px 10px;border:1px solid var(--line);border-radius:13px;
  background:var(--surface);overflow:hidden;
  transition:transform .12s,border-color .15s,box-shadow .15s;
}
/* 格子里的待办：桌面显示标题，手机（见媒体查询）换成「N 项」 */
.cal-tasks{
  display:flex;flex-direction:column;gap:1px;
  margin:2px 0 1px;min-height:0;flex:1 1 auto;overflow:hidden;z-index:1;
}
.cal-task{
  display:block;font-style:normal;font-size:9.5px;line-height:1.45;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-left:7px;position:relative;
}
.cal-task::before{
  content:"";position:absolute;left:0;top:50%;margin-top:-1.5px;
  width:3px;height:3px;border-radius:50%;background:var(--accent);
}
.cal-task-more{
  display:block;font-style:normal;font-size:9px;line-height:1.35;
  color:var(--muted);padding-left:7px;letter-spacing:.02em;
}
.cal-tasks-num{display:none;font-size:9.5px;font-weight:500;color:var(--text);line-height:1.4}
.cal-cell.blank{background:transparent;border-color:transparent}
.cal-fill{
  position:absolute;inset:0;background:var(--accent);opacity:0;
  pointer-events:none;transition:opacity .2s;
}
.cal-cell[data-level="1"] .cal-fill{opacity:.08}
.cal-cell[data-level="2"] .cal-fill{opacity:.15}
.cal-cell[data-level="3"] .cal-fill{opacity:.24}
.cal-cell[data-level="4"] .cal-fill{opacity:.34}
.cal-num{
  position:static;inset:auto;display:block;text-align:left;
  font-size:12px;font-weight:600;color:var(--text);
  line-height:1;z-index:1;font-variant-numeric:tabular-nums;
}
.cal-pct{font-size:9px;color:var(--muted);line-height:1;min-height:9px;z-index:1;letter-spacing:.02em}
.cal-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;z-index:1;min-height:14px}
.cal-mood{font-size:12px;line-height:1;margin-left:auto;filter:grayscale(.1)}
.cal-cell[data-level="4"] .cal-num{color:var(--accent-strong)}
.cal-cell.is-today{border-color:var(--accent)}
.cal-cell.is-today::after{
  content:"";position:absolute;top:9px;right:9px;
  width:5px;height:5px;border-radius:50%;background:var(--gold);
}
.cal-cell.is-sel{background:var(--surface-2);border-color:var(--text);box-shadow:0 0 0 1.5px var(--text)}
.cal-cell.is-future{opacity:.38}
.cal-cell:not(.blank):not(:disabled):hover{
  background:var(--surface-2);border-color:var(--line-strong);
  transform:translateY(-2px);
}
.cal-legend{margin-top:18px;gap:6px;font-size:10px;letter-spacing:.04em;color:var(--muted);flex-wrap:wrap}
.cal-legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:block}
.cal-legend i.l0{background:var(--surface)}
.cal-legend i.l1{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.cal-legend i.l2{background:color-mix(in srgb,var(--accent) 15%,var(--surface))}
.cal-legend i.l3{background:color-mix(in srgb,var(--accent) 24%,var(--surface))}
.cal-legend i.l4{background:color-mix(in srgb,var(--accent) 34%,var(--surface))}
.cal-legend .leg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cal-legend .leg-note{flex-basis:100%;font-size:10px;line-height:1.5;color:var(--muted)}

/* ---------- 统计 ---------- */
.stat-grid{gap:16px;margin-bottom:18px}
.stat-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);
}
.stat-card small{font-size:10px;letter-spacing:.1em;color:var(--muted)}
.stat-card b{
  font-family:var(--font-serif);font-size:36px;font-weight:500;
  letter-spacing:-.03em;color:var(--text);margin:8px 0 2px;line-height:1.05;
}
.stat-card b i{
  font-family:var(--font-sans);font-size:11px;font-weight:400;
  color:var(--muted);letter-spacing:0;margin-left:3px;
}
.stat-card span{font-size:10.5px;color:var(--muted)}
.stat-card:first-child b{color:var(--accent)}
.chart{height:162px;gap:8px;max-width:820px}
.bar-wrap{background:var(--surface-2);border-radius:8px}
.bar-wrap i{
  border-radius:8px;
  background:linear-gradient(180deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 58%,var(--surface)) 100%);
}
.bar-wrap i.zero{background:var(--line)}
.bar-col.is-today .bar-wrap i{
  background:linear-gradient(180deg,var(--gold) 0%,color-mix(in srgb,var(--gold) 58%,var(--surface)) 100%);
}
.bar-col span{font-size:9.5px}
.bar-col.is-today span{color:var(--gold);font-weight:600}
.hstat{padding:14px 4px;gap:20px;border-bottom:1px solid var(--line)}
.hstat-name b{font-size:13px;font-weight:600}
.hstat-name small{font-size:10px;color:var(--muted)}
.hstat-dots{gap:4px;max-width:320px}
.hstat-dots i{border-radius:3px;background:var(--surface-2)}
.hstat-dots i.miss{background:color-mix(in srgb,var(--bad) 30%,var(--surface-2))}
.hstat-meta{font-size:10.5px}
.hstat-meta b{font-size:11px}
.hstat-meta .streak{font-size:10.5px}
.log-row{
  display:grid;grid-template-columns:54px 28px minmax(0,1fr) 48px auto;
  align-items:center;gap:10px;padding:10px 2px;
  border-bottom:1px solid var(--line);font-size:12px;
}
.log-row:last-child{border-bottom:0}
.log-more{
  flex:none;font-size:11px;font-family:inherit;cursor:pointer;
  color:var(--accent-strong);background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line));
  border-radius:99px;padding:3px 11px;white-space:nowrap;
}
.log-more:hover{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.weight-tip{
  margin:0 0 10px;padding:8px 12px;border-radius:9px;font-size:11px;line-height:1.6;
  background:var(--accent-soft);color:var(--accent-strong);
  border-left:3px solid color-mix(in srgb,var(--accent) 55%,var(--line));
}
.log-time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.log-ico{
  width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;font-size:14px;
  background:color-mix(in srgb,var(--hc) 10%,var(--surface-2));
}
.log-name{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-delta{font-weight:600;color:var(--good);text-align:right;font-variant-numeric:tabular-nums}
.log-delta.minus{color:var(--muted)}
.log-delta.bad{color:var(--bad)}
.log-date{font-size:10px;color:var(--muted);white-space:nowrap;text-align:right}

/* ---------- 设置 ---------- */
.settings-wrap{max-width:860px}
.habit-row{padding:14px 6px;border-bottom:1px solid var(--line)}
.habit-row-info b{font-size:13px;font-weight:600}
.habit-row-info small{font-size:10.5px;color:var(--muted)}
.btn-row{gap:9px;margin-top:16px}
.tips{font-size:12px;line-height:2;color:var(--muted)}
.tips li::marker{color:var(--gold)}

/* ---------- 弹窗与表单 ---------- */
.modal-backdrop{
  background:rgba(15,26,21,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.modal-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:26px;box-shadow:var(--shadow-lg);
}
.modal-card h3{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:20px}
.field{gap:6px;font-size:10.5px;letter-spacing:.05em;color:var(--muted);margin-bottom:14px}
.field input,.field select,.field textarea{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none;
}
.field input[type="color"]{height:42px;padding:4px}
.hint{font-size:10.5px;line-height:1.8;color:var(--muted);margin:12px 0 0}
/* 疗程已结束等需要提醒但不算错误的说明 */
.hint-warn{
  color:color-mix(in srgb,var(--text) 82%,var(--accent));
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
  border-radius:10px;padding:9px 12px;
}
.modal-actions{margin-top:24px}

/* ---------- 提示 ---------- */
.toast{
  background:#16241e;color:#f4efe2;
  border:1px solid rgba(216,178,95,.28);
  font-size:12px;padding:11px 18px;
  box-shadow:0 22px 44px -20px rgba(0,0,0,.65);
}

/* ---------- 今日：三项常驻 ---------- */
.vital-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
/* 两列时四张常驻卡一律等高：行高拉平 + 内容不足的靠留白撑住，不再出现 470/470/160/160 的断层 */
@media (min-width:961px){
  .vital-grid{grid-auto-rows:1fr}
}
.vital-card{
  position:relative;display:flex;flex-direction:column;gap:9px;
  padding:18px 18px 15px;border-radius:20px;
  background:linear-gradient(180deg,#fffefa 0%,var(--surface) 62%);
  border:1px solid var(--line);box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.vital-card:hover{
  transform:translateY(-2px);border-color:var(--line-strong);
  box-shadow:0 20px 38px -28px rgba(60,45,25,.5);
}
.vital-card::before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;
  border-radius:0 3px 3px 0;background:var(--hc);opacity:.5;
}
.vital-card.is-done{
  background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 7%,#fffefa) 0%,var(--surface) 66%);
  border-color:color-mix(in srgb,var(--hc) 22%,var(--line));
}
.vital-top{display:flex;align-items:center;gap:11px}
.vital-top .habit-icon{width:40px;height:40px;border-radius:12px;font-size:19px;flex:none}
.vital-title{flex:1;min-width:0}
.vital-title b{display:block;font-size:14.5px;font-weight:600;letter-spacing:.01em}
.vital-title small{
  display:block;font-size:10px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pin-tag{flex:none;font-size:9px;font-weight:600;letter-spacing:.08em;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);padding:2px 7px;border-radius:99px}
.vital-status{
  font-family:var(--font-sans);font-size:19px;font-weight:650;
  letter-spacing:-.01em;line-height:1.32;color:var(--text);margin-top:3px;
  min-height:31px;
}
.vital-status .vnum{font-family:var(--font-serif);font-size:34px;font-weight:500;letter-spacing:-.02em}
.vital-status .vunit{font-family:var(--font-sans);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.vital-sub{font-size:10.5px;color:var(--muted);line-height:1.6;min-height:16px}
.dose-row{display:flex;gap:6px;flex-wrap:wrap;margin:1px 0 3px;min-height:20px}
.dose{
  font-size:10px;padding:3px 8px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.dose.done{
  background:color-mix(in srgb,var(--hc) 10%,var(--surface));
  border-color:color-mix(in srgb,var(--hc) 25%,var(--line));
  color:var(--hc);
}
.dose.next{border-color:var(--gold);background:var(--gold-soft)}
.dose.next.late{
  border-color:color-mix(in srgb,var(--bad) 45%,var(--line));
  color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface));
}
.vital-progress{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0}
.vital-progress i{display:block;height:100%;border-radius:99px;background:var(--hc);transition:width .3s ease}
/* 喝水：九格分段 / 间隔提示 / 今日时间线 */
.water-steps{display:flex;gap:3px;margin:8px 0 0}
.water-steps i{
  flex:1;height:7px;border-radius:3px;background:var(--surface-2);
  border:1px solid color-mix(in srgb,var(--line) 75%,transparent);
  transition:background .2s,border-color .2s;
}
.water-steps i.on{background:var(--hc);border-color:var(--hc)}
.water-steps i.cur{
  background:color-mix(in srgb,var(--hc) 15%,var(--surface));
  border-color:color-mix(in srgb,var(--hc) 48%,var(--line));
}
.water-gap{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:7px}
.water-gap.need{
  display:inline-block;color:var(--text);font-weight:600;
  background:var(--gold-soft);
  border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);
  border-radius:99px;padding:2px 8px;margin-top:6px;
}
/* 近 7 天迷你柱（卡片右上） */
.water-week{flex:none;display:flex;align-items:center;gap:8px}
.ww-bars{display:flex;align-items:flex-end;gap:4px;height:32px}
.ww-bars i{
  width:8px;min-height:3px;border-radius:2px;
  background:var(--surface-2);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);
}
.ww-bars i.has{background:color-mix(in srgb,var(--hc) 42%,var(--surface));border-color:color-mix(in srgb,var(--hc) 28%,var(--line))}
.ww-bars i.is-today{background:var(--hc);border-color:var(--hc);box-shadow:0 0 0 1px color-mix(in srgb,var(--hc) 22%,transparent)}
.ww-avg{font-size:10px;color:var(--muted);white-space:nowrap;line-height:1.3}
.ww-avg b{display:block;font-size:11px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
/* 今日 24 小时分布 */
.water-dist{margin-top:9px}
.wd-track{
  position:relative;height:9px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--line);
}
.wd-track i{
  position:absolute;top:50%;width:7px;height:7px;border-radius:50%;
  background:var(--hc);border:1.5px solid var(--surface);
  transform:translate(-50%,-50%);cursor:default;
}
.wd-axis{position:relative;height:13px;margin-top:3px}
.wd-axis span{
  position:absolute;top:0;transform:translateX(-50%);
  font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;
}
.water-pace{
  margin-top:7px;font-size:10px;line-height:1.55;color:var(--muted);
}
/* 运动卡：周视图 + 七段环 */
.move-body{
  flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;
  align-items:center;min-height:0;margin-top:4px;
}
.move-left{min-width:0;display:flex;flex-direction:column;justify-content:center}
.mv-status{display:block;font-size:19px;font-weight:650;line-height:1.3;letter-spacing:-.01em}
.mv-status.ok{color:var(--accent-strong)}
.move-lines{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.move-lines > span{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);line-height:1.4}
.move-lines i{width:5px;height:5px;border-radius:50%;flex:none;background:var(--hc)}
.move-lines i.dim{background:var(--line-strong)}
.move-ring{position:relative;width:132px;height:132px;flex:none}
.move-ring svg{display:block;width:100%;height:100%}
.move-ring circle{stroke:var(--line-strong);transition:stroke .2s}
.move-ring circle.done{stroke:var(--hc)}
.move-ring circle.future{stroke:var(--line)}
.move-ring-txt{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
}
.move-ring-txt b{font-family:var(--font-serif);font-size:23px;font-weight:500;letter-spacing:-.02em;color:var(--text)}
.move-ring-txt small{font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.move-foot{font-size:10px;color:var(--muted);line-height:1.6;margin-top:10px}
@media (max-width:520px){
  .move-ring{width:104px;height:104px}
  .mv-status{font-size:17px}
  .move-ring-txt b{font-size:19px}
}
@media (max-width:760px){
  .water-week{display:none}
}
@media (max-width:420px){
  .water-pace{font-size:9.5px}
}
.vital-actions{display:flex;gap:8px;margin-top:auto;padding-top:7px}
.vital-btn{
  flex:1;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:600;
  background:var(--surface-2);color:var(--text);border:1px solid var(--line);
  transition:filter .15s,background .15s,color .15s,border-color .15s;
}
.vital-btn.primary{background:color-mix(in srgb,var(--hc) 82%,#12201a);border-color:color-mix(in srgb,var(--hc) 82%,#12201a)}
.vital-btn.primary:hover{filter:brightness(1.08)}
.vital-btn.ghost{flex:0 0 auto;background:transparent;color:var(--muted);padding:9px 12px}
.vital-btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.vital-btn:disabled{opacity:.4;cursor:default}
.vital-btn:disabled:hover{filter:none}
.vital-btn.ghost:disabled:hover{background:transparent}
.section-sub{
  display:flex;align-items:center;gap:10px;
  margin:24px 0 12px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);
}
.section-sub::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- 今日状态 ---------- */
.mood-panel{justify-content:flex-start}
.mood-options{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.mood{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:14px 6px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface-2);
  transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;
}
.mood.sad{--mood:#9c5a5a}
.mood.ok{--mood:#b8893b}
.mood.happy{--mood:#2f7d5c}
.mood:hover{border-color:var(--line-strong);background:var(--surface);transform:translateY(-1px)}
.mood-e{font-size:34px;line-height:1;filter:grayscale(.35);transition:filter .15s,transform .15s}
.mood-l{font-size:11px;color:var(--muted);font-weight:500}
.mood.active{
  border-color:var(--mood);
  background:color-mix(in srgb,var(--mood) 10%,var(--surface));
  box-shadow:0 0 0 1px var(--mood);
}
.mood.active .mood-e{filter:none;transform:scale(1.06)}
.mood.active .mood-l{color:var(--mood);font-weight:600}
.mood-hint{font-size:10px;color:var(--muted);margin-top:12px;text-align:center}

/* ---------- 用药 ---------- */
.med-warn{font-size:10px;color:var(--bad);margin-top:-4px}
.med-sheet{width:min(620px,100%)}
.modal-card.med-form{width:min(620px,100%)}
/* 每次时间：按次数动态排布的多个时间输入 */
.time-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.time-slots input[type="time"]{width:100%;min-width:0}
/* 用药卡内嵌「今日用药」清单 */
.med-today{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.med-line{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--surface-2)}
.med-line-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.med-line-top b{font-size:13px;color:var(--text);letter-spacing:.01em}
.med-line-top span{font-size:11px;color:var(--muted)}
.med-line-day{
  margin-left:auto;font-style:normal;font-size:10px;white-space:nowrap;
  color:var(--accent-strong);background:var(--accent-soft);
  padding:2px 8px;border-radius:999px;font-weight:600;
}
.med-line-slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.med-mini{
  font:inherit;font-size:11px;line-height:1.3;padding:4px 11px;border-radius:999px;
  cursor:pointer;transition:.15s;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
}
.med-mini:hover{border-color:var(--accent);color:var(--accent-strong)}
.med-mini.done{
  background:var(--accent-soft);color:var(--accent-strong);font-weight:600;
  border-color:color-mix(in srgb,var(--accent) 26%,transparent);
}
.med-mini.late{
  border-color:color-mix(in srgb,var(--warn) 55%,var(--line));
  color:var(--text);background:var(--warn-soft);
}
.med-mini.next{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.med-prn-row{gap:8px;font-size:11.5px;color:var(--muted)}
.med-prn-row b{font-size:12.5px;color:var(--text)}
/* 用药折叠：卡片最多显示 2 种，其余收进弹窗 */
/* ============ 用药卡轮播（≥2 种药）：药名条 + 左右箭头 ============ */
.med-carousel{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.med-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.med-tabs::-webkit-scrollbar{display:none}
.med-tab{
  flex:none;font-family:inherit;font-size:11.5px;line-height:1.4;white-space:nowrap;
  padding:4px 11px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  transition:border-color .16s,background .16s,color .16s;
}
.med-tab:hover{border-color:var(--line-strong);color:var(--text)}
.med-tab.active{
  background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 42%,transparent);
  color:var(--accent-strong);font-weight:600;
}
.med-pane{display:flex;align-items:center;gap:6px}
.med-pane-body{
  flex:1;min-width:0;min-height:88px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;
  padding:8px 10px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);
}
.med-pane-top{display:flex;align-items:baseline;gap:8px}
.med-pane-top b{font-size:13px;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.med-pane-pos{margin-left:auto;flex:none;font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.med-pane-meta{font-size:11.5px;color:var(--muted);line-height:1.5}
.med-nav{
  flex:none;width:26px;height:26px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;font-family:inherit;font-size:16px;line-height:1;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  transition:border-color .16s,color .16s,background .16s,transform .16s;
}
.med-nav:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
.med-nav:active{transform:scale(.92)}
.med-mini.is-static{cursor:default;pointer-events:none}
.med-carousel + .med-prn-row{margin-top:7px}
.med-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.med-sheet-head h3{margin-bottom:2px}
.med-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--surface-2)}
.med-item:last-child{margin-bottom:0}
.med-item-head{display:flex;align-items:flex-start;gap:10px}
.med-item-ico{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:grid;place-items:center;font-size:15px;
  background:var(--accent-soft);
}
.med-item-title{flex:1;min-width:0}
.med-item-title b{display:block;font-size:13px;font-weight:600}
.med-item-title small{display:block;font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5}
.med-item-stock{font-size:9.5px;color:var(--muted);white-space:nowrap;text-align:right}
.med-dose-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.med-dose{
  padding:5px 11px;border-radius:9px;font-size:11px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-variant-numeric:tabular-nums;
  transition:background .15s,border-color .15s,color .15s;
}
.med-dose:hover{border-color:var(--accent);color:var(--accent)}
.med-dose.done{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent)}
.med-dose.next{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink)}
.med-dose.late{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.med-prn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.med-prn-count{font-size:10.5px;color:var(--muted);flex:1;min-width:120px}
/* ============ 用药页面：分板块 + 一行一种药 ============ */
.med-group{margin-bottom:24px}
.med-group:last-of-type{margin-bottom:4px}
.med-group-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.med-group-head h3{font-size:14.5px;font-weight:600;letter-spacing:.01em}
.med-group-head i{font-style:normal;font-size:11px;color:var(--muted)}
/* 用药统计卡 */
.med-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;margin:6px 0 16px}
/* 用药页头部两个按钮并排 */
.page-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* 依从率趋势的头部：大数字 + 环比。环比刻意不用红绿，
   一来这是健康数据不是行情，二来 --bad 在 clay 皮肤下对比度不够 */
.adh-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.adh-big{font-size:26px;font-weight:600;color:var(--text);line-height:1.15}
.adh-big i{font-style:normal;font-size:12.5px;font-weight:400;color:var(--muted);margin-left:2px}
.adh-delta{font-size:12px;color:var(--text)}
.adh-note{font-size:12px;color:var(--muted)}
/* 月度小结：为了打印而设计。屏幕上是一张卡片，打印时整页只有它 */
/* 命令面板：命令命中时把那条结果做成一张明显的卡，和普通搜索结果区分开 */
.se-cmd{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:10px;
  background:var(--accent-soft);border:1px solid var(--accent);text-align:left}
.se-cmd .se-title{font-size:13.5px;font-weight:600;color:var(--text)}
/* 说明文字不能用 --muted：这块底是 --accent-soft，mono/clay/mist/neu 四个皮肤下
   11.5px 的 --muted 只有 4.20–4.49，差一点不到 4.5。层次靠字号和字重区分就够了 */
.se-cmd .se-meta{font-size:11.5px;color:var(--text)}
.se-cmd.is-bad{background:transparent;border-color:var(--line);border-style:dashed}
.se-cmd.is-bad .se-title{font-weight:500}
.sum-head{border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.sum-head h3{margin:0 0 4px}
.sum-head span{font-size:12px;color:var(--muted)}
.sum-sec{margin:0 0 16px}
.sum-sec h4{font-size:13px;font-weight:600;color:var(--text);margin:0 0 6px}
.sum-lead{font-size:12.5px;color:var(--text);margin:0 0 8px;line-height:1.6}
.sum-big{font-size:24px;font-weight:600;color:var(--text);line-height:1.2;margin:0 0 6px}
.sum-big small{font-size:12px;font-weight:400;color:var(--muted);margin-left:6px}
.sum-table{width:100%;border-collapse:collapse;font-size:12px}
.sum-table th,.sum-table td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;
  color:var(--text);vertical-align:top}
.sum-table th{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.sum-table .num{text-align:right;white-space:nowrap}
.sum-foot{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
@media print{
  /* 打印时 body 下只保留模态根节点，其余（导航、页面、悬浮按钮、toast）全部收起 */
  body > *:not(#modal-root){display:none !important}
  html,body{background:#fff !important}
  .modal-backdrop{position:static !important;display:block !important;padding:0 !important;
    margin:0 !important;background:none !important;overflow:visible !important;
    -webkit-backdrop-filter:none !important;backdrop-filter:none !important;height:auto !important}
  .modal-card{max-width:none !important;width:100% !important;max-height:none !important;
    box-shadow:none !important;border:0 !important;border-radius:0 !important;
    padding:0 !important;margin:0 !important;background:#fff !important}
  .no-print{display:none !important}
  /* 深色主题下强行黑字白底，否则会打出一片深灰 */
  .summary-card,.summary-card *{color:#111 !important;background:transparent !important}
  .sum-table th,.sum-table td,.sum-head,.sum-foot{border-color:#c8c8c8 !important}
  .sum-table tr{break-inside:avoid}
  .sum-sec{break-inside:avoid}
  @page{margin:14mm}
}
/* 库存盘点：用 flex 而不是 grid，手机上一行放不下时药名会自动换行，
   不会把数字输入框挤成一条缝 */
.stock-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.stock-row:last-child{border-bottom:0}
.stock-main{flex:1;min-width:0}
.stock-name{display:block;font-size:13px;font-weight:500;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stock-now{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.stock-now i{font-style:normal;color:var(--muted)}
/* 不用 var(--bad)：clay 皮肤的 --bad 是 #e08a7d，11.5px 小字在浅底上
   对比度只有 2.2:1。和 .ics-warn 一样，靠加粗和文案表达，不靠颜色 */
.stock-flag{color:var(--text);font-weight:500}
.stock-input{flex:none;width:88px;box-sizing:border-box;padding:7px 9px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--text);font:inherit;font-size:13px;text-align:right;
  -moz-appearance:textfield;appearance:textfield}
/* 手机上用不到上下箭头，留着只会让输入框显得挤 */
.stock-input::-webkit-outer-spin-button,
.stock-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stock-input:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.stock-hint{font-size:11.5px;line-height:1.65;color:var(--muted);margin:10px 0 0}
.ms-card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;box-shadow:var(--shadow);
}
.ms-card small{display:block;font-size:10.5px;color:var(--muted);line-height:1.4}
.ms-card b{
  display:block;font-size:22px;font-weight:600;margin-top:5px;line-height:1.15;
  font-family:var(--font-serif);letter-spacing:-.01em;color:var(--text);
}
.ms-card b i{font-size:11px;font-style:normal;font-weight:500;color:var(--muted);margin-left:3px;font-family:var(--font-sans)}
.ms-card .ms-sub{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.ms-card.warn b{color:color-mix(in srgb,var(--gold-ink) 68%,var(--text))}
.ms-bar{display:block;height:4px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.ms-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.med-group-hint{font-size:11px;color:var(--muted)}
.med-board{display:flex;flex-direction:column;gap:8px}
.med-sub-head{
  display:flex;align-items:center;gap:7px;
  font-size:11px;letter-spacing:.06em;color:var(--muted);
  margin:14px 0 8px;padding-top:2px;
}
.med-sub-head:first-of-type,
.med-group-head + .med-sub-head{margin-top:2px}
.med-sub-head::after{content:"";flex:1;height:1px;background:var(--line)}
.med-sub-head i{font-style:normal;order:2;font-size:10.5px;color:color-mix(in srgb,var(--text) 62%,var(--muted))}

.med-row{
  display:grid;grid-template-columns:40px minmax(0,1fr) auto;
  gap:13px;align-items:start;
  padding:14px 16px;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow);
  transition:border-color .16s,box-shadow .16s;
}
.med-row:hover{border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
.med-row-ico{
  width:40px;height:40px;border-radius:12px;flex:none;
  display:grid;place-items:center;font-size:19px;
  background:var(--accent-soft);
}
.med-row-main{min-width:0}
.med-row-title b{font-size:15px;font-weight:600;letter-spacing:.01em}
/* 主信息：每天几次 / 每次几颗 / 餐前餐后多久 —— 这一行最该被看见的内容 */
.med-row-dose{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:0 5px;
  margin-top:5px;font-size:13px;line-height:1.6;color:var(--text);
}
.med-row-dose > b{font-weight:600;color:var(--text);letter-spacing:.01em}
.med-row-dose > span{font-size:11.5px;font-weight:400;color:var(--muted)}
.med-row-note{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.55}
.med-row-slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* 按需用药的行内记录：原先「＋ 记一次」只在用药弹层里，而弹层入口在排期药 ≥2 种时
   会被「查看详细」替换掉，导致按需药没有任何地方能记一次 */
.med-row-prn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.med-row-prn-cnt{font-size:11.5px;color:color-mix(in srgb,var(--text) 68%,var(--muted))}
.med-row-prn-cnt b{color:var(--text);font-weight:600}
.med-prn-add{
  font-family:var(--font-sans);font-size:12px;line-height:1.4;padding:4px 11px;border-radius:9px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line-strong));
  background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 70%,var(--text));
  transition:background .16s,border-color .16s,color .16s;
}
.med-prn-add:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.med-prn-undo{
  font-family:var(--font-sans);font-size:11.5px;line-height:1.4;padding:3px 9px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line-strong);background:transparent;color:color-mix(in srgb,var(--text) 76%,var(--muted));
}
.med-prn-undo:hover{color:var(--text);border-color:var(--accent)}
.med-slot{
  font-family:var(--font-sans);font-size:12px;letter-spacing:.02em;line-height:1.4;
  padding:4px 11px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);
  transition:border-color .16s,background .16s,color .16s;
}
.med-slot:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
.med-slot.done{
  background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 42%,transparent);
  color:var(--accent-strong);font-weight:600;
}
.med-slot.is-static{cursor:default;color:var(--muted);border-color:var(--line);background:var(--surface-2)}
.med-slot.is-static:hover{border-color:var(--line);color:var(--muted);background:var(--surface-2)}
.med-row-side{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:none}
.med-row-stock{font-size:11.5px;color:var(--muted);white-space:nowrap}
.med-row-ops{display:flex;gap:2px;opacity:.62;transition:opacity .16s}
.med-row:hover .med-row-ops,.med-row:focus-within .med-row-ops{opacity:1}
@media (max-width:700px){
  .med-row{grid-template-columns:34px minmax(0,1fr);gap:11px;padding:13px 14px}
  .med-row-ico{width:34px;height:34px;border-radius:10px;font-size:16px}
  .med-row-title b{font-size:14px}
  .med-row-dose{font-size:12.5px}
  .med-row-side{
    grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:8px;margin-top:2px;
  }
  .med-row-ops{opacity:1}
}
.dose-pair{display:flex;gap:6px}
.dose-pair input:first-child{width:72px;flex:none}
.dose-pair select{flex:1;min-width:0}
.med-stat{padding:10px 2px;border-bottom:1px solid var(--line)}
.med-stat:last-child{border-bottom:0}
.med-stat-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px;color:var(--text)}
.med-stat-head b{font-size:10.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.med-stat-bar{height:5px;border-radius:99px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.med-stat-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s ease}
.med-stat-sub{font-size:10px;color:var(--muted);margin-top:5px}
.med-form .hint{margin-top:12px}

/* ---------- 今日：近 7 天节奏 + 随记 ---------- */
.today-lower{
  display:grid;grid-template-columns:1.15fr .85fr;gap:18px;
  margin-top:0;align-items:stretch;
}
.today-rule{
  position:relative;height:1px;background:var(--line-strong);
  margin:48px 0 28px;
}
.today-rule::before{
  content:"";position:absolute;left:0;top:-1px;
  width:56px;height:2px;border-radius:2px;background:var(--gold);
}
.today-lower .panel{
  margin-bottom:0;display:flex;flex-direction:column;min-width:0;
}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head h3{margin-bottom:0}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;flex:1;min-height:112px}
.wk{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:8px 4px 6px;border-radius:11px;border:1px solid transparent;
  transition:background .15s,border-color .15s;
}
.wk:hover{background:var(--surface-2);border-color:var(--line)}
.wk.is-sel{background:var(--surface-2);border-color:var(--line-strong)}
.wk-wd{font-size:10px;color:var(--muted);letter-spacing:.06em}
.wk-track{
  flex:1;width:16px;min-height:58px;border-radius:6px;
  background:var(--surface-2);
  display:flex;align-items:flex-end;overflow:hidden;
}
.wk-track i{display:block;width:100%;border-radius:6px;background:var(--accent);opacity:.85;transition:height .3s ease}
.wk-track i.empty{background:var(--line-strong);opacity:.45}
.wk.is-sel .wk-track i{background:var(--gold);opacity:1}
.wk-num{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.wk.is-future{opacity:.35}
.week-foot{
  display:flex;gap:14px;flex-wrap:wrap;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);
}
.week-foot b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- 看板：第四列 + 取消态 ---------- */
.task.cancelled{background:var(--surface-2);opacity:.82}
.task.cancelled h4{text-decoration:line-through;color:var(--muted)}

/* ---------- 日历：视图 + 底部三卡 ----------
   原来右侧挂「本月习惯」「本月用药」再用 :nth-child 钉在 6 列网格上。
   那两个挪去统计页之后，这里不再需要定位技巧：上下两段，上面日历（月或周），
   下面三卡等宽横排。 */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.cal-layout .panel{margin-bottom:0}
.cal-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;min-width:0}
.cal-side-panel{padding:18px 20px;min-width:0;margin:0;
  display:flex;flex-direction:column;align-self:stretch}
.cal-side-panel > .cal-hint{margin-top:auto}
@media (max-width:1180px){
  .cal-cards{grid-template-columns:1fr 1fr}
  .cal-cards > .cal-side-panel:nth-child(3){grid-column:1/-1}
  .cal-grid{grid-auto-rows:minmax(92px,auto)}
}
@media (max-width:700px){
  .cal-cards{grid-template-columns:minmax(0,1fr)}
  .cal-cards > .cal-side-panel:nth-child(3){grid-column:auto}
}
.cal-highlight{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px}
.cal-highlight b{
  font-family:var(--font-serif);font-size:44px;font-weight:500;
  line-height:1;color:var(--accent);letter-spacing:-.02em;
}
.cal-highlight span{font-size:11px;color:var(--muted)}
.cal-note{font-size:11.5px;line-height:2;color:var(--muted)}
.cal-note b{color:var(--text);font-weight:600}
.cal-hint{font-size:10px;color:var(--muted);margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.mh{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.mh:first-child{padding-top:2px}
.mh:last-child{border-bottom:0;padding-bottom:0}
.mh-main{flex:1;min-width:0}
.mh-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mh-top b{font-size:12.5px;font-weight:600}
.mh-top span{font-size:9.5px;color:var(--muted);white-space:nowrap}
.mh-bar{height:4px;border-radius:99px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.mh-bar i{display:block;height:100%;border-radius:99px;background:var(--hc)}
.mh-extra{display:block;font-size:9.5px;color:var(--bad);margin-top:4px}
.mstat-list{display:flex;flex-direction:column;gap:12px}
.mstat{--mood:#8a8f83}
.mstat.sad{--mood:#9c5a5a}
.mstat.ok{--mood:#b8893b}
.mstat.happy{--mood:#2f7d5c}
.mstat-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text)}
.mstat-top b{font-size:10.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.mstat-bar{height:5px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.mstat-bar i{display:block;height:100%;border-radius:99px;background:var(--mood);transition:width .3s ease}

/* ---------- 深色模式细节 ---------- */
[data-theme="dark"] .habit-card{background:linear-gradient(180deg,#1c2620 0%,var(--surface) 62%)}
[data-theme="dark"] .habit-card.is-done{
  background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 18%,#16201b) 0%,var(--surface) 66%);
}
[data-theme="dark"] .tag{color:color-mix(in srgb,var(--tag) 42%,#fff)}
[data-theme="dark"] .prio{color:color-mix(in srgb,var(--prio) 45%,#fff)}
[data-theme="dark"] .task{border-left-color:color-mix(in srgb,var(--prio) 55%,#fff)}
[data-theme="dark"] .cal-cell[data-level="4"] .cal-num{color:var(--text)}
[data-theme="dark"] .vital-card{background:linear-gradient(180deg,#1c2620 0%,var(--surface) 62%)}
[data-theme="dark"] .vital-card.is-done{
  background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 16%,#1c2620) 0%,var(--surface) 66%);
}
[data-theme="dark"] .mood.sad{--mood:#d99a9a}
[data-theme="dark"] .mood.ok{--mood:#d7b169}
[data-theme="dark"] .mood.happy{--mood:#5fbf9c}

/* ---------- 响应式 ---------- */
@media (max-width:1280px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{
    padding:10px 14px;gap:10px;
    background:linear-gradient(180deg,#12362c 0%,#0d2a22 100%);
    border-right:0;border-bottom:1px solid rgba(246,240,227,.08);
    box-shadow:none;
  }
  .brand{padding:0;border-bottom:0}
  .logo{width:34px;height:34px;border-radius:11px}
  .nav{gap:2px}
  .nav-item{padding:7px 11px;font-size:12px;border-radius:8px}
  .nav-item.active{box-shadow:none}
  .main{padding:20px 15px 60px}
  .page-head h2{font-size:21px}
  .hero{padding:22px 22px 24px;border-radius:20px;align-items:flex-start;gap:14px}
  .hero::before{left:22px;right:22px}
  .hero h1{font-size:21px;margin-top:12px}
  .hero p{font-size:12px}
  .hero-ring{position:absolute;right:18px;top:18px;width:84px;height:84px}
  .hero-pct b{font-size:20px}
  .hero-main{padding-right:92px}
  .habit-grid{grid-template-columns:1fr}
  .board{grid-template-columns:1fr;gap:14px}
  .col-body{min-height:60px}
  .stat-grid{grid-template-columns:1fr 1fr;gap:12px}
  .stat-card{padding:15px 16px}
  .stat-card b{font-size:30px}
  .hstat{grid-template-columns:1fr auto;gap:8px 12px}
  .hstat-dots{grid-column:1/-1;max-width:240px;order:3}
  .form-grid{grid-template-columns:1fr}
  .cal-grid{gap:5px}
  .cal-wd-row{gap:5px}
  .cal-cell{height:58px;padding:7px 8px;border-radius:11px}
  .cal-pct{display:none}
  .cal-wd{font-size:9.5px;letter-spacing:.06em}
  .chart{height:140px}
  .section-head{margin:36px 0 16px;padding-top:22px}
  .today-rule{margin:36px 0 22px}
  .today-lower{grid-template-columns:1fr}
}
@media (max-width:560px){
  .sidebar{padding:8px 12px}
  .brand{display:none}
  .nav-item{padding:6px 9px;font-size:11.5px}
  .hero{padding:20px 18px 22px}
  .hero-main{padding-right:80px}
  .hero-ring{right:14px;top:14px}
  .hero-chips span{padding:4px 10px}
  .stat-grid{gap:10px}
  .stat-card{padding:14px}
  .stat-card b{font-size:26px}
  .task-row{padding:11px 12px}
  .cal-cell{height:52px;padding:6px 7px}
  .cal-num{font-size:11px}
  .cal-mood{font-size:11px}
  .cal-foot{min-height:12px}
  .month-nav b{min-width:100px;font-size:14px}
  .month-nav .arrow{width:30px;height:30px}
  .cal-cell.is-today::after{top:7px;right:7px;width:4px;height:4px}
  .hstat-name small{display:none}
  .section-head{margin:30px 0 14px;padding-top:18px}
  .today-rule{margin:30px 0 18px}
  .today-lower{gap:14px}
  .log-row{grid-template-columns:44px 24px minmax(0,1fr) auto;row-gap:2px;padding:9px 2px}
  .log-date{grid-column:3 / -1;text-align:left;font-size:9.5px}
  .week-strip{gap:4px;min-height:96px}
  .wk-track{width:14px;min-height:48px}
  .main{padding:16px 12px 54px}
}
@media (max-width:700px){
  .cal-side{grid-template-columns:1fr}
  .vital-grid{grid-template-columns:1fr}
}
</style>

  --hero-chip-bg:rgba(246,240,227,.05);--hero-chip-border:rgba(246,240,227,.12);--hero-chip-text:#cfdcd2;

  --card-top:#fffefa;--toast-bg:#16241e;--toast-text:#f4efe2;--gold-ink:#8a6524;
}
:root[data-skin="paper"][data-theme="dark"]{

  --side-border:rgba(246,240,227,.06);--side-line:rgba(246,240,227,.07);--side-shadow:rgba(0,0,0,.85);
  --side-text:#f2ecdf;--side-small:#8fa99b;--side-nav:#a9c2b4;
  --side-hover:rgba(246,240,227,.06);--side-active-bg:#f2ecdf;--side-active-text:#123a2f;
  --side-muted:#7f9a8c;--side-link:#9db5a8;--side-foot:#8aa294;

/* ===== 组件使用主题变量 ===== */
body{background:radial-gradient(1100px 500px at 92% -10%,var(--bg-glow) 0%,rgba(0,0,0,0) 62%),var(--bg)}
[data-theme="dark"] body{background:radial-gradient(900px 420px at 92% -10%,var(--bg-glow) 0%,rgba(0,0,0,0) 62%),var(--bg)}

.sidebar{
  background:
    radial-gradient(420px 320px at 8% 108%,var(--side-glow),rgba(0,0,0,0) 70%),
    linear-gradient(180deg,var(--side-bg) 0%,var(--side-bg-2) 100%);
  border-right:1px solid var(--side-border);
  box-shadow:10px 0 50px -38px var(--side-shadow);
}
.brand{border-bottom:1px solid var(--side-line)}
.logo{background:var(--logo-bg);border-color:var(--logo-border);color:var(--logo-color)}
.brand-text b{color:var(--side-text)}
.brand-text small{color:var(--side-small)}
.nav-item{color:var(--side-nav)}
.nav-item:hover{background:var(--side-hover);color:var(--side-text)}
.nav-item.active{background:var(--side-active-bg);color:var(--side-active-text)}
.side-foot{border-top:1px solid var(--side-line);color:var(--side-muted)}
.link-btn{color:var(--side-link)}
.link-btn:hover{color:var(--side-text)}
.side-foot span{color:var(--side-foot)}

.hero{
  background:
    radial-gradient(520px 240px at 86% 6%,var(--hero-glow),rgba(0,0,0,0) 68%),
    linear-gradient(135deg,var(--hero-bg) 0%,var(--hero-bg-2) 55%,var(--hero-bg-3) 100%);
  border-color:var(--hero-border);
  box-shadow:0 30px 60px -38px var(--hero-shadow),inset 0 1px 0 rgba(255,255,255,.05);
}
.hero::before{background:linear-gradient(90deg,rgba(0,0,0,0),var(--hero-line),rgba(0,0,0,0))}
.hero::after{background:radial-gradient(circle,var(--hero-glow),rgba(0,0,0,0) 66%)}
.hero-date{color:var(--hero-date)}
.hero-arrow{background:var(--hero-control-bg);border-color:var(--hero-control-border);color:var(--hero-control-text)}
.hero-arrow:hover{background:var(--hero-control-hover)}
.hero-tag{color:var(--hero-tag);border-color:var(--hero-tag-border);background:transparent}
.hero-today{color:var(--hero-control-text);border-color:var(--hero-control-border)}
.hero-today:hover{background:var(--hero-control-hover)}
.hero h1{color:var(--hero-text)}
.hero p{color:var(--hero-muted)}
.hero-chips span{background:var(--hero-chip-bg);border-color:var(--hero-chip-border);color:var(--hero-chip-text)}
.hero-pct b{color:var(--hero-text)}
.hero-pct small{color:var(--hero-muted)}
.hero-ring .ring circle:first-child{stroke:var(--hero-ring-track)}
.hero-ring .ring circle:last-child{stroke:var(--hero-ring)}

.habit-card{background:linear-gradient(180deg,var(--card-top) 0%,var(--surface) 62%)}
.habit-card.is-done{background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 8%,var(--card-top)) 0%,var(--surface) 66%)}
.vital-card{background:linear-gradient(180deg,var(--card-top) 0%,var(--surface) 62%)}
.vital-card.is-done{background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 7%,var(--card-top)) 0%,var(--surface) 66%)}
[data-theme="dark"] .habit-card{background:linear-gradient(180deg,var(--card-top) 0%,var(--surface) 62%)}
[data-theme="dark"] .habit-card.is-done{background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 16%,var(--card-top)) 0%,var(--surface) 66%)}
[data-theme="dark"] .vital-card{background:linear-gradient(180deg,var(--card-top) 0%,var(--surface) 62%)}
[data-theme="dark"] .vital-card.is-done{background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 16%,var(--card-top)) 0%,var(--surface) 66%)}

.toast{background:var(--toast-bg);color:var(--toast-text);border-color:color-mix(in srgb,var(--gold) 32%,transparent)}
.btn.primary{box-shadow:0 12px 26px -16px color-mix(in srgb,var(--accent) 55%,transparent)}
.vital-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pin-tag{color:color-mix(in srgb,var(--gold-ink) 68%,var(--text))}
.dose.next{color:var(--gold-ink)}
[data-theme="dark"] .pin-tag{color:var(--gold)}
[data-theme="dark"] .dose.next{color:var(--gold)}
[data-theme="dark"] .mstat.sad{--mood:#d99a9a}
[data-theme="dark"] .mstat.ok{--mood:#d7b169}
[data-theme="dark"] .mstat.happy{--mood:#5fbf9c}

/* 极简主题：更方的卡片 */
[data-skin="mono"] .hero,
[data-skin="mono"] .panel,
[data-skin="mono"] .habit-card,
[data-skin="mono"] .vital-card,
[data-skin="mono"] .task-row,
[data-skin="mono"] .task,
[data-skin="mono"] .stat-card,
[data-skin="mono"] .col,
[data-skin="mono"] .cal-cell,
[data-skin="mono"] .modal-card,
[data-skin="mono"] .theme-card{border-radius:12px}
[data-skin="mono"] .habit-bar{border-radius:0 0 12px 12px}
[data-skin="mono"] .btn,
[data-skin="mono"] .quick-add input,
[data-skin="mono"] .field input,
[data-skin="mono"] .field select,
[data-skin="mono"] .field textarea,
[data-skin="mono"] .nav-item{border-radius:8px}

/* ===== 设置：主题选择 ===== */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px;margin:14px 0 18px}
.theme-card{
  display:flex;flex-direction:column;gap:7px;
  padding:9px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);text-align:left;
  transition:border-color .15s,box-shadow .15s,transform .12s;
}
.theme-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-preview{
  display:flex;height:58px;border-radius:9px;overflow:hidden;
  background:var(--pv-bg);
