  /* ============================================================
     清债（v88 起）
     数据全在 state.money 一个子对象里，**不碰 habits / checks / tasks**，
     所以达成率、完成率、日历热力一律不会把它算进去。
     ============================================================ */

  function moneySeed() {
    return {
      v: 1,
      debts: [],
      /* 每月在最低还款之外多还的钱（加速钱） */
      extra: 0,
      strategy: 'snowball',
      customOrder: [],
      /* 一次性多还：年终奖、退税 */
      snowflakes: [],
      /* 计划起始月，空字符串 = 下个月 */
      startYM: '',
      log: [],
      incomes: [],
      cats: [],
      spends: [],
      /* v92 用，先占位。默认关闭，用户自己开 */
      notify: { on: false, before: [3, 1, 0], time: '09:00' }
    };
  }

  const MONEY_TYPES = [
    { key: 'card', label: '信用卡' },
    { key: 'loan', label: '网贷' },
    { key: 'friend', label: '亲友借款' },
    { key: 'other', label: '其他' }
  ];
  const MONEY_STRATEGIES = [
    { key: 'snowball', label: '雪球法', desc: '先还金额最小的，最快看到进展' },
    { key: 'avalanche', label: '雪崩法', desc: '先还利息最高的，总利息最少' },
    { key: 'custom', label: '自定义', desc: '自己排顺序' }
  ];
  /* 30 年还不够就不算了——数字再大也只是吓人，没有参考价值 */
  const MONEY_MAX_MONTHS = 360;

  function money() {
    const m = state.money;
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : moneySeed();
  }
  function moneyNum(v) {
    const n = Number(v);
    return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0;
  }
  function moneyList(k) {
    const v = money()[k];
    return Array.isArray(v) ? v : [];
  }
  function moneyTypeLabel(k) {
    const t = MONEY_TYPES.filter(function (x) { return x.key === k; })[0];
    return t ? t.label : '其他';
  }
  function moneyStrategyLabel(k) {
    const t = MONEY_STRATEGIES.filter(function (x) { return x.key === k; })[0];
    return t ? t.label : '雪球法';
  }
  /* 还在欠的债。余额 ≤ 0.01 视为还完（跟原版一致） */
  function moneyLive() {
    return moneyList('debts').filter(function (d) { return Number(d.balance) > 0.005; });
  }
  /* 某天是不是还款日。debts[].due 是「每月几号」，小月按月末算 ——
     跟后端 lb_schedule_debts、api/ics.php 必须同一口径，否则日历、订阅、
     企微提醒三处会对不上。 */
  function dayDebts(ds) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ds || ''))) return [];
    const d = parseD(ds);
    const dom = d.getDate();
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return moneyLive().filter(function (x) {
      const due = Math.round(Number(x.due));
      /* 0 / 空 = 没有具体还款日：不上日历 */
      if (!isFinite(due) || due < 1 || due > 31) return false;
      return Math.min(due, last) === dom;
    });
  }

  function moneyTotals() {
    let start = 0, left = 0;
    moneyList('debts').forEach(function (d) {
      const st = Number(d.start) || Number(d.balance) || 0;
      start += Math.max(0, st);
      left += Math.max(0, Number(d.balance) || 0);
    });
    return { start: start, left: left, paid: Math.max(0, start - left), n: moneyLive().length };
  }

  /* 月份工具（不带时分秒，避免夏令时那种坑） */
  function ymNow() {
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function ymAdd(ym, n) {
    const y = Number(String(ym).slice(0, 4));
    const m = Number(String(ym).slice(5, 7)) - 1 + n;
    const d = new Date(y, m, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function ymLabel(ym) {
    if (!/^\d{4}-\d{2}$/.test(String(ym || ''))) return '—';
    return Number(String(ym).slice(0, 4)) + ' 年 ' + Number(String(ym).slice(5, 7)) + ' 月';
  }
  /* 表格 / 对比表里用短格式：手机上「2028 年 5 月」会被挤成两行 */
  function ymShort(ym) {
    if (!/^\d{4}-\d{2}$/.test(String(ym || ''))) return '—';
    return String(ym).replace('-', '.');
  }

  /* 按 id 并集，**同一 id 取 u 更大的那份**。
     债、流水这类是可编辑实体，跟 packs 不一样——远端那份可能是旧的，
     直接 remote 优先会把本地刚改的余额吃掉。 */
  function mergeById(rm, lm) {
    const out = [];
    const pos = {};
    rm.forEach(function (x) {
      if (!x || !x.id) return;
      pos[x.id] = out.length;
      out.push(x);
    });
    lm.forEach(function (x) {
      if (!x || !x.id) return;
      if (pos[x.id] === undefined) { pos[x.id] = out.length; out.push(x); return; }
      const i = pos[x.id];
      if ((Number(x.u) || 0) > (Number(out[i].u) || 0)) out[i] = x;
    });
    return out;
  }

  function normalizeMoney(raw) {
    const out = moneySeed();
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    const arr = function (v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === 'object'; }) : []; };
    out.debts = arr(raw.debts).map(function (d) {
      const bal = moneyNum(d.balance);
      return {
        id: String(d.id || uid()),
        name: String(d.name || '').slice(0, 24),
        type: MONEY_TYPES.some(function (t) { return t.key === d.type; }) ? d.type : 'card',
        balance: bal,
        /* 初始额缺省就等于余额：老数据或手写 JSON 都能用 */
        start: moneyNum(d.start) || bal,
        apr: Math.min(200, Math.max(0, Number(d.apr) || 0)),
        min: Math.min(999999, Math.max(0, Number(d.min) || 0)),
        /* v110：0 = 没有具体还款日（不填或填 0）。以前缺省成 1 号，
           会把亲友借款这种「没约定哪天还」的债硬塞进每月 1 号的提醒与日历。 */
        due: (function (v) {
          const n = Math.round(Number(v));
          return isFinite(n) && n >= 1 && n <= 31 ? n : 0;
        })(d.due),
        note: String(d.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(d.u) || 0))
      };
    });
    out.log = arr(raw.log).map(function (x) {
      return {
        id: String(x.id || uid()), date: String(x.date || '').slice(0, 10),
        debtId: String(x.debtId || ''), debtName: String(x.debtName || '').slice(0, 24),
        amount: moneyNum(x.amount), note: String(x.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(x.u) || 0))
      };
    });
    out.snowflakes = arr(raw.snowflakes).map(function (x) {
      return {
        id: String(x.id || uid()), ym: /^\d{4}-\d{2}$/.test(String(x.ym || '')) ? x.ym : '',
        amount: moneyNum(x.amount), note: String(x.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(x.u) || 0))
      };
    });
    out.incomes = arr(raw.incomes).map(function (x) {
      return { id: String(x.id || uid()), name: String(x.name || '').slice(0, 20),
        amount: moneyNum(x.amount), u: Math.max(0, Math.round(Number(x.u) || 0)) };
    });
    out.cats = arr(raw.cats).map(function (x) {
      return { id: String(x.id || uid()), name: String(x.name || '').slice(0, 20),
        kind: x.kind === 'fixed' ? 'fixed' : 'daily', budget: moneyNum(x.budget),
        u: Math.max(0, Math.round(Number(x.u) || 0)) };
    });
    out.spends = arr(raw.spends).map(function (x) {
      return { id: String(x.id || uid()), date: String(x.date || '').slice(0, 10),
        catId: String(x.catId || ''), catName: String(x.catName || '').slice(0, 20),
        amount: moneyNum(x.amount), note: String(x.note || '').slice(0, 60),
        u: Math.max(0, Math.round(Number(x.u) || 0)) };
    });
    out.extra = moneyNum(raw.extra);
    out.strategy = MONEY_STRATEGIES.some(function (t) { return t.key === raw.strategy; })
      ? raw.strategy : 'snowball';
    out.customOrder = Array.isArray(raw.customOrder)
      ? raw.customOrder.map(String).filter(Boolean).slice(0, 60) : [];
    out.startYM = /^\d{4}-\d{2}$/.test(String(raw.startYM || '')) ? raw.startYM : '';
    const nt = (raw.notify && typeof raw.notify === 'object') ? raw.notify : {};
    out.notify = {
      on: !!nt.on,
      time: /^\d{2}:\d{2}$/.test(String(nt.time || '')) ? nt.time : '09:00',
      before: Array.isArray(nt.before)
        ? nt.before.map(function (x) { return Math.max(0, Math.round(Number(x) || 0)); }).slice(0, 5)
        : [3, 1, 0]
    };
    return out;
  }

  /* 策略只决定顺序，金额分配逻辑三套完全一样 */
  function moneyOrder(list, strat) {
    const arr = list.slice();
    if (strat === 'avalanche') {
      arr.sort(function (a, b) {
        return (Number(b.apr) || 0) - (Number(a.apr) || 0) ||
          (Number(a.balance) || 0) - (Number(b.balance) || 0);
      });
    } else if (strat === 'custom') {
      const pref = Array.isArray(money().customOrder) ? money().customOrder : [];
      arr.sort(function (a, b) {
        const ia = pref.indexOf(a.id), ib = pref.indexOf(b.id);
        return (ia < 0 ? 1e4 : ia) - (ib < 0 ? 1e4 : ib);
      });
    } else {
      arr.sort(function (a, b) {
        return (Number(a.balance) || 0) - (Number(b.balance) || 0) ||
          (Number(b.apr) || 0) - (Number(a.apr) || 0);
      });
    }
    return arr;
  }

  /* 逐月模拟。规则跟原版「还清日」一致：
     ① 每笔先计息（余额 × 年化 ÷ 12，四舍五入到分）
     ② 每笔各还最低还款（不超过余额）
     ③ 剩下的钱（加速钱 + 当月一次性多还）按策略顺序全砸第一笔，清掉后滚到下一笔
     最多算 360 个月。 */
  function moneySimulate(strat, detail, override) {
    const live = moneyLive();
    const total = live.reduce(function (a, d) { return a + (Number(d.balance) || 0); }, 0);
    const res = {
      done: true, months: 0, payoff: '', totalInt: 0, series: [Math.round(total * 100) / 100],
      monthlyMin: 0, monthly: 0, startYM: '', left: total, clearAt: {}
    };
    if (!live.length) return res;
    const order = moneyOrder(live, strat || money().strategy);
    const cur = order.map(function (d) { return Number(d.balance) || 0; });
    const apr = order.map(function (d) { return Math.max(0, Number(d.apr) || 0) / 100; });
    const min = order.map(function (d) { return Math.max(0, Number(d.min) || 0); });
    res.monthlyMin = Math.round(min.reduce(function (a, b) { return a + b; }, 0) * 100) / 100;
    /* override 只在「工具页算不加速要还多久」时用：传 0 = 假设一分加速钱都没有。
       不传就照旧读 state，现有调用一个都不用改。 */
    const extra = override === undefined
      ? Math.max(0, Number(money().extra) || 0)
      : Math.max(0, Number(override) || 0);
    res.monthly = Math.round((res.monthlyMin + extra) * 100) / 100;
    const start = /^\d{4}-\d{2}$/.test(String(money().startYM || ''))
      ? money().startYM : ymAdd(ymNow(), 1);
    res.startYM = start;
    /* 月供总额**在计划开始时就固定**：各笔最低还款之和 + 加速钱。
       某笔清掉后它不再吃钱，那份额自然留在预算里给下一笔 ——
       这才是「清掉一笔，它原来的月供自动加到下一笔上」。
       每月重新算 Σ最低 的话，清掉一笔预算就少一块，永远滚不起来。 */
    const base = res.monthlyMin + extra;
    let series = [Math.round(total * 100) / 100];
    let totalInt = 0;
    let m = 0;
    /* detail=true 时额外记按月明细，供「逐月还款表」用。
       默认不算——总览每次渲染都要跑一遍，多算这份纯浪费。 */
    const rows = detail ? [] : null;
    res.rows = rows;
    while (m < MONEY_MAX_MONTHS) {
      const ym = ymAdd(start, m);
      /* ① 计息 */
      for (let i = 0; i < cur.length; i++) {
        if (cur[i] <= 0.005) continue;
        const it = Math.round(cur[i] * apr[i] / 12 * 100) / 100;
        cur[i] = Math.round((cur[i] + it) * 100) / 100;
        totalInt = Math.round((totalInt + it) * 100) / 100;
      }
      /* ② 各还最低，累计本月已经花掉多少 */
      const paid = {};
      let spent = 0;
      for (let i = 0; i < cur.length; i++) {
        if (cur[i] <= 0.005) continue;
        const pay = Math.min(min[i], cur[i]);
        cur[i] = Math.round((cur[i] - pay) * 100) / 100;
        spent = Math.round((spent + pay) * 100) / 100;
        paid[order[i].id] = Math.round(((paid[order[i].id] || 0) + pay) * 100) / 100;
        if (cur[i] <= 0.005 && !res.clearAt[order[i].id]) res.clearAt[order[i].id] = ym;
      }
      /* ③ 预算里剩下的（含清账腾出来的份额 + 一次性多还）按顺序砸 */
      let pool = base;
      moneyList('snowflakes').forEach(function (sf) {
        if (sf.ym === ym) pool += Math.max(0, Number(sf.amount) || 0);
      });
      pool = Math.round((pool - spent) * 100) / 100;
      for (let i = 0; i < cur.length && pool > 0.005; i++) {
        if (cur[i] <= 0.005) continue;
        const pay = Math.min(pool, cur[i]);
        cur[i] = Math.round((cur[i] - pay) * 100) / 100;
        pool = Math.round((pool - pay) * 100) / 100;
        paid[order[i].id] = Math.round(((paid[order[i].id] || 0) + pay) * 100) / 100;
        if (cur[i] <= 0.005 && !res.clearAt[order[i].id]) res.clearAt[order[i].id] = ym;
      }
      let left = 0;
      for (let i = 0; i < cur.length; i++) if (cur[i] > 0.005) left += cur[i];
      left = Math.round(left * 100) / 100;
      series.push(left);
      if (rows) {
        rows.push({
          ym: ym,
          items: order.map(function (d, i) {
            return {
              id: d.id, name: d.name,
              pay: paid[d.id] || 0,
              after: cur[i] > 0.005 ? cur[i] : 0
            };
          }).filter(function (x) { return x.pay > 0.005; }),
          left: left
        });
      }
      m++;
      if (left <= 0.005) {
        res.done = true; res.months = m; res.payoff = ym; res.left = 0;
        break;
      }
      res.done = false; res.months = m; res.left = left;
      if (m >= MONEY_MAX_MONTHS) break;
    }
    res.totalInt = totalInt;
    res.series = series;
    return res;
  }

  /* ---------- 通用子页面（v88） ----------
     状态是模块级字典，**不进 state**：进了 state 就要改 normalizeState /
     mergeStates / repairBackup 三处，而且两端切换的子页不同会互相覆盖。
     别的页面想分子页，传 [{key,label,render}] 就行。 */
  const subTab = {};
  function subTabOf(pageKey, tabs) {
    const cur = subTab[pageKey];
    return tabs.some(function (t) { return t.key === cur; }) ? cur : (tabs[0] ? tabs[0].key : '');
  }
  function subTabsHtml(pageKey, tabs, cur) {
    return '<div class="stab subtab">' + tabs.map(function (t) {
      return '<button type="button" class="' + (t.key === cur ? 'on' : '') +
        '" data-act="subtab" data-page="' + pageKey + '" data-tab="' + t.key + '">' + t.label + '</button>';
    }).join('') + '</div>';
  }

  /* ---------- 清债页 ----------
     六个子页一次注册，但**只渲染做完了的那几个**（没有 v 字段 = 已就绪）。
     点进去一片空白比看不到更让人恼火，做完一版放出一版。 */
  const MONEY_TABS = [
    { key: 'overview', label: '总览' },
    { key: 'debts', label: '债务' },
    { key: 'budget', label: '预算' },
    { key: 'plan', label: '计划' },
    { key: 'log', label: '记录' },
    { key: 'tools', label: '工具' }
  ];

  function moneySubtitle() {
    const t = moneyTotals();
    if (!t.n) return '把每一笔债填进来，才能算出哪天还清。';
    const sim = moneySimulate(money().strategy);
    /* 不再用「X 万」：那是四舍五入的概览，跟 hero 里的精确数对不上。
       总欠款 hero 里已经有了，这里只说笔数 + 还清月份。 */
    if (!sim.done) return '共 ' + t.n + ' 笔 · 按当前计划 30 年也还不完';
    return '共 ' + t.n + ' 笔 · 按「' + moneyStrategyLabel(money().strategy) + '」' +
      ymLabel(sim.payoff) + '还清';
  }
  /* 金额显示。整数不补小数，有角分才补两位 ——
     以前一律 toFixed(0)，填 780.5 会显示成 781，账面差 5 毛。
     四舍五入到分再判断，避免 0.1+0.2 那种浮点尾巴把整数显示成 780.00。 */
  function moneyFmt(n) {
    const v = Math.round((Number(n) || 0) * 100) / 100;
    if (Math.abs(v % 1) < 0.005) return String(Math.round(v));
    return v.toFixed(2);
  }

  function moneyCurveSvg(series) {
    const W = 640, H = 132, L = 6, R = 6, T = 10, B = 16;
    const n = series.length;
    const max = Math.max.apply(null, series.concat([1]));
    const px = function (i) { return L + (n <= 1 ? 0 : i / (n - 1) * (W - L - R)); };
    const py = function (v) { return T + (1 - v / max) * (H - T - B); };
    let d = '';
    series.forEach(function (v, i) { d += (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1) + ' '; });
    const area = d + 'L' + px(n - 1).toFixed(1) + ' ' + py(0).toFixed(1) +
      ' L' + px(0).toFixed(1) + ' ' + py(0).toFixed(1) + ' Z';
    return '<svg class="money-curve" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="剩余欠款曲线">' +
      '<path class="mc-area" d="' + area + '"/>' +
      '<path class="mc-line" d="' + d + '"/></svg>';
  }

  function moneyOverviewView() {
    const t = moneyTotals();
    if (!t.n) {
      return '<div class="panel"><div class="empty-box">还没有债务。<br>' +
        '把每一笔填进来（剩多少、年化多少、每月最低还多少），才能算出还清日。<br><br>' +
        '<button type="button" class="btn primary" data-act="money-debt-new">记第一笔债</button></div></div>';
    }
    const sim = moneySimulate(money().strategy);
    const pct = t.start ? Math.min(100, Math.round(t.paid / t.start * 100)) : 0;
    const hero = '<div class="panel money-hero">' +
      '<small>预计还清</small>' +
      '<b class="mh-big">' + (sim.done ? ymLabel(sim.payoff) : '30 年内还不完') + '</b>' +
      '<span class="mh-sub">' + (sim.done
        ? '还要 ' + sim.months + ' 个月 · 利息合计 ¥' + moneyFmt(sim.totalInt)
        : '最低还款比利息还少，欠款会越滚越大，先提高月供或协商降息') + '</span>' +
      '<div class="mhc-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="money-kpi">' +
        '<span>总欠款<b>¥' + moneyFmt(t.left) + '</b></span>' +
        '<span>已还<b>¥' + moneyFmt(t.paid) + '</b></span>' +
        '<span>每月还款<b>¥' + moneyFmt(sim.monthly) + '</b></span>' +
      '</div>' +
    '</div>';
    const curve = '<div class="panel"><h3>剩余欠款 <span class="muted-sm">（按当前计划，' +
      (sim.series.length - 1) + ' 个月归零）</span></h3>' +
      moneyCurveSvg(sim.series) +
      '<p class="hint">横轴是月份，纵轴是当月还款后还剩多少。加速钱和一次性多还会让曲线掉得更快。</p></div>';
    /* 按模拟出来的清账月份排——这才是「先还哪笔」，
       按金额排会跟标题打架（小额先清，列在前面） */
    const list = moneyLive().slice().sort(function (a, b) {
      return String(sim.clearAt[a.id] || '9999-99').localeCompare(String(sim.clearAt[b.id] || '9999-99'));
    }).map(function (d) {
      const clear = sim.clearAt[d.id];
      return '<div class="mrow">' +
        '<span class="mrow-name">' + esc(d.name || '未命名') + '</span>' +
        '<span class="mrow-num">¥' + moneyFmt(d.balance) + '</span>' +
        '<span class="mrow-at">' + (clear ? ymLabel(clear) : '30 年内') + '</span>' +
      '</div>';
    }).join('');
    const order = '<div class="panel"><h3>还款顺序 <span class="muted-sm">（' +
      moneyStrategyLabel(money().strategy) + '）</span></h3>' +
      '<div class="mlist">' + list + '</div>' +
      '<p class="hint">顺序在「计划」页切换。清掉一笔后，它原来的月供会自动加到下一笔上。</p></div>';
    /* 动线：先看结论（哪天还完）→ 再看先还哪笔（可执行）→ 最后看曲线（趋势参考）。
       曲线原来夹在中间，把「看结论 → 看行动」的视线打断了。 */
    return hero + order + curve;
  }

  function moneyDebtsView() {
    const all = moneyList('debts');
    if (!all.length) {
      return '<div class="panel"><div class="empty-box">还没有债务。' +
        '<div class="btn-row" style="justify-content:center;margin-top:12px">' +
        '<button type="button" class="btn primary" data-act="money-debt-new">记第一笔债</button></div></div></div>';
    }
    const live = all.filter(function (d) { return Number(d.balance) > 0.005; });
    const done = all.filter(function (d) { return Number(d.balance) <= 0.005; });
    const row = function (d, closed) {
      const st = Number(d.start) || Number(d.balance) || 0;
      const bal = Math.max(0, Number(d.balance) || 0);
      const paid = Math.max(0, st - bal);
      /* 已还清的直接给 100%：余额已归零，再按比例算会被浮点尾巴写成 99% */
      const pct = closed ? 100 : (st ? Math.min(100, Math.round(paid / st * 100)) : 0);
      return '<div class="mdebt' + (closed ? ' closed' : '') + '">' +
        '<div class="mdebt-top"><b>' + esc(d.name || '未命名') + '</b>' +
          '<span class="mdebt-tag">' + moneyTypeLabel(d.type) + '</span></div>' +
        /* 备注以前只在弹窗里看得到，列表里填了也看不见（v110） */
        (d.note ? '<div class="mdebt-note"><i>备注</i><span>' + esc(d.note) + '</span></div>' : '') +
        '<div class="mdebt-num"><b>¥' + moneyFmt(d.balance) + '</b>' +
          '<span>年化 ' + (Number(d.apr) || 0) + '% · 月还 ¥' + moneyFmt(d.min) +
          (Number(d.due) > 0 ? ' · 每月 ' + d.due + ' 日' : '') + '</span></div>' +
        '<div class="mdebt-bar-row">' +
          '<div class="mdebt-bar"><i style="width:' + pct + '%"></i></div>' +
          '<b class="mdebt-pct">' + (closed ? '已还清' : '已完成 ' + pct + '%') + '</b>' +
        '</div>' +
        '<div class="mdebt-paid"><span>当前已还 ¥' + moneyFmt(paid) + '</span>' +
          (closed ? '' : '<span>还剩 ¥' + moneyFmt(bal) + '</span>') + '</div>' +
        '<div class="mdebt-acts">' +
          '<button type="button" class="btn sm" data-act="money-debt-edit" data-id="' + esc(d.id) + '">编辑</button>' +
          '<button type="button" class="btn sm danger-red" data-act="money-debt-del" data-id="' + esc(d.id) + '">删除</button>' +
        '</div>' +
      '</div>';
    };
    return '<div class="panel"><h3>还在还 <span class="muted-sm">（' + live.length + ' 笔）</span></h3>' +
      '<div class="mdebt-list">' + (live.map(function (d) { return row(d, false); }).join('') ||
        '<div class="empty-box">全部还清了。</div>') + '</div></div>' +
      (done.length
        ? '<div class="panel"><h3>已还清 <span class="muted-sm">（' + done.length + ' 笔）</span></h3>' +
          '<div class="mdebt-list">' + done.map(function (d) { return row(d, true); }).join('') + '</div></div>'
        : '') +
      moneyDebtsSummaryHtml(live, done);
  }

  /* 页底汇总（v111）。口径跟总览 hero 一致：分母是**初始总额**，不另算一套；
     平均年化按余额加权 —— 小额高息不能跟大额低息平均成一个假数。 */
  function moneyDebtsSummaryHtml(live, done) {
    const t = moneyTotals();
    const pct = t.start ? Math.min(100, Math.round(t.paid / t.start * 100)) : 0;
    const minSum = live.reduce(function (a, d) { return a + Math.max(0, Number(d.min) || 0); }, 0);
    const balSum = live.reduce(function (a, d) { return a + Math.max(0, Number(d.balance) || 0); }, 0);
    const aprSum = live.reduce(function (a, d) {
      return a + Math.max(0, Number(d.apr) || 0) * Math.max(0, Number(d.balance) || 0);
    }, 0);
    const aprAvg = balSum > 0 ? Math.round(aprSum / balSum * 10) / 10 : 0;
    const cell = function (label, val) {
      return '<div><span>' + label + '</span><b>' + val + '</b></div>';
    };

        cell('当前总已还', '¥' + moneyFmt(t.paid)) +

        cell('每月最低合计', '¥' + moneyFmt(minSum)) +

  /* ---------- 计划 ---------- */
  /* 逐月表默认折叠，只露 6 行预览。24 行就有 860px，
     加上计划页上面四块，页面直接被拉到 3 屏。
     状态放模块级变量，**不进 state**：进了就要改三处，两端还会互相覆盖。 */
  let moneyPlanOpen = false;
  const MONEY_TABLE_PREVIEW = 6;

  function moneyPlanView() {
    const live = moneyLive();
    if (!live.length) {
      return '<div class="panel"><div class="empty-box">还没有债务，先去「债务」记几笔。</div></div>';
    }

    const strat = '<div class="panel"><h3>还款策略</h3>' +
      '<div class="mstrat">' + MONEY_STRATEGIES.map(function (t) {

        return '<button type="button" class="mstart' + (on ? ' on' : '') +
          '" data-act="money-strategy" data-key="' + t.key + '">' +
          '<b>' + t.label + '</b><span>' + t.desc + '</span></button>';
      }).join('') + '</div>' +
      (money().strategy === 'custom' ? moneyCustomOrderHtml() : '') +
      '<p class="hint">换策略只会改变「先还哪笔」，不会改变每月总额。</p></div>';

    /* 别叫 money：函数作用域里再声明同名 const，前面调用 money() 会直接 TDZ 报错 */
    const extraPanel = '<div class="panel"><h3>每月额度</h3>' +
      '<div class="mfield">' +
        '<span>加速钱</span>' +
        '<input type="number" id="money-extra" min="0" step="0.01" value="' + extra + '">' +
        '<span class="mfield-sub">元 / 月</span>' +
        '<button type="button" class="btn sm" data-act="money-extra-save">保存</button>' +
      '</div>' +
      '<p class="hint">最低还款之外每月还能多还的钱。填 0 就只按最低还款走。' +
        '现在是每月 <b>¥' + moneyFmt(sim.monthly) + '</b>（最低 ' + moneyFmt(sim.monthlyMin) +
        ' + 加速 ' + moneyFmt(extra) + '）。</p></div>';

    const snow = '<div class="panel"><h3>一次性多还 <span class="muted-sm">（年终奖、退税这类）</span></h3>' +
      '<div class="msnow-list">' + (moneyList('snowflakes').slice().sort(function (a, b) {
        return String(a.ym).localeCompare(String(b.ym));
      }).map(function (x) {
        return '<div class="msnow"><b>' + ymLabel(x.ym) + '</b>' +
          '<span>¥' + moneyFmt(x.amount) + (x.note ? ' · ' + esc(x.note) : '') + '</span>' +
          '<button type="button" class="icon-btn" data-act="money-snow-del" data-id="' + esc(x.id) + '" title="删除">✕</button>' +
        '</div>';
      }).join('') || '<div class="muted-sm">还没有。加一笔，看看能提前几个月还完。</div>') + '</div>' +
      '<div class="btn-row" style="margin-top:12px">' +
        '<button type="button" class="btn sm" data-act="money-snow-new">加一笔多还</button></div></div>';

    return extraPanel + strat + moneyCompareHtml() + moneyTableHtml() + snow;
  }

  /* 自定义顺序：只有选了「自定义」才显示，↑↓ 调 */
  function moneyCustomOrderHtml() {
    const list = moneyOrder(moneyLive(), 'custom');
    const rows = list.map(function (d, i) {
      const btn = function (dir, off) {
        return '<button type="button" class="icon-btn"' + (off ? ' disabled' : '') +
          ' data-act="money-order-move" data-id="' + esc(d.id) + '" data-dir="' + dir + '">' +
          (dir < 0 ? '↑' : '↓') + '</button>';
      };
      return '<div class="msnow"><b>' + (i + 1) + '. ' + esc(d.name) + '</b>' +
        '<span>¥' + moneyFmt(d.balance) + '</span>' +
        '<span class="msnow-move">' + btn(-1, i === 0) + btn(1, i === list.length - 1) + '</span></div>';
    }).join('');
    return '<div class="msnow-list" style="margin-top:10px">' + rows + '</div>';
  }

  /* 三种办法并排对比：还清日 / 总利息 / 第一笔什么时候清掉 */
  function moneyCompareHtml() {
    const list = MONEY_STRATEGIES.map(function (t) {
      const sim = moneySimulate(t.key);
      const first = moneyLive().slice().sort(function (a, b) {
        return String(sim.clearAt[a.id] || '9999-99').localeCompare(String(sim.clearAt[b.id] || '9999-99'));
      })[0];
      return {
        key: t.key, label: t.label, done: sim.done, months: sim.months,
        payoff: sim.payoff, int: sim.totalInt,
        firstAt: first ? (sim.clearAt[first.id] || '') : ''
      };
    });
    const ok = list.filter(function (x) { return x.done; });
    const bestInt = ok.length ? Math.min.apply(null, ok.map(function (x) { return x.int; })) : null;
    const firsts = list.filter(function (x) { return x.firstAt; }).map(function (x) { return x.firstAt; }).sort();
    const firstBest = firsts.length ? firsts[0] : '';
    const row = function (x) {
      const tags = [];
      if (x.done && x.int === bestInt && ok.length > 1) tags.push('最省利息');
      if (x.firstAt && x.firstAt === firstBest && list.length > 1) tags.push('最快清掉第一笔');
      if (money().strategy === x.key) tags.push('当前');
      return '<div class="mcmp-row' + (money().strategy === x.key ? ' on' : '') + '">' +
        '<span class="mcmp-name">' + x.label + (tags.length
          ? '<i>' + tags.join(' · ') + '</i>' : '') + '</span>' +
        '<span class="mcmp-cell">' + (x.done ? ymShort(x.payoff) : '30 年内还不完') + '</span>' +
        '<span class="mcmp-cell">¥' + moneyFmt(x.int) + '</span>' +
        '<span class="mcmp-cell">' + (x.firstAt ? ymShort(x.firstAt) : '—') + '</span>' +
      '</div>';
    };
    return '<div class="panel"><h3>三种办法对比</h3>' +
      '<div class="mcmp">' +
        '<div class="mcmp-row head"><span class="mcmp-name">办法</span>' +
          '<span class="mcmp-cell">还清日</span><span class="mcmp-cell">总利息</span>' +
          '<span class="mcmp-cell">第一笔清掉</span></div>' +
        list.map(row).join('') +
      '</div>' +
      '<p class="hint">日期是「年.月」。同样的钱，雪崩法总利息最少；雪球法最早清掉一笔，看着有劲。' +
      '「自定义」按你自己排的顺序走。</p></div>';
  }

  /* 逐月还款表 */
  function moneyTableHtml() {
    const sim = moneySimulate(money().strategy, true);
    const rows = sim.rows || [];
    if (!rows.length) return '';
    const show = moneyPlanOpen ? rows : rows.slice(0, MONEY_TABLE_PREVIEW);
    const body = show.map(function (r) {
      const det = r.items.map(function (x) {
        return '<span class="mtag">' + esc(x.name) + ' ¥' + moneyFmt(x.pay) + '</span>';
      }).join('');
      return '<div class="mtr">' +
        '<span class="mtr-ym">' + r.ym.slice(2).replace('-', '/') + '</span>' +
        '<span class="mtr-det">' + det + '</span>' +
        '<span class="mtr-left">剩 ¥' + moneyFmt(r.left) + '</span>' +
      '</div>';
    }).join('');
    const toggle = rows.length > MONEY_TABLE_PREVIEW
      ? '<button type="button" class="btn sm" data-act="money-plan-toggle">' +
        (moneyPlanOpen ? '收起' : '展开 ' + rows.length + ' 个月') + '</button>'
      : '';
    return '<div class="panel">' +
      '<div class="mhead-row"><h3>逐月还款表 <span class="muted-sm">（共 ' +
        rows.length + ' 个月）</span></h3>' + toggle + '</div>' +
      '<div class="mtable">' + body + '</div>' +
      (toggle && !moneyPlanOpen
        ? '<p class="hint">只显示了前 ' + MONEY_TABLE_PREVIEW + ' 个月，点右上角展开全部。</p>'
        : '') +
      '</div>';
  }

  /* ---------- 记录 ---------- */
  /* ---------- 预算（v90） ----------
     口径说明（页面小字上也要写）：
     · 固定开支 / 日常预算都是**每月额度**，不是本月实际
     · 「每日可花」只算日常类，固定开支（房租水电）不参与按天摊
     · 剩余 = 收入 - 固定 - 日常 - 债务月供，可以是负数 */
  let moneySpendYM = '';
  function moneySpendMonth() {
    return /^\d{4}-\d{2}$/.test(String(moneySpendYM || '')) ? moneySpendYM : ymNow();
  }
  function moneyCats(kind) {
    const list = moneyList('cats');
    return kind ? list.filter(function (c) { return c.kind === kind; }) : list;
  }
  function moneySum(list, key) {
    return Math.round(list.reduce(function (a, x) {
      return a + (Number(x[key]) || 0);
    }, 0) * 100) / 100;
  }
  function moneyBudgetSplit() {
    const income = moneySum(moneyList('incomes'), 'amount');
    const fixed = moneySum(moneyCats('fixed'), 'budget');
    const daily = moneySum(moneyCats('daily'), 'budget');
    const sim = moneySimulate(money().strategy, false);
    const debt = moneyLive().length ? (Number(sim.monthly) || 0) : 0;
    return {
      income: income, fixed: fixed, daily: daily, debt: debt,
      rest: Math.round((income - fixed - daily - debt) * 100) / 100
    };
  }
  /* 本月日常类已花。分类被删掉的流水按「日常」算——
     钱已经花出去了，不能因为它挂的分类不存在就从账上消失。 */
  function moneyDailySpentThisMonth() {
    const ym = ymNow();
    const dailyIds = moneyCats('daily').map(function (c) { return c.id; });
    return Math.round(moneyList('spends').filter(function (x) {
      if (String(x.date).slice(0, 7) !== ym) return false;
      const c = moneyCats().filter(function (y) { return y.id === x.catId; })[0];
      return c ? c.kind === 'daily' : (dailyIds.indexOf(x.catId) >= 0 || !x.catId);
    }).reduce(function (a, x) { return a + (Number(x.amount) || 0); }, 0) * 100) / 100;
  }
  function moneyDailyLeft() {
    const now = new Date();
    const y = now.getFullYear(), mo = now.getMonth();
    const days = new Date(y, mo + 1, 0).getDate();
    const restDays = Math.max(1, days - now.getDate() + 1);
    const budget = moneySum(moneyCats('daily'), 'budget');
    const spent = moneyDailySpentThisMonth();
    const left = Math.round((budget - spent) * 100) / 100;
    return {
      budget: budget, spent: spent, left: left, rest: restDays,
      perDay: Math.round(left / restDays * 100) / 100,
      pct: budget > 0 ? Math.min(100, Math.round(spent / budget * 100)) : 0
    };
  }

  function moneyBudgetView() {
    const sp = moneyBudgetSplit();
    const dl = moneyDailyLeft();
    const total = Math.max(0.01, Math.max(sp.income, sp.fixed + sp.daily + sp.debt));
    const w = function (n) {
      return Math.max(0, Math.round(Math.max(0, n) / total * 1000) / 10);
    };

    const head = '<div class="panel"><h3>这个月怎么分 ' +
      '<span class="muted-sm">（按已填的收入与每月预算）</span></h3>' +
      (sp.income > 0 ? (
        '<div class="mbud-bar">' +
          '<i class="b1" style="width:' + w(sp.fixed) + '%"></i>' +
          '<i class="b2" style="width:' + w(sp.daily) + '%"></i>' +
          '<i class="b3" style="width:' + w(sp.debt) + '%"></i>' +
          '<i class="b4" style="width:' + w(sp.rest) + '%"></i>' +
        '</div>' +
        '<div class="mbud-legend">' +
          '<div class="mbud-li"><i class="mbud-dot d1"></i><span>固定开支</span><b>¥' +
            moneyFmt(sp.fixed) + '</b></div>' +
          '<div class="mbud-li"><i class="mbud-dot d2"></i><span>日常预算</span><b>¥' +
            moneyFmt(sp.daily) + '</b></div>' +
          '<div class="mbud-li"><i class="mbud-dot d3"></i><span>债务月供</span><b>¥' +
            moneyFmt(sp.debt) + '</b></div>' +
          '<div class="mbud-li"><i class="mbud-dot d4"></i><span>剩余可支配</span><b>¥' +
            moneyFmt(sp.rest) + '</b></div>' +
        '</div>' +
        '<div class="mbud-net">' +
          '<span>' + (sp.rest >= 0 ? '每月还能剩' : '每月还差') + '</span>' +
          '<b>¥' + moneyFmt(Math.abs(sp.rest)) + '</b>' +
          '<small>收入 ¥' + moneyFmt(sp.income) + ' − 固定 ¥' + moneyFmt(sp.fixed) +
            ' − 日常 ¥' + moneyFmt(sp.daily) + ' − 月供 ¥' + moneyFmt(sp.debt) + '</small>' +
        '</div>'
      ) : '<div class="empty-box">先填一下每月收入，才能算「钱怎么分」。' +
          '点右上角「添加收入」。</div>') +
      '</div>';

    const daily = '<div class="panel"><h3>今天还能花 ' +
      '<span class="muted-sm">（只算日常类，不含固定开支）</span></h3>' +
      (dl.budget > 0 ? (
        '<div class="mdaily"><b>¥' + moneyFmt(dl.perDay) + '</b>' +
          '<span>今天 / 之后每天</span></div>' +
        '<div class="mdaily-bar"><i style="width:' + dl.pct + '%"></i></div>' +
        '<div class="msum"><span>日常预算 <b>¥' + moneyFmt(dl.budget) + '</b></span>' +
          '<span>本月已花 <b>¥' + moneyFmt(dl.spent) + '</b></span>' +
          '<span>本月还剩 <b>' + dl.rest + '</b> 天</span>' +
          '<span>结余 <b>¥' + moneyFmt(dl.left) + '</b></span></div>'
      ) : '<div class="empty-box">还没有日常类预算。加一个「吃饭」「交通」这样的分类，' +
          '才会算每日可花。点右上角「添加分类预算」。</div>') +
      '</div>';

    const incs = moneyList('incomes');
    const income = '<div class="panel"><h3>收入 <span class="muted-sm">（每月，税后到手）</span></h3>' +
      (incs.length ? '<div class="mlist">' + incs.map(function (x) {
        return '<div class="minc">' +
          '<span class="minc-name">' + esc(x.name) + '</span>' +
          '<span class="minc-amt">¥' + moneyFmt(x.amount) + '</span>' +
          '<button type="button" class="btn sm" data-act="money-income-del" data-id="' +
            esc(x.id) + '">删除</button>' +
        '</div>';
      }).join('') + '</div>' : '<div class="empty-box">还没有填收入。</div>') +
      (incs.length ? '<div class="btn-row" style="margin-top:12px"><span class="spacer"></span>' +
        '<span class="muted-sm">合计 ¥' + moneyFmt(sp.income) + '</span></div>' : '') +
      '</div>';

    const cats = moneyCats();
    const catPanel = '<div class="panel"><h3>开支预算 ' +
      '<span class="muted-sm">（每月额度，不是本月实际）</span></h3>' +
      (cats.length ? '<div class="mlist">' + cats.map(function (c) {
        return '<div class="mcat">' +
          '<span class="mcat-name">' + esc(c.name) + '</span>' +
          '<span class="mdebt-tag">' + (c.kind === 'fixed' ? '固定' : '日常') + '</span>' +
          '<span class="mcat-bud">¥' + moneyFmt(c.budget) + '</span>' +
          '<button type="button" class="btn sm" data-act="money-cat-del" data-id="' +
            esc(c.id) + '">删除</button>' +
        '</div>';
      }).join('') + '</div>' : '<div class="empty-box">还没有分类预算。' +
        '固定＝房租水电这类雷打不动的；日常＝吃饭交通这类按天摊的。点右上角「添加分类预算」。</div>') +
      (cats.length ? '<div class="btn-row" style="margin-top:12px"><span class="spacer"></span>' +
        '<span class="muted-sm">固定 ¥' + moneyFmt(sp.fixed) + ' · 日常 ¥' +
        moneyFmt(sp.daily) + '</span></div>' : '') +
      '</div>';

    /* 流水按查看月份取；默认本月。只渲染当月，历史翻月看——
       spends 会一直长，全铺出来手机要滑很久。 */
    const ym = moneySpendMonth();
    const rows = moneyList('spends').filter(function (x) {
      return String(x.date).slice(0, 7) === ym;
    }).sort(function (a, b) {
      return String(b.date).localeCompare(String(a.date)) || (Number(b.u) || 0) - (Number(a.u) || 0);
    });
    const spentSum = moneySum(rows, 'amount');
    const spendPanel = '<div class="panel"><h3>开销流水</h3>' +
      '<div class="mym">' +
        '<button type="button" class="btn sm" data-act="money-spend-ym" data-dir="-1">上月</button>' +
        '<b>' + ymShort(ym) + '</b>' +
        '<button type="button" class="btn sm" data-act="money-spend-ym" data-dir="1">下月</button>' +
        '<span class="spacer"></span>' +
      '</div>' +
      (rows.length ? '<div class="mlist">' + rows.map(function (x) {
        return '<div class="mspend">' +
          '<span class="mspend-date">' + esc(String(x.date).slice(5)) + '</span>' +
          '<span class="mspend-cat">' + esc(x.catName || '未分类') + '</span>' +
          '<span class="mspend-amt">¥' + moneyFmt(x.amount) + '</span>' +
          '<button type="button" class="btn sm" data-act="money-spend-del" data-id="' +
            esc(x.id) + '">删除</button>' +
        '</div>';
      }).join('') + '</div>' : '<div class="empty-box">这个月还没有记开销。' +
        '点右上角「记一笔开销」。</div>') +
      (rows.length ? '<div class="msum"><span>共 <b>' + rows.length + '</b> 笔</span>' +
        '<span>合计 <b>¥' + moneyFmt(spentSum) + '</b></span></div>' : '') +
      '</div>';

    return head + daily + income + catPanel + spendPanel;
  }

  function saveMoneyCat(form) {

    };
    const name = get('name').slice(0, 20);

  /* ---------- 工具（v91） ---------- */
  /* 两个计算器都是「输入 → 点按钮算 → 结果显示在页面上」，
     不做实时联动：全量重绘的页面里，input 事件一触发就重新渲染，焦点会丢。 */
  let moneyRateApr = 18;
  let moneyLoanTry = { cash: 10000, pay: 1000, n: 12 };

  /* 月息几分：1 分 = 1% 月息，1 厘 = 0.1% */
  function moneyRateWords(apr) {
    const m = apr / 12;
    if (!(m > 0)) return '0';
    return m >= 1 ? (Math.round(m * 10) / 10) + ' 分' : (Math.round(m * 100) / 100 * 10) + ' 厘';
  }

  /* 真实年化：借 cash，每月还 pay，还 n 期。
     二分求月利率让「未来还款的现值 = 到手金额」，再乘 12。
     这比「利息 ÷ 本金」准得多——后者会把「先扣手续费」那种贷款算便宜一半。 */
  function moneyAprOf(cash, pay, n) {
    if (!(cash > 0) || !(pay > 0) || !(n > 0)) return 0;
    if (pay * n <= cash) return 0;
    let lo = 0, hi = 1;
    for (let i = 0; i < 80; i++) {
      const mid = (lo + hi) / 2;
      let pv = 0;
      for (let k = 1; k <= n; k++) pv += pay / Math.pow(1 + mid, k);
      if (pv > cash) lo = mid; else hi = mid;
    }
    return Math.round((lo + hi) / 2 * 1200 * 10) / 10;
  }

  function moneyRiskRows() {
    const rows = [];
    const live = moneyLive();
    const sp = moneyBudgetSplit();
    const sim = moneySimulate(money().strategy, false);
    const noExtra = moneySimulate(money().strategy, false, 0);

    const hi = live.filter(function (d) { return (Number(d.apr) || 0) >= 15; })
      .sort(function (a, b) { return (Number(b.apr) || 0) - (Number(a.apr) || 0); });
    if (hi.length) {
      rows.push({ warn: true, t: hi.length + ' 笔债年化超过 15%',
        d: '最高是「' + hi[0].name + '」' + (Number(hi[0].apr) || 0) + '%。' +
           '同样的钱先砸最高息那笔（雪崩法），总利息最少。' });
    } else if (live.length) {
      rows.push({ warn: false, t: '没有高息债',
        d: '所有债年化都在 15% 以下，先还哪笔差别不大，按雪球法图个痛快也行。' });
    }

    if (sp.debt > 0 && sp.income > 0) {
      const pct = Math.round(sp.debt / sp.income * 100);
      rows.push({ warn: pct > 40, t: '月供占收入 ' + pct + '%',
        d: pct > 40
          ? '超过 40% 了，日子会很紧。先看能不能把高息那笔换成低息的，' +
            '或者把加速钱压一压换口气——撑不住的时候，少还一点比断了强。'
          : '还在 40% 以内，属于能扛的范围。' });
    }

    if (live.length && (Number(money().extra) > 0) && noExtra.months > sim.months) {
      rows.push({ warn: false,
        t: '加速钱让你早 ' + (noExtra.months - sim.months) + ' 个月还完',
        d: '只还最低要 ' + noExtra.months + ' 个月，现在每月多还 ¥' +
           moneyFmt(money().extra) + '，' + sim.months + ' 个月就清了。' });
    } else if (live.length && !(Number(money().extra) > 0)) {
      rows.push({ warn: false, t: '还没设加速钱',
        d: '加速钱是每月在最低还款之外多还的部分。哪怕只填 200，还清日都会明显提前。' });
    }

    if (sp.income > 0 && sp.rest < 0) {
      rows.push({ warn: true, t: '每月缺口 ¥' + moneyFmt(Math.abs(sp.rest)),
        d: '固定开支 + 日常预算 + 月供已经超过收入。要么减预算，要么加收入，' +
           '不然迟早要借新钱——以贷养贷是滚起来最快的那种。' });
    } else if (sp.income > 0) {
      rows.push({ warn: false, t: '每月还能剩 ¥' + moneyFmt(sp.rest),
        d: '建议先留够 1 个月开销当应急金，剩下的再拿去加速还款。' });
    }
    return rows;
  }

          tr('<b>预算</b>', '收入明细、分类预算（固定 / 日常）、今天还能花、开销流水（可翻月）') +
          tr('<b>计划</b>', '加速钱、三种策略切换、三办法对比、逐月还款表、一次性多还') +
          tr('<b>记录</b>', '记一笔还款（余额自动减）、历史、撤销') +
          tr('<b>工具</b>', '利率换算、真实年化、风险体检、还款提醒') +
        '</table>' +

        '<h4 class="algo-h">二、还清日是怎么算出来的</h4>' +
        '<p class="algo-p">从「起始月」开始，一个月一个月往后推，每个月做三件事：</p>' +
        '<p class="algo-p"><b>① 先计息</b>：每笔余额 × 年化 ÷ 12，四舍五入到分。' +
          '没有利息的债（亲友借款）这里就是 0。</p>' +
        '<p class="algo-p"><b>② 各还最低</b>：每笔还 <code>min(最低还款, 当前余额)</code>，' +
          '不会还成负数。</p>' +
        '<p class="algo-p"><b>③ 剩下的钱全砸第一笔</b>：按策略顺序，' +
          '把「本月总额 − 已还最低」剩下的部分一次性砸向排最前面的那笔。' +
          '砸清后<b>它原来的月供份额留在池子里</b>，继续砸下一笔。</p>' +
        '<p class="algo-formula">余额全部归零的那个月 = 还清日</p>' +
        '<p class="algo-p">最多算 360 个月（30 年）。算不完就写「30 年也还不完」，' +
          '这时候要么加加速钱，要么先处理高息那笔。</p>' +

        '<h4 class="algo-h">三、三种策略的差别只在「顺序」</h4>' +
        '<table class="sum-table algo-table">' +
          '<tr><th>策略</th><th>排序</th><th>适合</th></tr>' +
          tr('<b>雪球法</b>', '余额从小到大', '想早点看到「清掉一笔」，靠成就感撑下去') +

        '</table>' +
        '<p class="algo-p">三种策略<b>分钱的逻辑完全一样</b>，只有排序不同。' +

        '<h4 class="algo-h">四、月供为什么一开始就固定</h4>' +
        '<p class="algo-p">这是最容易看错的一处。<b>每月还款总额 = 各笔最低之和 + 加速钱</b>，' +
          '在计划开始时算一次就固定下来。</p>' +
        '<p class="algo-p">某笔清掉后它不再吃钱，那份钱自动滚给下一笔——' +
          '这才是「还完一笔，压力立刻转过去」的真实情况。</p>' +
        '<p class="algo-p">如果每月重新算一遍「各笔最低之和」，清掉一笔预算就少一块，' +
          '永远滚不起来，还清日会被算得比实际长很多。</p>' +

        '<h4 class="algo-h">五、「今天还能花」怎么来的</h4>' +
        '<p class="algo-formula">(日常预算合计 − 本月已花) ÷ 本月剩余天数</p>' +
        '<p class="algo-p"><b>只摊「日常」类</b>。房租水电属于固定开支，' +
          '摊进按天的钱里会让「今天能花」直接变成负数，那就失去意义了。' +

        '<h4 class="algo-h">六、真实年化（工具页）</h4>' +
        '<p class="algo-p">填「到手多少、每月还多少、还几期」，用二分法反解 IRR：' +
          '找出让未来每期还款的现值正好等于到手金额的那个月利率，再乘 12。</p>' +
        '<p class="algo-p">例：到手 10000、每月还 1000、还 12 期 → <b>35.1%</b>。' +
          '不是「利息 2000 ÷ 本金 10000 = 20%」——本金在逐月变少，' +
          '利息是按还没还的部分算的，按总额算会把贵的东西算便宜一半。</p>' +

        '<h4 class="algo-h">七、提醒和日历</h4>' +
        '<p class="algo-p">还款日会标在日历上：月视图格子里一个「还款」小标签，' +
          '周视图在全天行放一条 <b>💳 债名</b>。<b>但不会生成待办</b>——' +
          '所以它不进任何完成率。</p>' +
        '<p class="algo-p">提醒<b>默认关</b>，在「工具 → 还款提醒」里自己开。' +
          '可设提前 3 天 / 1 天 / 当天，时刻也能改。' +
          '例：还款日 15 号、提前 3 天 → 12 号早上 9 点推一条企微。</p>' +
        '<p class="algo-p">还款日按「每月几号」重复，<b>小月按月末</b>：' +

        '<p class="algo-p">亲友借款这种没约好日子的，还款日<b>留空或填 0</b>：' +
          '不进日历、不推提醒，只算欠款和还清计划。</p>' +

        '<h4 class="algo-h">八、不参与考核</h4>' +
        '<p class="algo-p">清债的数据全部放在独立的 <code>state.money</code> 里，' +
          '不写习惯、不写打卡、不写待办。所以完成率、连续达标、日历热力' +
          '<b>全都看不见它</b>——欠债不该让「今天做得怎么样」变难看。</p>' +

        '<h4 class="algo-h">九、建议这么用</h4>' +
        '<p class="algo-p"><b>1.</b> 先去「债务」把每笔填清楚。余额填<b>现在还剩多少</b>，' +
          '不是当初借多少；初始额自动等于余额。</p>' +
        '<p class="algo-p"><b>2.</b> 看「总览」的还清日。先接受那个日期，别急着调数字——' +
          '它反映的是现状，不是判决。</p>' +
        '<p class="algo-p"><b>3.</b> 去「计划」把加速钱往上试，看还清日提前几个月。' +
          '找到「咬咬牙能坚持」的那个数，而不是「理论上最快」的那个数。</p>' +
        '<p class="algo-p"><b>4.</b> 对比三种策略。省利息最多不等于你能坚持最久，' +
          '选那个让你有进度感的。</p>' +
        '<p class="algo-p"><b>5.</b> 每还完一笔就来「记录」记一下，余额自动减。' +
          '记错了能撤销。</p>' +
        '<p class="algo-p"><b>6.</b> 如果想知道「今天还能花多少」，就去「预算」把收入和' +
          '日常类预算填上，整页就活了。</p>' +

        '<div class="algo-foot">钱的问题说到底是现金流问题。' +
          '这个页不做道德评价——它只把「照现在这样还要多久」摊开给你看，' +
          '剩下的决定权在你。</div>' +

        '<div class="algo-src">' +
          '<b>来源</b>' +
          '<p>移植自开源项目「还清日」（MIT 许可），原作者 cyberdaddyleo。</p>' +
          '<p>文档：<a href="https://acnik117j8hl.feishu.cn/wiki/XFEFw7o8siqHbnkIBJicNq08nQd" ' +
            'target="_blank" rel="noopener noreferrer">acnik117j8hl.feishu.cn/wiki/XFEFw7o8siqHbnkIBJicNq08nQd</a></p>' +
          '<p>代码：<a href="https://github.com/cyberdaddyleo/huanqingri" ' +
            'target="_blank" rel="noopener noreferrer">github.com/cyberdaddyleo/huanqingri</a></p>' +
          '<p>原版是纯本地存储的单文件应用。搬进本站后页面结构、样式、数据模型都重写过，' +

        '</div>' +

        '<div class="modal-actions"><span class="spacer"></span>' +

  }
