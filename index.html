  /* 近 7 天喝水时刻，按 6 个时段分桶（从 events 的 at 时刻取） */
  function waterHourBuckets(h, days) {
    const buckets = [0, 0, 0, 0, 0, 0];
    const today = todayStr();
    /* v192：统计页要跟随 7/30/90 天，故加可选天数；喝水页不传，仍是近 7 天 */
    /* v203：days = 0 表示「全部」（统计页全部档）—— 不设下限，直接从最早开始算 */
    const n = days === 0 ? 0 : Math.max(1, Number(days) || 7);
    const from = n ? fmt(addDays(new Date(), -(n - 1))) : '';
    (Array.isArray(state.events) ? state.events : []).forEach(function (e) {
      if (!e || e.id !== h.id || Number(e.delta) <= 0) return;
      const ds = String(e.d || '');
      if (ds < from || ds > today) return;
      const at = new Date(e.at);
      if (isNaN(at.getTime())) return;
      const hh = at.getHours();
      let idx;
      if (hh >= 6 && hh < 9) idx = 0;
      else if (hh >= 9 && hh < 12) idx = 1;
      else if (hh >= 12 && hh < 14) idx = 2;
      else if (hh >= 14 && hh < 17) idx = 3;
      else if (hh >= 17 && hh < 20) idx = 4;
      else if (hh >= 20 && hh < 23) idx = 5;
      else return;
      buckets[idx] += Math.round(Number(e.delta));
    });
    return buckets;
  }

  function waterStatsHtml(h) {
    const d = todayStr();
    const goal = waterGoalMl(h) || 1;
    const todayMl = Math.round(waterMlOf(h, countOf(d, h.id)));
    const pct = function (ml) { return Math.max(0, Math.min(100, Math.round(ml / goal * 100))); };
    function avgPct(n) {
      let sum = 0;
      for (let i = n - 1; i >= 0; i--) {
        sum += waterMlOf(h, countOf(fmt(addDays(new Date(), -i)), h.id)) / goal;
      }
      return Math.round(sum / n * 100);
    }
    const p7 = avgPct(7), p30 = avgPct(30);
    const streak = streakOn(h, d);
    let totalMl = 0, met30 = 0, sum7 = 0;
    Object.keys(state.checks || {}).forEach(function (ds) { totalMl += waterMlOf(h, countOf(ds, h.id)); });
    for (let i = 0; i < 30; i++) { if (met(h, fmt(addDays(new Date(), -i)))) met30++; }
    /* v207：改成 i = 0..6（**含今天**）。原来从昨天算起，刚喝完一杯、日均仍是 0，
       看着像没记上；而同一块的 p7 / p30 / met30 都是含今天的，只有这一处不一致。 */
    for (let i = 0; i < 7; i++) { sum7 += waterMlOf(h, countOf(fmt(addDays(new Date(), -i)), h.id)); }
    const avg7 = Math.round(sum7 / 7);
    const buckets = waterHourBuckets(h);
    const maxB = Math.max.apply(null, buckets.concat([1]));
    const LABELS = ['6–9 时', '9–12 时', '12–14 时', '14–17 时', '17–20 时', '20–23 时'];
    const bars = buckets.map(function (n, i) {
      return '<div class="w-hour"><span>' + n + '</span><i style="height:' + Math.round(n / maxB * 72) + 'px"></i><span>' + LABELS[i] + '</span></div>';
    }).join('');
    return '<section class="panel"><h3 class="w-sec-title">数据统计</h3>' +
      '<p class="w-sec-lead">达标 = 当天喝水量 ≥ 目标总量；完成度按天平均。</p>' +
      '<div class="w-kpi-grid">' +
        '<div class="w-kpi"><div class="w-ring" style="--p:' + pct(todayMl) + ';--rc:#dc2626"><b>' + pct(todayMl) + '%</b></div><span class="k-label">今日完成度</span><span class="k-sub">已喝 ' + todayMl + ' / ' + goal + ' ml</span></div>' +

  function waterNotifyHtml(m) {

              '<label class="w-mode' + (mode === 'daily' ? ' on' : '') + '"><span>每天喝水提醒</span><span>固定每天 1–3 次</span><input type="radio" name="mode" value="daily"' + (mode === 'daily' ? ' checked' : '') + '></label>' +
            '</div>' +

                '<div class="w-field"><span class="f-label">到</span><input type="time" name="notifyEnd" value="' + esc(m.notifyEnd || '21:00') + '"></div>' +

              '<div class="w-slots" id="water-slots"></div>' +

  function viewWater() {
    const h = moduleAsHabit('water');
    const m = (state.modules && state.modules.water) ? state.modules.water : moduleDefaults('water');
    return '<div class="water-page" style="--hc:' + esc(m.color || '#4c7f96') + '">' +
      waterHead(m) +
      vitalCard(h, todayStr()) +
      waterBenefitsHtml() +
      waterSettingsHtml(m) +
      waterStatsHtml(h) +
      waterNotifyHtml(m) +

  /* ============ 运动页 2.0（v175） ============ */
  function moveModule() {
    return (state.modules && state.modules.move) ? state.modules.move : moduleDefaults('move');
  }
  function moveSports() {
    const m = moveModule();
    return Array.isArray(m.sports) ? m.sports : [];
  }
  function moveRecords() {
    const m = moveModule();
    /* v198：软删除的记录（有墓碑的）在界面上当作已经删掉 */
    return Array.isArray(m.records)
      ? m.records.filter(function (r) { return r && !r.deletedAt; })
      : [];
  }
  function moveSportById(id) {
    return moveSports().find(function (s) { return s.id === id; }) || null;
  }
  /* 当前目标档：类型库里可能有第二档（健走/骑行/跳绳/游泳的「时长」） */
  function moveTargetOf(s) {
    const T = MOVE_TYPES[s.key] || MOVE_TYPES.steps;
    const i = Math.min(Math.max(0, Math.round(Number(s.tIdx)) || 0), T.targets.length - 1);
    return T.targets[i];
  }
  /* 某运动在某天的记录。v175 的老记录可能没有 sportId，按 key 兜底，老数据也算得上。 */
  function moveRecsOfSport(s, d) {
    return moveRecords().filter(function (r) {
      if (!r || r.d !== d) return false;
      if (r.sportId) return r.sportId === s.id;
      return r.key === s.key;
    });
  }
  /* 当天的进度：步数档看累计步数；其余档「有记录即完成」（值=条数，目标=1） */
  function moveProgress(s, d) {
    const recs = moveRecsOfSport(s, d);
    const tf = moveTargetOf(s);
    if (tf.k === 'steps') {
      const val = recs.reduce(function (a, r) { return a + (Number(r.steps) || 0); }, 0);
      return { val: val, target: Math.max(1, Number(s.tVal) || 1), unit: tf.unit, recs: recs, isSteps: true };
    }
    /* v178：非步数按「单日几次」判达标。原来写死 target=1，
       用户设了「每天 3 次」也只要打一次卡就算完成，形同虚设。 */
    const per = Math.max(1, Number(s.freqKind === 'weekly' ? s.perDay : s.freqN) || 1);
    return { val: recs.length, target: per, unit: '次', recs: recs, isSteps: false };
  }
  function moveSportDone(s, d) {
    if (!s) return false;
    const p = moveProgress(s, d);
    return p.val >= p.target;
  }
  /* v181：今天还没填数据的那条打卡记录（打卡时置 pending，填完或跳过才清）。
     有它的时候主按钮必须变成「记录数据」，不能允许再打一次。 */
  function movePendingRec(s) {
    if (!s) return null;
    const recs = moveRecsOfSport(s, todayStr());
    for (let i = recs.length - 1; i >= 0; i--) {
      if (recs[i].pending) return recs[i];
    }
    return null;
  }
  /* 某运动在指定日期是否「按计划休息」：只有「每周 N 天」且当天不在勾选里才成立 */
  function moveIsRestOn(s, ds) {
    if (!s || s.freqKind !== 'weekly') return false;
    const sel = Array.isArray(s.weekSel) ? s.weekSel : [];
    if (!sel.length) return false;
    const dt = parseD(ds);
    if (!dt) return false;
    return sel.indexOf(dt.getDay()) < 0;
  }
  function moveIsRest(s) {
    return moveIsRestOn(s, todayStr());
  }
  /* 运动模块整体达标。
     ① 有运动实例：任一完成即达标；
     ② **休息日不纳入考核**（v176 陛下定）：当天所有运动都按计划休息时，视为无需完成，
        返回 true —— 免得「按计划休息」被算成未达标、把今日完成率拉低；
     ③ 没有实例（v174 及以前的老数据）：回退 checks 计数，历史达标天数不清零。 */
  function moveMet(d) {
    const sports = moveSports();
    if (sports.length) {
      if (sports.some(function (s) { return moveSportDone(s, d); })) return true;
      return sports.every(function (s) { return moveIsRestOn(s, d); });
    }
    return countOf(d, 'h_move') >= 1;
  }
  function moveFreqText(s) {
    const per = Math.max(1, Number(s.perDay) || 1);
    /* v184：每日步数没有「每天几次」的概念（每个执行日就是 1 次），别显示次数 */
    const isSteps = s.key === 'steps';
    if (s.freqKind === 'weekly') {
      const sel = Array.isArray(s.weekSel) ? s.weekSel : [];
      const days = MOVE_WEEK.filter(function (w) { return sel.indexOf(w[0]) >= 0; })
        .map(function (w) { return w[1]; }).join('、');
      return '每周 ' + sel.length + ' 天' + (!isSteps && per > 1 ? ' · 每天 ' + per + ' 次' : '') + '（' + days + '）';
    }
    return isSteps ? '每天' : ('每天 ' + (Number(s.freqN) || 1) + ' 次');
  }

  function moveHead(m) {
    const n = moveSports().length;
    return '<div class="page-head">' +
      '<div><h2>运动</h2><p>' + (n ? '我的运动 · 共 ' + n + ' 项' : '我的运动 · 记录每一次出汗') + '</p></div>' +
      '<div class="head-actions">' +
        '<button class="btn" data-act="move-add-rec">＋ 添加记录</button>' +
        '<button class="btn new" data-act="move-new">＋ 新建运动</button>' +
      '</div>' +
    '</div>';
  }

  function moveSportRingHtml(pct) {
    const R = 42, C = 2 * Math.PI * R;
    const dash = Math.max(0, Math.min(100, pct)) / 100 * C;
    return '<svg viewBox="0 0 96 96" aria-hidden="true">' +
      '<circle cx="48" cy="48" r="' + R + '" fill="none" stroke="var(--track)" stroke-width="8"/>' +
      '<circle cx="48" cy="48" r="' + R + '" fill="none" stroke="var(--sport, #b5733f)" stroke-width="8" stroke-linecap="round"' +
      ' stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 48 48)"/>' +
      '</svg>';
  }

  function moveSportCardHtml(s, m) {
    const T = MOVE_TYPES[s.key] || MOVE_TYPES.steps;
    const tf = moveTargetOf(s);
    const d = todayStr();
    const p = moveProgress(s, d);
    const done = p.val >= p.target;
    const rest = moveIsRest(s);
    let pct, ringVal, ringLbl;
    if (p.isSteps) {
      pct = Math.min(100, Math.round(p.val / p.target * 100));
      ringVal = pct + '%';
      ringLbl = '完成率';
    } else {
      /* v181：原来写死「0/1」，用户设了「每天 2 次」也看不出来；
         改成真实的 val/target，几次就写几次，待填数据的那一次也计入。 */
      pct = done ? 100 : Math.min(100, Math.round(p.val / p.target * 100));
      ringVal = done ? '✓' : (p.val + '/' + p.target);
      ringLbl = '完成';
    }
    /* 记录字段标签：目标 + 频率 + 记录方式 / 进阶字段 */
    /* v197：卡片上的「目标」要和实际判定一致。
       步数的判定就是累计步数（目标步数），照旧；
       非步数从 v178 起判定的是「每天几次」，目标档里的距离/时长只是参考值 ——
       以前卡片写「目标 5 公里」、实际要求「每天 2 次」，两回事。现在显示判定依据。 */
    let fhtml;
    const weekly = s.freqKind === 'weekly';
    const perGoal = Math.max(1, Number(weekly ? s.perDay : s.freqN) || 1);
    if (s.key === 'steps') {
      fhtml = '<span class="mv-ft"><b>目标</b>' + s.tVal + ' ' + esc(tf.unit) + '</span>' +
        '<span class="mv-ft"><b>频率</b>' + esc(moveFreqText(s)) + '</span>';
    } else if (weekly) {
      fhtml = '<span class="mv-ft"><b>目标</b>每个运动日 ' + perGoal + ' 次</span>' +
        '<span class="mv-ft"><b>频率</b>每周选日运动</span>';
    } else {
      fhtml = '<span class="mv-ft"><b>目标</b>每天 ' + perGoal + ' 次</span>';
    }
    if (s.key === 'steps') {
      fhtml += '<span class="mv-ft"><b>记录方式</b>' + (s.recMode === 'fixed' ? ('每次 +' + s.fixedSteps + ' 步') : '手动输入') + '</span>';
    } else if (s.fields.length) {
      /* v179：字段最多 7 项，全铺在卡上会挤成一团，这里只报项数，具体去「补数据」看 */
      /* v207：原来是「记录数据7 项」，读起来像「还有 7 项待填」，旁边还正好有个「记录数据」按钮，
         线上实测我自己都被骗了。改成「含 7 项数据」，语义是"这个运动配置了 7 个记录项"。 */
      fhtml += '<span class="mv-ft">含 <b>' + s.fields.length + '</b> 项数据</span>';
    }
    /* v184：运动开始时间（每日步数全天统计，没有这一项） */
    if (s.key !== 'steps' && s.startTime) {
      fhtml += '<span class="mv-ft"><b>开始时间</b>' + esc(s.startTime) + '</span>';
    }
    /* 状态行 */
    const pend = movePendingRec(s);
    /* v184：跳过了记录数据的那些次 —— 决定「补数据」按钮出不出现。
       v197：跨天的待填记录也算进去，否则那些记录没有任何入口能处理。 */
    const skips = moveSkippedRecs(s);
    const stalePend = moveStalePendings(s);
    const todoN = skips.length + stalePend.length;
    let st, note;
    if (done) {
      st = '<div class="mv-st ok">今天已完成</div>';
      note = p.isSteps
        ? ('今天已记 ' + p.val + ' / ' + p.target + ' ' + tf.unit + '，达标了')
        : ('今天已完成 ' + p.val + ' / ' + p.target + ' 次' +
          (skips.length ? '，有 ' + skips.length + ' 次跳过了记录数据，点右上角「待补 ' + skips.length + '」补上' : ''));
    } else if (rest) {
      st = '<div class="mv-st rest">今日无需运动</div>';
      note = '今天按计划休息 · ' + moveFreqText(s);
    } else if (p.val > 0) {
      /* v178：非步数也要显示「还差几次」（单日多次时 1 次不等于完成） */
      st = '<div class="mv-st">还没达标</div>';
      note = p.isSteps
        ? ('今日已记录 ' + p.val + ' / ' + p.target + ' ' + tf.unit + '，还差 ' + Math.max(0, p.target - p.val) + ' ' + tf.unit)
        : ('今天已记录 ' + p.val + ' / ' + p.target + ' 次，还差 ' + Math.max(0, p.target - p.val) + ' 次');
    } else {
      st = '<div class="mv-st">还没开始</div>';
      note = '动起来，' + T.desc;
    }
    /* v181：这一次打完卡还没填数据 —— 先让它显眼，并说清后果 */
    if (pend) {
      st = '<div class="mv-st pend">等记录这一次的数据</div>';
      note = done
        ? '今天的目标已经达成，但第 ' + p.val + ' 次的数据还没填：点「记录数据」填写，或进去选「跳过不记录」。'
        : '这一次已经算完成，填完数据（或跳过）才能开始第 ' + Math.min(p.val + 1, p.target) + ' 次。';
    }
    /* 主按钮：pending 优先级最高 —— 达成次数后也要先把这一次的数据处理掉 */
    let mainBtn;
    if (pend) {
      mainBtn = '<button class="mv-btn go" data-act="move-fill" data-id="' + s.id + '" data-rec="' + pend.id + '">记录数据</button>';
    } else if (done) {
      mainBtn = '<button class="mv-btn done" data-act="move-undo" data-id="' + s.id + '">已完成 · 点击撤销</button>';
    } else if (rest) {
      mainBtn = '<button class="mv-btn go" disabled>今日无需运动</button>';
    } else if (s.key === 'steps') {
      mainBtn = '<button class="mv-btn go" data-act="move-do" data-id="' + s.id + '">' +
        (s.recMode === 'fixed' ? ('记录 +' + s.fixedSteps + ' 步') : '记录步数') + '</button>';
    } else {
      mainBtn = '<button class="mv-btn go" data-act="move-do" data-id="' + s.id + '">去运动</button>';
    }
    return '<article class="mv-card' + (rest ? ' is-rest' : '') + '" data-id="' + s.id + '" style="--sport:' + esc(s.color || T.color) + '">' +
      '<div class="mv-top">' +
        '<span class="mv-ico">' + esc(T.icon) + '</span>' +
        '<div class="mv-title"><b>' + esc(s.name || T.name) + '</b><small>' + esc(moveFreqText(s)) +
          /* v197：非步数的达标依据是「每天几次」，moveFreqText 里已经写着，标题别再重复一遍；
             步数没有次数概念，单独把目标步数补上。 */
          (s.key === 'steps' ? ' · 目标 ' + s.tVal + ' ' + esc(tf.unit) : '') +
          '</small></div>' +
        /* v188：有跳过未记录的次数时，右上角用「待补 N」胶囊顶替「我的运动」标签 ——
           提示变成状态而不是按钮：不占按钮区、卡片高度与普通卡片一致，
           也不会被误认为「再打一次卡」。点它进补数据列表。 */
        (todoN
          ? '<button type="button" class="mv-pill" data-act="move-rec" data-id="' + s.id + '" ' +
            'title="有 ' + skips.length + ' 次跳过了记录数据' +
            (stalePend.length ? '、' + stalePend.length + ' 次还没填数据' : '') + '，点击处理">待补 <b>' + todoN + '</b></button>'
          : '<span class="mv-tag">我的运动</span>') +
      '</div>' +
      '<div class="mv-main">' +
        '<div class="mv-left">' +
          st +
          '<div class="mv-note">' + esc(note) + '</div>' +
          '<div class="mv-fields">' + fhtml + '</div>' +
        '</div>' +
        '<div class="mv-ring">' + moveSportRingHtml(pct) + '<div class="mv-rc"><b>' + ringVal + '</b><span>' + ringLbl + '</span></div></div>' +
      '</div>' +
      '<div class="mv-actions">' +
        mainBtn +
        /* v184：「补数据」只在跳过没记录时才出现 —— 填过数据的记录没得补。
           v188：入口已收到右上角胶囊，按钮区不再放长条红按钮。
           待填数据时给「撤销这一次」，避免用户以为还能再加一次。 */
        (pend
          ? '<button class="mv-btn ghost" data-act="move-undo" data-id="' + s.id + '">撤销这一次</button>'
          : '') +
        /* v184：卡片内的统一记录入口，替代原来页面底部那个混着补数据的总日志 */
        '<button class="mv-btn ghost" data-act="move-log" data-id="' + s.id + '">今日任务记录</button>' +
        '<button class="mv-btn ghost" data-act="move-edit" data-id="' + s.id + '">编辑</button>' +
        '<button class="mv-btn ghost danger" data-act="move-del" data-id="' + s.id + '">删除</button>' +
      '</div>' +
    '</article>';
  }

  function moveSportsHtml(m) {
    const sports = moveSports();
    if (!sports.length) {
      return '<section class="panel"><div class="mv-empty">' +
        '<span class="e-ico">🏃</span>' +
        '<b>还没有运动</b><p>点右上角「＋ 新建运动」，添加你想坚持的项目，比如每日步数、跑步、游泳…</p>' +
        '<button class="btn new" data-act="move-new">＋ 新建运动</button>' +
      '</div></section>';
    }
    return sports.map(function (s) { return moveSportCardHtml(s, m); }).join('');
  }

  /* 一条记录的文字摘要（明细列表与「今日已记录」共用） */
  function moveRecSummary(r) {
    const T = MOVE_TYPES[r.key];
    if (!T) return '—';
    /* v181：用户明确跳过记录的那一次 / 还没填的那一次 */
    if (r.skipped) return '未记录详细数据';
    if (r.pending) return '待填数据';
    if (r.key === 'steps') {
      let s = (Number(r.steps) || 0).toLocaleString() + ' 步 · ' + (r.recMode === 'fixed' ? '固定' : '手动');
      if (Number(r.distM)) s += ' · ' + r.distM + ' 米';
      return s;
    }
    /* v179：按该模式定义的数据项拼摘要，不再写死字段 */
    const p = [];
    (T.fields || []).forEach(function (f) {
      const v = r[f.k];
      if (v === undefined || v === null || v === '' || v === 0) return;
      if (f.type === 'text' || f.type === 'select') {
        p.push(f.k === 'pace' ? ('配速 ' + v) : f.k === 'hrZone' ? ('心率 ' + v) : String(v));
      } else {
        p.push(v + (f.unit ? ' ' + f.unit : ''));
      }
    });
    /* 兜底：字段已不在新定义里，但记录里还有值（老数据） */
    if (!p.length) {
      if (Number(r.dist)) p.push(r.dist + ' 公里');
      if (Number(r.dur)) p.push(r.dur + ' 分钟');
      if (Number(r.heart)) p.push(r.heart + ' bpm');
      if (r.pace) p.push('配速 ' + r.pace);
    }
    return p.join(' · ') || '一次记录';
  }
  /* 记录的 HH:MM（用于明细与今日已记录，陛下要求「记录日志要带时间」） */
  function moveRecHM(r) {
    const t = new Date(r.at);
    if (isNaN(t.getTime())) return '';
    return pad2(t.getHours()) + ':' + pad2(t.getMinutes());
  }

  /* v185/v186：「今日任务记录」里的字段行渲染，v186 起分成**两套**：
     · moveRecLogFields  → 「运动日志」框里、打卡那一刻产生的数据（步数 / 记录方式）；
     · moveRecFieldLines → 「运动后数据」框里、达标后补录的数据（距离 / 时长 / 配速…）。
     字段名与单位取自模式库定义（与弹窗里的标签同一份），值取记录里存的数，不四舍五入；
     只列这个运动**勾选过**的字段：取消勾选后旧值仍留在存档里，只是不再显示。
     注意：卡片与统计页用的是 moveRecSummary（要短），别把这里换成那边。 */

  /* 打卡日志里的数据行：只有每日步数有（打卡时填的步数 + 记录方式） */
  function moveRecLogFields(r) {
    if (!r || r.key !== 'steps') return '';
    if (r.pending) return '<div class="sp-recfield is-empty">· 待填数据</div>';
    const rows = [
      ['步数（步）', (Number(r.steps) || 0).toLocaleString() + ' 步'],
      ['记录方式', r.recMode === 'fixed' ? '每次记录固定步数' : '手动输入今日步数']
    ];
    return rows.map(function (x) {
      return '<div class="sp-recfield"><span class="k">· ' + esc(x[0]) + '</span><span class="v">' + esc(x[1]) + '</span></div>';
    }).join('');
  }

  /* 运动后数据（达标后补录的那些字段） */
  function moveRecFieldLines(s, r, T) {
    if (r.skipped) return '<div class="sp-recfield is-empty">· 未记录运动后数据</div>';
    if (r.pending) return '<div class="sp-recfield is-empty">· 待填数据</div>';
    const keys = Array.isArray(s.fields) ? s.fields : (T.fields || []).map(function (f) { return f.k; });
    const rows = [];
    keys.forEach(function (k) {
      const f = (T.fields || []).find(function (x) { return x.k === k; });
      if (!f) return;
      const v = r[f.k];
      const label = f.n + (f.unit ? '（' + f.unit + '）' : '');
      if (f.type === 'text' || f.type === 'select') {
        const str = String(v == null ? '' : v).trim();
        if (!str) return;
        /* 配速、心率区间这类没有单位的字段：字段名 + 空格 + 值 */
        rows.push([label, str]);
      } else {
        const n = Number(v);
        if (!(n > 0)) return;
        /* 有单位的字段：值自带单位（3 公里 / 50 分钟） */
        rows.push([label, String(n) + (f.unit ? ' ' + f.unit : '')]);
      }
    });
    if (!rows.length) return '<div class="sp-recfield is-empty">· 未记录运动后数据</div>';
    return rows.map(function (x) {
      return '<div class="sp-recfield"><span class="k">· ' + esc(x[0]) + '</span><span class="v">' + esc(x[1]) + '</span></div>';
    }).join('');
  }

  /* ============================================================
     运动数据统计（v189 改版）
     ------------------------------------------------------------
     旧的「全部合计 + 4 个区块」不够用：只能看合计、时间只有 5 档、
     趋势只数记录条数、每种模式的专项只有一两行数字。
     现在改成：先把范围收窄到某个模式，再看这个模式自己的指标 / 趋势 / 分布 / 专项。

     · 纯视图状态：moveStatMode / moveStatRange / moveStatMetric，都不进 state；
     · 口径沿用旧的：距离统一折公里、跳过只计次数、达标看 moveMet；
     · 图表全部手写 SVG / div，项目无构建、无 CDN、不引第三方库；
     · 一次 render 只跑一遍过滤与汇总，避免上千条记录被反复 filter。
     ============================================================ */
  const MOVE_STAT_RANGES = [
    ['today', '今日'], ['week', '本周'], ['month', '本月'], ['lastmonth', '上月'],
    ['30d', '近 30 天'], ['90d', '近 90 天'], ['all', '全部']
  ];
  const MOVE_STAT_HLAB = ['0-2', '2-4', '4-6', '6-8', '8-10', '10-12', '12-14', '14-16', '16-18', '18-20', '20-22', '22-24'];
  /* 专项标题里把字段键翻成中文，别把 dur / dist / pace 直接写给用户看 */
  const MOVE_FIELD_CN = {
    dur: '时长', dist: '距离', pace: '配速', cadence: '步频/踏频', heart: '心率', kcal: '热量',
    stride: '步幅', distM: '距离', count: '次数', ropeRate: '跳频', sets: '组数', reps: '重复次数',
    weight: '负重', rest: '组间休息', hrZone: '心率区间', heartAvg: '平均心率', speed: '平均速度'
  };

  function moveStatNum(n) {
    const v = Number(n) || 0;
    return v >= 1000 ? Math.round(v).toLocaleString() : (Math.round(v * 10) / 10).toString();
  }
  /* 时间范围 → [起始日, 结束日]（'YYYY-MM-DD'，闭区间） */
  /* v197：modeKey 传当前模式时，「全部」范围的起点取这个模式自己的最早记录 ——
     原来取全局最早（可能是半年前记的步数），切到别的模式就会前段一大片 0 点。 */
  function moveStatBounds(k, modeKey) {
    const t = new Date();
    if (k === 'today') return [fmt(t), fmt(t)];
    if (k === 'week') { const wd = (t.getDay() + 6) % 7; return [fmt(addDays(t, -wd)), fmt(t)]; }
    if (k === 'month') return [fmt(new Date(t.getFullYear(), t.getMonth(), 1)), fmt(t)];
    if (k === 'lastmonth') {
      return [fmt(new Date(t.getFullYear(), t.getMonth() - 1, 1)), fmt(new Date(t.getFullYear(), t.getMonth(), 0))];
    }
    if (k === '30d') return [fmt(addDays(t, -29)), fmt(t)];
    if (k === '90d') return [fmt(addDays(t, -89)), fmt(t)];
    let old = '';
    moveRecords().forEach(function (r) {
      if (!r || !r.d) return;
      if (modeKey && r.key !== modeKey) return;
      if (!old || r.d < old) old = r.d;
    });
    return [old || fmt(addDays(t, -179)), fmt(t)];
  }
  function moveStatKm(r) {
    /* 游泳历史记录按米录入，折成公里；其余模式本来就是公里 */
    return r.key === 'swim' ? (Number(r.dist) || 0) / 1000 : (Number(r.dist) || 0);
  }
  function moveStatVolume(r) {
    return (Number(r.sets) || 0) * (Number(r.reps) || 0) * (Number(r.weight) || 0);
  }
  function moveStatMetricVal(r, metric) {
    if (metric === 'count') return 1;
    if (metric === 'dist') return moveStatKm(r);
    if (metric === 'volume') return moveStatVolume(r);
    return Number(r[metric]) || 0;
  }
  /* 当天运动量（分钟）：有详细时长按时长；只有步数的天按 100 步 ≈ 1 分钟折算。
     不这么折算的话，步数（几千）和时长（几十）画进同一张热力图，有步数的天会整片全红。 */
  function moveStatDayScore(day) {
    if (!day) return 0;
    return day.score || 0;
  }
  function moveStatAgg(list) {
    const o = {
      n: list.length, skip: 0, pending: 0, realN: 0, dur: 0, dist: 0, kcal: 0, steps: 0, distM: 0,
      ropeCount: 0, sets: 0, volume: 0, heartSum: 0, heartN: 0, speedSum: 0, speedN: 0,
      cadSum: 0, cadN: 0, rateSum: 0, rateN: 0, paceSum: 0, paceN: 0,
      byDay: {}, byMode: {}, hours: [], wd: []
    };
    for (let i = 0; i < 12; i++) o.hours.push(0);
    for (let i = 0; i < 7; i++) o.wd.push(0);
    list.forEach(function (r) {
      if (!r || !MOVE_TYPES[r.key]) return;
      const mb = o.byMode[r.key] || (o.byMode[r.key] = { n: 0, skip: 0, dur: 0, dist: 0 });
      mb.n++;
      if (r.skipped) mb.skip++;
      /* v191：跳过的那些只计次数，不计时长/距离 —— byMode 自己也有 dur/dist，
         口径必须和总汇总一致，否则「按运动模式」的距离会比上面 KPI 多出跳过的部分 */
      if (!r.skipped) {
        mb.dur += Number(r.dur) || 0;
        mb.dist += moveStatKm(r);
      }
      o.hours[Math.min(11, Math.floor((Number(r.hour) || 0) / 2))]++;
      o.wd[(new Date(r.d + 'T00:00:00').getDay() + 6) % 7]++;
      const day = o.byDay[r.d] || (o.byDay[r.d] = { n: 0, dur: 0, steps: 0, dist: 0, score: 0, met: false });
      day.n++;
      day.dur += Number(r.dur) || 0;
      day.steps += Number(r.steps) || 0;
      day.dist += moveStatKm(r);
      /* v197：步数是「打卡时记的」，不是运动后数据 —— 跳过只丢运动后数据（时长/距离/心率…），
         步数照计。否则卡片说「今天已达标」、KPI 却说「还差 X 步」，两个数打架。 */
      o.steps += Number(r.steps) || 0;
      /* 当天运动量（分钟）：有时长按时长，纯步数按 100 步 ≈ 1 分钟折算。
         跳过的记录没有时长，只按步数折算 —— 这样「有记录的天数」和热力图颜色才对得上。 */
      day.score += r.skipped
        ? (Number(r.steps) || 0) / 100
        : (Number(r.dur) || 0) + ((Number(r.dur) || 0) ? 0 : (Number(r.steps) || 0) / 100);
      if (r.skipped) { o.skip++; return; }   /* 跳过的只计次数 */
      /* v197：pending（还没填运动后数据）不算「有详细数据」，单独列出来 */
      if (r.pending) { o.pending++; return; }
      o.realN++;
      o.dur += Number(r.dur) || 0;
      o.dist += moveStatKm(r);
      o.kcal += Number(r.kcal) || 0;
      o.distM += Number(r.distM) || 0;
      o.ropeCount += Number(r.count) || 0;
      o.sets += Number(r.sets) || 0;
      o.volume += moveStatVolume(r);
      const hr = Number(r.heart) || Number(r.heartAvg) || 0;
      if (hr) { o.heartSum += hr; o.heartN++; }
      if (Number(r.speed)) { o.speedSum += Number(r.speed); o.speedN++; }
      if (Number(r.cadence)) { o.cadSum += Number(r.cadence); o.cadN++; }
      if (Number(r.ropeRate)) { o.rateSum += Number(r.ropeRate); o.rateN++; }
      const pm = /^(\d+):([0-5]\d)$/.exec(String(r.pace || ''));
      if (pm) { o.paceSum += (+pm[1]) * 60 + (+pm[2]); o.paceN++; }
    });
    o.days = Object.keys(o.byDay).length;
    o.heartAvg = o.heartN ? Math.round(o.heartSum / o.heartN) : 0;
    o.speedAvg = o.speedN ? Math.round(o.speedSum / o.speedN * 10) / 10 : 0;
    o.cadAvg = o.cadN ? Math.round(o.cadSum / o.cadN) : 0;
    o.rateAvg = o.rateN ? Math.round(o.rateSum / o.rateN) : 0;
    if (o.paceN) {
      const s = Math.round(o.paceSum / o.paceN);
      o.pace = Math.floor(s / 60) + ':' + pad2(s % 60);
    } else {
      o.pace = '—';
    }
    return o;
  }
  /* 趋势分桶：今日按 2 小时 / ≤31 天按日 / ≤120 天按周 / 更久按月 */
  function moveStatBuckets(list, from, to, metric) {
    const span = Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000) + 1;
    if (from === to) {
      const arr = [];
      for (let i = 0; i < 12; i++) arr.push(0);
      list.forEach(function (r) { arr[Math.min(11, Math.floor((Number(r.hour) || 0) / 2))] += moveStatMetricVal(r, metric); });
      return { labels: MOVE_STAT_HLAB.slice(), values: arr, unit: '每 2 小时' };
    }
    if (span <= 31) {
      const vals = [], labs = [], at = {};
      for (let i = span - 1; i >= 0; i--) {
        const ds = fmt(addDays(new Date(to + 'T00:00:00'), -i));
        at[ds] = vals.length;
        vals.push(0);
        labs.push(ds.slice(5));
      }
      list.forEach(function (r) { if (at[r.d] !== undefined) vals[at[r.d]] += moveStatMetricVal(r, metric); });
      return { labels: labs, values: vals, unit: '每天' };
    }
    if (span <= 120) {
      const weeks = Math.ceil(span / 7), vals = [], labs = [];
      const start = new Date(from + 'T00:00:00');
      for (let i = 0; i < weeks; i++) { vals.push(0); labs.push('第' + (i + 1) + '周'); }
      list.forEach(function (r) {
        const w = Math.floor((new Date(r.d + 'T00:00:00') - start) / 86400000 / 7);
        vals[Math.max(0, Math.min(weeks - 1, w))] += moveStatMetricVal(r, metric);
      });
      return { labels: labs, values: vals, unit: '每周' };
    }
    const map = {};
    list.forEach(function (r) {
      const k = r.d.slice(0, 7);
      map[k] = (map[k] || 0) + moveStatMetricVal(r, metric);
    });
    const keys = Object.keys(map).sort();
    return { labels: keys.map(function (k) { return (+k.slice(5)) + ' 月'; }), values: keys.map(function (k) { return map[k]; }), unit: '每月' };
  }

  /* —— 手写图表 —— */
  function moveStatLineSvg(vals, labels, opt) {
    const W = 1000, H = 300, P = { l: 54, r: 14, t: 16, b: 30 };
    const max = Math.max.apply(null, vals.concat([1]));
    const iw = W - P.l - P.r, ih = H - P.t - P.b, n = vals.length;
    const x = function (i) { return P.l + (n === 1 ? iw / 2 : i * iw / (n - 1)); };
    const y = function (v) { return P.t + ih - (v / max) * ih; };
    let g = '';
    for (let i = 0; i <= 3; i++) {
      const gy = P.t + ih * i / 3;
      g += '<line x1="' + P.l + '" y1="' + gy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + gy.toFixed(1) + '" class="stt-grid" stroke-width="1"/>' +
        '<text x="' + (P.l - 8) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" class="stt-ax">' + moveStatNum(max * (3 - i) / 3) + '</text>';
    }
    const pts = vals.map(function (v, i) { return x(i).toFixed(1) + ' ' + y(v).toFixed(1); });
    const line = 'M' + pts.join(' L');
    const area = line + ' L' + x(n - 1).toFixed(1) + ' ' + (P.t + ih) + ' L' + x(0).toFixed(1) + ' ' + (P.t + ih) + ' Z';
    /* 半宽容器（统计页两栏）里按 1/10 分档会挤，调用方可传 labelStep */
    const step = (opt && opt.labelStep) || Math.max(1, Math.ceil(n / 10));
    let xl = '';
    labels.forEach(function (l, i) {
      if (i % step === 0 || i === n - 1) {
        xl += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" class="stt-ax">' + esc(l) + '</text>';
      }
    });
    const dots = n <= 40
      ? vals.map(function (v, i) { return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.4" fill="var(--accent)"/>'; }).join('')
      : '';
    return '<div class="stt-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="趋势图">' +
      g + '<path d="' + area + '" fill="rgba(220,38,38,.10)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>' +
      dots + xl + '</svg></div>';
  }
  function moveStatMiniSvg(vals, color) {
    if (!vals.length) return '';
    const W = 200, H = 52, max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    const rngv = Math.max(1, max - min);
    const pts = vals.map(function (v, i) {
      return ((i / Math.max(1, vals.length - 1)) * W).toFixed(1) + ' ' + (H - 4 - ((v - min) / rngv) * (H - 10)).toFixed(1);
    });
    return '<div class="stt-mini"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M' + pts.join(' L') + '" fill="none" stroke="' + color + '" stroke-width="1.8"/></svg></div>';
  }
  function moveStatBarsHtml(items, opt) {
    const o = opt || {};
    const max = Math.max.apply(null, items.map(function (x) { return x.v; }).concat([1]));
    /* fill 模式：高度用百分比 —— 容器被拉多高，柱子就长多高，底部对齐不悬空。
       否则固定 px 的柱子在被拉高的栏里会「顶在上面 + 下方空一大片」。 */
    return '<div class="stt-bars' + (o.tight ? ' tight' : '') + (o.fill ? ' fill' : '') + '">' + items.map(function (x) {
      const hh = o.fill
        ? Math.max(2, Math.round(x.v / max * 100))
        : Math.max(2, Math.round(x.v / max * (o.h || 76)));
      return '<div class="stt-bar' + (x.hot ? ' hot' : '') + '">' +
        '<b>' + (x.v ? moveStatNum(x.v) : '') + '</b>' +
        '<i style="height:' + hh + (o.fill ? '%' : 'px') + ';' +
        (x.color ? 'background:' + x.color : '') + '"></i>' +
        '<span>' + esc(x.l) + '</span></div>';
    }).join('') + '</div>';
  }
  function moveStatRankHtml(items, unit) {
    const max = Math.max.apply(null, items.map(function (x) { return x.v; }).concat([1]));
    return '<div class="stt-rank">' + items.map(function (x) {
      return '<div class="rk"><span class="nm">' + (x.icon ? x.icon + ' ' : '') + esc(x.l) + '</span>' +
        '<span class="tr"><span class="fl" style="width:' + Math.round(x.v / max * 100) + '%;background:' + (x.color || 'var(--text)') + '"></span></span>' +
        '<span class="vl">' + moveStatNum(x.v) + (unit || '') + (x.tag ? ' <i class="stt-tag">' + esc(x.tag) + '</i>' : '') + '</span></div>';
    }).join('') + '</div>';
  }
  function moveStatDistHtml(items, color) {
    const max = Math.max.apply(null, items.map(function (x) { return x.v; }).concat([1]));
    return '<div class="stt-dist">' + items.map(function (x) {
      return '<div class="dl"><span class="nm">' + esc(x.l) + '</span>' +
        '<span class="tr"><span class="fl" style="width:' + Math.round(x.v / max * 100) + '%;background:' + (x.color || color || 'var(--chart-2)') + '"></span></span>' +
        '<span class="vl">' + esc(x.t) + '</span></div>';
    }).join('') + '</div>';
  }
  function moveStatRingHtml(pct, color, lab) {
    const R = 32, C = 2 * Math.PI * R;
    return '<div class="stt-ring"><svg viewBox="0 0 78 78" aria-hidden="true">' +
      '<circle cx="39" cy="39" r="' + R + '" fill="none" stroke="var(--surface-3)" stroke-width="9"/>' +
      '<circle cx="39" cy="39" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + (C * Math.max(0, Math.min(100, pct)) / 100).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 39 39)"/></svg>' +
      '<div class="rc"><b>' + Math.round(pct) + '%</b><span>' + esc(lab) + '</span></div></div>';
  }
  function moveStatKpiHtml(v, unit, label, delta) {
    return '<div class="stt-kpi"><b>' + v + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</b>' +
      '<span>' + esc(label) + '</span>' + (delta || '') + '</div>';
  }
  function moveStatDeltaHtml(cur, prev, reverse) {
    if (moveStatRange === 'all' || !prev) return '';
    const p = (cur - prev) / prev * 100;
    if (!isFinite(p) || Math.abs(p) < 0.5 || Math.abs(p) > 300) return '';
    const up = p > 0;
    const good = reverse ? !up : up;
    return '<i class="stt-delta ' + (good ? 'up' : 'down') + '">' + (up ? '↑' : '↓') + Math.abs(p).toFixed(0) + '% 比上期</i>';
  }
  /* 某个模式的趋势指标（第一个是默认） */
  function moveStatMetrics(mode) {
    if (!mode) return [['count', '记录次数'], ['dur', '时长'], ['dist', '距离'], ['steps', '步数']];
    if (mode === 'steps') return [['steps', '步数'], ['distM', '补录距离'], ['count', '次数']];
    if (mode === 'rope') return [['count', '跳绳数'], ['dur', '时长']];
    if (mode === 'strength') return [['volume', '训练容量'], ['sets', '组数'], ['dur', '时长']];
    if (mode === 'ball') return [['dur', '时长'], ['kcal', '热量']];
    return [['dist', '距离'], ['dur', '时长'], ['kcal', '热量']];
  }

  function moveStatsHtml(m) {
    const all = moveRecords().filter(function (r) { return r && MOVE_TYPES[r.key]; });
    const sports = moveSports();
    const modeKey = (moveStatMode && MOVE_TYPES[moveStatMode]) ? moveStatMode : '';
    const T = modeKey ? MOVE_TYPES[modeKey] : null;
    const bd = moveStatBounds(moveStatRange, modeKey);
    const from = bd[0], to = bd[1];
    const base = modeKey ? all.filter(function (r) { return r.key === modeKey; }) : all;
    const list = base.filter(function (r) { return r.d >= from && r.d <= to; });
    const span = Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000) + 1;
    const pTo = fmt(addDays(new Date(from + 'T00:00:00'), -1));
    const pFrom = fmt(addDays(new Date(from + 'T00:00:00'), -span));
    const prevList = base.filter(function (r) { return r.d >= pFrom && r.d <= pTo; });
    const A = moveStatAgg(list);
    const Pv = moveStatAgg(prevList);

    const metrics = moveStatMetrics(modeKey);
    let metric = moveStatMetric;
    if (metric === 'auto' || !metrics.some(function (x) { return x[0] === metric; })) metric = metrics[0][0];
    const metricName = (function () {
      const f = metrics.filter(function (x) { return x[0] === metric; })[0];
      return f ? f[1] : metrics[0][1];
    })();

    /* —— 工具条 —— */
    let h = '<section class="panel"><h3 class="mv-sec-title">数据统计</h3>' +
      '<p class="mv-sec-lead">先选运动模式，再看这个模式自己的指标、趋势和分布。卡片里改一条，这里立刻重算。</p>' +
      '<div class="stt-tool">' +
        '<div class="stt-chips">' +
          '<button type="button" class="stt-chip' + (modeKey ? '' : ' on') + '" data-act="move-stat-mode" data-v="">全部</button>' +
          Object.keys(MOVE_TYPES).map(function (k) {
            const t = MOVE_TYPES[k];
            /* 下线模式（游泳/瑜伽）只有存在历史记录时才占位置 */
            if (t.retired && !all.some(function (r) { return r.key === k; })) return '';
            /* v207：只列「用户真有的」模式 —— 之前列的是模式库全量：一个运动都没建也能看到
               7 个入口，点进去全是「这个周期还没有记录」（线上实测）。现在留两类：
               ① 已建的运动实例；② 有历史记录的模式（让老数据还能看）。 */
            if (!moveSports().some(function (sp) { return sp.key === k; }) &&
                !all.some(function (r) { return r.key === k; })) return '';
            return '<button type="button" class="stt-chip' + (modeKey === k ? ' on' : '') +
              '" data-act="move-stat-mode" data-v="' + k + '">' + esc(t.icon) + ' ' + esc(t.name) + '</button>';
          }).join('') +
        '</div>' +
        '<div class="stt-chips">' +
          MOVE_STAT_RANGES.map(function (r) {
            return '<button type="button" class="stt-chip sm' + (moveStatRange === r[0] ? ' on' : '') +
              '" data-act="move-stat-range" data-v="' + r[0] + '">' + r[1] + '</button>';
          }).join('') +
        '</div>' +
        '<p class="stt-range">' + from + ' → ' + to +
          (A.skip ? ' · 其中 <b>' + A.skip + '</b> 次跳过了数据记录：只计次数，不计入时长、距离、心率等详细数据' : '') + '</p>' +
      '</div>';

    /* —— KPI —— */
    const stepSport = sports.filter(function (s) { return moveTargetOf(s).k === 'steps'; })[0];
    const stepBound = stepSport ? (Number(stepSport.tVal) || 10000) : 10000;
    const maxSteps = list.reduce(function (mx, r) { return Math.max(mx, Number(r.steps) || 0); }, 0);
    const days = A.days || 1;
    let kpis = '';
    if (!modeKey) {
      kpis = moveStatKpiHtml(moveStatNum(A.n), '次', '记录次数', moveStatDeltaHtml(A.n, Pv.n)) +
        moveStatKpiHtml(moveStatNum(A.dur), '分钟', '运动时长', moveStatDeltaHtml(A.dur, Pv.dur)) +
        moveStatKpiHtml(moveStatNum(A.dist), '公里', '总距离', moveStatDeltaHtml(A.dist, Pv.dist)) +
        moveStatKpiHtml(moveStatNum(A.kcal), '千卡', '热量消耗', moveStatDeltaHtml(A.kcal, Pv.kcal)) +
        moveStatKpiHtml(moveStatNum(A.steps), '步', '累计步数', moveStatDeltaHtml(A.steps, Pv.steps)) +
        moveStatKpiHtml(moveStatNum(A.days), '天', '有记录的天数', moveStatDeltaHtml(A.days, Pv.days));
    } else if (modeKey === 'steps') {
      kpis = moveStatKpiHtml(moveStatNum(A.steps), '步', '累计步数', moveStatDeltaHtml(A.steps, Pv.steps)) +
        (moveStatRange === 'today'
          ? (A.steps >= stepBound
              ? moveStatKpiHtml('已达标', '', '目标 ' + moveStatNum(stepBound) + ' 步', '')
              : moveStatKpiHtml(moveStatNum(stepBound - A.steps), '步', '距 ' + moveStatNum(stepBound) + ' 步还差', ''))
          : moveStatKpiHtml(moveStatNum(A.steps / days), '步', '日均步数', moveStatDeltaHtml(A.steps / days, Pv.steps / Math.max(1, Pv.days || 1)))) +
        moveStatKpiHtml(moveStatNum(A.days), '天', '有记录的天数', '') +
        moveStatKpiHtml((A.distM / 1000).toFixed(1), '公里', '补录距离合计', '') +
        moveStatKpiHtml(moveStatNum(maxSteps), '步', '单次最多', '') +
        moveStatKpiHtml(moveStatNum(A.realN), '次', '打卡次数', moveStatDeltaHtml(A.realN, Pv.realN));
    } else if (modeKey === 'run' || modeKey === 'walk') {
      kpis = moveStatKpiHtml(moveStatNum(A.n), '次', '记录次数', moveStatDeltaHtml(A.n, Pv.n)) +
        moveStatKpiHtml(moveStatNum(A.dist), '公里', '总距离', moveStatDeltaHtml(A.dist, Pv.dist)) +
        moveStatKpiHtml(moveStatNum(A.dur), '分钟', '总时长', moveStatDeltaHtml(A.dur, Pv.dur)) +
        moveStatKpiHtml(A.pace, '/公里', '平均配速', '') +
        moveStatKpiHtml(A.cadAvg || '—', '步/分', '平均步频', '') +
        moveStatKpiHtml(A.heartAvg || '—', 'bpm', '平均心率', '');
    } else if (modeKey === 'ride') {
      kpis = moveStatKpiHtml(moveStatNum(A.n), '次', '记录次数', moveStatDeltaHtml(A.n, Pv.n)) +
        moveStatKpiHtml(moveStatNum(A.dist), '公里', '总里程', moveStatDeltaHtml(A.dist, Pv.dist)) +
        moveStatKpiHtml(moveStatNum(A.dur), '分钟', '总时长', moveStatDeltaHtml(A.dur, Pv.dur)) +
        moveStatKpiHtml(A.speedAvg || '—', 'km/h', '平均速度', '') +
        moveStatKpiHtml(A.cadAvg || '—', 'rpm', '平均踏频', '') +
        moveStatKpiHtml(A.heartAvg || '—', 'bpm', '平均心率', '');
    } else if (modeKey === 'rope') {
      kpis = moveStatKpiHtml(moveStatNum(A.n), '次', '记录次数', moveStatDeltaHtml(A.n, Pv.n)) +
        moveStatKpiHtml(moveStatNum(A.ropeCount), '下', '累计跳绳数', moveStatDeltaHtml(A.ropeCount, Pv.ropeCount)) +
        moveStatKpiHtml(A.rateAvg || '—', '下/分', '平均跳频', '') +
        moveStatKpiHtml(moveStatNum(A.dur), '分钟', '总时长', moveStatDeltaHtml(A.dur, Pv.dur)) +
        moveStatKpiHtml(moveStatNum(list.reduce(function (mx, r) { return Math.max(mx, Number(r.count) || 0); }, 0)), '下', '单次最多', '') +
        moveStatKpiHtml(A.heartAvg || '—', 'bpm', '平均心率', '');
    } else if (modeKey === 'strength') {
      kpis = moveStatKpiHtml(moveStatNum(A.n), '次', '训练次数', moveStatDeltaHtml(A.n, Pv.n)) +
        moveStatKpiHtml(moveStatNum(A.sets), '组', '累计组数', moveStatDeltaHtml(A.sets, Pv.sets)) +
        moveStatKpiHtml(moveStatNum(A.volume), 'kg', '训练容量', moveStatDeltaHtml(A.volume, Pv.volume)) +
        moveStatKpiHtml(moveStatNum(A.dur), '分钟', '总时长', moveStatDeltaHtml(A.dur, Pv.dur)) +
        moveStatKpiHtml(A.heartAvg || '—', 'bpm', '平均心率', '') +
        moveStatKpiHtml(moveStatNum(A.kcal), '千卡', '热量消耗', moveStatDeltaHtml(A.kcal, Pv.kcal));
    } else {
      kpis = moveStatKpiHtml(moveStatNum(A.n), '次', '打球次数', moveStatDeltaHtml(A.n, Pv.n)) +
        moveStatKpiHtml(moveStatNum(A.dur), '分钟', '总时长', moveStatDeltaHtml(A.dur, Pv.dur)) +
        moveStatKpiHtml(A.heartAvg || '—', 'bpm', '平均心率', '') +
        moveStatKpiHtml(moveStatNum(A.kcal), '千卡', '热量消耗', moveStatDeltaHtml(A.kcal, Pv.kcal)) +
        moveStatKpiHtml(moveStatNum(A.n / Math.max(1, Math.ceil(days / 7))), '次', '周均次数', '') +
        moveStatKpiHtml(moveStatNum(A.realN), '次', '有详细数据', '');
    }
    h += '<div class="stt-kpis">' + kpis + '</div></section>';

    /* —— 趋势 —— */
    const bs = moveStatBuckets(list, from, to, metric);
    h += '<section class="panel">' +
      '<div class="stt-head"><div><h3 class="mv-sec-title">' +
        (modeKey ? esc(T.name) : '全部运动') + ' · ' + esc(metricName) + '趋势</h3>' +
        '<p class="mv-sec-lead">' + bs.unit + ' · 共 ' + bs.values.length + ' 个点' +
        (moveStatRange === 'today' ? '（今天的记录按 2 小时分段）' : '（≤31 天按日、≤120 天按周、更久按月）') + '</p></div>' +
        '<div class="stt-chips">' + metrics.map(function (x) {
          return '<button type="button" class="stt-chip sm' + (metric === x[0] ? ' on red' : '') +
            '" data-act="move-stat-metric" data-v="' + x[0] + '">' + x[1] + '</button>';
        }).join('') + '</div></div>' +
      (bs.values.some(function (v) { return v > 0; })
        ? moveStatLineSvg(bs.values, bs.labels)
        : '<p class="stt-none">这个周期还没有记录。</p>') +
    '</section>';

    /* —— 热力图 + 周内分布 —— */
    const heatDays = 126;   /* v195：18 周（陛下选的乙案） */
    const recentCut = fmt(addDays(new Date(), -(heatDays - 1)));
    const recentList = base.filter(function (r) { return r.d >= recentCut; });
    const recentAgg = moveStatAgg(recentList);
    const todayDs = fmt(new Date());
    let heatMax = 1;
    const heatVals = {};
    Object.keys(recentAgg.byDay).forEach(function (d) {
      const v = moveStatDayScore(recentAgg.byDay[d]);
      heatVals[d] = v;
      if (v > heatMax) heatMax = v;
    });
    const wdNames = ['一', '二', '三', '四', '五', '六', '日'];
    const tWd = (new Date().getDay() + 6) % 7;
    /* v195：格子展平成一串（CSS grid 用 grid-auto-flow:column 自动按列填 7 行），
       列宽随卡片宽度自适应 → 18 列正好排满右侧；原来每列一个 div + 固定 14px 格子会空一大块。 */
    let heatCells = '';
    const startHeat = addDays(new Date(), -(heatDays - 1));
    const startWd = (startHeat.getDay() + 6) % 7;
    const gridStart = addDays(startHeat, -startWd);
    for (let i = 0; i < heatDays + startWd; i++) {
      const d = addDays(gridStart, i), ds = fmt(d);
      const v = heatVals[ds] || 0;
      const t = v / heatMax;
      const bg = v <= 0 ? 'var(--surface-3)' : 'rgba(220,38,38,' + (0.12 + t * 0.72).toFixed(2) + ')';
      heatCells += '<i class="stt-cell' + (ds === todayDs ? ' m' : '') + '" style="background:' + bg +
        '" title="' + ds + ' · ' + (v ? moveStatNum(v) + ' 分钟' : '没有记录') + '"></i>';
    }
    /* 周内分布：近 8 周，每周一~周日「平均每天运动多少分钟」 */
    const wdSum = [0, 0, 0, 0, 0, 0, 0];
    for (let i = 0; i < 56; i++) {
      const d = addDays(new Date(), -i), ds = fmt(d);
      wdSum[(d.getDay() + 6) % 7] += moveStatDayScore(recentAgg.byDay[ds]);
    }
    const wdAvg = wdSum.map(function (s) { return s / 8; });
    h += '<div class="stt-grid2">' +
      '<section class="panel"><h3 class="mv-sec-title">月历热力图</h3>' +
        '<p class="mv-sec-lead">近 18 周 · 深色＝当天运动量大（分钟；纯步数的天按 100 步≈1 分钟折算）</p>' +
        '<div class="stt-heat"><div class="stt-wl">' +
          wdNames.map(function (x) { return '<span>' + x + '</span>'; }).join('') +
        '</div><div class="stt-hgrid">' + heatCells + '</div></div>' +
        '<p class="stt-legend">少' +
          ['rgba(220,38,38,.12)', 'rgba(220,38,38,.3)', 'rgba(220,38,38,.5)', 'rgba(220,38,38,.7)', 'rgba(220,38,38,.9)']
            .map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') +
          '多<span>描边那格是今天</span></p>' +
      '</section>' +
      '<section class="panel"><h3 class="mv-sec-title">周内分布</h3>' +
        '<p class="mv-sec-lead">近 8 周平均每天运动多少分钟 · 周' + wdNames[tWd] + ' 是今天</p>' +
        moveStatBarsHtml(wdAvg.map(function (v, i) {
          return { l: '周' + wdNames[i], v: Math.round(v * 10) / 10, hot: i === tWd };
        }), { h: 78 }) +
      '</section></div>';

    /* —— 时段 + 模式构成 / 本期对比 —— */
    h += '<div class="stt-grid2">' +
      '<section class="panel"><h3 class="mv-sec-title">时段分布</h3>' +
        '<p class="mv-sec-lead">按开始时间，每 2 小时一段</p>' +
        moveStatBarsHtml(A.hours.map(function (v, i) { return { l: MOVE_STAT_HLAB[i], v: v }; }), { h: 72, tight: true }) +
      '</section>';
    if (!modeKey) {
      const items = Object.keys(A.byMode).map(function (k) {
        return { l: MOVE_TYPES[k].name, icon: MOVE_TYPES[k].icon, v: A.byMode[k].n, color: MOVE_TYPES[k].color, tag: A.byMode[k].skip ? '跳 ' + A.byMode[k].skip : '' };
      }).sort(function (a, b) { return b.v - a.v; });
      h += '<section class="panel"><h3 class="mv-sec-title">模式构成</h3>' +
        '<p class="mv-sec-lead">按记录次数' + (A.skip ? ' · 「跳 N」表示该模式有 N 次跳过了数据记录' : '') + '</p>' +
        (items.length ? moveStatRankHtml(items, ' 次') : '<p class="stt-none">这个周期还没有记录。</p>') +
      '</section>';
    } else {
      const pickVal = function (o) {
        if (modeKey === 'steps') return o.steps;
        if (modeKey === 'strength') return o.volume;
        if (modeKey === 'rope') return o.ropeCount;
        return o.dur || o.n;
      };
      const a1 = pickVal(A), a2 = pickVal(Pv);
      const unit = modeKey === 'steps' ? ' 步' : (modeKey === 'strength' ? ' kg' : (modeKey === 'rope' ? ' 下' : ' 分钟'));
      const chg = a2 > 0 ? ((a1 - a2) / a2 * 100) : 0;
      h += '<section class="panel"><h3 class="mv-sec-title">本期 vs 上期</h3>' +
        '<p class="mv-sec-lead">' + esc(T.name) + ' · 与上一个同长度周期比（' + pFrom + ' → ' + pTo + '）</p>' +
        '<div class="stt-rank">' +
          '<div class="rk"><span class="nm">本期</span><span class="tr"><span class="fl" style="width:' +
            Math.round(a1 / Math.max(1, a1, a2) * 100) + '%;background:var(--accent)"></span></span>' +
            '<span class="vl">' + moveStatNum(a1) + unit + '</span></div>' +
          '<div class="rk"><span class="nm">上期</span><span class="tr"><span class="fl" style="width:' +
            Math.round(a2 / Math.max(1, a1, a2) * 100) + '%;background:var(--chart-3)"></span></span>' +
            '<span class="vl">' + moveStatNum(a2) + unit + '</span></div>' +
          '<div class="rk"><span class="nm">变化</span><span class="tr" style="background:transparent"></span>' +
            '<span class="vl">' + (a2 > 0 ? (chg >= 0 ? '+' : '') + chg.toFixed(0) + '%' : '—') + '</span></div>' +
        '</div></section>';
    }
    h += '</div>';

    /* —— 专项 —— */
    const cards = [];
    const realList = list.filter(function (r) { return !r.skipped; });
    /* 全部模式下只给「本周期真的有记录」的模式出专项卡，否则跳绳/球类这些没练的日子会挂一堆空卡 */
    const hasMode = function (k) { return list.some(function (r) { return r.key === k; }); };
    /* 近 14 天逐日步数（步数相关都用得到） */
    const last14 = [];
    for (let i = 13; i >= 0; i--) {
      const ds = fmt(addDays(new Date(), -i));
      last14.push({ d: ds, v: (A.byDay[ds] ? A.byDay[ds].steps : 0) });
    }
    if (modeKey === 'steps' || (!modeKey && hasMode('steps'))) {
      const stepsBase = modeKey === 'steps' ? base : all.filter(function (r) { return r.key === 'steps'; });
      const cut = fmt(addDays(new Date(), -13));
      const perDay = {};
      stepsBase.forEach(function (r) {
        if (r.d < cut) return;
        perDay[r.d] = (perDay[r.d] || 0) + (Number(r.steps) || 0);
      });
      const vals = Object.keys(perDay).map(function (k) { return perDay[k]; });
      const tiers = [
        { l: '<5 千', lo: 0, hi: 5000 }, { l: '5–8 千', lo: 5000, hi: 8000 },
        { l: '8–10 千', lo: 8000, hi: 10000 }, { l: '10–15 千', lo: 10000, hi: 15000 },
        { l: '>15 千', lo: 15000, hi: 1e9 }
      ].map(function (t) {
        const n = vals.filter(function (v) { return v > 0 && v >= t.lo && v < t.hi; }).length;
        return { l: t.l, v: n, t: n + ' 天' };
      });
      const metN = vals.filter(function (v) { return v >= stepBound; }).length;
      const hasN = vals.filter(function (v) { return v > 0; }).length;
      cards.push('<div class="stt-spec"><h4>👟 步数档位（近 14 天）</h4>' + moveStatDistHtml(tiers) + '</div>');
      cards.push('<div class="stt-spec"><h4>🎯 达标情况</h4><div class="stt-ringbox">' +
        moveStatRingHtml(hasN ? metN / hasN * 100 : 0, 'var(--accent)', '达标') +
        '<div><div class="kv"><span>达标天数</span><b>' + metN + ' / ' + (hasN || 0) + ' 天</b></div>' +
        '<div class="kv"><span>日均</span><b>' + moveStatNum(hasN ? vals.reduce(function (s, v) { return s + v; }, 0) / hasN : 0) + ' 步</b></div>' +
        '<div class="kv"><span>最高单日</span><b>' + moveStatNum(vals.length ? Math.max.apply(null, vals) : 0) + ' 步</b></div></div>' +
      '</div></div>');
      cards.push('<div class="stt-spec"><h4>📈 近 14 天步数</h4>' +
        moveStatMiniSvg(last14.map(function (x) { return x.v; }), 'var(--accent)') +
        '<div class="kv"><span>补录距离</span><b>' + (A.distM / 1000).toFixed(2) + ' 公里</b></div>' +
      '</div>');
    }
    if (modeKey === 'run' || modeKey === 'walk' || (!modeKey && (hasMode('run') || hasMode('walk')))) {
      const paces = realList.filter(function (r) { return /^\d+:[0-5]\d$/.test(String(r.pace || '')); });
      const secs = paces.map(function (r) {
        const p = String(r.pace).split(':');
        return (+p[0]) * 60 + (+p[1]);
      });
      const zones = [0, 0, 0, 0];
      realList.forEach(function (r) {
        const hre = Number(r.heart) || 0;
        if (!hre) return;
        if (hre < 130) zones[0]++; else if (hre < 145) zones[1]++; else if (hre < 158) zones[2]++; else zones[3]++;
      });
      cards.push('<div class="stt-spec"><h4>⏱️ 配速趋势（越往下越快）</h4>' +
        moveStatMiniSvg(secs.slice(-14).map(function (s) { return -s; }), 'var(--text)') +
        '<div class="kv"><span>平均配速</span><b>' + A.pace + ' /公里</b></div>' +
        '<div class="kv"><span>最快一次</span><b>' + (secs.length
          ? (function () { const s = Math.min.apply(null, secs); return Math.floor(s / 60) + ':' + pad2(s % 60); })()
          : '—') + '</b></div></div>');
      cards.push('<div class="stt-spec"><h4>❤️ 心率区间</h4>' + moveStatDistHtml([
        { l: '轻松 <130', v: zones[0], t: zones[0] + ' 次' },
        { l: '有氧 130–144', v: zones[1], t: zones[1] + ' 次' },
        { l: '阈值 145–157', v: zones[2], t: zones[2] + ' 次' },
        { l: '无氧 ≥158', v: zones[3], t: zones[3] + ' 次' }
      ]) + '</div>');
      if (!modeKey) {
        const strides = realList.filter(function (r) { return Number(r.stride); });
        cards.push('<div class="stt-spec"><h4>👟 步频 / 步幅</h4>' +
          '<div class="kv"><span>平均步频</span><b>' + (A.cadAvg || '—') + ' 步/分</b></div>' +
          '<div class="kv"><span>平均步幅</span><b>' + (strides.length
            ? Math.round(strides.reduce(function (s, r) { return s + Number(r.stride); }, 0) / strides.length)
            : '—') + ' 厘米</b></div></div>');
      }
    }
    if (modeKey === 'ride' || (!modeKey && hasMode('ride'))) {
      const sp = realList.filter(function (r) { return Number(r.speed); }).map(function (r) { return Number(r.speed); });
      const km = realList.map(function (r) { return moveStatKm(r); });
      cards.push('<div class="stt-spec"><h4>🚴 速度趋势（km/h）</h4>' + moveStatMiniSvg(sp.slice(-14), '#5b7fb3') +
        '<div class="kv"><span>平均速度</span><b>' + (A.speedAvg || '—') + ' km/h</b></div>' +
        '<div class="kv"><span>平均踏频</span><b>' + (A.cadAvg || '—') + ' rpm</b></div></div>');
      cards.push('<div class="stt-spec"><h4>📍 里程分布</h4>' + moveStatDistHtml([
        { l: '<10 km', v: km.filter(function (x) { return x < 10; }).length, t: km.filter(function (x) { return x < 10; }).length + ' 次' },
        { l: '10–20', v: km.filter(function (x) { return x >= 10 && x < 20; }).length, t: km.filter(function (x) { return x >= 10 && x < 20; }).length + ' 次' },
        { l: '20–30', v: km.filter(function (x) { return x >= 20 && x < 30; }).length, t: km.filter(function (x) { return x >= 20 && x < 30; }).length + ' 次' },
        { l: '≥30 km', v: km.filter(function (x) { return x >= 30; }).length, t: km.filter(function (x) { return x >= 30; }).length + ' 次' }
      ], '#5b7fb3') + '</div>');
    }
    if (modeKey === 'rope' || (!modeKey && hasMode('rope'))) {
      const rates = realList.filter(function (r) { return Number(r.ropeRate); }).map(function (r) { return Number(r.ropeRate); });
      const tiers = [
        { l: '<1 千', lo: 0, hi: 1000 }, { l: '1–2 千', lo: 1000, hi: 2000 },
        { l: '2–3 千', lo: 2000, hi: 3000 }, { l: '≥3 千', lo: 3000, hi: 1e9 }
      ].map(function (t) {
        const n = realList.filter(function (r) { return (Number(r.count) || 0) >= t.lo && (Number(r.count) || 0) < t.hi; }).length;
        return { l: t.l, v: n, t: n + ' 次' };
      });
      cards.push('<div class="stt-spec"><h4>🪢 跳频趋势（下/分）</h4>' + moveStatMiniSvg(rates.slice(-14), '#c07a3a') +
        '<div class="kv"><span>平均跳频</span><b>' + (A.rateAvg || '—') + ' 下/分</b></div>' +
        '<div class="kv"><span>累计跳绳</span><b>' + moveStatNum(A.ropeCount) + ' 下</b></div></div>');
      cards.push('<div class="stt-spec"><h4>🔢 单次数量分布</h4>' + moveStatDistHtml(tiers, '#c07a3a') + '</div>');
    }
    if (modeKey === 'strength' || (!modeKey && hasMode('strength'))) {
      const vol = realList.map(function (r) { return moveStatVolume(r); });
      const rests = realList.filter(function (r) { return Number(r.rest); }).map(function (r) { return Number(r.rest); });
      const wts = realList.filter(function (r) { return Number(r.weight); }).map(function (r) { return Number(r.weight); });
      cards.push('<div class="stt-spec"><h4>🏋️ 训练容量趋势（kg）</h4>' + moveStatMiniSvg(vol.slice(-14), '#8a6a3a') +
        '<div class="kv"><span>本期容量</span><b>' + moveStatNum(A.volume) + ' kg</b></div>' +
        '<div class="kv"><span>单次最大</span><b>' + moveStatNum(vol.length ? Math.max.apply(null, vol) : 0) + ' kg</b></div></div>');
      cards.push('<div class="stt-spec"><h4>⏸️ 组间休息 / 负重</h4>' +
        '<div class="kv"><span>平均组间休息</span><b>' + (rests.length ? Math.round(rests.reduce(function (s, v) { return s + v; }, 0) / rests.length) : '—') + ' 秒</b></div>' +
        '<div class="kv"><span>平均负重</span><b>' + (wts.length ? Math.round(wts.reduce(function (s, v) { return s + v; }, 0) / wts.length) : '—') + ' kg</b></div>' +
        '<div class="kv"><span>累计组数</span><b>' + moveStatNum(A.sets) + ' 组</b></div></div>');
    }
    if (modeKey === 'ball' || (!modeKey && hasMode('ball'))) {
      const zone = {};
      realList.forEach(function (r) { if (r.hrZone) zone[r.hrZone] = (zone[r.hrZone] || 0) + 1; });
      const zk = Object.keys(zone);
      const avgs = realList.filter(function (r) { return Number(r.heartAvg); }).map(function (r) { return Number(r.heartAvg); });
      cards.push('<div class="stt-spec"><h4>❤️ 心率区间构成</h4>' +
        (zk.length ? moveStatDistHtml(zk.map(function (k) { return { l: k, v: zone[k], t: zone[k] + ' 次' }; }), '#a35b7a')
          : '<p class="stt-none">还没有记录心率区间。</p>') +
        '<div class="kv"><span>平均心率</span><b>' + (A.heartAvg || '—') + ' bpm</b></div></div>');
      cards.push('<div class="stt-spec"><h4>📈 平均心率趋势</h4>' + moveStatMiniSvg(avgs.slice(-14), '#a35b7a') +
        '<div class="kv"><span>最高一次</span><b>' + (avgs.length ? Math.max.apply(null, avgs) : '—') + ' bpm</b></div></div>');
    }
    if (modeKey) {
      const durs = realList.map(function (r) { return Number(r.dur) || 0; });
      cards.push('<div class="stt-spec"><h4>📊 单次时长分布</h4>' + moveStatDistHtml([
        { l: '<30 分', v: durs.filter(function (v) { return v > 0 && v < 30; }).length, t: durs.filter(function (v) { return v > 0 && v < 30; }).length + ' 次' },
        { l: '30–60', v: durs.filter(function (v) { return v >= 30 && v < 60; }).length, t: durs.filter(function (v) { return v >= 30 && v < 60; }).length + ' 次' },
        { l: '60–90', v: durs.filter(function (v) { return v >= 60 && v < 90; }).length, t: durs.filter(function (v) { return v >= 60 && v < 90; }).length + ' 次' },
        { l: '≥90 分', v: durs.filter(function (v) { return v >= 90; }).length, t: durs.filter(function (v) { return v >= 90; }).length + ' 次' }
      ], T.color) + '</div>');
    }
    if (cards.length) {
      h += '<section class="panel"><h3 class="mv-sec-title">专项数据</h3>' +
        '<p class="mv-sec-lead">' + (modeKey
          ? esc(T.name) + ' 支持的字段：' + (T.fields || []).map(function (f) { return MOVE_FIELD_CN[f.k] || f.n; }).join(' / ')
          : '只显示本周期有记录的模式（步数 / 跑步 / 骑行 / 跳绳 / 力量 / 球类）') + '</p>' +
        '<div class="stt-specs">' + cards.join('') + '</div></section>';
    }

    /* —— 记录质量 + 最近记录 —— */
    let streak = 0;
    for (let i = 0; i < 200; i++) {
      const ds = fmt(addDays(new Date(), -i));
      const has = base.some(function (r) { return r.d === ds; });
      if (has) streak++;
      else if (i > 0 || !has) break;
    }
    const skipPct = A.n ? Math.round(A.skip / A.n * 100) : 0;
    const recent = list.slice().sort(function (x, y) {
      const kx = x.d + (x.at || ''), ky = y.d + (y.at || '');
      return kx < ky ? -1 : (kx > ky ? 1 : 0);
    }).slice(-8).reverse();
    h += '<div class="stt-grid2">' +
      '<section class="panel"><h3 class="mv-sec-title">记录质量</h3>' +
        '<p class="mv-sec-lead">有多少次跳过了记录</p>' +
        '<div class="stt-q">' +
          '<div class="q"><span>记录总数</span><b>' + A.n + ' 次</b></div>' +
          '<div class="q"><span>有详细数据</span><b>' + A.realN + ' 次</b></div>' +
          '<div class="q"><span>跳过未记录</span><b>' + A.skip + ' 次' +
            (skipPct ? ' <i class="stt-tag">' + skipPct + '%</i>' : '') + '</b></div>' +
          '<div class="q"><span>还没填数据</span><b>' + A.pending + ' 次</b></div>' +
          '<div class="q"><span>当前连续有记录</span><b>' + streak + ' 天</b></div>' +
          '<div class="q"><span>有记录的天数</span><b>' + A.days + ' 天</b></div>' +
        '</div></section>' +
      '<section class="panel"><h3 class="mv-sec-title">最近记录</h3>' +
        '<p class="mv-sec-lead">' + (modeKey ? esc(T.name) : '全部模式') + ' · 最近 8 条</p>' +
        (recent.length ? '<div class="stt-recs">' + recent.map(function (r) {
          const TT = MOVE_TYPES[r.key];
          const bits = [];
          if (Number(r.steps)) bits.push(moveStatNum(r.steps) + ' 步');
          if (Number(r.dur)) bits.push(r.dur + ' 分钟');
          if (Number(r.dist)) bits.push((Math.round(moveStatKm(r) * 10) / 10) + ' 公里');
          if (Number(r.count)) bits.push(moveStatNum(r.count) + ' 下');
          if (r.pace) bits.push(r.pace + ' /公里');
          if (Number(r.distM)) bits.push('距离 ' + moveStatNum(r.distM) + ' 米');
          return '<div class="rr"><span class="ic">' + esc(TT.icon) + '</span>' +
            '<span class="dd">' + esc(r.d.slice(5)) + ' ' + esc(moveRecHM(r)) + '</span>' +
            '<span class="vv">' + esc(r.skipped ? '跳过未记录' : (bits.join(' · ') || '无详细数据')) + '</span>' +
            '<span class="nm">' + esc(TT.name) + '</span></div>';
        }).join('') + '</div>' : '<p class="stt-none">这个周期还没有记录。</p>') +
      '</section></div>';

    if (sports.length === 0) {
      h += '<p class="mv-sec-lead" style="margin-top:12px">还没有运动实例，先点「＋ 新建运动」添加一项。</p>';
    }
    return h;
  }

  /* 运动明细：全部记录，可改可删（改完卡片与统计一起重算） */
  /* v184：页面底部的「运动明细」总表撤掉了 —— 记录改为在每张卡片里看
     （【今日任务记录】），补数据也从卡片进，两件事不再混在一个区块里。
     要手动补录一条历史记录，用页头的「＋ 添加记录」。 */
  function moveNotifyHtml(m) {
    /* v216：实例通知设置的真源在板块矩阵——打开运动页就拉一次（弹窗初值要用） */
    if (m.notify !== false && notifyRoute === undefined) notifyRouteLoad();
    /* v177：渠道选择不再放这里（新建 / 编辑运动弹窗里已经选过，页面重复）。
       这里只留总开关与提醒场景；渠道到底能不能收到，取决于「配置」页里的真实配置，
       勾选时弹窗会当场检测并提示。 */
    return '<section class="panel"><h3 class="mv-sec-title">运动提醒</h3>' +
      '<p class="mv-sec-lead">提醒渠道在「新建 / 编辑运动」里选择，这里只设置提醒场景。</p>' +
      '<form id="move-notify-form">' +
        '<div class="mv-toggle-row"><div><b>开启运动提醒</b><small>关闭后不推送任何运动通知</small></div>' +
          '<label class="w-switch"><input type="checkbox" name="notify"' + (m.notify !== false ? ' checked' : '') + '><i></i></label></div>' +
        /* v216：撤掉三个「提醒场景」勾选框——后端从未实现（notifyScenes 全项目只有前端写入），
           留着就是假的承诺。到点提醒真实存在；周报等真做时再给入口。 */
        '<div id="move-notify-body"' + (m.notify !== false ? '' : ' class="w-notify-off"') + '>' +
          '<p class="w-freq-note">每个运动的开关与渠道在「新建 / 编辑运动」里设置；' +
            '渠道与「通知路由」页是同一份设置，两边改都生效。</p>' +
        '</div>' +
        '<div class="w-save"><button type="submit" class="btn primary">保存提醒设置</button></div>' +
      '</form>' +
    '</section>';
  }

  function viewMove() {
    const m = moveModule();
    return '<div class="move-page">' +
      moveHead(m) +
      moveSportsHtml(m) +
      moveStatsHtml(m) +
      moveNotifyHtml(m) +
    '</div>';
  }
  /* v192：统计页的「喝水」块 —— 原来只有「今日 + 本周/本月达标 + 累计毫升」，
     喝水页里那套统计（完成度、连续达标、时段分布）进不来。这里搬过来，
     并跟随统计页右上角的 7 / 30 / 90 天切换；公式与喝水页完全一致：
     达标 = 当天毫升 ≥ 目标总量，完成度按天平均，时段分布按每次喝水的记录时间归类。 */
  function statsWaterPanel(h, range) {
    const d = todayStr();
    const ok = met(h, d);
    const goal = waterGoalMl(h) || 1;
    const todayMl = Math.round(waterMlOf(h, countOf(d, h.id)));
    const week = weekDaysOf(h).filter(function (x) { return x.done; }).length;
    const ym = d.slice(0, 7);
    let month = 0, totalMl = 0;
    Object.keys(state.checks || {}).forEach(function (ds) {
      totalMl += waterMlOf(h, countOf(ds, h.id));
      if (ds.slice(0, 7) === ym && met(h, ds)) month++;
    });

    const R = [0, 7, 30, 90].indexOf(Number(range)) >= 0 ? Number(range) : 30;  /* v203：0 = 全部 */
    const rLab = R ? '近 ' + R + ' 天' : '全部';
    const days = statsRangeDays(R);
    const labels = [], mlByDay = [];
    let metN = 0;
    days.forEach(function (ds) {
      labels.push(ds.slice(5));
      const ml = Math.round(waterMlOf(h, countOf(ds, h.id)));
      mlByDay.push(ml);
      if (met(h, ds)) metN++;
    });
    const sum = mlByDay.reduce(function (a, b) { return a + b; }, 0);
    /* v203：全部档的分母用「有记录的天数」，与 478 页内「全部」同口径；近 N 天仍除以 N */
    const base = R ? days.length : (days.filter(hasRecords).length || 1);
    const avg = Math.round(sum / base);
    const rate = Math.round(metN / base * 100);
    const maxMl = Math.max.apply(null, mlByDay.concat([0]));
    const streak = streakOn(h, d);
    const WLAB = ['6–9 时', '9–12 时', '12–14 时', '14–17 时', '17–20 时', '20–23 时'];
    const buckets = waterHourBuckets(h, R);

    return '<div class="panel">' +
      '<div class="shead"><h3>喝水 <span class="muted-sm">（今日 · 计入完成率）</span></h3>' +
        '<button type="button" class="btn sm" data-act="water-goto">完整统计 →</button></div>' +
      '<div class="module-rows">' +
        '<div class="ms-row' + (ok ? ' ok' : '') + '">' +
          '<span class="ms-name"><span class="ms-ico" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '') + '</span>今日</span>' +
          '<span class="ms-val">' + todayMl + ' / ' + goal + ' ml</span>' +
        '</div>' +
      '</div>' +
      '<div class="module-sum" style="margin-top:12px">' +
        '<div class="ms-box"><b>' + week + '</b><span>本周达标天数</span></div>' +
        '<div class="ms-box"><b>' + month + '</b><span>本月达标天数</span></div>' +
        '<div class="ms-box"><b>' + Math.round(totalMl).toLocaleString() + '</b><span>累计毫升</span></div>' +
      '</div>' +
      '<div class="stt-kpis">' +
        moveStatKpiHtml(moveStatNum(sum), 'ml', rLab + '累计', '') +
        moveStatKpiHtml(moveStatNum(avg), 'ml', '日均', '') +
        moveStatKpiHtml(String(metN), '天', '达标天数', '') +
        moveStatKpiHtml(String(rate), '%', '达标率', '') +
        moveStatKpiHtml(moveStatNum(maxMl), 'ml', '单日最高', '') +
        moveStatKpiHtml(String(streak), '天', '连续达标', '') +
      '</div>' +
      '<div class="stt-grid2 stt-fill" style="margin-top:16px">' +
        '<div><h4 class="stt-sub">每日喝水 <span class="stt-sub-n">毫升 · ' + rLab + ' · 目标 ' + goal + ' ml</span></h4>' +
          moveStatLineSvg(mlByDay, labels, { labelStep: R <= 7 ? 1 : (R <= 30 ? 5 : 15) }) + '</div>' +
        '<div><h4 class="stt-sub">喝水时段 <span class="stt-sub-n">' + rLab + ' · 杯</span></h4>' +
          moveStatBarsHtml(buckets.map(function (v, i) { return { l: WLAB[i], v: v }; }), { fill: true }) + '</div>' +
      '</div>' +
      '<p class="stt-none" style="margin-top:10px">达标算法：当天喝水量 ≥ 目标总量（当前 ' + goal +
        ' ml）即达标；日均与达标率都按「' + rLab + '」整段算，没有记录的日子计 0。</p>' +
    '</div>';
  }

  /* v194：统计页的「478呼吸法」块 —— 与喝水块同构：今日 + 考核三块 + 近 N 天 KPI + 每日趋势 + 算法说明。
     口径：达标 = 当天完成组数 ≥ 每天几组；呼吸次数 = 组数 × 每组循环次数（当前设置折算历史）。 */
  function statsBreathePanel(h, range) {
    const d = todayStr();
    const ok = met(h, d);
    const target = Math.max(1, Number(h.target) || 1);
    const todayN = countOf(d, h.id);
    /* v203：统计页的 478 块与 478 页内**完全一致** —— 直接复用 breatheStatsBody()。
       只保留「今日」这一行（统计页各块统一的入口），其余指标/趋势/算法说明都由 body 产出。 */
    const R = [0, 7, 30, 90].indexOf(Number(range)) >= 0 ? Number(range) : 30;
    return '<div class="panel">' +
      '<div class="shead"><h3>478呼吸法 <span class="muted-sm">（今日 · 计入完成率）</span></h3>' +
        '<button type="button" class="btn sm" data-act="breathe-goto">去 478 页 →</button></div>' +
      '<div class="module-rows">' +
        '<div class="ms-row' + (ok ? ' ok' : '') + '">' +
          '<span class="ms-name"><span class="ms-ico" style="--hc:' + esc(h.color || '#5b8f8a') + '">' +
            esc(h.icon || '🌬️') + '</span>今日</span>' +
          '<span class="ms-val">' + todayN + ' / ' + target + ' 组</span>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:14px">' + breatheStatsBody(h, R) + '</div>' +
    '</div>';
  }

  /* v191：统计页的「运动」块 —— 原来只有「今日 + 本周/本月达标天数 + 累计次数」，
     而运动早已按模式记录（距离 / 时长 / 配速 / 组数…），那些数全憋在运动页里。
     这里补上近 N 天（跟随统计页右上角 7/30/90 天）的关键指标、各模式明细与趋势；
     口径与运动页完全一致：距离折公里、跳过只计次数；可交互的完整版仍在运动页。 */
  function statsMovePanel(h, range) {
    const d = todayStr();
    const ok = met(h, d);
    const sports = moveSports();
    const doneN = sports.filter(function (s) { return moveSportDone(s, d); }).length;
    const allRest = sports.length > 0 && sports.every(function (s) { return moveIsRestOn(s, d); });
    const todayVal = doneN > 0 ? ('完成 ' + doneN + ' 项')
      : allRest ? '今日无需运动'
        : (moveMet(d) ? '已达标' : '还没运动');
    /* 坚持小结：沿用旧口径（计入完成率的那一套），别和下面按记录算的指标混为一谈 */
    const week = weekDaysOf(h).filter(function (x) { return x.done; }).length;
    const ym = d.slice(0, 7);
    const daySet = {};
    Object.keys(state.checks || {}).forEach(function (ds) { daySet[ds] = 1; });
    moveRecords().forEach(function (r) { if (r && r.d) daySet[r.d] = 1; });
    let month = 0;
    Object.keys(daySet).forEach(function (ds) { if (ds.slice(0, 7) === ym && moveMet(ds)) month++; });
    const totalN = moveRecords().length;

    const R = [0, 7, 30, 90].indexOf(Number(range)) >= 0 ? Number(range) : 30;  /* v203：0 = 全部 */
    const rLab = R ? '近 ' + R + ' 天' : '全部';
    /* v203：全部档用「从最早记录到今天」的日期集合，不再按天数往回数 */
    const from = R ? fmt(addDays(new Date(), -(R - 1))) : statsRangeDays(0)[0];
    const list = moveRecords().filter(function (r) {
      return r && MOVE_TYPES[r.key] && r.d >= from && r.d <= d;
    });
    const A = moveStatAgg(list);

    let detail = '';
    if (!list.length) {
      detail = '<p class="stt-none">' + rLab + ' 还没有运动记录。' +
        '在运动页点「＋ 新建运动」开始记录，或点右上角「＋ 添加记录」补一条。</p>';
    } else {
      /* 按模式：次数 + 距离/时长 + 最近一次 */
      const modes = Object.keys(A.byMode).map(function (k) {
        const o = A.byMode[k];
        const last = list.filter(function (r) { return r.key === k; })
          .map(function (r) { return r.d; }).sort().pop() || '';
        const bits = [o.n + ' 次'];
        if (o.dist > 0) bits.push((Math.round(o.dist * 10) / 10) + ' 公里');
        if (o.dur > 0) bits.push(Math.round(o.dur) + ' 分钟');
        return { k: k, n: o.n, html: '<div class="stt-mrow">' +
          '<span class="ic">' + esc(MOVE_TYPES[k].icon) + '</span>' +
          '<span class="nm">' + esc(MOVE_TYPES[k].name) + '</span>' +
          '<span class="vv">' + esc(bits.join(' · ')) + '</span>' +
          '<span class="rt">' + (last ? '最近 ' + esc(last.slice(5)) : '') + '</span></div>' };
      }).sort(function (a, b) { return b.n - a.n; });

      /* 趋势：有详细时长的按时长画；只有步数时按步数画，避免画出一条全 0 的直线 */
      const metric = A.dur > 0 ? 'dur' : 'steps';
      const metricName = metric === 'dur' ? '运动时长（分钟）' : '步数';
      const bs = moveStatBuckets(list, from, d, metric);
      const lstep = R <= 7 ? 1 : (R <= 30 ? 5 : 15);

      detail =
        '<div class="stt-grid2" style="margin-top:16px">' +
          '<div><h4 class="stt-sub">按运动模式 <span class="stt-sub-n">' + rLab + '</span></h4>' +
            '<div class="stt-mrows">' + modes.map(function (m) { return m.html; }).join('') + '</div></div>' +
          '<div><h4 class="stt-sub">' + esc(metricName) + '趋势 <span class="stt-sub-n">' + bs.unit + '</span></h4>' +
            moveStatLineSvg(bs.values, bs.labels, { labelStep: lstep }) + '</div>' +
        '</div>';
    }

    return '<div class="panel">' +
      '<div class="shead"><h3>运动 <span class="muted-sm">（今日 · 计入完成率）</span></h3>' +
        '<button type="button" class="btn sm" data-act="move-goto">完整统计 →</button></div>' +
      '<div class="module-rows">' +
        '<div class="ms-row' + (ok ? ' ok' : '') + '">' +
          '<span class="ms-name"><span class="ms-ico" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '') + '</span>今日</span>' +
          '<span class="ms-val">' + todayVal + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="module-sum" style="margin-top:12px">' +
        '<div class="ms-box"><b>' + week + '</b><span>本周达标天数</span></div>' +
        '<div class="ms-box"><b>' + month + '</b><span>本月达标天数</span></div>' +
        '<div class="ms-box"><b>' + totalN + '</b><span>累计运动次数</span></div>' +
      '</div>' +
      (list.length
        ? '<div class="stt-kpis">' +
            moveStatKpiHtml(moveStatNum(A.n), '次', '记录次数', '') +
            moveStatKpiHtml(moveStatNum(A.dur), '分钟', '运动时长', '') +
            moveStatKpiHtml(moveStatNum(A.dist), '公里', '总距离', '') +
            moveStatKpiHtml(moveStatNum(A.kcal), '千卡', '热量消耗', '') +
            moveStatKpiHtml(moveStatNum(A.steps), '步', '累计步数', '') +
            moveStatKpiHtml(moveStatNum(A.days), '天', '有记录的天数', '') +
          '</div>'
        : '') +
      detail +
    '</div>';
  }

  /* 统计页：喝火 / 运动 / 478 各成一块（v172）。
     原来塞在一个「健康模块」合并面板里，按陛下要求拆开，与「用药」一样独立成块。
     戒烟不在这里——统计页已有专属「戒烟」块（qhSum），不再重复。
     每块 = 今日进度一行 + 坚持小结（本周达标 / 本月达标 / 累计）。 */
  function moduleStatPanel(key, range) {
    const h = moduleAsHabit(key);
    const d = todayStr();
    const label = MODULE_LABEL[key] || '模块';
    /* 喝水和运动各自成一块（内容比 478 多），各自走独立面板 */
    if (key === 'move') return statsMovePanel(h, range);
    if (key === 'water') return statsWaterPanel(h, range);
    if (key === 'breathe') return statsBreathePanel(h, range);
    const ok = met(h, d);
    let todayVal = countOf(d, h.id) + ' / ' + (Number(h.target) || 1) + ' ' + (h.unit || '次');
    const week = weekDaysOf(h).filter(function (x) { return x.done; }).length;
    const ym = d.slice(0, 7);
    let month = 0;
    Object.keys(state.checks || {}).forEach(function (ds) {
      if (ds.slice(0, 7) === ym && met(h, ds)) month++;
    });
    const total = habitTotalCount(h);
    const totalLabel = '累计 ' + (h.unit || '次');
    return '<div class="panel">' +
      '<div class="shead"><h3>' + esc(label) + ' <span class="muted-sm">（今日 · 计入完成率）</span></h3></div>' +
      '<div class="module-rows">' +
        '<div class="ms-row' + (ok ? ' ok' : '') + '">' +
          '<span class="ms-name"><span class="ms-ico" style="--hc:' + esc(h.color || '#2f6f5e') + '">' + esc(h.icon || '') + '</span>今日</span>' +
          '<span class="ms-val">' + todayVal + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="module-sum" style="margin-top:12px">' +
        '<div class="ms-box"><b>' + week + '</b><span>本周达标天数</span></div>' +
        '<div class="ms-box"><b>' + month + '</b><span>本月达标天数</span></div>' +
        '<div class="ms-box"><b>' + total + '</b><span>' + totalLabel + '</span></div>' +
      '</div>' +
    '</div>';
  }

  /* 月历：每天抽了几支。有点一根的日子标红，点过但没抽的标 ✓，其余空白 */
  function quitCalPanel(h) {
    const y = quitCalMonth.getFullYear(), m = quitCalMonth.getMonth();
    /* 周一起始，跟主日历页一致 */
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    const total = new Date(y, m + 1, 0).getDate();
    const today = todayStr();
    const startDay = quitStartDay(h);
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="qc-day blank"></div>';
    for (let dd = 1; dd <= total; dd++) {
      const ds = fmt(new Date(y, m, dd));
      if (ds > today) { cells += '<div class="qc-day fut"><span>' + dd + '</span></div>'; continue; }
      const evs = dayCravings(h.id, ds);
      const ns = evs.filter(function (e) { return e.k === 's'; }).length;
      const nr = evs.length - ns;
      const cls = ns > 0 ? 'bad' : (nr > 0 ? 'ok' : '');
      cells += '<div class="qc-day ' + cls + (ds === today ? ' today' : '') + '">' +
        '<span>' + dd + '</span>' +
        '<b>' + (ns ? ns + ' 支' : (nr ? '✓' : '·')) + '</b>' +
      '</div>';
    }
    return '<div class="panel">' +
      '<div class="qc-head">' +
        '<h3>戒烟月历</h3>' +
        '<div class="month-nav">' +
          '<button class="arrow" data-act="quit-month-shift" data-delta="-1" aria-label="上个月">‹</button>' +
          '<b>' + y + ' 年 ' + (m + 1) + ' 月</b>' +
          '<button class="arrow" data-act="quit-month-shift" data-delta="1" aria-label="下个月">›</button>' +
          '<button class="btn sm ghost" data-act="quit-month-today">本月</button>' +
        '</div>' +
      '</div>' +
      '<div class="qc-wd">' + MONTH_CN.map(function (w) {
        return '<span>' + w + '</span>';
      }).join('') + '</div>' +
      '<div class="qc-grid">' + cells + '</div>' +
      '<div class="qc-legend muted-sm">红=抽了 · 绿✓=忍住 · 灰·=没记</div>' +
    '</div>';
