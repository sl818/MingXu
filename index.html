<script>
(function(){
  try{
    var s = localStorage.getItem('lifeboard.skin');
    if(['paper','slate','mono','clay','forest','neu','cyber','retro','cloud-float','cloud-focus'].indexOf(s) >= 0) document.documentElement.setAttribute('data-skin', s);
    var lay = localStorage.getItem('lifeboard.layout');
    /* v87 删掉「左侧导航条」，老用户存的 side 一律退回 top */
    if(['top','wide'].indexOf(lay) < 0) lay = 'top';
    document.documentElement.setAttribute('data-layout', lay);
    var m = localStorage.getItem('lifeboard.theme.mode');
    if(['auto','light','dark'].indexOf(m) < 0) m = 'auto';
    var h = new Date().getHours();
    var t = m === 'auto' ? ((h >= 7 && h < 19) ? 'light' : 'dark') : m;
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础工具
     ============================================================ */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const pad2 = n => String(n).padStart(2, '0');
  const fmt = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const parseD = s => {
    const p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  };
  const addDays = (d, n) => {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  };
  const todayStr = () => fmt(new Date());
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
  const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6);

  const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
  const MONTH_CN = ['一', '二', '三', '四', '五', '六', '日'];
  const TAGS = { '健康': '#2f7d5c', '生活': '#8a6524', '工作': '#9a5a2f', '学习': '#6b5b8e', '其他': '#6f7468' };
  const PRIO = { '高': '#b0473d', '中': '#8a6524', '低': '#6f7468' };
  const MOODS = [
    { key: 'sad', emoji: '😞', label: '不开心' },
    { key: 'ok', emoji: '😐', label: '正常' },
    { key: 'happy', emoji: '😄', label: '开心' }
  ];
  const MOOD_MAP = {};
  MOODS.forEach(m => { MOOD_MAP[m.key] = m; });
  const STATUS = { todo: '待办', doing: '进行中', done: '已完成', cancelled: '已取消' };
  const STATUS_ORDER = ['todo', 'doing', 'done', 'cancelled'];
  const FLOW = ['todo', 'doing', 'done'];
  /* 常驻卡顺序即此顺序。戒烟放最后：5 张时它会跨两列变成宽卡。 */
  const PINNED_IDS = ['h_med', 'h_water', 'h_move', 'h_breathe', 'h_drink'];

  const KEY = 'lifeboard.v1';
  const CLOUD_KEY = 'lifeboard.cloud';
  const THEME_MODE_KEY = 'lifeboard.theme.mode';
  const SKIN_KEY = 'lifeboard.skin';
  const LAYOUT_KEY = 'lifeboard.layout';
  const SKINS = [
    { key: 'paper', name: '暖绒 · 鼠尾草', desc: '鼠尾草 / 奶油纸 / 柔和', bg: '#f8f3ea', card: '#fffcf6', side: '#3f5a49', accent: '#567458' },
    { key: 'slate', name: '冷雾 · 矩阵', desc: '雾蓝 / 全息 / 科技', bg: '#eaf2f7', card: '#fbfdff', side: '#071725', accent: '#16708a' },
    { key: 'cloud-float', name: '浮纸 · 抬升', desc: '留白干净 / 版心浮起', bg: '#e8edf2', card: '#ffffff', side: '#e6ecf2', accent: '#43688a' },
    { key: 'cloud-focus', name: '聚光 · 晕影', desc: '四周晕影 / 中间亮 / 聚焦', bg: '#dbe4ed', card: '#ffffff', side: '#e3eaf2', accent: '#34567a' },
    { key: 'neu',   name: '拟态 · 素白', desc: '新拟态 / 软浮雕', bg: '#e4e9f0', card: '#e4e9f0', side: '#e4e9f0', accent: '#4a5876' },
    { key: 'retro', name: '复古 · 街机', desc: '像素 / 块状阴影 / 撞色', bg: '#fdf6e3', card: '#fffdf7', side: '#fdf6e3', accent: '#c2441e' }
  ];

  /* ============================================================
     状态与持久化
     ============================================================ */
  function seedState() {
    const t = todayStr();
    const iso = new Date().toISOString();
    return {
      version: 2,
      schemaVersion: SCHEMA_VERSION,
      view: 'today',
      habits: [
        { id: 'h_med',   name: '用药', icon: '💊', type: 'build', target: 1, unit: '次', color: '#2f6f5e', note: '用药记录', createdAt: iso, pinned: true, med: true },
        { id: 'h_water', name: '喝水', icon: '💧', type: 'build', target: 9, unit: '杯', color: '#4c7f96', note: '每天 9 杯 · 共 2300 ml', perMl: 250, goalMl: 2300, createdAt: iso, pinned: true },
        { id: 'h_move',  name: '运动', icon: '🏃', type: 'build', target: 1, unit: '次', color: '#b5733f', note: '30 分钟以上', createdAt: iso, pinned: true },
        { id: 'h_breathe', name: '478呼吸法', icon: '🌬️', type: 'build', target: 1, unit: '组', color: '#5b8f8a', note: '4-7-8 呼吸', breatheCycles: 4, suggestTime: '15:00', createdAt: iso, pinned: true },
        { id: 'h_drink', name: '戒烟', icon: '🚭', type: 'smoke', target: 1, unit: '次', color: '#7a8471', note: '', createdAt: iso, pinned: true }
      ],
      checks: {},
      notes: {}, // 保留旧版备份中的随记数据；当前版本没有随记界面
      moods: {},
      events: [],
      meds: [
        { id: 'med_default', name: '吃药', purpose: '其他', form: '片', strength: '', doseAmount: 1, doseUnit: '片', times: ['08:00', '20:00'], courseType: 'long', startDate: t, endDate: '', reviewDate: '', status: 'active', stock: '', note: '早晚各一次', createdAt: iso }
      ],
      doses: {},
      /* 戒烟事件流：一次「想抽」要么抽了要么忍住，两边都记。
         刻意不并进 checks——checks 是「今天做了几次」的计数语义，
         混进去会让完成度、连续天数、月历每一处都要再判一次类型。 */
      cravings: [],
      /* 买烟记录：一包一条。当前这包还剩几支不存，靠「开包时间之后的 s 事件数」推算，
         跟药品库存一样，不存派生量。 */
      packs: [],
      notices: [],
      /* 常驻卡的显示顺序（id 数组）+ 它最后被改的时刻。
         **只存顺序，不存集合** —— 哪些卡存在永远由 PINNED_IDS 决定，
         所以这个数组丢了某个 id 只会让它回到默认位置，不会让卡片消失。 */
      cardOrder: [],
      cardOrderAt: 0,
      /* 清债（v88）。整块存成一个子对象，**不拆成十个顶层字段**——
         顶层字段一多，normalizeState / mergeStates / repairBackup 三处就容易漏，
         v78 那次导入清空数据就是这么来的。 */
      money: moneySeed(),
      /* 清债里那些「单值」设置（加速钱、策略、起始月、提醒开关）没有各自的
         修改时间，只能靠整块的 moneyAt 比先后。 */
      moneyAt: 0,
      /* 导航顺序：同样**只存顺序，不存集合** —— 有哪些页永远由 NAV 决定，
         所以这里丢了某个 key 只会让它回到默认位置，不会让入口消失。
         组间固定（记录在前、回顾在后），只允许组内调。 */
      navOrder: [],
      navOrderAt: 0,
      /* 倒数日：只存一个日期 + 提醒档位，**不存「未来还是过去」**。
         今天是哪一天决定它往哪边数，存成状态明天就会不同步。 */
      countdowns: [],
      bodyProfile: { age: 0, height: 0 },
      weights: [],
      essays: [],
      tasks: [
        { id: uid(), title: '整理这周的用药时间', note: '把早/晚的药分装好', tag: '健康', priority: '中', status: 'doing', due: t, createdAt: iso },
        { id: uid(), title: '晚上散步 30 分钟', note: '', tag: '健康', priority: '中', status: 'todo', due: t, createdAt: iso },
        { id: uid(), title: '预约下个月的体检', note: '记得空腹', tag: '健康', priority: '高', status: 'todo', due: fmt(addDays(new Date(), 3)), createdAt: iso },
        { id: uid(), title: '补充家里的常备药', note: '', tag: '生活', priority: '低', status: 'done', due: fmt(addDays(new Date(), -1)), createdAt: iso, doneAt: fmt(addDays(new Date(), -1)) }
      ]
    };
  }

  const OLD_SEED_COLORS = { h_med: '#5b6bf0', h_water: '#2a9dbf', h_move: '#1f9d67', h_drink: '#e08a3c' };
  const NEW_SEED_COLORS = { h_med: '#2f6f5e', h_water: '#4c7f96', h_move: '#b5733f', h_drink: '#9c5a5a' };

  function migrateColors(data) {
    if (!data || (Number(data.version) || 1) >= 2) return data;
    if (Array.isArray(data.habits)) {
      data.habits.forEach(h => {
        if (h && OLD_SEED_COLORS[h.id] && String(h.color || '').toLowerCase() === OLD_SEED_COLORS[h.id]) {
          h.color = NEW_SEED_COLORS[h.id];
        }
      });
    }
    data.version = 2;
    return data;
  }

  function migratePinned(data) {
    if (data && Array.isArray(data.habits)) {
      data.habits.forEach(h => {
        if (h && PINNED_IDS.indexOf(h.id) >= 0) h.pinned = true;
      });
    }
    return data;
  }

  /* 把旧的 med.stock（剩余数量）转成基线：从这一刻起按服药记录往下扣。
     旧 stock 字段保留不删（万一需要回滚），但新代码只读 stockBase。 */
  function migrateStock(data) {
    if (!data || !Array.isArray(data.meds)) return data;
    const now = new Date().toISOString();
    data.meds.forEach(function (m) {
      if (!m) return;
      const hasBase = m.stockBase !== undefined && m.stockBase !== null;
      if (hasBase) return;
      const legacy = m.stock;
      if (legacy !== '' && legacy !== null && legacy !== undefined && isFinite(Number(legacy))) {
        m.stockBase = Math.max(0, Number(legacy));
        m.stockBaseAt = now;
        /* 旧数字很可能已经不准了（之前扣减会丢），标出来让人核对一次 */
        m.stockReview = true;
      } else {
        m.stockBase = '';
        m.stockBaseAt = '';
      }
    });
    return data;
  }

  function migrateMeds(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    let medHabit = data.habits.find(h => h.id === 'h_med');
    if (!medHabit) {
      medHabit = {
        id: 'h_med', name: '用药', icon: '💊', type: 'build', target: 1, unit: '次',
        color: '#2f6f5e', note: '用药记录', createdAt: new Date().toISOString(), pinned: true, med: true
      };
      data.habits.unshift(medHabit);
    }
    medHabit.med = true;
    medHabit.pinned = true;
    medHabit.target = 1;
    medHabit.name = '用药';
    medHabit.icon = '💊';
    if (!medHabit.note) medHabit.note = '用药记录';
    if (!Array.isArray(data.meds)) {
      data.meds = [];
      if (medHabit) {
        data.meds.push({
          id: 'med_default', name: '吃药', purpose: '其他', form: '片', strength: '',
          doseAmount: 1, doseUnit: '片', times: ['08:00', '20:00'],
          courseType: 'long', startDate: todayStr(), endDate: '', reviewDate: '',
          status: 'active', stock: '', note: '早晚各一次', createdAt: new Date().toISOString()
        });
      }
    }
      if (!data.meds || typeof data.meds !== 'object' || !Array.isArray(data.meds)) data.meds = [];
      data.meds = data.meds.map(m => {
        const x = m || {};
        return Object.assign({
          id: 'med_' + uid(), name: '用药', purpose: '其他', form: '片', strength: '',
          doseAmount: 1, doseUnit: '片', times: [], courseType: 'long', startDate: todayStr(),
          endDate: '', reviewDate: '', status: 'active', stock: '', note: '', createdAt: new Date().toISOString()
        }, x, { times: (Array.isArray(x.times) ? x.times : []).filter(t => /^([01]\d|2[0-3]):[0-5]\d$/.test(t)).sort() });
      });
      if (!data.doses || typeof data.doses !== 'object' || Array.isArray(data.doses)) data.doses = {};
      return data;
  }

  function migrateQuitHabit(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    data.habits.forEach(h => {
      if (h && h.id === 'h_drink' && h.name === '喝多') {
        h.name = '戒烟';
        h.icon = '🚭';
      }
    });
    return data;
  }

  function ensureBreathingHabit(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    let h = data.habits.find(x => x && x.id === 'h_breathe');
    if (!h) {
      h = {
        id: 'h_breathe', name: '478呼吸法', icon: '🌬️', type: 'build',
        target: 1, unit: '组', color: '#5b8f8a', note: '4-7-8 呼吸',
        breatheCycles: 4, suggestTime: '15:00',
        createdAt: new Date().toISOString(), pinned: true
      };
      data.habits.push(h);
    } else {
      h.pinned = true;
      h.optional = false;
      h.type = 'build';
      h.target = 1;
      h.unit = '组';
      h.breatheCycles = Math.max(1, Math.min(8, Number(h.breatheCycles) || 4));
      h.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(h.suggestTime || '')) ? h.suggestTime : '15:00';
      h.name = h.name || '478呼吸法';
      h.icon = h.icon || '🌬️';
    }
    return data;
  }

  /* goalWeight 可选：0 表示没设目标。范围放宽到 20–300kg，
     只做合理性拦截，不给医学建议。 */
  function normalizeBodyProfile(p) {
    const age = parseInt(p && p.age, 10);
    const height = Number(p && p.height);
    if (!isFinite(age) || age < 1 || age > 120 || !isFinite(height) || height < 50 || height > 250) {
      return { age: 0, height: 0, goalWeight: 0 };
    }
    const goal = Number(p && p.goalWeight);
    const goalWeight = (isFinite(goal) && goal >= 20 && goal <= 300) ? Math.round(goal * 10) / 10 : 0;
    return { age: Math.round(age), height: Math.round(height * 10) / 10, goalWeight: goalWeight };
  }

  function hasBodyProfile() {
    const p = normalizeBodyProfile(state.bodyProfile);
    return p.age > 0 && p.height > 0;
  }

  function normalizeWeightRecord(w) {
    if (!w || typeof w !== 'object') return null;
    const date = String(w.date || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || fmt(parseD(date)) !== date || date > todayStr()) return null;
    const rawWeight = Number(w.weight);
    const rawHeight = Number(w.height);
    const rawAge = parseInt(w.age, 10);
    if (!isFinite(rawWeight) || rawWeight <= 0 || !isFinite(rawHeight) || rawHeight <= 0 || !isFinite(rawAge) || rawAge <= 0) return null;
    const weight = Math.round(clamp(rawWeight, 1, 500) * 10) / 10;
    const height = Math.round(clamp(rawHeight, 50, 250) * 10) / 10;
    const age = Math.round(clamp(rawAge, 1, 120));
    /* 体脂率（v114）：可选，0 = 没填。只拦离谱值，不做医学判断 */
    const rawFat = Number(w.fat);
    const fat = (isFinite(rawFat) && rawFat >= 1 && rawFat <= 70) ? Math.round(rawFat * 10) / 10 : 0;
    return {
      id: String(w.id || ('w_' + uid())),
      date: date,
      age: age,
      height: height,
      weight: weight,
      bmi: calcBmi(weight, height),
      fat: fat,
      createdAt: w.createdAt || new Date().toISOString()
    };
  }

  function normalizeEssayTags(value) {
    const raw = Array.isArray(value) ? value : (typeof value === 'string' ? value.split(/[,，、]/) : []);
    const out = [];
    raw.forEach(tag => {
      const t = String(tag || '').trim().slice(0, 12);
      if (t && out.indexOf(t) < 0 && out.length < 5) out.push(t);
    });
    return out;
  }

  function normalizeEssayRecord(e) {
    if (!e || typeof e !== 'object') return null;
    const text = String(e.text || '').trim().slice(0, 5000);
    if (!text) return null;
    const rawDate = String(e.date || '');
    const date = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) && fmt(parseD(rawDate)) === rawDate && rawDate <= todayStr()
      ? rawDate : todayStr();
    return {
      id: String(e.id || ('e_' + uid())),
      date: date,
      title: String(e.title || '').trim().slice(0, 60),
      text: text,
      tags: normalizeEssayTags(e.tags),
      createdAt: e.createdAt || new Date().toISOString(),
      updatedAt: Number(e.updatedAt) || Date.now()
    };
  }

  function isPlainObject(value) {
    return !!value && typeof value === 'object' && !Array.isArray(value);
  }

  function rebuildChecksFromEvents(events) {
    const out = {};
    (Array.isArray(events) ? events : []).forEach(e => {
      if (!e || typeof e !== 'object') return;
      const d = String(e.d || '');
      const id = String(e.id || '');
      const delta = Number(e.delta);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !id || !isFinite(delta) || !delta) return;
      if (!out[d]) out[d] = {};
      const next = (Number(out[d][id]) || 0) + Math.round(delta);
      if (next > 0) out[d][id] = next;
      else delete out[d][id];
      if (!Object.keys(out[d]).length) delete out[d];
    });
    return out;
  }

  function normalizeChecks(raw, events) {
    // 旧数据里 checks 可能是 []。数组上的日期属性不会被 JSON.stringify 序列化，
    // 必须转成普通对象；events 还在时按事件尝试还原打卡次数。
    if (!isPlainObject(raw)) return rebuildChecksFromEvents(events);
    const out = {};
    Object.keys(raw).forEach(d => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      const day = raw[d];
      if (!isPlainObject(day)) return;
      const clean = {};
      Object.keys(day).forEach(id => {
        const n = Number(day[id]);
        if (isFinite(n) && n > 0) clean[id] = Math.round(n);
      });
      if (Object.keys(clean).length) out[d] = clean;
    });
    return out;
  }

  /* 戒烟事件：{id, t(秒), k:'s'抽了|'r'忍住了, h(习惯id), g(诱因), s(强度0-5)}
     t 用秒级时间戳而不是 ISO 字符串——一天几十条，一年上万条，
     而同步是全量快照，字段长度直接决定每次 PUT 的体积。 */
  function normalizeCravings(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (e) {
      if (!e || typeof e !== 'object') return;
      const id = String(e.id || '');
      const k = e.k === 's' ? 's' : (e.k === 'r' ? 'r' : '');
      const t = Number(e.t);
      if (!id || !k || !isFinite(t) || t <= 0) return;
      if (seen[id]) return;
      seen[id] = 1;
      out.push({
        id: id,
        t: Math.round(t),
        k: k,
        h: String(e.h || ''),
        g: String(e.g || ''),
        s: clamp(Math.round(Number(e.s) || 0), 0, 5)
      });
    });
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  /* 买烟记录：{id, at(秒), name, price, size}
     不存「剩余几支」——那是派生量，存在多端合并时必然对不上。 */
  function normalizePacks(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (p) {
      if (!p || typeof p !== 'object') return;
      const id = String(p.id || '');
      const at = Number(p.at);
      if (!id || !isFinite(at) || at <= 0) return;
      if (seen[id]) return;
      seen[id] = 1;
      out.push({
        id: id,
        at: Math.round(at),
        name: String(p.name || ''),
        price: clamp(Math.round((Number(p.price) || 0) * 100) / 100, 0, 99999),
        size: clamp(Math.round(Number(p.size) || 20), 1, 50),
        /* 末支确认时刻（用户给的事实，不是派生量）。这里是白名单式的重建，
           漏写一个字段就会在每次 normalize 后静默丢掉——踩过两次。 */
        cf: Math.max(0, Math.round(Number(p.cf) || 0))
      });
    });
    out.sort(function (a, b) { return a.at - b.at; });
    return out;
  }

  function normalizeMoods(raw) {
    if (!isPlainObject(raw)) return {};
    const out = {};
    Object.keys(raw).forEach(d => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && MOOD_MAP[raw[d]]) out[d] = raw[d];
    });
    return out;
  }

  function ensureStateMaps() {
    if (!state || typeof state !== 'object') return;
    state.checks = normalizeChecks(state.checks, state.events);
    state.moods = normalizeMoods(state.moods);
    state.notes = isPlainObject(state.notes) ? state.notes : {};
    state.doses = isPlainObject(state.doses) ? state.doses : {};
    /* 戒烟从「戒除的一个子类」改成独立类型（v64）：
         · h_drink 或带 quitKind:'smoke' 标记的 → type: 'smoke'
         · 其余 quit 保留为通用「戒除」，把 quitKind 字段清掉
       幂等：跑几次结果都一样，多端各自迁移也不会打架。 */
    if (Array.isArray(state.habits)) {
      state.habits.forEach(function (h) {
        if (!h) return;
        if (h.type === 'smoke') { delete h.quitKind; return; }
        if (h.type !== 'quit') return;
        if (h.id === 'h_drink' || h.quitKind === 'smoke') {
          h.type = 'smoke';
          delete h.quitKind;
        } else if (h.quitKind) {
          delete h.quitKind;
        }
      });
    }
  }

  /* 喝水改毫升制：旧数据（8 杯）一次性升级到 9 杯 / 250 ml / 共 2300 ml。
     只在没有 perMl 时执行，幂等；checks 里存的仍是「次数」，历史记录无需迁移。 */
  /* 老戒烟记录 → 事件流。用确定性 id（q-习惯id-日期-序号）保证幂等：
     迁移跑两次不会长出重复事件，云合并时也不会被当成新事件。 */
  function migrateQuitCravings(data) {
    if (!Array.isArray(data.habits) || !isPlainObject(data.checks)) return;
    const quitIds = data.habits.filter(function (h) { return isQuitLike(h); })
                              .map(function (h) { return h.id; });
    if (!quitIds.length) return;
    /* 「保持 0 次」是计数时代留下的备注，事件流下它只会误导 */
    data.habits.forEach(function (h) {
      if (!isQuitLike(h)) return;
      if (String(h.note || '') === '保持 0 次') h.note = '';
      /* 暗红在常驻区读起来像「警告」，换成灰绿。只改还是旧默认值的那批，
         用户自己调过的颜色不动。 */
      if (String(h.color || '').toLowerCase() === '#9c5a5a') h.color = '#7a8471';
    });
    if (!Array.isArray(data.cravings)) data.cravings = [];
    const seen = {};
    data.cravings.forEach(function (e) { if (e && e.id) seen[e.id] = 1; });
    Object.keys(data.checks).forEach(function (ds) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
      const day = data.checks[ds];
      if (!isPlainObject(day)) return;
      quitIds.forEach(function (id) {
        const n = Number(day[id]) || 0;
        if (n <= 0) return;
        for (let i = 0; i < n && i < 40; i++) {
          const cid = 'q-' + id + '-' + ds + '-' + i;
          if (seen[cid]) continue;
          seen[cid] = 1;
          const base = parseD(ds);
          base.setHours(12, i, 0, 0);
          data.cravings.push({ id: cid, t: Math.round(base.getTime() / 1000),
                               k: 's', h: id, g: '', s: 0 });
        }
      });
    });
  }

  /* 补一包：只给有戒烟习惯、但一条买烟记录都没有的账号补，用戒烟起点当开包时间。
     幂等（有 packs 就跳过），多端各自迁移也只会生成同一个确定性 id。 */
  function migrateQuitPack(data) {
    const q = (data.habits || []).find(function (h) {
      return h && !h.archivedAt && isSmoke(h);
    });
    if (!q) return;
    if (Array.isArray(data.packs) && data.packs.length) return;
    const start = String(q.quitStart || (q.createdAt ? String(q.createdAt).slice(0, 10) : ''));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) return;
    data.packs = [{
      id: 'p-init', at: Math.round(parseD(start).getTime() / 1000),
      name: '', price: 0, size: 20
    }];
  }

  function migrateWater(data) {
    (data.habits || []).forEach(h => {
      if (!h || h.id !== 'h_water') return;
      if (Number(h.perMl) > 0) return;
      h.perMl = 250;
      h.goalMl = 2300;
      h.target = 9;
      h.unit = '杯';
      h.note = '每天 9 杯 · 共 2300 ml';
    });
  }

  /* 自定义通知：{id, text, time, mode, date, weeks, monthday, on}
     mode = once（指定某天）/ daily / weekly（weeks 多选，0=周日）/ monthly（monthday）。
     这里只存「什么时候发什么」；发没发过由后端 push_sent 的 slot_key 管（键里带日期），
     所以「单次」和「每天」在数据层是同一件事，只是进不进当天的计划不同。 */
  function normalizeNotices(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (n) {
      if (!n || typeof n !== 'object') return;
      const id = String(n.id || '');
      if (!id || seen[id]) return;
      const text = String(n.text || '').trim();
      if (!text) return;          /* 空内容的通知没有意义，直接丢掉 */
      seen[id] = 1;
      const modes = ['once', 'daily', 'weekly', 'monthly'];
      const mode = modes.indexOf(n.mode) >= 0 ? n.mode : 'daily';
      out.push({
        id: id,
        text: text.slice(0, 1000),
        time: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(n.time || '')) ? String(n.time) : '20:00',
        mode: mode,
        date: /^\d{4}-\d{2}-\d{2}$/.test(String(n.date || '')) ? String(n.date) : '',
        weeks: Array.isArray(n.weeks)
          ? n.weeks.map(function (w) { return Math.round(Number(w)); })
              .filter(function (w) { return w >= 0 && w <= 6; })
          : [],
        monthday: clamp(Math.round(Number(n.monthday) || 1), 1, 31),
        on: n.on !== false
      });
    });
    /* 按时间排，列表里看着顺；同一时刻按 id 兜底，两端顺序一致 */
    out.sort(function (a, b) {
      return (a.time < b.time ? -1 : (a.time > b.time ? 1 : 0)) || String(a.id).localeCompare(String(b.id));
    });
    return out;
  }

  /* 倒数日：{id, title, date, note, time, remindDays, on}
     date 只到天（倒数天数是日期级的，加时刻没意义）；time 只管「几点推通知」。
     remindDays 是提前几天提醒，0 = 当天；数组可为空（只显示不提醒）。 */
  function normalizeCountdowns(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (n) {
      if (!n || typeof n !== 'object') return;
      const id = String(n.id || '');
      const title = String(n.title || '').trim();
      const date = String(n.date || '');
      if (!id || seen[id] || !title) return;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      seen[id] = 1;
      const days = Array.isArray(n.remindDays)
        ? n.remindDays.map(function (x) { return Math.round(Number(x)); })
            .filter(function (x) { return x >= 0 && x <= 365; })
        : [];
      out.push({
        id: id,
        title: title.slice(0, 40),
        date: date,
        note: String(n.note || '').slice(0, 200),
        time: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(n.time || '')) ? String(n.time) : '09:00',
        /* 去重 + 去 0 之外的重复，顺手升序（30,3,1,0 看着乱） */
        remindDays: days.filter(function (x, i) { return days.indexOf(x) === i; })
          .sort(function (a, b) { return b - a; }),
        on: n.on !== false
      });
    });
    out.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    return out;
  }

  function normalizeState(data) {
    if (!data || typeof data !== 'object' || !Array.isArray(data.habits) || !Array.isArray(data.tasks)) return null;
    data.habits = data.habits.filter(h => h && typeof h === 'object');
    data.habits.forEach(h => {
      h.archivedAt = h.archivedAt ? String(h.archivedAt) : (h.archived === true ? new Date().toISOString() : '');
      h.notify = h.notify !== false;
      h.notifyFreq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
      const nwd = Number(h.notifyWeekday);
      h.notifyWeekday = (nwd >= 0 && nwd <= 6) ? Math.round(nwd) : 1;
      const nmd = Number(h.notifyMonthday);
      h.notifyMonthday = (nmd >= 1 && nmd <= 31) ? Math.round(nmd) : 1;
      h.notifyNote = String(h.notifyNote || '');
      /* 截止时刻只对「保持 × 单次目标」有意义，其他类型/多目标一律清空 */
      const dl = String(h.deadline || '');
      h.deadline = (h.type === 'build' && !h.med && (Number(h.target) || 1) <= 1
        && /^([01]\d|2[0-3]):[0-5]\d$/.test(dl)) ? dl : '';
    });
    data.tasks = data.tasks.filter(t => t && typeof t === 'object');
    data.tasks.forEach(t => {
      t.repeat = ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none';
      t.repeatTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.repeatTime || '')) ? t.repeatTime : '20:00';
      const due = t.due && /^\d{4}-\d{2}-\d{2}$/.test(String(t.due)) ? parseD(t.due) : null;
      const wd = Number(t.repeatWeekday);
      const rd = Number(t.repeatDay);
      t.repeatWeekday = (wd >= 0 && wd <= 6) ? Math.round(wd) : (due ? due.getDay() : 0);
      t.repeatDay = (rd >= 1 && rd <= 31) ? Math.round(rd) : (due ? due.getDate() : 1);
      t.repeatNextId = String(t.repeatNextId || '');
      t.repeatFrom = String(t.repeatFrom || '');
      t.archivedAt = t.archivedAt ? String(t.archivedAt) : '';
      t.notify = t.notify !== false;
      t.notifyTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.notifyTime || '')) ? t.notifyTime : '09:00';
      t.notifyNote = String(t.notifyNote || '');
      /* v127 子任务：只留「有标题的对象」，顺便补 id 和布尔 done。
         老数据没有这个字段，补成空数组，界面上不显示进度条。 */
      if (!Array.isArray(t.subtasks)) t.subtasks = [];
      t.subtasks = t.subtasks.filter(function (x) {
        return x && typeof x === 'object' && String(x.title || '').trim() !== '';
      }).map(function (x) {
        return {
          id: String(x.id || uid()),
          title: String(x.title).slice(0, 80),
          done: !!x.done
        };
      });
      /* 时间块：填了才在周视图里画真实色块，没填的落在「全天」行。
         时长按 15 分钟对齐，范围 15 分钟–12 小时；0 表示没设。 */
      t.startTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.startTime || '')) ? t.startTime : '';
      const tDur = Number(t.duration);
      t.duration = (isFinite(tDur) && tDur >= 15 && tDur <= 720) ? Math.round(tDur / 15) * 15 : 0;
    });
    if (Array.isArray(data.meds)) data.meds = data.meds.filter(m => m && typeof m === 'object');
    data.weights = Array.isArray(data.weights) ? data.weights.map(normalizeWeightRecord).filter(Boolean) : [];
    data.essays = Array.isArray(data.essays) ? data.essays.map(normalizeEssayRecord).filter(Boolean) : [];
    data.bodyProfile = normalizeBodyProfile(data.bodyProfile);
    if ((!data.bodyProfile.age || !data.bodyProfile.height) && data.weights.length) {
      const latestWeight = data.weights.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
      if (latestWeight && latestWeight.age && latestWeight.height) {
        data.bodyProfile = normalizeBodyProfile({ age: latestWeight.age, height: latestWeight.height });
      }
    }
    data.checks = normalizeChecks(data.checks, data.events);
    data.notes = isPlainObject(data.notes) ? data.notes : {};
    data.moods = normalizeMoods(data.moods);
    data.events = Array.isArray(data.events) ? data.events : [];
    data.cravings = normalizeCravings(data.cravings);
    data.packs = normalizePacks(data.packs);
    data.notices = normalizeNotices(data.notices);
    data.cardOrder = normalizeCardOrder(data.cardOrder);
    data.cardOrderAt = Math.max(0, Math.round(Number(data.cardOrderAt) || 0));
    data.money = normalizeMoney(data.money);
    data.moneyAt = Math.max(0, Math.round(Number(data.moneyAt) || 0));
    data.navOrder = normalizeNavOrder(data.navOrder);
    data.navOrderAt = Math.max(0, Math.round(Number(data.navOrderAt) || 0));
    data.countdowns = normalizeCountdowns(data.countdowns);
    data.doses = isPlainObject(data.doses) ? data.doses : {};
    migrateState(data);
    return Object.assign(seedState(), data);
  }

  /* ---------- 状态迁移 ----------
     以前靠「某个字段存不存在」判断要不要迁移，字段一多就互相误判：
     补一个字段可能让另一处判断以为数据已经升级过。
     现在按 state.schemaVersion 顺序执行，每一步只跑一次。
     没有版本号的旧数据一律当作 v1，走完整链路，跑完打上当前版本。 */
  const SCHEMA_VERSION = 6;

  function migrateState(data) {
    if (!data || typeof data !== 'object') return data;
    let v = Number(data.schemaVersion) || 1;
    if (v < 2) {
      /* v1 → v2：早期字段整理（颜色、置顶、药品结构、戒烟习惯） */
      migrateColors(data);
      migratePinned(data);
      migrateMeds(data);
      migrateQuitHabit(data);
      v = 2;
    }
    if (v < 3) {
      /* v2 → v3：喝水改毫升制、补 478 呼吸法常驻习惯 */
      migrateWater(data);
      ensureBreathingHabit(data);
      v = 3;
    }
    if (v < 4) {
      /* v3 → v4：库存从「绝对数逐次扣减」改为「基线 + 按记录推算」
         （具体补齐在下面的 migrateStock 里，它是幂等的，每次加载都会跑） */
      v = 4;
    }
    if (v < 6) {
      /* v5 → v6：戒烟卡改成「一包 20 支」的视角，需要一包做锚点。
         老用户没有买烟记录，就按他的戒烟起点补一包（多数人这时候一包是满的）。 */
      migrateQuitPack(data);
      v = 6;
    }
    if (v < 5) {
      /* v4 → v5：戒烟从「每天记几次」改成事件流（抽了 / 忍住了）。
         老数据里 checks[日期][戒烟习惯id] = 那天抽了几次，
         转成同样条数的 s 事件；checks 里的旧值保留不删，新代码不再读它。 */
      migrateQuitCravings(data);
      v = 5;
    }
    data.schemaVersion = SCHEMA_VERSION;
    /* 幂等补齐：不依赖版本号，任何缺少 stockBase 的药品都会被补成基线，
       避免「版本已经升到 4、但后来又混进旧格式条目」时被漏掉。 */
    migrateStock(data);
    return data;
  }

  function loadLegacyState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      return normalizeState(JSON.parse(raw));
    } catch (err) {
      return null;
    }
  }

  function clearLegacyState() {
    try { localStorage.removeItem(KEY); } catch (e) {}
  }

  let state = seedState();
  let view = state.view || 'today';
  let mode = location.protocol === 'file:' ? 'app' : 'landing';
  let selectedDate = todayStr();
  let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  /* 常驻卡排序模式：纯视图状态，不进 state。退出页面就结束，
     不需要记「上次停在排序模式」。 */
  let cardSortMode = false;
  /* 戒烟页月历的翻月锚点，和 calMonth 一样是纯视图状态，不进 state */
  let quitCalMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  /* 抽烟趋势折线图的时间范围：7=周 / 30=月 / 90=季，纯视图状态 */
  let quitTrendRange = 7;
  /* 买烟记录折叠态（v107）。不进 state：它是纯视图开关，
     换设备不需要同步，也不该占用云端快照的字段。 */
  let quitPackOpen = false;
  let quitPackShown = 20;
  /* 日历的两种视图。calWeek 是周视图的锚点（任意一天，渲染时归到那周的周一）。
     这两个都是纯视图状态，不进 state——切视图不该触发云同步。 */
  let calMode = 'month';
  let calWeek = new Date();
  let statsRange = 30;
  /* 任务完成度的范围。和 statsRange 分开存：那个是习惯完成率的天数，
     两个面板放在不同页面，共用会互相干扰。0 = 全部。 */
  let taskRange = 30;
  let essayTag = '';

  function autoTheme() {
    const h = new Date().getHours();
    return (h >= 7 && h < 19) ? 'light' : 'dark';

    try {
      const m = localStorage.getItem(THEME_MODE_KEY);
      return (m === 'auto' || m === 'light' || m === 'dark') ? m : 'auto';
    } catch (e) { return 'auto'; }
  })();
  let theme = themeMode === 'auto' ? autoTheme() : themeMode;

  function refreshAutoTheme() {
    if (themeMode !== 'auto') return;

    if (next === theme) return;
    theme = next;
    document.documentElement.dataset.theme = theme;

  let layout = (function () {

  })();
  let dragId = null;
  /* 用药卡轮播当前索引：纯 UI 状态，绝不写进 state（否则翻卡会触发云同步） */
  let medCardIdx = 0;

  /* ============================================================
     云同步状态（PHP + MySQL，可选）
     ============================================================ */
  /* 正在向服务器确认身份 / 拉取数据：为 true 时页面显示骨架而不是空白或空数据 */
  let cloudProbing = false;

  let cloud = (function () {
    const base = {
      available: location.protocol !== 'file:',
      user: null,
      email: '',
      csrf: '',
      rev: 0,
      updatedAt: 0,
      pending: false,
      linked: false,
      syncing: false,
      pushing: false,
      pulling: false,
      pushAgain: false,
      conflict: null,
      error: '',
      timer: null,
      dirtySeq: 0,
      lastPull: 0,
      lastData: '',
      inited: false,
      ready: false,
      registrationOpen: true,
      siteName: '明序',
      owner: '',
      migrateLegacy: false
    };
    try {
      const meta = JSON.parse(localStorage.getItem(CLOUD_KEY) || '{}');
      if (meta && typeof meta === 'object') {
        base.rev = Math.max(0, parseInt(meta.rev, 10) || 0);
        base.updatedAt = Math.max(0, Number(meta.updatedAt) || 0);
        base.pending = false;
        base.linked = !!meta.linked;
        base.email = typeof meta.email === 'string' ? meta.email : '';
        base.owner = typeof meta.owner === 'string' ? meta.owner : '';
      }
    } catch (e) {}

  })();

  function cloudDataKey() {
    return JSON.stringify(Object.assign({}, state, { view: '' }));
  }
  cloud.lastData = cloudDataKey();
  let adminState = { users: [], settings: null };

  function persistCloudMeta() {
    try {
      localStorage.setItem(CLOUD_KEY, JSON.stringify({
        rev: cloud.rev,
        updatedAt: cloud.updatedAt,
        pending: cloud.pending,
        linked: cloud.linked,
        email: cloud.email || (cloud.user && cloud.user.email) || '',
        owner: cloud.owner || ''
      }));
    } catch (e) {}
  }

  function resetLocalForAccount() {
    state = seedState();
    clearLegacyState();
    cloud.rev = 0;
    cloud.updatedAt = 0;
    cloud.pending = false;
    cloud.conflict = null;
    cloud.error = '';
    cloud.ready = false;
    cloud.lastData = cloudDataKey();
    persistCloudMeta();
  }

  function save() {
    if (!cloud.user) return;
    if (!cloud.ready) {
      toast('云端数据还没加载完成，请刷新页面重试');
      return;
    }
    ensureStateMaps();
    cloudOnLocalChange();
  }

  function cloudOnLocalChange() {
    if (!cloud.user) return;
    const key = cloudDataKey();
    if (key === cloud.lastData) return;
    cloud.lastData = key;
    cloud.pending = true;
    cloud.dirtySeq++;
    persistCloudMeta();
    if (cloud.conflict) {
      cloudRefreshUI();
      return;
    }
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(() => cloudPush(false), 600);
    cloudRefreshUI();
  }

  async function cloudApi(action, body, query) {
    const hasBody = body !== undefined && body !== null;
    const headers = { Accept: 'application/json' };
    if (hasBody) {
      headers['Content-Type'] = 'application/json';
      if (cloud.csrf) headers['X-CSRF-Token'] = cloud.csrf;
    }
    let url = 'api.php?action=' + encodeURIComponent(action);
    if (query && typeof query === 'object') {
      Object.keys(query).forEach(k => {
        if (query[k] !== undefined && query[k] !== null && query[k] !== '') {
          url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(String(query[k]));
        }
      });
    }
    let res;
    try {
      res = await fetch(url, {
        method: hasBody ? 'POST' : 'GET',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: headers,
        body: hasBody ? JSON.stringify(body) : undefined
      });
    } catch (e) {
      const err = new Error('网络连接失败');
      err.status = 0;
      throw err;
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok || !data || data.ok === false) {
      const err = new Error((data && data.error) || ('请求失败（HTTP ' + res.status + '）'));
      err.status = res.status;
      err.data = data || {};
      throw err;
    }
    return data;
  }

  async function cloudFetchMe() {
    const me = await cloudApi('me');
    cloud.csrf = typeof me.csrf === 'string' ? me.csrf : '';
    cloud.registrationOpen = !!me.registration_open;
    cloud.regMode = me.registration_mode || (me.registration_open ? 'invite' : 'closed');
    cloud.codeReady = !!me.code_ready;
    if (me.site_name) cloud.siteName = String(me.site_name);
    if (me.user && me.user.email) {
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(me.user.id)) {
        resetLocalForAccount();
        cloud.migrateLegacy = false;
      } else {
        cloud.migrateLegacy = true;
      }
      cloud.owner = String(me.user.id);
      cloud.user = me.user;
      cloud.email = me.user.email;
      cloud.linked = true;
    } else {
      cloud.user = null;
    }
    persistCloudMeta();
    return me;
  }

  function cloudStatusText() {
    if (!cloud.updatedAt) return '尚未同步';
    return new Date(cloud.updatedAt).toLocaleString('zh-CN', { hour12: false });
  }

  function cloudPanelHtml() {

    const httpWarn = (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))
      ? '<p class="hint" style="color:var(--bad)">当前是 HTTP，登录口令会明文传输；请先启用 HTTPS，或只在测试时使用。</p>'

    if (!cloud.available) {

      else if (cloud.error) badge = '<span class="state-pill bad">保存失败</span>';

      const adminTag = isAdmin ? ' <span class="pin-tag">管理员</span>' : '';

          : '<p class="hint">注册已关闭；需要账号请联系管理员。</p>') +

      '<p class="hint">数据保存在云端；修改会自动保存。保存失败会提示，离开前请确认状态。忘记密码请联系管理员重置。</p>' +
      '</div>';

  let syncFadeTimer = null;
  let syncDismissed = false;

  function updateSyncIndicator() {
    const el = document.getElementById('sync-indicator');
    const rail = document.getElementById('rail-sync');
    if (!cloud.user) {
      if (el) {
        el.hidden = true;
        el.className = 'sync-indicator';
        el.textContent = '';
        el.dataset.cls = '';
      }
      if (rail) rail.hidden = true;
      return;
    }
    let cls = 'saved';
    let text = '已保存';
    if (cloud.error) {
      cls = 'error';
      text = '保存失败 · 点此重试';
    } else if (cloud.syncing || cloud.pushing || cloud.pulling) {
      cls = 'saving';
      text = '保存中…';
    } else if (cloud.pending) {
      cls = 'pending';
      text = '待保存';
    } else if (cloud.updatedAt) {
      const t = new Date(cloud.updatedAt);
      text = '已保存 ' + t.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    } else {
      cls = 'pending';
      text = '尚未同步';
    }
    if (cls !== 'saved') syncDismissed = false;

    if (el) {
      el.hidden = false;
      const keepFaded = el.classList.contains('is-faded') && el.dataset.cls === cls;
      el.innerHTML = '<i></i><span>' + esc(text) + '</span>';
      el.className = 'sync-indicator ' + cls + (keepFaded ? ' is-faded' : '');
      el.title = cls === 'error' ? '点击重试保存' : '点击立即保存';
      if (el.dataset.cls !== cls) {
        el.dataset.cls = cls;
        clearTimeout(syncFadeTimer);
        if (cls === 'saved') {
          syncFadeTimer = setTimeout(() => {
            const cur = document.getElementById('sync-indicator');
            if (cur && cur.dataset.cls === 'saved') cur.classList.add('is-faded');
          }, 2200);
        }
      }
    }
    if (rail) {
      rail.hidden = (cls === 'saved' && syncDismissed);
      rail.className = 'rail-sync ' + cls;
      rail.innerHTML = '<i></i><span>' + esc(text) + '</span>' +
        '<button class="rail-sync-x" data-act="sync-dismiss" aria-label="隐藏同步状态" title="隐藏">×</button>';
    }
  }

  function cloudRefreshUI() {
    updateSyncIndicator();
    if (view !== 'settings') return;
    const panel = document.getElementById('cloud-panel');
    if (!panel) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = cloudPanelHtml();
    const next = wrap.firstElementChild;
    if (next) panel.replaceWith(next);
  }

  function cloudApplyRemote(data, rev, updatedAt, silent) {
    const repairNeeded = !!data && (!isPlainObject(data.checks) || !isPlainObject(data.moods) || !isPlainObject(data.doses) || !isPlainObject(data.notes));
    const next = normalizeState(data);
    if (!next) {
      cloud.error = '云端数据格式不正确';
      cloudRefreshUI();
      return false;
    }
    state = next;
    state.view = view;
    cloud.lastData = cloudDataKey();
    cloud.rev = Number(rev) || 0;
    cloud.updatedAt = Number(updatedAt) || 0;
    cloud.pending = false;
    cloud.conflict = null;
    cloud.error = '';
    cloud.linked = true;
    cloud.ready = true;
    persistCloudMeta();
    render();
    if (!silent) toast('已从云端加载');
    if (repairNeeded) {
      cloud.pending = true;
      updateSyncIndicator();
      setTimeout(() => { if (cloud.ready && cloud.user) cloudPush(false); }, 80);
    }
    return true;
  }

  async function cloudSyncFromServer(opts) {
    if (!cloud.available || !cloud.user || cloud.pulling) return;
    const manual = !!(opts && opts.manual);
    cloud.pulling = true;
    cloud.ready = false;
    cloud.lastPull = Date.now();
    try {
      const res = await cloudApi('load');
      const remote = res.data;
      const remoteRev = Number(res.rev) || 0;
      const remoteAt = Number(res.updated_at) || 0;
      cloud.updatedAt = remoteAt;

      if (remote) {
        if (!cloudApplyRemote(remote, remoteRev, remoteAt, !manual)) {
          cloud.ready = false;
          mode = 'landing';
          render();
          return;
        }
        clearLegacyState();
        return;
      }

      cloud.rev = 0;
      let legacy = null;
      if (cloud.migrateLegacy) legacy = loadLegacyState();
      if (legacy) {
        state = legacy;
        state.view = view;
        cloud.lastData = cloudDataKey();
        cloud.pending = true;
        const ok = await cloudPush(true, true);
        if (ok) {
          clearLegacyState();
          toast('旧本地数据已迁移到云端');
        } else {
          cloud.error = '旧本地数据还没上传成功，请检查网络后重新登录重试。';
          cloud.ready = false;
          mode = 'landing';
          render();
        }
        return;
      }

      state = normalizeState(state) || seedState();
      state.view = view;
      cloud.lastData = cloudDataKey();
      cloud.pending = true;
      const ok = await cloudPush(true, manual);
      if (!ok) {
        cloud.ready = false;
        mode = 'landing';
        render();
        return;
      }
      clearLegacyState();
    } catch (e) {
      cloud.ready = false;
      handleCloudError(e, manual);
      mode = 'landing';
      render();
    } finally {
      cloud.pulling = false;
      cloudRefreshUI();
    }
  }

  async function cloudPush(force, manual) {
    if (!cloud.user) return false;
    ensureStateMaps();
    if (cloud.pushing) {
      cloud.pushAgain = true;
      return false;
    }
    cloud.pushing = true;
    cloud.syncing = true;
    const seq = cloud.dirtySeq;
    const sentKey = cloudDataKey();
    cloudRefreshUI();
    try {
      const action = force ? 'force' : 'save';
      const body = force ? { data: state } : { base_rev: cloud.rev, data: state };
      const res = await cloudApi(action, body);
      cloud.rev = Number(res.rev) || (cloud.rev + 1);
      cloud.updatedAt = Number(res.updated_at) || Date.now();
      cloud.error = '';
      cloud.conflict = null;
      cloud.lastData = sentKey;
      cloud.ready = true;
      if (cloud.dirtySeq === seq) cloud.pending = false;
      persistCloudMeta();
      if (manual) toast('已保存到云端');
      return true;
    } catch (e) {
      // 乐观锁冲突：云端已有更新，自动合并后重存一次
      if (!force && e && e.status === 409 && e.data && e.data.remote && e.data.remote.data) {
        const remote = e.data.remote;
        const merged = normalizeState(mergeStates(remote.data, state));
        if (merged) {
          state = merged;
          state.view = view;
          cloud.rev = Number(remote.rev) || cloud.rev;
          cloud.lastData = cloudDataKey();
          try {
            const res2 = await cloudApi('save', { base_rev: cloud.rev, data: state });
            cloud.rev = Number(res2.rev) || (cloud.rev + 1);
            cloud.updatedAt = Number(res2.updated_at) || Date.now();
            cloud.error = '';
            cloud.conflict = null;
            cloud.lastData = cloudDataKey();
            cloud.ready = true;
            if (cloud.dirtySeq === seq) cloud.pending = false;
            persistCloudMeta();
            cloudRefreshUI();
            render();
            if (manual) toast('已合并云端更新并保存');
            return true;
          } catch (e2) {
            handleCloudError(e2, manual);
            return false;
          }
        }
      }
      handleCloudError(e, manual);
      return false;
    } finally {
      cloud.pushing = false;
      cloud.syncing = false;
      cloudRefreshUI();
      if (cloud.pushAgain) {
        cloud.pushAgain = false;
        setTimeout(() => { if (cloud.pending) cloudPush(false); }, 300);
      } else if (cloud.pending && cloud.dirtySeq !== seq) {
        setTimeout(() => { if (cloud.pending) cloudPush(false); }, 300);
      }
    }
  }

  function mergeStates(remote, local) {
    if (!remote || typeof remote !== 'object') return local;
    if (!local || typeof local !== 'object') return remote;
    const out = Object.assign({}, remote);

    // 数组类：按 id 并集合并（本地新增补入，云端为主；软删除字段取非空优先）
    ['habits', 'tasks', 'meds', 'weights', 'essays'].forEach(function (key) {
      const r = Array.isArray(remote[key]) ? remote[key] : [];
      const l = Array.isArray(local[key]) ? local[key] : [];
      const map = {};
      r.forEach(function (item) { if (item && item.id) map[item.id] = item; });
      l.forEach(function (item) {
        if (!item || !item.id) return;
        if (!map[item.id]) {
          map[item.id] = item;
          return;
        }
        const cur = map[item.id];
        if (!cur.archivedAt && item.archivedAt) cur.archivedAt = item.archivedAt;
        if (key === 'meds') {
          /* 以前这里是「整条以云端为准」，结果本地刚改的名字、刚登记的库存都会被丢弃。
             现在按 updatedAt 判断谁更新：新的一侧整体胜出，归档标记只增不减，
             库存基线额外比一次登记时间（它可能来自另一个更晚的显式登记）。 */
          const lu = Number(item.updatedAt) || 0;
          const ru = Number(cur.updatedAt) || 0;
          const pickLocal = lu > ru;
          const newer = pickLocal ? item : cur;
          const older = pickLocal ? cur : item;
          const out2 = Object.assign({}, newer);
          if (!out2.archivedAt && older.archivedAt) out2.archivedAt = older.archivedAt;
          const nt = Date.parse(out2.stockBaseAt || '') || 0;
          const ot = Date.parse(older.stockBaseAt || '') || 0;
          if (older.stockBase !== undefined && ot > nt) {
            out2.stockBase = older.stockBase;
            out2.stockBaseAt = older.stockBaseAt;
            out2.stockReview = older.stockReview;
          }
          map[item.id] = out2;
        }
      });
      out[key] = Object.keys(map).map(function (k) { return map[k]; });
    });

    /* 打卡/用药：按天合并，但两者层级不同，必须分开处理——
       checks 是 {日期: {习惯id: 次数}}，次数取较大值；
       doses  是 {日期: {药品id: {时段: 记录}}}，要多走一层按时段并集。
       以前两者用同一段代码，doses 里 Number({}) 得到 NaN → 0，
       合并一次就会把当天整瓶药的服药记录压成 0（这是「用药数据突然没了」的元凶）。 */
    function mergeByDay(remoteMap, localMap) {
      const r = isPlainObject(remoteMap) ? remoteMap : {};
      const l = isPlainObject(localMap) ? localMap : {};
      const merged = Object.assign({}, r);
      Object.keys(l).forEach(function (day) {
        if (!isPlainObject(merged[day]) || !isPlainObject(l[day])) {
          if (!merged[day]) merged[day] = l[day];
          return;
        }
        const m = Object.assign({}, merged[day]);
        Object.keys(l[day]).forEach(function (k) {
          const lv = l[day][k];
          const rv = m[k];
          if (isPlainObject(lv)) {
            /* 时段级并集（doses）：两边都有的时段取本地那份，其余保留云端 */
            m[k] = Object.assign({}, isPlainObject(rv) ? rv : {}, lv);
          } else {
            /* 次数（checks）：只增不减 */
            m[k] = Math.max(Number(rv) || 0, Number(lv) || 0);
          }
        });
        merged[day] = m;
      });
      return merged;
    }
    out.checks = mergeByDay(remote.checks, local.checks);
    out.doses = mergeByDay(remote.doses, local.doses);

    // 心情：按日期合并，本地优先（最后心情）
    out.moods = Object.assign({}, isPlainObject(remote.moods) ? remote.moods : {}, isPlainObject(local.moods) ? local.moods : {});

    // 随记
    out.notes = Object.assign({}, isPlainObject(remote.notes) ? remote.notes : {}, isPlainObject(local.notes) ? local.notes : {});

    /* 戒烟事件：按 id 去重并集。
       单独一段，不并进上面的 events——events 按 at|id|delta 判重，
       事件流没有 delta，套那个键会让同一秒的两条互相顶掉。 */
    const rCr = Array.isArray(remote.cravings) ? remote.cravings : [];
    const lCr = Array.isArray(local.cravings) ? local.cravings : [];
    const seenCr = {};
    rCr.forEach(function (e) { if (e && e.id) seenCr[e.id] = 1; });
    out.cravings = rCr.concat(lCr.filter(function (e) { return e && e.id && !seenCr[e.id]; }));
    out.cravings.sort(function (a, b) { return Number(a.t) - Number(b.t); });

    /* 买烟记录：按 id 去重并集。跟 cravings 一样单独一段——
       它有自己的时间轴（at），套 events 的判重键会互相顶掉。 */
    const rPk = Array.isArray(remote.packs) ? remote.packs : [];
    const lPk = Array.isArray(local.packs) ? local.packs : [];
    const seenPk = {};
    rPk.forEach(function (p) { if (p && p.id) seenPk[p.id] = 1; });
    out.packs = rPk.concat(lPk.filter(function (p) { return p && p.id && !seenPk[p.id]; }));
    /* cf（末支确认）是「设一次就不再变」的字段，远端那条可能是确认之前存的。
       所以只要本地有值、远端没有，就补回去——不然确认一次白确认。 */
    const lPkMap = {};
    lPk.forEach(function (p) { if (p && p.id) lPkMap[p.id] = p; });
    out.packs = out.packs.map(function (p) {
      const lp = lPkMap[p.id];
      if (lp && Number(lp.cf) && !Number(p.cf)) {
        return { id: p.id, at: p.at, name: p.name, price: p.price, size: p.size, cf: lp.cf };
      }
      return p;
    });
    /* at 主键 + id 次键：同一分钟买两包时，两端算出来的顺序必须完全一致，
       否则「哪包在抽」会两台设备各说各话。 */
    out.packs.sort(function (a, b) {
      return (Number(a.at) - Number(b.at)) || String(a.id).localeCompare(String(b.id));
    });

    /* 自定义通知：按 id 去重并集。跟 packs 一样的做法——
       代价是「只在一端删掉」会被另一端合并回来，所以删除走的是同一套规则，
       真要彻底删得在最后一台设备上删。 */
    const rNo = Array.isArray(remote.notices) ? remote.notices : [];
    const lNo = Array.isArray(local.notices) ? local.notices : [];
    const seenNo = {};
    rNo.forEach(function (n) { if (n && n.id) seenNo[n.id] = 1; });
    out.notices = rNo.concat(lNo.filter(function (n) { return n && n.id && !seenNo[n.id]; }));

    /* 倒数日：按 id 去重并集。合并后按日期排，跟 normalize 一致。 */
    const rCd = Array.isArray(remote.countdowns) ? remote.countdowns : [];
    const lCd = Array.isArray(local.countdowns) ? local.countdowns : [];
    const seenCd = {};
    rCd.forEach(function (n) { if (n && n.id) seenCd[n.id] = 1; });
    out.countdowns = rCd.concat(lCd.filter(function (n) { return n && n.id && !seenCd[n.id]; }));
    out.countdowns.sort(function (a, b) {
      return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
    });



    // 打卡日志：去重并集
    const rEv = Array.isArray(remote.events) ? remote.events : [];
    const lEv = Array.isArray(local.events) ? local.events : [];
    const seen = {};
    rEv.forEach(function (ev) { seen[String(ev.at) + '|' + String(ev.id) + '|' + String(ev.delta)] = true; });
    const extra = lEv.filter(function (ev) { return !seen[String(ev.at) + '|' + String(ev.id) + '|' + String(ev.delta)]; });
    out.events = rEv.concat(extra);

    /* 常驻卡顺序是「一整份偏好」，不能按 id 并集合并——两端各排一次，
       并集会拼出一个两边交错的顺序，谁看都不对。只比 cardOrderAt，
       新的那份整体覆盖；两边都是 0 就保持远端（即默认顺序）。 */
    const lOAt = Number(local.cardOrderAt) || 0;
    const rOAt = Number(remote.cardOrderAt) || 0;
    if (lOAt > rOAt) {
      out.cardOrder = Array.isArray(local.cardOrder) ? local.cardOrder.slice() : [];
      out.cardOrderAt = lOAt;
    }
    /* 清债：集合按 id 并集（同 packs / cravings），单值字段比 moneyAt 取新的。
       代价和别处一样：只在一端删掉的记录会被另一端合回来。 */
    const lM = local.money && typeof local.money === 'object' ? local.money : null;
    const rM = remote.money && typeof remote.money === 'object' ? remote.money : null;
    if (lM || rM) {
      const lm = lM || {}, rm = rM || {};
      const merged = Object.assign({}, rm, lm);
      ['debts', 'log', 'snowflakes', 'incomes', 'cats', 'spends'].forEach(function (k) {
        merged[k] = mergeById(Array.isArray(rm[k]) ? rm[k] : [], Array.isArray(lm[k]) ? lm[k] : []);
      });
      const lK = Number(local.moneyAt) || 0;
      const rK = Number(remote.moneyAt) || 0;
      /* 单值设置（加速钱 / 策略 / 起始月 / 提醒）只认更新的那一端 */
      if (rK > lK) {
        ['extra', 'strategy', 'customOrder', 'startYM', 'notify'].forEach(function (k) {
          if (rm[k] !== undefined) merged[k] = rm[k];
        });
      }
      out.money = merged;
      out.moneyAt = Math.max(lK, rK);
    }
    /* 导航顺序同理：整份覆盖，绝不按 key 并集（并集会拼出两端交错的顺序） */
    const lNAt = Number(local.navOrderAt) || 0;
    const rNAt = Number(remote.navOrderAt) || 0;
    if (lNAt > rNAt) {
      out.navOrder = Array.isArray(local.navOrder) ? local.navOrder.slice() : [];
      out.navOrderAt = lNAt;
    }

    // 身体档案
    out.bodyProfile = Object.assign({}, remote.bodyProfile || {}, local.bodyProfile || {});

    return out;
  }

  function handleCloudError(e, manual) {
    if (e && e.status === 401) {
      /* 后端会把「被其他设备顶替」和「会话过期」分开返回，提示要说清原因，
         否则用户只会看到莫名其妙被踢回登录页。 */
      const replaced = !!(e.data && e.data.code === 'session_replaced');
      cloud.user = null;
      cloud.csrf = '';
      cloud.error = replaced
        ? '这个账号已在其他设备登录，这台设备已退出（同一账号只允许一台设备在线）'
        : '登录已过期，请重新登录';
      cloud.ready = false;
      mode = 'landing';
      view = 'today';
      state.view = 'today';
      persistCloudMeta();
      render();
      /* 被顶替时无论是否手动保存都要提示一次，否则数据看起来「突然没了」 */
      if (manual || replaced) toast(cloud.error);
      return;
    }
    if (e && e.status === 403) {
      cloud.error = '会话校验失败，请刷新页面后重试';
    } else {
      cloud.error = (e && e.message) ? e.message : '同步失败，请稍后重试';
    }
    cloud.pending = true;
    persistCloudMeta();
    cloudRefreshUI();
    if (manual) toast(cloud.error);
  }

  async function cloudInit(force) {
    if (!cloud.available) {
      mode = 'app';
      cloudProbing = false;
      return;
    }
    if (cloud.inited && !force) return;
    cloud.inited = true;
    cloud.error = '';
    cloudProbing = true;
    cloudRefreshUI();
    /* 先画骨架再等网络：否则启动瞬间会先闪一下空数据和落地页 */
    render();
    try {
      const me = await cloudFetchMe();
      if (me.user) {
        mode = 'app';
        await cloudSyncFromServer();
      } else {
        cloud.user = null;
        mode = 'landing';
      }
    } catch (e) {
      cloud.error = '暂时连不上服务器：' + (e.message || '未知错误');
      mode = 'landing';
    }
    cloudProbing = false;
    render();
  }

  async function cloudDoReset(form) {
    const token = form.getAttribute('data-token') || '';
    const pw = form.querySelector('[name="password"]').value || '';
    const pw2 = form.querySelector('[name="password_confirm"]').value || '';
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (errEl) errEl.textContent = '';
    if (pw.length < 8) {
      if (errEl) errEl.textContent = '新密码至少 8 位';
      return;
    }
    if (pw !== pw2) {
      if (errEl) errEl.textContent = '两次输入不一致';
      return;
    }
    if (btn) btn.disabled = true;
    try {
      await cloudApi('password_reset', { token: token, password: pw });
      closeModal();
      /* token 已经用过，从地址栏抹掉，避免刷新时再提交一次 */
      try {
        history.replaceState(null, '', location.pathname);
      } catch (e) {}
      toast('密码已重置，请用新密码登录');
      cloudLoginModal();
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '重置失败';
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  /* 邮件里的链接形如 /?reset=1&token=xxx，落地就弹设置新密码 */
  function checkResetToken() {
    try {
      const u = new URL(location.href);
      if (u.searchParams.get('reset') !== '1') return;
      const t = u.searchParams.get('token') || '';
      if (t.length < 32) return;
      setTimeout(function () { passwordResetModal(t); }, 500);
    } catch (e) {}
  }

  async function registerSendCode(btn) {
    const form = document.getElementById('cloud-register-form');
    if (!form) return;
    const emailEl = form.querySelector('[name="email"]');
    const errEl = form.querySelector('.cloud-error');
    const email = (emailEl ? emailEl.value : '').trim();
    if (errEl) errEl.textContent = '';
    if (!email) {
      if (errEl) errEl.textContent = '先填邮箱，再点发送';
      return;
    }
    const original = btn.textContent;
    btn.disabled = true;
    try {
      await cloudApi('register_code', { email: email });
      let left = 60;
      btn.textContent = left + ' 秒后重发';
      const timer = setInterval(function () {
        left--;
        if (left <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '重新发送';
        } else {
          btn.textContent = left + ' 秒后重发';
        }
      }, 1000);
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '发送失败';
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function cloudDoLogin(form) {
    const email = (form.querySelector('[name="email"]').value || '').trim();
    const password = form.querySelector('[name="password"]').value || '';
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (!email || !password) {
      if (errEl) errEl.textContent = '请填写邮箱和密码';
      return;
    }
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    try {
      await cloudFetchMe();
      const res = await cloudApi('login', { email: email, password: password });
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(res.user.id)) {
        resetLocalForAccount();
        cloud.migrateLegacy = false;
      } else {
        cloud.migrateLegacy = true;
      }
      cloud.owner = String(res.user.id);
      cloud.user = res.user;
      cloud.email = res.user.email;
      cloud.csrf = res.csrf || '';
      cloud.registrationOpen = !!res.registration_open;
      if (res.site_name) cloud.siteName = String(res.site_name);
      cloud.linked = true;
      cloud.ready = false;
      cloud.error = '';
      persistCloudMeta();
      mode = 'app';
      view = 'today';
      state.view = 'today';
      closeModal();
      toast('已登录，正在同步…');
      render();
      await cloudSyncFromServer({ manual: true });
      if (view === 'settings') render();
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '登录失败';
      else toast(e.message || '登录失败');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function cloudDoRegister(form) {
    const display = (form.querySelector('[name="display_name"]').value || '').trim();
    const email = (form.querySelector('[name="email"]').value || '').trim();
    const password = form.querySelector('[name="password"]').value || '';
    const confirm = form.querySelector('[name="password_confirm"]').value || '';
    const mode = form.getAttribute('data-mode') || 'invite';
    const inviteEl = form.querySelector('[name="invite"]');
    const codeEl = form.querySelector('[name="code"]');
    const invite = inviteEl ? (inviteEl.value || '').trim().toUpperCase() : '';
    const code = codeEl ? (codeEl.value || '').trim() : '';
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (!email || !password) {
      if (errEl) errEl.textContent = '请填写邮箱和密码';
      return;
    }
    if (mode === 'invite' && !invite) {
      if (errEl) errEl.textContent = '请填写邀请码';
      return;
    }
    if (mode === 'email' && !code) {
      if (errEl) errEl.textContent = '请填写邮箱验证码';
      return;
    }
    if (password.length < 8) {
      if (errEl) errEl.textContent = '密码至少 8 位';
      return;
    }
    if (password !== confirm) {
      if (errEl) errEl.textContent = '两次输入的密码不一致';
      return;
    }
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    try {
      await cloudFetchMe();
      const res = await cloudApi('register', {
        display_name: display,
        email: email,
        password: password,
        invite: invite,
        code: code
      });
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(res.user.id)) {
        resetLocalForAccount();
      }
      state = seedState();
      cloud.migrateLegacy = false;
      cloud.owner = String(res.user.id);

    if (cloud.pending) await cloudPush(false, true);
    if (cloud.pending && !confirm('还有修改没有保存到云端。退出后这些修改会丢失，继续吗？')) return;
    try {
      if (cloud.user) await cloudApi('logout', {});
    } catch (e) {
      if (e.status !== 401) {
        toast('退出失败：' + e.message);
        return;
      }
    }
    cloud.user = null;
    cloud.csrf = '';
    cloud.rev = 0;
    cloud.updatedAt = 0;
    cloud.pending = false;
    cloud.conflict = null;
    cloud.error = '';
    cloud.migrateLegacy = false;
    cloud.ready = false;
    state = seedState();
    clearLegacyState();
    cloud.lastData = cloudDataKey();
    persistCloudMeta();
    mode = 'landing';
    view = 'today';
    closeModal();
    render();

  /* ============================================================
     指标计算
     ============================================================ */
  function countOf(d, id) {
    const day = state.checks[d];
    return (day && day[id]) || 0;
  }
  function setCount(d, id, value) {
    const v = Math.max(0, Math.round(value));
    if (!state.checks[d]) state.checks[d] = {};
    if (v <= 0) delete state.checks[d][id];
    else state.checks[d][id] = v;
    if (Object.keys(state.checks[d]).length === 0) delete state.checks[d];
    save();
  }
  /* ============================================================
     戒烟：事件流
     一次「想抽」只有两种结局：抽了(s) / 忍住了(r)。两个都要记——
     它们回答的不是同一个问题：s 是失守，r 是胜利。
     只让用户记 s 的话，人会因为「不想承认」而少记，数据就废了。
     不参与 checks 计数：checks 是「今天做了几次」的计数语义，
     混进去会让完成度、连续天数、月历每一处都要再判一次类型。
     ============================================================ */
  const CRAVE_TRIGGERS = [
    { k: 'meal',   label: '饭后' },
    { k: 'stress', label: '压力' },
    { k: 'social', label: '社交' },
    { k: 'bored',  label: '无聊' },
    { k: 'drive',  label: '开车' },
    { k: 'drink',  label: '喝酒' },
    { k: 'other',  label: '其他' }
  ];
  /* 习惯只有三类，靠 type 分，不再用子字段：
       build = 保持（早睡这类）：点一下 = 今天达标
       quit  = 戒除（不熬夜这类）：点一下 = 今天没守住，不点 = 一直守着
       smoke = 戒烟，站点自带的特殊常驻卡（只有 h_drink 一条）：
               双按钮「点一根 / 忍一次」+ 烟盒 + 买烟记录 + 抽烟趋势
     戒烟不放进「添加习惯」的类型下拉里——它是内置卡，不是可选类型。 */
  const QUIT_WORD = {
    quit:  { hero: '破', hold: '守', keep: '守住' },
    smoke: { s: '点一根', r: '忍一次', hero: '抽', hold: '忍', keep: '无烟',
             note: '想抽的时候点一下 · 抽了和忍住了都记', unit: '每天保持 0 根' }
  };

  /* 戒烟是独立类型；老数据里它是 type:'quit' + quitKind:'smoke'，
     迁移时会被改成 'smoke'（见 ensureStateMaps），这里兜一刀。 */
  function isSmoke(h) {
    return !!h && (h.type === 'smoke' || (h.type === 'quit' && h.quitKind === 'smoke'));
  }
  /* 两类都走事件流、都进统计：别用 type === 'quit' 判断，会漏掉戒烟 */
  function isQuitLike(h) { return !!h && (h.type === 'quit' || h.type === 'smoke'); }
  /* 戒除的打卡方式（v79）：
     once  = 每日单次，点了就是破了，再点撤销（老行为）
     multi = 每日多次，一天可以记好几次（比如奶茶喝了两杯）
     **缺省 once**，所以所有老习惯零迁移、行为一点不变。
     戒烟（type:'smoke'）走自己的双按钮 + 烟盒，不用这个字段。 */
  function isMultiSlip(h) {
    return !!h && h.type === 'quit' && h.slipMode === 'multi';
  }

  function quitWord(h) { return QUIT_WORD[isSmoke(h) ? 'smoke' : 'quit']; }
  /* 按钮文案（含补记诱因弹窗、时间线条目）——只有戒烟有「两个结局」 */
  function craveCn(k, h) {
    const w = quitWord(h);
    return k === 's' ? w.s : w.r;
  }
  /* 当天「没守住」的次数。戒除/戒烟的事件都存 cravings，k==='s' 就是失守 */
  function quitSlips(h, d) {
    return dayCravings(h.id, d).filter(function (e) { return e.k === 's'; }).length;
  }
  /* 里程碑：粗粒度，太密会让人一直「差一点」，反而不想看 */
  const QUIT_MILESTONES = [1, 3, 7, 14, 30, 60, 90, 180, 365];
  const QUIT_MILE_CN = {
    1: '1 天', 3: '3 天', 7: '一周', 14: '两周', 30: '一个月',
    60: '两个月', 90: '三个月', 180: '半年', 365: '一年'
  };

  function craveList() {
    return Array.isArray(state.cravings) ? state.cravings : [];
  }
  /* 秒级时间戳 → 'YYYY-MM-DD' / 'HH:MM'（本地时区，和 todayStr 同一口径） */
  function tsDay(ts) { return fmt(new Date(Number(ts) * 1000)); }
  function tsHHMM(ts) {
    const d = new Date(Number(ts) * 1000);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  /* <input type="datetime-local"> 要的是 'YYYY-MM-DDTHH:MM'（本地时区，不带秒） */
  function dtLocalVal(ts) {
    const d = new Date(Number(ts) * 1000);
    return fmt(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function habitById(hid) {
    return (state.habits || []).find(function (x) { return x.id === hid; }) || null;
  }
  function cravingsOf(hid) {
    return craveList().filter(function (e) { return e.h === hid; });
  }
  function dayCravings(hid, ds) {
    return cravingsOf(hid).filter(function (e) { return tsDay(e.t) === ds; });
  }
  function lastSmokeTs(hid) {
    const list = cravingsOf(hid);
    for (let i = list.length - 1; i >= 0; i--) if (list[i].k === 's') return list[i].t;
    return 0;
  }
  /* 戒烟起点：优先显式设置，否则退回习惯创建日 */
  function quitStartDay(h) {
    const s = String(h.quitStart || '');
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    return h.createdAt ? String(h.createdAt).slice(0, 10) : todayStr();
  }
  /* 连续无烟天数：今天 - 最后一次「抽了」那天。今天抽过就是 0；
     从没抽过则从戒烟起点算（含当天，所以 +1）。 */
  function quitStreak(h) {
    const last = lastSmokeTs(h.id);
    const diff = Math.round((parseD(todayStr()) - parseD(last ? tsDay(last) : quitStartDay(h))) / 86400000);
    return Math.max(0, last ? diff : diff + 1);
  }
  /* 区间统计。days=0 表示只看今天，days>0 表示最近 N 天。 */
  function quitRange(h, days) {
    const t0 = parseD(todayStr()).getTime();
    let smoke = 0, resist = 0;
    cravingsOf(h.id).forEach(function (e) {
      const diff = Math.round((t0 - parseD(tsDay(e.t)).getTime()) / 86400000);
      if (days > 0 ? (diff >= days || diff < 0) : diff !== 0) return;
      if (e.k === 's') smoke++; else resist++;
    });
    const total = smoke + resist;
    return { smoke: smoke, resist: resist, total: total, rate: total ? resist / total : 0 };
  }
  /* 最长连续无烟段：扫全部「抽了」事件，求相邻两条之间的最大间隔 */
  function quitBest(h) {
    /* 只算戒烟起点之后的「点一根」。起点之前的记录属于上一轮，
       混进来会出现「累计 0 天 · 最长 4 天」这种自相矛盾。 */
    const startMs = parseD(quitStartDay(h)).getTime();
    const list = cravingsOf(h.id).filter(function (e) {
      return e.k === 's' && parseD(tsDay(e.t)).getTime() >= startMs;
    });
    if (!list.length) return quitStreak(h);
    let best = 0;
    let prev = startMs;
    list.forEach(function (e) {
      const cur = parseD(tsDay(e.t)).getTime();
      best = Math.max(best, Math.round((cur - prev) / 86400000));
      prev = cur;
    });
    return Math.max(best, quitStreak(h));
  }
  /* 累计无烟天数：起点到今天的天数 - 有「抽了」的天数 */
  function quitTotal(h) {
    const start = parseD(quitStartDay(h)).getTime();
    const span = Math.max(0, Math.round((parseD(todayStr()) - start) / 86400000)) + 1;
    const badDays = {};
    cravingsOf(h.id).forEach(function (e) { if (e.k === 's') badDays[tsDay(e.t)] = 1; });
    return Math.max(0, span - Object.keys(badDays).length);
  }
  /* 24 小时分布：只数「抽了」——想抽但忍住的那个时段，其实不是危险时段 */
  function craveHours(hid) {
    const bins = new Array(24).fill(0);
    cravingsOf(hid).forEach(function (e) {
      if (e.k !== 's') return;
      bins[new Date(Number(e.t) * 1000).getHours()]++;
    });
    return bins;
  }
  /* 失守诱因排行：只数「抽了」。
     把「忍住了」的诱因也混进来会出现「压力 7 次」但其实只抽了 3 根的矛盾，
     而且两件事回答的是不同的问题：什么是危险场景 vs 什么场景能扛住。 */
  function craveTriggers(hid) {
    const map = {};
    cravingsOf(hid).forEach(function (e) {
      if (!e.g || e.k !== 's') return;
      map[e.g] = (map[e.g] || 0) + 1;
    });
    return Object.keys(map).map(function (k) {
      const t = CRAVE_TRIGGERS.find(function (x) { return x.k === k; });
      return { k: k, label: t ? t.label : k, n: map[k] };
    }).sort(function (a, b) { return b.n - a.n; });
  }

  /* ===== 一包烟的区间（全部派生，一个字段都不存） =====
     「哪包在抽 / 抽到第几支 / 还剩几包」如果存成字段，就要维护：撤销、补记、
     改买烟日期、两台设备同时点，每条路径都会让它对不上（跟药品库存同一个道理）。
     规则：第 k 包起点 = max(这包的买烟时刻, 上一包抽完的时刻)，
           终点 = 第 size 支的记录时刻；不足 size 支就是还没抽完。
     max() 那一下就是「自动绑定下一包」——不用字段，也不用用户点「开新包」。
     一次买三条只抽第一条时，后两包的起点还在未来，天然就是库存。
     顺带解决：同一天买两包（at 相同）不再共用同一个计数窗口，两包各吃各的一段。 */
  function packSpans(h) {
    const packs = Array.isArray(state.packs) ? state.packs : [];
    const hits = cravingsOf(h.id).filter(function (e) { return e.k === 's'; })
      .sort(function (a, b) { return Number(a.t) - Number(b.t); });
    const out = [];
    let idx = 0, prevEnd = 0;
    packs.forEach(function (p) {
      const size = Math.max(1, Number(p.size) || 20);
      const openAt = Math.max(Number(p.at) || 0, prevEnd);
      const base = {
        pack: p, size: size, used: 0, openAt: openAt, closeAt: 0, done: false,
        cf: Math.round(Number(p.cf) || 0)
      };
      /* 上一包还没抽完（prevEnd 是无穷大），这包就还没拆，used 恒 0 */
      if (!isFinite(openAt)) { out.push(base); return; }
      let n = 0, end = 0;
      while (idx < hits.length && n < size) {
        const t = Number(hits[idx].t);
        if (t < openAt) { idx++; continue; }   /* 早于开包：属于更早的包，或者散烟 */
        n++; end = t; idx++;
      }
      base.used = n;
      base.done = n >= size;
      base.closeAt = base.done ? end : 0;
      out.push(base);
      prevEnd = base.done ? end + 1 : Infinity;
    });
    return out;
  }
  function spanOf(h, pack) {
    if (!pack) return null;
    const id = String(pack.id || '');
    const list = packSpans(h);
    for (let i = 0; i < list.length; i++) if (String(list[i].pack.id) === id) return list[i];
    return null;
  }
  /* 当前这包 = 第一个没抽满的；全抽满了就退回最后一包，用来展示「已抽完」状态 */
  function currentSpan(h) {
    const list = packSpans(h);
    if (!list.length) return null;
    for (let i = 0; i < list.length; i++) if (!list[i].done) return list[i];
    return list[list.length - 1];
  }
  function currentPack(h) {
    const sp = currentSpan(h);
    return sp ? sp.pack : null;
  }
  /* 这包抽掉几支。封顶到 size —— 超出部分归下一包，归不进去就是「未归包」的散烟 */
  function packUsed(h, pack) {
    const sp = spanOf(h, pack);
    return sp ? sp.used : 0;
  }
  /* 没归进任何一包的支数：库存空的时候抽的那些。
     它们不是脏数据 —— 那天确实抽了，只是当时手里没有这一批里的包。 */
  function packOrphans(h) {
    let total = 0, used = 0;
    cravingsOf(h.id).forEach(function (e) { if (e.k === 's') total++; });
    packSpans(h).forEach(function (sp) { used += sp.used; });
    return Math.max(0, total - used);
  }
  /* 还没轮到的包 = 库存 */
  function packStock(h) {
    const now = Math.round(Date.now() / 1000);
    return packSpans(h).filter(function (sp) { return !sp.done && sp.openAt > now; }).length;
  }
  /* 某一天结束时（23:59:59）正在抽的那包。历史日期要显示「那天的烟盒」，
     靠它才能知道那天还剩几支——用 currentSpan 会拿到今天的包，数字对不上。 */
  function spanOnDay(h, ds) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ds || ''))) return null;
    const end = Math.round(parseD(ds).getTime() / 1000) + 86399;
    let hit = null;
    packSpans(h).forEach(function (sp) {
      if (sp.openAt <= end) hit = sp;
    });
    return hit;
  }
  /* 这包截至 ts 已经抽掉几支（不含 ts 之后的记录） */
  function usedUntil(h, sp, ts) {
    if (!sp || sp.openAt > ts) return 0;
    if (sp.closeAt && sp.closeAt <= ts) return sp.size;
    let n = 0;
    cravingsOf(h.id).forEach(function (e) {
      if (e.k === 's' && Number(e.t) >= sp.openAt && Number(e.t) <= ts) n++;
    });
    return Math.min(n, sp.size);
  }
  /* 那天还能补几支：那包在那天结束时的剩余。0 表示那天已经抽完了。 */
  function backfillLeft(h, ds) {
    const sp = spanOnDay(h, ds);
    if (!sp) return 0;
    const end = Math.round(parseD(ds).getTime() / 1000) + 86399;
    return Math.max(0, sp.size - usedUntil(h, sp, end));
  }
  /* 补记用的时间槽：那天 06:00 起每 30 分钟一个，跳过已被占用的分钟。
     首末两支的真实时间由用户在卡面上确认（pack.cf），这里只要顺序对、不跨天。 */
  function backfillSlots(h, ds, n) {
    const base = Math.round(parseD(ds).getTime() / 1000);
    const taken = {};
    cravingsOf(h.id).forEach(function (e) {
      if (tsDay(e.t) === ds) taken[Math.round((Number(e.t) - base) / 60)] = 1;
    });
    const out = [];
    /* 起点不能早于这包的开包时刻：早于 openAt 的记录归不进这包，
       会变成「未归包」，补了等于白补。 */
    const sp = spanOnDay(h, ds);
    let m = 6 * 60;
    if (sp && Number(sp.openAt) > base) {
      m = Math.max(m, Math.ceil((Number(sp.openAt) - base) / 60));
    }
    while (out.length < n && m <= 23 * 60 + 30) {
      if (!taken[m]) { out.push(base + m * 60); taken[m] = 1; }
      m += 30;
    }
    /* 一天槽位被塞满的极端情况，直接往后排，保证条数不缺 */
    while (out.length < n) out.push(base + (out.length + 1) * 60);
    return out;
  }
  /* 库存为 0 且当前这包已经抽满 = 不能再记。
     这是库存模型的原意：一包 size 支，抽满就到底，没有下一包就没有下一支。
     不加这道闸，超出部分会被记成「未归包」，于是「今天抽了几支」能涨到 21，
     而烟盒和买烟记录仍然是 20/20 —— 两个数字打架，看起来就是算错了。 */
  function packBlocked(h) {
    const sp = currentSpan(h);
    if (!sp) return true;          /* 一条买烟记录都没有，先让他记一笔 */
    if (sp.openAt > Math.round(Date.now() / 1000)) return true;  /* 这包还没轮到拆 */
    return sp.done && packStock(h) === 0;
  }

  function packSpanText(sec) {
    const m = Math.max(0, Math.round(sec / 60));
    if (m < 60) return m + ' 分钟';
    const hh = Math.floor(m / 60), mm = m % 60;
    if (hh < 24) return hh + ' 小时' + (mm ? ' ' + mm + ' 分' : '');
    const dd = Math.floor(hh / 24), rh = hh % 24;
    /* 超过一周后小时粒度没意义，反而像在报秒表 */
    if (dd >= 7) return dd + ' 天';
    return dd + ' 天' + (rh ? ' ' + rh + ' 小时' : '');
  }
  /* 时长终点：用户软确认过就用确认值，没确认就用最后一条记录的时刻 */
  function packSpanEnd(sp) { return sp.cf || sp.closeAt; }
  /* 抽完了算「首支 → 末支」，还在抽算「开包 → 现在」。
     补记会把末支的记录时间推后，所以末支允许用户确认一次（见 quitCard 的软确认条）。 */
  function packSpanTextOf(sp) {
    if (!sp) return '';
    const end = sp.done ? packSpanEnd(sp) : Math.round(Date.now() / 1000);
    return packSpanText(Math.max(0, end - sp.openAt));
  }
  function packSpan(h, pack) {
    return packSpanTextOf(spanOf(h, pack));
  }
  /* 上一包 vs 这一包：两边都按「首支 → 末支」算，不再用「下一包的开包时间」倒推 */
  function packCompareLine(h) {
    const spans = packSpans(h);
    if (spans.length < 2) return '';
    const cur = spans[spans.length - 1];
    const prev = spans[spans.length - 2];
    if (!prev.done) return '';
    const prevSpan = Math.max(0, packSpanEnd(prev) - prev.openAt);
    if (prevSpan <= 0) return '';
    if (!cur.done) return '上一包 ' + packSpanText(prevSpan) + ' 就抽完了';
    const curSpan = Math.max(0, packSpanEnd(cur) - cur.openAt);
    return '上一包 ' + packSpanText(prevSpan) + ' · 这一包 ' + packSpanText(curSpan);
  }

  /* d 省略 = 今天，画当前这包；传了历史日期就画「那天结束时的样子」，
     否则用户切到昨天看到的剩余是今天的，补记必然记错。 */
  function packGridHtml(h, d) {
    const isToday = !d || d === todayStr();
    const sp = isToday ? currentSpan(h) : spanOnDay(h, d);
    const used = isToday
      ? (sp ? sp.used : 0)
      : usedUntil(h, sp, Math.round(parseD(d).getTime() / 1000) + 86399);
    if (!sp) {
      return '<div class="pack-grid is-empty">' +
        '<button type="button" class="pack-open" data-act="pack-open">记一笔买烟</button>' +
      '</div>';
    }
    const filled = Math.min(used, sp.size);
    let cells = '';
    for (let i = 0; i < sp.size; i++) {
      cells += '<i class="pk' + (i < filled ? ' out' : '') + '"></i>';
    }
    return '<div class="pack-grid' + (sp.done ? ' is-done' : '') + '">' + cells + '</div>';
  }

  /* 省钱：按「累计无烟天数」折算，不用「连续」——
     复吸一次就把省下的钱清零，等于告诉用户「白戒了」，会让人干脆不记。 */
  function quitSaved(h) {
    const perDay = Number(h.quitPerDay) || 0;
    const price = Number(h.quitPackPrice) || 0;
    const pack = Math.max(1, Number(h.quitPackSize) || 20);
    if (!perDay || !price) return null;
    const days = quitTotal(h);
    const sticks = Math.round(days * perDay);
    return { days: days, sticks: sticks, money: sticks * (price / pack) };
  }

  function quitNextMile(streak) {
    const next = QUIT_MILESTONES.find(function (m) { return m > streak; });
    if (next === undefined) return null;
    const prev = QUIT_MILESTONES.filter(function (m) { return m <= streak; }).pop() || 0;
    const pct = clamp(Math.round((streak - prev) / (next - prev) * 100), 0, 100);
    return { days: next, left: next - streak, pct: pct };
  }

  function addCraving(hid, kind) {
    const h = (state.habits || []).find(function (x) { return x.id === hid; });
    if (!isQuitLike(h)) return;
    if (kind !== 's' && kind !== 'r') return;
    /* 一包抽满、库存又是 0 时不再收这条记录。挡在数据层而不是只靠按钮的 disabled：
       disabled 能被回车提交绕过，也可能来自没刷新的旧页面。 */
    if (kind === 's' && isSmoke(h) && packBlocked(h)) {
      toast('这包已经抽完了 · 记一笔买烟后才能继续记');
      return;
    }
    if (!Array.isArray(state.cravings)) state.cravings = [];
    const now = Math.round(Date.now() / 1000);
    const last = state.cravings[state.cravings.length - 1];
    /* 手抖双击挡掉，但别挡「补记今天抽了几支」——那种是一分钟连点几次的。
       1 秒以内才算误触；有撤销兜底，漏记比错记更难忍。
       **多次破戒模式不挡**：一天两杯奶茶就是两次，用户可能一秒内连点，
       挡掉等于记不进去；误点有旁边的「撤销」兜底。 */
    if (!isMultiSlip(h) && last && last.h === hid && last.k === kind && now - last.t < 1) {
      toast('刚刚已经记过了');
      return;
    }
    /* 抽了就要记下来，任何时候都不拦——记录是事实，归包只是口径。
       但要让用户知道这一次落在哪里：接到下一包了，还是没包可归。 */
    const watchPack = isSmoke(h) && kind === 's';
    const doneBefore = watchPack ? packSpans(h).filter(function (x) { return x.done; }).length : 0;
    const orphBefore = watchPack ? packOrphans(h) : 0;
    state.cravings.push({ id: uid(), t: now, k: kind, h: hid, g: '', s: 0 });
    save();
    render();
    if (watchPack) {
      const doneAfter = packSpans(h).filter(function (x) { return x.done; }).length;
      if (packOrphans(h) > orphBefore) {
        toast('库存空了 · 这 1 支先记着，补一笔买烟后会自动归到新包');
        return;
