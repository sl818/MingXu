<script>
(function () {
  'use strict';

  /* ============================================================
     基础工具
     ============================================================ */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const pad2 = n => String(n).padStart(2, '0');
  const fmt = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const parseD = s => {
    const p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  };
  const addDays = (d, n) => {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  };
  const todayStr = () => fmt(new Date());
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
  const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6);

  const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
  const MONTH_CN = ['一', '二', '三', '四', '五', '六', '日'];
  const TAGS = { '健康': '#2f7d5c', '生活': '#8a6524', '工作': '#9a5a2f', '学习': '#6b5b8e', '其他': '#6f7468' };
  const PRIO = { '高': '#b0473d', '中': '#8a6524', '低': '#6f7468' };
  const MOODS = [
    { key: 'sad', emoji: '😞', label: '不开心' },
    { key: 'ok', emoji: '😐', label: '正常' },
    { key: 'happy', emoji: '😄', label: '开心' }
  ];
  const MOOD_MAP = {};
  MOODS.forEach(m => { MOOD_MAP[m.key] = m; });
  const STATUS = { todo: '待办', doing: '进行中', done: '已完成', cancelled: '已取消' };
  const STATUS_ORDER = ['todo', 'doing', 'done', 'cancelled'];
  const FLOW = ['todo', 'doing', 'done'];
  const PINNED_IDS = ['h_med', 'h_water', 'h_move', 'h_breathe'];

  const KEY = 'lifeboard.v1';
  const CLOUD_KEY = 'lifeboard.cloud';
  const THEME_MODE_KEY = 'lifeboard.theme.mode';
  const SKIN_KEY = 'lifeboard.skin';
  const LAYOUT_KEY = 'lifeboard.layout';
  const SKINS = [
    { key: 'paper', name: '暖绒 · 鼠尾草', desc: '鼠尾草 / 奶油纸 / 柔和', bg: '#f8f3ea', card: '#fffcf6', side: '#3f5a49', accent: '#567458' },
    { key: 'slate', name: '冷雾 · 矩阵', desc: '雾蓝 / 全息 / 科技', bg: '#eaf2f7', card: '#fbfdff', side: '#071725', accent: '#16708a' },
    { key: 'mono',  name: '石墨 · 朱砂', desc: '石白 / 墨黑 / 朱砂', bg: '#f0ece4', card: '#fffdf8', side: '#ece6dc', accent: '#c24b3a' },
    { key: 'clay',  name: '柔光 · 拟态', desc: '柔灰 / 浮雕 / 内阴影', bg: '#e9edf2', card: '#e9edf2', side: '#eef2f7', accent: '#5b7fa6' },
    { key: 'mist',  name: '雾蓝 · 云水', desc: '雾蓝 / 云白 / 静谧', bg: '#f4f7fa', card: '#ffffff', side: '#dce7f0', accent: '#43688a' },
    { key: 'forest', name: '苔绿 · 森野', desc: '苔绿 / 森野 / 沉稳', bg: '#f2f5f0', card: '#fbfdf9', side: '#e0eadb', accent: '#3e6b4f' },
    { key: 'neu',   name: '拟态 · 素白', desc: '新拟态 / 软浮雕', bg: '#e4e9f0', card: '#e4e9f0', side: '#e4e9f0', accent: '#4a5876' },
    { key: 'cyber', name: '赛博 · 霓虹', desc: '霓虹品红 / 荧光青', bg: '#f1e8ff', card: '#faf5ff', side: '#170a2a', accent: '#9727e3' },
    { key: 'retro', name: '复古 · 街机', desc: '像素 / 块状阴影 / 撞色', bg: '#fdf6e3', card: '#fffdf7', side: '#fdf6e3', accent: '#c2441e' }
  ];

  /* ============================================================
     状态与持久化
     ============================================================ */
  function seedState() {
    const t = todayStr();
    const iso = new Date().toISOString();
    return {
      version: 2,
      view: 'today',
      habits: [
        { id: 'h_med',   name: '用药', icon: '💊', type: 'build', target: 1, unit: '次', color: '#2f6f5e', note: '用药记录', createdAt: iso, pinned: true, med: true },
        { id: 'h_water', name: '喝水', icon: '💧', type: 'build', target: 9, unit: '杯', color: '#4c7f96', note: '每天 9 杯 · 共 2300 ml', perMl: 250, goalMl: 2300, createdAt: iso, pinned: true },
        { id: 'h_move',  name: '运动', icon: '🏃', type: 'build', target: 1, unit: '次', color: '#b5733f', note: '30 分钟以上', createdAt: iso, pinned: true },
        { id: 'h_breathe', name: '478呼吸法', icon: '🌬️', type: 'build', target: 1, unit: '组', color: '#5b8f8a', note: '4-7-8 呼吸', breatheCycles: 4, suggestTime: '15:00', createdAt: iso, pinned: true },
        { id: 'h_drink', name: '戒烟', icon: '🚭', type: 'quit',  target: 1, unit: '次', color: '#9c5a5a', note: '保持 0 次', createdAt: iso, pinned: false }
      ],
      checks: {},
      notes: {}, // 保留旧版备份中的随记数据；当前版本没有随记界面
      moods: {},
      events: [],
      meds: [
        { id: 'med_default', name: '吃药', purpose: '其他', form: '片', strength: '', doseAmount: 1, doseUnit: '片', times: ['08:00', '20:00'], courseType: 'long', startDate: t, endDate: '', reviewDate: '', status: 'active', stock: '', note: '早晚各一次', createdAt: iso }
      ],
      doses: {},
      bodyProfile: { age: 0, height: 0 },
      weights: [],
      essays: [],
      tasks: [
        { id: uid(), title: '整理这周的用药时间', note: '把早/晚的药分装好', tag: '健康', priority: '中', status: 'doing', due: t, createdAt: iso },
        { id: uid(), title: '晚上散步 30 分钟', note: '', tag: '健康', priority: '中', status: 'todo', due: t, createdAt: iso },
        { id: uid(), title: '预约下个月的体检', note: '记得空腹', tag: '健康', priority: '高', status: 'todo', due: fmt(addDays(new Date(), 3)), createdAt: iso },
        { id: uid(), title: '补充家里的常备药', note: '', tag: '生活', priority: '低', status: 'done', due: fmt(addDays(new Date(), -1)), createdAt: iso, doneAt: fmt(addDays(new Date(), -1)) }
      ]
    };
  }

  const OLD_SEED_COLORS = { h_med: '#5b6bf0', h_water: '#2a9dbf', h_move: '#1f9d67', h_drink: '#e08a3c' };
  const NEW_SEED_COLORS = { h_med: '#2f6f5e', h_water: '#4c7f96', h_move: '#b5733f', h_drink: '#9c5a5a' };

  function migrateColors(data) {
    if (!data || (Number(data.version) || 1) >= 2) return data;
    if (Array.isArray(data.habits)) {
      data.habits.forEach(h => {
        if (h && OLD_SEED_COLORS[h.id] && String(h.color || '').toLowerCase() === OLD_SEED_COLORS[h.id]) {
          h.color = NEW_SEED_COLORS[h.id];
        }
      });
    }
    data.version = 2;
    return data;
  }

  function migratePinned(data) {
    if (data && Array.isArray(data.habits)) {
      data.habits.forEach(h => {
        if (h && PINNED_IDS.indexOf(h.id) >= 0) h.pinned = true;
      });
    }
    return data;
  }

  function migrateMeds(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    let medHabit = data.habits.find(h => h.id === 'h_med');
    if (!medHabit) {
      medHabit = {
        id: 'h_med', name: '用药', icon: '💊', type: 'build', target: 1, unit: '次',
        color: '#2f6f5e', note: '用药记录', createdAt: new Date().toISOString(), pinned: true, med: true
      };
      data.habits.unshift(medHabit);
    }
    medHabit.med = true;
    medHabit.pinned = true;
    medHabit.target = 1;
    medHabit.name = '用药';
    medHabit.icon = '💊';
    if (!medHabit.note) medHabit.note = '用药记录';
    if (!Array.isArray(data.meds)) {
      data.meds = [];
      if (medHabit) {
        data.meds.push({
          id: 'med_default', name: '吃药', purpose: '其他', form: '片', strength: '',
          doseAmount: 1, doseUnit: '片', times: ['08:00', '20:00'],
          courseType: 'long', startDate: todayStr(), endDate: '', reviewDate: '',
          status: 'active', stock: '', note: '早晚各一次', createdAt: new Date().toISOString()
        });
      }
    }
      if (!data.meds || typeof data.meds !== 'object' || !Array.isArray(data.meds)) data.meds = [];
      data.meds = data.meds.map(m => {
        const x = m || {};
        return Object.assign({
          id: 'med_' + uid(), name: '用药', purpose: '其他', form: '片', strength: '',
          doseAmount: 1, doseUnit: '片', times: [], courseType: 'long', startDate: todayStr(),
          endDate: '', reviewDate: '', status: 'active', stock: '', note: '', createdAt: new Date().toISOString()
        }, x, { times: (Array.isArray(x.times) ? x.times : []).filter(t => /^([01]\d|2[0-3]):[0-5]\d$/.test(t)).sort() });
      });
      if (!data.doses || typeof data.doses !== 'object' || Array.isArray(data.doses)) data.doses = {};
      return data;
  }

  function migrateQuitHabit(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    data.habits.forEach(h => {
      if (h && h.id === 'h_drink' && h.name === '喝多') {
        h.name = '戒烟';
        h.icon = '🚭';
      }
    });
    return data;
  }

  function ensureBreathingHabit(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    let h = data.habits.find(x => x && x.id === 'h_breathe');
    if (!h) {
      h = {
        id: 'h_breathe', name: '478呼吸法', icon: '🌬️', type: 'build',
        target: 1, unit: '组', color: '#5b8f8a', note: '4-7-8 呼吸',
        breatheCycles: 4, suggestTime: '15:00',
        createdAt: new Date().toISOString(), pinned: true
      };
      data.habits.push(h);
    } else {
      h.pinned = true;
      h.optional = false;
      h.type = 'build';
      h.target = 1;
      h.unit = '组';
      h.breatheCycles = Math.max(1, Math.min(8, Number(h.breatheCycles) || 4));
      h.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(h.suggestTime || '')) ? h.suggestTime : '15:00';
      h.name = h.name || '478呼吸法';
      h.icon = h.icon || '🌬️';
    }
    return data;
  }

  function normalizeBodyProfile(p) {
    const age = parseInt(p && p.age, 10);
    const height = Number(p && p.height);
    if (!isFinite(age) || age < 1 || age > 120 || !isFinite(height) || height < 50 || height > 250) {
      return { age: 0, height: 0 };
    }
    return { age: Math.round(age), height: Math.round(height * 10) / 10 };
  }

  function hasBodyProfile() {
    const p = normalizeBodyProfile(state.bodyProfile);
    return p.age > 0 && p.height > 0;
  }

  function normalizeWeightRecord(w) {
    if (!w || typeof w !== 'object') return null;
    const date = String(w.date || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || fmt(parseD(date)) !== date || date > todayStr()) return null;
    const rawWeight = Number(w.weight);
    const rawHeight = Number(w.height);
    const rawAge = parseInt(w.age, 10);
    if (!isFinite(rawWeight) || rawWeight <= 0 || !isFinite(rawHeight) || rawHeight <= 0 || !isFinite(rawAge) || rawAge <= 0) return null;
    const weight = Math.round(clamp(rawWeight, 1, 500) * 10) / 10;
    const height = Math.round(clamp(rawHeight, 50, 250) * 10) / 10;
    const age = Math.round(clamp(rawAge, 1, 120));
    return {
      id: String(w.id || ('w_' + uid())),
      date: date,
      age: age,
      height: height,
      weight: weight,
      bmi: calcBmi(weight, height),
      createdAt: w.createdAt || new Date().toISOString()
    };
  }

  function normalizeEssayTags(value) {
    const raw = Array.isArray(value) ? value : (typeof value === 'string' ? value.split(/[,，、]/) : []);
    const out = [];
    raw.forEach(tag => {
      const t = String(tag || '').trim().slice(0, 12);
      if (t && out.indexOf(t) < 0 && out.length < 5) out.push(t);
    });
    return out;
  }

  function normalizeEssayRecord(e) {
    if (!e || typeof e !== 'object') return null;
    const text = String(e.text || '').trim().slice(0, 5000);
    if (!text) return null;
    const rawDate = String(e.date || '');
    const date = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) && fmt(parseD(rawDate)) === rawDate && rawDate <= todayStr()
      ? rawDate : todayStr();
    return {
      id: String(e.id || ('e_' + uid())),
      date: date,
      title: String(e.title || '').trim().slice(0, 60),
      text: text,
      tags: normalizeEssayTags(e.tags),
      createdAt: e.createdAt || new Date().toISOString(),
      updatedAt: Number(e.updatedAt) || Date.now()
    };
  }

  function isPlainObject(value) {
    return !!value && typeof value === 'object' && !Array.isArray(value);
  }

  function rebuildChecksFromEvents(events) {
    const out = {};
    (Array.isArray(events) ? events : []).forEach(e => {
      if (!e || typeof e !== 'object') return;
      const d = String(e.d || '');
      const id = String(e.id || '');
      const delta = Number(e.delta);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !id || !isFinite(delta) || !delta) return;
      if (!out[d]) out[d] = {};
      const next = (Number(out[d][id]) || 0) + Math.round(delta);
      if (next > 0) out[d][id] = next;
      else delete out[d][id];
      if (!Object.keys(out[d]).length) delete out[d];
    });
    return out;
  }

  function normalizeChecks(raw, events) {
    // 旧数据里 checks 可能是 []。数组上的日期属性不会被 JSON.stringify 序列化，
    // 必须转成普通对象；events 还在时按事件尝试还原打卡次数。
    if (!isPlainObject(raw)) return rebuildChecksFromEvents(events);
    const out = {};
    Object.keys(raw).forEach(d => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      const day = raw[d];
      if (!isPlainObject(day)) return;
      const clean = {};
      Object.keys(day).forEach(id => {
        const n = Number(day[id]);
        if (isFinite(n) && n > 0) clean[id] = Math.round(n);
      });
      if (Object.keys(clean).length) out[d] = clean;
    });
    return out;
  }

  function normalizeMoods(raw) {
    if (!isPlainObject(raw)) return {};
    const out = {};
    Object.keys(raw).forEach(d => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && MOOD_MAP[raw[d]]) out[d] = raw[d];
    });
    return out;
  }

  function ensureStateMaps() {
    if (!state || typeof state !== 'object') return;
    state.checks = normalizeChecks(state.checks, state.events);
    state.moods = normalizeMoods(state.moods);
    state.notes = isPlainObject(state.notes) ? state.notes : {};
    state.doses = isPlainObject(state.doses) ? state.doses : {};
  }

  /* 喝水改毫升制：旧数据（8 杯）一次性升级到 9 杯 / 250 ml / 共 2300 ml。
     只在没有 perMl 时执行，幂等；checks 里存的仍是「次数」，历史记录无需迁移。 */
  function migrateWater(data) {
    (data.habits || []).forEach(h => {
      if (!h || h.id !== 'h_water') return;
      if (Number(h.perMl) > 0) return;
      h.perMl = 250;
      h.goalMl = 2300;
      h.target = 9;
      h.unit = '杯';
      h.note = '每天 9 杯 · 共 2300 ml';
    });
  }

  function normalizeState(data) {
    if (!data || typeof data !== 'object' || !Array.isArray(data.habits) || !Array.isArray(data.tasks)) return null;
    data.habits = data.habits.filter(h => h && typeof h === 'object');
    data.habits.forEach(h => {
      h.archivedAt = h.archivedAt ? String(h.archivedAt) : (h.archived === true ? new Date().toISOString() : '');
    });
    data.tasks = data.tasks.filter(t => t && typeof t === 'object');
    data.tasks.forEach(t => {
      t.repeat = ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none';
      t.repeatTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.repeatTime || '')) ? t.repeatTime : '20:00';
      const due = t.due && /^\d{4}-\d{2}-\d{2}$/.test(String(t.due)) ? parseD(t.due) : null;
      const wd = Number(t.repeatWeekday);
      const rd = Number(t.repeatDay);
      t.repeatWeekday = (wd >= 0 && wd <= 6) ? Math.round(wd) : (due ? due.getDay() : 0);
      t.repeatDay = (rd >= 1 && rd <= 31) ? Math.round(rd) : (due ? due.getDate() : 1);
      t.repeatNextId = String(t.repeatNextId || '');
      t.repeatFrom = String(t.repeatFrom || '');
      t.archivedAt = t.archivedAt ? String(t.archivedAt) : '';
    });
    if (Array.isArray(data.meds)) data.meds = data.meds.filter(m => m && typeof m === 'object');
    data.weights = Array.isArray(data.weights) ? data.weights.map(normalizeWeightRecord).filter(Boolean) : [];
    data.essays = Array.isArray(data.essays) ? data.essays.map(normalizeEssayRecord).filter(Boolean) : [];
    data.bodyProfile = normalizeBodyProfile(data.bodyProfile);
    if ((!data.bodyProfile.age || !data.bodyProfile.height) && data.weights.length) {
      const latestWeight = data.weights.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
      if (latestWeight && latestWeight.age && latestWeight.height) {
        data.bodyProfile = normalizeBodyProfile({ age: latestWeight.age, height: latestWeight.height });
      }
    }
    data.checks = normalizeChecks(data.checks, data.events);
    data.notes = isPlainObject(data.notes) ? data.notes : {};
    data.moods = normalizeMoods(data.moods);
    data.events = Array.isArray(data.events) ? data.events : [];
    data.doses = isPlainObject(data.doses) ? data.doses : {};
    migrateColors(data);
    migratePinned(data);
    migrateWater(data);
    migrateMeds(data);
    migrateQuitHabit(data);
    ensureBreathingHabit(data);
    return Object.assign(seedState(), data);
  }

  function loadLegacyState() {
    try {

      if (!raw) return null;

  let state = seedState();

  /* ============================================================
     云同步状态（PHP + MySQL，可选）
     ============================================================ */
  let cloud = (function () {
    const base = {
      available: location.protocol !== 'file:',
      user: null,
      email: '',
      csrf: '',
      rev: 0,
      updatedAt: 0,
      pending: false,
      linked: false,
      syncing: false,
      pushing: false,
      pulling: false,
      pushAgain: false,
      conflict: null,

      timer: null,
      dirtySeq: 0,

    try {

  function cloudDataKey() {

  function persistCloudMeta() {
    try {
      localStorage.setItem(CLOUD_KEY, JSON.stringify({

  function resetLocalForAccount() {
    state = seedState();
    clearLegacyState();
    cloud.rev = 0;

  function save() {

  function cloudOnLocalChange() {
    if (!cloud.user) return;
    const key = cloudDataKey();
    if (key === cloud.lastData) return;
    cloud.lastData = key;

    cloud.dirtySeq++;
    persistCloudMeta();
    if (cloud.conflict) {

  async function cloudApi(action, body, query) {
    const hasBody = body !== undefined && body !== null;
    const headers = { Accept: 'application/json' };
    if (hasBody) {
      headers['Content-Type'] = 'application/json';
      if (cloud.csrf) headers['X-CSRF-Token'] = cloud.csrf;
    }
    let url = 'api.php?action=' + encodeURIComponent(action);
    if (query && typeof query === 'object') {
      Object.keys(query).forEach(k => {
        if (query[k] !== undefined && query[k] !== null && query[k] !== '') {
          url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(String(query[k]));
        }
      });
    }
    let res;
    try {
      res = await fetch(url, {
        method: hasBody ? 'POST' : 'GET',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: headers,
        body: hasBody ? JSON.stringify(body) : undefined
      });
    } catch (e) {
      const err = new Error('网络连接失败');
      err.status = 0;
      throw err;
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok || !data || data.ok === false) {
      const err = new Error((data && data.error) || ('请求失败（HTTP ' + res.status + '）'));
      err.status = res.status;
      err.data = data || {};
      throw err;
    }
    return data;
  }

  async function cloudFetchMe() {
    const me = await cloudApi('me');
    cloud.csrf = typeof me.csrf === 'string' ? me.csrf : '';
    cloud.registrationOpen = !!me.registration_open;
    if (me.site_name) cloud.siteName = String(me.site_name);
    if (me.user && me.user.email) {
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(me.user.id)) {
        resetLocalForAccount();
        cloud.migrateLegacy = false;
      } else {
        cloud.migrateLegacy = true;
      }
      cloud.owner = String(me.user.id);
      cloud.user = me.user;
      cloud.email = me.user.email;
      cloud.linked = true;
    } else {
      cloud.user = null;
    }
    persistCloudMeta();
    return me;
  }

  let syncFadeTimer = null;
  let syncDismissed = false;

  function updateSyncIndicator() {
    const el = document.getElementById('sync-indicator');
    const rail = document.getElementById('rail-sync');
    if (!cloud.user) {
      if (el) {
        el.hidden = true;
        el.className = 'sync-indicator';
        el.textContent = '';
        el.dataset.cls = '';
      }
      if (rail) rail.hidden = true;
      return;
    }
    let cls = 'saved';
    let text = '已保存';
    if (cloud.error) {
      cls = 'error';
      text = '保存失败 · 点此重试';
    } else if (cloud.syncing || cloud.pushing || cloud.pulling) {
      cls = 'saving';
      text = '保存中…';
    } else if (cloud.pending) {
      cls = 'pending';
      text = '待保存';
    } else if (cloud.updatedAt) {
      const t = new Date(cloud.updatedAt);
      text = '已保存 ' + t.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
    } else {
      cls = 'pending';
      text = '尚未同步';
    }
    if (cls !== 'saved') syncDismissed = false;

    if (el) {
      el.hidden = false;
      const keepFaded = el.classList.contains('is-faded') && el.dataset.cls === cls;
      el.innerHTML = '<i></i><span>' + esc(text) + '</span>';
      el.className = 'sync-indicator ' + cls + (keepFaded ? ' is-faded' : '');
      el.title = cls === 'error' ? '点击重试保存' : '点击立即保存';
      if (el.dataset.cls !== cls) {
        el.dataset.cls = cls;
        clearTimeout(syncFadeTimer);
        if (cls === 'saved') {
          syncFadeTimer = setTimeout(() => {
            const cur = document.getElementById('sync-indicator');
            if (cur && cur.dataset.cls === 'saved') cur.classList.add('is-faded');
          }, 2200);
        }
      }
    }
    if (rail) {
      rail.hidden = (cls === 'saved' && syncDismissed);
      rail.className = 'rail-sync ' + cls;
      rail.innerHTML = '<i></i><span>' + esc(text) + '</span>' +
        '<button class="rail-sync-x" data-act="sync-dismiss" aria-label="隐藏同步状态" title="隐藏">×</button>';
    }

  function cloudRefreshUI() {
    updateSyncIndicator();
    if (view !== 'settings') return;
    const panel = document.getElementById('cloud-panel');
    if (!panel) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = cloudPanelHtml();
    const next = wrap.firstElementChild;
    if (next) panel.replaceWith(next);
  }

  function cloudApplyRemote(data, rev, updatedAt, silent) {
    const repairNeeded = !!data && (!isPlainObject(data.checks) || !isPlainObject(data.moods) || !isPlainObject(data.doses) || !isPlainObject(data.notes));
    const next = normalizeState(data);
    if (!next) {
      cloud.error = '云端数据格式不正确';
      cloudRefreshUI();
      return false;
    }
    state = next;
    state.view = view;
    cloud.lastData = cloudDataKey();
    cloud.rev = Number(rev) || 0;
    cloud.updatedAt = Number(updatedAt) || 0;
    cloud.pending = false;
    cloud.conflict = null;
    cloud.error = '';
    cloud.linked = true;
    cloud.ready = true;
    persistCloudMeta();
    render();
    if (!silent) toast('已从云端加载');
    if (repairNeeded) {
      cloud.pending = true;
      updateSyncIndicator();
      setTimeout(() => { if (cloud.ready && cloud.user) cloudPush(false); }, 80);
    }
    return true;
  }

  async function cloudSyncFromServer(opts) {
    if (!cloud.available || !cloud.user || cloud.pulling) return;
    const manual = !!(opts && opts.manual);
    cloud.pulling = true;
    cloud.ready = false;
    cloud.lastPull = Date.now();
    try {
      const res = await cloudApi('load');
      const remote = res.data;
      const remoteRev = Number(res.rev) || 0;
      const remoteAt = Number(res.updated_at) || 0;
      cloud.updatedAt = remoteAt;

      if (remote) {
        if (!cloudApplyRemote(remote, remoteRev, remoteAt, !manual)) {
          cloud.ready = false;
          mode = 'landing';
          render();
          return;
        }
        clearLegacyState();
        return;
      }

      cloud.rev = 0;
      let legacy = null;
      if (cloud.migrateLegacy) legacy = loadLegacyState();
      if (legacy) {
        state = legacy;
        state.view = view;
        cloud.lastData = cloudDataKey();
        cloud.pending = true;
        const ok = await cloudPush(true, true);
        if (ok) {
          clearLegacyState();
          toast('旧本地数据已迁移到云端');
        } else {
          cloud.error = '旧本地数据还没上传成功，请检查网络后重新登录重试。';
          cloud.ready = false;
          mode = 'landing';
          render();
        }
        return;
      }

      state = normalizeState(state) || seedState();
      state.view = view;
      cloud.lastData = cloudDataKey();
      cloud.pending = true;
      const ok = await cloudPush(true, manual);
      if (!ok) {
        cloud.ready = false;
        mode = 'landing';
        render();
        return;
      }
      clearLegacyState();
    } catch (e) {
      cloud.ready = false;
      handleCloudError(e, manual);
      mode = 'landing';
      render();
    } finally {
      cloud.pulling = false;
      cloudRefreshUI();
    }
  }

  async function cloudPush(force, manual) {
    if (!cloud.user) return false;
    ensureStateMaps();
    if (cloud.pushing) {
      cloud.pushAgain = true;
      return false;
    }
    cloud.pushing = true;
    cloud.syncing = true;
    const seq = cloud.dirtySeq;
    const sentKey = cloudDataKey();
    cloudRefreshUI();
    try {
      const action = force ? 'force' : 'save';
      const body = force ? { data: state } : { base_rev: cloud.rev, data: state };
      const res = await cloudApi(action, body);
      cloud.rev = Number(res.rev) || (cloud.rev + 1);
      cloud.updatedAt = Number(res.updated_at) || Date.now();
      cloud.error = '';
      cloud.conflict = null;
      cloud.lastData = sentKey;
      cloud.ready = true;
      if (cloud.dirtySeq === seq) cloud.pending = false;
      persistCloudMeta();
      if (manual) toast('已保存到云端');
      return true;
    } catch (e) {
      // 乐观锁冲突：云端已有更新，自动合并后重存一次
      if (!force && e && e.status === 409 && e.data && e.data.remote && e.data.remote.data) {
        const remote = e.data.remote;
        const merged = normalizeState(mergeStates(remote.data, state));
        if (merged) {
          state = merged;
          state.view = view;
          cloud.rev = Number(remote.rev) || cloud.rev;
          cloud.lastData = cloudDataKey();
          try {
            const res2 = await cloudApi('save', { base_rev: cloud.rev, data: state });
            cloud.rev = Number(res2.rev) || (cloud.rev + 1);
            cloud.updatedAt = Number(res2.updated_at) || Date.now();
            cloud.error = '';
            cloud.conflict = null;
            cloud.lastData = cloudDataKey();
            cloud.ready = true;
            if (cloud.dirtySeq === seq) cloud.pending = false;
            persistCloudMeta();
            cloudRefreshUI();
            render();
            if (manual) toast('已合并云端更新并保存');
            return true;
          } catch (e2) {
            handleCloudError(e2, manual);
            return false;
          }
        }
      }
      handleCloudError(e, manual);
      return false;
    } finally {
      cloud.pushing = false;
      cloud.syncing = false;
      cloudRefreshUI();
      if (cloud.pushAgain) {
        cloud.pushAgain = false;
        setTimeout(() => { if (cloud.pending) cloudPush(false); }, 300);
      } else if (cloud.pending && cloud.dirtySeq !== seq) {
        setTimeout(() => { if (cloud.pending) cloudPush(false); }, 300);
      }
    }
  }

  function mergeStates(remote, local) {
    if (!remote || typeof remote !== 'object') return local;
    if (!local || typeof local !== 'object') return remote;
    const out = Object.assign({}, remote);

    // 数组类：按 id 并集合并（本地新增补入，云端为主；软删除字段取非空优先）
    ['habits', 'tasks', 'meds', 'weights', 'essays'].forEach(function (key) {
      const r = Array.isArray(remote[key]) ? remote[key] : [];
      const l = Array.isArray(local[key]) ? local[key] : [];
      const map = {};
      r.forEach(function (item) { if (item && item.id) map[item.id] = item; });
      l.forEach(function (item) {
        if (!item || !item.id) return;
        if (!map[item.id]) {
          map[item.id] = item;
        } else {
          const cur = map[item.id];
          if (!cur.archivedAt && item.archivedAt) cur.archivedAt = item.archivedAt;
        }
      });
      out[key] = Object.keys(map).map(function (k) { return map[k]; });
    });

    // 打卡/用药计数：按日期合并，同 habit 取较大值（只增不减）
    ['checks', 'doses'].forEach(function (key) {
      const r = isPlainObject(remote[key]) ? remote[key] : {};
      const l = isPlainObject(local[key]) ? local[key] : {};
      const merged = Object.assign({}, r);
      Object.keys(l).forEach(function (day) {
        if (!merged[day]) { merged[day] = l[day]; return; }
        if (isPlainObject(l[day]) && isPlainObject(merged[day])) {
          const m = Object.assign({}, merged[day]);
          Object.keys(l[day]).forEach(function (hid) {
            m[hid] = Math.max(Number(m[hid]) || 0, Number(l[day][hid]) || 0);
          });
          merged[day] = m;
        } else {
          merged[day] = l[day];
        }
      });
      out[key] = merged;
    });

    // 心情：按日期合并，本地优先（最后心情）
    out.moods = Object.assign({}, isPlainObject(remote.moods) ? remote.moods : {}, isPlainObject(local.moods) ? local.moods : {});

    // 随记
    out.notes = Object.assign({}, isPlainObject(remote.notes) ? remote.notes : {}, isPlainObject(local.notes) ? local.notes : {});

    // 打卡日志：去重并集
    const rEv = Array.isArray(remote.events) ? remote.events : [];
    const lEv = Array.isArray(local.events) ? local.events : [];
    const seen = {};
    rEv.forEach(function (ev) { seen[String(ev.at) + '|' + String(ev.id) + '|' + String(ev.delta)] = true; });
    const extra = lEv.filter(function (ev) { return !seen[String(ev.at) + '|' + String(ev.id) + '|' + String(ev.delta)]; });
    out.events = rEv.concat(extra);

    // 身体档案
    out.bodyProfile = Object.assign({}, remote.bodyProfile || {}, local.bodyProfile || {});

    return out;
  }

  function handleCloudError(e, manual) {
    if (e && e.status === 401) {
      cloud.user = null;
      cloud.csrf = '';
      cloud.error = '登录已过期，请重新登录';
      cloud.ready = false;
      mode = 'landing';
      view = 'today';
      state.view = 'today';
      persistCloudMeta();
      render();
      if (manual) toast('登录已过期，请重新登录');
      return;
    }
    if (e && e.status === 403) {
      cloud.error = '会话校验失败，请刷新页面后重试';
    } else {
      cloud.error = (e && e.message) ? e.message : '同步失败，请稍后重试';
    }
    cloud.pending = true;
    persistCloudMeta();
    cloudRefreshUI();
    if (manual) toast(cloud.error);
  }

  async function cloudInit(force) {
    if (!cloud.available) {
      mode = 'app';
      return;
    }
    if (cloud.inited && !force) return;
    cloud.inited = true;
    cloud.error = '';
    cloudRefreshUI();
    try {
      const me = await cloudFetchMe();
      if (me.user) {
        mode = 'app';
        await cloudSyncFromServer();
        render();
      } else {
        cloud.user = null;
        mode = 'landing';
        render();

  async function cloudDoLogin(form) {
    const email = (form.querySelector('[name="email"]').value || '').trim();
    const password = form.querySelector('[name="password"]').value || '';
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (!email || !password) {
      if (errEl) errEl.textContent = '请填写邮箱和密码';
      return;
    }
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    try {
      await cloudFetchMe();
      const res = await cloudApi('login', { email: email, password: password });
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(res.user.id)) {
        resetLocalForAccount();
        cloud.migrateLegacy = false;
      } else {
        cloud.migrateLegacy = true;
      }
      cloud.owner = String(res.user.id);
      cloud.user = res.user;
      cloud.email = res.user.email;
      cloud.csrf = res.csrf || '';
      cloud.registrationOpen = !!res.registration_open;
      if (res.site_name) cloud.siteName = String(res.site_name);
      cloud.linked = true;
      cloud.ready = false;
      cloud.error = '';
      persistCloudMeta();
      mode = 'app';
      view = 'today';
      state.view = 'today';
      closeModal();
      toast('已登录，正在同步…');
      render();
      await cloudSyncFromServer({ manual: true });
      if (view === 'settings') render();
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '登录失败';
      else toast(e.message || '登录失败');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function cloudDoRegister(form) {
    const display = (form.querySelector('[name="display_name"]').value || '').trim();
    const email = (form.querySelector('[name="email"]').value || '').trim();
    const password = form.querySelector('[name="password"]').value || '';
    const confirm = form.querySelector('[name="password_confirm"]').value || '';
    const invite = (form.querySelector('[name="invite"]').value || '').trim().toUpperCase();
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (!email || !password || !invite) {
      if (errEl) errEl.textContent = '请填写邮箱、密码和邀请码';
      return;
    }
    if (password.length < 8) {
      if (errEl) errEl.textContent = '密码至少 8 位';
      return;
    }
    if (password !== confirm) {
      if (errEl) errEl.textContent = '两次输入的密码不一致';
      return;
    }
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    try {
      await cloudFetchMe();
      const res = await cloudApi('register', {
        display_name: display,
        email: email,
        password: password,
        invite: invite
      });
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(res.user.id)) {
        resetLocalForAccount();
      }
      state = seedState();
      cloud.migrateLegacy = false;
      cloud.owner = String(res.user.id);
      cloud.user = res.user;
      cloud.email = res.user.email;
      cloud.csrf = res.csrf || '';
      cloud.registrationOpen = true;
      cloud.linked = true;
      cloud.ready = false;
      cloud.error = '';
      persistCloudMeta();
      mode = 'app';
      view = 'today';
      state.view = 'today';
      closeModal();
      toast('注册成功，正在同步…');
      render();
      await cloudSyncFromServer({ manual: true });
      if (view === 'settings') render();
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '注册失败';
      else toast(e.message || '注册失败');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function cloudLogout() {
    if (cloud.pending) await cloudPush(false, true);
    if (cloud.pending && !confirm('还有修改没有保存到云端。退出后这些修改会丢失，继续吗？')) return;
    try {
      if (cloud.user) await cloudApi('logout', {});
    } catch (e) {
      if (e.status !== 401) {
        toast('退出失败：' + e.message);
        return;
      }
    }
    cloud.user = null;
    cloud.csrf = '';
    cloud.rev = 0;
    cloud.updatedAt = 0;
    cloud.pending = false;
    cloud.conflict = null;
    cloud.error = '';
    cloud.migrateLegacy = false;
    cloud.ready = false;
    state = seedState();
    clearLegacyState();
    cloud.lastData = cloudDataKey();
    persistCloudMeta();
    mode = 'landing';
    view = 'today';
    closeModal();
    render();
    toast('已退出登录');
  }

        keepalive: true,
        headers: {

      }).catch(() => {});

  async function cloudManualSync() {

    if (!cloud.user) {

      return;

    if (!cloud.ready) {
      toast('云端数据还没加载完成，请刷新页面重试');
      return;

    if (cloud.syncing || cloud.pulling) {
      toast('正在保存，请稍候');
      return;

    await cloudPush(false, true);
  }

  function historyReasonLabel(reason) {
    return { save: '自动保存', reset: '清空数据', restore: '恢复版本', baseline: '初始版本' }[reason] || reason || '保存';

  function historyDate(ms) {
    const d = new Date(Number(ms) || 0);
    if (!isFinite(d.getTime()) || !Number(ms)) return '—';
    return d.toLocaleString('zh-CN', { hour12: false });
  }

  async function loadHistoryList() {
    const box = $('#history-list');
    if (!box) return;
    box.innerHTML = '<div class="empty-box">加载中…</div>';
    try {
      const res = await cloudApi('history');
      const items = Array.isArray(res.items) ? res.items : [];
      if (!items.length) {
        box.innerHTML = '<div class="empty-box">还没有历史版本。下一次保存后会出现。</div>';
        return;
      }
      box.innerHTML = '<div class="history-list">' + items.map(item =>
        '<div class="history-row">' +
          '<div class="history-meta"><b>rev ' + esc(item.rev) + ' · ' + esc(historyReasonLabel(item.reason)) + '</b>' +
            '<small>' + esc(historyDate(item.created_at)) + ' · ' + Math.max(1, Math.round((Number(item.bytes) || 0) / 1024)) + ' KB</small></div>' +

        '<button data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>−</button>' +
        '<div class="habit-count">' + c + '<span> / ' + target + ' ' + esc(h.unit || '次') + '</span></div>' +
        '<button data-act="habit-inc" data-id="' + h.id + '">＋</button>' +
        '</div>';
    }

    const sub = h.type === 'quit'
      ? (c === 0 ? '已保持 ' + streak + ' 天' : '今天已记录，明天重新开始')
      : (h.target > 0 ? '目标 ' + target + ' ' + esc(h.unit || '次') + (streak ? ' · 连续 ' + streak + ' 天' : '') : '');

    return '<article class="habit-card ' + (done ? 'is-done' : '') + '" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
      '<div class="habit-head">' +
        '<span class="habit-icon">' + esc(h.icon || '✅') + '</span>' +
        '<div class="habit-title"><b>' + esc(h.name) + '</b><small>' + esc(sub) + '</small></div>' +
        '<span class="habit-check">✓</span>' +
      '</div>' +
      control +
      (h.note ? '<div class="habit-note">' + esc(h.note) + '</div>' : '') +
      '<div class="habit-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '</article>';
  }

  function isPinned(h) {
    return !!(h && PINNED_IDS.indexOf(h.id) >= 0);
  }

  function isArchived(h) {
    return !!(h && h.archivedAt);
  }

  function doseTimes(n) {
    const count = Math.max(1, Math.min(12, Number(n) || 1));
    if (count === 1) return ['08:00'];
    const start = 8 * 60, end = 20 * 60;
    const out = [];
    for (let i = 0; i < count; i++) {
      const m = Math.round(start + (end - start) * (i / (count - 1)));
      out.push(pad2(Math.floor(m / 60)) + ':' + pad2(m % 60));
    }
    return out;
  }

  function humanDuration(mins) {
    const m = Math.max(0, Math.round(mins));
    if (m < 60) return m + ' 分钟';
    const h = Math.floor(m / 60), r = m % 60;
    return h + ' 小时' + (r ? ' ' + r + ' 分' : '');
  }

  /* 喝水：毫升换算 / 上次时刻 / 今日时间线
     规则：前 (n-1) 杯按 perMl，最后一杯补齐到目标总量（2300 - 8×250 = 300 ml）。
     checks 里仍存「次数」，所以历史数据不用迁移。 */
  function waterTimesN(h) { return Math.max(1, Math.min(24, Math.round(Number(h.target) || 9))); }
  function waterPerMl(h) { return Math.max(50, Math.round(Number(h.perMl) || 250)); }
  function waterGoalMl(h) {
    const n = waterTimesN(h), per = waterPerMl(h);
    return Math.max(Number(h.goalMl) || n * per, n * per);
  }
  function waterMlOf(h, count) {
    const n = waterTimesN(h), per = waterPerMl(h);
    const lastMl = waterGoalMl(h) - (n - 1) * per;
    const c = Math.max(0, Math.round(count));
    if (c <= 0) return 0;
    if (c < n) return c * per;
    return (n - 1) * per + lastMl + (c - n) * per;
  }
  function waterLastAt(h, d) {
    if (d !== todayStr() || !Array.isArray(state.events)) return null;
    for (let i = state.events.length - 1; i >= 0; i--) {
      const e = state.events[i];
      if (e && e.id === h.id && e.d === d && Number(e.delta) > 0) {
        const at = new Date(e.at);
        if (!isNaN(at.getTime())) return at;
      }
    }
    return null;
  }
  /* 今日每次喝水的时刻；5 分钟内的连点合并成一条（14:45 ×3） */
  function waterDayTimes(h, d) {
    if (!Array.isArray(state.events)) return [];
    const raw = [];
    state.events.forEach(e => {
      if (!e || e.id !== h.id || e.d !== d || Number(e.delta) <= 0) return;
      const at = new Date(e.at);
      if (!isNaN(at.getTime())) raw.push(at);
    });
    raw.sort((a, b) => a - b);
    const merged = [];
    raw.forEach(at => {
      const last = merged[merged.length - 1];
      if (last && at.getTime() - last.at.getTime() < 5 * 60000) { last.n++; return; }
      merged.push({ at, n: 1 });
    });
    return merged.map(x => ({
      at: x.at,
      n: x.n,
      label: pad2(x.at.getHours()) + ':' + pad2(x.at.getMinutes()) + (x.n > 1 ? ' ×' + x.n : '')
    }));
  }

  /* 右上：近 7 天迷你柱（均量只算前 6 天，今天还没过完） */
  function waterWeekHtml(h) {
    const today = todayStr();
    const goal = waterGoalMl(h) || 1;
    const days = [];
    let sum = 0, cnt = 0;
    for (let i = 6; i >= 0; i--) {
      const ds = fmt(addDays(new Date(), -i));
      const ml = waterMlOf(h, countOf(ds, h.id));
      days.push({ ds, ml, today: ds === today });
      if (i >= 1) { sum += ml; cnt++; }
    }
    const avg = cnt ? Math.round(sum / cnt) : 0;
    const bars = days.map(d => {
      const cls = 'height:' + Math.min(100, Math.max(0, d.ml / goal * 100)).toFixed(1) + '%';
      return '<i class="' + (d.ml > 0 ? 'has' : '') + (d.today ? ' is-today' : '') + '"' +
        ' style="' + cls + '" title="' + d.ds.slice(5) + ' · ' + d.ml + ' ml"></i>';
    }).join('');
    return '<div class="water-week">' +
      '<div class="ww-bars">' + bars + '</div>' +
      '<span class="ww-avg">近 7 天均<b>' + avg + '</b>ml</span>' +
    '</div>';
  }

  /* 底部：06:00–23:00 分布条 */
  function waterDistHtml(h, d) {
    const list = waterDayTimes(h, d);
    if (!list.length) return '';
    const S = 6 * 60, E = 23 * 60;
    const pct = t => {
      const m = t.getHours() * 60 + t.getMinutes();
      return Math.max(0, Math.min(100, (m - S) / (E - S) * 100));
    };
    const dots = list.map(x =>
      '<i style="left:' + pct(x.at).toFixed(2) + '%" title="' + x.label + '"></i>').join('');
    const ticks = [6, 9, 12, 15, 18, 21].map(t =>
      '<span style="left:' + pct(new Date(2000, 0, 1, t, 0)).toFixed(2) + '%">' + pad2(t) + '</span>').join('');
    return '<div class="water-dist">' +
      '<div class="wd-track">' + dots + '</div>' +
      '<div class="wd-axis">' + ticks + '</div>' +
    '</div>';
  }

  /* 节奏建议：还剩几杯、离 22:00 还有多久、建议多久一杯 */
  function waterPaceText(h, count) {
    const n = waterTimesN(h);
    const left = n - Math.max(0, Math.round(count));
    if (left <= 0) return '';
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const remain = 22 * 60 - nowMin;
    if (remain <= 0) return '已经过了 22:00，还差 ' + left + ' 杯；睡前别一次灌太多';
    if (remain < 20) return '离 22:00 只剩 ' + remain + ' 分钟，还差 ' + left + ' 杯，有点赶';
    const gap = Math.round(remain / left);
    if (gap < 15) return '离 22:00 还有 ' + humanDuration(remain) + '，还差 ' + left + ' 杯，得赶一赶';
    return '离 22:00 还有 ' + humanDuration(remain) + ' · 还差 ' + left + ' 杯 · 建议每 ' + gap + ' 分钟一杯';
  }

  /* ============================================================
     运动卡：本周七段环 + 连续 / 本月 / 上次 / 习惯时刻
     ============================================================ */
  function weekDaysOf(h) {
    const today = todayStr();
    const now = parseD(today);
    const dow = (now.getDay() + 6) % 7;
    const monday = addDays(now, -dow);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      out.push({ ds, done: countOf(ds, h.id) > 0, today: ds === today, future: ds > today });
    }
    return out;
  }

  function moveMonthCount(h) {
    const ym = todayStr().slice(0, 7);
    let n = 0;
    Object.keys(state.checks || {}).forEach(ds => {
      if (ds.slice(0, 7) === ym && countOf(ds, h.id) > 0) n++;
    });
    return n;
  }

  function moveLastText(h) {
    const today = todayStr();
    const days = Object.keys(state.checks || {})
      .filter(ds => ds <= today && countOf(ds, h.id) > 0).sort();
    if (!days.length) return '';
    const ds = days[days.length - 1];
    if (ds === today) return '今天';
    const diff = Math.round((parseD(today) - parseD(ds)) / 86400000);
    if (diff === 1) return '昨天';
    if (diff === 2) return '前天';
    return Number(ds.slice(5, 7)) + '月' + Number(ds.slice(8, 10)) + '日';
  }

  /* 最近 12 次的平均时刻，样本少于 3 次就不猜 */
  function moveUsualTime(h) {
    const arr = (state.events || [])
      .filter(e => e && e.id === h.id && Number(e.delta) > 0)
      .map(e => new Date(e.at))
      .filter(t => !isNaN(t.getTime()))
      .slice(-12);
    if (arr.length < 3) return '';
    let sum = 0;
    arr.forEach(t => { sum += t.getHours() * 60 + t.getMinutes(); });
    const avg = Math.round(sum / arr.length);
    return pad2(Math.floor(avg / 60) % 24) + ':' + pad2(avg % 60);
  }

  function moveLastWeekCount(h) {
    const now = parseD(todayStr());
    const dow = (now.getDay() + 6) % 7;
    const monday = addDays(now, -dow);
    let n = 0;
    for (let i = 1; i <= 7; i++) {
      if (countOf(fmt(addDays(monday, -i)), h.id) > 0) n++;
    }
    return n;
  }

  function moveRingHtml(h) {
    const week = weekDaysOf(h);
    const doneN = week.filter(w => w.done).length;
    const R = 52;
    const C = 2 * Math.PI * R;
    const seg = C / 7;
    const dash = seg - 12.7;
    const circles = week.map((w, i) => {
      const cls = w.future ? 'future' : (w.done ? 'done' : '');
      return '<circle class="' + cls + '" cx="66" cy="66" r="' + R + '"' +
        ' stroke-dasharray="' + dash.toFixed(2) + ' ' + (C - dash).toFixed(2) + '"' +
        ' stroke-dashoffset="' + (-i * seg).toFixed(2) + '"/>';
    }).join('');
    return '<div class="move-ring">' +
      '<svg viewBox="0 0 132 132" aria-hidden="true">' +
        '<g transform="rotate(-90 66 66)" fill="none" stroke-width="9" stroke-linecap="round">' + circles + '</g>' +
      '</svg>' +
      '<div class="move-ring-txt"><b>' + doneN + '/7</b><small>本 周</small></div>' +
    '</div>';
  }

  function moveCardHtml(h, d) {
    const c = countOf(d, h.id);
    const target = Math.max(1, Number(h.target) || 1);
    const done = c >= target;
    const today = d === todayStr();
    const color = esc(h.color || '#b5733f');
    const week = weekDaysOf(h);
    const doneN = week.filter(w => w.done).length;
    const streak = habitStreak(h);
    const usual = moveUsualTime(h);
    const last = moveLastText(h);
    const monthN = moveMonthCount(h);
    const remainDays = week.filter(w => w.future).length;
    const gapWeek = moveLastWeekCount(h) - doneN;

    let status, sub, foot;
    if (done) {
      status = '<span class="mv-status ok">' + (today ? '今天已完成' : '这一天完成了') + '</span>';
      sub = '这 10,000 步已经记上了' + (streak ? ' · 连续 ' + streak + ' 天' : '');
      foot = '本周已达 ' + doneN + ' / 7 天' + (remainDays ? ' · 还有 ' + remainDays + ' 天' : '');
    } else {
      status = '<span class="mv-status">还没开始</span>';
      sub = (today ? '今天还没动' : '这一天没有记录') +
        (today && usual ? '，你通常在 ' + usual + ' 左右动起来' : '');
      if (remainDays) {
        foot = '距本周结束还有 ' + remainDays + ' 天' + (gapWeek > 0 ? ' · 再动 ' + gapWeek + ' 次就追平上周' : '');
      } else {
        foot = '本周还剩今天' + (gapWeek > 0 ? ' · 比上周少 ' + gapWeek + ' 天' : '');
      }
    }

    const lines = [];
    lines.push('<span><i' + (streak ? '' : ' class="dim"') + '></i>连续 ' + streak + ' 天 · 本月 ' + monthN + ' 天</span>');
    if (last) lines.push('<span><i class="dim"></i>上次 ' + last + '</span>');

    return '<article class="vital-card move-card' + (done ? ' is-done' : '') + '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '🏃') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>每天 ' + target + ' 次 · 目标 10,000 步</small></div>' +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="move-body">' +
        '<div class="move-left">' +
          status +
          '<div class="vital-sub">' + sub + '</div>' +
          '<div class="move-lines">' + lines.join('') + '</div>' +
        '</div>' +
        moveRingHtml(h) +
      '</div>' +
      '<div class="move-foot">' + foot + '</div>' +
      '<div class="vital-actions">' +
        (done
          ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
          : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">完成运动</button>' +
            '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>') +
      '</div>' +
    '</article>';
  }

  function fmtDur(sec) {
    const s = Math.max(0, Math.round(sec));
    const m = Math.floor(s / 60), r = s % 60;
    if (!m) return r + ' 秒';
    return m + ' 分' + (r ? ' ' + r + ' 秒' : '');
  }

  function habitTotalCount(h) {
    let n = 0;
    Object.keys(state.checks || {}).forEach(ds => { n += countOf(ds, h.id); });
    return n;
  }

  /* 4-7-8 波形：一个周期里吸 / 屏 / 呼 的宽度比 = 4 : 7 : 8 */
  function breathWavePath(cycles) {
    const U = 100, TOP = 6, BOT = 42, T = 19;
    let d = 'M0,' + BOT;
    for (let i = 0; i < cycles; i++) {
      const x = i * U;
      const xa = x + U * 4 / T;
      const xb = x + U * 11 / T;
      const xe = x + U;
      d += ' C' + (x + U * 0.10).toFixed(1) + ',' + BOT + ' ' + (x + U * 0.11).toFixed(1) + ',' + TOP + ' ' + xa.toFixed(1) + ',' + TOP;
      d += ' L' + xb.toFixed(1) + ',' + TOP;
      d += ' C' + (x + U * 0.75).toFixed(1) + ',' + TOP + ' ' + (x + U * 0.80).toFixed(1) + ',' + BOT + ' ' + xe.toFixed(1) + ',' + BOT;
    }
    return d;
  }

  function breathHHMM(min) {
    return pad2(Math.floor(min / 60) % 24) + ':' + pad2(min % 60);
  }

  function breathingCard(h, d) {
    const c = countOf(d, h.id);
    const target = Math.max(1, Number(h.target) || 1);
    const done = c >= target;
    const today = d === todayStr();
    const color = esc(h.color || '#5b8f8a');
    const cycles = Math.max(1, Math.min(8, Number(h.breatheCycles) || 4));
    const totalSec = cycles * 19;
    const suggest = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(h.suggestTime || '')) ? String(h.suggestTime) : '15:00';
    const streak = habitStreak(h);
    const week = weekDaysOf(h);
    const weekDone = week.filter(w => w.done).length;
    const totalN = habitTotalCount(h);

    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const sugMin = Number(suggest.slice(0, 2)) * 60 + Number(suggest.slice(3, 5));
    const diff = sugMin - nowMin;
    const warm = !done && today && diff <= 0 && diff > -60;

    let status, sub;
    if (done) {
      status = today ? '今天已完成' : '这一天完成了';
      sub = cycles + ' 次循环跑完了' + (streak ? ' · 连续 ' + streak + ' 天' : '');
    } else if (!today) {
      status = '这一天没有记录';
      sub = '补记这一天 · 建议时间 ' + suggest;
    } else if (diff > 0) {
      status = '还没开始';
      sub = '现在 ' + breathHHMM(nowMin) + ' · 建议 ' + suggest + ' 做一组，' +
        (diff >= 60 ? '还有 ' + humanDuration(diff) : '还有 ' + diff + ' 分钟');
    } else if (warm) {
      status = '现在正好';
      sub = '现在正是建议的 ' + suggest + ' 时段，做完这一组就踏实了';
    } else {
      status = '还没开始';
      sub = '现在 ' + breathHHMM(nowMin) + ' · 建议的 ' + suggest + ' 那组还没做，睡前补上也有用';
    }

    const mins = Math.round(totalN * totalSec / 60);
    return '<article class="vital-card breathing-card' + (done ? ' is-done' : '') + (warm ? ' is-warm' : '') +
        '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '🌬️') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>每天一组 · ' + cycles +
          ' 次循环 · 约 ' + fmtDur(totalSec) + '</small></div>' +
        (streak ? '<span class="breath-streak">🔥 连续 ' + streak + ' 天</span>' : '') +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="breath-status' + (done ? ' ok' : '') + '">' + status + '</div>' +
      '<div class="vital-sub">' + sub + '</div>' +
      '<div class="breath-wave-wrap">' +
        '<svg class="breath-wave" viewBox="0 0 ' + (cycles * 100) + ' 48" preserveAspectRatio="none" aria-hidden="true">' +
          '<path d="' + breathWavePath(cycles) + '" vector-effect="non-scaling-stroke"/>' +
        '</svg>' +
        '<div class="breath-wave-cap"><b>×' + cycles + ' 次循环</b><i></i><em>吸 4 · 屏 7 · 呼 8 · 共 ' +
          fmtDur(totalSec) + '</em></div>' +
      '</div>' +
      '<div class="breath-foot">本周 <b>' + weekDone + ' / 7</b> 天' +
        (totalN ? ' · 累计 ' + totalN + ' 组（约 ' + Math.max(1, mins) + ' 分钟）' : '') + '</div>' +
      '<div class="vital-actions">' +
        (done
          ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
          : '<button class="vital-btn primary" data-act="breathing-start" data-id="' + h.id + '">开始练习</button>' +
            '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>') +
      '</div>' +
    '</article>';
  }

  function vitalCard(h, d) {
    if (h.id === 'h_breathe') return breathingCard(h, d);
    if (h.type === 'quit') return habitCard(h, d);
    const c = countOf(d, h.id);
    const target = Math.max(1, Number(h.target) || 1);
    const done = c >= target;
    const streak = habitStreak(h);
    const color = esc(h.color || '#2f6f5e');
    const unit = esc(h.unit || '次');
    const kind = h.id === 'h_med' ? 'med' : h.id === 'h_water' ? 'water' : h.id === 'h_move' ? 'move' : 'build';
    if (kind === 'move') return moveCardHtml(h, d);
    const times = kind === 'med' ? doseTimes(target) : [];
    const wN = kind === 'water' ? waterTimesN(h) : 0;
    const wPer = kind === 'water' ? waterPerMl(h) : 0;
    const wGoal = kind === 'water' ? waterGoalMl(h) : 0;
    const streakText = streak ? ' · 连续 ' + streak + ' 天' : '';
    const today = d === todayStr();

    let status = '', sub = '', body = '', actions = '';

    if (kind === 'med') {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const next = times[Math.min(c, times.length - 1)];
      const nextMin = Number(next.slice(0, 2)) * 60 + Number(next.slice(3, 5));
      const diff = nextMin - nowMin;
      if (done) {
        status = today ? '今日已完成' : '当日已完成';
        sub = '已记录 ' + target + ' 次' + streakText;
      } else if (!today) {
        status = c + ' / ' + target;
        sub = '补记这一天 · 还差 ' + (target - c) + ' 次' + streakText;
      } else if (diff > 0) {
        status = '下次 ' + next;
        sub = '还有 ' + humanDuration(diff) + streakText;
      } else {
        status = '现在该吃药了';
        sub = next + ' 已过 ' + humanDuration(-diff) + streakText;
      }
      const chips = times.map((t, i) => {
        const tMin = Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
        const cls = i < c ? 'done' : (today && i === c ? 'next' : '');
        const late = today && i === c && !done && nowMin > tMin;
        return '<span class="dose ' + cls + (late ? ' late' : '') + '">' + t + (i < c ? ' ✓' : '') + '</span>';
      }).join('');
      body = '<div class="dose-row">' + chips + '</div>';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">吃了一次</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>';
    } else if (kind === 'water') {
      const ml = waterMlOf(h, c);
      const left = Math.max(0, wGoal - ml);
      const lastAt = waterLastAt(h, d);
      const gapMin = lastAt ? Math.max(0, (Date.now() - lastAt.getTime()) / 60000) : 0;
      const need = today && !done && c > 0 && gapMin >= 90;
      const lastMl = wGoal - (wN - 1) * wPer;
      status = '<span class="vnum">' + ml + '</span><span class="vunit"> / ' + wGoal + ' ml</span>';
      sub = (done
          ? (today ? '今天的 ' + wN + ' ' + unit + '完成了 · 共 ' + ml + ' ml' : '这一天完成了 · ' + ml + ' ml')
          : (left > 0 ? '还差 ' + left + ' ml · ' + Math.max(0, wN - c) + ' ' + unit : '目标已达成')
        ) + streakText;
      const steps = [];
      for (let i = 0; i < wN; i++) {
        const cls = i < c ? 'on' : (i === c && today && !done ? 'cur' : '');
        steps.push('<i' + (cls ? ' class="' + cls + '"' : '') + '></i>');
      }
      const gapTxt = gapMin < 1 ? '刚刚' : humanDuration(gapMin);
      const gapCls = need ? ' need' : '';
      const gapText = lastAt
        ? (need ? '该喝水了 · 已隔 ' + gapTxt
                : '上次 ' + pad2(lastAt.getHours()) + ':' + pad2(lastAt.getMinutes()) + ' · 已隔 ' + gapTxt)
        : (today && !done ? '今天还没喝，先来一杯' : '');
      const pace = (today && !done) ? waterPaceText(h, c) : '';
      body = '<div class="water-steps">' + steps.join('') + '</div>' +
        (gapText ? '<div class="water-gap' + gapCls + '">' + gapText + '</div>' : '') +
        waterDistHtml(h, d) +
        (pace ? '<div class="water-pace">' + pace + '</div>' : '');
      const btnText = c === wN - 1 ? '＋ 最后一杯 ' + lastMl + ' ml' : '＋ 一杯 ' + wPer + ' ml';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">' + btnText + '</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>−</button>';
    } else {
      status = done ? '已完成' : (c > 0 ? c + ' / ' + target : '还没开始');
      sub = done ? (today ? '今天的运动完成了' : '这一天完成了') + streakText : '目标 ' + target + ' ' + unit + streakText;
      body = '<div class="vital-progress"><i style="width:' + Math.min(100, c / target * 100) + '%"></i></div>';
      actions = done
        ? '<button class="vital-btn done" data-act="habit-dec" data-id="' + h.id + '">已完成 · 点击可撤销</button>'
        : '<button class="vital-btn primary" data-act="habit-inc" data-id="' + h.id + '">' + (target > 1 ? '完成一次' : '完成运动') + '</button>' +
          '<button class="vital-btn ghost" data-act="habit-dec" data-id="' + h.id + '"' + (c <= 0 ? ' disabled' : '') + '>撤销</button>';
    }

    return '<article class="vital-card' + (done ? ' is-done' : '') + '" style="--hc:' + color + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">' + esc(h.icon || '✅') + '</span>' +
        '<div class="vital-title"><b>' + esc(h.name) + '</b><small>' +
          (kind === 'med' ? '每天 ' + target + ' 次 · ' + times.join(' / ')
            : kind === 'water' ? '每天 ' + wN + ' ' + unit + ' · 共 ' + wGoal + ' ml'
            : '每天 ' + target + ' ' + unit) +
        '</small></div>' +
        (kind === 'water' ? waterWeekHtml(h) : '') +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="vital-status">' + status + '</div>' +
      '<div class="vital-sub">' + sub + '</div>' +
      body +
      '<div class="vital-actions">' + actions + '</div>' +
    '</article>';
  }

  function medCard(h, d) {
    const sched = medScheduledFor(d);
    const total = sched.length;
    const taken = medTakenCount(d);
    const done = total > 0 && taken >= total;
    const next = medNextDose(d);
    const activeMeds = (state.meds || []).filter(m => !isPrn(m) && medActiveOn(m, d));
    const prnMeds = (state.meds || []).filter(m => m.status === 'active' && isPrn(m));
    const low = (state.meds || [])
      .filter(m => m.status === 'active' && !isPrn(m))
      .map(m => ({ m: m, days: medStockDays(m) }))
      .filter(x => x.days !== null && x.days <= 3)
      .sort((a, b) => a.days - b.days)[0];

    let status, sub, actions;
    if (done) {
      status = d === todayStr() ? '今日已完成' : '当日已完成';
      sub = '全部 ' + total + ' 次已记录';
    } else if (total > 0) {
      status = taken + ' / ' + total + ' 次';
      if (next) {
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        const nextMin = Number(next.slot.slice(0, 2)) * 60 + Number(next.slot.slice(3, 5));
        const late = d === todayStr() && nowMin > nextMin;
        sub = (d === todayStr() ? (late ? '该服 ' + next.slot + ' 的药了' : '下次 ' + next.slot) : '补记 ' + next.slot) + ' · ' + next.med.name;
      } else {
        sub = '还有 ' + (total - taken) + ' 次';
      }
    } else if (prnMeds.length) {
      status = '按需用药';
      sub = '需要时记录，不计入完成率';
    } else {
      status = '暂无用药';
      sub = '还没有正在服用的药';
    }

    /* 规格统一：用药 ≥2 种时主按钮让给「查看全部」，记录仍保留为次按钮（一键记下一顿不丢） */
    const medCount = new Set(sched.map(x => x.med.id)).size;
    if (medCount >= 2) {
      actions = '<button class="vital-btn primary" data-nav="meds">查看详细</button>' +
        (next ? '<button class="vital-btn ghost" data-act="med-next">记录 ' + next.slot + '</button>'
              : '<button class="vital-btn ghost" disabled>已完成</button>');
    } else if (total > 0 && next) {
      actions = '<button class="vital-btn primary" data-act="med-next">记录 ' + next.slot + '</button>' +
        '<button class="vital-btn ghost" data-act="med-open">全部</button>';
    } else if (done) {
      actions = '<button class="vital-btn primary" disabled>已完成</button>' +
        '<button class="vital-btn ghost" data-act="med-open">查看</button>';
    } else if (prnMeds.length) {
      actions = '<button class="vital-btn primary" data-act="med-open">打开用药</button>';
    } else {
      actions = '<button class="vital-btn primary" data-act="med-new">添加用药</button>';
    }

    const progress = total ? Math.min(100, taken / total * 100) : 0;
    const titleSmall = total > 0
      ? (activeMeds.length + prnMeds.length) + ' 种药'
      : (prnMeds.length ? '按需用药' : '暂无用药');

    /* 今日用药清单：每种药 → 剂量 · 饭前/饭后+间隔 · 第几天 · 各时段打卡 */
    const groups = [];
    const gmap = {};
    sched.forEach(x => {
      if (!gmap[x.med.id]) {
        gmap[x.med.id] = { med: x.med, slots: [] };
        groups.push(gmap[x.med.id]);
      }
      gmap[x.med.id].slots.push(x.slot);
    });
    const curMin = new Date().getHours() * 60 + new Date().getMinutes();
    const isTd = d === todayStr();
    groups.sort((a, b) => medSortFn(a.med, b.med));

    /* 时段胶囊：单药可点打卡；轮播里只做展示（打卡走「记录」按钮或详情页） */
    const slotChips = (g, tappable) => g.slots.map(slot => {
      const entry = doseAt(d, g.med.id, slot);
      const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
      const isNext = !entry && next && next.med.id === g.med.id && next.slot === slot;
      const late = !entry && isTd && curMin > slotMin;
      const cls = entry ? 'done' : ((isNext ? 'next ' : '') + (late ? 'late' : ''));
      if (!tappable) {
        return '<span class="med-mini is-static ' + cls + '">' + esc(slot) + (entry ? ' ✓' : '') + '</span>';
      }
      return '<button class="med-mini ' + cls + '" data-act="' + (entry ? 'med-undo' : 'med-take') +
        '" data-id="' + g.med.id + '" data-slot="' + esc(slot) +
        '" title="' + (entry ? '点击撤销 ' : '点击记录 ') + esc(slot) + '">' + esc(slot) + (entry ? ' ✓' : '') + '</button>';
    }).join('');

    const medMetaText = g => {
      const dose = Math.round((Number(g.med.doseAmount) || 1) * 100) / 100;
      const mealTxt = mealTimingText(g.med);
      return dose + ' ' + esc(g.med.doseUnit || '') + (mealTxt ? ' · ' + esc(mealTxt) : '');
    };

    let bodyHtml = '';
    if (groups.length >= 2) {
      /* 两种及以上：轮播卡——药名条 + 左右箭头，一次看一种，高度恒定 */
      if (medCardIdx >= groups.length) medCardIdx = 0;
      if (medCardIdx < 0) medCardIdx = groups.length - 1;
      const g = groups[medCardIdx];
      const dayTxt = medDayText(g.med, d);
      const tabs = groups.map((x, i) =>
        '<button type="button" class="med-tab' + (i === medCardIdx ? ' active' : '') +
          '" data-act="med-card-pick" data-idx="' + i + '">' + esc(medShortName(x.med.name)) + '</button>'
      ).join('');
      bodyHtml = '<div class="med-carousel">' +
        '<div class="med-tabs">' + tabs + '</div>' +
        '<div class="med-pane">' +
          '<button type="button" class="med-nav" data-act="med-card-prev" aria-label="上一种">‹</button>' +
          '<div class="med-pane-body">' +
            '<div class="med-pane-top"><b>' + esc(g.med.name) + '</b>' +
              '<i class="med-pane-pos">' + (medCardIdx + 1) + ' / ' + groups.length + '</i></div>' +
            '<div class="med-pane-meta">' + medMetaText(g) +
              (dayTxt ? ' · ' + esc(dayTxt) : '') + '</div>' +
            '<div class="med-line-slots">' + slotChips(g, false) + '</div>' +
          '</div>' +
          '<button type="button" class="med-nav" data-act="med-card-next" aria-label="下一种">›</button>' +
        '</div>' +
      '</div>';
    } else if (groups.length === 1) {
      /* 只有一种药：保持卡面直接打卡，不显示箭头和药名条 */
      const g = groups[0];
      const dayTxt = medDayText(g.med, d);
      bodyHtml = '<div class="med-today"><div class="med-line">' +
        '<div class="med-line-top">' +
          '<b>' + esc(g.med.name) + '</b>' +
          '<span>' + medMetaText(g) + '</span>' +
          (dayTxt ? '<i class="med-line-day">' + esc(dayTxt) + '</i>' : '') +
        '</div>' +
        '<div class="med-line-slots">' + slotChips(g, true) + '</div>' +
      '</div></div>';
    }
    const prnRow = prnMeds.length
      ? '<div class="med-prn-row">按需：' + prnMeds.map(m => esc(m.name)).join('、') + '</div>'
      : '';
    const listHtml = bodyHtml
      ? bodyHtml + prnRow
      : (prnRow ? '<div class="med-today">' + prnRow + '</div>' : '');

    return '<article class="vital-card med-card' + (done ? ' is-done' : '') + '" style="--hc:' + esc(h.color || '#2f6f5e') + '">' +
      '<div class="vital-top">' +
        '<span class="habit-icon">💊</span>' +
        '<div class="vital-title"><b>用药</b><small>' + esc(titleSmall) + '</small></div>' +
        '<span class="pin-tag">常驻</span>' +
      '</div>' +
      '<div class="vital-status">' + status + '</div>' +
      '<div class="vital-sub">' + esc(sub) + '</div>' +
      listHtml +
      (low ? '<div class="med-warn">' + esc(low.m.name) + (low.days <= 0 ? ' 已用完' : ' 仅够 ' + low.days + ' 天') + '</div>' : '') +
      '<div class="vital-progress"><i style="width:' + progress + '%"></i></div>' +
      '<div class="vital-actions">' + actions + '</div>' +
    '</article>';
  }

  function medSheetHtml(d) {
    const isToday = d === todayStr();
    const sched = medScheduledFor(d);
    const total = sched.length;
    const taken = medTakenCount(d);
    const next = isToday ? medNextDose(d) : null;
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const dd = parseD(d);

    const groups = [];
    const map = {};
    sched.forEach(x => {
      if (!map[x.med.id]) {
        map[x.med.id] = { med: x.med, slots: [] };
        groups.push(map[x.med.id]);
      }
      map[x.med.id].slots.push(x.slot);
    });

    const groupHtml = groups.map(g => {
      const med = g.med;
      const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
      const stock = medStockLabel(med);
      const head = '<div class="med-item-head">' +
        '<span class="med-item-ico">💊</span>' +
        '<div class="med-item-title"><b>' + esc(med.name) + '</b><small>' +
          '每次 ' + dose + ' ' + esc(med.doseUnit || '') +
          (med.strength ? '（' + esc(med.strength) + '）' : '') +
          (med.purpose && med.purpose !== '其他' ? ' · ' + esc(med.purpose) : '') +
          (mealTimingText(med) ? ' · ' + esc(mealTimingText(med)) : '') +
          (med.manufacturer ? ' · ' + esc(med.manufacturer) : '') +
          ((med.medInfo || med.note) ? ' · ' + esc(med.medInfo || med.note) : '') +
          ' · ' + esc(medCourseLabelOn(med, d)) +
        '</small></div>' +
        (stock ? '<span class="med-item-stock">' + esc(stock) + '</span>' : '') +
      '</div>';
      const doses = g.slots.map(slot => {
        const entry = doseAt(d, med.id, slot);
        const isTaken = !!entry;
        const slotMin = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3, 5));
        const isNext = !!(next && next.med.id === med.id && next.slot === slot);
        const late = !isTaken && (!isToday || nowMin > slotMin);
        const cls = isTaken ? 'done' : ((isNext ? 'next ' : '') + (late ? 'late' : ''));
        return '<button class="med-dose ' + cls + '" data-act="' + (isTaken ? 'med-undo' : 'med-take') +
          '" data-id="' + med.id + '" data-slot="' + slot + '">' +
          slot + (isTaken ? ' ✓' : '') +
        '</button>';
      }).join('');
      return '<div class="med-item">' + head +
        '<div class="med-dose-row">' + doses + '</div>' +
      '</div>';
    }).join('');

    const prnMeds = (state.meds || []).filter(m => m.status === 'active' && isPrn(m));
    const prnHtml = prnMeds.map(med => {
      const keys = prnKeys(d, med.id);
      const times = keys.map(k => {
        const e = state.doses[d][med.id][k];
        const at = new Date(e.at);
        return isNaN(at.getTime()) ? '' : pad2(at.getHours()) + ':' + pad2(at.getMinutes());
      }).filter(Boolean);
      const dose = Math.round((Number(med.doseAmount) || 1) * 100) / 100;
      return '<div class="med-item med-prn">' +
        '<div class="med-item-head"><span class="med-item-ico">💊</span>' +
          '<div class="med-item-title"><b>' + esc(med.name) + '</b><small>按需 · 每次 ' + dose + ' ' + esc(med.doseUnit || '') +
            (med.note ? ' · ' + esc(med.note) : '') + '</small></div>' +
          (medStockLabel(med) ? '<span class="med-item-stock">' + esc(medStockLabel(med)) + '</span>' : '') +
        '</div>' +
        '<div class="med-prn-row">' +
          '<span class="med-prn-count">' + (isToday ? '今日' : '当日') + ' ' + keys.length + ' 次' +
            (times.length ? ' · ' + times.join(' / ') : '') + '</span>' +
          '<button class="med-dose next" data-act="med-prn" data-id="' + med.id + '">＋ 记一次</button>' +
          (keys.length ? '<button class="med-dose" data-act="med-prn-undo" data-id="' + med.id + '">撤销</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    const body = groupHtml + prnHtml;
    const headText = total > 0 ? taken + ' / ' + total + ' 次' : (prnMeds.length ? '按需用药' : '暂无计划');

    return '<div class="modal-card med-sheet" id="med-sheet">' +
      '<div class="med-sheet-head"><div><h3>' + (isToday ? '今日用药' : '当日用药') + '</h3>' +
        '<span class="muted-sm">' + dd.getFullYear() + ' 年 ' + (dd.getMonth() + 1) + ' 月 ' + dd.getDate() + ' 日 · ' + headText + '</span></div>' +
        '<button class="icon-btn" data-act="close-modal" title="关闭">✕</button>' +
      '</div>' +
      (body || '<div class="empty-box">这一天没有用药计划。可在设置 → 用药管理里添加。</div>') +
      '<div class="modal-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-act="close-modal">关闭</button></div>' +
    '</div>';
  }

  function taskRow(t, d) {
    const overdue = t.status !== 'done' && t.due && t.due < d;
    const tagColor = TAGS[t.tag] || TAGS['其他'];
    const repeat = taskRepeatLabel(t);
    return '<div class="task-row ' + (t.status === 'done' ? 'done' : '') + '">' +
      '<button class="check" data-act="task-toggle" data-id="' + t.id + '" data-date="' + d + '" aria-label="切换完成">✓</button>' +
      '<div class="task-row-main">' +
        '<div class="task-row-title">' + esc(t.title) + '</div>' +
        '<div class="task-row-meta">' +
          '<span class="tag" style="--tag:' + tagColor + '">' + esc(t.tag || '其他') + '</span>' +
          (repeat ? '<span class="repeat-badge">' + esc(repeat) + '</span>' : '') +
          '<span class="due ' + (overdue ? 'overdue' : '') + '">' + dueText(t) + '</span>' +
        '</div>' +
      '</div>' +
      '<button class="icon-btn" data-act="task-edit" data-id="' + t.id + '" aria-label="编辑任务">✎</button>' +
      '</div>';
  }

  function weekPanel() {
    const base = parseD(selectedDate);
    const dow = (base.getDay() + 6) % 7;
    const monday = addDays(base, -dow);
    const days = [];
    let recCount = 0, sum = 0, qualified = 0;
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const future = ds > todayStr();
      const pct = Math.round(st.ratio * 100);
      if (rec) { recCount++; sum += st.ratio; if (st.ratio >= 0.75) qualified++; }
      const dd = parseD(ds);
      days.push({ ds: ds, rec: rec, pct: pct, wd: WEEK_CN[dd.getDay()], num: dd.getDate(), future: future });
    }
    const avg = recCount ? Math.round(sum / recCount * 100) : 0;
    const title = (todayStr() >= days[0].ds && todayStr() <= days[6].ds) ? '本周' : '这一周';
    const strip = days.map(x => {
      const sel = x.ds === selectedDate;
      const h = x.rec ? Math.max(6, x.pct) : 2;
      return '<button class="wk' + (sel ? ' is-sel' : '') + (x.rec ? ' has-data' : '') + (x.future ? ' is-future' : '') + '"' +
        ' data-act="pick-week-day" data-date="' + x.ds + '"' + (x.future ? ' disabled' : '') +
        ' title="' + x.ds + ' · ' + (x.future ? '未来' : (x.rec ? '完成 ' + x.pct + '%' : '无记录')) + '">' +
        '<span class="wk-wd">' + x.wd + '</span>' +
        '<span class="wk-track"><i class="' + (x.rec ? '' : 'empty') + '" style="height:' + h + '%"></i></span>' +
        '<span class="wk-num">' + x.num + '</span>' +
        '</button>';
    }).join('');
    return '<section class="panel week-panel">' +
      '<div class="panel-head"><h3>' + title + '</h3><span class="muted-sm">' +
        days[0].ds.slice(5).replace('-', '/') + ' – ' + days[6].ds.slice(5).replace('-', '/') +
      '</span></div>' +
      '<div class="week-strip">' + strip + '</div>' +
      '<div class="week-foot">' +
        '<span>记录 <b>' + recCount + '</b> 天</span>' +
        '<span>平均 <b>' + (recCount ? avg + '%' : '—') + '</b></span>' +
        '<span>达标 <b>' + qualified + '</b> 天</span>' +
      '</div>' +
    '</section>';
  }

  function heroWeekPanel() {
    const base = parseD(selectedDate);
    const dow = (base.getDay() + 6) % 7;
    const monday = addDays(base, -dow);
    const days = [];
    let recCount = 0, sum = 0, qualified = 0;
    for (let i = 0; i < 7; i++) {
      const ds = fmt(addDays(monday, i));
      const st = dayStats(ds);
      const rec = hasRecords(ds);
      const pct = Math.round(st.ratio * 100);
      if (rec) { recCount++; sum += st.ratio; if (st.ratio >= 0.75) qualified++; }
      const dd = parseD(ds);
      days.push({ ds: ds, rec: rec, pct: pct, wd: WEEK_CN[dd.getDay()], num: dd.getDate() });
    }
    const avg = recCount ? Math.round(sum / recCount * 100) : 0;
    const title = (todayStr() >= days[0].ds && todayStr() <= days[6].ds) ? '本周' : '这一周';
    const range = days[0].ds.slice(5).replace('-', '/') + ' – ' + days[6].ds.slice(5).replace('-', '/');
    const strip = days.map(x => {
      const sel = x.ds === selectedDate;
      const h = x.rec ? Math.max(12, x.pct) + '%' : '6px';
      return '<span class="hw-day' + (sel ? ' is-sel' : '') + '">' +
        '<span class="hw-track"><i style="height:' + h + '"></i></span>' +
