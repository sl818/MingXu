  /* 一条通知的「什么时候」文案。单次过了日期直接标已过期——
     发没发过前端不知道（那是后端的 push_sent），但日期过了就是过去了。 */
  /* 单次通知「日期 + 时刻」已经过去 = 不会再发了。
     为什么判到分钟、不只比日期：今天 11:40 那条，到了 12:13 就已经发完了，
     只比日期会让它整天都显示成「还有效」，列表上一眼看不出哪条是活着的。 */
  function noticePast(n) {
    if (!n || n.mode !== 'once') return false;
    const d = String(n.date || '');
    const t = String(n.time || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)) return false;
    const at = Math.round(parseD(d).getTime() / 1000) +
      (Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5))) * 60;
    return at <= Math.round(Date.now() / 1000);
  }
  function noticeWhenText(n) {
    const t = n.time;
    if (n.mode === 'once') {
      const d = n.date || '未设日期';
      return d + ' ' + t + ' · 单次' + (noticePast(n) ? ' · 已过期' : '');
    }
    if (n.mode === 'weekly') {
      const ws = (n.weeks || []).slice().sort();
      if (!ws.length) return '每周 · 还没选星期';
      return '每周' + ws.map(function (w) { return WEEK_CN[w]; }).join('、') + ' ' + t;
    }
    if (n.mode === 'monthly') {
      return '每月 ' + n.monthday + ' 号 ' + t +
        (n.monthday > 28 ? '（小月按月末那天发）' : '');
    }
    return '每天 ' + t;
  }

  function noticePanelHtml() {
    const list = Array.isArray(state.notices) ? state.notices : [];
    const rows = list.map(function (n) {
      const past = noticePast(n);
      return '<div class="notice-row' + (n.on ? '' : ' off') + (past ? ' past' : '') + '">' +
        '<div class="notice-main">' +
          '<span class="notice-when">' + esc(noticeWhenText(n)) + (n.on ? '' : ' · 已暂停') + '</span>' +
          '<span class="notice-text">' + esc(n.text) + '</span>' +
        '</div>' +
        '<div class="notice-acts">' +
          (past ? '<button class="btn sm" data-act="notice-send" data-id="' + n.id + '">重发</button>' : '') +
          '<button class="icon-btn" data-act="notice-toggle" data-id="' + n.id + '" title="' +
            (n.on ? '暂停' : '开启') + '">' + (n.on ? '⏸' : '▶') + '</button>' +
          '<button class="icon-btn" data-act="notice-edit" data-id="' + n.id + '" title="编辑">✎</button>' +
          '<button class="icon-btn" data-act="notice-del" data-id="' + n.id + '" title="删除">🗑</button>' +
        '</div>' +
      '</div>';
    }).join('');
    return '<div class="panel"><h3>自定义通知 ' +

  /* v208：功能模块页（预览版）—— 开关状态存本机 localStorage，停用的隐藏/过滤逻辑下一版接入 */
  function viewModules() {
    const DEFS = [
      { key: 'meds',    icon: '💊', name: '用药',      desc: '服药排期、提醒与打卡记录' },
      { key: 'breathe', icon: '🌬️', name: '478呼吸法', desc: '呼吸练习与每天几组' },
      { key: 'water',   icon: '💧', name: '喝水',      desc: '每天喝水量与补水记录' },
      { key: 'move',    icon: '🏃', name: '运动',      desc: '运动打卡、目标与统计' },
      { key: 'quit',    icon: '🚭', name: '戒烟',      desc: '戒烟打卡、烟盒与买烟记录' },
      { key: 'money',   icon: '💰', name: '清债',      desc: '债务清单与还款计划',
        warn: '停用后还款日历与提醒同步停止' }
    ];
    const pref = function (key) { return isModuleOn(key); };
    const rows = DEFS.map(function (m) {
      const on = pref(m.key);
      /* v209：外层用 div 而非 label —— label 会把点击转发给 input 造成一次点击两次事件；
         data-act 放在外层 span，点击开关区域冒泡一次，handler 用 isModuleOn 取反得目标状态。 */
      return '<div class="mdl-row' + (on ? '' : ' off') + '">' +
        '<span class="mdl-ico">' + m.icon + '</span>' +
        '<span class="mdl-txt"><b>' + esc(m.name) + '</b><small>' + esc(m.desc) + '</small>' +
          (on ? '' : '<small class="mdl-off-tag">已停用 · 数据已保留' + (m.warn ? ' · ' + esc(m.warn) : '') + '</small>') + '</span>' +
        '<span class="w-switch" data-act="module-toggle" data-key="' + m.key + '">' +
          '<input type="checkbox" tabindex="-1"' + (on ? ' checked' : '') + '><i></i></span>' +
      '</div>';
    }).join('');
    const onCount = DEFS.filter(function (m) { return pref(m.key); }).length;
    return '<div class="config-wrap">' +
      '<header class="page-head"><h2>功能模块</h2>' +
        '<p class="sub">已启用 ' + onCount + ' / ' + DEFS.length + ' 个 · 按需启停，页面只留你在用的</p></header>' +
      '<section class="panel">' +
        '<p class="w-sec-lead">停用后：导航入口隐藏、不计入完成率、提醒停止。' +
          '<b>所有数据原样保留</b>，重新开启即恢复。</p>' +
        '<div class="mdl-list">' + rows + '</div>' +
        '<p class="w-freq-note">停用不会删除任何数据；重新开启后，连续天数、统计与提醒都会原样恢复。</p>' +
      '</section>' +
    '</div>';
  }

  /* ---------- 通知路由（v211）----------
     五块：全局总控 / 板块总控（含免打扰与小结时刻）/ 文案模板 / 用户通知数据列表。
     数据：notify_prefs（boards/quietCfg/report/templates）+ push_preview（今日真实排程）
     + 本地 remindItems()。页面内状态不进 state。 */
  /* entry：板块渠道在哪些地方能改（v216）——dual = 模块页与路由页双入口（同一份数据），
     route = 仅通知路由页。运动另支持实例级（每个运动单独开关+渠道）。 */
  const NOTIFY_BOARDS = [
    { id: 'med', name: '用药', icon: '💊', module: 'meds', entry: 'route' },
    { id: 'water', name: '喝水', icon: '💧', module: 'water', entry: 'dual', entryName: '喝水页' },
    { id: 'move', name: '运动', icon: '🏃', module: 'move', entry: 'dual', entryName: '运动弹窗', inst: true },
    { id: 'breathe', name: '478 呼吸', icon: '🌬️', module: 'breathe', entry: 'dual', entryName: '478 页' },
    { id: 'quit', name: '戒烟', icon: '🚭', module: 'quit', entry: 'route' },
    { id: 'task', name: '待办', icon: '📋' },
    { id: 'habit', name: '普通习惯', icon: '🔁' },
    { id: 'notice', name: '自定义提醒', icon: '🔔' },
    { id: 'countdown', name: '倒数日', icon: '📅' },
    { id: 'debt', name: '还款提醒', icon: '💳' },

  ];
  const NOTIFY_CHANNELS = [['wecom', '企业微信'], ['mail', '邮件'], ['browser', '浏览器']];
  const NOTIFY_TPL_SCENES = [
    ['med', '用药'], ['task', '待办'], ['habit', '习惯'], ['water', '喝水'], ['move', '运动'],
    ['breathe', '478'], ['report', '小结'], ['notice', '自定义'], ['countdown', '倒数日'],
    ['debt', '还款'], ['test', '测试消息']
  ];

  function notifyBoardName(id) {
    if (id === 'browser') return '浏览器';
    const hit = NOTIFY_BOARDS.filter(function (b) { return b.id === id; })[0];
    return hit ? hit.name : (id || '其他');
  }

  async function notifyRouteLoad() {
    if (notifyRouteLoading || notifyRoute !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    notifyRouteLoading = true;
    try {
      const r = await cloudApi('notify_prefs');
      notifyRoute = {
        boards: (r && r.boards) || null,
        quiet: (r && r.quietCfg) || { on: false, start: '23:00', end: '07:00' },
        report: (r && r.report) || { morning: '08:20', noon: '12:30', evening: '20:00' },
        templates: (r && r.templates) || null,
        kinds: (r && r.kinds) || {},
        global: !(r && r.global === false)
      };
      try {
        const p = await cloudApi('push_preview');
        notifyPlan = (p && Array.isArray(p.items)) ? p.items : [];
      } catch (e) {
        notifyPlan = [];
      }
    } catch (e) {
      notifyRoute = null;
      notifyPlan = [];
    }
    notifyRouteLoading = false;
    notifyHistoryLoad();
    if (view === 'notifyroute' || view === 'water' || view === 'breathe' || view === 'move') render();
  }

  async function notifyHistoryLoad() {
    if (notifyHistoryLoading || notifyHistory !== undefined) return;
    if (mode === 'landing' || !cloud.user) return;
    notifyHistoryLoading = true;
    try {
      const r = await cloudApi('push_history');
      notifyHistory = (r && Array.isArray(r.items)) ? r.items : [];
    } catch (e) {
      notifyHistory = null;
    }
    notifyHistoryLoading = false;
    if (view === 'notifyroute') render();
  }

  /* 只重绘历史面板（筛选切换时不整页 render） */
  function renderNotifyHistory() {
    const box = document.getElementById('nr-hist-list');
    if (!box) return;
    box.innerHTML = notifyHistoryRowsHtml();
  }

  /* v224：历史记录按提醒聚合渲染——一张卡 = 一次提醒，组内逐渠道标成败 */
  const NOTIFY_HIST_STATUS = {
    ok: ['成功', 'ok'], part: ['部分成功', 'p2'], fail: ['失败', 'warn'], skip: ['未发送', 'quiet']
  };
  const NOTIFY_HIST_CHIP = {
    ok: ['✓ 已发送', 'chip-ok'], fail: ['✗ 失败', 'chip-bad']
  };

  function notifyHistoryRowsHtml() {
    const all = Array.isArray(notifyHistory) ? notifyHistory : [];
    /* 筛「失败」= 组内任一渠道失败（部分成功的卡也要能翻出来） */
    const list = nrHistFilter ? all.filter(function (r) {
      if (nrHistFilter === 'fail') {
        return (r.rows || []).some(function (x) { return x.status === 'fail'; });
      }
      return r.status === nrHistFilter;
    }) : all;
    if (!all.length) {
      return '<p class="nr-empty">暂无发送记录（服务端每次实际尝试发送时才开始记）。</p>';
    }
    if (!list.length) {
      return '<p class="nr-empty">没有符合筛选条件的记录。</p>';
    }
    const chanName = function (c) {
      return c === 'wecom' ? '企微' : (c === 'mail' ? '邮件' : c);
    };
    return list.map(function (g) {
      const st = NOTIFY_HIST_STATUS[g.status] || [g.status, 'quiet'];
      const board = (notifyRoute && notifyRoute.boards && notifyRoute.boards[g.board]) || null;
      const browserOn = !!(board && board.channels && board.channels.browser);
      /* 渠道行：服务端各渠道的成败 + 浏览器（勾了就标「本地」） */
      let chips = g.rows.map(function (row) {
        const spec = NOTIFY_HIST_CHIP[row.status];
        if (!spec) return '';
        return '<span class="nr-chip ' + spec[1] + '">' + esc(chanName(row.channel)) + ' ' + spec[0] + '</span>';
      }).join('');
      if (browserOn) {
        chips += '<span class="nr-chip off">浏览器 · 本地</span>';
      }
      /* 失败原因：每个失败渠道一行 */
      const errs = g.rows.filter(function (row) { return row.status === 'fail' && row.error; })
        .map(function (row) {
          return '<span class="nr-err">' + esc(chanName(row.channel) + '：' + row.error) + '</span>';
        }).join('');
      const skipNote = (g.status === 'skip' && g.rows[0] && g.rows[0].error)
        ? '<span class="nr-err">' + esc(g.rows[0].error) + '</span>' : '';
      const off = g.status === 'skip';
      return '<div class="nr-card' + (off ? ' off' : '') + '" style="cursor:default">' +
        '<span class="nr-ctop">' +
          '<span class="nr-badge ' + st[1] + '">' + st[0] + '</span>' +
          '<span class="nr-badge quiet">' + esc(NOTIFY_SRC_CN[g.kind] || g.kind || '提醒') + '</span>' +
          '<span class="nr-ctime">' + esc(String(g.at || '').replace('T', ' ').slice(0, 16)) + '</span>' +
        '</span>' +
        '<span class="nr-ctitle">' + esc(String(g.content || '').split('\n')[0] || '（无文案）') + '</span>' +
        (chips ? '<span class="nr-cchan"><span class="nr-chiplabel">渠道</span>' + chips + '</span>' : '') +
        skipNote + errs +
      '</div>';
    }).join('');
  }

  function notifyHistoryHtml() {
    const all = Array.isArray(notifyHistory) ? notifyHistory : [];
    const nPart = all.filter(function (r) { return r.status === 'part'; }).length;
    const nFail = all.filter(function (r) { return r.status === 'fail'; }).length;
    const nSkip = all.filter(function (r) { return r.status === 'skip'; }).length;
    const stat = all.length
      ? all.length + ' 次 · 部分成功 ' + nPart + ' · 失败 ' + nFail + ' · 未发送 ' + nSkip

    return notifyRoutePanel('历史推送记录', stat,
      '<p class="nr-note">服务端每次实际尝试发送时记一条：成功、失败（含返回提示）、因板块/实例停用而未发送。' +

            '<button type="button" class="nr-chip' + (mail.mode === 'plain' ? ' on' : '') +
              '" data-act="notify-tpl-mailmode" data-m="plain">纯文本</button>' +
            colors.map(function (c) {
              return '<button type="button" class="nr-color c-' + c[0] + (mail.color === c[0] ? ' on' : '') +
                '" data-act="notify-tpl-color" data-c="' + c[0] + '" title="主题色：' + c[1] + '"></button>';
            }).join('') +
            '<label class="nr-foot">页脚 <input type="text" id="nr-tpl-footer" maxlength="60" value="' +
              esc(mail.footer || '') + '"></label>' +
          '</div>' +
          '<div class="nr-actions">' +
            '<button type="button" class="btn primary" data-act="notify-tpl-save">保存模板</button>' +
            '<button type="button" class="btn ghost" data-act="notify-tpl-reset">恢复本场景</button>' +
            '<button type="button" class="btn ghost" data-act="notify-tpl-reset-all">恢复全部</button>' +
          '</div>' +
        '</div>' +
        '<div class="nr-tpl-preview" id="nr-tpl-preview"></div>' +
      '</div>');
  }

  function notifyTplVars() {
    /* v214：优先用「数据列表」里点中的那一条，让模板预览能对照真实内容 */
    let sample = null;
    if (nrActiveItem) {
      sample = notifyPlanRows().filter(function (r) { return r.id === nrActiveItem; })[0] || null;
    }
    if (!sample) {
      sample = (notifyPlan || []).filter(function (it) {
        return (it.source || it.kind) === notifyTplScene;
      })[0] || null;
    }
    const kind = sample ? String(sample.kind || '') : notifyTplScene;
    const src = sample ? String(sample.source || sample.kind || '') : notifyTplScene;
    return {
      '{标题}': sample ? String(sample.title || '') : '标题示例',
      '{正文}': sample ? String(sample.body || '') : '正文示例',
      '{时间}': sample && sample.time ? String(sample.time) : '08:00',
      '{类目}': NOTIFY_KIND_CN[kind] || ((notifyRoute && notifyRoute.kinds && notifyRoute.kinds[kind]) || '类目'),
      '{场景}': NOTIFY_KIND_CN[kind] || notifyBoardName(notifyTplScene),
      '{来源}': NOTIFY_SRC_CN[src] || notifyBoardName(notifyTplScene),
      '{功能}': NOTIFY_SRC_CN[src] || notifyBoardName(notifyTplScene),
      '{优先级}': sample ? String(sample.priority || '日常') : '日常',
      '{浏览器文案}': '浏览器文案示例'
    };
  }

  function notifyTplApply(s, vars) {
    return String(s || '').replace(/\{[^{}]+\}/g, function (m) {
      return vars[m] !== undefined ? vars[m] : m;
    });
  }

  /* 与后端 lb_notify_mail_card 同款（内联样式）；两边改一处必须同步另一处 */
  function notifyMailCardHtml(title, body, footer, color) {
    const palette = { blue: '#2C68FF', green: '#0c6e42', amber: '#8a5808', red: '#b3261e' };
    const c = palette[color] || palette.blue;
    const t = esc(title);
    const b = esc(body).replace(/\n/g, '<br>');
    const f = esc(footer || '');
    const foot = f !== ''
      ? '<div style="margin-top:18px;padding-top:12px;border-top:1px solid #e6e9ef;font-size:12px;color:#7a8494">' + f + '</div>'
      : '';
    return '<div style="padding:14px;background:#f4f6fa;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">' +
      '<div style="max-width:520px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e6e9ef">' +
      '<div style="height:4px;background:' + c + '"></div>' +
      '<div style="padding:20px 22px">' +
      '<div style="font-size:17px;font-weight:700;color:#1c2430;margin-bottom:10px">' + t + '</div>' +
      '<div style="font-size:14px;line-height:1.7;color:#333b48">' + b + '</div>' + foot +
      '</div></div></div>';
  }

  function notifyTplPreview() {
    const box = document.getElementById('nr-tpl-preview');
    if (!box) return;
    const t = notifyRoute && notifyRoute.templates;
    const scene = (t && t.scenes && t.scenes[notifyTplScene]) || {};
    const mail = (t && t.mail) || { color: 'blue', footer: '', mode: 'html' };
    const elTitle = document.getElementById('nr-tpl-title');
    const elBody = document.getElementById('nr-tpl-body');
    const elFoot = document.getElementById('nr-tpl-footer');
    const vars = notifyTplVars();
    const title = notifyTplApply(elTitle ? elTitle.value : (scene.title || ''), vars);
    const body = notifyTplApply(elBody ? elBody.value : (scene.body || ''), vars);
    const browserText = notifyTplApply(scene.browser || '{浏览器文案}', vars) || body;
    const footer = elFoot ? elFoot.value : (mail.footer || '');

    let mailHtml = '';
    if (mail.mode !== 'plain') {
      const cardHtml = notifyMailCardHtml(title, body, footer, mail.color);
      mailHtml = '<div class="nr-prev-label">邮件卡片</div>' +
        '<div class="nr-mailprev">' + cardHtml + '</div>' +
        '<details class="nr-src"><summary>查看 HTML 源码</summary><pre>' + esc(cardHtml) + '</pre></details>';
    } else {
      mailHtml = '<div class="nr-prev-label">邮件（纯文本）</div>' +
        '<div class="nr-prev-b">' + esc(title + '\n' + body).replace(/\n/g, '<br>') + '</div>';
    }

    box.innerHTML =
      '<div class="nr-prev-label">服务端通知</div>' +
      '<div class="nr-prev-t">' + esc(title) + '</div>' +
      '<div class="nr-prev-b">' + esc(body).replace(/\n/g, '<br>') + '</div>' +
      '<div class="nr-prev-label">浏览器本地通知</div>' +
      '<div class="nr-prev-t">明序</div>' +
      '<div class="nr-prev-b">' + esc(browserText).replace(/\n/g, '<br>') + '</div>' +
      mailHtml;
  }

  function notifyInQuietNow(q) {
    if (!q || !q.on) return false;
    const d = new Date();
    const hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    const s = q.start || '23:00';
    const e = q.end || '07:00';
    if (s === e) return false;
    return s < e ? (hm >= s && hm < e) : (hm >= s || hm < e);
  }

  function notifyRowState(r) {
    if (notifyRoute && notifyRoute.global === false) return '总开关关闭';
    const row = (notifyRoute && notifyRoute.boards) ? notifyRoute.boards[r.board] : null;
    if (r.local) {
      const bch = (row && row.channels) || null;
      if (bch && bch.browser === false) return '渠道停用';
      return '本地';
    }
    /* v216：move 条目优先看实例开关（运动弹窗存的那个） */
    if (r.board === 'move' && r.sport) {
      const inst = notifyMoveInstance(r.sport);
      if (inst && inst.on === false) return '已关闭';
    }
    if (row && row.on === false) return '板块停用';
    const ch = (row && row.channels) || null;
    if (ch && ch.wecom === false && ch.mail === false) return '渠道留空';
    if (notifyInQuietNow(notifyRoute && notifyRoute.quiet)) return '免打扰';
    return '会发送';
  }

  /* v214：数据列表对齐设计稿（卡片网格 + 类目/优先级/状态筛选）——
     展示口径集中在这里，后端 push_preview 只要给 id/kind/source/priority 就够。 */
  const NOTIFY_KIND_CN = {
    med: '用药提醒', task: '待办到点', habit: '习惯提醒',
    water: '习惯提醒', move: '习惯提醒', breathe: '习惯提醒', quit: '习惯提醒',
    notice: '自定义提醒', countdown: '倒数日', debt: '还款提醒', report: '每日小结'
  };
  const NOTIFY_SRC_CN = {
    med: '用药', task: '待办', habit: '习惯', water: '喝水', move: '运动',
    breathe: '478', quit: '戒除', report: '小结', notice: '自定义',
    countdown: '倒数日', debt: '还款', browser: '浏览器', test: '测试'
  };
  const NOTIFY_PRI_RANK = { '紧急': 0, '当日': 1, '日常': 2 };

  /* 筛选与选中都只活在本次页面里，不进 state（刷新回到默认，和模板场景选择一致） */
  let nrFilter = { cat: '', pri: '', st: '', sort: 'priority' };
  let nrActiveItem = '';
  /* v216 历史推送记录：undefined=未拉 / null=失败 / 数组=已拉到 */
  let notifyHistory;
  let notifyHistoryLoading = false;
  let nrHistFilter = '';   // '' = 全部 | ok | fail | skip

  /* 浏览器本地提醒没有 kind，靠 key 与文案反推——只用于类目展示与板块判定 */
  function notifyLocalKind(it) {
    const k = String((it && it.key) || '');
    const t = String((it && it.text) || '');
    if (k.indexOf('med') === 0) return 'med';
    if (k.indexOf('task') === 0) return 'task';
    if (k.indexOf('notice') === 0) return 'notice';
    if (t.indexOf('喝水') >= 0) return 'water';
    if (t.indexOf('478') >= 0) return 'breathe';
    if (t.indexOf('运动') >= 0) return 'move';
    return 'habit';
  }

  function notifyPlanRows() {
    const rows = [];
    (notifyPlan || []).forEach(function (it) {
      const src = String(it.source || it.kind || '');
      rows.push({
        id: String(it.id || '') || (String(it.kind || '') + '-' + String(it.time || '')),
        time: String(it.time || ''),
        kind: String(it.kind || ''),
        source: src,
        board: src,
        sport: String(it.sport || ''),
        priority: String(it.priority || '日常'),
        title: String(it.title || ''),
        body: String(it.body || ''),
        local: false
      });
    });
    if (typeof remindItems === 'function') {
      let local = [];
      try { local = remindItems() || []; } catch (e) { local = []; }
      local.forEach(function (it) {
        const b = notifyLocalKind(it);
        /* 类目跟服务端口径一致：喝水/运动/478 都属于「习惯提醒」，细分放 source；
           自定义提醒（notice）单独成类 */
        const kind = b === 'notice' ? 'notice' : ((b === 'med' || b === 'task') ? b : 'habit');
        rows.push({
          id: 'local-' + String(it.key || ''),
          time: String(it.time || ''),
          kind: kind,
          source: b,
          board: b,
          priority: b === 'med' ? '紧急' : '日常',
          title: '浏览器本地提醒',
          body: String(it.text || ''),
          local: true
        });
      });
    }
    /* 有时刻的按时间升序；本地条目没有时刻，固定排最后 */
    rows.sort(function (a, b) {
      if (a.time === b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time.localeCompare(b.time);
    });
    return rows;
  }

  function notifyPlanFiltered(rows) {
    const out = rows.filter(function (r) {
      if (nrFilter.cat && r.kind !== nrFilter.cat) return false;
      if (nrFilter.pri && r.priority !== nrFilter.pri) return false;
      if (nrFilter.st && notifyRowState(r) !== nrFilter.st) return false;
      return true;
    });
    const rank = function (p) {
      return NOTIFY_PRI_RANK[p] === undefined ? 9 : NOTIFY_PRI_RANK[p];
    };
    out.sort(function (a, b) {
      const ta = a.time || '99:99';
      const tb = b.time || '99:99';
      if (nrFilter.sort === 'time') return ta.localeCompare(tb) || rank(a.priority) - rank(b.priority);
      if (nrFilter.sort === 'category') {
        return String(a.kind).localeCompare(String(b.kind)) ||
          rank(a.priority) - rank(b.priority) || ta.localeCompare(tb);
      }
      return rank(a.priority) - rank(b.priority) || ta.localeCompare(tb);
    });
    return out;
  }

  function notifyPriClass(p) {
    return p === '紧急' ? 'p1' : (p === '当日' ? 'p2' : (p === '日常' ? 'p3' : ''));
  }

  /* v224：数据列表卡片的「渠道行」——这条提醒会走哪些渠道，勾的亮、没勾的灰虚 */
  function notifyCardChanRow(r) {
    const closed = notifyRowState(r) === '已关闭';
    if (closed) {
      return '<span class="nr-cchan"><span class="nr-chiplabel">渠道</span>' +
        '<span class="nr-chipnote">这个运动的通知已关闭，不会走任何渠道</span></span>';
    }
    let ch = null;
    if (r.board === 'move' && r.sport) {
      const inst = notifyMoveInstance(r.sport);
      if (inst && inst.channels) ch = inst.channels;
    }
    if (!ch) ch = notifyBoardChannels(r.board).ch;
    const mk = function (name, on) {
      return '<span class="nr-chip' + (on ? ' on' : ' off') + '">' + name + ' ' + (on ? '●' : '○') + '</span>';
    };
    return '<span class="nr-cchan"><span class="nr-chiplabel">渠道</span>' +
      mk('企微', !!ch.wecom) + mk('邮件', !!ch.mail) + mk('浏览器', !!ch.browser) + '</span>';
  }

  function notifyPlanCardsHtml(list) {
    if (!list.length) {
      return '<p class="nr-empty">没有符合条件的数据项，请调整筛选条件。</p>';
    }
    let html = '';
    let lastGroup = null;
    list.forEach(function (r) {
      let group = null;
      if (nrFilter.sort === 'priority') group = r.priority || '其他';
      else if (nrFilter.sort === 'category') group = NOTIFY_KIND_CN[r.kind] || r.kind || '其他';
      if (group && group !== lastGroup) {
        html += '<div class="nr-group">' + esc(group) + '</div>';
        lastGroup = group;
      }
      const st = notifyRowState(r);
      const off = (st === '板块停用' || st === '免打扰' || st === '总开关关闭' ||
        st === '渠道留空' || st === '渠道停用');
      html += '<button type="button" class="nr-card' + (off ? ' off' : '') +
          (nrActiveItem && nrActiveItem === r.id ? ' on' : '') +
          '" data-act="notify-plan-item" data-id="' + esc(r.id) + '">' +
        '<span class="nr-ctop">' +
          '<span class="nr-badge ' + notifyPriClass(r.priority) + '">' + esc(r.priority || '日常') + '</span>' +
          '<span class="nr-badge quiet">' + esc(NOTIFY_KIND_CN[r.kind] || r.kind || '提醒') + '</span>' +
          '<span class="nr-ctime">' + esc(r.local ? (r.time || '手动') : (r.time || '—')) + '</span>' +
          '<span class="nr-badge' + (off ? ' warn' : ' quiet') + '">' + esc(st) + '</span>' +
        '</span>' +
        '<span class="nr-ctitle">' + esc(r.title || NOTIFY_SRC_CN[r.source] || '提醒') + '</span>' +
        '<span class="nr-cbody">' + esc(String(r.body || '').replace(/\n/g, ' · ')) + '</span>' +
        '<span class="nr-cmeta">功能：' + esc(NOTIFY_SRC_CN[r.source] || '—') +
          ' · 来源：' + esc(r.local ? '浏览器本地' : '服务端排程') +
          ' · ' + esc(r.id || '—') + '</span>' +
        notifyCardChanRow(r) +
      '</button>';
    });
    return html;
  }

  /* 只重绘网格与统计，不整页 render（否则下拉会丢焦点） */
  function renderNotifyPlanList() {
    const box = document.getElementById('nr-grid');
    if (!box) return;
    const all = notifyPlanRows();
    const list = notifyPlanFiltered(all);
    box.innerHTML = notifyPlanCardsHtml(list);
    const stat = document.getElementById('nr-plan-stat');
    if (stat) {
      const cats = {};
      all.forEach(function (r) { cats[r.kind] = true; });
      stat.textContent = all.length + ' 条 · ' + Object.keys(cats).length +
        ' 个类目 · 当前显示 ' + list.length + ' 条';
    }
  }

  function notifyRoutePlanHtml() {
    const all = notifyPlanRows();
    const cats = {};
    all.forEach(function (r) { cats[r.kind] = true; });
    const catOpt = '<option value="">全部</option>' + Object.keys(cats).map(function (k) {
      return '<option value="' + esc(k) + '"' + (nrFilter.cat === k ? ' selected' : '') + '>' +
        esc(NOTIFY_KIND_CN[k] || k) + '</option>';
    }).join('');
    const priOpt = ['', '紧急', '当日', '日常'].map(function (v) {
      return '<option value="' + v + '"' + (nrFilter.pri === v ? ' selected' : '') + '>' +
        (v || '全部') + '</option>';
    }).join('');
    const stOpt = ['', '会发送', '本地', '板块停用', '渠道留空', '免打扰', '总开关关闭', '渠道停用']
      .map(function (v) {
        return '<option value="' + v + '"' + (nrFilter.st === v ? ' selected' : '') + '>' +
          (v || '全部') + '</option>';
      }).join('');
    const sortOpt = [['priority', '按优先级'], ['time', '按触发时间'], ['category', '按通知类目']]
      .map(function (o) {
        return '<option value="' + o[0] + '"' + (nrFilter.sort === o[0] ? ' selected' : '') + '>' +
          o[1] + '</option>';
      }).join('');
    const list = notifyPlanFiltered(all);

    return notifyRoutePanel('用户通知数据列表', '今天真实排程 + 浏览器本地提醒',
      '<p class="nr-note">服务端排程与浏览器本地提醒合并展示；标「板块停用」「免打扰」的条目实际不会发。' +
        '点一张卡片，可以把它的真实内容套进上面的模板预览。</p>' +
      '<div class="nr-toolbar">' +
        '<label>通知类目<select id="nr-f-cat">' + catOpt + '</select></label>' +
        '<label>优先级<select id="nr-f-pri">' + priOpt + '</select></label>' +
        '<label>状态<select id="nr-f-st">' + stOpt + '</select></label>' +
        '<label>排序<select id="nr-f-sort">' + sortOpt + '</select></label>' +
        '<span class="nr-spacer"></span>' +
        '<span class="nr-stat" id="nr-plan-stat">' + all.length + ' 条 · ' +
          Object.keys(cats).length + ' 个类目 · 当前显示 ' + list.length + ' 条</span>' +
        '<button type="button" class="btn ghost" data-act="notify-plan-clear">清除数据项选择</button>' +
        '<button type="button" class="btn ghost" data-act="notify-plan-refresh">刷新</button>' +
      '</div>' +
      '<div class="nr-grid" id="nr-grid">' + notifyPlanCardsHtml(list) + '</div>');
  }

  function viewNotifyRoute() {
    if (mode === 'landing' || !cloud.user) return '';
    if (pushCfg === undefined) pushLoad();

      notifyRouteBoardsHtml() +
      notifyRouteTplHtml() +

  async function notifyRouteSave() {
    if (!notifyRoute || !notifyRoute.boards) return;
    const val = function (id) { const el = document.getElementById(id); return el ? el.value : ''; };
    notifyRoute.quiet = {
      on: !!(notifyRoute.quiet && notifyRoute.quiet.on),
      start: val('nr-quiet-start') || '23:00',
      end: val('nr-quiet-end') || '07:00'
    };
    notifyRoute.report = {
      morning: val('nr-rep-morning'),
      noon: val('nr-rep-noon'),
      evening: val('nr-rep-evening')
    };
    try {
      const r = await cloudApi('notify_prefs_save', {
        boards: notifyRoute.boards,
        quiet: notifyRoute.quiet,
        report: notifyRoute.report,
        global: notifyRoute.global !== false
      });
      if (r && r.boards) notifyRoute.boards = r.boards;
      if (r && r.quietCfg) notifyRoute.quiet = r.quietCfg;
      if (r && r.report) notifyRoute.report = r.report;
      if (r && typeof r.global === 'boolean') notifyRoute.global = r.global;
      toast('通知设置已保存');
      render();
    } catch (e) {
      toast(e && e.message ? e.message : '保存失败');
    }
  }

  async function notifyTplSave() {
    const t = notifyRoute && notifyRoute.templates;
    if (!t || !t.scenes) return;
    const val = function (id) { const el = document.getElementById(id); return el ? el.value : ''; };
    t.scenes[notifyTplScene] = {
      title: val('nr-tpl-title'),
      body: val('nr-tpl-body'),
      browser: val('nr-tpl-browser')
    };
    t.mail = {
      color: (t.mail && t.mail.color) || 'blue',
      footer: val('nr-tpl-footer'),
      mode: (t.mail && t.mail.mode) === 'plain' ? 'plain' : 'html'
    };
    try {
      const r = await cloudApi('notify_templates_save', { templates: t });
      if (r && r.templates) notifyRoute.templates = r.templates;
      toast('模板已保存');
      render();
    } catch (e) {
      toast(e && e.message ? e.message : '保存失败');
    }
  }

  async function notifyTplReset() {
    const t = notifyRoute && notifyRoute.templates;
    if (!t || !t.scenes) return;
    t.scenes[notifyTplScene] = { title: '{标题}', body: '{正文}', browser: '{浏览器文案}' };
    try {
      const r = await cloudApi('notify_templates_save', { templates: t });
      if (r && r.templates) notifyRoute.templates = r.templates;
      toast('已恢复默认');
      render();
    } catch (e) {
      toast(e && e.message ? e.message : '恢复失败');
    }
  }

  async function notifyTplResetAll() {
    const t = notifyRoute && notifyRoute.templates;
    if (!t || !t.scenes) return;

  function saveNoticeForm(form) {

  function navOrderHtml() {

  /* 设置页「导航顺序」：每次渲染后给每个组的 .dr-list 挂拖拽排序。
     拖完（reorder）复用现有逻辑——组内 from→to 重排、写完整 navOrder、保存、重渲染。 */
  function mountNavDrag() {
    document.querySelectorAll('.dr-list[data-nav-group]').forEach(function (listEl) {
      dragReorder(listEl, { duration: 200, lift: 1.04, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
      listEl.addEventListener('reorder', function (e) {
        const group = listEl.dataset.navGroup;
        const from = e.detail.from, to = e.detail.to;
        if (from === to) return;
        const list = orderedNav();
        const keys = list.filter(function (n) { return n.group === group; }).map(function (n) { return n.key; });
        if (from < 0 || to < 0 || from >= keys.length || to >= keys.length) return;
        const moved = keys.splice(from, 1)[0];
        keys.splice(to, 0, moved);
        let i = 0;
        state.navOrder = list.map(function (n) { return n.group === group ? keys[i++] : n.key; });
        state.navOrderAt = Date.now();
        save();
        render();
      });
    });
  }

  /* 导航顺序的清洗：只留字符串 + 去重。
     **刻意不在这里过滤「NAV 里有没有这个 key」** —— NAV 是下面才声明的 const，
     状态初始化时它还在 TDZ 里，引用会直接报错。未知 key 交给 orderedNav() 在渲染时忽略。 */
  function normalizeNavOrder(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (k) {
      const v = String(k || '');
      if (!v || seen[v]) return;
      seen[v] = 1;
      out.push(v);
    });
    return out.slice(0, 32);
  }

  /* 实际导航顺序：NAV 常量只管「有哪些页 + 默认顺序」，顺序全部由这里算。
     跟 PINNED_IDS / orderedPinnedIds 是同一个分工——常量管集合，顺序单独算。 */
  const NAV_GROUPS = ['记录', '回顾', '设置'];
  function orderedNav() {
    const pref = Array.isArray(state.navOrder) ? state.navOrder : [];
    const rank = function (k) {
      const i = pref.indexOf(k);
      return i < 0 ? 1e4 + NAV.findIndex(function (n) { return n.key === k; }) : i;
    };
    /* v209：停用的模块不进导航（桌面顶栏/侧栏/手机抽屉全走这里） */
    const out = NAV.slice().sort(function (a, b) {
      /* 组间固定：记录在前、回顾在后。UI 只给组内上下调，
         但导入的备份不一定规整，这里兜一层。 */
      const ga = NAV_GROUPS.indexOf(a.group);
      const gb = NAV_GROUPS.indexOf(b.group);
      if (ga !== gb) return ga - gb;
      return rank(a.key) - rank(b.key);
    }).filter(function (n) {
      return ['meds', 'quit', 'water', 'move', 'breathe', 'money'].indexOf(n.key) < 0 || isModuleOn(n.key);
    });
    return out;
  }

          el.style.transition = '';
          var h = handleOf(el);
          h && h.setAttribute('aria-pressed', 'false');
        });
        list.style.removeProperty('--dr-duration');
        list.style.removeProperty('--dr-easing');
        list.removeAttribute('data-dr-motion');
        active = null;
        keyState = null;
        live.remove();
        if (drPrevs.get(list) === ctl) drPrevs.delete(list);
      }
    };
    drPrevs.set(list, ctl);
    return ctl;
  }

  function clearDropMarks() {

  function cnDate(ds) {
    if (!ds) return '';
    /* parseD 只认 'YYYY-MM-DD'，把 ISO 串（createdAt / archivedAt 都是 ISO）
       塞进去会得到 NaN月NaN日。非纯日期的一律交给 Date 解析，按本地时区算。 */
    const raw = String(ds);
    const d = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? parseD(raw) : new Date(raw);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  let archDropAt = 0;

  function archiveModal() {

      bits.push('优先级 ' + (t.priority || '中'));

      return '<div class="arch-row">' +
        '<div class="ar-main"><b title="' + esc(t.title) + '">' + esc(t.title) + '</b>' +

        '<div class="ar-btns">' +

          '<button type="button" class="ar-btn" data-act="task-arch-view" data-id="' + t.id + '">查看</button>' +

        '<p class="hint" style="margin:0 0 10px">归档只是把卡片从看板收进历史，任务本身和记录都还在，可以随时恢复。</p>' +
        (rows
          ? '<div class="arch-list">' + rows + '</div>'
          : '<div class="empty-box">还没有归档的任务。把看板上的卡片拖到看板下方的「拖到这里归档」，就会收进来。</div>') +

          '<span class="spacer"></span>' +

  /* 归档任务的只读详情（v108）。归档行里已经有完成时间/优先级/标签/截止，
     唯独备注全文没地方放——这里补上，其余字段也一并列清楚，免得还要去恢复才能看。 */
  function taskArchViewModal(id) {
    const t = (state.tasks || []).find(function (x) { return x && x.id === id; });
    if (!t) return;
    const note = String(t.note || '').trim();
    const rows = [];
    const push = function (k, v) { if (v) rows.push([k, v]); };
    push('优先级', t.priority || '中');
    push('标签', t.tag || '');
    push('截止日期', t.due ? cnDate(t.due) : '');
    push('完成时间', t.doneAt ? cnDate(t.doneAt) : '');
    push('创建时间', t.createdAt ? cnDate(t.createdAt) : '');
    push('归档时间', t.archivedAt ? cnDate(t.archivedAt) : '');
    if (t.repeat && t.repeat !== 'none') {
      const cn = { daily: '每天', weekly: '每周', monthly: '每月' }[t.repeat] || '';
      push('重复', cn + (t.repeatTime ? ' · ' + t.repeatTime : ''));
    }
    if (t.startTime) push('时间块', t.startTime + (t.duration ? ' · ' + t.duration + ' 分钟' : ''));
    push('提醒', t.notify === false ? '已关闭' : (t.notifyTime || '09:00'));
    openModal('' +
      '<div class="modal-card task-view">' +
        '<h3>任务详情 <span class="muted-sm">已归档</span></h3>' +
        '<div class="tv-title">' + esc(t.title || '(未命名任务)') + '</div>' +
        '<div class="tv-note' + (note ? '' : ' empty') + '">' +
          (note ? esc(note) : '没有备注') +
        '</div>' +
        (rows.length
          ? '<dl class="tv-meta">' + rows.map(function (r) {
              return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>';
            }).join('') + '</dl>'
          : '') +
        '<div class="modal-actions"><span class="spacer"></span>' +
          '<button type="button" class="btn ghost" data-act="close-modal">关闭</button>' +
        '</div>' +
      '</div>');
  }

  function bindBoard() {
    $$('.task').forEach(card => {
      card.addEventListener('dragstart', e => {
        dragId = card.dataset.id;
        card.classList.add('dragging');
        document.body.classList.add('is-dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
        }
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragId = null;
        document.body.classList.remove('is-dragging');
        const z = $('.arch-zone');
        if (z) z.classList.remove('is-over');
        clearDropMarks();
      });
      /* v127：单击直接开编辑弹窗。原来要双击展开内联详情、再点铅笔编辑，两步；
         备注、子任务、时间都已经在弹窗里，内联详情没有独占内容了。 */
      card.addEventListener('click', e => {
        if (e.target.closest('button')) return;
        if (dragId) return;
        const id = card.dataset.id;
        const item = state.tasks.find(x => x.id === id);
        if (item) taskModal(item);
      });
      card.addEventListener('dragover', e => {
        if (!dragId) return;
        e.preventDefault();
        e.stopPropagation();
        clearDropMarks();
        const rect = card.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        card.classList.add(after ? 'drop-after' : 'drop-before');
      });
      card.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if (!id) return;
        const after = card.classList.contains('drop-after');
        clearDropMarks();
        reorderTask(id, card.closest('.col').dataset.status, card.dataset.id, after);
      });
    });

    const zone = $('.arch-zone');
    if (zone) {
      zone.addEventListener('dragover', e => {
        if (!dragId) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        zone.classList.add('is-over');
      });
      zone.addEventListener('dragleave', e => {
        if (e.relatedTarget && zone.contains(e.relatedTarget)) return;
        zone.classList.remove('is-over');
      });
      zone.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove('is-over');
        const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if (id) {
          archDropAt = Date.now();
          archiveTask(id);
        }
      });
      zone.addEventListener('click', () => {
        if (Date.now() - archDropAt < 500) return;
        archiveModal();
      });
    }

    $$('.col-body').forEach(body => {
      body.addEventListener('dragover', e => { if (dragId) e.preventDefault(); });
      body.addEventListener('drop', e => {
        if (!dragId) return;
        e.preventDefault();
        const status = body.closest('.col').dataset.status;
        clearDropMarks();
        reorderTask(dragId, status, null, false);
      });
    });
  }

  function reorderTask(id, status, beforeId, after) {
    if (!id || id === beforeId) return;
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx < 0) return;
    const task = state.tasks[idx];
    const changed = task.status !== status;
    const wasDone = task.status === 'done';
    state.tasks.splice(idx, 1);
    if (changed) task.prevStatus = task.status;
    task.status = status;
    if (status === 'done') {
      if (!task.doneAt || changed) task.doneAt = todayStr();
      if (changed && !wasDone) completeRecurringTask(task, task.doneAt);
    } else {
      task.doneAt = null;
      if (changed && wasDone) uncompleteRecurringTask(task);
    }
    let insertAt = state.tasks.length;
    if (beforeId) {
      const ti = state.tasks.findIndex(t => t.id === beforeId);
      if (ti >= 0) insertAt = after ? ti + 1 : ti;
    }
    state.tasks.splice(insertAt, 0, task);
    save();
    render();
    if (changed && status === 'done') toast('完成 ✓');
  }

  let breathingTimer = null;
  let breathingPhaseTimer = null;

  function stopBreathing() {
    if (breathingTimer) { clearInterval(breathingTimer); breathingTimer = null; }
    if (breathingPhaseTimer) { clearTimeout(breathingPhaseTimer); breathingPhaseTimer = null; }
  }

  function openBreathingModal() {
    stopBreathing();
    const hb = moduleAsHabit('breathe');
    const n = Math.max(1, Math.min(8, Number(hb && hb.breatheCycles) || 4));
    openModal('' +
      '<div class="modal-card breathing-modal" id="breathing-modal">' +
        '<h3>4-7-8 呼吸</h3>' +
        '<p class="hint" style="margin:0 0 10px">跟着圆圈：吸气 4 秒 → 屏息 7 秒 → 呼气 8 秒，共 ' + n + ' 次循环。</p>' +
        '<div class="breathing-stage">' +
          '<div class="breathing-orb" id="breathing-orb"></div>' +
        '</div>' +
        '<div class="breathing-phase" id="breathing-phase">准备好就开始</div>' +
        '<div class="breathing-timer" id="breathing-timer"></div>' +
        '<p class="breathing-note">跑满 ' + n + ' 次循环（约 ' + fmtDur(n * 19) + '）才记一组；中途关闭不记录。</p>' +
        '<div class="modal-actions">' +
          '<span class="spacer"></span>' +
          '<button type="button" class="btn ghost" data-act="close-modal">关闭</button>' +

        '</div>' +
      '</div>');
  }

  function breathingStart() {
    if (!$('#breathing-modal')) {
      openBreathingModal();
      return;
    }
    stopBreathing();
    const orb = $('#breathing-orb');
    const phase = $('#breathing-phase');
    const timer = $('#breathing-timer');
    const btn = $('#breathing-start-btn');
    if (!orb || !phase || !timer) return;
    const hb = moduleAsHabit('breathe');
    const totalCycles = Math.max(1, Math.min(8, Number(hb && hb.breatheCycles) || 4));
    if (btn) {
      btn.textContent = '进行中';
      btn.disabled = true;
    }
    const phases = [
      { key: 'inhale', label: '吸气', seconds: 4 },
      { key: 'hold', label: '屏息', seconds: 7 },
      { key: 'exhale', label: '呼气', seconds: 8 }
    ];
    let index = 0;
    let cycle = 1;
    const showTimer = left => {
      timer.textContent = '第 ' + cycle + ' / ' + totalCycles + ' 次 · ' + Math.max(0, left) + ' 秒';
    };

    const finish = () => {
      orb.className = 'breathing-orb done';
      phase.textContent = '完成 · ' + totalCycles + ' 次循环';
      timer.textContent = '这一组记下了';
      if (btn) {
        btn.textContent = '再来一组';
        btn.disabled = false;
      }
      const h = moduleAsHabit('breathe');
      if (h) {
        logHabit(h.id, 1);
        setCount(selectedDate, h.id, countOf(selectedDate, h.id) + 1);
        render();
        toast('478 呼吸 · 一组完成');
      }
    };

    const run = () => {
      if (!$('#breathing-modal')) return;
      const p = phases[index];
      if (index === 0) {
        orb.className = 'breathing-orb';
        void orb.offsetWidth;
      }
      orb.className = 'breathing-orb ' + p.key;
      phase.textContent = p.label;
      let left = p.seconds;
      showTimer(left);
      breathingTimer = setInterval(() => {
        left--;
        showTimer(left);
        if (left <= 0) {
          clearInterval(breathingTimer);
          breathingTimer = null;
          index++;
          if (index >= phases.length) {
            index = 0;
            cycle++;
            if (cycle > totalCycles) { finish(); return; }
          }
          breathingPhaseTimer = setTimeout(run, 250);
        }
      }, 1000);
    };

    run();
  }

  /* 打开弹窗前后的焦点归属：关闭时归还，键盘用户不丢位置 */

  function openModal(html) {

    bindHabitForm();

    const first = root.querySelector('input:not([type="hidden"]), textarea, select');
    if (first) setTimeout(() => { try { first.focus(); } catch (e) {} }, 40);
  }
  function closeModal() {
    /* v197：待填数据的弹窗必须二选一 —— ESC / 点遮罩都不许直接关。
       关掉后那条记录留在 pending，而补数据入口只查近几天、卡片只查今天，
       跨天之后它就再没有任何入口能处理了。 */
    const mustEl = $('#modal-root [data-must-settle="1"]');
    if (mustEl) {
      const rid = mustEl.getAttribute('data-rec') || '';
      const stillPending = moveRecords().some(function (r) {
        return r && r.id === rid && r.pending && !r.skipped;
      });
      if (stillPending) {
        toast('先填数据，或选「跳过不记录」');
        return;
      }
    }
    stopBreathing();
    $('#modal-root').innerHTML = '';
    document.body.classList.remove('modal-open');
    const back = modalTrigger;
    modalTrigger = null;
    if (back && document.contains(back)) {
      try { back.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  function bindTaskForm() {
    const form = $('#task-form');
    if (!form) return;
    const repeat = form.querySelector('[name="repeat"]');
    if (!repeat) return;
    const sync = () => {
      form.querySelectorAll('[data-repeat-field]').forEach(field => {
        const kind = field.dataset.repeatFor || '';
        const show = kind === 'time'
          ? repeat.value !== 'none'
          : kind === repeat.value;
        field.style.display = show ? '' : 'none';
      });
    };
    repeat.addEventListener('change', sync);
    sync();
    /* 填了「开始时间」但没手动动过通知时间时，通知时间自动跟着走：
       下午的事不会在早上 9 点响，同时保留了手动提前提醒的余地
       （一旦手动改过通知时间，就不再自动同步）。 */
    const stEl = form.querySelector('[name="startTime"]');
    const ntEl = form.querySelector('[name="notifyTime"]');
    if (stEl && ntEl) {
      let touched = false;
      ntEl.addEventListener('input', () => { touched = true; });
      stEl.addEventListener('input', () => {
        if (touched || !stEl.value) return;
        ntEl.value = stEl.value;
      });
    }
  }

  function bindHabitForm() {
    const form = $('#habit-form');
    if (!form) return;
    const type = form.querySelector('[name="type"]');
    const target = form.querySelector('[name="target"]');
    if (!type || !target) return;
    const sync = () => {
      const tv = type.value;
      const isQuitT = tv === 'quit' || tv === 'smoke';
      const isSmokeType = tv === 'smoke';
      if (isQuitT) {
        target.disabled = true;
        target.value = '1';
      } else {
        target.disabled = false;
        if (!target.value || Number(target.value) < 1) target.value = '1';
      }
      /* 戒除专属区（开始日期 + 烟字段）只在「戒除 / 戒烟」时出现 */
      form.querySelectorAll('[data-quit-only]').forEach(el => { el.hidden = !isQuitT; });
      /* 烟专属字段（每天几支 / 烟价 / 一包几支）只在戒烟时出现。
         「不熬夜」出现「一包多少钱」会让人莫名其妙。 */
      form.querySelectorAll('[data-smoke-only]').forEach(el => { el.hidden = !isSmokeType; });
      /* 「打卡方式」只给通用戒除：戒烟走双按钮，不适用单次/多次 */
      form.querySelectorAll('[data-quit-plain]').forEach(el => { el.hidden = tv !== 'quit'; });
      /* 提示文案按「戒烟 / 单次戒除 / 多次戒除」三选一，切下拉时要跟着变 */
      const slipSel = form.querySelector('[name="slipMode"]');
      const isMulti = tv === 'quit' && !!slipSel && slipSel.value === 'multi';
      form.querySelectorAll('[data-quit-hint]').forEach(el => {
        const kind = el.dataset.quitHint;
        if (kind === 'smoke') { el.hidden = !isSmokeType; return; }
        if (tv !== 'quit') { el.hidden = true; return; }
        el.hidden = (el.dataset.slip || 'once') !== (isMulti ? 'multi' : 'once');
      });
      /* 「目标次数 / 单位」对戒除没意义，disabled 留着只会让人以为坏了 */
      ['target', 'unit'].forEach(function (nm) {
        const el = form.querySelector('[name="' + nm + '"]');
        const f = el && el.closest('.field');
        if (f) f.hidden = isQuitT;
      });
    };
    type.addEventListener('change', sync);
    /* 只改「打卡方式」不改类型时，提示文案也要跟着换 */
    const slipPicker = form.querySelector('[name="slipMode"]');
    if (slipPicker) slipPicker.addEventListener('change', sync);
    sync();
    /* 通知频率联动：weekly 显示「每周几」，monthly 显示「每月几号」 */
    const freq = form.querySelector('[name="notifyFreq"]');
    if (freq) {
      const syncFreq = () => {
        form.querySelectorAll('[data-habit-freq]').forEach(field => {
          const kind = field.dataset.habitFor || '';
          field.style.display = kind === freq.value ? '' : 'none';
        });
      };
      freq.addEventListener('change', syncFreq);
      syncFreq();
    }
  }

  /* ===== 子任务（v127）=====
     存在 task.subtasks 里：[{id, title, done}]。父任务的状态和截止日期**不跟着子任务自动变**，
     只做进度展示——自动改状态会让人意外（勾完四个子任务，主任务突然消失）。 */
  function taskSubs(t) {
    const arr = t && Array.isArray(t.subtasks) ? t.subtasks : [];
    return arr.filter(function (x) { return x && typeof x === 'object'; });
  }

  function taskSubsHtml(t) {
    return taskSubs(t).map(function (x) {
      return '<div class="tk-sub' + (x.done ? ' done' : '') + '" data-sid="' + esc(x.id || '') + '">' +
        '<input type="checkbox"' + (x.done ? ' checked' : '') + '>' +
        '<span>' + esc(x.title || '') + '</span>' +
        '<button type="button" class="tk-sub-del" aria-label="删除子任务">✕</button>' +
        '</div>';
    }).join('');
  }

  /* 折叠区里有内容就默认展开，否则用户会以为没设过 */
  function taskFoldOpen(t) {
    if (!t) return false;
    if (t.startTime || Number(t.duration) > 0) return true;
    if (t.repeat && t.repeat !== 'none') return true;
    if (t.notify === false || (t.notifyNote || '') !== '') return true;
    return false;
  }

  function taskSubCount(form) {
    const box = form.querySelector('[data-sub-count]');
    if (!box) return;
    const rows = form.querySelectorAll('.tk-sub');
    let done = 0;
    rows.forEach(function (r) {
      const cb = r.querySelector('input');
      if (cb && cb.checked) done++;
    });
    box.textContent = done + '/' + rows.length;
  }

  function bindTaskSubs(form) {
    if (!form) return;
    const list = form.querySelector('[data-sub-list]');
    const input = form.querySelector('[data-sub-input]');
    if (!list || !input) return;
    const refresh = function () {
      list.querySelectorAll('.tk-sub').forEach(function (row) {
        const cb = row.querySelector('input');
        if (cb) {
          cb.onchange = function () {
            row.classList.toggle('done', cb.checked);
            taskSubCount(form);
          };
        }
        const del = row.querySelector('.tk-sub-del');
        if (del) {
          del.onclick = function () {
            row.remove();
            taskSubCount(form);
          };
        }
      });
      taskSubCount(form);
    };
    input.onkeydown = function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      const div = document.createElement('div');
      div.className = 'tk-sub';
      div.setAttribute('data-sid', '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      const sp = document.createElement('span');
      sp.textContent = v;
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'tk-sub-del';
      del.setAttribute('aria-label', '删除子任务');
      del.textContent = '✕';
      div.appendChild(cb);
      div.appendChild(sp);
      div.appendChild(del);
      list.appendChild(div);
      input.value = '';
      refresh();
    };
    refresh();
  }

  /* ===== 小习惯 2.0：表单里的节奏草稿 =====
     打开弹窗时从 h.sched 拷贝，保存时整体写回。
     schedDraft 只在弹窗里，不进 state，半截选择不会被读到。 */
  let schedDraft = null;

  function schedRender() {
    /* 从 daily 切到别的节奏时，参数字段还不存在——在这里补齐默认值，
       否则 schedDraft.days.indexOf 会直接报错 */
    if (schedDraft) {
      if (schedDraft.kind === 'weekdays') {
        if (!Array.isArray(schedDraft.days)) schedDraft.days = [1, 3, 5];
        /* 全取消时界面不能全空——回落周一三五，保存时 schedOf 也会归一化 */
        if (!schedDraft.days.length) schedDraft.days = [1, 3, 5];
      }
      if (schedDraft.kind === 'weekly' && !schedDraft.perWeek) schedDraft.perWeek = 3;
      if (schedDraft.kind === 'interval' && !schedDraft.intervalDays) schedDraft.intervalDays = 3;
    }
    const root = document.getElementById('schedKind');
    if (!root || !schedDraft) return;
    root.querySelectorAll('[data-sched]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.sched === schedDraft.kind);
    });
    /* 批 5：戒除类禁选 weekly/interval（置灰）；目标次数决定每日时间行数 */
    const tSel = document.querySelector('#habit-form [name="type"]');
    const isQuitType = tSel && tSel.value === 'quit';
    root.querySelectorAll('[data-sched]').forEach(function (b) {
      const banned = isQuitType && (b.dataset.sched === 'weekly' || b.dataset.sched === 'interval');
      b.disabled = banned;
      b.style.opacity = banned ? '.45' : '';
      if (banned) b.classList.remove('on');
    });
    const tgtEl = document.querySelector('#habit-form [name="target"]');
    const tgt = Math.max(1, Number(tgtEl && tgtEl.value) || 1);
    /* 时间行工具：arr 与 target 对齐（不足补 07:00，超出裁掉） */
    const alignTimes = function (arr) {
      const a = (Array.isArray(arr) && arr.length ? arr : ['07:00']).slice(0, tgt);
      while (a.length < tgt) a.push('07:00');
      return a;
    };
    const timeRows = function (arr, attr) {
      return alignTimes(arr).map(function (t, i) {
        return '<input type="time" value="' + t + '" data-' + attr + '="' + i + '" style="margin-bottom:6px">';
      }).join('');
    };
    const chRows = function () {
      const cur = (Array.isArray(schedDraft.channels) && schedDraft.channels.length)
        ? schedDraft.channels : ['wecom', 'browser'];
      return [['wecom', '企业微信'], ['mail', '邮件'], ['browser', '浏览器']].map(function (c) {
        return '<label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px">' +
          '<input type="checkbox" data-channel="' + c[0] + '"' +
          (cur.indexOf(c[0]) >= 0 ? ' checked' : '') + '> ' + c[1] + '</label>';
      }).join('') +
      '<p style="font-size:11px;color:var(--muted);margin:4px 0 0">与通知路由的板块开关取交集——两边都开才会发</p>';
    };
    /* 2A 拆分：参数 → schedExtra（内嵌块）；渠道 + 时间 → notifyExtra（提醒区） */
    const ex = document.getElementById('schedExtra');
    const nx = document.getElementById('notifyExtra');
    if (!ex || !nx) return;
    let param = '';
    if (schedDraft.kind === 'weekdays') {
      param += '<div class="field" style="margin-bottom:0"><span>哪几天（可多选）</span><div class="sched-days">' +
        ['一', '二', '三', '四', '五', '六', '日'].map(function (w, i) {
          const real = (i + 1) % 7;
          return '<button type="button" data-day="' + real + '" class="' +
            (schedDraft.days.indexOf(real) >= 0 ? 'on' : '') + '">周' + w + '</button>';
        }).join('') + '</div></div>';
    } else if (schedDraft.kind === 'weekly') {
      param += '<div class="field" style="margin-bottom:0;max-width:220px"><span>每周几次</span><div class="sched-num">' +
        '<input type="number" min="1" max="7" data-sw="perWeek" value="' + schedDraft.perWeek + '"> 次 / 周</div></div>';
    } else if (schedDraft.kind === 'interval') {
      param += '<div class="field" style="margin-bottom:0;max-width:220px"><span>间隔天数</span><div class="sched-num">每 ' +
        '<input type="number" min="2" max="60" data-sw="intervalDays" value="' + schedDraft.intervalDays + '"> 天一次</div></div>';
    }
    ex.innerHTML = param;
    ex.style.display = param ? '' : 'none';   /* daily 无参数，隐藏空盒子 */
    /* 提醒区：渠道 + 时间矩阵（按节奏适配） */
    let body = '<div class="field"><span>通知渠道</span><div>' + chRows() + '</div></div>';
    if (schedDraft.kind === 'weekdays') {
      /* 每个选中日各配各的时间（口径已锁：选中日 × 当日次数） */
      const wdParts = schedDraft.days.slice().sort(function (a, b) { return a - b; }).map(function (d) {
        if (!schedDraft.timesWd) schedDraft.timesWd = {};
        if (!Array.isArray(schedDraft.timesWd[String(d)])) schedDraft.timesWd[String(d)] = ['07:00'];
        return '<div class="field"><span>周' + ['日', '一', '二', '三', '四', '五', '六'][d] +
          ' · ' + tgt + ' 次提醒</span>' + timeRows(schedDraft.timesWd[String(d)], 'wtime-' + d) + '</div>';
      }).join('');
      body += wdParts;
    } else if (schedDraft.kind === 'weekly') {
      body += '<div class="hint" style="background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px">每周 N 次不单独设提醒——哪天做都行，未完成会进<b>每日日报</b>汇总。上方渠道与备注仍保留。</div>';
    } else if (schedDraft.kind === 'interval') {
      body += '<div class="field"><span>本轮要求日的提醒时间</span>' +
        timeRows([schedDraft.timesInterval || '09:00'], 'itime') + '</div>';
    } else {
      const n = Math.max(1, tgt);
      if (!Array.isArray(schedDraft.timesDaily) || !schedDraft.timesDaily.length) schedDraft.timesDaily = ['07:00'];
      body += '<div class="field"><span>提醒时间（每天 ' + n + ' 次）</span>' +
        timeRows(schedDraft.timesDaily, 'dtime') + '</div>';
    }
    nx.innerHTML = body;
  }

  /* 节奏表单的事件全部走 document 级委托：schedRender 每次重建 innerHTML，
     若在重建里反复 addEventListener，同一个按钮会叠上多层 handler，
     点一次触发 N 次， toggle 就会被偶数次执行而"看起来没反应"。 */
  document.addEventListener('click', function (e) {
    const pick = e.target.closest('#schedKind [data-sched]');
    if (pick && schedDraft) {
      const k = pick.dataset.sched;
      /* 批 5 约束：戒除类不支持每周 N 次 / 每隔 N 天（弹性配额的戒除没有意义） */
      const tSel = document.querySelector('#habit-form [name="type"]');
      if (tSel && tSel.value === 'quit' && (k === 'weekly' || k === 'interval')) {
        toast('戒除类不支持「' + pick.textContent.trim() + '」，请选每天或每周固定几天');
        return;
      }
      schedDraft.kind = k;
      /* 默认时间行：daily→1 行（多目标=target 行）；weekdays→每选中日 target 行 */
      if (k === 'daily' && !Array.isArray(schedDraft.timesDaily)) {
        schedDraft.timesDaily = ['07:00'];
      }
      if (k === 'weekdays' && !schedDraft.timesWd) schedDraft.timesWd = {};
      if (k === 'interval' && !schedDraft.timesInterval) schedDraft.timesInterval = '09:00';
      schedRender();
      return;
    }
    const day = e.target.closest('#schedExtra [data-day]');
    if (day && schedDraft) {
      const d = Number(day.dataset.day), k = schedDraft.days.indexOf(d);
      if (k >= 0) schedDraft.days.splice(k, 1); else schedDraft.days.push(d);
      schedRender();
    }
  });
  /* 开关是「点击」不是「输入」：单独 click 委托（habit/task 通用，批 6 补） */
  document.addEventListener('click', function (e) {
    const swT = e.target.closest('[data-role="notify-switch"]');
    if (swT) { swT.classList.toggle('on'); swT.setAttribute('aria-checked', swT.classList.contains('on')); }
  });
  document.addEventListener('input', function (e) {
    /* 目标次数变化 → 时间行数联动（多目标 N 行的行数跟着走） */
    if (e.target.closest('#habit-form') && e.target.name === 'target' && schedDraft) {
      schedRender();
      return;
    }
    const sw = e.target.closest('#schedExtra [data-sw]');
    if (sw && schedDraft) {
      const v = Number(sw.value) || 0;
      if (sw.dataset.sw === 'perWeek') schedDraft.perWeek = Math.max(1, Math.min(7, v || 3));
      if (sw.dataset.sw === 'intervalDays') schedDraft.intervalDays = Math.max(2, Math.min(60, v || 3));
      return;
    }
    /* 批 5：时间矩阵与渠道的编辑（全部走委托，重建不丢） */
    const t = e.target.closest('#notifyExtra [data-dtime],#notifyExtra [data-wtime],#notifyExtra [data-itime],#notifyExtra [data-channel]');
    if (!t || !schedDraft) return;
    if (t.dataset.channel) {
      schedDraft.channels = schedDraft.channels || [];
      const c = t.dataset.channel;
      const k = schedDraft.channels.indexOf(c);
      if (t.checked && k < 0) schedDraft.channels.push(c);
      if (!t.checked && k >= 0) schedDraft.channels.splice(k, 1);
      return;
    }
    if (t.dataset.dtime !== undefined) {
      schedDraft.timesDaily = schedDraft.timesDaily || [];
      schedDraft.timesDaily[Number(t.dataset.dtime)] = t.value;
    } else if (t.dataset.itime !== undefined) {
      schedDraft.timesInterval = t.value;
    } else if (t.dataset.wtime) {
      const d = String(t.dataset.wtime);
      schedDraft.timesWd = schedDraft.timesWd || {};
      schedDraft.timesWd[d] = schedDraft.timesWd[d] || [];
      schedDraft.timesWd[d][Number(t.dataset.wtime)] = t.value;
    }
  });

    const np = (h && h.notifyPlan && typeof h.notifyPlan === 'object') ? h.notifyPlan : null;

      if (np.intervalTime) schedDraft.timesInterval = String(np.intervalTime);

    }
    schedRender();
  }

  function bindMedForm() {
    const form = $('#med-form');
    if (!form) return;
    const course = form.querySelector('[name="courseType"]');
    const countSel = form.querySelector('[name="doseTimes"]');
    const slots = form.querySelector('#time-slots');
    const formSel = form.querySelector('[name="form"]');
    const unitSel = form.querySelector('[name="doseUnit"]');
    if (!course) return;
    const syncUnit = () => {
      if (!formSel || !unitSel) return;
      const v = formSel.value;
      if (Array.prototype.some.call(unitSel.options, o => o.value === v)) unitSel.value = v;
    };
    const readSlots = () => {
      if (!slots) return [];
      return Array.prototype.map.call(slots.querySelectorAll('input'), el => el.value);
    };
    const renderSlots = (n, keep) => {
      if (!slots) return;
      slots.innerHTML = timeSlotsHtml(keep ? readSlots() : [], n);
    };
    const mealSel = form.querySelector('[name="mealTiming"]');
    const offSel = form.querySelector('[name="mealOffset"]');
    const syncTiming = () => {
      const prn = course.value === 'prn';
      const hasMeal = !!mealSel && (mealSel.value === 'before' || mealSel.value === 'after');
      const custom = hasMeal && !!offSel && offSel.value === 'custom';
      form.querySelectorAll('[data-timing]').forEach(el => {
        let show = !prn;
        if (show && el.hasAttribute('data-off')) show = hasMeal;
        if (show && el.hasAttribute('data-off-custom')) show = custom;
        el.style.display = show ? '' : 'none';
      });
    };
    const onMealChange = () => {
      syncTiming();
      const offCustom = form.querySelector('[data-off-custom]');
      if (offCustom && offCustom.style.display !== 'none' && offSel && offSel.value === 'custom') {
        const inp = offCustom.querySelector('input');

  function saveTaskForm(form) {
    const id = form.dataset.id || '';
    const get = n => {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const title = get('title');
    if (!title) return;
    const repeatTimeRaw = get('repeatTime');
    const repeatTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(repeatTimeRaw) ? repeatTimeRaw : '20:00';
    const notifyTimeRaw = get('notifyTime');
    const notifyTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(notifyTimeRaw) ? notifyTimeRaw : '09:00';
    const startTimeRaw = get('startTime');
    const startTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(startTimeRaw) ? startTimeRaw : '';
    const durRaw = parseInt(get('duration'), 10);
    const duration = (Number.isFinite(durRaw) && durRaw >= 15 && durRaw <= 720)
      ? Math.round(durRaw / 15) * 15 : 0;
    const repeatRaw = get('repeat');
    const repeat = ['daily', 'weekly', 'monthly'].indexOf(repeatRaw) >= 0 ? repeatRaw : 'none';
    const due = get('due') || (repeat !== 'none' ? todayStr() : '');
    const dueD = due && /^\d{4}-\d{2}-\d{2}$/.test(due) ? parseD(due) : new Date();
    const wdVal = parseInt(get('repeatWeekday'), 10);
    const rdVal = parseInt(get('repeatDay'), 10);
    const repeatWeekday = Number.isFinite(wdVal) ? clamp(wdVal, 0, 6) : dueD.getDay();
    const repeatDay = Number.isFinite(rdVal) ? clamp(rdVal, 1, 31) : dueD.getDate();
    /* 子任务从 DOM 收：新增的行没有 id，这里补一个；保存时整组替换 */
    const subRows = Array.from(form.querySelectorAll('.tk-sub')).map(function (row, i) {
      const cb = row.querySelector('input');
      const sp = row.querySelector('span');
      return {
        id: row.getAttribute('data-sid') || ('sub_' + Date.now().toString(36) + '_' + i),
        title: (sp ? sp.textContent : '').trim(),
        done: !!(cb && cb.checked)
      };
    }).filter(function (x) { return x.title !== ''; });

    const payload = {
      title: title,
      note: get('note'),
      subtasks: subRows,
      status: get('status') || 'todo',
      tag: get('tag') || '其他',
      priority: get('priority') || '中',
      due: due,
      repeat: repeat,
      repeatTime: repeatTime,
      repeatWeekday: repeatWeekday,
      repeatDay: repeatDay,
      notify: (function () {
        const sw = document.querySelector('#task-form [data-role="notify-switch"]');
        return sw ? sw.classList.contains('on') : true;
      })(),
      notifyPlan: (function () {
        const form = document.getElementById('task-form');
        const cs = form ? [...form.querySelectorAll('[data-channel]')].filter(c => c.checked).map(c => c.dataset.channel) : [];
        return cs.length ? { channels: cs } : undefined;
      })(),
      notifyTime: notifyTime,
      notifyNote: get('notifyNote'),
      startTime: startTime,
      duration: duration
    };
    if (id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        const wasDone = t.status === 'done';
        if (!wasDone && payload.status === 'done') t.prevStatus = t.status;
        Object.assign(t, payload);
        if (payload.status === 'done' && !wasDone) {
          t.doneAt = todayStr();
          completeRecurringTask(t, t.doneAt);
        }
        if (payload.status !== 'done' && wasDone) {
          t.doneAt = null;
          uncompleteRecurringTask(t);
        }
        if (payload.status !== 'done') t.doneAt = null;
      }
    } else {
      const t = Object.assign({ id: uid(), createdAt: new Date().toISOString(), doneAt: null, repeatNextId: '', repeatFrom: '' }, payload);
      if (t.status === 'done') {
        t.doneAt = todayStr();
        completeRecurringTask(t, t.doneAt);
      }
      state.tasks.unshift(t);
    }
    save();
    closeModal();
    render();
    toast(id ? '任务已更新' : '任务已创建');
  }

  function saveHabitForm(form) {
    const id = form.dataset.id || '';    const get = n => {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    const rawType = get('type');
    const type = (rawType === 'quit' || rawType === 'smoke') ? rawType : 'build';
    const payload = {
      name: get('name'),
      icon: get('icon') || '✅',
      type: type,
      /* 批 5：戒除类 target 不再强制 1——它只决定通知时间行数（每日多次戒除需要 N 行），
         met 的戒除语义（有无失守）不读 target，行为不受影响（BUG-① 复现测试护航） */
      target: clamp(parseInt(get('target'), 10) || 1, 1, 99),
      unit: get('unit') || '次',
      /* 截止时刻：类型不是保持、或目标 >1 时一律存空，避免出现无意义的组合 */
      deadline: '',
      color: get('color') || '#2f6f5e',
      note: get('note'),
      /* 2A：总开关读「开启提醒」开关（旧下拉已删）；无开关（异常态）回落 true */
      notify: form.querySelector('[data-role="notify-switch"]')
        ? form.querySelector('[data-role="notify-switch"]').classList.contains('on') : true,
      notifyNote: get('notifyNote')
    };
    /* 小习惯 2.0：写回节奏草稿 + 更新时间戳（多端合并按它判新旧） */
    if (document.getElementById('schedKind')) {
      payload.sched = schedDraft || { kind: 'daily' };
      /* 批 5：通知计划——按节奏取对应时间矩阵，行数与目标次数对齐 */
      if (schedDraft) {
        const tEl = document.querySelector('#habit-form [name="target"]');
        const tgt = Math.max(1, Number(tEl && tEl.value) || 1);
        const align = function (a) {
          const x = (Array.isArray(a) && a.length ? a : ['07:00'])
            .slice(0, tgt).filter(t => /^\d{2}:\d{2}$/.test(String(t)));
          while (x.length < tgt) x.push('07:00');
          return x;
        };
        const np = { channels: (Array.isArray(schedDraft.channels) && schedDraft.channels.length)
          ? schedDraft.channels.slice() : ['wecom', 'browser'] };
        if (schedDraft.kind === 'daily') np.daily = align(schedDraft.timesDaily);
        if (schedDraft.kind === 'weekdays') {
          const wd = {};
          (schedDraft.days || []).forEach(function (d) {
            wd[String(d)] = align((schedDraft.timesWd || {})[String(d)]);
          });
          np.wd = wd;
        }
        if (schedDraft.kind === 'interval') {
          np.intervalTime = /^\d{2}:\d{2}$/.test(String(schedDraft.timesInterval || ''))
            ? schedDraft.timesInterval : '09:00';
        }
        payload.notifyPlan = np;
      }
      payload.updatedAt = Date.now();
    }
    if (type === 'quit' || type === 'smoke') {
      const qs = get('quitStart');
      payload.quitStart = /^\d{4}-\d{2}-\d{2}$/.test(qs) ? qs : '';
      /* 打卡方式只对通用戒除有意义；戒烟是两个按钮 + 烟盒，没有「单次/多次」之分。
         缺省写 'once' 而不是留空，避免 mergeStates 并集时一端有值一端没有、
         合并后变成 undefined（那就退回单次了）。 */
      payload.slipMode = (type === 'quit' && get('slipMode') === 'multi') ? 'multi' : 'once';
      if (type === 'smoke') {
        payload.quitPerDay = clamp(parseInt(get('quitPerDay'), 10) || 0, 0, 100);
        payload.quitPackPrice = Math.max(0, Math.min(9999, Number(get('quitPackPrice')) || 0));
        payload.quitPackSize = clamp(parseInt(get('quitPackSize'), 10) || 20, 1, 50);
      } else {
        /* 通用戒除不抽烟，把烟字段清零——留着会让省钱折算去算一个不存在的烟 */
        payload.quitPerDay = 0;
        payload.quitPackPrice = 0;
        payload.quitPackSize = 0;
      }
    }
    const dl = get('deadline');
    payload.deadline = (type === 'build' && payload.target <= 1
      && /^([01]\d|2[0-3]):[0-5]\d$/.test(dl)) ? dl : '';
    const st = get('suggestTime');
    payload.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(st) ? st : '15:00';
    if (form.querySelector('[name="breatheCycles"]')) {
      payload.breatheCycles = clamp(parseInt(get('breatheCycles'), 10) || 4, 1, 8);
    }
    if (!payload.name) return;
    if (id) {
      const h = currentHabit(id);
      /* 小习惯 2.0：节奏变了要先说一声——历史不回算（Q4 拍板） */
      if (h && document.getElementById('schedKind') && schedDraft &&
          schedOf(h).kind !== schedDraft.kind) {
        if (!confirm('修改节奏只影响本周及以后，历史打卡按原规则保留。确定吗？')) return;
      }
      if (h) Object.assign(h, payload);
    } else {
      payload.id = 'h_' + uid();
      payload.createdAt = new Date().toISOString();
      state.habits.push(payload);
    }
    save();
    closeModal();
    render();
    toast(id ? '习惯已更新' : '习惯已添加');
  }

  /* ============================================================
     健康模块设置表单（v170）。没有「类型」字段——退化问题从根上消失。
     water：总量/每次/杯数 三值联动；move：每天几次；breathe：每天几组+每组循环；

        '<label class="field"><span>一包几支</span><input name="packSize" type="number" min="1" max="50" value="' + (Number(m.packSize) || 20) + '"></label>';

        '<label class="field"><span>每天几次</span><input name="times" type="number" min="1" max="99" value="' + (Number(m.times) || 1) + '"></label>';

    /* v194：478 的图标 / 名称 / 颜色 / 备注由系统固定，这个弹窗里不给入口 */

    openModal(

        '<h3>设置 · ' + esc(label) + '</h3>' +

          (locked
            ? '<p class="hint" style="grid-column:1/-1">🔒 图标、名称、颜色与备注由系统固定，不可修改</p>'
            : '<label class="field"><span>图标（emoji）</span><input name="icon" maxlength="4" value="' + esc(m.icon || '') + '" placeholder="💧"></label>' +

  function bindModuleForm() {
    const form = $('#module-form');
    if (!form) return;
    if (form.dataset.key !== 'water') return;
    const g = form.querySelector('[name="goalMl"]');
    const p = form.querySelector('[name="perMl"]');
    const c = form.querySelector('[name="cups"]');
    const hint = $('#water-link-hint');
    if (!g || !p || !c) return;
    const num = function (el, lo, hi) {
      return Math.max(lo, Math.min(hi, Math.round(Number(el.value) || 0)));
    };
    const syncHint = function () {
      const goal = num(g, 200, 8000);
      const per = num(p, 50, 1000);
      const cups = num(c, 1, 24);
      const lastMl = Math.max(0, goal - (cups - 1) * per);
      if (hint) hint.innerHTML = '每天 <b>' + cups + '</b> 杯 · 每杯 <b>' + per + '</b> ml · 最后一杯 <b>' + lastMl + '</b> ml';
    };
    /* 改总量或每次 → 杯数自动重算；改杯数 → 总量倒推。初始只显示不重算，保留既有 9 杯/2300ml 这类非整倍配置。 */
    g.addEventListener('input', function () { c.value = Math.max(1, Math.ceil(num(g, 200, 8000) / num(p, 50, 1000))); syncHint(); });
    p.addEventListener('input', function () { c.value = Math.max(1, Math.ceil(num(g, 200, 8000) / num(p, 50, 1000))); syncHint(); });
    c.addEventListener('input', function () { g.value = Math.max(200, num(c, 1, 24) * num(p, 50, 1000)); syncHint(); });
    syncHint();
  }

  function saveModuleForm(form) {
    const key = form.dataset.key || '';
    if (MODULE_KEYS.indexOf(key) < 0) return;
    const get = function (n) {
      const el = form.querySelector('[name="' + n + '"]');
      return el ? el.value.trim() : '';
    };
    if (!state.modules) state.modules = {};
    const prev = state.modules[key] || moduleDefaults(key);
    const next = {
      on: prev.on !== false,
      name: (get('name') || MODULE_LABEL[key]).slice(0, 20),
      icon: (get('icon') || prev.icon || '✅').slice(0, 4),
      color: /^#[0-9a-f]{6}$/i.test(get('color')) ? get('color') : (prev.color || '#2f6f5e'),
      note: get('note').slice(0, 40),
      createdAt: prev.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    /* v194：478 的图标 / 名称 / 颜色 / 备注由系统固定，保存时强制写回默认值 */
    if (key === 'breathe') {
      next.name = MODULE_LABEL.breathe || '478呼吸法';
      next.icon = '🌬️';
      next.color = '#5b8f8a';
      next.note = '4-7-8 呼吸';
    }
    if (key === 'water') {
      const per = clamp(Math.round(Number(get('perMl')) || 250), 50, 1000);
      const cups = clamp(Math.round(Number(get('cups')) || 9), 1, 24);
      const goal = Math.max(clamp(Math.round(Number(get('goalMl')) || 2300), 200, 8000), cups * per);
      next.unit = '杯';
      next.perMl = per;
      next.cups = cups;
      next.goalMl = goal;
    } else if (key === 'move') {
      next.unit = '次';
      next.times = clamp(Math.round(Number(get('times')) || 1), 1, 99);
    } else if (key === 'breathe') {
      next.unit = '组';
      next.groups = clamp(Math.round(Number(get('groups')) || 1), 1, BREATHE_MAX_GROUPS);
      next.cycles = clamp(Math.round(Number(get('cycles')) || 4), 1, 8);
      /* v194：提醒时间点个数跟组数走，已填的值保留，没填的补不重复的建议值（v200 起走去重） */
      const oldT = Array.isArray(prev.notifyTimes) ? prev.notifyTimes : [];
      const ts = breatheFillTimes(oldT, next.groups);
      next.notifyTimes = ts;
      next.notifyChannels = (Array.isArray(prev.notifyChannels) && prev.notifyChannels.length) ? prev.notifyChannels : ['browser'];
      next.suggestTime = ts[0] || '15:00';
    } else {
      const s = get('startDate');
      next.startDate = /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
      next.perDay = clamp(Math.round(Number(get('perDay')) || 0), 0, 100);
      next.packPrice = Math.max(0, Math.min(9999, Number(get('packPrice')) || 0));
      next.packSize = clamp(Math.round(Number(get('packSize')) || 20), 1, 50);
    }
    if (key !== 'quit') {
      /* 2A：总开关读「开启提醒」（旧下拉已删） */
      const swH = document.querySelector('#habit-form [data-role="notify-switch"]');
      next.notify = swH ? swH.classList.contains('on') : true;
      const st = get('suggestTime');
      next.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(st) ? st : '15:00';
      next.notifyFreq = 'daily';
      next.notifyWeekday = 1;
      next.notifyMonthday = 1;
      next.notifyNote = '';
    }
    state.modules[key] = next;
    state.modulesAt = Date.now();
    save();
    closeModal();
    render();
    toast('已保存 · ' + (next.name || MODULE_LABEL[key]));
  }
