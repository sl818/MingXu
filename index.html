  function isModuleOn(key) {
    if (key === 'meds') {
      const mp = state && state.modulePrefs && state.modulePrefs.meds;
      return !mp || mp.on !== false;
    }
    if (key === 'money') {
      const mm = state && state.money;
      return !mm || mm.on !== false;
    }
    const m = state && state.modules && state.modules[key];
    return !m || m.on !== false;

      if (!isPlainObject(state.modulePrefs)) state.modulePrefs = {};
      state.modulePrefs.meds = { on: !!on, at: Date.now() };
    } else {
      if (!isPlainObject(state.modules[key])) state.modules[key] = moduleDefaults(key);
      state.modules[key].on = on;
      state.modules[key].updatedAt = new Date().toISOString();

  const OLD_SEED_COLORS = { h_med: '#5b6bf0', h_water: '#2a9dbf', h_move: '#1f9d67', h_drink: '#e08a3c' };
  const NEW_SEED_COLORS = { h_med: '#2f6f5e', h_water: '#4c7f96', h_move: '#b5733f', h_drink: '#9c5a5a' };

  function migrateColors(data) {
    if (!data || (Number(data.version) || 1) >= 2) return data;
    if (Array.isArray(data.habits)) {
      data.habits.forEach(h => {
        if (h && OLD_SEED_COLORS[h.id] && String(h.color || '').toLowerCase() === OLD_SEED_COLORS[h.id]) {
          h.color = NEW_SEED_COLORS[h.id];

    data.version = 2;
    return data;
  }

  function migratePinned(data) {
    if (data && Array.isArray(data.habits)) {

  /* 把旧的 med.stock（剩余数量）转成基线：从这一刻起按服药记录往下扣。
     旧 stock 字段保留不删（万一需要回滚），但新代码只读 stockBase。 */
  function migrateStock(data) {
    if (!data || !Array.isArray(data.meds)) return data;
    const now = new Date().toISOString();
    data.meds.forEach(function (m) {
      if (!m) return;
      const hasBase = m.stockBase !== undefined && m.stockBase !== null;
      if (hasBase) return;
      const legacy = m.stock;
      if (legacy !== '' && legacy !== null && legacy !== undefined && isFinite(Number(legacy))) {
        m.stockBase = Math.max(0, Number(legacy));
        m.stockBaseAt = now;
        /* 旧数字很可能已经不准了（之前扣减会丢），标出来让人核对一次 */
        m.stockReview = true;
      } else {
        m.stockBase = '';
        m.stockBaseAt = '';
      }
    });
    return data;
  }

  function migrateMeds(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    let medHabit = data.habits.find(h => h.id === 'h_med');
    if (!medHabit) {
      medHabit = {
        id: 'h_med', name: '用药', icon: '💊', type: 'build', target: 1, unit: '次',
        color: '#2f6f5e', note: '用药记录', createdAt: new Date().toISOString(), pinned: true, med: true
      };
      data.habits.unshift(medHabit);
    }
    medHabit.med = true;
    medHabit.pinned = true;
    medHabit.target = 1;
    medHabit.name = '用药';
    medHabit.icon = '💊';
    if (!medHabit.note) medHabit.note = '用药记录';
    if (!Array.isArray(data.meds)) {

          status: 'active', stock: '', note: '早晚各一次', createdAt: new Date().toISOString()
        });

      if (!data.meds || typeof data.meds !== 'object' || !Array.isArray(data.meds)) data.meds = [];
      data.meds = data.meds.map(m => {
        const x = m || {};
        return Object.assign({
          id: 'med_' + uid(), name: '用药', purpose: '其他', form: '片', strength: '',
          doseAmount: 1, doseUnit: '片', times: [], courseType: 'long', startDate: todayStr(),

  function migrateQuitHabit(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    data.habits.forEach(h => {

  function ensureBreathingHabit(data) {
    if (!data || !Array.isArray(data.habits)) return data;
    let h = data.habits.find(x => x && x.id === 'h_breathe');
    if (!h) {
      h = {
        id: 'h_breathe', name: '478呼吸法', icon: '🌬️', type: 'build',
        target: 1, unit: '组', color: '#5b8f8a', note: '4-7-8 呼吸',
        breatheCycles: 4, suggestTime: '15:00',
        createdAt: new Date().toISOString(), pinned: true
      };
      data.habits.push(h);
    } else {
      /* v201：抹 target 之前，先把它搬进模块配置 —— 老用户的「每天几组」存在
         habits 的 target 上。这个函数在 migrateState 里跑，而 ensureModules 在它
         **之后** 才从锚点提取组数；先抹成 1 再提取，就永远只能拿到 1（v170 遗留的丢设置）。
         只在「模块还没配过 groups」时搬 → 搬过一次后 target 已是 1，不会重复搬（幂等）。 */
      const tgt = Math.round(Number(h.target) || 0);
      if (tgt > 1) {
        if (!data.modules || typeof data.modules !== 'object') data.modules = {};
        const bm = (data.modules.breathe && typeof data.modules.breathe === 'object') ? data.modules.breathe : null;
        if (!bm || !(Number(bm.groups) > 1)) {
          /* suggestTime 也要一起搬 —— 它是老数据唯一的提醒时刻，
             normalizeModule 会把它当 notifyTimes 的第一个点；不搬就会退回默认 15:00。 */
          const st = String(h.suggestTime || '');
          data.modules.breathe = Object.assign({}, bm || {}, {
            groups: clamp(tgt, 1, BREATHE_MAX_GROUPS),
            suggestTime: /^([01]\d|2[0-3]):[0-5]\d$/.test(st) ? st : '15:00'
          });
        }
      }
      h.pinned = true;
      h.optional = false;
      h.type = 'build';
      h.target = 1;
      h.unit = '组';
      h.breatheCycles = Math.max(1, Math.min(8, Number(h.breatheCycles) || 4));
      h.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(h.suggestTime || '')) ? h.suggestTime : '15:00';
      h.name = h.name || '478呼吸法';
      h.icon = h.icon || '🌬️';
    }
    return data;
  }

  /* goalWeight 可选：0 表示没设目标。范围放宽到 20–300kg，
     只做合理性拦截，不给医学建议。 */
  function normalizeBodyProfile(p) {
    const age = parseInt(p && p.age, 10);
    const height = Number(p && p.height);
    if (!isFinite(age) || age < 1 || age > 120 || !isFinite(height) || height < 50 || height > 250) {
      return { age: 0, height: 0, goalWeight: 0 };
    }
    const goal = Number(p && p.goalWeight);
    const goalWeight = (isFinite(goal) && goal >= 20 && goal <= 300) ? Math.round(goal * 10) / 10 : 0;
    return { age: Math.round(age), height: Math.round(height * 10) / 10, goalWeight: goalWeight };
  }

  function hasBodyProfile() {
    const p = normalizeBodyProfile(state.bodyProfile);
    return p.age > 0 && p.height > 0;
  }

  function normalizeWeightRecord(w) {
    if (!w || typeof w !== 'object') return null;
    const date = String(w.date || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || fmt(parseD(date)) !== date || date > todayStr()) return null;
    const rawWeight = Number(w.weight);
    const rawHeight = Number(w.height);
    const rawAge = parseInt(w.age, 10);
    if (!isFinite(rawWeight) || rawWeight <= 0 || !isFinite(rawHeight) || rawHeight <= 0 || !isFinite(rawAge) || rawAge <= 0) return null;
    const weight = Math.round(clamp(rawWeight, 1, 500) * 10) / 10;
    const height = Math.round(clamp(rawHeight, 50, 250) * 10) / 10;
    const age = Math.round(clamp(rawAge, 1, 120));
    /* 体脂率（v114）：可选，0 = 没填。只拦离谱值，不做医学判断 */
    const rawFat = Number(w.fat);
    const fat = (isFinite(rawFat) && rawFat >= 1 && rawFat <= 70) ? Math.round(rawFat * 10) / 10 : 0;
    return {
      id: String(w.id || ('w_' + uid())),
      date: date,
      age: age,
      height: height,
      weight: weight,
      bmi: calcBmi(weight, height),
      fat: fat,
      createdAt: w.createdAt || new Date().toISOString()
    };
  }

  function normalizeEssayTags(value) {
    const raw = Array.isArray(value) ? value : (typeof value === 'string' ? value.split(/[,，、]/) : []);
    const out = [];
    raw.forEach(tag => {
      const t = String(tag || '').trim().slice(0, 12);
      if (t && out.indexOf(t) < 0 && out.length < 5) out.push(t);
    });
    return out;
  }

  function normalizeEssayRecord(e) {
    if (!e || typeof e !== 'object') return null;
    const text = String(e.text || '').trim().slice(0, 5000);
    if (!text) return null;
    const rawDate = String(e.date || '');
    const date = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) && fmt(parseD(rawDate)) === rawDate && rawDate <= todayStr()
      ? rawDate : todayStr();
    return {
      id: String(e.id || ('e_' + uid())),
      date: date,
      title: String(e.title || '').trim().slice(0, 60),
      text: text,
      tags: normalizeEssayTags(e.tags),
      createdAt: e.createdAt || new Date().toISOString(),
      updatedAt: Number(e.updatedAt) || Date.now()
    };
  }

  function isPlainObject(value) {
    return !!value && typeof value === 'object' && !Array.isArray(value);
  }

  /* ============================================================
     常驻模块：数据层（v170）
     - 配置：state.modules.<water|move|breathe|quit>
     - 记录：仍用 RECORD_IDS 的旧主键，见文件头注释
     - 锚点：habits 里那四个条目只用于回滚，任何逻辑都不读它
     ============================================================ */
  function isModuleAnchor(h) {
    return !!h && MODULE_KEYS.some(k => RECORD_IDS[k] === h.id);
  }
  function moduleKeyOf(id) {
    for (let i = 0; i < MODULE_KEYS.length; i++) {
      if (RECORD_IDS[MODULE_KEYS[i]] === id) return MODULE_KEYS[i];
    }
    return '';
  }

  /* 478 提醒的默认时间点 —— 每天几组就几个点，在 07:00–21:00 之间铺开。
     只是「建议值」，用户可以在提醒区逐个改。（上限常量 BREATHE_MAX_GROUPS 在工具常量区） */
  function breatheDefaultTimes(n) {
    const k = Math.max(1, Math.min(BREATHE_MAX_GROUPS, Math.round(Number(n) || 1)));
    const from = 7 * 60, to = 21 * 60;
    const out = [];
    for (let i = 0; i < k; i++) {
      /* 先落到 5 分钟刻度，再转成 HH:MM（先除后加，顺序反了会算出 45:30 这种非法值） */
      const mm = k === 1 ? 15 * 60 : Math.round((from + (to - from) * (i / (k - 1))) / 5) * 5;
      out.push(pad2(Math.floor(mm / 60) % 24) + ':' + pad2(mm % 60));
    }
    return out;
  }

  /* v200：算出 k 个「互不相同」的时间点 —— 保留用户已经改过的，只补缺口。
     ① 先收旧值里合法且不重复的（按原顺序，前几组的时间点不会被挪）
     ② 不够 → 从 breatheDefaultTimes(k) 里取还没被占用的那个
     ③ 还不够 → 在 07:00–21:00 每 5 分钟扫空档（k ≤ 5 时 169 个档位，永远够用）
     为什么不能「扩容时整体重算 dflt(k)」：那会把用户改过的前几个点冲掉，比原问题更糟。
     为什么必须去重：后端推送去重键是「日期|kind|id|时刻」，两个时刻相同 → 第二条被
     唯一索引吃掉，那一组就永远收不到提醒（v196 复查问题 ①）。 */
  function breatheFillTimes(olds, k) {
    const n = Math.max(1, Math.min(BREATHE_MAX_GROUPS, Math.round(Number(k) || 1)));
    const TIME_OK = function (s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s || '')); };
    const src = Array.isArray(olds) ? olds : [];
    const used = {};
    const out = new Array(n).fill('');
    /* 第一轮：按**位置**收旧值里合法且不重复的 —— 位置固定，第 N 组还是第 N 组 */
    for (let i = 0; i < n; i++) {
      const s = String(src[i] || '');
      if (TIME_OK(s) && !used[s]) {
        used[s] = 1;
        out[i] = s;
      }
    }
    /* 第二轮：空位优先取 dflt 里还没被占用的（用户心里的「建议值」还是那几个） */
    const dflt = breatheDefaultTimes(n);
    for (let i = 0; i < n; i++) {
      if (out[i]) continue;
      const t = dflt.filter(function (x) { return !used[x]; })[0];
      if (t) {
        used[t] = 1;
        out[i] = t;
      }
    }
    /* 第三轮：还空着的（用户填了重复值、dflt 又用完了）→ 07:00–21:00 找空档 */
    for (let i = 0; i < n; i++) {
      if (out[i]) continue;
      for (let m = 7 * 60; m <= 21 * 60; m += 5) {
        const t = pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
        if (used[t]) continue;
        used[t] = 1;
        out[i] = t;
        break;
      }
    }
    /* v204：按时间升序返回。线上拟真测试发现：1 组 15:00 → 改 3 组，会得出
       15:00 / 07:00 / 14:00 这种乱序（保留旧值 + 追加缺口的必然结果）。
       「第 N 个时间点 = 第 N 组」的语义要求它单调递增，所以这里统一排一次。 */
    return out.filter(Boolean).sort(function (a, b) { return a < b ? -1 : (a > b ? 1 : 0); });
  }

  function moduleDefaults(key) {
    const iso = new Date().toISOString();
    const base = {

        notifyWeekday: 1, notifyMonthday: 1, notifyNote: '',
        notifyChannels: ['browser'], notifyMode: 'each', notifyDailyCount: 2,
        notifyDailyTimes: { morning: '08:00', noon: '12:30', afternoon: '15:00' },

    if (key === 'move') {

        times: 1, notify: true, suggestTime: '', notifyFreq: 'daily',

        sports: [], records: []
      });

    if (key === 'breathe') {

        groups: 1, cycles: 4, notify: true, suggestTime: '15:00', notifyFreq: 'daily',
        notifyWeekday: 1, notifyMonthday: 1, notifyNote: '',

        notifyChannels: ['browser'], notifyTimes: ['15:00']

      name: '戒烟', icon: '🚭', color: '#7a8471', note: '',

  /* 新用户的第一份模块配置（与 seedState 里那四个锚点的值保持一致） */
  function seedModules() {
    const out = {};
    MODULE_KEYS.forEach(function (k) { out[k] = moduleDefaults(k); });
    return out;
  }

  /* 从冻结锚点（旧 habit）提取一次配置。兼容被旧版改坏的数据：
     喝水 target 被写成 1 时，按 goalMl / perMl 反推杯数。 */  function moduleFromLegacy(key, h) {
    const d = moduleDefaults(key);
    if (!h || typeof h !== 'object') return d;
    const m = Object.assign(d, {
      name: String(h.name || d.name).trim().slice(0, 20) || d.name,
      icon: String(h.icon || d.icon).slice(0, 4),
      color: /^#[0-9a-f]{6}$/i.test(String(h.color || '')) ? String(h.color) : d.color,
      note: String(h.note || '').slice(0, 40),
      createdAt: String(h.createdAt || d.createdAt)
    });
    if (key === 'water') {
      const per = clamp(Math.round(Number(h.perMl) || 250), 50, 1000);
      const goal = Math.max(200, Math.round(Number(h.goalMl) || 2300));
      let cups = clamp(parseInt(h.target, 10) || 0, 0, 24);
      if (cups < 2 && goal > per) cups = clamp(Math.ceil(goal / per), 1, 24);
      m.cups = cups || 9;
      m.perMl = per;
      m.goalMl = goal;   /* v206：同上，不再被 cups×per 抬高 */
    } else if (key === 'move') {
      m.times = clamp(parseInt(h.target, 10) || 1, 1, 99);
      m.sports = [];
      m.records = [];
    } else if (key === 'breathe') {
      m.groups = clamp(parseInt(h.target, 10) || 1, 1, BREATHE_MAX_GROUPS);
      m.cycles = clamp(parseInt(h.breatheCycles, 10) || 4, 1, 8);
      /* v194：老锚点只有一个 suggestTime，迁成第一个提醒时间点
         v200：走 breatheFillTimes —— 旧 suggestTime 放第一位，其余补不重复的默认点 */
      const hs = String(h.suggestTime || '');
      m.notifyTimes = breatheFillTimes([hs], m.groups);
      m.notifyChannels = ['browser'];
    } else {
      const s = String(h.quitStart || '');
      m.startDate = /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
      m.perDay = clamp(parseInt(h.quitPerDay, 10) || 0, 0, 100);
      m.packPrice = Math.max(0, Math.min(9999, Number(h.quitPackPrice) || 0));
      m.packSize = clamp(parseInt(h.quitPackSize, 10) || 20, 1, 50);
    }
    if (key !== 'quit') {
      m.notify = h.notify !== false;
      const st = String(h.suggestTime || '');
      m.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(st) ? st : d.suggestTime;
      m.notifyFreq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
      const nwd = Number(h.notifyWeekday);
      m.notifyWeekday = (nwd >= 0 && nwd <= 6) ? Math.round(nwd) : 1;
      const nmd = Number(h.notifyMonthday);
      m.notifyMonthday = (nmd >= 1 && nmd <= 31) ? Math.round(nmd) : 1;
      m.notifyNote = String(h.notifyNote || '').slice(0, 60);
    }
    return m;
  }

  /* 运动 2.1（v176）：单个运动实例的字段白名单 + 旧数据迁移。
     兼容 v175 的 goal / freq / n / stroke / recMode(manual|once|multi)，老数据不丢。 */
  function normalizeMoveSport(raw) {
    const s = isPlainObject(raw) ? raw : {};
    const key = MOVE_TYPES[s.key] ? s.key : 'steps';
    const T = MOVE_TYPES[key];
    const TGT = T.targets;

    /* 目标档位：优先 tIdx + tVal；v175 只有 goal，按第 0 档还原 */
    let tIdx = Math.round(Number(s.tIdx));
    if (!(tIdx >= 0 && tIdx < TGT.length)) tIdx = 0;
    let tVal = Math.round(Number(s.tVal));
    if (!(tVal > 0)) {
      const oldGoal = Math.round(Number(s.goal));
      tVal = oldGoal > 0 ? oldGoal : TGT[tIdx].def;
    }
    tVal = clamp(tVal, 1, 999999);
    /* v179：跳绳的目标从「次数」改成「时长」。老数据若目标是次数（值明显偏大，
       比如 500 下），直接沿用会变成「500 分钟」，这里退回默认时长。 */
    if (key === 'rope' && tVal > 300) tVal = TGT[0].def;

    /* 频率：v176 只留 daily / weekly。
       v175 的 weekly_times（每周 N 次）和 free（自由）没有「哪几天」的信息，
       迁移成 weekly + 全 7 天 —— 等于「每天都要做」，不会凭空把某天判成休息日。 */
    const oldFreq = String(s.freq || '');
    let freqKind = (s.freqKind === 'weekly' || s.freqKind === 'daily') ? s.freqKind
      : (oldFreq === 'weekly_days' || oldFreq === 'weekly_times' || oldFreq === 'free') ? 'weekly'
        : 'daily';
    let weekSel = Array.isArray(s.weekSel)
      ? s.weekSel.map(function (x) { return Math.round(Number(x)); })
        .filter(function (x) { return x >= 0 && x <= 6; })
      : [];
    weekSel = weekSel.filter(function (x, i) { return weekSel.indexOf(x) === i; });
    if (freqKind === 'weekly' && !weekSel.length) weekSel = [0, 1, 2, 3, 4, 5, 6];
    if (freqKind === 'daily') weekSel = [0, 1, 2, 3, 4, 5, 6];
    let freqN = clamp(Math.round(Number(s.freqN != null ? s.freqN : s.n) || 1), 1, 99);
    if (freqKind === 'weekly') freqN = weekSel.length;

    /* v184：每日步数是独立的运动类型 —— 不允许「今天要完成两次」这种设置。
       频率只剩「每天运动 / 每周选天运动」，每个执行日就是 1 次；
       完成度只看累计步数 ÷ 目标步数，跟点几次无关。 */
    const isSteps = key === 'steps';
    if (isSteps) freqN = 1;

    /* v178：单日多次。原来只有「每天运动」能设一天几次，「每周选日运动」设不了。
       perDay = 每个执行日要完成几次；老数据没有这个字段时，daily 取 freqN、weekly 取 1，
       所以既有用户的行为完全不变（默认 1 次）。 */
    let perDay = Math.round(Number(s.perDay));
    if (!(perDay >= 1)) perDay = freqKind === 'daily' ? freqN : 1;
    perDay = clamp(perDay, 1, 99);
    /* 每日步数同样固定为每个执行日 1 次（见上） */
    if (isSteps) perDay = 1;

    /* v184：运动开始时间（HH:MM）。每日步数是全天持续统计，不需要这一项；
       其余 6 种填了才到点提醒，默认留空。 */
    const startRaw = String(s.startTime || '');
    const startTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(startRaw) && !isSteps ? startRaw : '';

    /* v178：每个运动自己的通知开与渠道（之前渠道只有模块级一份，弹窗里关不掉）。
       channels 显式给了空数组就保留空 —— 表示「这个运动不要任何渠道」，
       不能强行塞回 browser，否则用户怎么点都关不掉。 */
    const CHS = ['browser', 'wecom', 'mail'];
    /* v216：实例通知设置的真源是板块矩阵 move.instances，快照不再生成默认值；
       输入里已有的旧值原样透传（老数据兼容），没有就不写。 */
    const channels = Array.isArray(s.channels)
      ? s.channels.filter(function (x) { return CHS.indexOf(x) >= 0; })
      : null;
    const notifyOn = s.notifyOn === undefined ? undefined : s.notifyOn !== false;

    /* 记录方式：v176 只有 manual / fixed。
       v175 的 once（一键完成）和 multi（多次打卡）统一并到 manual，
       不猜固定步数 —— 猜错会变成「点一下 +1000 但目标 8000」的怪状态。 */
    const recMode = s.recMode === 'fixed' ? 'fixed' : 'manual';
    const fixedSteps = clamp(Math.round(Number(s.fixedSteps) || 1000), 1, 999999);

    const fields = Array.isArray(s.fields) ? s.fields.filter(function (k) {
      return T.fields.some(function (f) { return f.k === k; });
    }) : [];
    /* v197：某一天补录过距离的标记（'YYYY-MM-DD': true）。
       「补过即锁定」从「这条记录上有 distM」提升到「这一天已经补过」——
       删掉记录不会解锁，当天也不能补第二次。 */
    const distLocked = {};
    if (isPlainObject(s.distLocked)) {
      Object.keys(s.distLocked).forEach(function (d) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(d) && s.distLocked[d]) distLocked[d] = true;
      });
    }
    const strokePick = String(s.strokePick || s.stroke || '').slice(0, 10);

    const outS = {
      id: String(s.id || uid()),
      key: key,
      name: String(s.name || T.name).trim().slice(0, 20) || T.name,
      icon: String(s.icon || T.icon).slice(0, 4),
      color: /^#[0-9a-f]{6}$/i.test(String(s.color || '')) ? String(s.color) : T.color,
      tIdx: tIdx,
      tVal: tVal,
      freqKind: freqKind,
      freqN: freqN,
      perDay: perDay,
      weekSel: weekSel,
      recMode: recMode,
      fixedSteps: fixedSteps,
      startTime: startTime,
      fields: fields,
      strokePick: strokePick,
      distLocked: distLocked,
      /* —— 以下为 v175 旧字段的镜像，读老代码/老备份时仍能取到 —— */
      unit: TGT[tIdx].unit,
      goal: tVal,
      freq: freqKind === 'weekly' ? 'weekly_days' : 'daily',
      n: freqN,
      stroke: strokePick,
      createdAt: String(s.createdAt || new Date().toISOString()),
      updatedAt: String(s.updatedAt || s.createdAt || new Date().toISOString())
    };
    /* v216：实例通知字段不再生成默认值——老数据里已有的原样透传（老备份/老代码读得到），
       新运动干净无这两个字段（真源在板块矩阵 move.instances）。 */
    if (s.notifyOn !== undefined) outS.notifyOn = s.notifyOn !== false;
    if (Array.isArray(s.channels)) {
      const chOld = s.channels.filter(function (x) { return CHS.indexOf(x) >= 0; });
      if (chOld.length) outS.channels = chOld;
    }
    return outS;
  }

  /* 运动 2.2（v179）：单条运动记录的白名单收敛。
     v179 按新字段表扩容：步幅/平均速度/跳频/组数/次数/负重/组间休息/心率区间/平均心率/步数距离。 */
  function normalizeMoveRecord(raw) {
    const r = isPlainObject(raw) ? raw : {};
    const num = function (v) { return isFinite(Number(v)) ? Math.max(0, Number(v)) : 0; };
    const at = String(r.at || new Date().toISOString());
    let hour = Math.round(Number(r.hour));
    if (!(hour >= 0 && hour <= 23)) {
      const t = new Date(at);
      hour = isNaN(t.getTime()) ? 0 : t.getHours();
    }
    /* 日期要**真实存在**：光看格式的话，备份里写 2026-02-31 也算数，
       之后按「天」聚合时那天的记录就成了孤儿。这里用 Date 反查一次。 */
    const dRaw = String(r.d || '');
    let d = todayStr();
    if (/^\d{4}-\d{2}-\d{2}$/.test(dRaw)) {
      const dt = new Date(dRaw + 'T00:00:00');
      if (!isNaN(dt.getTime()) && fmt(dt) === dRaw) d = dRaw;
    }
    /* v198：并发合并要按记录逐条比新旧，所以每条记录带两个戳 ——
       updatedAt = 最后修改时间（合并时新的胜出），
       deletedAt = 软删除墓碑（删了不真删，30 天后清理）。
       没有墓碑的话，一端删的记录会被另一端「复活」。 */
    const updatedAt = String(r.updatedAt || at);
    const deletedAt = String(r.deletedAt || '');
    return {
      id: String(r.id || uid()),
      sportId: String(r.sportId || ''),
      key: MOVE_TYPES[r.key] ? r.key : '',
      d: d,
      at: at,
      hour: hour,
      steps: num(r.steps),
      dur: num(r.dur),
      dist: num(r.dist),
      distM: num(r.distM),
      kcal: num(r.kcal),
      count: num(r.count),
      ropeRate: num(r.ropeRate),
      cadence: num(r.cadence),
      stride: num(r.stride),
      speed: num(r.speed),
      sets: num(r.sets),
      reps: num(r.reps),
      weight: num(r.weight),
      rest: num(r.rest),
      hrZone: String(r.hrZone || '').slice(0, 16),
      heartAvg: num(r.heartAvg),
      pace: String(r.pace || '').slice(0, 12),
      heart: num(r.heart),
      stroke: String(r.stroke || '').slice(0, 10),
      recMode: (r.recMode === 'fixed' || r.recMode === 'manual') ? r.recMode : '',
      /* v181：打卡后先记一条「待填数据」的记录（pending），填完或明确跳过才置 false。
         老数据没有这两个字段，默认 false —— 不能反过来要求老用户去补。 */
      pending: r.pending === true,
      skipped: r.skipped === true,
      updatedAt: updatedAt,
      deletedAt: deletedAt
    };
  }

  /* 单个模块的字段白名单 + 范围收敛。已有的合法值不覆盖，只补缺失与纠非法。 */
  function normalizeModule(key, raw) {
    const d = moduleDefaults(key);
    const m = isPlainObject(raw) ? raw : {};
    const out = {
      on: m.on !== false,
      name: String(m.name || d.name).trim().slice(0, 20) || d.name,
      icon: String(m.icon || d.icon).slice(0, 4),
      color: /^#[0-9a-f]{6}$/i.test(String(m.color || '')) ? String(m.color) : d.color,
      note: String(m.note || '').slice(0, 40),
      createdAt: String(m.createdAt || d.createdAt),
      updatedAt: String(m.updatedAt || d.updatedAt)
    };
    if (key === 'water') {
      out.unit = '杯';
      out.perMl = clamp(Math.round(Number(m.perMl) || d.perMl), 50, 1000);
      out.cups = clamp(Math.round(Number(m.cups) || d.cups), 1, 24);
      /* v206：不再用 max(cups×per) 抬高用户填的总量 —— 规范化层每次加载/保存都跑，
         一 max 就把 2300 永久改成 3000（改杯数后）并写回库。读取时由 waterGoalMl 兜底即可。 */
      out.goalMl = clamp(Math.round(Number(m.goalMl) || d.goalMl), 200, 8000);
      /* 喝水通知：渠道多选 + 频率双模式（v173） */
      const CH = ['browser', 'wecom', 'mail'];
      const ch = Array.isArray(m.notifyChannels) ? m.notifyChannels.filter(function (x) { return CH.indexOf(x) >= 0; }) : [];
      out.notifyChannels = ch.length ? ch : ['browser'];
      out.notifyMode = m.notifyMode === 'daily' ? 'daily' : 'each';
      out.notifyDailyCount = [1, 2, 3].indexOf(Number(m.notifyDailyCount)) >= 0 ? Number(m.notifyDailyCount) : 2;
      const dt = isPlainObject(m.notifyDailyTimes) ? m.notifyDailyTimes : {};
      const TIME_OK = function (s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s || '')); };
      out.notifyDailyTimes = {
        morning: TIME_OK(dt.morning) ? dt.morning : '08:00',
        noon: TIME_OK(dt.noon) ? dt.noon : '12:30',
        afternoon: TIME_OK(dt.afternoon) ? dt.afternoon : '15:00'
      };
      out.notifyStart = TIME_OK(m.notifyStart) ? m.notifyStart : '08:00';
      out.notifyEnd = TIME_OK(m.notifyEnd) ? m.notifyEnd : '21:00';
    } else if (key === 'move') {
      out.unit = '次';
      out.times = clamp(Math.round(Number(m.times) || d.times), 1, 99);
      /* 运动 2.0（v175）：sports（运动实例）与 records（运动记录）白名单收敛 */
      out.sports = Array.isArray(m.sports) ? m.sports.map(normalizeMoveSport) : [];
      /* v198：软删除的墓碑留 30 天就彻底清掉（够两台设备同步到），别让数据无限膨胀 */
      const KEEP_TOMB = 30 * 86400000;
      out.records = Array.isArray(m.records)
        ? m.records.filter(function (r) {
            if (!r || !r.deletedAt) return true;
            const t = Date.parse(String(r.deletedAt));
            return !(t > 0) || (Date.now() - t) < KEEP_TOMB;
          }).map(normalizeMoveRecord)
        : [];
      /* v177 修：notifyChannels / notifyScenes 原本没进白名单，每次 normalize 都被丢掉，
         结果弹窗里选好的渠道一保存就没了。这里补上（渠道多选 + 三个提醒场景）。 */
      const CH2 = ['browser', 'wecom', 'mail'];
      const ch2 = Array.isArray(m.notifyChannels)
        ? m.notifyChannels.filter(function (x) { return CH2.indexOf(x) >= 0; })
        : [];
      out.notifyChannels = ch2.length ? ch2 : ['browser'];
      const sc2 = isPlainObject(m.notifyScenes) ? m.notifyScenes : {};
      out.notifyScenes = {
        steps: sc2.steps !== false,
        plan: sc2.plan !== false,
        week: sc2.week !== false
      };
    } else if (key === 'breathe') {
      out.unit = '组';
      out.groups = clamp(Math.round(Number(m.groups) || d.groups), 1, BREATHE_MAX_GROUPS);
      out.cycles = clamp(Math.round(Number(m.cycles) || d.cycles), 1, 8);
      /* v194：478 的图标 / 名称 / 颜色 / 备注由系统固定，用户不能改 */
      out.name = d.name; out.icon = d.icon; out.color = d.color; out.note = d.note;
    } else {
      const s = String(m.startDate || '');
      out.startDate = /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
      out.perDay = clamp(Math.round(Number(m.perDay) || 0), 0, 100);
      out.packPrice = Math.max(0, Math.min(9999, Number(m.packPrice) || 0));
      out.packSize = clamp(Math.round(Number(m.packSize) || 20), 1, 50);
    }
    if (key !== 'quit') {
      out.notify = m.notify !== false;
      const st = String(m.suggestTime || '');
      out.suggestTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(st) ? st : d.suggestTime;
      out.notifyFreq = ['daily', 'weekly', 'monthly'].indexOf(m.notifyFreq) >= 0 ? m.notifyFreq : 'daily';
      const nwd = Number(m.notifyWeekday);
      out.notifyWeekday = (nwd >= 0 && nwd <= 6) ? Math.round(nwd) : 1;
      const nmd = Number(m.notifyMonthday);
      out.notifyMonthday = (nmd >= 1 && nmd <= 31) ? Math.round(nmd) : 1;
      out.notifyNote = String(m.notifyNote || '').slice(0, 60);
    }
    /* v194：478 提醒 = 每天固定时间推送，时间点个数跟「每天几组」走；
       v200：上限收到 5，并统一走 breatheFillTimes 去重 —— 老数据里如果有重复时刻，
       这里也一并修掉（重复时刻会让后端推送去重把后一条吃掉，那一组就收不到提醒）。 */
    if (key === 'breathe') {
      const CH = ['browser', 'wecom', 'mail'];
      const ch = Array.isArray(m.notifyChannels) ? m.notifyChannels.filter(function (x) { return CH.indexOf(x) >= 0; }) : [];
      out.notifyChannels = ch.length ? ch : ['browser'];
      const raw = Array.isArray(m.notifyTimes) ? m.notifyTimes : null;
      /* 老数据没有 notifyTimes：把旧的 suggestTime 当作第一个候选 */
      const seed = (raw && raw.length) ? raw : [out.suggestTime || d.suggestTime];
      out.notifyTimes = breatheFillTimes(seed, out.groups);
      out.suggestTime = out.notifyTimes[0] || out.suggestTime;
    }
    /* v197：白名单之外的键原样带过（与 repairBackup 顶层兜底同一思路）。
       这一层以前是硬白名单 —— 以后给模块加内部字段时，忘了在 normalizeModule 里登记，
       就会在这里被静默洗掉（v78 事故同款）。兜底之后，加字段最多是「暂时不生效」，不会丢数据。 */
    Object.keys(m).forEach(function (k) {
      if (typeof out[k] === 'undefined' && k !== 'sports' && k !== 'records') out[k] = m[k];
    });
    return out;
  }

  /* 四个模块整体归一化：缺的从锚点提取，有的只补字段；不认识的模块键原样带过。
     幂等：跑几次结果一样。 */
  function normalizeModules(raw, habits) {
    const src = isPlainObject(raw) ? raw : {};
    const legacy = {};
    (Array.isArray(habits) ? habits : []).forEach(h => {
      if (isModuleAnchor(h) && !legacy[h.id]) legacy[h.id] = h;
    });
    const out = {};
    MODULE_KEYS.forEach(function (k) {
      out[k] = isPlainObject(src[k]) ? normalizeModule(k, src[k]) : moduleFromLegacy(k, legacy[RECORD_IDS[k]]);
    });
    Object.keys(src).forEach(function (k) {
      if (typeof out[k] === 'undefined') out[k] = src[k];
    });
    return out;
  }

  /* 所有入口（加载 / 保存 / 导入 / 合并）统一在这里补齐模块。
     注意：挂在 ensureStateMaps 上，而不是 migrateState —— 导入备份那条路径
     （handleImport → repairBackup → ensureStateMaps）根本不走 migrateState。 */
  function ensureModules(data) {
    if (!data || typeof data !== 'object') return data;
    data.modules = normalizeModules(data.modules, data.habits);
    data.modulesAt = Math.max(0, Math.round(Number(data.modulesAt) || 0));
    /* v209：模块偏好（目前只有用药停用标记）—— 白名单清洗，只认 meds 的 {on, at} */
    const pr = isPlainObject(data.modulePrefs) ? data.modulePrefs : {};
    const mp = isPlainObject(pr.meds) ? pr.meds : {};
    data.modulePrefs = { meds: { on: mp.on !== false, at: Math.max(0, Math.round(Number(mp.at) || 0)) } };
    return data;
  }

  /* 把模块映射成「旧 habit 形状」，让 quitCard / breathingCard / moveCardHtml /
     water 分支 / met / weekDaysOf 这些函数一行都不用改。 */
  function moduleAsHabit(key) {
    const mods = (typeof state !== 'undefined' && state && isPlainObject(state.modules)) ? state.modules : null;
    let m = mods ? mods[key] : null;
    if (!isPlainObject(m)) {
      /* 兜底：modules 还没生成（加载中的渲染窗口）时，从冻结锚点现算一份，只读 */
      const hs = (typeof state !== 'undefined' && state && Array.isArray(state.habits)) ? state.habits : [];
      m = moduleFromLegacy(key, hs.find(x => x && x.id === RECORD_IDS[key]));
    }
    const base = {
      id: RECORD_IDS[key], name: m.name, icon: m.icon, color: m.color, note: m.note || '',
      unit: m.unit || '次', createdAt: m.createdAt, pinned: true, optional: false,
      suggestTime: m.suggestTime || ''
    };
    if (key === 'water') return Object.assign(base, { type: 'build', target: m.cups, perMl: m.perMl, goalMl: m.goalMl });
    if (key === 'move') return Object.assign(base, { type: 'build', target: m.times });
    if (key === 'breathe') return Object.assign(base, { type: 'build', target: m.groups, breatheCycles: m.cycles });
    return Object.assign(base, {
      type: 'smoke', target: 1, quitStart: m.startDate,
      quitPerDay: m.perDay, quitPackPrice: m.packPrice, quitPackSize: m.packSize
    });
  }

  /* 四个模块的「habit 视图」，按 PINNED_IDS 的顺序给出 */
  function moduleHabits() {
    const out = [];
    MODULE_KEYS.forEach(function (k) {
      const m = state && isPlainObject(state.modules) ? state.modules[k] : null;
      if (m && m.on === false) return;
      out.push(moduleAsHabit(k));
    });
    return out;
  }


  function rebuildChecksFromEvents(events) {
    const out = {};
    (Array.isArray(events) ? events : []).forEach(e => {
      if (!e || typeof e !== 'object') return;
      const d = String(e.d || '');
      const id = String(e.id || '');
      const delta = Number(e.delta);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !id || !isFinite(delta) || !delta) return;
      if (!out[d]) out[d] = {};
      const next = (Number(out[d][id]) || 0) + Math.round(delta);
      if (next > 0) out[d][id] = next;
      else delete out[d][id];
      if (!Object.keys(out[d]).length) delete out[d];
    });
    return out;
  }

  function normalizeChecks(raw, events) {
    // 旧数据里 checks 可能是 []。数组上的日期属性不会被 JSON.stringify 序列化，
    // 必须转成普通对象；events 还在时按事件尝试还原打卡次数。
    if (!isPlainObject(raw)) return rebuildChecksFromEvents(events);
    const out = {};
    Object.keys(raw).forEach(d => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      const day = raw[d];
      if (!isPlainObject(day)) return;
      const clean = {};
      Object.keys(day).forEach(id => {
        const n = Number(day[id]);
        if (isFinite(n) && n > 0) clean[id] = Math.round(n);
      });
      if (Object.keys(clean).length) out[d] = clean;
    });
    return out;
  }

  /* 未完成标记：{日期: {习惯id: 1}}
     为什么不塞进 checks —— checks 的语义是「今天做了几次」，0 会被 setCount 删键，
     存不住「明确记了没做」。两者语义不同，分开存：checks 说做了多少，
     skips 说这天被判定为没做完。只有养成型用得到；戒除的失守走 cravings 的 s 事件。 */
  function normalizeSkips(raw) {
    if (!isPlainObject(raw)) return {};
    const out = {};
    Object.keys(raw).forEach(d => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      const day = raw[d];
      if (!isPlainObject(day)) return;
      const clean = {};
      Object.keys(day).forEach(id => { if (day[id]) clean[id] = 1; });
      if (Object.keys(clean).length) out[d] = clean;
    });
    return out;
  }

  /* 戒烟事件：{id, t(秒), k:'s'抽了|'r'忍住了, h(习惯id), g(诱因), s(强度0-5)}
     t 用秒级时间戳而不是 ISO 字符串——一天几十条，一年上万条，
     而同步是全量快照，字段长度直接决定每次 PUT 的体积。 */
  function normalizeCravings(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (e) {
      if (!e || typeof e !== 'object') return;
      const id = String(e.id || '');
      const k = e.k === 's' ? 's' : (e.k === 'r' ? 'r' : '');
      const t = Number(e.t);
      if (!id || !k || !isFinite(t) || t <= 0) return;
      if (seen[id]) return;
      seen[id] = 1;
      out.push({
        id: id,
        t: Math.round(t),
        k: k,
        h: String(e.h || ''),
        g: String(e.g || ''),
        s: clamp(Math.round(Number(e.s) || 0), 0, 5)
      });
    });
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  /* 买烟记录：{id, at(秒), name, price, size}
     不存「剩余几支」——那是派生量，存在多端合并时必然对不上。 */
  function normalizePacks(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (p) {
      if (!p || typeof p !== 'object') return;
      const id = String(p.id || '');
      const at = Number(p.at);
      if (!id || !isFinite(at) || at <= 0) return;
      if (seen[id]) return;
      seen[id] = 1;
      out.push({
        id: id,
        at: Math.round(at),
        name: String(p.name || ''),
        price: clamp(Math.round((Number(p.price) || 0) * 100) / 100, 0, 99999),
        size: clamp(Math.round(Number(p.size) || 20), 1, 50),
        /* 末支确认时刻（用户给的事实，不是派生量）。这里是白名单式的重建，
           漏写一个字段就会在每次 normalize 后静默丢掉——踩过两次。 */
        cf: Math.max(0, Math.round(Number(p.cf) || 0))
      });
    });
    out.sort(function (a, b) { return a.at - b.at; });
    return out;
  }

  function normalizeMoods(raw) {
    if (!isPlainObject(raw)) return {};
    const out = {};
    Object.keys(raw).forEach(d => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && MOOD_MAP[raw[d]]) out[d] = raw[d];
    });
    return out;
  }

  function ensureStateMaps() {
    if (!state || typeof state !== 'object') return;
    ensureModules(state);
    state.checks = normalizeChecks(state.checks, state.events);
    state.moods = normalizeMoods(state.moods);
    state.notes = isPlainObject(state.notes) ? state.notes : {};
    state.doses = isPlainObject(state.doses) ? state.doses : {};
    /* 戒烟从「戒除的一个子类」改成独立类型（v64）：
         · h_drink 或带 quitKind:'smoke' 标记的 → type: 'smoke'
         · 其余 quit 保留为通用「戒除」，把 quitKind 字段清掉
       幂等：跑几次结果都一样，多端各自迁移也不会打架。 */
    if (Array.isArray(state.habits)) {
      state.habits.forEach(function (h) {
        if (!h) return;
        if (h.type === 'smoke') { delete h.quitKind; return; }
        if (h.type !== 'quit') return;
        if (h.id === 'h_drink' || h.quitKind === 'smoke') {
          h.type = 'smoke';
          delete h.quitKind;
        } else if (h.quitKind) {
          delete h.quitKind;
        }
      });
    }
  }

  /* 喝水改毫升制：旧数据（8 杯）一次性升级到 9 杯 / 250 ml / 共 2300 ml。
     只在没有 perMl 时执行，幂等；checks 里存的仍是「次数」，历史记录无需迁移。 */
  /* 老戒烟记录 → 事件流。用确定性 id（q-习惯id-日期-序号）保证幂等：
     迁移跑两次不会长出重复事件，云合并时也不会被当成新事件。 */
  function migrateQuitCravings(data) {
    if (!Array.isArray(data.habits) || !isPlainObject(data.checks)) return;
    const quitIds = data.habits.filter(function (h) { return isQuitSemantics(h); })
                              .map(function (h) { return h.id; });
    if (!quitIds.length) return;
    /* 「保持 0 次」是计数时代留下的备注，事件流下它只会误导 */
    data.habits.forEach(function (h) {
      if (!isQuitSemantics(h)) return;
      if (String(h.note || '') === '保持 0 次') h.note = '';
      /* 暗红在常驻区读起来像「警告」，换成灰绿。只改还是旧默认值的那批，
         用户自己调过的颜色不动。 */
      if (String(h.color || '').toLowerCase() === '#9c5a5a') h.color = '#7a8471';
    });
    if (!Array.isArray(data.cravings)) data.cravings = [];
    const seen = {};
    data.cravings.forEach(function (e) { if (e && e.id) seen[e.id] = 1; });
    Object.keys(data.checks).forEach(function (ds) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
      const day = data.checks[ds];
      if (!isPlainObject(day)) return;
      quitIds.forEach(function (id) {
        const n = Number(day[id]) || 0;
        if (n <= 0) return;
        for (let i = 0; i < n && i < 40; i++) {
          const cid = 'q-' + id + '-' + ds + '-' + i;
          if (seen[cid]) continue;
          seen[cid] = 1;
          const base = parseD(ds);
          base.setHours(12, i, 0, 0);
          data.cravings.push({ id: cid, t: Math.round(base.getTime() / 1000),
                               k: 's', h: id, g: '', s: 0 });
        }
      });
    });
  }

  /* 补一包：只给有戒烟习惯、但一条买烟记录都没有的账号补，用戒烟起点当开包时间。
     幂等（有 packs 就跳过），多端各自迁移也只会生成同一个确定性 id。 */
  function migrateQuitPack(data) {
    const q = (data.habits || []).find(function (h) {
      return h && !h.archivedAt && isSmoke(h);
    });
    if (!q) return;
    if (Array.isArray(data.packs) && data.packs.length) return;
    const start = String(q.quitStart || (q.createdAt ? String(q.createdAt).slice(0, 10) : ''));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) return;
    data.packs = [{
      id: 'p-init', at: Math.round(parseD(start).getTime() / 1000),
      name: '', price: 0, size: 20
    }];
  }

  function migrateWater(data) {
    (data.habits || []).forEach(h => {
      if (!h || h.id !== 'h_water') return;
      if (Number(h.perMl) > 0) return;
      h.perMl = 250;
      h.goalMl = 2300;
      h.target = 9;
      h.unit = '杯';
      h.note = '每天 9 杯 · 共 2300 ml';
    });
  }

  /* 自定义通知：{id, text, time, mode, date, weeks, monthday, on}
     mode = once（指定某天）/ daily / weekly（weeks 多选，0=周日）/ monthly（monthday）。
     这里只存「什么时候发什么」；发没发过由后端 push_sent 的 slot_key 管（键里带日期），
     所以「单次」和「每天」在数据层是同一件事，只是进不进当天的计划不同。 */
  function normalizeNotices(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (n) {
      if (!n || typeof n !== 'object') return;
      const id = String(n.id || '');
      if (!id || seen[id]) return;
      const text = String(n.text || '').trim();
      if (!text) return;          /* 空内容的通知没有意义，直接丢掉 */
      seen[id] = 1;
      const modes = ['once', 'daily', 'weekly', 'monthly'];
      const mode = modes.indexOf(n.mode) >= 0 ? n.mode : 'daily';
      out.push({
        id: id,
        text: text.slice(0, 1000),
        time: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(n.time || '')) ? String(n.time) : '20:00',
        mode: mode,
        date: /^\d{4}-\d{2}-\d{2}$/.test(String(n.date || '')) ? String(n.date) : '',
        weeks: Array.isArray(n.weeks)
          ? n.weeks.map(function (w) { return Math.round(Number(w)); })
              .filter(function (w) { return w >= 0 && w <= 6; })
          : [],
        monthday: clamp(Math.round(Number(n.monthday) || 1), 1, 31),
        on: n.on !== false
      });
    });
    /* 按时间排，列表里看着顺；同一时刻按 id 兜底，两端顺序一致 */
    out.sort(function (a, b) {
      return (a.time < b.time ? -1 : (a.time > b.time ? 1 : 0)) || String(a.id).localeCompare(String(b.id));
    });
    return out;
  }

  /* 倒数日：{id, title, date, note, time, remindDays, on}
     date 只到天（倒数天数是日期级的，加时刻没意义）；time 只管「几点推通知」。
     remindDays 是提前几天提醒，0 = 当天；数组可为空（只显示不提醒）。 */
  function normalizeCountdowns(raw) {
    if (!Array.isArray(raw)) return [];
    const seen = {};
    const out = [];
    raw.forEach(function (n) {
      if (!n || typeof n !== 'object') return;
      const id = String(n.id || '');
      const title = String(n.title || '').trim();
      const date = String(n.date || '');
      if (!id || seen[id] || !title) return;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      seen[id] = 1;
      const days = Array.isArray(n.remindDays)
        ? n.remindDays.map(function (x) { return Math.round(Number(x)); })
            .filter(function (x) { return x >= 0 && x <= 365; })
        : [];
      out.push({
        id: id,
        title: title.slice(0, 40),
        date: date,
        note: String(n.note || '').slice(0, 200),
        time: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(n.time || '')) ? String(n.time) : '09:00',
        /* 去重 + 去 0 之外的重复，顺手升序（30,3,1,0 看着乱） */
        remindDays: days.filter(function (x, i) { return days.indexOf(x) === i; })
          .sort(function (a, b) { return b - a; }),
        on: n.on !== false
      });
    });
    out.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    return out;
  }

  function normalizeState(data) {
    if (!data || typeof data !== 'object' || !Array.isArray(data.habits) || !Array.isArray(data.tasks)) return null;
    data.habits = data.habits.filter(h => h && typeof h === 'object');
    data.habits.forEach(h => {
      h.archivedAt = h.archivedAt ? String(h.archivedAt) : (h.archived === true ? new Date().toISOString() : '');
      h.notify = h.notify !== false;
      h.notifyFreq = ['daily', 'weekly', 'monthly'].indexOf(h.notifyFreq) >= 0 ? h.notifyFreq : 'daily';
      const nwd = Number(h.notifyWeekday);
      h.notifyWeekday = (nwd >= 0 && nwd <= 6) ? Math.round(nwd) : 1;
      const nmd = Number(h.notifyMonthday);
      h.notifyMonthday = (nmd >= 1 && nmd <= 31) ? Math.round(nmd) : 1;
      h.notifyNote = String(h.notifyNote || '');
      /* 截止时刻只对「保持 × 单次目标」有意义，其他类型/多目标一律清空 */
      const dl = String(h.deadline || '');
      h.deadline = (h.type === 'build' && !h.med && (Number(h.target) || 1) <= 1
        && /^([01]\d|2[0-3]):[0-5]\d$/.test(dl)) ? dl : '';
      /* 小习惯 2.0：节奏字段。老数据没有这个键就不写，
         schedOf() 缺省会按 daily 处理，因此不需要迁移。 */
      if (h.sched && typeof h.sched === 'object') h.sched = schedOf(h);
      /* 通知计划：结构校验，无此键不写（老数据零迁移，三处同步之二） */
      if (h.notifyPlan && typeof h.notifyPlan === 'object') {
        const npS = sanitizeNotifyPlan(h.notifyPlan);
        if (npS) h.notifyPlan = npS; else delete h.notifyPlan;
      }
      const hu = Number(h.updatedAt);
      h.updatedAt = (isFinite(hu) && hu > 0) ? hu : 0;
    });
    data.tasks = data.tasks.filter(t => t && typeof t === 'object');
    data.tasks.forEach(t => {
      t.repeat = ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none';
      t.repeatTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.repeatTime || '')) ? t.repeatTime : '20:00';
      /* 任务级渠道：复用 notifyPlan 清洗（v230），无此键不写 */
      if (t.notifyPlan && typeof t.notifyPlan === 'object') {
        const npT = sanitizeNotifyPlan(t.notifyPlan);
        if (npT && npT.channels) t.notifyPlan = { channels: npT.channels }; else delete t.notifyPlan;
      }
      const due = t.due && /^\d{4}-\d{2}-\d{2}$/.test(String(t.due)) ? parseD(t.due) : null;
      const wd = Number(t.repeatWeekday);
      const rd = Number(t.repeatDay);
      t.repeatWeekday = (wd >= 0 && wd <= 6) ? Math.round(wd) : (due ? due.getDay() : 0);
      t.repeatDay = (rd >= 1 && rd <= 31) ? Math.round(rd) : (due ? due.getDate() : 1);
      t.repeatNextId = String(t.repeatNextId || '');
      t.repeatFrom = String(t.repeatFrom || '');
      t.archivedAt = t.archivedAt ? String(t.archivedAt) : '';
      t.notify = t.notify !== false;
      t.notifyTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.notifyTime || '')) ? t.notifyTime : '09:00';
      t.notifyNote = String(t.notifyNote || '');
      /* v127 子任务：只留「有标题的对象」，顺便补 id 和布尔 done。
         老数据没有这个字段，补成空数组，界面上不显示进度条。 */
      if (!Array.isArray(t.subtasks)) t.subtasks = [];
      t.subtasks = t.subtasks.filter(function (x) {
        return x && typeof x === 'object' && String(x.title || '').trim() !== '';
      }).map(function (x) {
        return {
          id: String(x.id || uid()),
          title: String(x.title).slice(0, 80),
          done: !!x.done
        };
      });
      /* 时间块：填了才在周视图里画真实色块，没填的落在「全天」行。
         时长按 15 分钟对齐，范围 15 分钟–12 小时；0 表示没设。 */
      t.startTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.startTime || '')) ? t.startTime : '';
      const tDur = Number(t.duration);
      t.duration = (isFinite(tDur) && tDur >= 15 && tDur <= 720) ? Math.round(tDur / 15) * 15 : 0;
    });
    if (Array.isArray(data.meds)) data.meds = data.meds.filter(m => m && typeof m === 'object');
    data.weights = Array.isArray(data.weights) ? data.weights.map(normalizeWeightRecord).filter(Boolean) : [];
    data.essays = Array.isArray(data.essays) ? data.essays.map(normalizeEssayRecord).filter(Boolean) : [];
    data.bodyProfile = normalizeBodyProfile(data.bodyProfile);
    if ((!data.bodyProfile.age || !data.bodyProfile.height) && data.weights.length) {
      const latestWeight = data.weights.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
      if (latestWeight && latestWeight.age && latestWeight.height) {
        data.bodyProfile = normalizeBodyProfile({ age: latestWeight.age, height: latestWeight.height });
      }
    }
    data.checks = normalizeChecks(data.checks, data.events);
    data.notes = isPlainObject(data.notes) ? data.notes : {};
    data.moods = normalizeMoods(data.moods);
    data.events = Array.isArray(data.events) ? data.events : [];
    data.cravings = normalizeCravings(data.cravings);
    data.skips = normalizeSkips(data.skips);
    data.packs = normalizePacks(data.packs);
    data.notices = normalizeNotices(data.notices);
    data.cardOrder = normalizeCardOrder(data.cardOrder);
    data.cardOrderAt = Math.max(0, Math.round(Number(data.cardOrderAt) || 0));
    data.money = normalizeMoney(data.money);
    data.moneyAt = Math.max(0, Math.round(Number(data.moneyAt) || 0));
    data.navOrder = normalizeNavOrder(data.navOrder);
    data.navOrderAt = Math.max(0, Math.round(Number(data.navOrderAt) || 0));
    data.countdowns = normalizeCountdowns(data.countdowns);
    data.doses = isPlainObject(data.doses) ? data.doses : {};
    migrateState(data);
    /* 四个常驻模块（v170）：放在 migrateState 之后、Object.assign(seedState) 之前，
       这样「老数据只有 habits」时能从锚点提取，而 seedState 的默认值不会覆盖用户的配置。 */
    ensureModules(data);
    return Object.assign(seedState(), data);
  }

  /* ---------- 状态迁移 ----------
     以前靠「某个字段存不存在」判断要不要迁移，字段一多就互相误判：
     补一个字段可能让另一处判断以为数据已经升级过。
     现在按 state.schemaVersion 顺序执行，每一步只跑一次。
     没有版本号的旧数据一律当作 v1，走完整链路，跑完打上当前版本。 */
  const SCHEMA_VERSION = 6;

  function migrateState(data) {
    if (!data || typeof data !== 'object') return data;
    let v = Number(data.schemaVersion) || 1;
    if (v < 2) {
      /* v1 → v2：早期字段整理（颜色、置顶、药品结构、戒烟习惯） */
      migrateColors(data);
      migratePinned(data);
      migrateMeds(data);
      migrateQuitHabit(data);
      v = 2;
    }
    if (v < 3) {
      /* v2 → v3：喝水改毫升制、补 478 呼吸法常驻习惯 */
      migrateWater(data);
      ensureBreathingHabit(data);
      v = 3;
    }
    if (v < 4) {
      /* v3 → v4：库存从「绝对数逐次扣减」改为「基线 + 按记录推算」
         （具体补齐在下面的 migrateStock 里，它是幂等的，每次加载都会跑） */
      v = 4;
    }
    if (v < 6) {
      /* v5 → v6：戒烟卡改成「一包 20 支」的视角，需要一包做锚点。
         老用户没有买烟记录，就按他的戒烟起点补一包（多数人这时候一包是满的）。 */
      migrateQuitPack(data);
      v = 6;
    }
    if (v < 5) {
      /* v4 → v5：戒烟从「每天记几次」改成事件流（抽了 / 忍住了）。
         老数据里 checks[日期][戒烟习惯id] = 那天抽了几次，

    migrateStock(data);

  async function cloudApi(action, body, query) {
    const hasBody = body !== undefined && body !== null;
    const headers = { Accept: 'application/json' };
    if (hasBody) {
      headers['Content-Type'] = 'application/json';
      if (cloud.csrf) headers['X-CSRF-Token'] = cloud.csrf;
    }
    let url = 'api.php?action=' + encodeURIComponent(action);
    if (query && typeof query === 'object') {
      Object.keys(query).forEach(k => {
        if (query[k] !== undefined && query[k] !== null && query[k] !== '') {
          url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(String(query[k]));
        }
      });
    }
    let res;
    try {
      res = await fetch(url, {
        method: hasBody ? 'POST' : 'GET',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: headers,
        body: hasBody ? JSON.stringify(body) : undefined
      });
    } catch (e) {
      const err = new Error('网络连接失败');
      err.status = 0;
      throw err;
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok || !data || data.ok === false) {
      const err = new Error((data && data.error) || ('请求失败（HTTP ' + res.status + '）'));
      err.status = res.status;
      err.data = data || {};
      throw err;
    }
    return data;
  }

    cloud.codeReady = !!me.code_ready;

      } else {

      }

      cloud.user = me.user;
      cloud.email = me.user.email;
      cloud.linked = true;
    } else {

    }

    return me;

      if (el.dataset.cls !== cls) {

  function cloudApplyRemote(data, rev, updatedAt, silent) {
    const repairNeeded = !!data && (!isPlainObject(data.checks) || !isPlainObject(data.moods) || !isPlainObject(data.doses) || !isPlainObject(data.notes));
    const next = normalizeState(data);
    if (!next) {
      cloud.error = '云端数据格式不正确';
      cloudRefreshUI();
      return false;
    }
    state = next;
    state.view = view;
    cloud.lastData = cloudDataKey();
    cloud.rev = Number(rev) || 0;
    cloud.updatedAt = Number(updatedAt) || 0;
    cloud.pending = false;
    cloud.conflict = null;
    cloud.error = '';

    cloud.ready = true;

    render();
    if (!silent) toast('已从云端加载');
    if (repairNeeded) {
      cloud.pending = true;
      updateSyncIndicator();
      setTimeout(() => { if (cloud.ready && cloud.user) cloudPush(false); }, 80);
    }
    return true;
  }

  async function cloudSyncFromServer(opts) {
    if (!cloud.available || !cloud.user || cloud.pulling) return;
    const manual = !!(opts && opts.manual);
    cloud.pulling = true;
    cloud.ready = false;
    cloud.lastPull = Date.now();
    try {
      const res = await cloudApi('load');
      const remote = res.data;
      const remoteRev = Number(res.rev) || 0;
      const remoteAt = Number(res.updated_at) || 0;
      cloud.updatedAt = remoteAt;

      if (remote) {
        if (!cloudApplyRemote(remote, remoteRev, remoteAt, !manual)) {
          cloud.ready = false;
          mode = 'landing';
          render();
          return;
        }
        clearLegacyState();
        return;
      }

      cloud.rev = 0;
      let legacy = null;
      if (cloud.migrateLegacy) legacy = loadLegacyState();
      if (legacy) {
        state = legacy;
        state.view = view;
        cloud.lastData = cloudDataKey();
        cloud.pending = true;
        const ok = await cloudPush(true, true);
        if (ok) {
          clearLegacyState();
          toast('旧本地数据已迁移到云端');
        } else {
          cloud.error = '旧本地数据还没上传成功，请检查网络后重新登录重试。';
          cloud.ready = false;
          mode = 'landing';
          render();
        }
        return;
      }

      state = normalizeState(state) || seedState();
      state.view = view;
      cloud.lastData = cloudDataKey();
      cloud.pending = true;
      const ok = await cloudPush(true, manual);
      if (!ok) {
        cloud.ready = false;
        mode = 'landing';
        render();
        return;
      }
      clearLegacyState();
    } catch (e) {
      cloud.ready = false;
      handleCloudError(e, manual);
      mode = 'landing';
      render();
    } finally {
      cloud.pulling = false;
      cloudRefreshUI();
    }
  }

  async function cloudPush(force, manual) {
    if (!cloud.user) return false;
    ensureStateMaps();
    if (cloud.pushing) {
      cloud.pushAgain = true;
      return false;
    }
    cloud.pushing = true;
    cloud.syncing = true;
    const seq = cloud.dirtySeq;
    const sentKey = cloudDataKey();
    cloudRefreshUI();
    try {
      const action = force ? 'force' : 'save';
      const body = force ? { data: state } : { base_rev: cloud.rev, data: state };
      const res = await cloudApi(action, body);
      cloud.rev = Number(res.rev) || (cloud.rev + 1);
      cloud.updatedAt = Number(res.updated_at) || Date.now();
      cloud.error = '';
      cloud.conflict = null;
      cloud.lastData = sentKey;
      cloud.ready = true;
      if (cloud.dirtySeq === seq) cloud.pending = false;
      persistCloudMeta();
      if (manual) toast('已保存到云端');
      return true;
    } catch (e) {
      // 乐观锁冲突：云端已有更新，自动合并后重存一次
      if (!force && e && e.status === 409 && e.data && e.data.remote && e.data.remote.data) {
        const remote = e.data.remote;
        const merged = normalizeState(mergeStates(remote.data, state));
        if (merged) {
          state = merged;
          state.view = view;
          cloud.rev = Number(remote.rev) || cloud.rev;
          cloud.lastData = cloudDataKey();
          try {
            const res2 = await cloudApi('save', { base_rev: cloud.rev, data: state });
            cloud.rev = Number(res2.rev) || (cloud.rev + 1);
            cloud.updatedAt = Number(res2.updated_at) || Date.now();
            cloud.error = '';
            cloud.conflict = null;
            cloud.lastData = cloudDataKey();
            cloud.ready = true;
            if (cloud.dirtySeq === seq) cloud.pending = false;
            persistCloudMeta();
            cloudRefreshUI();
            render();
            if (manual) toast('已合并云端更新并保存');
            return true;
          } catch (e2) {
            handleCloudError(e2, manual);
            return false;
          }
        }
      }
      handleCloudError(e, manual);
      return false;
    } finally {
      cloud.pushing = false;
      cloud.syncing = false;
      cloudRefreshUI();
      if (cloud.pushAgain) {
        cloud.pushAgain = false;
        setTimeout(() => { if (cloud.pending) cloudPush(false); }, 300);
      } else if (cloud.pending && cloud.dirtySeq !== seq) {
        setTimeout(() => { if (cloud.pending) cloudPush(false); }, 300);
      }
    }
  }

  /* v198：运动模块单独合并 —— 不再整块取新。
     整块取新的后果很实在：A 端删了一条记录，B 端改了点运动配置，
     最后合并成 B 的整块 → A 删的记录「复活」，A 新加的记录整块丢失。
     现在按 id 逐条比：
       · 运动实例（sports）：同 id 看 updatedAt，新的胜出；
       · 运动记录（records）：同 id 先看墓碑（谁删了就是删了），
         没有墓碑才看 updatedAt；只在一端出现的直接保留（谁新增都不丢）。
     运动实例本身还是真删（删实例是罕见操作），记录级才有墓碑。 */
  function mergeMoveModule(remote, local) {
    const r = isPlainObject(remote) ? remote : {};
    const l = isPlainObject(local) ? local : {};
    const ts = function (o) { return Date.parse(String((o || {}).updatedAt || '')) || 0; };
    /* 模块级配置字段：整体取较新的一侧 */
    const out = Object.assign({}, r, l);
    if (ts(r) > ts(l)) Object.assign(out, r);
    out.updatedAt = ts(l) > ts(r) ? (l.updatedAt || r.updatedAt || '') : (r.updatedAt || l.updatedAt || '');
    const byId = function (list) {
      const map = {};
      (Array.isArray(list) ? list : []).forEach(function (x) {
        if (x && x.id) map[x.id] = x;
      });
      return map;
    };
    const mergeList = function (rl, ll, isRecord) {
      const rm = byId(rl), lm = byId(ll);
      const ids = Object.keys(rm).concat(Object.keys(lm).filter(function (id) { return !rm[id]; }));
      const res = [];
      ids.forEach(function (id) {
        const x = rm[id], y = lm[id];
        if (!x) { res.push(y); return; }
        if (!y) { res.push(x); return; }
        if (isRecord && (x.deletedAt || y.deletedAt)) {
          /* 墓碑优先：任一端删了这条，合并后就该是删掉的 */
          const dx = Date.parse(String(x.deletedAt || '')) || 0;
          const dy = Date.parse(String(y.deletedAt || '')) || 0;
          const win = dx >= dy ? x : y;
          const newer = ts(y) > ts(x) ? y : x;
          res.push(Object.assign({}, win, {
            updatedAt: newer.updatedAt || win.updatedAt || '',
            deletedAt: win.deletedAt || ''
          }));
          return;
        }
        res.push(ts(y) > ts(x) ? y : x);
      });
      return res;
    };
    out.sports = mergeList(r.sports, l.sports, false);
    out.records = mergeList(r.records, l.records, true);
    return out;
  }

  function mergeStates(remote, local) {
    if (!remote || typeof remote !== 'object') return local;
    if (!local || typeof local !== 'object') return remote;
    const out = Object.assign({}, remote);

    // 数组类：按 id 并集合并（本地新增补入，云端为主；软删除字段取非空优先）
    ['habits', 'tasks', 'meds', 'weights', 'essays'].forEach(function (key) {
      const r = Array.isArray(remote[key]) ? remote[key] : [];
      const l = Array.isArray(local[key]) ? local[key] : [];
      const map = {};
      r.forEach(function (item) { if (item && item.id) map[item.id] = item; });
      l.forEach(function (item) {
        if (!item || !item.id) return;
        if (!map[item.id]) {
          map[item.id] = item;
          return;
        }
        const cur = map[item.id];
        if (!cur.archivedAt && item.archivedAt) cur.archivedAt = item.archivedAt;
        if (key === 'habits') {
          /* 小习惯 2.0：习惯也按 updatedAt 判新旧。老数据两边都是 0 时
             仍走「云端为主」，不因改规则而翻动历史。 */
          const hlu = Number(item.updatedAt) || 0;
          const hru = Number(cur.updatedAt) || 0;
          if (hlu > hru) {
            const keepArch = cur.archivedAt;
            Object.assign(cur, item);
            if (keepArch) cur.archivedAt = keepArch;
          }
          return;
        }
        if (key === 'meds') {
          /* 以前这里是「整条以云端为准」，结果本地刚改的名字、刚登记的库存都会被丢弃。
             现在按 updatedAt 判断谁更新：新的一侧整体胜出，归档标记只增不减，
             库存基线额外比一次登记时间（它可能来自另一个更晚的显式登记）。 */
          const lu = Number(item.updatedAt) || 0;
          const ru = Number(cur.updatedAt) || 0;
          const pickLocal = lu > ru;
          const newer = pickLocal ? item : cur;
          const older = pickLocal ? cur : item;
          const out2 = Object.assign({}, newer);
          if (!out2.archivedAt && older.archivedAt) out2.archivedAt = older.archivedAt;
          const nt = Date.parse(out2.stockBaseAt || '') || 0;
          const ot = Date.parse(older.stockBaseAt || '') || 0;
          if (older.stockBase !== undefined && ot > nt) {
            out2.stockBase = older.stockBase;
            out2.stockBaseAt = older.stockBaseAt;
            out2.stockReview = older.stockReview;
          }
          map[item.id] = out2;
        }
      });
      out[key] = Object.keys(map).map(function (k) { return map[k]; });
    });

    /* 打卡/用药：按天合并，但两者层级不同，必须分开处理——
       checks 是 {日期: {习惯id: 次数}}，次数取较大值；
       doses  是 {日期: {药品id: {时段: 记录}}}，要多走一层按时段并集。
       以前两者用同一段代码，doses 里 Number({}) 得到 NaN → 0，
       合并一次就会把当天整瓶药的服药记录压成 0（这是「用药数据突然没了」的元凶）。 */
    function mergeByDay(remoteMap, localMap) {
      const r = isPlainObject(remoteMap) ? remoteMap : {};
      const l = isPlainObject(localMap) ? localMap : {};
      const merged = Object.assign({}, r);
      Object.keys(l).forEach(function (day) {
        if (!isPlainObject(merged[day]) || !isPlainObject(l[day])) {
          if (!merged[day]) merged[day] = l[day];
          return;
        }
        const m = Object.assign({}, merged[day]);
        Object.keys(l[day]).forEach(function (k) {
          const lv = l[day][k];
          const rv = m[k];
          if (isPlainObject(lv)) {
            /* 时段级并集（doses）：两边都有的时段取本地那份，其余保留云端 */
            m[k] = Object.assign({}, isPlainObject(rv) ? rv : {}, lv);
          } else {
            /* 次数（checks）：只增不减 */
            m[k] = Math.max(Number(rv) || 0, Number(lv) || 0);
          }
        });
        merged[day] = m;
      });
      return merged;
    }
    out.checks = mergeByDay(remote.checks, local.checks);
    out.doses = mergeByDay(remote.doses, local.doses);
    /* 未完成标记是 0/1，逐键取大与 checks 同构，直接复用同一段 */
    out.skips = mergeByDay(remote.skips, local.skips);

    // 心情：按日期合并，本地优先（最后心情）
    out.moods = Object.assign({}, isPlainObject(remote.moods) ? remote.moods : {}, isPlainObject(local.moods) ? local.moods : {});

    // 随记
    out.notes = Object.assign({}, isPlainObject(remote.notes) ? remote.notes : {}, isPlainObject(local.notes) ? local.notes : {});

    /* 戒烟事件：按 id 去重并集。
       单独一段，不并进上面的 events——events 按 at|id|delta 判重，
       事件流没有 delta，套那个键会让同一秒的两条互相顶掉。 */
    const rCr = Array.isArray(remote.cravings) ? remote.cravings : [];
    const lCr = Array.isArray(local.cravings) ? local.cravings : [];
    const seenCr = {};
    rCr.forEach(function (e) { if (e && e.id) seenCr[e.id] = 1; });
    out.cravings = rCr.concat(lCr.filter(function (e) { return e && e.id && !seenCr[e.id]; }));
    out.cravings.sort(function (a, b) { return Number(a.t) - Number(b.t); });

    /* 买烟记录：按 id 去重并集。跟 cravings 一样单独一段——
       它有自己的时间轴（at），套 events 的判重键会互相顶掉。 */
    const rPk = Array.isArray(remote.packs) ? remote.packs : [];
    const lPk = Array.isArray(local.packs) ? local.packs : [];
    const seenPk = {};
    rPk.forEach(function (p) { if (p && p.id) seenPk[p.id] = 1; });
    out.packs = rPk.concat(lPk.filter(function (p) { return p && p.id && !seenPk[p.id]; }));
    /* cf（末支确认）是「设一次就不再变」的字段，远端那条可能是确认之前存的。
       所以只要本地有值、远端没有，就补回去——不然确认一次白确认。 */
    const lPkMap = {};
    lPk.forEach(function (p) { if (p && p.id) lPkMap[p.id] = p; });
    out.packs = out.packs.map(function (p) {
      const lp = lPkMap[p.id];
      if (lp && Number(lp.cf) && !Number(p.cf)) {
        return { id: p.id, at: p.at, name: p.name, price: p.price, size: p.size, cf: lp.cf };
      }
      return p;
    });
    /* at 主键 + id 次键：同一分钟买两包时，两端算出来的顺序必须完全一致，
       否则「哪包在抽」会两台设备各说各话。 */
    out.packs.sort(function (a, b) {
      return (Number(a.at) - Number(b.at)) || String(a.id).localeCompare(String(b.id));
    });

    /* 自定义通知：按 id 去重并集。跟 packs 一样的做法——
       代价是「只在一端删掉」会被另一端合并回来，所以删除走的是同一套规则，
       真要彻底删得在最后一台设备上删。 */
    const rNo = Array.isArray(remote.notices) ? remote.notices : [];
    const lNo = Array.isArray(local.notices) ? local.notices : [];
    const seenNo = {};
    rNo.forEach(function (n) { if (n && n.id) seenNo[n.id] = 1; });
    out.notices = rNo.concat(lNo.filter(function (n) { return n && n.id && !seenNo[n.id]; }));

    /* 倒数日：按 id 去重并集。合并后按日期排，跟 normalize 一致。 */
    const rCd = Array.isArray(remote.countdowns) ? remote.countdowns : [];
    const lCd = Array.isArray(local.countdowns) ? local.countdowns : [];
    const seenCd = {};
    rCd.forEach(function (n) { if (n && n.id) seenCd[n.id] = 1; });
    out.countdowns = rCd.concat(lCd.filter(function (n) { return n && n.id && !seenCd[n.id]; }));
    out.countdowns.sort(function (a, b) {
      return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
    });



    // 打卡日志：去重并集
    const rEv = Array.isArray(remote.events) ? remote.events : [];
    const lEv = Array.isArray(local.events) ? local.events : [];
    const seen = {};
    rEv.forEach(function (ev) { seen[String(ev.at) + '|' + String(ev.id) + '|' + String(ev.delta)] = true; });
    const extra = lEv.filter(function (ev) { return !seen[String(ev.at) + '|' + String(ev.id) + '|' + String(ev.delta)]; });
    out.events = rEv.concat(extra);

    /* 常驻卡顺序是「一整份偏好」，不能按 id 并集合并——两端各排一次，
       并集会拼出一个两边交错的顺序，谁看都不对。只比 cardOrderAt，
       新的那份整体覆盖；两边都是 0 就保持远端（即默认顺序）。 */
    const lOAt = Number(local.cardOrderAt) || 0;
    const rOAt = Number(remote.cardOrderAt) || 0;
    if (lOAt > rOAt) {
      out.cardOrder = Array.isArray(local.cardOrder) ? local.cardOrder.slice() : [];
      out.cardOrderAt = lOAt;
    }
    /* 清债：集合按 id 并集（同 packs / cravings），单值字段比 moneyAt 取新的。
       代价和别处一样：只在一端删掉的记录会被另一端合回来。 */
    const lM = local.money && typeof local.money === 'object' ? local.money : null;
    const rM = remote.money && typeof remote.money === 'object' ? remote.money : null;
    if (lM || rM) {
      const lm = lM || {}, rm = rM || {};
      const merged = Object.assign({}, rm, lm);
      ['debts', 'log', 'snowflakes', 'incomes', 'cats', 'spends'].forEach(function (k) {
        merged[k] = mergeById(Array.isArray(rm[k]) ? rm[k] : [], Array.isArray(lm[k]) ? lm[k] : []);
      });
      const lK = Number(local.moneyAt) || 0;
      const rK = Number(remote.moneyAt) || 0;
      /* 单值设置（加速钱 / 策略 / 起始月 / 提醒）只认更新的那一端 */
      if (rK > lK) {
        ['extra', 'strategy', 'customOrder', 'startYM', 'notify'].forEach(function (k) {
          if (rm[k] !== undefined) merged[k] = rm[k];
        });
      }
      out.money = merged;
      out.moneyAt = Math.max(lK, rK);
    }
    /* 常驻模块：**逐个模块**比 updatedAt 取新，不做整块覆盖。
       整块取新会让「A 端改喝水、B 端改运动」互相吃掉对方的改动。 */
    const lMods = (local.modules && typeof local.modules === 'object') ? local.modules : null;
    const rMods = (remote.modules && typeof remote.modules === 'object') ? remote.modules : null;
    if (lMods || rMods) {
      const lm2 = lMods || {}, rm2 = rMods || {};
      const mergedMods = {};
      MODULE_KEYS.forEach(function (k) {
        const a = rm2[k], b = lm2[k];
        if (!isPlainObject(a) && !isPlainObject(b)) return;
        if (!isPlainObject(a)) { mergedMods[k] = b; return; }
        if (!isPlainObject(b)) { mergedMods[k] = a; return; }
        /* v198：运动模块按 id 逐条合并（记录有墓碑，整块取新会丢数据） */
        if (k === 'move') { mergedMods[k] = mergeMoveModule(a, b); return; }
        const at = Date.parse(String(a.updatedAt || '')) || 0;
        const bt = Date.parse(String(b.updatedAt || '')) || 0;
        mergedMods[k] = bt > at ? b : a;
      });
      /* 不认识的模块键原样带过（与 repairBackup 的兜底思路一致） */
      [rm2, lm2].forEach(function (src) {
        Object.keys(src).forEach(function (k) {
          if (typeof mergedMods[k] === 'undefined') mergedMods[k] = src[k];
        });
      });
      out.modules = mergedMods;
      out.modulesAt = Math.max(Number(local.modulesAt) || 0, Number(remote.modulesAt) || 0);
      /* v209：modulePrefs（用药停用）—— 单值按 at 取较新的那份状态 */
      const lMp = isPlainObject(local.modulePrefs) ? local.modulePrefs.meds : null;
      const rMp = isPlainObject(remote.modulePrefs) ? remote.modulePrefs.meds : null;
      const lAt = lMp ? Number(lMp.at) || 0 : -1;
      const rAt = rMp ? Number(rMp.at) || 0 : -1;
      out.modulePrefs = { meds: (lAt >= rAt ? lMp : rMp) || { on: true, at: 0 } };
    }
    /* 导航顺序同理：整份覆盖，绝不按 key 并集（并集会拼出两端交错的顺序） */
    const lNAt = Number(local.navOrderAt) || 0;
    const rNAt = Number(remote.navOrderAt) || 0;
    if (lNAt > rNAt) {
      out.navOrder = Array.isArray(local.navOrder) ? local.navOrder.slice() : [];
      out.navOrderAt = lNAt;
    }

    // 身体档案
    out.bodyProfile = Object.assign({}, remote.bodyProfile || {}, local.bodyProfile || {});

    return out;
  }

  function handleCloudError(e, manual) {
    if (e && e.status === 401) {
      /* 后端会把「被其他设备顶替」和「会话过期」分开返回，提示要说清原因，
         否则用户只会看到莫名其妙被踢回登录页。 */
      const replaced = !!(e.data && e.data.code === 'session_replaced');
      cloud.user = null;
      cloud.csrf = '';
      cloud.error = replaced
        ? '这个账号已在其他设备登录，这台设备已退出（同一账号只允许一台设备在线）'
        : '登录已过期，请重新登录';
      cloud.ready = false;
      mode = 'landing';
      view = 'today';
      state.view = 'today';
      try { history.replaceState(null, '', '#today'); } catch (err) { /* file:// */ }
      persistCloudMeta();
      render();
      /* 被顶替时无论是否手动保存都要提示一次，否则数据看起来「突然没了」 */
      if (manual || replaced) toast(cloud.error);
      return;
    }
    if (e && e.status === 403) {
      cloud.error = '会话校验失败，请刷新页面后重试';
    } else {
      cloud.error = (e && e.message) ? e.message : '同步失败，请稍后重试';
    }
    cloud.pending = true;
    persistCloudMeta();
    cloudRefreshUI();
    if (manual) toast(cloud.error);
  }

  async function cloudInit(force) {
    if (!cloud.available) {
      mode = 'app';
      cloudProbing = false;
      return;
    }
    if (cloud.inited && !force) return;
    cloud.inited = true;
    cloud.error = '';
    cloudProbing = true;
    cloudRefreshUI();
    /* 先画骨架再等网络：否则启动瞬间会先闪一下空数据和落地页 */
    render();
    try {
      const me = await cloudFetchMe();
      if (me.user) {
        mode = 'app';
        await cloudSyncFromServer();
      } else {
        cloud.user = null;
        mode = 'landing';
      }
    } catch (e) {
      cloud.error = '暂时连不上服务器：' + (e.message || '未知错误');
      mode = 'landing';
    }
    cloudProbing = false;
    render();
  }

    if (m === 'invite') return { open: true, label: '用邀请码注册', hint: '' };
    return { open: false, label: '', hint: '' };
  }

  async function cloudDoForgot(form) {
    const email = (form.querySelector('[name="email"]').value || '').trim();
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (errEl) errEl.textContent = '';
    if (!email) {
      if (errEl) errEl.textContent = '请填邮箱';
      return;
    }
    if (btn) btn.disabled = true;
    try {
      await cloudApi('password_forgot', { email: email });
      /* 不管邮箱存不存在都说同一句，避免被拿来试探哪些账号存在 */
      openModal('' +
        '<div class="modal-card">' +
          '<h3>请查收邮件</h3>' +
          '<p class="hint" style="margin:0 0 14px">如果这个邮箱注册过，你会收到一封带重置链接的邮件。' +
          '没收到先看垃圾箱；同一邮箱 5 分钟内只能申请一次。</p>' +
          '<div class="modal-actions"><span class="spacer"></span>' +
            '<button type="button" class="btn primary" data-act="close-modal">知道了</button>' +
          '</div>' +
        '</div>');
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '发送失败';

      if (btn) btn.disabled = false;

  }

  async function cloudDoReset(form) {
    const token = form.getAttribute('data-token') || '';
    const pw = form.querySelector('[name="password"]').value || '';
    const pw2 = form.querySelector('[name="password_confirm"]').value || '';
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (errEl) errEl.textContent = '';
    if (pw.length < 8) {
      if (errEl) errEl.textContent = '新密码至少 8 位';
      return;
    }
    if (pw !== pw2) {
      if (errEl) errEl.textContent = '两次输入不一致';
      return;
    }
    if (btn) btn.disabled = true;
    try {
      await cloudApi('password_reset', { token: token, password: pw });
      closeModal();
      /* token 已经用过，从地址栏抹掉，避免刷新时再提交一次 */
      try {
        history.replaceState(null, '', location.pathname);
      } catch (e) {}
      toast('密码已重置，请用新密码登录');
      cloudLoginModal();
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '重置失败';
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  /* 邮件里的链接形如 /?reset=1&token=xxx，落地就弹设置新密码 */
  function checkResetToken() {
    try {
      const u = new URL(location.href);
      if (u.searchParams.get('reset') !== '1') return;
      const t = u.searchParams.get('token') || '';
      if (t.length < 32) return;
      setTimeout(function () { passwordResetModal(t); }, 500);
    } catch (e) {}
  }

  async function registerSendCode(btn) {
    const form = document.getElementById('cloud-register-form');
    if (!form) return;
    const emailEl = form.querySelector('[name="email"]');
    const errEl = form.querySelector('.cloud-error');
    const email = (emailEl ? emailEl.value : '').trim();
    if (errEl) errEl.textContent = '';
    if (!email) {
      if (errEl) errEl.textContent = '先填邮箱，再点发送';
      return;
    }
    const original = btn.textContent;
    btn.disabled = true;
    try {
      await cloudApi('register_code', { email: email });
      let left = 60;
      btn.textContent = left + ' 秒后重发';
      const timer = setInterval(function () {
        left--;
        if (left <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '重新发送';
        } else {
          btn.textContent = left + ' 秒后重发';
        }
      }, 1000);
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '发送失败';
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function cloudDoLogin(form) {
    const email = (form.querySelector('[name="email"]').value || '').trim();
    const password = form.querySelector('[name="password"]').value || '';
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (!email || !password) {
      if (errEl) errEl.textContent = '请填写邮箱和密码';
      return;
    }
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    try {
      await cloudFetchMe();
      const res = await cloudApi('login', { email: email, password: password });
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(res.user.id)) {
        resetLocalForAccount();
        cloud.migrateLegacy = false;
      } else {
        cloud.migrateLegacy = true;
      }
      cloud.owner = String(res.user.id);
      cloud.user = res.user;
      cloud.email = res.user.email;
      cloud.csrf = res.csrf || '';
      cloud.registrationOpen = !!res.registration_open;
      if (res.site_name) cloud.siteName = String(res.site_name);
      cloud.linked = true;
      cloud.ready = false;
      cloud.error = '';
      persistCloudMeta();
      mode = 'app';
      view = 'today';
      state.view = 'today';
      try { history.replaceState(null, '', '#today'); } catch (err) { /* file:// */ }
      closeModal();
      toast('已登录，正在同步…');
      render();
      await cloudSyncFromServer({ manual: true });
      if (view === 'settings') render();
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '登录失败';
      else toast(e.message || '登录失败');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function cloudDoRegister(form) {
    const display = (form.querySelector('[name="display_name"]').value || '').trim();
    const email = (form.querySelector('[name="email"]').value || '').trim();
    const password = form.querySelector('[name="password"]').value || '';
    const confirm = form.querySelector('[name="password_confirm"]').value || '';
    const mode = form.getAttribute('data-mode') || 'invite';
    const inviteEl = form.querySelector('[name="invite"]');
    const codeEl = form.querySelector('[name="code"]');
    const invite = inviteEl ? (inviteEl.value || '').trim().toUpperCase() : '';
    const code = codeEl ? (codeEl.value || '').trim() : '';
    const errEl = form.querySelector('.cloud-error');
    const btn = form.querySelector('[type="submit"]');
    if (!email || !password) {
      if (errEl) errEl.textContent = '请填写邮箱和密码';
      return;
    }
    if (mode === 'invite' && !invite) {
      if (errEl) errEl.textContent = '请填写邀请码';
      return;
    }
    if (mode === 'email' && !code) {
      if (errEl) errEl.textContent = '请填写邮箱验证码';
      return;
    }
    if (password.length < 8) {
      if (errEl) errEl.textContent = '密码至少 8 位';
      return;
    }
    if (password !== confirm) {
      if (errEl) errEl.textContent = '两次输入的密码不一致';
      return;
    }
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    try {
      await cloudFetchMe();
      const res = await cloudApi('register', {
        display_name: display,
        email: email,
        password: password,
        invite: invite,
        code: code
      });
      const prevOwner = cloud.owner;
      if (prevOwner && String(prevOwner) !== String(res.user.id)) {
        resetLocalForAccount();
      }
      state = seedState();
      cloud.migrateLegacy = false;
      cloud.owner = String(res.user.id);
      cloud.user = res.user;
      cloud.email = res.user.email;
      cloud.csrf = res.csrf || '';
      cloud.registrationOpen = true;
      cloud.linked = true;
      cloud.ready = false;
      cloud.error = '';
      persistCloudMeta();
      mode = 'app';
      view = 'today';
      state.view = 'today';
      try { history.replaceState(null, '', '#today'); } catch (err) { /* file:// */ }
      closeModal();
      toast('注册成功，正在同步…');
      render();
      await cloudSyncFromServer({ manual: true });
      if (view === 'settings') render();
    } catch (e) {
      if (errEl) errEl.textContent = e.message || '注册失败';
      else toast(e.message || '注册失败');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function cloudLogout() {
    icsUrl = undefined;   /* 换账号后订阅地址不能沿用 */
    pushCfg = undefined;  /* 同上，推送地址更不能沿用 */
    if (cloud.pending) await cloudPush(false, true);
    if (cloud.pending && !confirm('还有修改没有保存到云端。退出后这些修改会丢失，继续吗？')) return;
    try {
      if (cloud.user) await cloudApi('logout', {});
    } catch (e) {
      if (e.status !== 401) {
        toast('退出失败：' + e.message);
        return;
      }
    }
    cloud.user = null;
    cloud.csrf = '';
    cloud.rev = 0;
    cloud.updatedAt = 0;
    cloud.pending = false;
    cloud.conflict = null;
    cloud.error = '';
    cloud.migrateLegacy = false;
    cloud.ready = false;
    state = seedState();
    clearLegacyState();
    cloud.lastData = cloudDataKey();
    persistCloudMeta();
    mode = 'landing';
    view = 'today';
    closeModal();
    render();
    toast('已退出登录');
  }

  async function cloudDoSaveProfile(card) {
    const nameEl = card.querySelector('[name="display_name"]');
    const mailEl = card.querySelector('[name="email"]');
    const msg = card.querySelector('.profile-error');
    const btn = card.querySelector('[data-act="profile-save"]');
    const name = (nameEl ? nameEl.value : '').trim();
    const email = (mailEl ? mailEl.value : '').trim();
    if (msg) msg.textContent = '';
    if (!email) { if (msg) msg.textContent = '请填写邮箱'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { if (msg) msg.textContent = '邮箱格式不正确'; return; }
    if (Array.from(name).length > 40) { if (msg) msg.textContent = '名称最多 40 个字符'; return; }
    if (btn) btn.disabled = true;
    try {
      const res = await cloudApi('profile_save', { display_name: name, email: email });
      if (res && res.user) cloud.user = res.user;
      closeModal();
      toast('资料已保存');
      render();
    } catch (e) {
      if (msg) msg.textContent = e.message || '保存失败';
    } finally {
      if (btn) btn.disabled = false;
    }
  }
