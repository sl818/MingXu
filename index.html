  function repairBackup(data) {
    const usedIds = new Set();
    const fixId = (prefix, raw) => {
      let id = String(raw == null ? '' : raw);
      if (!id || usedIds.has(id)) id = prefix + uid();
      usedIds.add(id);
      return id;
    };
    const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
    const list = v => (Array.isArray(v) ? v : []).filter(x => x && typeof x === 'object');
    const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
    const dateStr = v => {
      const s = String(v || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
      return fmt(parseD(s)) === s ? s : '';
    };

    const habits = list(data.habits)
      .filter(h => String(h.name || '').trim())
      .map(h => {
        const id = fixId('h_', h.id);
        return Object.assign({}, h, {
          id: id,
          name: String(h.name).trim().slice(0, 20),
          icon: String(h.icon || '✅').slice(0, 4),
          type: h.type === 'quit' ? 'quit' : 'build',
          target: clamp(parseInt(h.target, 10) || 1, 1, 99),
          unit: String(h.unit || '次').slice(0, 4),
          color: /^#[0-9a-f]{6}$/i.test(String(h.color || '')) ? String(h.color) : '#2f6f5e',
          note: String(h.note || '').slice(0, 40),
          pinned: PINNED_IDS.indexOf(id) >= 0,
          med: id === 'h_med',
          archivedAt: h.archivedAt ? String(h.archivedAt) : (h.archived === true ? new Date().toISOString() : '')
        });
      });

    const tasks = list(data.tasks)
      .filter(t => String(t.title || '').trim())
      .map(t => Object.assign({}, t, {
        id: fixId('t_', t.id),
        title: String(t.title).trim().slice(0, 80),
        note: String(t.note || '').slice(0, 300),
        status: has(STATUS, t.status) ? t.status : 'todo',
        tag: has(TAGS, t.tag) ? t.tag : '其他',
        priority: has(PRIO, t.priority) ? t.priority : '中',
        due: dateStr(t.due),
        doneAt: dateStr(t.doneAt) || null,
        prevStatus: has(STATUS, t.prevStatus) ? t.prevStatus : '',
        repeat: ['daily', 'weekly', 'monthly'].indexOf(t.repeat) >= 0 ? t.repeat : 'none',
        repeatTime: /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t.repeatTime || '')) ? t.repeatTime : '20:00',
        repeatWeekday: (Number(t.repeatWeekday) >= 0 && Number(t.repeatWeekday) <= 6)
          ? Math.round(Number(t.repeatWeekday))
          : (dateStr(t.due) ? parseD(dateStr(t.due)).getDay() : 0),
        repeatDay: (Number(t.repeatDay) >= 1 && Number(t.repeatDay) <= 31)
          ? Math.round(Number(t.repeatDay))
          : (dateStr(t.due) ? parseD(dateStr(t.due)).getDate() : 1),
        repeatNextId: String(t.repeatNextId || ''),
        repeatFrom: String(t.repeatFrom || '')
      }));

    const meds = list(data.meds)
      .filter(m => String(m.name || '').trim())
      .map(m => Object.assign({}, m, {
        id: fixId('med_', m.id),
        name: String(m.name).trim().slice(0, 30)
      }));

    const weights = list(data.weights)
      .map(w => normalizeWeightRecord(w))
      .filter(Boolean)
      .map(w => Object.assign(w, { id: fixId('w_', w.id) }));

    const essays = list(data.essays)
      .map(e => normalizeEssayRecord(e))
      .filter(Boolean)
      .map(e => Object.assign(e, { id: fixId('e_', e.id) }));

    let bodyProfile = normalizeBodyProfile(data.bodyProfile);
    if ((!bodyProfile.age || !bodyProfile.height) && weights.length) {
      const latestWeight = weights.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
      if (latestWeight && latestWeight.age && latestWeight.height) {
        bodyProfile = normalizeBodyProfile({ age: latestWeight.age, height: latestWeight.height });
      }
    }

    const cleanChecks = normalizeChecks(data.checks, list(data.events));

    const cleanDoses = {};
    Object.keys(obj(data.doses)).forEach(d => {
      const day = data.doses[d];
      if (!dateStr(d) || !day || typeof day !== 'object' || Array.isArray(day)) return;
      const outDay = {};
      Object.keys(day).forEach(mid => {
        const slots = day[mid];
        if (!slots || typeof slots !== 'object' || Array.isArray(slots)) return;
        const outSlots = {};
        Object.keys(slots).forEach(slot => {
          const entry = slots[slot];
          if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(slot) && slot.indexOf('prn_') !== 0) return;
          if (entry && typeof entry === 'object' && !Array.isArray(entry)) outSlots[slot] = entry;
        });
        if (Object.keys(outSlots).length) outDay[mid] = outSlots;
      });
      if (Object.keys(outDay).length) cleanDoses[d] = outDay;
    });

    const cleanMoods = normalizeMoods(data.moods);

    return {
      version: 2,
      view: 'today',
      habits: habits,
      checks: cleanChecks,
      notes: obj(data.notes),
      moods: cleanMoods,
      events: list(data.events),
      meds: meds,
      doses: cleanDoses,
      tasks: tasks,
      bodyProfile: bodyProfile,
      weights: weights,
      essays: essays
    };
  }

  /* 从「导出备份 JSON」还原数据，让备份链条闭环。
     三条原则：
     1) 确认框必须让用户看到「要拿回什么」和「会失去什么」，不允许盲确认；
     2) 任一步失败都停手，绝不留半成品数据；
     3) 统一走 repairBackup 清洗，导入后的结构与主状态完全一致。 */
  function handleImport(e) {
    const input = e.target;
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;

    if (file.size > 20 * 1024 * 1024) {
      alert('导入失败：文件超过 20MB，不是本站导出的备份。');
      return;
    }

    const reader = new FileReader();
    reader.onerror = () => alert('导入失败：文件读取出错，请重新选择。');
    reader.onload = () => {
      let data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (err) {
        alert('导入失败：不是有效的 JSON 文件。');
        return;
      }
      if (!data || typeof data !== 'object' || Array.isArray(data) || (!Array.isArray(data.habits) && !Array.isArray(data.tasks))) {
        alert('导入失败：文件里没有习惯或待办数据，可能不是本站导出的备份。');
        return;
      }

      const n = v => (Array.isArray(v) ? v.length : 0);
      const summary = [
        '习惯 ' + n(data.habits) + ' 个',
        '待办 ' + n(data.tasks) + ' 条',
        '打卡 ' + Object.keys(data.checks || {}).length + ' 天',
        '药品 ' + n(data.meds) + ' 项',
        '体重 ' + n(data.weights) + ' 条',
        '随笔 ' + n(data.essays) + ' 篇'
      ].join(' · ');

      if (!confirm(
        '即将导入这份备份：\n' + summary + '\n\n' +
        '导入会整体替换当前的全部数据，之后无法撤销。\n' +
        '建议先点「导出备份 JSON」留一份当前数据。\n\n' +
        '确定继续吗？'
      )) return;

      try {
        migrateColors(data);
        const clean = repairBackup(data);
        migratePinned(clean);
        migrateMeds(clean);
        migrateQuitHabit(clean);
        ensureBreathingHabit(clean);
        state = clean;
        ensureStateMaps();
        if (Array.isArray(state.events) && state.events.length > 1000) state.events = state.events.slice(-1000);
        view = 'today';
        state.view = 'today';
        selectedDate = todayStr();
        save();
        render();
        toast('导入成功');
      } catch (err) {
        alert('导入失败：' + (err && err.message ? err.message : '未知错误'));
      }
    };
    reader.readAsText(file);
  }

  function csvCell(value) {
    let s = String(value == null ? '' : value);

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }

  function nextRepeatDate(date, repeat, weekday, day) {
    const base = /^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) ? parseD(date) : parseD(todayStr());
    if (repeat === 'weekly') {
      const target = clamp(Number.isFinite(Number(weekday)) ? Number(weekday) : base.getDay(), 0, 6);
      let d = addDays(base, 1);
      for (let i = 0; i < 7 && d.getDay() !== target; i++) d = addDays(d, 1);
      return fmt(d);
    }
    if (repeat === 'monthly') {
      const target = clamp(Number(day) || base.getDate(), 1, 31);
      const y = base.getFullYear();
      const m = base.getMonth() + 1;
      const last = new Date(y, m + 1, 0).getDate();
      return fmt(new Date(y, m, Math.min(target, last)));
    }
    return fmt(addDays(base, 1));
  }

  function completeRecurringTask(t, date) {
    if (!t || ['daily', 'weekly', 'monthly'].indexOf(t.repeat) < 0) return null;
    if (t.repeatNextId) {
      const existing = state.tasks.find(x => x.id === t.repeatNextId);
      if (existing) return existing;
    }
    const base = /^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) ? date : (t.doneAt || todayStr());
    const dueBase = t.due && t.due > base ? t.due : base;
    const dueDate = parseD(dueBase);
    const repeatWeekday = Number.isFinite(Number(t.repeatWeekday)) ? clamp(Number(t.repeatWeekday), 0, 6) : dueDate.getDay();
    const repeatDay = Number.isFinite(Number(t.repeatDay)) ? clamp(Number(t.repeatDay), 1, 31) : dueDate.getDate();
    const next = {
      id: uid(),
      title: t.title,
      note: t.note || '',
      tag: t.tag || '其他',
      priority: t.priority || '中',
      status: 'todo',
      due: nextRepeatDate(dueBase, t.repeat, repeatWeekday, repeatDay),
      repeat: t.repeat,
      repeatTime: t.repeatTime || '20:00',
      repeatWeekday: repeatWeekday,
      repeatDay: repeatDay,
      repeatFrom: t.id,
      repeatNextId: '',
      createdAt: new Date().toISOString(),
      doneAt: null,
      prevStatus: ''
    };
    t.repeatNextId = next.id;
    state.tasks.unshift(next);
    return next;
  }

  function uncompleteRecurringTask(t) {
    if (!t) return;
    let nextId = t.repeatNextId;
    if (!nextId) {
      const generated = state.tasks.find(x => x.repeatFrom === t.id);
      nextId = generated ? generated.id : '';
    }
    if (!nextId) return;
    const next = state.tasks.find(x => x.id === nextId);
    if (!next) { t.repeatNextId = ''; return; }
    if (next.status === 'done') return;
    state.tasks = state.tasks.filter(x => x.id !== next.id);
    t.repeatNextId = '';
  }

  const ACTIONS = {
    'date-shift': el => {
      const next = fmt(addDays(parseD(selectedDate), Number(el.dataset.delta) || 0));
      selectedDate = next > todayStr() ? todayStr() : next;
      render();
    },
    'date-today': () => { selectedDate = todayStr(); render(); },
    'pick-week-day': el => {
      if (el.dataset.date > todayStr()) return;
      selectedDate = el.dataset.date;
      render();
    },
    'set-mood': el => {
      if (!state.moods) state.moods = {};
      const m = el.dataset.mood;
      if (!m) return;
      if (state.moods[selectedDate] === m) delete state.moods[selectedDate];
      else state.moods[selectedDate] = m;
      save();
      render();
    },
    'cal-today': () => {
      const n = new Date();
      calMonth = new Date(n.getFullYear(), n.getMonth(), 1);
      render();
    },
    'set-stats-range': el => {
      const r = Number(el.dataset.range) || 30;
      if ([7, 30, 90].indexOf(r) < 0) return;
      statsRange = r;
      render();
    },
    'pick-day': el => {
      if (el.dataset.date > todayStr()) return;
      selectedDate = el.dataset.date;
      view = 'today';
      state.view = 'today';
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    'month-shift': el => {
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (Number(el.dataset.delta) || 0), 1);
      render();
    },
    'habit-inc': el => {
      const h = currentHabit(el.dataset.id);
      if (!h) return;
      const c = countOf(selectedDate, h.id);
      logHabit(h.id, 1);
      setCount(selectedDate, h.id, c + 1);
      if (h.type === 'quit') toast('已记录一次，明天重新开始');
      else if (c + 1 === Math.max(1, Number(h.target) || 1)) toast('完成：' + h.name + ' 🎉');
      render();
    },
    'habit-dec': el => {
      const id = el.dataset.id;
      const c = countOf(selectedDate, id);
      if (c <= 0) return;
      logHabit(id, -1);
      setCount(selectedDate, id, c - 1);
      render();
    },
    'habit-set': el => {
      const id = el.dataset.id;
      const v = Number(el.dataset.val) || 0;
      const delta = v - countOf(selectedDate, id);
      if (delta) logHabit(id, delta);
      setCount(selectedDate, id, v);
      render();
    },
    'task-toggle': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      if (t.status === 'done') {
        t.status = t.prevStatus || 'todo';
        t.prevStatus = '';
        t.doneAt = null;
        uncompleteRecurringTask(t);
      } else {
        t.prevStatus = t.status;
        t.status = 'done';
        t.doneAt = el.dataset.date || todayStr();
        const next = completeRecurringTask(t, t.doneAt);
        toast(next ? '完成 ✓ 下一次已生成' : '完成 ✓');
      }
      save();
      render();
    },
    'task-move': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      const dir = Number(el.dataset.dir) || 0;
      if (t.status === 'cancelled') {
        t.status = 'todo';
        t.doneAt = null;
        save();
        render();
        return;
      }
      const idx = FLOW.indexOf(t.status);
      if (idx < 0) return;
      const next = FLOW[clamp(idx + dir, 0, FLOW.length - 1)];
      if (next === t.status) return;
      const wasDone = t.status === 'done';
      if (next === 'done') t.prevStatus = t.status;
      t.status = next;
      t.doneAt = next === 'done' ? todayStr() : null;
      if (next === 'done' && !wasDone) completeRecurringTask(t, t.doneAt);
      if (next !== 'done' && wasDone) uncompleteRecurringTask(t);
      save();
      render();
    },
    'task-restore': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      t.status = 'todo';
      t.doneAt = null;
      save();
      render();
      toast('已恢复为待办');
    },
    'med-new': () => medFormModal(null),
    'med-edit': el => {
      const m = medById(el.dataset.id);
      if (m) medFormModal(m);
    },
    'med-toggle': el => {
      const m = medById(el.dataset.id);
      if (!m) return;
      m.status = m.status === 'active' ? 'paused' : 'active';
      save();
      render();
      toast(m.status === 'active' ? '已恢复用药' : '已暂停用药');
    },
    'med-del': el => {
      const m = medById(el.dataset.id);
      if (!m) return;
      if (!confirm('删除用药「' + m.name + '」？相关记录也会一起删除。')) return;
      state.meds = (state.meds || []).filter(x => x.id !== m.id);
      Object.keys(state.doses || {}).forEach(d => {
        if (state.doses[d] && state.doses[d][m.id]) {
          delete state.doses[d][m.id];
          if (!Object.keys(state.doses[d]).length) delete state.doses[d];
        }
      });
      save();
      render();
      toast('用药已删除');
    },
    'med-open': () => openModal(medSheetHtml(selectedDate)),
    'med-card-prev': () => { medCardIdx -= 1; render(); },
    'med-card-next': () => { medCardIdx += 1; render(); },
    'med-card-pick': el => { medCardIdx = Number(el.dataset.idx) || 0; render(); },
    'quick-add': () => quickAddModal(),
    'med-next': () => {
      const nx = medNextDose(selectedDate);
      if (!nx) {
        openModal(medSheetHtml(selectedDate));
        return;
      }
      takeDose(selectedDate, nx.med.id, nx.slot);
      render();
      toast('已记录 ' + nx.med.name + ' ' + nx.slot);
    },
    'med-take': el => {
      if (!takeDose(selectedDate, el.dataset.id, el.dataset.slot)) return;
      render();
      refreshMedSheet();
      toast('已记录');
    },
    'med-undo': el => {
      if (!undoDose(selectedDate, el.dataset.id, el.dataset.slot)) return;
      render();
      refreshMedSheet();
      toast('已撤销');
    },
    'med-prn': el => {
      if (!takeDose(selectedDate, el.dataset.id, 'prn_' + Date.now())) return;
      render();
      refreshMedSheet();
      toast('已记录一次');
    },
    'med-prn-undo': el => {
      const keys = prnKeys(selectedDate, el.dataset.id).sort();
      if (!keys.length) return;
      undoDose(selectedDate, el.dataset.id, keys[keys.length - 1]);
      render();
      refreshMedSheet();
      toast('已撤销');
    },
    'task-new': el => {
      taskModal(null, el.dataset.status || 'todo');
    },
    'set-weight-range': el => {
      weightRange = Number(el.dataset.range) || 0;
      render();
    },
    'stats-log-toggle': () => {
      statsLogOpen = !statsLogOpen;
      render();
    },
    'board-filter-day': el => {
      const d = el.dataset.day || '';
      boardFilterDay = boardFilterDay === d ? '' : d;
      render();
    },
    'board-filter-clear': () => {
      boardFilterDay = '';
      render();
    },
    'board-focus': el => {
      const id = el.dataset.id;
      const t = state.tasks.find(x => x.id === id);
      if (!t) return;
      if (boardFilterDay && t.due !== boardFilterDay) {
        boardFilterDay = '';
        render();
      }
      requestAnimationFrame(() => {
        const card = document.querySelector('.task[data-id="' + id + '"]');
        if (!card) return;
        card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        card.classList.add('is-focus');
        setTimeout(() => card.classList.remove('is-focus'), 1600);
      });
    },
    'task-edit': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (t) taskModal(t);
    },
    'task-del': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      if (!confirm('删除任务「' + t.title + '」？')) return;
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      save();
      closeModal();
      render();
      toast('任务已删除');
    },
    'archive-open': () => archiveModal(),
    'task-archive': el => archiveTask(el.dataset.id),
    'task-unarchive': el => unarchiveTask(el.dataset.id),
    'task-archive-del': el => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) return;
      if (!confirm('永久删除「' + t.title + '」？删除后无法恢复。')) return;
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      save();
      render();
      archiveModal();
      toast('已永久删除');
    },
    'archive-clear': () => {
      const n = archivedTasks().length;
      if (!n) return;
      if (!confirm('永久删除全部 ' + n + ' 条归档任务？删除后无法恢复。')) return;
      state.tasks = state.tasks.filter(t => !t.archivedAt);
      save();
      render();
      archiveModal();
      toast('已清空归档');
    },
    'clear-done': () => {
      const n = state.tasks.filter(t => t.status === 'done').length;
      if (!n) return;
      if (!confirm('清理 ' + n + ' 条已完成任务？')) return;
      state.tasks = state.tasks.filter(t => t.status !== 'done');
      save();
      render();
      toast('已清理');
    },
    'habit-new': () => habitModal(null),
    'breathing-start': () => {
      if ($('#breathing-modal')) breathingStart();
      else openBreathingModal();
    },
    'habit-edit': el => {
      const h = currentHabit(el.dataset.id);
      if (h) habitModal(h);
    },
    'habit-archive': el => {
      const h = currentHabit(el.dataset.id);
      if (!h) return;
      if (isPinned(h)) {
        toast('常驻习惯不能归档');
        return;
      }
      h.archivedAt = new Date().toISOString();
      save();
      render();
      toast('已归档，历史打卡保留');
    },
    'habit-restore': el => {
      const h = currentHabit(el.dataset.id);
      if (!h) return;
      h.archivedAt = '';
      save();
      render();
      toast('已恢复习惯');
    },
    'habit-del': el => {
      const h = currentHabit(el.dataset.id);
      if (!h) return;
      if (isPinned(h)) {
        toast('常驻习惯不能删除，可以在设置里修改目标');
        return;
      }
      if (!confirm('删除习惯「' + h.name + '」？相关的打卡记录也会一起删除。')) return;
      state.habits = state.habits.filter(x => x.id !== h.id);
      Object.keys(state.checks).forEach(d => {
        if (state.checks[d]) {
          delete state.checks[d][h.id];
          if (Object.keys(state.checks[d]).length === 0) delete state.checks[d];
        }
      });
      save();
      render();
      toast('习惯已删除');
    },
    'weight-new': () => weightModal(null),
    'profile-edit': () => profileModal(),
    'weight-edit': el => {
      const w = (state.weights || []).find(x => x.id === el.dataset.id);
      if (w) weightModal(w);
    },
    'weight-del': el => {
      const w = (state.weights || []).find(x => x.id === el.dataset.id);
      if (!w) return;
      if (!confirm('删除 ' + w.date + ' 的体重记录？')) return;
      state.weights = (state.weights || []).filter(x => x.id !== w.id);
      save();
      closeModal();
      render();
      toast('体重记录已删除');
    },
    'essay-new': () => essayModal(null),
    'essay-tag-filter': el => {
      essayTag = el.dataset.tag || '';
      render();
    },
    'essay-edit': el => {
      const e = (state.essays || []).find(x => x.id === el.dataset.id);
      if (e) essayModal(e);
    },
    'essay-del': el => {
      const e = (state.essays || []).find(x => x.id === el.dataset.id);
      if (!e) return;
      if (!confirm('删除这篇随笔？')) return;
      state.essays = (state.essays || []).filter(x => x.id !== e.id);
      save();
      closeModal();
      render();
      toast('随笔已删除');
    },
    'export-json': () => {
      if (cloud.user && !cloud.ready) { toast('云端数据还没加载完成，请稍候'); return; }
      const stamp = todayStr().replace(/-/g, '');
      download('晚风Todo备份-' + stamp + '.json', JSON.stringify(state, null, 2));
      toast('备份已导出');
    },
    'import-json': () => {
      if (cloud.user && !cloud.ready) { toast('云端数据还没加载完成，请稍候'); return; }
      const input = document.getElementById('import-file');
      if (!input) { toast('导入组件未就绪，请刷新页面'); return; }
      input.click();
    },
    'history-open': () => historyModal(),
    'history-preview': el => historyPreviewModal(el.dataset.id),
    'history-restore': el => restoreHistory(el.dataset.id),
    'export-csv': () => {
      if (cloud.user && !cloud.ready) { toast('云端数据还没加载完成，请稍候'); return; }
      ensureStateMaps();
      const rows = [['日期', '类型', '名称', '数值', '单位', '标签', '详情']];
      Object.keys(state.checks || {}).sort().forEach(d => {
        const day = state.checks[d] || {};
        state.habits.forEach(h => {
          const c = Number(day[h.id]) || 0;
          if (c > 0) rows.push([d, '习惯', h.name, String(c), h.unit || '次', h.archivedAt ? '已归档' : '', '']);
        });
      });
      Object.keys(state.doses || {}).sort().forEach(d => {
        const day = state.doses[d] || {};
        Object.keys(day).forEach(medId => {
          const med = medById(medId);
          Object.keys(day[medId] || {}).forEach(slot => {
            rows.push([d, '用药', med ? med.name : '已删除药物', '1', '次', '', slot.indexOf('prn_') === 0 ? '按需' : slot]);
          });
        });
      });
      (state.weights || []).forEach(w => {
        rows.push([w.date, '体重', '体重', String(w.weight), 'kg', '', 'BMI ' + w.bmi]);
      });
      Object.keys(state.moods || {}).sort().forEach(d => {
        const info = MOOD_MAP[state.moods[d]];
        if (info) rows.push([d, '心情', info.label, '1', '', '', '']);
      });
      (state.essays || []).forEach(e => {
        rows.push([e.date, '随笔', e.title || '无标题', String(String(e.text || '').replace(/\s/g, '').length), '字', (e.tags || []).join(' / '), e.text || '']);
      });
      const body = rows.slice(1).sort((a, b) => a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]) || a[2].localeCompare(b[2]));
      const csv = '\ufeff' + [rows[0]].concat(body).map(r => r.map(csvCell).join(',')).join('\r\n');
      download('晚风Todo-CSV-' + todayStr().replace(/-/g, '') + '.csv', csv, 'text/csv;charset=utf-8');
      toast('CSV 已导出');
    },
    'reset': () => {
      if (!confirm('确定清空所有任务、习惯、用药、体重和随笔记录吗？此操作不可撤销。')) return;
      const fresh = seedState();
      fresh.tasks = [];
      fresh.checks = {};
      state = fresh;
      view = 'today';
      selectedDate = todayStr();
      save();
      render();
      toast('已重置');
    },
    'theme': () => {
      themeMode = theme === 'dark' ? 'light' : 'dark';
      theme = themeMode;
      try { localStorage.setItem(THEME_MODE_KEY, themeMode); localStorage.removeItem('lifeboard.theme'); } catch (e) {}
      render();
    },
    'set-mode': el => {
      const m = el.dataset.mode;
      themeMode = (m === 'light' || m === 'dark') ? m : 'auto';
      theme = themeMode === 'auto' ? autoTheme() : themeMode;
      try { localStorage.setItem(THEME_MODE_KEY, themeMode); localStorage.removeItem('lifeboard.theme'); } catch (e) {}
      render();
    },
    'set-skin': el => {
      const next = el.dataset.skin;
      if (!SKINS.some(s => s.key === next)) return;
      skin = next;
      try { localStorage.setItem(SKIN_KEY, skin); } catch (e) {}
      render();
      const found = SKINS.find(s => s.key === skin);
      toast('主题：' + (found ? found.name : skin));
    },
    'set-layout': el => {
      const next = el.dataset.layout;
      layout = (next === 'side' || next === 'wide') ? next : 'top';
      document.documentElement.setAttribute('data-layout', layout);
      try { localStorage.setItem(LAYOUT_KEY, layout); } catch (e) {}
      render();
      toast('排版：' + (layout === 'top' ? '顶部导航条' : (layout === 'side' ? '左侧导航条' : '三区布局')));
    },
    'sync-dismiss': () => {
      syncDismissed = true;
      updateSyncIndicator();
    },
    'cloud-login': () => cloudLoginModal(),
    'cloud-register': () => cloudRegisterModal(),
    'forgot-password': () => forgotPasswordModal(),
    'cloud-account': () => cloudAccountModal(),
    'cloud-logout': () => cloudLogout(),
    'cloud-sync': () => cloudManualSync(),
    'cloud-retry': () => cloudInit(true),
    'admin-panel': () => openAdminPanel(),
    'admin-reset': el => adminResetModal(el.dataset.id, el.dataset.email),
    'admin-toggle': el => adminToggleUser(el.dataset.id, el.dataset.status),
    'help': () => helpModal(),
    'close-modal': () => closeModal()
  };

  /* ============================================================
     事件绑定
     ============================================================ */
  document.addEventListener('click', e => {
    const navEl = e.target.closest('[data-nav]');
    if (navEl) {
      const next = navEl.dataset.nav;
      if (next !== view) {
        view = next;
        state.view = next;
        save();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) {
      e.preventDefault();
      fn(el, e);
    }
  });

  document.addEventListener('submit', e => {
    const form = e.target;
    if (form.id === 'task-form') {
      e.preventDefault();
      saveTaskForm(form);
    } else if (form.id === 'habit-form') {
      e.preventDefault();
      saveHabitForm(form);
    } else if (form.id === 'med-form') {
      e.preventDefault();
      saveMedForm(form);
    } else if (form.id === 'body-profile-form') {
      e.preventDefault();
      saveBodyProfileForm(form);
    } else if (form.id === 'weight-form') {
      e.preventDefault();
      saveWeightForm(form);
    } else if (form.id === 'essay-form') {
      e.preventDefault();
      saveEssayForm(form);
    } else if (form.id === 'cloud-login-form') {
      e.preventDefault();
      cloudDoLogin(form);
    } else if (form.id === 'cloud-register-form') {
      e.preventDefault();
      cloudDoRegister(form);
    } else if (form.id === 'cloud-account-form') {
      e.preventDefault();
      cloudDoChangePassword(form);
    } else if (form.id === 'admin-reset-form') {
      e.preventDefault();
      adminDoReset(form);
    } else if (form.id === 'admin-settings-form') {
      e.preventDefault();
      adminSaveSettings(form);
    } else if (form.id === 'quick-form') {
      e.preventDefault();
      const input = form.querySelector('[name="title"]');
      const title = input ? input.value.trim() : '';
      if (!title) return;
      state.tasks.unshift({
        id: uid(), title: title, note: '', tag: '生活', priority: '中',
        status: 'todo', due: selectedDate, createdAt: new Date().toISOString(), doneAt: null
      });
      save();
      render();
      const again = $('#quick-form [name="title"]');
      if (again) again.focus();
      toast('已添加到待办');
    }
  }, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#modal-root').children.length) closeModal();
  });

  const importFile = document.getElementById('import-file');
  if (importFile) importFile.addEventListener('change', handleImport);

  window.addEventListener('online', () => {
    if (cloud.pending && cloud.user && !cloud.pushing) cloudPush(false);
    else if (!cloud.user && cloud.error) cloudInit(true);
  });
  window.addEventListener('beforeunload', e => {
    if (cloud.user && cloud.pending) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  window.addEventListener('focus', () => {
    if (mode === 'landing' && !cloud.user) cloudInit(true);
    else cloudMaybePull();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      flushPendingSave();
      return;
    }
    if (document.visibilityState === 'visible') {
      refreshAutoTheme();
      if (mode === 'landing' && !cloud.user) cloudInit(true);
      else cloudMaybePull();
    }
  });
  window.addEventListener('pagehide', flushPendingSave);
  setInterval(() => {
    if (cloud.pending && cloud.user && !cloud.pushing && !cloud.conflict) cloudPush();
  }, 45000);
  setInterval(refreshAutoTheme, 60000);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }

  /* ============================================================
     启动
     ============================================================ */
  if (!VIEWS[view]) {
    view = 'today';
    state.view = 'today';
  }
  render();
  cloudInit();
})();
</script>
</body>
</html>
